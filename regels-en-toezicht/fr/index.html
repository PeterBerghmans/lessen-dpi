<!DOCTYPE html>
<html lang="fr" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 1 · Comment naissent les règles et qui en surveille l'application</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

</style>
</head>
<body>

 retour sur chaque question vous aidera.", "retry": "Recommencer les exercices", "review": "Revoir la présentation", "your_answer": "Votre réponse", "footer": "Module 1 · Comment naissent les règles et qui en surveille l'application", "open_link": "Ouvrir le lien dans un nouvel onglet", "practice_hint": "Exercice pratique : mettez en pause, suivez les étapes, puis cliquez sur Suivant.", "back_to_slides": "Retour aux diapositives", "resume_quiz": "Reprendre les exercices", "download_pdf": "Télécharger votre résultat en PDF", "pdf_title": "Résultat des exercices", "pdf_question": "Question", "pdf_your": "Votre réponse", "pdf_correct": "Réponse correcte", "pdf_feedback": "Retour", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "sans réponse", "transcript": "Texte parlé", "show_text": "Afficher le texte", "hide_text": "Masquer le texte", "ai_notice_title": "Transparence sur l'IA", "ai_notice": "La voix de ce module a été générée par IA à partir de la voix de Peter Berghmans, avec son consentement. Le texte et les diapositives ont été réalisés avec l'aide de l'IA et relus sur le fond par le formateur.", "ai_voice_label": "Voix IA", "ai_icon_alt": "Label officiel de l'UE : contenu généré par IA", "ai_footer": "Voix générée par IA (avec le consentement de l'orateur) ; texte et diapositives réalisés avec l'aide de l'IA et relus par le formateur.", "skip_to_quiz": "Aller directement aux exercices", "nav_home": "Accueil", "nav_slides": "Présentation", "nav_quiz": "Exercices", "speed": "Vitesse", "autoplay_short": "Auto"}, "slides": [{"id": 1, "type": "title", "title": "Comment naissent les règles et qui en surveille l'application", "subtitle": "De la directive européenne à l'autorité de contrôle belge", "script": "Bienvenue dans ce premier module. Pendant le quart d'heure qui vient, nous verrons comment les règles sont élaborées et qui veille ensuite à leur respect. Nous le ferons à deux niveaux : le niveau européen et le niveau national. Et nous suivrons un seul fil conducteur : le General Data Protection Regulation, en abrégé le GDPR, en français le règlement général sur la protection des données, le RGPD. Non pas parce que la protection des données serait le seul domaine concerné, bien au contraire, mais parce que le RGPD montre très concrètement comment une règle européenne est adoptée, comment un État membre y ajoute encore quelque chose, et comment les autorités de contrôle et les juges lui donnent ensuite son sens. À la fin du module, dix questions vous permettront de vérifier si vous maîtrisez les principes."}, {"id": 2, "type": "bullets", "chip": "Deux instruments", "title": "L'Europe légifère par directive ou par règlement", "bullets": [{"k": "Règlement", "t": "s'applique directement et de la même manière dans chaque État membre, sans transposition en droit national."}, {"k": "Directive", "t": "impose un résultat à atteindre ; chaque État membre la transpose dans sa propre législation et choisit la forme et les moyens."}, {"k": "Qui décide", "t": "la Commission européenne propose ; le Parlement européen et le Conseil de l'Union européenne adoptent ensemble."}], "script": "Commençons par les deux instruments principaux avec lesquels l'Union européenne édicte des règles : le règlement et la directive. Le règlement est la forme la plus directe. Dès qu'il est applicable, il vaut dans chaque État membre, directement, et avec exactement le même texte. Un citoyen ou une entreprise en Belgique peut s'en prévaloir immédiatement. La directive fonctionne autrement. Elle impose aux États membres un résultat, mais leur laisse le choix de la manière d'y parvenir. Chaque État membre doit donc transposer la directive dans sa propre législation, dans un délai déterminé. La manière dont ces deux instruments sont adoptés est généralement la même : la Commission européenne fait une proposition, et le Parlement européen ainsi que le Conseil de l'Union européenne, où siègent les gouvernements des États membres, doivent tous deux l'approuver."}, {"id": 3, "type": "compare", "chip": "La différence", "title": "Le règlement est uniforme, la directive laisse une marge à l'État membre", "left": {"head": "Règlement", "items": ["Un seul texte pour toute l'Union", "Directement applicable à partir de sa date d'application", "Loi nationale uniquement pour l'organisation pratique et là où le règlement laisse une marge", "Exemple : le RGPD, règlement 2016/679"]}, "right": {"head": "Directive", "items": ["Objectif contraignant, chemin libre", "Transposition en droit national dans un délai", "Des différences entre États membres sont possibles", "Exemple : la directive 95/46, l'ancêtre du RGPD"]}, "script": "Pourquoi cette différence est-elle importante ? Avec un règlement, le même texte vaut partout. C'est une source de sécurité juridique : une entreprise active dans cinq États membres ne connaît qu'une seule règle. Le législateur national ne peut plus régler que des aspects pratiques, par exemple quelle autorité exerce le contrôle, et ne peut ajouter ses propres règles que sur les points où le règlement l'autorise expressément. Avec une directive, l'objectif est contraignant, mais pas le chemin pour y arriver. Chaque État membre écrit sa propre loi, et ces lois peuvent donc différer entre elles. C'est précisément pour cette raison que la législation sur la protection des données est passée en 2016 d'une directive à un règlement. L'ancienne directive de 1995 avait été transposée de manière chaque fois un peu différente dans les divers États membres. Avec le RGPD, l'Europe a choisi un texte unique et uniforme. Retenez donc : le règlement est uniforme, la directive laisse une marge."}, {"id": 4, "type": "bullets", "chip": "Couche nationale", "title": "Même avec un règlement, il reste du travail pour le législateur national", "bullets": [{"k": "Avec une directive", "t": "la loi nationale est la véritable règle : elle donne à la directive une mise en œuvre concrète."}, {"k": "Avec un règlement", "t": "la loi nationale exécute : elle désigne l'autorité de contrôle et règle les procédures."}, {"k": "Clauses d'ouverture", "t": "le RGPD autorise des choix nationaux sur certains points, par exemple l'âge à partir duquel un mineur peut consentir lui-même (article 8)."}, {"k": "Belgique", "t": "la loi du 3 décembre 2017 crée l'Autorité de protection des données ; la loi du 30 juillet 2018 complète le RGPD et fixe l'âge à 13 ans."}], "script": "À côté des règles européennes, il y a donc toujours des règles nationales, mais leur rôle diffère. Avec une directive, la loi nationale est la véritable règle que les citoyens et les entreprises doivent respecter ; elle donne à la directive une mise en œuvre concrète. Avec un règlement, la loi nationale fait deux choses. D'abord, elle exécute le règlement dans l'État membre : elle désigne qui exerce le contrôle et comment se déroulent les procédures. Ensuite, elle peut faire ses propres choix sur les points où le règlement l'autorise, ce que l'on appelle les clauses d'ouverture. Le RGPD en compte des dizaines. Un exemple connu est l'article 8 : un mineur peut consentir lui-même au traitement de ses données par des services en ligne à partir de seize ans, mais un État membre peut abaisser cet âge jusqu'à treize ans. En Belgique, il s'agit de deux lois : la loi du 3 décembre 2017, qui crée l'Autorité de protection des données, et la loi du 30 juillet 2018, aussi appelée loi-cadre, qui complète le RGPD et fixe l'âge du consentement à treize ans."}, {"id": 5, "type": "bullets", "chip": "Anatomie d'un texte de loi", "title": "Une réglementation ne se limite pas à ses articles", "bullets": [{"k": "Les articles", "t": "la partie contraignante : les droits, les obligations, les interdictions et les sanctions se trouvent ici et nulle part ailleurs."}, {"k": "Les considérants", "t": "la motivation en tête du texte ; ils expliquent pourquoi et comment les articles sont conçus. Le RGPD en compte 173."}, {"k": "Travaux préparatoires", "t": "proposition de la Commission, avis, amendements et rapports parlementaires qui documentent l'élaboration."}, {"k": "Exemple", "t": "l'article 4, point 1 définit la donnée à caractère personnel ; le considérant 26 explique comment vérifier si une personne est identifiable."}], "script": "Regardons maintenant le texte de loi lui-même. Quand vous ouvrez un règlement européen, vous voyez trois couches. D'abord les articles. C'est la partie contraignante : seuls les articles contiennent les droits, les obligations, les interdictions et les sanctions. Avant les articles se trouvent les considérants, en anglais les recitals. Ce sont des paragraphes numérotés qui expliquent pourquoi la règle existe et comment le législateur a conçu les articles. Le RGPD en compte 173. Et il y a en outre les travaux préparatoires : la proposition initiale de la Commission, les avis des autres institutions, les amendements du Parlement et les rapports des négociations. Un exemple concret : l'article 4, point 1 du RGPD définit ce qu'est une donnée à caractère personnel. Mais comment vérifier si une personne est identifiable, avec quels moyens et à quel coût, cela se lit dans le considérant 26."}, {"id": "5b", "type": "practice", "chip": "Exercice pratique", "title": "Regardez vous-même dans le RGPD : le considérant 26 face à l'article 4", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "url_label": "Ouvrir le RGPD sur EUR-Lex", "intro": "Mettez la présentation en pause et suivez les étapes. Prenez deux minutes.", "steps": ["Ouvrez le lien. Vous voyez en haut le titre « Règlement (UE) 2016/679 » et, en dessous, les considérants numérotés, chacun entre parenthèses : (1), (2), etc.", "Cherchez le considérant (26) avec Ctrl+F ou Cmd+F et lisez-le. Il explique quand une personne est « identifiable » : il faut tenir compte de tous les moyens raisonnablement susceptibles d'être utilisés, en considérant le coût et le temps.", "Descendez jusqu'à « Article 4 — Définitions » et lisez le point 1, la définition de la donnée à caractère personnel. Remarquez comme elle est courte et générale : pas un mot sur le coût, le temps ou les moyens.", "Comparez les deux : le considérant 26 dit comment lire l'article 4, mais seul l'article 4 est la règle contraignante.", "Pour finir : descendez jusqu'à l'article 83 et cherchez les montants des amendes. Ils figurent dans un article, pas dans un considérant, et sont donc exécutoires."], "script": "Mettez la présentation en pause un instant et ouvrez le texte de loi via le bouton à l'écran. Vous arrivez sur EUR-Lex, le site officiel de publication de l'Union européenne. Suivez les étapes de la diapositive et soyez surtout attentif à la différence de ton entre un considérant et un article. Prenez tranquillement deux minutes."}, {"id": 6, "type": "bullets", "chip": "Valeur et usage", "title": "Seuls les articles obligent ; les considérants guident l'interprétation", "bullets": [{"k": "Règle", "t": "un considérant n'a pas de force contraignante et ne peut jamais déroger à ce que dit un article. C'est une jurisprudence constante de la Cour de justice de l'Union européenne."}, {"k": "Utilité", "t": "face à un article peu clair, l'autorité de contrôle et le juge se tournent vers les considérants pour retrouver l'intention."}, {"k": "Pratique", "t": "lisez toujours d'abord l'article, puis le considérant qui s'y rapporte, et seulement en cas de doute les travaux préparatoires."}, {"k": "Piège", "t": "citer un considérant comme s'il s'agissait d'une obligation ; la partie adverse fera remarquer à juste titre qu'aucun article ne le soutient."}], "script": "Quelle est alors la valeur de ces considérants par rapport aux articles ? La règle est claire et la Cour de justice de l'Union européenne la répète depuis des décennies : un considérant n'a pas de force contraignante. On ne peut en tirer ni droit ni obligation, et il ne peut jamais déroger à ce que dit un article. Mais cela ne rend pas les considérants inutiles, au contraire. Dès qu'un article est peu clair, et cela arrive souvent, les autorités de contrôle et les juges se tournent vers les considérants pour retrouver l'intention du législateur. En pratique, vous lisez donc toujours d'abord l'article, puis le considérant qui s'y rapporte, et seulement si ce n'est toujours pas clair, les travaux préparatoires. Le piège classique consiste à citer un considérant comme s'il s'agissait d'une obligation. Celui qui le fait s'entend répondre à juste titre par la partie adverse qu'aucun article ne le soutient."}, {"id": "6b", "type": "practice", "chip": "Exercice pratique", "title": "Une définition et son considérant : le consentement", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "url_label": "Ouvrir le RGPD sur EUR-Lex", "intro": "Lisez d'abord la définition, puis le considérant. Prenez deux à trois minutes.", "steps": ["Allez à l'article 4 et lisez le point 11, la définition du consentement. Notez les quatre caractéristiques : libre, spécifique, éclairé et univoque, donné par une déclaration ou par un acte positif clair.", "Cherchez maintenant le considérant (32) et lisez-le en entier.", "Qu'ajoute le considérant ? Des exemples concrets d'acte positif (cocher une case, choisir un paramètre technique) et, plus important encore, ce qui n'est pas un consentement : le silence, les cases cochées par défaut et l'inactivité.", "Réfléchissez : la définition de l'article est la règle contraignante, mais celui qui ne lit que l'article ne sait pas encore si une case cochée par défaut suffit. Cette réponse vient du considérant."], "script": "Encore un court exercice. Rouvrez le texte de loi et lisez d'abord une définition de l'article 4, puis le considérant qui s'y rapporte. Soyez attentif à ce que dit la définition, et à ce que vous n'apprenez que par le considérant. Prenez deux à trois minutes."}, {"id": 7, "type": "timeline", "chip": "Fil conducteur : le RGPD", "title": "Le RGPD est passé d'une directive de 1995 à un règlement en 2016", "steps": [{"y": "1992", "t": "Belgique : loi vie privée du 8 décembre 1992, avant même les règles européennes"}, {"y": "1995", "t": "Directive 95/46 : chaque État membre doit adopter ou adapter sa propre loi"}, {"y": "2012", "t": "La Commission propose un règlement face à une mosaïque de lois nationales"}, {"y": "2016", "t": "Règlement 2016/679 adopté le 27 avril"}, {"y": "2018", "t": "Applicable depuis le 25 mai ; loi-cadre belge du 30 juillet"}], "script": "Regardez maintenant l'histoire du RGPD, car elle illustre tout ce que nous venons de voir. En 1995, l'Europe a adopté la directive 95/46 sur la protection des données à caractère personnel. En tant que directive, elle devait être transposée par chaque État membre. La Belgique avait déjà une loi vie privée du 8 décembre 1992 et l'a adaptée à la directive. Le résultat, vingt ans plus tard, était une mosaïque de vingt-huit lois nationales qui différaient sur des points importants. C'est pourquoi la Commission a proposé un règlement en 2012. Après quatre ans de négociations, le RGPD a été adopté le 27 avril 2016. Il a bénéficié d'une période transitoire de deux ans et est applicable depuis le 25 mai 2018. La Belgique l'a complété par la loi-cadre du 30 juillet 2018. De la directive au règlement, donc : de la liberté pour les États membres à un texte unique et uniforme."}, {"id": 8, "type": "bullets", "chip": "Contrôle", "title": "Le contrôle classique est exercé par les tribunaux, nationaux et européen", "bullets": [{"k": "Juge national", "t": "applique la règle européenne dans des litiges concrets ; il est le premier à appliquer le droit de l'Union."}, {"k": "Cour de justice de l'Union européenne", "t": "veille à une interprétation uniforme ; elle se prononce sur le sens d'une règle européenne, pas sur les faits de l'affaire."}, {"k": "Question préjudicielle", "t": "un juge national qui doute de l'interprétation soumet la question à la Cour ; la réponse lie tous les États membres."}, {"k": "Protection des données", "t": "le RGPD y ajoute une couche supplémentaire obligatoire : une autorité de contrôle indépendante par État membre."}], "script": "Faire des règles est une chose, en surveiller l'application en est une autre. Le contrôle classique est exercé par les tribunaux. En premier lieu par le juge national : il applique les règles européennes dans des litiges concrets et il est donc le premier à appliquer le droit de l'Union. Au-dessus se trouve la Cour de justice de l'Union européenne, à Luxembourg. Cette Cour ne se prononce pas sur les faits d'une affaire, mais sur le sens d'une règle européenne. Lorsqu'un juge national doute de l'interprétation d'une disposition européenne, il suspend l'affaire et pose sa question à la Cour. La réponse ne lie pas seulement ce juge, mais tous les juges et toutes les autorités de l'Union."}, {"id": 9, "type": "bullets", "chip": "Autorités de contrôle en Belgique", "title": "La Belgique a une autorité nationale et quelques autorités particulières", "bullets": [{"k": "Autorité de protection des données (APD)", "t": "l'autorité de contrôle nationale, créée par la loi du 3 décembre 2017 ; elle représente la Belgique au sein du Comité européen de la protection des données."}, {"k": "Organe de contrôle de l'information policière (COC)", "t": "autorité de contrôle pour le traitement des données par les services de police."}, {"k": "Commission flamande de contrôle (VTC)", "t": "autorité de contrôle pour les institutions flamandes."}, {"k": "Comité européen de la protection des données (CEPD / EDPB)", "t": "organe européen où siègent toutes les autorités de contrôle nationales ; il assure une application uniforme par des lignes directrices. Il n'est pas lui-même une autorité de contrôle et n'inflige pas d'amendes."}], "script": "À quoi cela ressemble-t-il en Belgique ? L'autorité de contrôle nationale est l'Autorité de protection des données, l'APD. C'est elle qui représente la Belgique au sein du Comité européen de la protection des données. Mais l'APD n'est pas seule. Pour le traitement des données par les services de police, par exemple, il existe en Belgique une autorité de contrôle distincte, l'Organe de contrôle de l'information policière, le COC. Et comme la Belgique est un État fédéral, la Flandre a utilisé la possibilité de créer sa propre autorité de contrôle pour les institutions flamandes : la Vlaamse Toezichtcommissie, la Commission flamande de contrôle. Je voudrais encore expliquer brièvement ce qu'est le Comité européen de la protection des données, en anglais l'European Data Protection Board, en abrégé l'EDPB. C'est l'organe européen où siègent ensemble les présidents de toutes les autorités de contrôle nationales, avec le Contrôleur européen de la protection des données. L'EDPB n'est pas un tribunal. Il assure une application uniforme du RGPD : il publie notamment des lignes directrices, des textes clairs, souvent illustrés d'exemples, qui expliquent certains sujets. Ces textes sont le fruit d'une concertation entre les autorités de contrôle nationales des États membres. Attention : l'EDPB n'est pas une autorité de contrôle comme les autorités nationales ou régionales, et il n'infligera donc pas d'amende à une entreprise ou à une administration, par exemple."}, {"id": "9b", "type": "practice", "chip": "Exercice pratique", "title": "Consultez des lignes directrices de l'EDPB", "url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201903_video_devices_fr.pdf", "url_label": "Ouvrir les lignes directrices (pdf)", "intro": "Le lien ouvre un fichier pdf ; dans certains navigateurs, il est téléchargé. Ouvrez-le et suivez les étapes.", "steps": ["Cliquez sur le bouton. Vous obtenez un fichier pdf de l'EDPB : les Lignes directrices 3/2019 sur le traitement des données à caractère personnel par des dispositifs vidéo, version 2.0, adoptée après une consultation publique. Si le fichier est téléchargé, ouvrez-le depuis votre dossier de téléchargements.", "Allez aux points 12 et 13, dans le chapitre sur l'exemption pour les activités personnelles ou domestiques. Le point 12 cite l'arrêt Ryneš de la Cour de justice : une caméra fixée à une habitation privée qui filme aussi l'espace public, même partiellement, ne relève pas de cette exemption. Le point 13 énumère les éléments à prendre en compte, notamment si la caméra filme aussi un espace public ou le terrain des voisins.", "Lisez aussi le point 14 avec les exemples : le touriste qui filme ses vacances, la vététiste avec une caméra d'action, le jardin privé clôturé. De tels exemples concrets ne se trouvent nulle part dans le texte de loi.", "Observez la numérotation des points. Les autorités de contrôle et les avocats renvoient à ces numéros, tout comme aux considérants et aux articles.", "Retenez : ce n'est pas une loi. Mais l'APD, comme toute autre autorité de contrôle en Europe, évaluera votre vidéosurveillance à l'aune de ces lignes directrices."], "script": "Place à un troisième court exercice. Ouvrez, via le bouton à l'écran, les lignes directrices de l'European Data Protection Board sur la vidéosurveillance. Il s'agit d'un fichier pdf, que certains navigateurs téléchargent directement. Allez aux points indiqués sur la diapositive et lisez-les tranquillement."}, {"id": 10, "type": "bullets", "chip": "Sanctions", "title": "Une autorité de contrôle est un organe de sanction administratif doté d'un large arsenal", "bullets": [{"k": "Rappel à l'ordre", "t": "un constat formel que les règles ont été enfreintes, sans amende ; la sanction la plus légère, mais une décision officielle qui compte en cas de récidive (article 58, paragraphe 2, b)."}, {"k": "Injonction et interdiction", "t": "l'autorité de contrôle peut ordonner d'adapter le traitement ou de le suspendre, temporairement ou définitivement."}, {"k": "Amende", "t": "jusqu'à 20 millions d'euros ou 4 pour cent du chiffre d'affaires annuel mondial."}, {"k": "Administratif, pas judiciaire", "t": "la décision émane d'un organe administratif ; en Belgique, c'est la Chambre contentieuse de l'APD qui décide."}], "script": "Que peut faire une autorité de contrôle nationale ou régionale ? Il est important de comprendre que l'APD n'est pas un tribunal, mais un organe de sanction administratif. Elle prend ses décisions en tant qu'administration, et en Belgique c'est la Chambre contentieuse de l'APD qui s'en charge. La sanction la plus légère est le rappel à l'ordre. Un rappel à l'ordre est un constat formel que les règles ont été enfreintes, sans amende. Ne le sous-estimez pas : c'est une décision officielle, souvent publiée, qui pèse si l'organisation commet plus tard une nouvelle infraction. L'autorité de contrôle peut aussi ordonner d'adapter le traitement, ou le suspendre temporairement ou définitivement. Et il y a bien sûr les amendes : jusqu'à vingt millions d'euros, ou quatre pour cent du chiffre d'affaires annuel mondial."}, {"id": 11, "type": "chain", "chip": "La chaîne", "title": "De la plainte à la Cour de justice : voici la chaîne de contrôle belge", "steps": [{"k": "Plainte ou enquête", "t": "auprès de l'APD"}, {"k": "Chambre contentieuse", "t": "décide et inflige éventuellement une sanction"}, {"k": "Cour des marchés", "t": "recours dans les 30 jours devant la cour d'appel de Bruxelles"}, {"k": "Cour de justice de l'Union européenne", "t": "question préjudicielle si l'interprétation du RGPD est incertaine"}, {"k": "Retour à Bruxelles", "t": "la Cour des marchés statue avec la réponse de la Cour"}], "note": "Exemple : l'affaire Proximus (C-129/21, arrêt du 27 octobre 2022) a parcouru exactement cette chaîne.", "script": "Et maintenant la chaîne que vous devez pouvoir expliquer. Tout commence par la plainte d'un citoyen, ou par une enquête que l'APD ouvre elle-même. La Chambre contentieuse de l'APD traite l'affaire et prend une décision, éventuellement assortie d'une sanction. Comme l'APD est un organe administratif, il faut pouvoir contester cette décision devant un juge. C'est ce que garantit l'article 78 du RGPD. En Belgique, ce juge est la Cour des marchés, une section de la cour d'appel de Bruxelles. Si la Cour des marchés doute de l'interprétation du RGPD, elle pose une question préjudicielle à la Cour de justice de l'Union européenne. La Cour répond, et avec cette réponse la Cour des marchés rend sa décision finale. Ce n'est pas de la théorie. Prenez l'affaire Proximus. Un abonné avait demandé à ne plus figurer dans les annuaires téléphoniques, mais ses données sont réapparues. Il a porté plainte auprès de l'APD, la Chambre contentieuse a infligé à Proximus une amende de vingt mille euros, Proximus a introduit un recours devant la Cour des marchés, et la Cour des marchés a posé des questions à la Cour de justice. Elle lui a demandé notamment si un abonné doit donner son consentement pour figurer dans un annuaire, si sa demande d'en être retiré est une demande d'effacement, et si Proximus doit aussi transmettre ce retrait aux autres annuaires et aux moteurs de recherche comme Google. La Cour a répondu le 27 octobre 2022. La chaîne va donc de Bruxelles à Luxembourg et retour."}, {"id": "11b", "type": "practice", "chip": "Exercice pratique", "title": "Cherchez l'arrêt sur le site de la Cour de justice", "url": "https://curia.europa.eu/juris/liste.jsf?num=C-129/21&language=fr", "url_label": "Ouvrir InfoCuria (curia.europa.eu)", "intro": "Cherchez l'arrêt Proximus, affaire C-129/21, et regardez surtout sa structure. Prenez trois minutes.", "steps": ["Ouvrez le lien. Vous arrivez sur InfoCuria, le moteur de recherche de la Cour, avec les résultats pour l'affaire C-129/21. Si cela ne fonctionne pas, tapez C-129/21 dans le champ « Numéro de l'affaire » et choisissez le français.", "Ouvrez l'arrêt du 27 octobre 2022. En haut, vous lisez le titre de l'affaire : Proximus contre Autorité de protection des données, et la juridiction de renvoi : la cour d'appel de Bruxelles, Cour des marchés.", "Cherchez la rubrique « Le litige au principal et les questions préjudicielles ». Vous y trouvez l'histoire de l'abonné et les quatre questions de la Cour des marchés : notamment si un abonné doit consentir pour figurer dans un annuaire, si sa demande d'en être retiré est une demande d'effacement, et si Proximus doit aussi transmettre ce retrait aux autres annuaires et aux moteurs de recherche. Reconnaissez la chaîne de la diapositive 11 : plainte, Chambre contentieuse, recours, question préjudicielle.", "Remarquez que la Cour ne dit pas si Proximus doit payer l'amende. C'est la Cour des marchés qui en décide elle-même, avec la réponse de la Cour en main. La Cour interprète, le juge national tranche."], "script": "Un dernier exercice. Ouvrez le site de la Cour de justice via le bouton à l'écran et cherchez l'arrêt Proximus avec le numéro d'affaire C-129/21. Ne regardez pas le contenu, mais la structure de l'arrêt : qui demande quoi à qui, et où se trouve la réponse. Prenez trois minutes."}, {"id": 12, "type": "bullets", "chip": "Interprétation", "title": "Ce sont les autorités de contrôle et les juges qui donnent son vrai sens à la règle", "bullets": [{"k": "Pourquoi", "t": "le texte d'un règlement est général ; ce qu'il signifie dans un cas concret ne ressort que des décisions et des arrêts."}, {"k": "Breyer (C-582/14, 2016)", "t": "une adresse IP dynamique est une donnée à caractère personnel pour celui qui peut raisonnablement identifier la personne via un tiers, comme le fournisseur d'accès."}, {"k": "Nowak (C-434/16, 2017)", "t": "les réponses d'un candidat à un examen, et même les annotations de l'examinateur, sont des données à caractère personnel de ce candidat."}], "script": "Pourquoi accordons-nous tant d'attention aux autorités de contrôle et aux juges ? Parce que le texte d'un règlement est général. Ce qu'une notion signifie dans un cas concret ne ressort que des décisions et des arrêts. Prenez la notion la plus fondamentale du RGPD : la donnée à caractère personnel. Dans l'arrêt Breyer de 2016, la Cour a jugé qu'une adresse IP dynamique est une donnée à caractère personnel pour l'exploitant d'un site web, parce qu'il peut raisonnablement faire identifier la personne via le fournisseur d'accès à internet. Dans l'arrêt Nowak de 2017, la Cour a décidé que les réponses d'un candidat à un examen sont des données à caractère personnel, et même les annotations de l'examinateur. Aucune de ces réponses ne figure littéralement à l'article 4. Elles sont le résultat d'une interprétation, et cette interprétation est aussi contraignante que le texte."}, {"id": 13, "type": "bullets", "chip": "Vue plus large", "title": "On retrouve le même schéma dans l'AI Act, le Data Act et d'autres cadres", "bullets": [{"k": "AI Act", "t": "règlement 2024/1689 : directement applicable, mise en application par étapes ; contrôle par les autorités nationales de surveillance du marché et un Bureau européen de l'IA auprès de la Commission."}, {"k": "Data Act", "t": "règlement 2023/2854 : applicable depuis le 12 septembre 2025 ; chaque État membre désigne des autorités compétentes."}, {"k": "NIS2", "t": "directive 2022/2555 sur la cybersécurité : à transposer par chaque État membre ; la Belgique l'a fait par la loi du 26 avril 2024."}, {"k": "Mêmes questions", "t": "directive ou règlement ? Quelle couche nationale ? Qui contrôle, et qui interprète ?"}], "script": "Pour terminer, élargissons le regard, car ce schéma n'est pas propre à la protection des données. Regardez l'AI Act. C'est un règlement, donc directement applicable, avec une entrée en application par étapes. Le contrôle est exercé par des autorités nationales de surveillance du marché que chaque État membre désigne, et au niveau européen par un Bureau de l'IA au sein de la Commission. Le Data Act, sur l'accès aux données des produits connectés, est applicable depuis le 12 septembre 2025, et là aussi chaque État membre doit désigner des autorités compétentes. Et NIS2, sur la cybersécurité, est au contraire une directive, que la Belgique a transposée par la loi du 26 avril 2024. Devant chaque nouveau cadre, posez-vous donc les mêmes quatre questions : est-ce une directive ou un règlement ? Quelle couche nationale s'y ajoute ? Qui exerce le contrôle ? Et qui, en fin de compte, donne l'interprétation ?"}, {"id": 14, "type": "summary", "chip": "À retenir", "title": "Ce que vous emportez de ce module", "key": "Une règle européenne prend son sens en trois étapes : le texte, la couche nationale et l'interprétation par les autorités de contrôle et les juges.", "bullets": [{"k": "Distinguez", "t": "le règlement est uniforme et direct, la directive doit être transposée."}, {"k": "Lisez", "t": "d'abord l'article, puis le considérant ; seul l'article oblige."}, {"k": "Connaissez la chaîne", "t": "APD, Cour des marchés, Cour de justice de l'Union européenne, et l'EDPB pour l'application uniforme."}, {"k": "Cherchez la jurisprudence", "t": "ce qu'une notion signifie se trouve dans les arrêts et les décisions, pas seulement dans le texte."}], "script": "Que retenir de ce module ? Une phrase clé : une règle européenne prend son sens en trois étapes. D'abord le texte, puis la couche nationale, et enfin l'interprétation par les autorités de contrôle et les juges. Concrètement : distinguez le règlement, qui est uniforme et direct, de la directive, qui doit être transposée. Lisez toujours d'abord l'article et seulement ensuite le considérant, car seul l'article oblige. Connaissez la chaîne en Belgique : l'Autorité de protection des données, la Cour des marchés et la Cour de justice de l'Union européenne, avec l'European Data Protection Board comme gardien de l'application uniforme. Et cherchez la jurisprudence, car ce qu'une notion signifie vraiment se trouve dans les arrêts et les décisions. Prêt ? Vous pouvez maintenant tester vos connaissances avec dix questions."}], "quiz": [{"q": "Quelle est la principale différence entre un règlement et une directive européens ?", "options": ["Un règlement s'applique directement dans chaque État membre ; une directive doit d'abord être transposée.", "Un règlement est adopté par la Commission seule ; une directive l'est aussi par le Parlement et le Conseil.", "Un règlement ne s'applique qu'aux administrations ; une directive s'applique aussi aux entreprises et aux citoyens.", "Une directive lie les États membres ; un règlement n'est qu'une recommandation sans force contraignante."], "answer": 0, "feedback": ["C'est exactement la distinction de l'article 288 TFUE : un règlement s'applique de manière uniforme et directe, une directive impose un résultat que l'État membre doit lui-même couler dans sa législation.", "Les deux instruments suivent la même procédure : proposition de la Commission, adoption par le Parlement européen et le Conseil. La différence tient à leur fonctionnement, pas à qui les adopte.", "Les deux instruments peuvent lier aussi bien les administrations que les entreprises et les citoyens. La différence tient à la transposition, pas aux destinataires.", "Les deux sont contraignants. La recommandation est un instrument distinct, sans force contraignante. La différence entre règlement et directive tient à la transposition."]}, {"q": "Pourquoi l'Europe a-t-elle fait passer en 2016 les règles de protection des données d'une directive à un règlement ?", "options": ["Parce qu'une directive ne lie que l'administration et que l'on voulait désormais lier aussi directement les entreprises.", "Parce que la transposition de la directive différait d'un État membre à l'autre et que l'on voulait un texte uniforme.", "Parce que la Cour de justice de l'Union européenne avait invalidé la directive de 1995 pour contrariété aux traités.", "Parce qu'un règlement n'exige pas d'autorités de contrôle nationales et limite ainsi les coûts pour les États membres."], "answer": 1, "feedback": ["La directive 95/46 s'appliquait aussi aux entreprises, via les lois nationales de transposition. La raison était la mosaïque de lois nationales différentes.", "Vingt-huit lois nationales présentant des différences n'offraient pas de sécurité juridique à ceux qui étaient actifs dans plusieurs États membres. Un règlement donne un seul texte pour toute l'Union.", "La directive n'a jamais été invalidée ; elle a été abrogée par le RGPD lui-même. La raison était la fragmentation des transpositions nationales.", "Au contraire, le RGPD oblige chaque État membre, à l'article 51, à instituer au moins une autorité de contrôle indépendante."]}, {"q": "Le RGPD est un règlement. Quel rôle joue encore le législateur belge ?", "options": ["Aucun : un règlement est complet et ne laisse plus aucune place à une législation nationale.", "Il doit reprendre l'intégralité du texte du RGPD dans une loi belge, sinon celui-ci ne s'applique pas en Belgique.", "Il désigne l'autorité de contrôle, règle les procédures et fait des choix là où le RGPD l'autorise expressément.", "Il peut adapter le RGPD au contexte belge partout où il l'estime lui-même nécessaire ou souhaitable."], "answer": 2, "feedback": ["Même avec un règlement, il reste du travail : quelqu'un doit désigner l'autorité de contrôle et régler les procédures. La Belgique l'a fait par les lois du 3 décembre 2017 et du 30 juillet 2018.", "Un règlement s'applique directement ; le reprendre dans une loi nationale n'est pas nécessaire et n'est même pas permis, car cela perturberait son application uniforme.", "La loi nationale exécute et complète là où le RGPD l'autorise, par exemple l'âge du consentement de l'article 8, que la Belgique a fixé à 13 ans.", "Le législateur national ne peut faire ses propres choix que sur les points où le règlement l'autorise expressément, les clauses d'ouverture. Une adaptation libre n'est pas possible."]}, {"q": "Quelle est la valeur juridique d'un considérant dans un règlement européen ?", "options": ["Un considérant est aussi contraignant qu'un article et peut compléter un article par des obligations supplémentaires.", "Un considérant n'a d'importance que pendant les négociations et n'a ensuite plus aucune valeur.", "Un considérant ne lie que les États membres et leurs administrations, pas les citoyens ni les entreprises.", "Un considérant n'est pas contraignant, mais il aide à interpréter correctement l'intention d'un article."], "answer": 3, "feedback": ["La Cour de justice de l'Union européenne répète constamment qu'un considérant n'a pas de force contraignante et ne peut ni déroger à un article ni y ajouter quelque chose.", "Les considérants font partie du texte publié et sont constamment utilisés pour l'interprétation, par exemple le considérant 26 sur l'identifiabilité.", "Les considérants ne lient personne. Ils sont une aide à l'interprétation, pas une source de droits ou d'obligations.", "Les considérants sont la motivation du législateur. Ils n'obligent pas, mais les autorités de contrôle et les juges les utilisent pour interpréter un article peu clair."]}, {"q": "Vous cherchez à savoir si un traitement de données est interdit. Quel est le bon ordre de lecture ?", "options": ["D'abord les travaux préparatoires, puis les considérants et seulement à la fin les articles eux-mêmes.", "D'abord les considérants, car ils sont écrits le plus clairement ; les articles seulement en cas de doute.", "D'abord l'article, puis le considérant qui s'y rapporte et, seulement en cas de doute, les travaux préparatoires.", "Uniquement les articles ; les considérants et les travaux préparatoires sont juridiquement sans aucun intérêt."], "answer": 2, "feedback": ["Les travaux préparatoires sont la dernière étape, pas la première. La réponse contraignante se trouve dans l'article.", "Un considérant n'oblige pas. Celui qui fonde sa conclusion sur un considérant sans lire l'article risque de voir une obligation qui n'existe pas.", "Seul l'article oblige ; le considérant éclaire l'intention ; les travaux préparatoires sont l'ultime recours pour comprendre le contexte.", "Les considérants et les travaux préparatoires ne sont pas contraignants, mais ils ne sont certainement pas sans intérêt : les juges et les autorités de contrôle les utilisent pour interpréter les articles peu clairs."]}, {"q": "Qu'est-ce que le Comité européen de la protection des données (EDPB) ?", "options": ["Un tribunal européen qui traite les recours contre les décisions des autorités de contrôle nationales.", "L'organe de toutes les autorités de contrôle nationales qui assure une application uniforme du RGPD.", "Le service de la Commission européenne qui a rédigé le RGPD et qui en suit l'application.", "L'autorité de contrôle belge compétente pour l'administration fédérale et ses institutions."], "answer": 1, "feedback": ["L'EDPB n'est pas un tribunal. Le recours contre une décision de l'APD va devant la Cour des marchés ; l'interprétation du RGPD relève de la Cour de justice de l'Union européenne.", "L'EDPB (articles 68 à 70 du RGPD) publie des lignes directrices et tranche, par une décision contraignante, les désaccords entre autorités de contrôle dans les affaires transfrontalières.", "L'EDPB est indépendant de la Commission. Il est composé des présidents des autorités de contrôle nationales et du Contrôleur européen de la protection des données.", "L'autorité de contrôle nationale belge est l'Autorité de protection des données (APD), qui représente la Belgique au sein de l'EDPB."]}, {"q": "Qu'est-ce qu'un rappel à l'ordre en tant que sanction d'une autorité de contrôle ?", "options": ["Une amende de maximum 10 000 euros que l'autorité de contrôle peut infliger sans procédure.", "Un avertissement informel par courrier, sans la moindre conséquence juridique pour l'entreprise.", "La suspension temporaire du traitement jusqu'à ce que l'entreprise ait corrigé l'infraction constatée.", "Un constat formel que les règles ont été enfreintes, sans amende, mais pris en compte en cas de récidive."], "answer": 3, "feedback": ["Un rappel à l'ordre ne comporte pas d'amende. Les amendes sont une sanction distincte, prévue à l'article 83 du RGPD.", "L'avertissement existe aussi, mais il intervient avant une infraction, lorsqu'un traitement envisagé risque d'enfreindre les règles. Le rappel à l'ordre constate que l'infraction a déjà eu lieu et constitue une décision formelle.", "La suspension d'un traitement est une mesure distincte et plus lourde. Le rappel à l'ordre est le constat de l'infraction sans autre mesure.", "Le rappel à l'ordre figure à l'article 58, paragraphe 2, b du RGPD. C'est la sanction la plus légère, mais une véritable décision, susceptible de recours, qui pèse dans un dossier ultérieur."]}, {"q": "Une entreprise conteste une sanction de la Chambre contentieuse de l'Autorité de protection des données. Où peut-elle s'adresser ?", "options": ["À la Cour des marchés, une section de la cour d'appel de Bruxelles, dans les trente jours.", "Directement à la Cour de justice de l'Union européenne à Luxembourg, dans les deux mois de la décision.", "Au Comité européen de la protection des données, qui réexamine les décisions des autorités nationales.", "Nulle part : la décision de la Chambre contentieuse est définitive et non susceptible de recours."], "answer": 0, "feedback": ["Comme l'APD est un organe administratif, l'article 78 du RGPD garantit un recours devant un juge. En Belgique, c'est la Cour des marchés.", "Une entreprise ne peut pas saisir directement la Cour de justice de l'Union européenne. Seul un juge national, comme la Cour des marchés, peut lui poser une question préjudicielle.", "L'EDPB ne traite pas les recours des entreprises. Il veille à l'application uniforme entre les autorités de contrôle.", "Contre une décision d'un organe de sanction administratif, un recours devant un juge doit toujours être possible. C'est une garantie fondamentale, inscrite aussi à l'article 78 du RGPD."]}, {"q": "Quand la Cour des marchés pose-t-elle une question préjudicielle à la Cour de justice de l'Union européenne ?", "options": ["Lorsque l'entreprise le demande et que l'amende infligée dépasse un million d'euros.", "Lorsqu'elle ne peut pas établir elle-même les faits de l'affaire et qu'une enquête complémentaire s'impose.", "Lorsque l'Autorité de protection des données y consent et cosigne la question.", "Lorsqu'elle doute de l'interprétation du droit européen et a besoin de la réponse pour trancher l'affaire."], "answer": 3, "feedback": ["Ni la demande d'une partie ni le montant de l'amende ne sont déterminants. Le juge décide lui-même s'il a une question d'interprétation.", "La Cour de justice de l'Union européenne n'apprécie pas les faits. Elle ne répond qu'aux questions sur le sens du droit européen ; les faits restent du ressort du juge national.", "Le juge n'a pas besoin de l'accord d'une partie pour cela. La décision de poser une question lui appartient seul.", "C'est la procédure de l'article 267 TFUE. La Cour interprète la règle européenne ; la réponse lie tous les juges de l'Union. L'affaire Proximus (C-129/21) en est un exemple."]}, {"q": "Pourquoi l'arrêt Breyer (C-582/14) de la Cour de justice de l'Union européenne est-il important pour la notion de donnée à caractère personnel ?", "options": ["Parce que la Cour a décidé qu'une adresse IP ne peut jamais être une donnée à caractère personnel, même pour le fournisseur d'accès.", "Parce que la Cour a réécrit et élargi la définition de la donnée à caractère personnel du RGPD.", "Parce qu'il montre que la jurisprudence contribue à définir une notion, ici celle de donnée à caractère personnel.", "Parce que la Cour a condamné l'autorité de contrôle belge pour une lecture trop large de la notion."], "answer": 2, "feedback": ["La Cour a décidé le contraire : une adresse IP dynamique peut bel et bien être une donnée à caractère personnel, si l'exploitant peut raisonnablement faire identifier la personne via le fournisseur d'accès.", "Un juge ne réécrit pas le texte ; il l'interprète. La définition est restée la même, mais l'arrêt précise ce que signifie « identifiable » en pratique.", "Le texte de la définition ne dit rien des adresses IP. C'est par l'interprétation de la Cour que nous savons qu'une adresse IP dynamique peut être une donnée à caractère personnel. C'est ainsi que les notions acquièrent leur véritable contenu.", "Breyer était une affaire allemande, introduite par un citoyen contre l'État fédéral allemand. L'autorité de contrôle belge n'y jouait aucun rôle."]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = U.footer + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);
    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Fichier audio introuvable. Vérifiez que le dossier « audio » se trouve à côté de ce fichier.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  const Q = C.quiz; let qi = 0, answers = [];
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>';
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
