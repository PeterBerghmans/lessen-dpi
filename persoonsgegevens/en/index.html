<!DOCTYPE html>
<html lang="en" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 2 · What is personal data, and when do you process it?</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Module 2", "title": "What is personal data, and when do you process it?", "subtitle": "The GDPR definition, pseudonymised data and metadata, tested against real-world technology", "duration": "± 15 minutes of presentation, 8 think-along exercises, an optional deep dive and 10 questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will learn in this module", "goals": ["How the GDPR defines personal data, and why 'identifiable' is the key word.", "What pseudonymised data and metadata are, and why both remain personal data.", "How to check, for a concrete technology (smart meter, chatbot, connected car, WhatsApp, ANPR cameras, synthetic data, training data), whether personal data is involved.", "What 'processing' means and what follows once you establish that you are processing personal data."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "footer": "Module 2 · What is personal data, and when do you process it?", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI assistance and reviewed by the trainer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto", "read_label": "Open the GDPR on EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "What is personal data, and when do you process it?", "subtitle": "The GDPR definition, tested against real-world technology", "script": "Welcome to this module. Personal data is a key concept in the GDPR. If something is personal data, the regulation applies; if it is not, it does not. Over the next quarter of an hour we will first look at how the legislator defined that concept. Then we will clarify two concepts that in practice are often related to it: pseudonymised data and metadata. After that we will practise: I will present eight technologies, from the smart meter to training data for AI, and each time I will first ask you to think for yourself about whether personal data is involved, before I give the answer. We will finish with what 'processing' means and with the most important consequence: as soon as you process personal data, the GDPR applies. Those who wish can then follow a short deep dive on the degrees of pseudonymisation."}, {"id": 2, "type": "quote", "chip": "The definition", "title": "The legislator defines personal data in Article 4, point 1", "source": "Article 4, point 1 GDPR (official English text)", "quote": "‘personal data’ means any information relating to an identified or identifiable natural person (‘data subject’); an identifiable natural person is one who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that natural person;", "bullets": [{"k": "Any information", "t": "not only a name or an address: also a photo, a consumption figure, an opinion, a location, a sound recording, an assessment."}, {"k": "Identified or identifiable", "t": "you know who it is, or you can find out; the latter is the key word of this module."}, {"k": "Natural person", "t": "a living human being; data about a company or a deceased person is in principle not covered."}], "script": "Let us start with the text itself. On the slide you see the literal definition from the GDPR. Personal data means, and I quote, any information relating to an identified or identifiable natural person. And the legislator immediately explains what identifiable means: a natural person who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that person. Every word in that definition is chosen deliberately. 'Any information' means it is not only about a name or an address: a photo, a consumption figure, an opinion, a location, a sound recording or an assessment are just as much information. 'Identified or identifiable' is the core: you know who it is, or you can find out. That second word, identifiable, is the key word of this whole module. And 'natural person' means a living human being: data about a company or about a deceased person is in principle outside the GDPR."}, {"id": 3, "type": "bullets", "chip": "Identifiable", "title": "The legislator itself indicates what someone can be recognised by", "bullets": [{"k": "Direct identifiers", "t": "a name, an identification number such as the national register number, a customer number."}, {"k": "Indirect identifiers", "t": "location data, an online identifier such as an IP address or a cookie, or a combination of physical, economic, cultural or social factors."}, {"k": "Reasonable means", "t": "recital 26: someone is identifiable if the controller or another person can identify them by means reasonably likely to be used, taking into account cost, time and technology."}, {"k": "Consequence", "t": "you do not need to know the name; it is enough that you can single a person out from all others."}], "script": "When is someone identifiable? The legislator helps us and lists examples in the definition itself. There are direct identifiers, such as a name or an identification number, think of the national register number or a customer number. And there are indirect identifiers: location data, an online identifier such as an IP address or a cookie, or a combination of factors specific to someone's physical, economic, cultural or social identity. The regulation adds the test we already saw in a previous module: someone is identifiable if you, or someone else, can recognise them by reasonable means, taking into account the cost, the time and the available technology. The most important consequence: you do not need to know someone's name. It is enough that you can single that one person out from all others. Hold on to that, because it is the key to all the examples that follow.", "read": {"text": "Read recital 26 on the test of reasonable means (search the text for '(26)').", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}}, {"id": 4, "type": "chain", "chip": "Pseudonymised data", "title": "Pseudonymising means replacing the name with a code and keeping the key separately", "steps": [{"k": "Original data", "t": "John Peeters, born 12/03/1985, consumption 3,450 kWh"}, {"k": "Pseudonymisation", "t": "the name is replaced by a code; the key (code = John Peeters) is kept separately and securely"}, {"k": "Pseudonymised dataset", "t": "P-0417, born 12/03/1985, consumption 3,450 kWh"}, {"k": "With the key", "t": "whoever has the key gets back to John Peeters"}], "script": "A first concept that is often misunderstood: pseudonymised data. Look at the diagram. We start from an ordinary row of data: John Peeters, born on 12 March 1985, consumption 3,450 kilowatt hours. Pseudonymising means replacing the name with a code, for example P-0417, and keeping the key, the list that says which code belongs to which name, separately and securely. The dataset that remains therefore contains only the code, the date of birth and the consumption. That is useful: anyone working with that dataset no longer sees names. But note the last step: whoever has the key gets straight back to John Peeters. And that is precisely why the GDPR says that pseudonymised data remains personal data. Only truly anonymous data, where nobody can reasonably work out who it is about any more, falls outside the GDPR. For those who want to go further: at the end of this module there is an optional deep dive on the degrees of pseudonymisation.", "read": {"text": "Read the definition of 'pseudonymisation' in Article 4, point 5 of the GDPR.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}}, {"id": 5, "type": "compare", "chip": "Metadata", "title": "Metadata is data about data, and often reveals more than the content", "left": {"head": "Content", "items": ["What the message says", "What is shown in the photo", "What is said in the conversation"]}, "right": {"head": "Metadata", "items": ["Who sends to whom, when, how often, how long", "Where and when the photo was taken, with which device", "Which number called which number, how long, from which cell tower"]}, "script": "A second concept: metadata. Metadata is data about data. Compare the two columns. On the left is the content: what a message says, what is shown in a photo, what is said in a conversation. On the right is the metadata: who sends to whom, when, how often and how long; where and when a photo was taken and with which device; which number called which number, how long, and from which cell tower. At first sight metadata seems harmless, because it does not contain the content. But think for a moment: who calls the same number every night at three o'clock, who contacts an oncologist every week, who is in the same place every Sunday morning. Metadata draws a pattern, and that pattern often says more than the content itself. It relates to an identifiable person, so it is personal data."}, {"id": 6, "type": "bullets", "chip": "Practice", "title": "Eight technologies, always the same question: is personal data involved?", "bullets": [{"k": "The method", "t": "do not look for the name, but ask yourself: does this information relate to a person whom someone, by reasonable means, can single out from all others?"}, {"k": "Three helper questions", "t": "who is it about? Who can recognise that person, and by what means? What does the information reveal about them?"}, {"k": "How it works", "t": "for each technology you first see the question; pause, think, and then click 'Show the answer'."}], "script": "Now let us practise. I will present eight technologies, and each time I ask the same question: is personal data involved? The method is always the same. Do not look for whether there is a name, but ask yourself: does this information relate to a person whom someone, by reasonable means, can single out from all others? Three helper questions make that easier. Who is it about? Who can recognise that person, and by what means? And what does the information reveal about them? For each technology you first see the question. Pause, think for yourself, and then click 'Show the answer'. This is not about right or wrong, but about learning to ask the right questions."}, {"id": "6a", "type": "reveal", "chip": "Think-along exercise 1", "title": "The smart meter", "question": "A digital electricity or water meter records consumption every quarter of an hour and sends those figures to the grid operator. There is no name on it, only a meter number. Does this meter process personal data?", "verdict": "Yes", "answer": [{"k": "Who", "t": "the meter belongs to one home, so to one household or one person; the meter number is an identification number."}, {"k": "Who can recognise", "t": "the grid operator and the supplier link the meter number to the contract and therefore to a name."}, {"k": "What it reveals", "t": "quarter-hourly values show when someone gets up, when the house is empty, whether someone works nights, how many people live there."}], "script": "First think-along exercise: the smart meter. A digital electricity or water meter records consumption every quarter of an hour and sends those figures to the grid operator. There is no name on it, only a meter number. Does such a meter process personal data? Pause for a moment and think. At first sight you would say no: they are numbers, no name anywhere. But apply the three helper questions. Who is it about? The meter belongs to one home, so to one household or one person, and the meter number is an identification number. Who can recognise that person? The grid operator and the supplier link the meter number to the contract without any difficulty, and so to a name. And what do those figures reveal? Quarter-hourly values show when someone gets up, when the house is empty, whether someone works nights, how many people live there. That is a detailed picture of the life of an identifiable household. So the answer is yes: the smart meter processes personal data, and fairly sensitive data at that."}, {"id": "6b", "type": "reveal", "chip": "Think-along exercise 2", "title": "An AI chatbot such as ChatGPT", "question": "You ask questions to an AI chatbot. Are the conversations you have personal data?", "verdict": "Yes, in most cases", "answer": [{"k": "Who", "t": "you use the chatbot through an account or from a recognisable device; your questions are linked to you."}, {"k": "What it reveals", "t": "what you ask says something about your work, your health, your worries, your plans; and what you enter about others is personal data of those others."}, {"k": "Nuance", "t": "fully anonymous use without an account, IP address or recognisable content is conceivable, but rare in practice."}], "script": "Second think-along exercise: an AI chatbot such as ChatGPT. You ask questions to such a chatbot. Are the conversations you have personal data? Think for a moment. The answer depends on the context, but in most cases it is yes. You use the chatbot through an account, or from a device with a recognisable IP address, and your questions are linked to you. And what you ask often says a lot about you: about your work, your health, your worries, your plans. Do not forget what you enter about others either: anyone who pastes a colleague's email into the chatbot to have it summarised is processing that colleague's personal data. Fully anonymous use, without an account, without a recognisable IP address and without recognisable content, is conceivable, but rare in practice. Conclusion: conversations with a chatbot are generally personal data, and the provider of the chatbot processes them."}, {"id": "6c", "type": "reveal", "chip": "Think-along exercise 3", "title": "The connected car", "question": "A modern car constantly sends data to the manufacturer: location, speed, braking behaviour, fuel level, error codes. Does the manufacturer process personal data?", "verdict": "Yes", "answer": [{"k": "Who", "t": "the chassis number and the number plate are identification numbers; the car is linked to an owner and usually to a regular driver."}, {"k": "What it reveals", "t": "location data shows where someone lives, works and spends the night; driving behaviour says something about the person and can end up with insurers."}, {"k": "Note", "t": "passengers and the driver of a company car are data subjects too, not only the owner."}], "script": "Third think-along exercise: the connected car. A modern car constantly sends data to the manufacturer: location, speed, braking behaviour, fuel level, error codes. Does the manufacturer thereby process personal data? Think. Yes. The chassis number and the number plate are identification numbers, and the car is linked to an owner and usually to a regular driver. The location data shows where someone lives, where they work, where they spend the night. Driving behaviour says something about the person and can, via an app or a contract, end up with an insurer. Also note who the data subjects are: not only the owner, but also the driver of a company car and even the passengers. The connected car is one of the most data-rich devices we own."}, {"id": "6d", "type": "reveal", "chip": "Think-along exercise 4", "title": "WhatsApp messages", "question": "WhatsApp encrypts messages end to end: even WhatsApp itself cannot read the content. Does WhatsApp still process personal data?", "verdict": "Yes", "answer": [{"k": "The content", "t": "is encrypted and unreadable for WhatsApp; WhatsApp indeed does not process it as readable text."}, {"k": "The metadata", "t": "is not encrypted: who communicates with whom, when, how often, how long, from which device and with which phone number."}, {"k": "What it reveals", "t": "the phone number identifies you directly, and the pattern of contacts draws your social network."}], "script": "Fourth think-along exercise: WhatsApp messages. WhatsApp encrypts messages end to end: even WhatsApp itself cannot read the content. Does WhatsApp then still process personal data? Think, and think back to the slide on metadata. The content of your messages is indeed encrypted and unreadable for WhatsApp. But the metadata is not: who communicates with whom, when, how often, how long, from which device and with which phone number. Your phone number identifies you directly, and the pattern of your contacts draws your entire social network. So the answer is yes: even without knowing the content, WhatsApp processes a large collection of personal data. This example shows why metadata matters so much."}, {"id": "6e", "type": "reveal", "chip": "Think-along exercise 5", "title": "ANPR cameras", "question": "Cameras along the road automatically read number plates and store the place and time. No face is filmed. Personal data?", "verdict": "Yes", "answer": [{"k": "Who", "t": "a number plate is an identification number that leads, via the vehicle register, to the holder."}, {"k": "Who can recognise", "t": "the police and public authorities can make the link immediately; the question is not whether the camera itself knows the name."}, {"k": "What it reveals", "t": "a series of passages shows movements, and therefore the behaviour, of an identifiable person."}], "script": "Fifth think-along exercise: ANPR cameras, cameras that automatically recognise number plates. They read the number plate and store the place and time; no face is filmed. Personal data? Think. Yes. A number plate is an identification number that leads directly, via the vehicle register, to the holder. The question is not whether the camera itself knows the name, but whether someone, here the police or a public authority, can make the link by reasonable means. And they can. Moreover, a series of passages past different cameras shows the movements, and therefore the behaviour, of an identifiable person. ANPR data is personal data, and the legislator has made specific rules for it for that reason."}, {"id": "6f", "type": "reveal", "chip": "Think-along exercise 6", "title": "Synthetic data", "question": "A company has a computer generate a dataset of fictitious customers: invented names, addresses and purchases, statistically similar to real customers, but without any row referring to a real person. Personal data?", "verdict": "No", "answer": [{"k": "Who", "t": "nobody: the people in the dataset do not exist, so there is no identifiable natural person."}, {"k": "Use", "t": "that is why synthetic data is used to test software or train models without using real customer data."}, {"k": "Condition", "t": "the generation has to be done well: if the synthetic rows are too close to real people and make them recognisable, you are back to personal data."}], "script": "Sixth think-along exercise: synthetic data. A company has a computer generate a dataset of fictitious customers: invented names, addresses and purchases, statistically similar to real customers, but without any row referring to a real person. Personal data? Think. Here the answer is no. The people in the dataset do not exist, so there is no identifiable natural person. That is precisely why synthetic data is used to test software or train models without touching real customer data. One condition: the generation has to be done well. If the synthetic rows are too close to real people and still make them recognisable, you are back to personal data. Well-made synthetic data is therefore one of the few ways to work with realistic data without the GDPR applying."}, {"id": "6g", "type": "reveal", "chip": "Think-along exercise 7", "title": "Training data for AI systems", "question": "An AI model is trained on millions of texts and photos collected from the internet. Does that training data contain personal data?", "verdict": "Yes, usually", "answer": [{"k": "Who", "t": "web pages, forums, social media and news articles are full of names, photos, opinions and stories of real people."}, {"k": "Consequence", "t": "anyone who collects such data and uses it for training processes personal data and therefore needs a legal basis and must inform people."}, {"k": "Exception", "t": "a model trained only on synthetic or truly anonymous data escapes this; that is the exception, not the rule."}], "script": "Seventh think-along exercise: training data for AI systems. An AI model is trained on millions of texts and photos collected from the internet. Does that training data contain personal data? Think. Usually it does. Web pages, forums, social media and news articles are full of names, photos, opinions and stories of real people. Anyone who collects such data and uses it to train a model is therefore processing personal data, with all that entails: there has to be a legal basis and the data subjects must in principle be informed. Only a model trained exclusively on synthetic or truly anonymous data escapes this, and that is the exception, not the rule. So remember: an AI model is not 'just technology'; behind the training data are people."}, {"id": "6h", "type": "reveal", "chip": "Think-along exercise 8", "title": "A pseudonymised dataset", "question": "A hospital gives a researcher a dataset in which every patient has been given a code instead of a name. The key stays with the hospital. Is this personal data?", "verdict": "Yes", "answer": [{"k": "Why", "t": "the key exists, so the data can be traced back; the GDPR expressly says that pseudonymised data remains personal data."}, {"k": "Moreover", "t": "even without the key, rare combinations (date of birth, postcode, diagnosis) often make someone recognisable."}, {"k": "What does change", "t": "pseudonymisation is a good security measure that reduces the risks, but it does not take the dataset outside the GDPR."}], "script": "Eighth and final think-along exercise: a pseudonymised dataset. A hospital gives a researcher a dataset in which every patient has been given a code instead of a name. The key stays with the hospital. Is this personal data? Think, and think back to the diagram from earlier. Yes. The key exists, so the data can be traced back, and the GDPR expressly says that pseudonymised data remains personal data. Moreover, even without the key, rare combinations, such as date of birth, postcode and diagnosis, often make someone recognisable. What pseudonymisation does do: it is a good security measure that reduces the risks, and the GDPR encourages it for that reason. But it does not take the dataset outside the GDPR. I repeat it deliberately, because in practice it is the most common mistake: pseudonymised data is and remains personal data."}, {"id": 7, "type": "quote", "chip": "Processing", "title": "Processing is just about anything you can do with personal data", "source": "Article 4, point 2 GDPR (official English text)", "quote": "‘processing’ means any operation or set of operations which is performed on personal data or on sets of personal data, whether or not by automated means, such as collection, recording, organisation, structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or otherwise making available, alignment or combination, restriction, erasure or destruction;", "bullets": [{"k": "Very broad", "t": "any operation, from collection to destruction, automated or not."}, {"k": "Even passive", "t": "simply storing data, or only consulting it, is already processing."}, {"k": "Consequence", "t": "the question is rarely whether you process; the question is whether it is personal data."}], "script": "We now know what personal data is. What does it mean to process it? The GDPR defines processing as any operation performed on personal data, whether or not by automated means. And the text gives a long list of examples: collection, recording, organisation, storage, alteration, retrieval, consultation, use, transmission, dissemination, combination, restriction, erasure and destruction. Notice how broad that is. Simply storing data, without doing anything with it, is processing. Only looking at it is processing. Erasing it is processing. In practice, the question is therefore rarely whether you process: as soon as you have personal data in your hands, you almost always do. The real question is the question of this module: is it personal data?"}, {"id": 8, "type": "bullets", "chip": "The consequence", "title": "As soon as you process personal data, the GDPR applies, with all its obligations", "bullets": [{"k": "The switch", "t": "personal data plus processing equals GDPR; there is no in-between, not even for pseudonymised data."}, {"k": "Obligations", "t": "from that moment the following apply, among others: having a legal basis, informing the data subjects, securing the data, not keeping it longer than necessary."}, {"k": "Example", "t": "if a pseudonymised dataset leaks, that is a personal data breach and the duty to notify the supervisory authority applies, without undue delay and where feasible not later than 72 hours after becoming aware of it (Article 33)."}, {"k": "That is why", "t": "the first step of every analysis is always: is this personal data? Everything that follows depends on it."}], "script": "And then the most important consequence. As soon as you establish that you are processing personal data, the GDPR applies, with all its obligations. Think of it as a switch: personal data plus processing equals GDPR. There is no in-between, not even for pseudonymised data. From that moment on, obligations apply that we will look at one by one in the following modules: having a legal basis, informing the data subjects, securing the data, not keeping it longer than necessary. One example to make it concrete. If the pseudonymised dataset of the hospital from the previous exercise leaks, for example through a wrongly addressed email, that is a personal data breach, and then the duty to notify applies: the hospital must in principle report it to the supervisory authority within 72 hours. You do not need to know that rule in detail yet. What you do need to remember: the first step of every analysis is always the question of whether it is personal data, because everything that follows depends on it.", "read": {"text": "Read Article 33(1) on the duty to notify a personal data breach.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}}, {"id": 9, "type": "summary", "chip": "Remember", "title": "What to take away from this module", "key": "Personal data is any information about someone who can be recognised by reasonable means; as soon as you process it, the GDPR applies.", "bullets": [{"k": "Identifiable", "t": "you do not need to know the name; it is enough that someone can single the person out from all others."}, {"k": "Pseudonymised", "t": "remains personal data, because with the key or with a rare combination the person can be traced back."}, {"k": "Metadata", "t": "is personal data and often draws a sharper picture than the content."}, {"k": "The method", "t": "who is it about, who can recognise them and by what means, what does the information reveal?"}], "script": "What do you take away? One key sentence: personal data is any information about someone who can be recognised by reasonable means, and as soon as you process it, the GDPR applies. Concretely: identifiable means you do not need to know the name; it is enough that someone can single the person out from all others. Pseudonymised data remains personal data, because with the key or with a rare combination the person can be traced back. Metadata is personal data and often draws a sharper picture than the content. And always use the same method: who is it about, who can recognise that person and by what means, and what does the information reveal? Those who wish can now follow the short deep dive on the degrees of pseudonymisation. Those who would rather practise straight away click 'Skip the deep dive'."}, {"id": "V1", "type": "bullets", "optional": true, "chip": "Deep dive (optional)", "title": "Pseudonymisation comes in degrees: direct and indirect identifiers", "bullets": [{"k": "Direct identifiers", "t": "attributes that point to someone on their own: name, national register number, email address, phone number, customer number."}, {"k": "Indirect identifiers", "t": "attributes that are not enough on their own, but are in combination: date of birth, postcode, sex, occupation, diagnosis, job title."}, {"k": "Weak pseudonymisation", "t": "only the direct identifiers are replaced; the indirect ones remain and often make re-identification possible."}, {"k": "Strong pseudonymisation", "t": "the indirect identifiers are generalised too: year of birth instead of date of birth, region instead of postcode."}], "script": "For those who want to go further: pseudonymisation comes in degrees. The distinction you need for that is the one between direct and indirect identifiers. Direct identifiers are attributes that point to someone on their own: a name, a national register number, an email address, a phone number, a customer number. Indirect identifiers are attributes that are not enough on their own, but are in combination: date of birth, postcode, sex, occupation, diagnosis, job title. Weak pseudonymisation replaces only the direct identifiers with a code; the indirect ones remain, and they often make re-identification surprisingly easy. Strong pseudonymisation also generalises the indirect identifiers: a year of birth instead of a date of birth, a region instead of a postcode. The stronger the pseudonymisation, the smaller the risk, but as long as a key or a reasonable route to the person exists, it remains personal data."}, {"id": "V2", "type": "bullets", "optional": true, "chip": "Deep dive (optional)", "title": "Small cells: when a group becomes too small, it points to one person", "bullets": [{"k": "The principle", "t": "a combination of indirect identifiers forms a 'cell'; the fewer people in the cell, the more recognisable each of them is."}, {"k": "Example", "t": "postcode 2800, born in 1985, female: hundreds of people. Add 'surgeon': perhaps only one left. That cell is a small cell."}, {"k": "Well-known research", "t": "date of birth, postcode and sex together are enough to uniquely identify most of a population."}, {"k": "Practice", "t": "statistical offices and hospitals therefore do not publish cells below a threshold (often 5 or 10 people) and merge or omit them."}], "script": "That brings us to the principle of small cells. A combination of indirect identifiers forms a cell: all the people who share the same combination. The fewer people in that cell, the more recognisable each of them is. An example. Postcode 2800, born in 1985, female: that is still hundreds of people. Add 'surgeon', and perhaps only one is left. That cell of one person is a small cell, and anyone who sees the dataset knows immediately who it is about, even though there is no name. Research showed long ago that date of birth, postcode and sex together are enough to uniquely identify most of a population. That is why statistical offices and hospitals do not publish cells below a certain threshold, often five or ten people: they merge small cells or leave them out. Anyone working with pseudonymised data therefore has to look not only at the key, but also at the small cells in the dataset itself."}], "quiz": [{"q": "Which wording best reflects the definition of personal data in the GDPR?", "options": ["Any information on which a person's name is expressly mentioned.", "Any sensitive information, such as data about health, finances or beliefs.", "Any information relating to an identified or identifiable natural person.", "Any information a person has entered or shared about themselves."], "answer": 2, "feedback": ["The name is only one way of identifying someone. Information without a name can also be personal data, as long as the person is identifiable.", "Sensitive data is a special category of personal data, but the definition is much broader: a consumption figure or a location is personal data too.", "That is the literal definition. 'Any information' and 'identifiable' make the concept very broad.", "Who entered the information plays no role. Information that others record about you is personal data as well."]}, {"q": "According to the GDPR, when is someone 'identifiable'?", "options": ["If they can be identified by reasonable means, including by a third party.", "Only if their name or national register number appears in the data itself.", "Only if the controller itself holds the key to their identity.", "If they have themselves consented to being identified in the data."], "answer": 0, "feedback": ["That is the test in recital 26: all the means reasonably likely to be used, by the controller or by another person.", "The name is not required. A meter number, a number plate or a combination of attributes is enough if someone can be recognised by it.", "It is enough that someone, including a third party such as an internet provider or a grid operator, can make the link by reasonable means.", "Consent has nothing to do with identifiability. That is a question of fact: can the person be recognised or not?"]}, {"q": "A hospital replaces every name in a dataset with a code and keeps the key separately. What is the legal status of that dataset?", "options": ["Anonymous data: thanks to the codes, the GDPR no longer applies to the dataset.", "Pseudonymised data: still personal data, the GDPR remains fully applicable.", "Pseudonymised data: the GDPR still applies to the hospital, but no longer to the recipient.", "Statistical data: it falls outside the GDPR as soon as the names have been removed."], "answer": 1, "feedback": ["Anonymisation requires that nobody can reasonably work out who it is about any more. As long as a key exists, that is not the case.", "Article 4, point 5 and recital 26 are clear: pseudonymised data is personal data. Pseudonymisation is a security measure, not a way out of the GDPR.", "The GDPR applies to everyone who processes personal data. The recipient also processes pseudonymised personal data and must comply with the rules.", "A dataset with one row per patient is not statistics but a collection of individual data, even if the names have been replaced by codes."]}, {"q": "What is metadata?", "options": ["The encrypted content of a message, which only the recipient can read.", "Data that has been automatically generated or summarised by an AI system.", "Data that is not personal data because it does not contain the content itself.", "Data about data: who, when, where, how often and how long, apart from the content."], "answer": 3, "feedback": ["Metadata is not the content, encrypted or not. It describes the circumstances of the communication or the file.", "Metadata arises with every communication or file, even without AI: a phone call, a photo, an email.", "That is the pitfall. Metadata relates to an identifiable person and is therefore indeed personal data, as the WhatsApp example shows.", "Exactly. And because it draws the pattern of an identifiable person, it is personal data, often even more telling than the content."]}, {"q": "A smart electricity meter sends quarter-hourly values with only a meter number, without a name. Why is this still personal data?", "options": ["Because the meter is linked to one home and the supplier can link the meter number to a name.", "Because electricity consumption is always regarded by the legislator as sensitive data.", "It is not personal data: there is no name on it and it is only technical measurement values.", "Because the meter is connected to the internet and the data is therefore sent online."], "answer": 0, "feedback": ["That is the reasoning: the meter number is an identification number, the link to a name is easy for the supplier, and the quarter-hourly values tell how the household lives.", "Consumption is not in itself a special category. It is personal data because it relates to an identifiable household and reveals a lot about their life.", "The name is not required. Identifiability is enough, and it is clearly present here through the meter number and the contract.", "The internet connection makes transmission possible, but does not determine whether something is personal data. That depends on the identifiability of the person."]}, {"q": "WhatsApp cannot read the content of messages because of encryption. Does WhatsApp process personal data?", "options": ["No, because without access to the content there is no personal data left.", "Only if the user has entered their real name in their profile and made it visible.", "Yes, because the metadata, such as who with whom and when, is not encrypted.", "No, because encryption makes the data anonymous and so takes it outside the GDPR."], "answer": 2, "feedback": ["The content is only one layer. The metadata about the communication is itself personal data, and WhatsApp does process that.", "The profile name plays no role: the phone number alone makes the user identifiable.", "The phone number identifies the user directly and the pattern of contacts draws their social network. That is personal data, even without the content.", "Encryption secures the content, but anonymises nothing: the sender, the recipient and the time remain known."]}, {"q": "Which of these datasets in principle contains no personal data?", "options": ["A dataset with the number plates and passage times recorded by an ANPR camera.", "A dataset with users' conversations with a chatbot, linked to their account.", "A pseudonymised patient dataset for which the hospital keeps the key separately.", "A correctly generated synthetic dataset with fictitious customers."], "answer": 3, "feedback": ["A number plate leads via the vehicle register to the holder and is therefore personal data.", "Conversations linked to an account relate to an identified person and often reveal a lot about them.", "Pseudonymised data remains personal data as long as the key exists or the person can otherwise be traced back.", "If the people do not exist, there is no identifiable natural person and therefore no personal data. The condition is that the generation does not make any real person recognisable."]}, {"q": "An AI model is trained on texts and photos collected from the internet. What applies?", "options": ["Training data is technical data and therefore falls outside the scope of the GDPR.", "The training data usually contains personal data, so whoever uses it must comply with the GDPR.", "The GDPR only applies once the trained model itself generates or reproduces personal data.", "The GDPR does not apply, because the data was already public and may therefore be used by anyone."], "answer": 1, "feedback": ["Texts and photos from the internet are full of names, faces and stories of real people. That is personal data, however technical the use.", "Collecting and using for training are processing operations within the meaning of Article 4, point 2. A legal basis is therefore needed and the data subjects must in principle be informed.", "The processing starts with collection and training, not only with the model's output.", "The fact that data is public does not take it outside the GDPR. Public personal data remains personal data."]}, {"q": "Which action is not processing within the meaning of the GDPR?", "options": ["Simply storing personal data without using it.", "Looking at personal data without changing it.", "Erasing personal data from a file or system.", "None of these: all three are processing."], "answer": 3, "feedback": ["Storage is literally in the list in Article 4, point 2. Storing is processing.", "Consultation is literally in the list. Looking is processing.", "Erasure and destruction are literally in the list. Erasing is processing too.", "The concept of processing is deliberately very broad: any operation, from collection to destruction, automated or not."]}, {"q": "A hospital's pseudonymised dataset leaks through a wrongly addressed email. What applies?", "options": ["It is a personal data breach and the duty to notify the supervisory authority applies.", "Nothing: the data was pseudonymised, so there is no personal data breach.", "The hospital only has to ask the recipient to delete the email and confirm that in writing.", "The duty to notify applies only if the key has leaked as well, otherwise no one is identifiable."], "answer": 0, "feedback": ["As soon as personal data is processed, the obligations of the GDPR apply, including the duty to notify under Article 33: in principle within 72 hours of becoming aware. The pseudonymisation may, however, be taken into account when assessing the risk.", "Pseudonymised data is personal data. A leak of it is therefore a personal data breach.", "That is a useful first measure, but it does not replace the duty to notify.", "The duty to notify depends on whether personal data has leaked, and it has. Whether the key leaked too affects the risk, not the existence of the breach."]}]}</script>

      case 'summary':
        body = '<div class="keyline">'+esc(s.key)+'</div>'+bullets(s.bullets); break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

  function go(n, play){

    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audio file not found. Check that the "audio" folder sits next to this file.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  const Q = C.quiz; let qi = 0, answers = [];
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>';
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
</script>
