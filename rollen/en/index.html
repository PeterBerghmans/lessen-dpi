ch treats with a purpose and choices of their own: separate controllers.", "Not correct. Each treats with a purpose and choices of their own: separate controllers.", "Not correct. Each treats with a purpose and choices of their own: separate controllers.", "Correct. Each treats with a purpose and choices of their own: separate controllers."]}, {"q": "A volunteer of a youth movement manages the list of members at the request of the board. What is the volunteer?", "options": ["No role of its own: acts under authority", "Processor", "Controller", "Data subject"], "answer": 0, "feedback": ["Correct. A volunteer too acts under the authority of the organisation; the youth movement is the controller.", "Not correct. A volunteer too acts under the authority of the organisation; the youth movement is the controller.", "Not correct. A volunteer too acts under the authority of the organisation; the youth movement is the controller.", "Not correct. A volunteer too acts under the authority of the organisation; the youth movement is the controller."]}, {"q": "A bank checks transactions for fraud with its own criteria and systems. What is the bank?", "options": ["Processor", "Controller", "Joint controllers", "No role of its own: acts under authority"], "answer": 1, "feedback": ["Not correct. It determines the purpose (fighting fraud) and the means.", "Correct. It determines the purpose (fighting fraud) and the means.", "Not correct. It determines the purpose (fighting fraud) and the means.", "Not correct. It determines the purpose (fighting fraud) and the means."]}, {"q": "A software supplier delivers an accounting package that runs locally at the client's premises and has no access to the data itself. What is the supplier?", "options": ["Processor", "Controller", "Neither: it does not process personal data", "Joint controllers"], "answer": 2, "feedback": ["Not correct. Whoever has no access and processes nothing has no role for those data.", "Not correct. Whoever has no access and processes nothing has no role for those data.", "Correct. Whoever has no access and processes nothing has no role for those data.", "Not correct. Whoever has no access and processes nothing has no role for those data."]}, {"q": "The same software supplier offers the package as an online service and stores the data on its servers on the instructions of the client. What is it now?", "options": ["Controller", "Joint controllers", "No role of its own: acts under authority", "Processor"], "answer": 3, "feedback": ["Not correct. It stores and processes on behalf of the client: processor.", "Not correct. It stores and processes on behalf of the client: processor.", "Not correct. It stores and processes on behalf of the client: processor.", "Correct. It stores and processes on behalf of the client: processor."]}, {"q": "An employer installs cameras on the work floor and determines what is done with them. What is the employer?", "options": ["Controller", "Processor", "No role of its own: acts under authority", "Data subject"], "answer": 0, "feedback": ["Correct. It determines the purposes and means of the camera surveillance.", "Not correct. It determines the purposes and means of the camera surveillance.", "Not correct. It determines the purposes and means of the camera surveillance.", "Not correct. It determines the purposes and means of the camera surveillance."]}, {"q": "A security firm views the camera footage on the instructions of the employer and reports incidents, according to the employer's directions. What is the security firm?", "options": ["Controller", "Processor", "Joint controllers", "Separate controllers"], "answer": 1, "feedback": ["Not correct. It works on behalf of the employer: processor.", "Correct. It works on behalf of the employer: processor.", "Not correct. It works on behalf of the employer: processor.", "Not correct. It works on behalf of the employer: processor."]}, {"q": "An employee who can be seen on the camera footage. What is this employee?", "options": ["No role of its own: acts under authority", "Processor", "Data subject", "Controller"], "answer": 2, "feedback": ["Not correct. The person filmed is the data subject.", "Not correct. The person filmed is the data subject.", "Correct. The person filmed is the data subject.", "Not correct. The person filmed is the data subject."]}, {"q": "A subcontractor of a cloud provider supplies the data centres where the data of the cloud provider's clients are held. What is the subcontractor?", "options": ["Controller", "Joint controllers", "No role of its own: acts under authority", "Processor (sub-processor)"], "answer": 3, "feedback": ["Not correct. A processor that works for another processor remains a processor; the first processor needs the controller's authorisation for that.", "Not correct. A processor that works for another processor remains a processor; the first processor needs the controller's authorisation for that.", "Not correct. A processor that works for another processor remains a processor; the first processor needs the controller's authorisation for that.", "Correct. A processor that works for another processor remains a processor; the first processor needs the controller's authorisation for that."]}, {"q": "A municipality and a police zone set up a camera network together and decide together on purpose, locations and retention period. How do you qualify them?", "options": ["Joint controllers", "Separate controllers", "The police zone is the processor of the municipality", "Processor"], "answer": 0, "feedback": ["Correct. Determining the purposes and means together: joint controllers, with an arrangement between them.", "Not correct. Determining the purposes and means together: joint controllers, with an arrangement between them.", "Not correct. Determining the purposes and means together: joint controllers, with an arrangement between them.", "Not correct. Determining the purposes and means together: joint controllers, with an arrangement be ose, own means: controller.", "Not correct. Own purpose, own means: controller.", "Not correct. Own purpose, own means: controller.", "Correct. Own purpose, own means: controller."]}, {"q": "A user of that platform who shares photos of friends within his private circle. What is this user for those photos?", "options": ["No role under the GDPR: household exemption", "Controller", "Processor", "No role of its own: acts under authority"], "answer": 0, "feedback": ["Correct. A purely personal activity falls outside the GDPR; the platform itself does fall under it.", "Not correct. A purely personal activity falls outside the GDPR; the platform itself does fall under it.", "Not correct. A purely personal activity falls outside the GDPR; the platform itself does fall under it.", "Not correct. A purely personal activity falls outside the GDPR; the platform itself does fall under it."]}, {"q": "An administrator of a company's Facebook page uses the visitor statistics the platform generates; the Court of Justice ruled on that situation. How do you qualify page administrator and platform for those statistics?", "options": ["Separate controllers", "The administrator is the processor of the platform", "The platform is the processor of the administrator", "Joint controllers"], "answer": 3, "feedback": ["Not correct. The Court ruled that the page administrator determines, together with the platform, the purposes and means of those statistics: joint controllers, each for their own share.", "Not correct. The Court ruled that the page administrator determines, together with the platform, the purposes and means of those statistics: joint controllers, each for their own share.", "Not correct. The Court ruled that the page administrator determines, together with the platform, the purposes and means of those statistics: joint controllers, each for their own share.", "Correct. The Court ruled that the page administrator determines, together with the platform, the purposes and means of those statistics: joint controllers, each for their own share."]}, {"q": "A job applicant sends his CV to a company. What is the applicant?", "options": ["Controller", "Processor", "Data subject", "No role of its own: acts under authority"], "answer": 2, "feedback": ["Not correct. The person the CV is about is the data subject.", "Not correct. The person the CV is about is the data subject.", "Correct. The person the CV is about is the data subject.", "Not correct. The person the CV is about is the data subject."]}, {"q": "A recruitment agency looks for candidates for various companies and for that manages its own database of candidates, which it also uses for other assignments. What is the agency for that database?", "options": ["Processor", "No role of its own: acts under authority", "Joint controllers", "Controller"], "answer": 3, "feedback": ["Not correct. Own database, own purposes: controller.", "Not correct. Own database, own purposes: controller.", "Not correct. Own database, own purposes: controller.", "Correct. Own database, own purposes: controller."]}, {"q": "A company hires a debt collection agency that approaches debtors using its own methods and its own judgement and is legally regulated for that. What is the debt collection agency?", "options": ["Controller", "Processor", "No role of its own: acts under authority", "Joint controllers"], "answer": 0, "feedback": ["Correct. Whoever works with its own methods and its own judgement under its own legal framework determines the purposes and means for that processing.", "Not correct. Whoever works with its own methods and its own judgement under its own legal framework determines the purposes and means for that processing.", "Not correct. Whoever works with its own methods and its own judgement under its own legal framework determines the purposes and means for that processing.", "Not correct. Whoever works with its own methods and its own judgement under its own legal framework determines the purposes and mea         let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+(s.question?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span><a class="btn ghost" target="_blank" rel="noopener" href="'+esc(s.read.url)+'">'+esc(s.read.label||U.read_label||'EUR-Lex')+' ↗</a></div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);
    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audio file not found. Check that the "audio" folder sits next to this file.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;
    $('btn-quiz-start').classList.add('hidden');
    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
</script>
</body>
