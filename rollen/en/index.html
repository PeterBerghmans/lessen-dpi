<!DOCTYPE html>
<html lang="en" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 7 · The roles under the GDPR</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Module 7", "title": "The roles under the GDPR", "subtitle": "Data subject, controller and processor: who determines the purposes and means, and why that qualification determines everything", "duration": "± 15 minutes of presentation, 1 think-along exercise and two exercise sets (10 questions on the subject matter, 50 qualification exercises)", "ui": {"start": "Start the presentation", "intro_lead": "What you will be able to do after this module", "goals": ["Recognising the three roles of the GDPR: data subject, controller and processor, and why that distinction matters for accountability, for the data subject and for the supervisory authority.", "Qualifying a party on the basis of the question who determines the purposes and means, also in tricky cases such as a marketing agency with a vague assignment.", "What belongs in a processing agreement, why employees are not processors, and the difference between separate and joint controllers.", "Finding, for every obligation in the GDPR, who has to comply with it: the controller, the processor or both."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI assistance and reviewed by the trainer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto", "read_label": "Open the GDPR on EUR-Lex", "quiz_choose_title": "Choose an exercise set", "quiz_choose_text": "This module has two sets. You can do them in any order and repeat them as often as you like.", "quiz_back_to_sets": "Choose another set", "quiz_set_count": "{n} questions"}, "slides": [{"id": 1, "type": "title", "title": "The roles under the GDPR: data subject, controller and processor", "subtitle": "Who determines the purposes and means, who works on instructions, and why that qualification determines everything that follows", "script": "A business school hires a marketing agency to recruit students abroad. The assignment, in one sentence: bring in enrolments. The agency buys address lists, chooses target groups, decides which data it collects and how long it keeps them. A year later a complaint comes in from a candidate, and the question of the supervisory authority is not: was this a good campaign? The question is: who was responsible here? The school says: the agency did everything. The agency says: we worked on instructions. And both are partly right, which is exactly the problem. In this quarter of an hour you will get to know the three roles of the GDPR, and above all: you will learn to assign them. Because the qualification of a party determines who bears which obligations, where the data subject can turn, and whom the supervisory authority addresses. At the end you will know what went wrong with that school and that agency, and how they should have done it."}, {"id": 2, "type": "bullets", "chip": "Why it matters", "title": "The qualification determines who is accountable, whom the data subject addresses and whom the supervisory authority addresses", "bullets": [{"k": "Accountability", "t": "the obligations of the GDPR are divided per role; whoever does not know which role they have does not know what to do and cannot demonstrate it."}, {"k": "The data subject", "t": "needs to know with whom to exercise their rights: asking for access from the processor that merely executes is knocking on the wrong door."}, {"k": "The supervisory authority", "t": "needs to know whom to address and whom to sanction; since the GDPR both roles are under supervision, but not for the same things."}], "script": "Why do we spend a whole module on who is who? Three reasons, and they come back at the end. One: accountability. The obligations of the GDPR are divided per role. Whoever does not know which role they have does not know what to do, and so cannot demonstrate it either. Two: the data subject. They need to know with whom to exercise their rights. Whoever asks for access from a company that only executes on the instructions of another is knocking on the wrong door. Three: the supervisory authority. It needs to know whom to address and whom to sanction. Under the old Directive the executing party was hardly under supervision at all. Since the GDPR both roles are, but not for the same things. So remember: first the role, only then the obligations. In that order."}, {"id": 3, "type": "quote", "chip": "Role 1", "title": "The data subject: the person the data are about", "source": "Article 4(1) GDPR", "quote": "‘personal data’ means any information relating to an identified or identifiable natural person (‘data subject’); an identifiable natural person is one who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that natural person;", "bullets": [{"k": "Always a natural person", "t": "a customer, an employee, a patient, a visitor of a website; never a company."}, {"k": "No duties, but rights", "t": "the data subject does not have to do anything; they are given rights they can invoke against whoever processes their data."}, {"k": "The yardstick", "t": "all the obligations of the other two roles exist to protect this person."}], "script": "The first role we already know: the data subject. The definition is in the definition of personal data, on the slide. The identified or identifiable natural person the data are about. Always a human being. A customer, an employee, a patient, someone who visits a website. Never a company. The data subject has no duties under the GDPR. The data subject does not have to do anything and is given rights, which can be invoked against whoever processes their data. And the yardstick is: all the obligations of the two other roles exist to protect this person. So remember: the data subject is the one everything revolves around, and the one who does not have to do anything."}, {"id": 4, "type": "quote", "chip": "Role 2", "title": "The controller determines the purposes and means", "source": "Article 4(7) GDPR", "quote": "‘controller’ means the natural or legal person, public authority, agency or other body which, alone or jointly with others, determines the purposes and means of the processing of personal data; where the purposes and means of such processing are determined by Union or Member State law, the controller or the specific criteria for its nomination may be provided for by Union or Member State law;", "bullets": [{"k": "The purpose: what and why", "t": "the controller decides what happens with the data and for what purpose; and it makes sure that purpose is preserved (purpose limitation)."}, {"k": "The means: how", "t": "it determines which data are needed to achieve the purpose, how long they are kept, who gets access, with which systems."}, {"k": "Who can it be", "t": "a company, a public authority, an association, a natural person; alone or jointly with others. Not the IT department or the DPO within the organisation: it is the organisation itself."}], "script": "The second role: the controller. Read the definition. Whoever, alone or jointly with others, determines the purposes and means of the processing. Two words, and you must be able to explain both. The purpose: what happens with the data, and for what? The controller decides that. And it makes sure that purpose is preserved, think of purpose limitation from an earlier module. The means: how is it done? Which data are needed to achieve the purpose, the controller determines that. How long they are kept. The controller has to account for itself when there are questions about minimisation and about who gets access and with which systems. So the choice of the data is also a means, and that choice lies with the controller. Who can be a controller? A company, a public authority, an association, a natural person. And note: it is the organisation itself, not a department or a person within it. Not the IT department, not the data protection officer. So remember: whoever decides for what and how is the controller."}, {"id": 5, "type": "quote", "chip": "Role 3", "title": "The processor processes on behalf of the controller", "source": "Article 4(8) GDPR", "quote": "‘processor’ means a natural or legal person, public authority, agency or other body which processes personal data on behalf of the controller;", "bullets": [{"k": "On behalf of", "t": "on the instructions and according to the directions of another; the processor does not decide what the data are for."}, {"k": "A separate party", "t": "an organisation or person other than the controller: a cloud provider, a payroll office, a print shop that sends out the mailing."}, {"k": "But its own choices on the technical side", "t": "a processor may make practical choices (which server, which software), as long as it does not decide on the purpose and the essential means."}], "script": "The third role: the processor. Read the definition. Whoever processes personal data on behalf of the controller. On behalf of: on instructions, according to the directions of another. The processor does not decide what the data are for. It executes. It is always a separate party: an organisation or person other than the controller. A cloud provider that stores your data. A payroll office that calculates your salaries. A print shop that sends out your mailing. Does that mean a processor may not decide anything? No. It may make practical, technical choices: which server, which software, how it organises its backups. As long as it does not decide on the purpose, and not on the essential means, such as which data and for how long. So remember: the processor works for another, and as soon as it starts determining for itself what the data are for, it is no longer a processor."}, {"id": 6, "type": "chain", "chip": "Examples", "title": "From simple to tricky", "steps": [{"k": "The cloud storage", "t": "a school stores pupil files with a cloud provider. The school determines purposes and means; the provider stores. School: controller. Provider: processor."}, {"k": "The payroll office", "t": "an employer has its salaries calculated. The employer determines who earns what and supplies the data; the payroll office calculates according to the law. Employer: controller. Payroll office: processor for the salary calculation."}, {"k": "The marketing agency, well defined", "t": "the school says: recruit candidates in India through these channels, collect only name, email and choice of study, keep nothing longer than the campaign, use our texts. The agency executes: processor."}, {"k": "The marketing agency, vague assignment", "t": "the school only says: bring in enrolments. The agency chooses the sources, the data and the retention period itself and also uses the list for other clients. It determines purposes and means: it becomes a controller itself."}], "script": "Let us build it up, from simple to tricky. First example: a school stores its pupil files with a cloud provider. The school determines for what and which; the provider stores. School: controller. Provider: processor. Second example: an employer has its salaries calculated by a payroll office. The employer determines who earns what and supplies the data; the payroll office calculates according to the law. Employer: controller. Payroll office: processor, for that salary calculation. Now the marketing agency from the introduction, in two versions. Version one: the school defines the assignment well. Recruit candidates in India through these channels. Collect only name, email address and choice of study. Keep nothing longer than the campaign. Use our texts. The agency executes. No doubt: the agency is a processor. Version two: the school only says: bring in enrolments. The agency chooses the sources itself, decides itself which data it collects and for how long, and also uses the list for other clients. Then the agency determines the purposes and means. And then it is no longer a processor, but a controller itself, with all the obligations that go with it, and without anyone having intended it that way. So remember: the vaguer the assignment, the greater the chance that your executing party becomes a controller itself."}, {"id": 7, "type": "quote", "chip": "The processing agreement", "title": "A good assignment is put on paper: the processing agreement", "source": "Article 28(3) GDPR", "quote": "Processing by a processor shall be governed by a contract or other legal act under Union or Member State law, that is binding on the processor with regard to the controller and that sets out the subject-matter and duration of the processing, the nature and purpose of the processing, the type of personal data and categories of data subjects and the obligations and rights of the controller. That contract or other legal act shall stipulate, in particular, that the processor:", "bullets": [{"k": "What it contains (the core)", "t": "subject-matter and duration, nature and purpose, type of data and categories of data subjects, rights and obligations of the controller."}, {"k": "What the processor promises", "t": "process only on documented instructions; confidentiality of its staff; security; no sub-processor without authorisation; assistance with data subjects' rights and with incidents; erase or return at the end; allow audits."}, {"k": "Why", "t": "without such an agreement the assignment is not delimited, and then precisely the shift of the vague marketing agency looms."}], "read": {"text": "Read Article 28 in full: paragraph 3 lists what the agreement must at least stipulate.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "How do you avoid that shift? By defining the assignment well, and putting it on paper. The GDPR requires a contract for that between the controller and the processor: the processing agreement. What is in it? Read the core on the slide: the subject-matter and duration of the processing, the nature and purpose, the type of data and the categories of data subjects, and the rights and obligations of the controller. In addition a series of promises by the processor, and I will list them without dissecting them legally. It processes only on documented instructions. Its staff are bound by confidentiality. It secures the data. It takes on no sub-processor without authorisation. It helps with requests from data subjects and with incidents. At the end it erases the data or returns them. And it allows audits. Do you see what that agreement does? It delimits the assignment. The school that had concluded such an agreement with the marketing agency would never have been asked who was responsible. So remember: the processing agreement is not a formality, it is the description of the assignment that fixes the roles."}, {"id": 8, "type": "quote", "chip": "Employees", "title": "Employees are not processors: they act under authority", "source": "Article 29 GDPR", "quote": "The processor and any person acting under the authority of the controller or of the processor, who has access to personal data, shall not process those data except on instructions from the controller, unless required to do so by Union or Member State law.", "bullets": [{"k": "Under authority", "t": "an employee is not a separate party; they are part of the organisation and act under its authority. So they have no role of their own under the GDPR."}, {"k": "Only on instructions", "t": "whoever has access to data under authority processes them exclusively on the instructions of the controller; whoever does not do so breaks the rule and may become a controller for that own processing."}, {"k": "In practice", "t": "no processing agreement with your own staff; but instructions, a confidentiality clause and access rights tailored to the job."}], "script": "A question that comes up often: is my employee a processor? No. And the reason is on the slide. An employee is not a separate party. They are part of the organisation and act under its authority. So they have no role of their own under the GDPR; their actions are the actions of the organisation. The rule adds: whoever has access to personal data under authority processes them exclusively on the instructions of the controller. What if an employee does not do that? The customer service employee who looks up the address of a well-known Flemish celebrity out of curiosity? Then they break that rule, and then they are no longer acting on instructions, but for themselves. For that own processing they may become a controller themselves, with all the consequences. In practice this means: you do not conclude a processing agreement with your own staff. What you do instead: give instructions, a confidentiality clause in the contract, and access rights tailored to the job. So remember: employees are the hands of the controller, not a separate role."}, {"id": 9, "type": "compare", "chip": "Two or more controllers", "title": "Separate or joint controllers?", "left": {"head": "Separate", "items": ["Two parties, two processing operations that follow on from each other, but each determines its own purposes and means", "Example: an employer passes salary data to the health insurance fund; the employer processes for the salary, the health insurance fund for the reimbursement", "Each is fully responsible for its own part; no joint arrangement needed"]}, "right": {"head": "Joint", "items": ["Two or more parties determine together the purposes and means of one processing operation", "Example: two university colleges organise a study fair together and manage one registration file together, with a shared purpose and shared choices", "They must agree transparently among themselves who does what, especially for the rights and the information of the data subject; but that is not a processing agreement, and the data subject may turn to each of them"]}, "read": {"text": "Read Article 26 on joint controllers: the arrangement between them and the position of the data subject.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Sometimes there are two parties that are both controllers. Then there are two possibilities, and look at the two columns. Left: separate controllers. Two processing operations that follow on from each other, but each party determines its own purposes and its own means. The classic example: an employer passes salary data to the health insurance fund. The employer processes them for the salary, the health insurance fund for the reimbursement. Two purposes, two controllers, each fully for its own part. They do not need to make a joint arrangement. Right: joint controllers. Two or more parties determine together the purposes and means of one processing operation. For example: two university colleges organise a study fair together and manage one registration file together. Shared purpose, shared choices. Then the GDPR asks that they agree transparently among themselves who does what, especially for the rights of the data subject and the information they receive. Note: that is not a processing agreement, because neither of them works for the other. And the data subject may turn to each of them, whatever they agreed among themselves. So remember: deciding together is joint; deciding one after the other is separate."}, {"id": 10, "type": "reveal", "chip": "Think-along exercise 1", "title": "Who is who?", "question": "A municipality organises a sports camp and asks an external activity organisation to run it. The municipality determines which data the parents fill in and keeps them; the activity organisation receives the list of participants to divide the groups and returns it after the camp. A parent asks the activity organisation for access. What is the role of each party, and what does the activity organisation do with that request?", "verdict": "Municipality: controller · activity organisation: processor · forward the request", "answer": [{"k": "The municipality", "t": "determines the purpose (organising the camp) and the means (which data, how long): controller."}, {"k": "The activity organisation", "t": "uses the list only for the assignment and returns it: processor. There should be a processing agreement."}, {"k": "The access request", "t": "is addressed to the controller; the processor forwards it to the municipality and helps it, as the agreement provides. Were the activity organisation to use the list for its own advertising as well, it would become a controller itself for that part."}], "script": "First think-along exercise. A municipality organises a sports camp and asks an external activity organisation to run it. The municipality determines which data the parents fill in and keeps them. The activity organisation receives the list of participants to divide the groups, and returns it after the camp. A parent asks the activity organisation for access. Who is who, and what happens with that request? Think about it for a moment. … The municipality determines the purpose, organising the camp, and the means, which data and for how long. Controller. The activity organisation uses the list only for the assignment and returns it. Processor. And so there should be a processing agreement. The access request is addressed to the controller. The activity organisation does not answer it itself, but forwards it to the municipality and helps it where needed; that is also what such an agreement says. And the pitfall: were the activity organisation to use that list to send advertising for its own camps next year, then for that part it determines the purpose itself, and it becomes a controller for it. So remember: the role follows from what you do with the data, not from what is on your invoice."}, {"id": 11, "type": "bullets", "chip": "Back to why it matters", "title": "Accountability, supervision and rights: what the qualification means in practice", "bullets": [{"k": "Accountability for both", "t": "both roles must comply with the GDPR and be able to demonstrate it; for the controller that usually weighs heavier, because it bears the decisions."}, {"k": "Supervision of both", "t": "the supervisory authority can inspect and sanction both roles, which under the Directive was hardly the case for the executing party."}, {"k": "Rights with the controller", "t": "the rights of the data subject are ultimately directed at the controller; it bears final responsibility for letting them be exercised, the processor helps."}], "script": "We come back to why it matters, with what you now know. Accountability applies to both roles. The processor too must comply with the rules and be able to demonstrate it: a register of its processing operations, security, the agreement. But for the controller it weighs heavier, because it bears the decisions: the purpose, the data, the legal basis, the retention period. Supervision also applies to both. The supervisory authority can inspect and sanction a processor directly. Under the old Directive that was hardly the case; the executing party largely stayed out of the picture. And the rights of the data subject are ultimately directed at the controller. It bears final responsibility for letting them be exercised. The processor helps, but does not decide. So remember: both roles can be called to account, but the controller is the one the bill ultimately ends up with."}, {"id": 12, "type": "chain", "chip": "Who does what", "title": "Every obligation in the GDPR says who has to comply with it", "steps": [{"k": "Read the opening words", "t": "every provision in the part on the obligations begins with who: 'the controller', 'the processor', or 'the controller and the processor'."}, {"k": "Only the controller", "t": "data protection by design and by default, the risk assessment, the notification of a breach to the supervisory authority and to the data subject."}, {"k": "Both", "t": "the register of processing activities, security, the appointment of a data protection officer where required, cooperation with the supervisory authority."}, {"k": "Only the processor", "t": "process only on instructions, inform the controller without undue delay about a breach, no sub-processor without authorisation."}], "read": {"text": "Open Chapter IV (Articles 24 to 39) and read the first words of a few articles: that is where it says each time who bears the obligation.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Finally something practical, which you can use for the rest of your career. In the part of the GDPR on the obligations, every obligation says who has to comply with it. Read the opening words of a provision, and you see it: the controller, the processor, or both. A few examples. Only the controller: data protection by design and by default, the risk assessment, and the notification of a breach to the supervisory authority and to the data subject. Both: the register of processing activities, security, the appointment of a data protection officer where that is required, and cooperation with the supervisory authority. Only the processor: processing exclusively on instructions, informing the controller without undue delay about a breach, and no sub-processor without authorisation. You do not need to know that by heart. You need to know that it is there, and be able to look it up. Hence the reading guide on the slide. So remember: if you are in doubt about who has to do something, read the first words of the article."}, {"id": 13, "type": "summary", "chip": "Summary", "title": "What you take away", "key": "The controller determines the purposes and means, the processor works on its behalf on the basis of a well-defined assignment, and the data subject is the human being everything revolves around; that qualification determines who is accountable, who is under supervision and with whom the rights are exercised.", "bullets": [{"k": "Purposes and means", "t": "whoever decides for what and how is the controller; whoever executes on instructions is the processor; a vague assignment turns your executing party into a controller."}, {"k": "On paper", "t": "the processing agreement delimits the assignment; employees get no agreement but instructions, because they act under authority."}, {"k": "Two controllers", "t": "deciding one after the other is separate, deciding together is joint with an arrangement between them; the data subject may turn to each of them."}, {"k": "Who has to do what", "t": "both roles are accountable and under supervision; the rights are ultimately for the controller; the opening words of every obligation say who bears it."}], "script": "What do you take away? One key sentence: the controller determines the purposes and means, the processor works on its behalf on the basis of a well-defined assignment, and the data subject is the human being everything revolves around. That qualification determines who is accountable, who is under supervision and with whom the rights are exercised. Then four things. Purposes and means: whoever decides for what and how is the controller; whoever executes is the processor; and a vague assignment turns your executing party into a controller. On paper: the processing agreement delimits the assignment; employees get instructions, not an agreement. Two controllers: one after the other is separate, together is joint. And who has to do what is in the opening words of every obligation. Back to the school and the marketing agency: with a clear assignment and a processing agreement the agency would have remained a processor, and the school would have known that the complaint belonged with it. Without, the agency unintentionally became a controller itself, and both bore part of the blame. Before you practise, one task. Pause the audio and take one supplier of your own organisation that works with personal data. Ask the question: who determines for what and which data? And is there an agreement that fixes that? This module has two exercise sets: ten questions on the whole subject matter, and fifty short qualification exercises to learn to assign the roles."}], "quiz": [{"q": "Why is the qualification of a party as controller or processor so important?", "options": ["Because it determines who bears which duties and where the data subject can turn.", "Because only the controller falls under the GDPR and under supervision.", "Because the processor is thereby exempt from any responsibility.", "Because the qualification determines whether the data are personal data."], "answer": 0, "feedback": ["Correct. First the role, then the obligations: the division of duties, rights and supervision depends on it.", "Both roles fall under the GDPR and under supervision.", "The processor has obligations of its own and can be sanctioned directly.", "Whether something is personal data depends on the content, not on who processes it."]}, {"q": "Which criterion determines whether an organisation is a controller?", "options": ["Whether it physically stores the data in its systems.", "Whether it has appointed a data protection officer.", "Whether it determines the purposes and means of the processing.", "Whether it sends an invoice for the processing of the data."], "answer": 2, "feedback": ["A cloud provider stores data and is nevertheless a processor; storage is not the criterion.", "Appointing an officer is a consequence of certain obligations, not a criterion for the role.", "Correct. Whoever decides for what (purpose) and how, including which data (means), is the controller.", "Who pays or invoices says nothing about who decides."]}, {"q": "A school stores pupil files with a cloud provider that only provides storage. What is the role of the cloud provider?", "options": ["Controller, because it has the data in its hands.", "Joint controller with the school.", "Data subject, because its servers and its staff are identifiable.", "Processor, because it stores on the instructions of the school."], "answer": 3, "feedback": ["Having data in your hands does not make you a controller; deciding on purposes and means does.", "Joint requires that both parties determine the purpose together; the provider determines nothing.", "A data subject is always a natural person the data are about.", "Correct. Storage on instructions, without a purpose of its own, is the typical processor role."]}, {"q": "A marketing agency receives from a school only the assignment 'bring in enrolments' and chooses sources, data and retention period itself. What is the consequence?", "options": ["The agency remains a processor, because it works on the instructions of the school.", "The agency becomes a controller itself.", "The school is no longer responsible for the campaign and the complaint.", "The processing is automatically unlawful and must be stopped."], "answer": 1, "feedback": ["An invoice or assignment does not make you a processor if you make the essential choices yourself.", "Correct. A vague assignment shifts the choices to the executing party, which thereby becomes a controller, with all the obligations.", "The school remains responsible for its own choices and for the absence of a delimited assignment.", "The shift of roles does not automatically make the processing unlawful, but it does make it unclear who has to do what."]}, {"q": "What is the function of a processing agreement?", "options": ["To delimit the assignment given to the processor.", "To allow the processor to use the data for its own purposes.", "To inform the data subject about their rights and the retention periods.", "To exempt the controller from supervision."], "answer": 0, "feedback": ["Correct. Subject-matter, duration, nature, purpose, type of data and the promises of the processor: that is how the processor remains a processor.", "On the contrary: the agreement stipulates that the processor processes only on instructions.", "Information to the data subject is given through the privacy notice, not through the processing agreement.", "Nobody is exempt from supervision; the agreement divides the obligations."]}, {"q": "Why is an employee not a processor?", "options": ["Because employees never have access to personal data.", "Because the GDPR expressly excludes employees from any role.", "Because only legal persons with a company number can be processors.", "Because they act under the authority of the organisation."], "answer": 3, "feedback": ["Employees often have access; the point is that they are part of the organisation.", "The GDPR says that whoever acts under authority processes only on instructions; that is something else than excluding.", "A natural person can also be a processor, for example a self-employed accountant.", "Correct. Their actions are the actions of the controller; they receive instructions, not a processing agreement."]}, {"q": "A customer service employee looks up the address of a well-known customer out of curiosity. What applies?", "options": ["Nothing: they have access to the system, so they may look up anything in it.", "They thereby become a processor of the customer service.", "They act outside their assignment and may become a controller themselves for that.", "The organisation is not liable for this, because it was their own choice."], "answer": 2, "feedback": ["Having access is not permission; processing is allowed only on instructions.", "An employee does not become a processor; they either remain under authority, or they act for themselves.", "Correct. Outside the assignment they act for themselves, with possible consequences for them personally; the organisation must prevent this with instructions and access rights.", "The organisation must demonstrate that it had appropriate instructions and access rights; it is not automatically off the hook."]}, {"q": "An employer passes salary data to the health insurance fund, which uses them for reimbursements. How do you qualify both?", "options": ["Joint controllers, because they use the same data.", "Separate controllers, each with a purpose of its own.", "The employer is the processor of the health insurance fund for the salary data.", "The health insurance fund is the processor of the employer for the reimbursements."], "answer": 1, "feedback": ["Using the same data does not make you joint; determining the purpose together does.", "Correct. Two processing operations that follow on from each other, each with its own purpose: paying salaries and reimbursing.", "The employer does not work on behalf of the health insurance fund; it has its own purpose.", "The health insurance fund decides itself what it uses the data for; it does not execute on instructions."]}, {"q": "Two university colleges manage one registration file together for a joint fair and decide together on purpose and data. What does the GDPR ask of them?", "options": ["A transparent arrangement between them on who does what.", "A processing agreement in which one college becomes the processor of the other.", "Nothing in particular, as long as each college has its own privacy notice.", "Prior authorisation from the supervisory authority for the shared file."], "answer": 0, "feedback": ["Correct. And whatever they agree, the data subject may turn to each of them.", "Neither of them works for the other; a processing agreement does not fit here.", "Joint controllers must lay down their responsibilities among themselves.", "The GDPR has no general prior authorisation; they make the arrangement themselves."]}, {"q": "How do you find out in the GDPR whether an obligation rests on the controller, the processor or both?", "options": ["That is only in the EDPB guidelines, not in the Regulation itself.", "All obligations always rest on both roles, without distinction.", "The opening words of every obligation say who has to comply with it.", "That must be agreed per contract; the Regulation says nothing about it."], "answer": 2, "feedback": ["The Regulation itself names the bearer of every obligation; guidelines only clarify.", "Some obligations apply to both, others only to one role, such as the risk assessment (controller) or processing on instructions (processor).", "Correct. 'The controller', 'the processor' or both: the first words of the article say it.", "A contract divides the execution, but the legal bearer of every obligation is in the Regulation."]}], "quizzes": [{"id": "leerstof", "title": "Exercises on the subject matter", "intro": "Ten questions on the whole module: the roles, the processing agreement, employees, separate and joint controllers and who has to do what.", "questions": [{"q": "Why is the qualification of a party as controller or processor so important?", "options": ["Because it determines who bears which duties and where the data subject can turn.", "Because only the controller falls under the GDPR and under supervision.", "Because the processor is thereby exempt from any responsibility.", "Because the qualification determines whether the data are personal data."], "answer": 0, "feedback": ["Correct. First the role, then the obligations: the division of duties, rights and supervision depends on it.", "Both roles fall under the GDPR and under supervision.", "The processor has obligations of its own and can be sanctioned directly.", "Whether something is personal data depends on the content, not on who processes it."]}, {"q": "Which criterion determines whether an organisation is a controller?", "options": ["Whether it physically stores the data in its systems.", "Whether it has appointed a data protection officer.", "Whether it determines the purposes and means of the processing.", "Whether it sends an invoice for the processing of the data."], "answer": 2, "feedback": ["A cloud provider stores data and is nevertheless a processor; storage is not the criterion.", "Appointing an officer is a consequence of certain obligations, not a criterion for the role.", "Correct. Whoever decides for what (purpose) and how, including which data (means), is the controller.", "Who pays or invoices says nothing about who decides."]}, {"q": "A school stores pupil files with a cloud provider that only provides storage. What is the role of the cloud provider?", "options": ["Controller, because it has the data in its hands.", "Joint controller with the school.", "Data subject, because its servers and its staff are identifiable.", "Processor, because it stores on the instructions of the school."], "answer": 3, "feedback": ["Having data in your hands does not make you a controller; deciding on purposes and means does.", "Joint requires that both parties determine the purpose together; the provider determines nothing.", "A data subject is always a natural person the data are about.", "Correct. Storage on instructions, without a purpose of its own, is the typical processor role."]}, {"q": "A marketing agency receives from a school only the assignment 'bring in enrolments' and chooses sources, data and retention period itself. What is the consequence?", "options": ["The agency remains a processor, because it works on the instructions of the school.", "The agency becomes a controller itself.", "The school is no longer responsible for the campaign and the complaint.", "The processing is automatically unlawful and must be stopped."], "answer": 1, "feedback": ["An invoice or assignment does not make you a processor if you make the essential choices yourself.", "Correct. A vague assignment shifts the choices to the executing party, which thereby becomes a controller, with all the obligations.", "The school remains responsible for its own choices and for the absence of a delimited assignment.", "The shift of roles does not automatically make the processing unlawful, but it does make it unclear who has to do what."]}, {"q": "What is the function of a processing agreement?", "options": ["To delimit the assignment given to the processor.", "To allow the processor to use the data for its own purposes.", "To inform the data subject about their rights and the retention periods.", "To exempt the controller from supervision."], "answer": 0, "feedback": ["Correct. Subject-matter, duration, nature, purpose, type of data and the promises of the processor: that is how the processor remains a processor.", "On the contrary: the agreement stipulates that the processor processes only on instructions.", "Information to the data subject is given through the privacy notice, not through the processing agreement.", "Nobody is exempt from supervision; the agreement divides the obligations."]}, {"q": "Why is an employee not a processor?", "options": ["Because employees never have access to personal data.", "Because the GDPR expressly excludes employees from any role.", "Because only legal persons with a company number can be processors.", "Because they act under the authority of the organisation."], "answer": 3, "feedback": ["Employees often have access; the point is that they are part of the organisation.", "The GDPR says that whoever acts under authority processes only on instructions; that is something else than excluding.", "A natural person can also be a processor, for example a self-employed accountant.", "Correct. Their actions are the actions of the controller; they receive instructions, not a processing agreement."]}, {"q": "A customer service employee looks up the address of a well-known customer out of curiosity. What applies?", "options": ["Nothing: they have access to the system, so they may look up anything in it.", "They thereby become a processor of the customer service.", "They act outside their assignment and may become a controller themselves for that.", "The organisation is not liable for this, because it was their own choice."], "answer": 2, "feedback": ["Having access is not permission; processing is allowed only on instructions.", "An employee does not become a processor; they either remain under authority, or they act for themselves.", "Correct. Outside the assignment they act for themselves, with possible consequences for them personally; the organisation must prevent this with instructions and access rights.", "The organisation must demonstrate that it had appropriate instructions and access rights; it is not automatically off the hook."]}, {"q": "An employer passes salary data to the health insurance fund, which uses them for reimbursements. How do you qualify both?", "options": ["Joint controllers, because they use the same data.", "Separate controllers, each with a purpose of its own.", "The employer is the processor of the health insurance fund for the salary data.", "The health insurance fund is the processor of the employer for the reimbursements."], "answer": 1, "feedback": ["Using the same data does not make you joint; determining the purpose together does.", "Correct. Two processing operations that follow on from each other, each with its own purpose: paying salaries and reimbursing.", "The employer does not work on behalf of the health insurance fund; it has its own purpose.", "The health insurance fund decides itself what it uses the data for; it does not execute on instructions."]}, {"q": "Two university colleges manage one registration file together for a joint fair and decide together on purpose and data. What does the GDPR ask of them?", "options": ["A transparent arrangement between them on who does what.", "A processing agreement in which one college becomes the processor of the other.", "Nothing in particular, as long as each college has its own privacy notice.", "Prior authorisation from the supervisory authority for the shared file."], "answer": 0, "feedback": ["Correct. And whatever they agree, the data subject may turn to each of them.", "Neither of them works for the other; a processing agreement does not fit here.", "Joint controllers must lay down their responsibilities among themselves.", "The GDPR has no general prior authorisation; they make the arrangement themselves."]}, {"q": "How do you find out in the GDPR whether an obligation rests on the controller, the processor or both?", "options": ["That is only in the EDPB guidelines, not in the Regulation itself.", "All obligations always rest on both roles, without distinction.", "The opening words of every obligation say who has to comply with it.", "That must be agreed per contract; the Regulation says nothing about it."], "answer": 2, "feedback": ["The Regulation itself names the bearer of every obligation; guidelines only clarify.", "Some obligations apply to both, others only to one role, such as the risk assessment (controller) or processing on instructions (processor).", "Correct. 'The controller', 'the processor' or both: the first words of the article say it.", "A contract divides the execution, but the legal bearer of every obligation is in the Regulation."]}]}, {"id": "kwalificatie", "title": "Qualification exercises", "intro": "Fifty short situations. Each time the question: which role does this party have? Controller, processor, joint or separate controllers, data subject, or no role of its own because someone acts under authority.", "questions": [{"q": "A bakery keeps a loyalty card with the names and purchases of its customers. What is the bakery?", "options": ["Controller", "Processor", "Joint controllers", "No role of its own: acts under authority"], "answer": 0, "feedback": ["Correct. The bakery decides itself for what (customer loyalty) and which data: controller.", "Not correct. The bakery decides itself for what (customer loyalty) and which data: controller.", "Not correct. The bakery decides itself for what (customer loyalty) and which data: controller.", "Not correct. The bakery decides itself for what (customer loyalty) and which data: controller."]}, {"q": "A payroll office calculates the salaries for an employer on the basis of what the employer supplies. What is the payroll office for that salary calculation?", "options": ["Controller", "Processor", "Joint controllers", "Separate controllers"], "answer": 1, "feedback": ["Not correct. It calculates on the instructions and according to the directions of the employer: processor.", "Correct. It calculates on the instructions and according to the directions of the employer: processor.", "Not correct. It calculates on the instructions and according to the directions of the employer: processor.", "Not correct. It calculates on the instructions and according to the directions of the employer: processor."]}, {"q": "An employee of the HR department consults personnel files to prepare the payslips. What is this employee?", "options": ["Processor", "Controller", "No role of its own: acts under authority", "Data subject"], "answer": 2, "feedback": ["Not correct. An employee acts under the authority of the organisation and has no role of their own.", "Not correct. An employee acts under the authority of the organisation and has no role of their own.", "Correct. An employee acts under the authority of the organisation and has no role of their own.", "Not correct. An employee acts under the authority of the organisation and has no role of their own."]}, {"q": "A patient whose file is kept by the hospital. What is the patient?", "options": ["Controller", "Data subject", "Processor", "No role of its own: acts under authority"], "answer": 1, "feedback": ["Not correct. The natural pers rmines purposes and means; the agency executes: processor.", "Not correct. The client determines purposes and means; the agency executes: processor."]}, {"q": "A marketing agency receives only the assignment 'bring in enrolments', chooses sources, data and retention period itself, and reuses the list for other clients. What is the agency?", "options": ["Processor", "No role of its own: acts under authority", "Controller", "Data subject"], "answer": 2, "feedback": ["Not correct. It determines purposes and means itself: it becomes a controller itself.", "Not correct. It determines purposes and means itself: it becomes a controller itself.", "Correct. It determines purposes and means itself: it becomes a controller itself.", "Not correct. It determines purposes and means itself: it becomes a controller itself."]}, {"q": "A self-employed accountant keeps the books of an SME and in doing so processes data of the SME's customers and staff, according to the SME's instructions. What is the accountant?", "options": ["Controller", "No role of its own: acts under authority", "Joint controllers", "Processor"], "answer": 3, "feedback": ["Not correct. A natural person can be a processor: he processes on behalf of the SME.", "Not correct. A natural person can be a processor: he processes on behalf of the SME.", "Not correct. A natural person can be a processor: he processes on behalf of the SME.", "Correct. A natural person can be a processor: he processes on behalf of the SME."]}, {"q": "The same accountant keeps his own client file with the contact details of his clients. What is he for that file?", "options": ["Controller", "Processor", "No role of its own: acts under authority", "Data subject"], "answer": 0, "feedback": ["Correct. For his own client administration he determines purposes and means himself.", "Not correct. For his own client administration he determines purposes and means himself.", "Not correct. For his own client administration he determines purposes and means himself.", "Not correct. For his own client administration he determines purposes and means himself."]}, {"q": "A pupil about whom the school keeps a file. What is the pupil?", "options": ["Controller", "Data subject", "Processor", "No role of its own: acts under authority"], "answer": 1, "feedback": ["Not correct. The data subject is the natural person the data are about.", "Correct. The data subject is the natural person the data are about.", "Not correct. The data subject is the natural person the data are about.", "Not correct. The data subject is the natural person the data are about."]}, {"q": "An IT department within a hospital manages the servers with patient files. What is the IT department?", "options": ["Processor", "Controller", "No role of its own: acts under authority", "Joint controllers"], "answer": 2, "feedback": ["Not correct. An internal department is not a separate party; the hospital itself is the controller.", "Not correct. An internal department is not a separate party; the hospital itself is the controller.", "Correct. An internal department is not a separate party; the hospital itself is the controller.", "Not correct. An internal department is not a separate party; the hospital itself is the controller."]}, {"q": "An external IT company manages, on instructions and under contract, the servers with patient files of a hospital. What is the IT company?", "options": ["Controller", "No role of its own: acts under authority", "Joint controllers", "Processor"], "answer": 3, "feedback": ["Not correct. An external party that processes on behalf of the hospital: processor.", "Not correct. An external party that processes on behalf of the hospital: processor.", "Not correct. An external party that processes on behalf of the hospital: processor.", "Correct. An external party that processes on behalf of the hospital: processor."]}, {"q": "An association keeps a list of members. What is the association?", "options": ["Controller", "Processor", "Data sub
