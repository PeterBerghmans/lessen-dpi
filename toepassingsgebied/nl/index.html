<!DOCTYPE html>
<html lang="nl" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 3 · Wanneer geldt de AVG?</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);

": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "Wanneer geldt de AVG?", "subtitle": "Het materiële en territoriale toepassingsgebied, uitgelegd aan de hand van situaties uit de praktijk", "script": "Een collega van de internationale business school stuurt me een mail. Ze werft studenten in India en Vietnam voor een Engelstalig programma. Haar vraag: die jongeren zijn geen Europeanen en ze zitten in Azië… dus de AVG speelt hier toch niet? Ik hoor die redenering vaak. En ze klinkt logisch. Ze is alleen fout. Waarom, dat leg ik je in het komende kwartier uit. Na afloop kun je bij elke situatie twee vragen stellen en beantwoorden: gaat het hier om een verwerking waarop de AVG slaat, en valt deze organisatie onder haar bereik? Je zult ook weten waar de AVG stopt: bij een gesprek aan de koffiemachine, bij je privé-adresboek, bij een bedrijf dat niets met Europa te maken heeft. Laten we beginnen met de eerste vraag."}, {"id": 2, "type": "quote", "chip": "Materieel toepassingsgebied", "title": "De AVG geldt voor geautomatiseerde verwerking en voor gegevens in een bestand", "source": "Artikel 2, lid 1 AVG", "quote": "Deze verordening is van toepassing op de geheel of gedeeltelijk geautomatiseerde verwerking, alsmede op de verwerking van persoonsgegevens die in een bestand zijn opgenomen of die bestemd zijn om daarin te worden opgenomen.", "bullets": [{"k": "Geheel of gedeeltelijk geautomatiseerd", "t": "alles wat via een computer, een app, een mailbox of een camera loopt, ook als een mens ertussen zit."}, {"k": "Of in een bestand", "t": "ook papier telt, zodra het gestructureerd en doorzoekbaar is: een dossierkast op naam, een fichebak, een klasmap."}, {"k": "Dus niet", "t": "het louter menselijke: een gesprek, een herinnering, iets wat je iemand toevertrouwt zonder het vast te leggen."}], "script": "Eerste vraag: gaat het om een verwerking waarop de AVG slaat? De tekst op de slide is de letterlijke bepaling. Lees ze even mee. Twee gevallen. Eén: de verwerking is geheel of gedeeltelijk geautomatiseerd. Twee: de gegevens zitten in een bestand, of zijn bestemd om erin te komen. Dat eerste geval is vandaag bijna alles. Een mail, een spreadsheet, een foto op je telefoon, een camerabeeld, een chatbericht. Zodra er een computer aan te pas komt, zit je erin. Ook als een mens de knop indrukt. Het tweede geval is papier. Let op, want daar gaat het vaak mis. Een papieren dossierkast met tabbladen op naam is een bestand. Een stapel losse briefjes op je bureau niet. Het verschil is structuur: kun je er volgens bepaalde criteria in zoeken, dan is het een bestand. Onthoud dus: computer of gestructureerd papier, dan is de AVG in beeld.", "read": {"text": "Lees ook de definitie van 'bestand' (artikel 4, punt 6) in de volledige tekst van de AVG.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}}, {"id": 3, "type": "reveal", "chip": "Denkoefening 1", "title": "Het gesprek aan de koffiemachine", "question": "Twee collega's bespreken aan de koffiemachine dat een derde collega al weken afwezig is en dat het 'iets psychisch' zou zijn. Valt dat gesprek onder de AVG?", "verdict": "Nee, maar wacht even", "answer": [{"k": "Geen verwerking in de zin van de AVG", "t": "er wordt niets vastgelegd, niet geautomatiseerd en niet in een bestand: dit is een kwestie van fatsoen en van het recht op privéleven, niet van gegevensbescherming."}, {"k": "Het kantelpunt", "t": "zodra een van beiden dat gesprek noteert in een verslag, een mail stuurt naar HR of het intikt in een personeelsdossier, is er wél een verwerking, en dan nog van gezondheidsgegevens."}, {"k": "De les", "t": "de AVG beschermt gegevens, niet gesprekken; maar het verslag van een gesprek is een gegeven."}], "script": "Eerste denkoefening. Twee collega's staan aan de koffiemachine. Ze hebben het over een derde collega die al weken afwezig is. Iets psychisch, zegt de ene. Valt dat gesprek onder de AVG? Denk even na. … Nee. Er wordt niets geregistreerd. Geen computer, geen bestand. Dit is een gesprek tussen mensen. Dat kan onbehoorlijk zijn, het kan zelfs een inbreuk zijn op het privéleven van die collega. Maar gegevensbescherming, zoals de AVG die bedoelt, is het niet. De AVG beschermt gegevens. Geen gesprekken. Maar, en nu wordt het interessant: één van de twee gaat terug naar haar bureau en tikt in het verslag van het teamoverleg: collega X afwezig, vermoedelijk psychische oorzaak. Op dat moment is er een verwerking. Onthoud dus: praten valt erbuiten, opschrijven valt erbinnen. En de grens tussen die twee is een verslag."}, {"id": 4, "type": "reveal", "chip": "Denkoefening 2", "title": "Het professionele e-mailadres", "question": "Een leverancier bewaart in zijn klantensysteem het adres jan.peeters@bedrijf.be, met de naam en de functie van Jan. 'Dat is professioneel, dus geen persoonsgegeven', zegt hij. Klopt dat?", "verdict": "Nee", "answer": [{"k": "Een persoonsgegeven is een persoonsgegeven", "t": "de AVG maakt geen onderscheid tussen privé en professioneel; het gaat om informatie over een identificeerbare natuurlijke persoon, en Jan is dat."}, {"k": "Wat er wél buiten valt", "t": "gegevens over de rechtspersoon zelf: de naam van het bedrijf, het ondernemingsnummer, info@bedrijf.be zonder verwijzing naar een persoon."}, {"k": "De praktijk", "t": "een CRM vol contactpersonen bij klanten is een verwerking van persoonsgegevens, met alles wat daarbij hoort."}], "script": "Tweede denkoefening, en dit is een klassieker. Een leverancier bewaart in zijn klantensysteem het adres jan punt peeters at bedrijf punt be. Met naam en functie. Hij zegt: dat is een professioneel gegeven, dus geen persoonsgegeven. Klopt dat? Denk even na. … Nee. En ik zeg het met nadruk, omdat ik dit misverstand vaak tegenkom. De AVG kent geen categorie professionele gegevens die erbuiten valt. De definitie is: alle informatie over een identificeerbare natuurlijke persoon. Jan is een natuurlijke persoon. Zijn werkadres zegt wie hij is, waar hij werkt en wat hij doet. Dus: persoonsgegeven. Wat valt er dan wél buiten? Gegevens over de rechtspersoon zelf. De naam van het bedrijf, het ondernemingsnummer, het algemene adres info at bedrijf punt be. Daar zit geen mens achter. Maar zodra er een naam bij staat, of een adres dat naar één persoon leidt, ben je terug bij persoonsgegevens. Onthoud dus: professioneel of privé maakt geen verschil. Alleen de vraag of er een mens achter zit."}, {"id": 5, "type": "quote", "chip": "De uitzondering", "title": "De huishoudelijke uitzondering: zuiver persoonlijk of huishoudelijk", "source": "Artikel 2, lid 2, c AVG · overweging 18", "quote": "Deze verordening is niet van toepassing op de verwerking van persoonsgegevens: […] c) door een natuurlijke persoon bij de uitoefening van een zuiver persoonlijke of huishoudelijke activiteit;", "bullets": [{"k": "Wat eronder valt", "t": "je eigen adresboek, je familiefoto's, je privécorrespondentie, je persoonlijke gebruik van sociale media."}, {"k": "Wat er niet onder valt", "t": "alles wat verband houdt met een beroeps- of handelsactiviteit, en alles wat de privésfeer verlaat, zoals publiceren voor een onbepaald publiek."}, {"k": "Wie er wél onder blijft", "t": "de aanbieder van de middelen, zoals het sociale netwerk of de cloudopslag, moet de AVG gewoon naleven."}], "script": "Er is één uitzondering die je moet kennen. De huishoudelijke uitzondering. De tekst staat op de slide: de AVG geldt niet voor een natuurlijke persoon bij een zuiver persoonlijke of huishoudelijke activiteit. Wat is dat? Je adresboek met de verjaardagen van je vrienden. Je familiefoto's. Je berichten in de familiegroep. Je eigen sociale media, voor je eigen kring. Voor deze uitzondering gelden twee grenzen. De eerste: zodra er een verband is met een beroep of een handelsactiviteit, ben je eruit. Je klantenlijst is nooit huishoudelijk, ook niet als ze op je privételefoon staat. De tweede grens: zodra je de privésfeer verlaat. Een foto van je kinderen in de familiegroep is huishoudelijk. Diezelfde foto openbaar op het internet zetten, voor iedereen zichtbaar, is dat niet meer.", "read": {"text": "Lees overweging 18 voor de voorbeelden die de wetgever zelf geeft (zoek in de tekst naar '(18)').", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}}, {"id": 6, "type": "reveal", "chip": "Denkoefening 3", "title": "De camera aan de voordeur", "question": "Een bewoner hangt na enkele inbraakpogingen een camera aan zijn gevel. Die filmt zijn oprit, maar ook een stuk van het voetpad en de straat. Zuiver huishoudelijk?", "verdict": "Nee", "answer": [{"k": "Het principe", "t": "een camera die ook de openbare weg filmt, valt buiten de huishoudelijke uitzondering: de beelden verlaten de privésfeer."}, {"k": "Het gevolg", "t": "de bewoner is verwerkingsverantwoordelijke en moet de AVG naleven."}, {"k": "De vuistregel", "t": "wat de eigen woning en tuin niet verlaat, is huishoudelijk; wat de openbare ruimte of andermans eigendom vastlegt, niet."}], "script": "Derde denkoefening. Na enkele inbraakpogingen hangt een bewoner een camera aan zijn gevel. Die filmt de oprit. Maar ook een stuk voetpad en de straat. Is dat een zuiver huishoudelijke activiteit? Denk even na. … Nee. Dit is geen mening van mij, dit is beslist door het Europees Hof van Justitie, in de zaak Ryneš. Een Tsjechische bewoner, exact deze situatie. Het Hof zei: zodra de camera de openbare ruimte filmt, verlaten de beelden de privésfeer van de bewoner. En dan is de uitzondering weg. Die bewoner wordt verwerkingsverantwoordelijke, met alle verplichtingen. De vuistregel is eenvoudig. Wat binnen je eigen woning en tuin blijft, is huishoudelijk. Wat de straat, het voetpad of de tuin van de buren vastlegt, niet. Onthoud dus: de huishoudelijke uitzondering stopt aan je perceelsgrens."}, {"id": 7, "type": "bullets", "chip": "Voor wie geschreven", "title": "De AVG legt plichten op aan wie verwerkt, en geeft rechten aan over wie het gaat", "bullets": [{"k": "Verwerkingsverantwoordelijke en verwerker", "t": "de organisatie, het bedrijf of de persoon die persoonsgegevens verwerkt: zij moeten de regels naleven, ongeacht hun grootte."}, {"k": "De betrokkene", "t": "de mens over wie de gegevens gaan: die krijgt rechten, zoals inzage, correctie en bezwaar, en kan ze inroepen tegen de verwerker."}, {"k": "Nationaliteit speelt geen rol", "t": "de bescherming geldt voor natuurlijke personen, ongeacht hun nationaliteit of verblijfplaats; een toerist in Brussel heeft dezelfde rechten als een Belg."}], "script": "We hebben de eerste vraag beantwoord: is er een verwerking waarop de AVG slaat? Nu de tweede: voor wie is de AVG geschreven? Drie dingen. Eén. De AVG richt zich in de eerste plaats tot wie verwerkt. De organisatie, het bedrijf, de overheid, de vereniging, en soms de persoon, die persoonsgegevens verwerkt. Zij krijgen de plichten. De verwerkingsverantwoordelijke en de verwerker, twee begrippen die we later nog uitdiepen. Twee. De AVG spreekt ook de betrokkene aan. De mens over wie de gegevens gaan. Die krijgt rechten: inzage, correctie, bezwaar. En die kan ze inroepen. Drie, en dit is het punt waar de mail van mijn collega over ging. De bescherming geldt voor natuurlijke personen, ongeacht hun nationaliteit of verblijfplaats. Zo staat het in de overwegingen. Een Chinese toerist die in een Brussels hotel incheckt, krijgt exact dezelfde rechten als een Belg. Het hotel verwerkt zijn gegevens onder de AVG. Onthoud dus: de AVG kijkt naar wie verwerkt, niet naar het paspoort van de betrokkene.", "read": {"text": "Lees overweging 14: de bescherming geldt ongeacht nationaliteit of verblijfplaats (zoek naar '(14)').", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}}, {"id": 8, "type": "quote", "chip": "Territoriaal toepassingsgebied", "title": "Gevestigd in de Unie: de AVG geldt, waar de verwerking ook gebeurt", "source": "Artikel 3, lid 1 AVG", "quote": "Deze verordening is van toepassing op de verwerking van persoonsgegevens in het kader van de activiteiten van een vestiging van een verwerkingsverantwoordelijke of een verwerker in de Unie, ongeacht of de verwerking in de Unie al dan niet plaatsvindt.", "bullets": [{"k": "Vestiging", "t": "een effectieve en duurzame activiteit in de Unie; de rechtsvorm doet er niet toe, een kantoor of bijhuis volstaat."}, {"k": "Waar de verwerking gebeurt, telt niet", "t": "laat een Belgisch bedrijf zijn gegevens verwerken door een callcenter in Marokko of een cloud in de VS, dan blijft de AVG gelden."}, {"k": "Waar de betrokkene zit, telt ook niet", "t": "een Belgische business school die gegevens verwerkt van kandidaten in India, doet dat onder de AVG."}], "script": "Nu de plaats. Waar moet je zitten om onder de AVG te vallen? De eerste regel staat op de slide. Ben je gevestigd in de Unie, dan geldt de AVG voor alles wat je in het kader van die vestiging doet. Ongeacht of de verwerking zelf in de Unie plaatsvindt. Dat laatste is belangrijk. Een Belgisch bedrijf dat zijn klantendienst uitbesteedt aan een callcenter in Marokko, of zijn gegevens opslaat bij een Amerikaanse cloud: de AVG blijft gelden. En nog iets wat er niet staat, maar wat eruit volgt: het maakt ook niet uit waar de betrokkene zit. Terug naar de mail van mijn collega. De business school is gevestigd in België. Werft ze studenten in India, dan verwerkt ze persoonsgegevens in het kader van de activiteiten van een vestiging in de Unie. Punt. Dat die kandidaten in India zitten en geen Europeanen zijn, verandert daar niets aan. Onthoud dus: gevestigd in de Unie, dan volgt de AVG je overal.", "read": {"text": "Lees overweging 22 over wat 'vestiging' betekent (zoek naar '(22)').", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}}, {"id": 9, "type": "quote", "chip": "Territoriaal toepassingsgebied", "title": "Niet gevestigd in de Unie: de AVG geldt zodra je je op mensen in de Unie richt", "source": "Artikel 3, lid 2 AVG · overweging 23 en 24", "quote": "Deze verordening is van toepassing op de verwerking van persoonsgegevens van betrokkenen die zich in de Unie bevinden, door een niet in de Unie gevestigde verwerkingsverantwoordelijke of verwerker, wanneer de verwerking verband houdt met: a) het aanbieden van goederen of diensten aan deze betrokkenen in de Unie, ongeacht of een betaling door de betrokkenen is vereist; of b) het monitoren van hun gedrag, voor zover dit gedrag in de Unie plaatsvindt.", "bullets": [{"k": "Goederen of diensten aanbieden", "t": "een Amerikaanse webshop met een Nederlandstalige site, prijzen in euro en levering in België richt zich klaarblijkelijk op de Unie; een website die toevallig bereikbaar is, niet."}, {"k": "Gedrag monitoren", "t": "een Chinese app die het surfgedrag van gebruikers in Europa volgt en profileert, valt eronder, ook zonder kantoor in Europa."}, {"k": "Betaling is niet vereist", "t": "ook een gratis dienst, betaald met je gegevens, telt."}], "script": "Tweede regel, voor wie niet in de Unie gevestigd is. Een Amerikaans, Chinees of Braziliaans bedrijf zonder kantoor in Europa. Ook dat valt onder de AVG, in twee gevallen. Het eerste: het biedt goederen of diensten aan aan mensen die zich in de Unie bevinden. Het tweede: het volgt het gedrag van mensen in de Unie. Hoe weet je of een bedrijf zich op de Unie richt? De wetgever geeft aanwijzingen. Een website in het Nederlands of het Frans. Prijzen in euro. Levering in België. Klanten in de Unie vermelden. Alleen een website die toevallig vanuit Europa bereikbaar is, volstaat niet. Er moet een duidelijke bedoeling zijn. En het tweede geval, het monitoren: denk aan een app of een advertentienetwerk dat je surfgedrag volgt en een profiel van je opbouwt. Ook zonder één werknemer in Europa valt dat eronder. Let op het detail: of je betaalt, speelt geen rol. Gratis diensten, betaald met je gegevens, tellen mee. Onthoud dus: wie zich op de Europese markt richt, speelt volgens de Europese regels. Ook van ver.", "read": {"text": "Lees overweging 23 en 24 voor de aanwijzingen van 'gericht op de Unie' en 'monitoren van gedrag' (zoek naar '(23)').", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}}, {"id": 10, "type": "reveal", "chip": "Denkoefening 4", "title": "De Chinese toerist en de Amerikaanse webshop", "question": "Een Chinese toerist boekt vanuit Shanghai een hotel in Brugge via een Amerikaanse boekingssite die een Nederlandstalige versie heeft en in euro afrekent. Wie valt hier onder de AVG?", "verdict": "Het hotel én de boekingssite", "answer": [{"k": "Het hotel", "t": "gevestigd in de Unie, dus de AVG geldt voor al zijn verwerkingen; de nationaliteit van de gast speelt geen rol."}, {"k": "De boekingssite", "t": "niet gevestigd in de Unie, maar richt zich klaarblijkelijk op de Unie (taal, euro, hotels in België): de AVG geldt voor de gegevens van betrokkenen in de Unie."}, {"k": "Nuance", "t": "op het moment van boeken zit de toerist nog in China; zodra hij in Brugge incheckt, bevindt hij zich in de Unie en gelden de regels ook voor de site zonder discussie."}], "script": "Vierde denkoefening, en nu combineren we alles. Een Chinese toerist boekt vanuit Shanghai een hotel in Brugge. Hij doet dat via een Amerikaanse boekingssite, met een Nederlandstalige versie, die afrekent in euro. Wie valt hier onder de AVG? Denk even na. … Het hotel, zeker. Het is gevestigd in de Unie. Dat de gast Chinees is, doet er niet toe. En de boekingssite? Die zit in de Verenigde Staten. Maar ze richt zich duidelijk op de Europese markt: de taal, de munt, de hotels in België. Dus ook zij valt onder de AVG, voor de gegevens van mensen die zich in de Unie bevinden. Eén nuance voor de puristen. Op het moment van boeken zit onze toerist nog in Shanghai. Zodra hij in Brugge incheckt en de site zijn gegevens verder verwerkt, bevindt hij zich in de Unie, en is er geen discussie meer. Onthoud dus: bij elke partij stel je apart de vraag. Gevestigd in de Unie? Of gericht op de Unie?"}, {"id": 12, "type": "reveal", "chip": "Denkoefening 5", "title": "Een business school werft studenten in het buitenland", "question": "De business school voert marketingcampagnes in India en Vietnam voor haar internationale programma's en verzamelt daarbij namen, e-mailadressen en studieresultaten van kandidaten. Wat betekent dat concreet?", "verdict": "De AVG geldt volledig", "answer": [{"k": "Waarom", "t": "De business school is gevestigd in de Unie; de verwerking gebeurt in het kader van haar activiteiten, waar de kandidaten ook zitten en welke nationaliteit ze ook hebben."}, {"k": "Wat dat vraagt", "t": "een privacyverklaring die de kandidaten transparant uitlegt welke gegevens de business school verzamelt, waarom, hoelang ze die bewaart en welke rechten ze hebben, in een taal die zij begrijpen."}, {"k": "En de kandidaten zelf", "t": "kunnen vanuit India hun rechten uitoefenen: inzage vragen, hun gegevens laten corrigeren, bezwaar maken tegen verdere marketing."}], "script": "Terug naar de mail waarmee we begonnen, als vijfde en laatste denkoefening. De business school voert marketingcampagnes in India en Vietnam. Ze verzamelt namen, e-mailadressen en studieresultaten van kandidaten. Wat betekent dat concreet? Denk even na. … De AVG geldt, volledig. De business school is gevestigd in de Unie en verwerkt die gegevens in het kader van haar eigen activiteiten. Waar de kandidaten zitten, speelt geen rol. Welk paspoort ze hebben, ook niet. Wat vraagt dat in de praktijk? Om te beginnen een privacyverklaring die die kandidaten op een transparante manier uitlegt wat er met hun gegevens gebeurt. Welke gegevens, waarvoor, hoelang, en welke rechten ze hebben. In een taal die ze begrijpen, dus wellicht niet alleen in het Nederlands. En die kandidaten kunnen hun rechten ook effectief uitoefenen. Een student in Mumbai die vraagt om zijn gegevens te wissen na een afgewezen aanvraag, heeft daar even veel recht op als een student uit België. Mijn antwoord aan mijn collega was dus kort. Ja, de AVG speelt. En eerlijk gezegd: het maakt de campagne niet moeilijker. Alleen netter."}, {"id": 13, "type": "chain", "chip": "Methode", "title": "De toets in vier stappen, bij elke nieuwe situatie", "steps": [{"k": "1. Persoonsgegevens?", "t": "gaat de informatie over een identificeerbare natuurlijke persoon, privé of professioneel?"}, {"k": "2. Geautomatiseerd of in een bestand?", "t": "komt er een computer aan te pas, of zit het in gestructureerd papier? Alleen praten valt erbuiten."}, {"k": "3. Een uitzondering?", "t": "is het een zuiver persoonlijke of huishoudelijke activiteit die de privésfeer niet verlaat?"}, {"k": "4. Vestiging in de Unie, of gericht op de Unie?", "t": "zo ja, dan geldt de AVG, waar de verwerking ook gebeurt en wie de betrokkene ook is."}], "script": "Kort samengevat, in vier stappen die je bij elke nieuwe situatie kunt afgaan. Eén: gaat het om persoonsgegevens? Informatie over een identificeerbare mens, en of dat privé of professioneel is, doet er niet toe. Twee: is de verwerking geautomatiseerd, of zitten de gegevens in een bestand? Zo ja, dan is de AVG in beeld. Alleen praten valt erbuiten, opschrijven niet. Drie: is er een uitzondering? Zuiver persoonlijk of huishoudelijk, zonder verband met een beroep en zonder de privésfeer te verlaten. Dat is een smalle poort. Vier: is de organisatie gevestigd in de Unie, of richt ze zich op mensen in de Unie? Zo ja, dan geldt de AVG. Waar de verwerking ook gebeurt en welke nationaliteit de betrokkene ook heeft. Vier vragen. Beantwoord ze in die volgorde, en je hebt het toepassingsgebied onder de knie."}, {"id": 14, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "De AVG geldt zodra persoonsgegevens geautomatiseerd of in een bestand worden verwerkt, door wie in de Unie gevestigd is of zich op de Unie richt, en wie de betrokkene is of waar hij woont, speelt geen rol.", "bullets": [{"k": "Praten valt erbuiten, opschrijven erbinnen", "t": "gegevensbescherming begint bij de registratie; het verslag van een gesprek is een verwerking."}, {"k": "Professioneel is ook persoonlijk", "t": "een werkadres of een contactpersoon bij een klant is een persoonsgegeven; alleen de rechtspersoon zelf valt erbuiten."}, {"k": "De huishoudelijke uitzondering is smal", "t": "ze stopt bij elk verband met een beroep en bij alles wat de privésfeer verlaat, zoals een camera op de straat."}, {"k": "Vestiging of gerichtheid", "t": "in de Unie gevestigd: de AVG volgt je overal; van buiten de Unie: ze geldt zodra je je op mensen in de Unie richt."}], "script": "Wat neem je mee? Eén kernzin: de AVG geldt zodra persoonsgegevens geautomatiseerd of in een bestand worden verwerkt, door iemand die in de Unie gevestigd is of zich op de Unie richt. En wie de betrokkene is, of waar hij woont, speelt geen rol. Daarnaast vier dingen. Praten valt erbuiten, opschrijven erbinnen. Professioneel is ook persoonlijk. De huishoudelijke uitzondering is smal en stopt aan je perceelsgrens. En: gevestigd in de Unie, dan volgt de AVG je overal; van buiten de Unie geldt ze zodra je je op ons richt. Voor je naar de oefenvragen gaat, één opdracht. Zet de audio stil en denk aan één verwerking in je eigen organisatie waarvan iemand ooit beweerde dat de AVG er niet op sloeg. Een lijst met leverancierscontacten, een camera, een gesprek dat toch werd genoteerd. Ga de vier stappen af. Grote kans dat de AVG er gewoon op van toepassing is. Daarna zijn er tien vragen om te toetsen of je het toepassingsgebied beheerst."}], "quiz": [{"q": "Twee collega's bespreken mondeling de gezondheid van een derde collega. Een van hen noteert dat nadien in het verslag van het teamoverleg. Wat geldt?", "options": ["Het gesprek valt onder de AVG, het verslag niet, want dat blijft intern bij het team.", "Het gesprek noch het verslag vallen onder de AVG: het blijft binnen het team.", "Het gesprek valt niet onder de AVG, het verslag wel: dat is een verwerking.", "Beide vallen onder de AVG, want het gaat om gezondheidsgegevens van een collega."], "answer": 2, "feedback": ["Net omgekeerd: het gesprek wordt niet geregistreerd en valt erbuiten; het verslag is een verwerking in een document op een computer.", "Intern of niet speelt geen rol. Zodra iets in een document wordt vastgelegd, is er een geautomatiseerde verwerking.", "Juist. De AVG beschermt gegevens, niet gesprekken; het verslag is een verwerking, en dan nog van gezondheidsgegevens.", "Het gesprek zelf is geen verwerking in de zin van de AVG: er is geen automatisering en geen bestand."]}, {"q": "Wanneer valt een papieren dossier onder de AVG?", "options": ["Nooit: de AVG geldt alleen voor gegevens die op een computer worden verwerkt.", "Alleen als het later zal worden ingescand of overgetypt in een computer.", "Altijd: elk papier met een naam erop is een bestand in de zin van de AVG.", "Als het gestructureerd en doorzoekbaar is, zoals een dossierkast op naam."], "answer": 3, "feedback": ["De AVG geldt ook voor niet-geautomatiseerde verwerking, zodra de gegevens in een bestand zitten of daarvoor bestemd zijn.", "Inscannen maakt het geautomatiseerd, maar ook zonder scan valt gestructureerd papier eronder.", "Een losse notitie of een stapel ongeordende briefjes is geen bestand; er moet structuur zijn.", "Juist. Een bestand is een gestructureerd geheel dat volgens bepaalde criteria toegankelijk is; structuur is het criterium, niet de drager."]}, {"q": "Een bedrijf bewaart in zijn CRM de naam, functie en het werk-e-mailadres van contactpersonen bij klanten. Wat is de juiste kwalificatie?", "options": ["Bedrijfsgegevens: ze vallen buiten de AVG omdat ze in een professionele context worden gebruikt.", "Persoonsgegevens: professioneel of privé maakt geen verschil.", "Gegevens over rechtspersonen: de AVG beschermt alleen consumenten, geen werknemers van klanten.", "Persoonsgegevens, maar de AVG geldt pas als de contactpersoon daarvoor toestemming gaf."], "answer": 1, "feedback": ["De AVG kent geen uitzondering voor professionele gegevens; alleen gegevens over de rechtspersoon zelf vallen erbuiten.", "Juist. Naam, functie en werkadres gaan over een identificeerbare natuurlijke persoon en zijn dus persoonsgegevens.", "De contactpersoon is een natuurlijke persoon; de AVG beschermt natuurlijke personen in elke hoedanigheid, ook als werknemer.", "Toestemming is een van de rechtsgronden, geen voorwaarde om onder de AVG te vallen. De AVG geldt zodra er persoonsgegevens verwerkt worden."]}, {"q": "Welke van deze activiteiten valt onder de huishoudelijke uitzondering?", "options": ["Een gezin dat vakantiefoto's deelt in een besloten familiegroep.", "Een zelfstandige die zijn klantenlijst op zijn privételefoon bewaart.", "Een bewoner die met een gevelcamera ook het voetpad en de straat filmt.", "Een vereniging die haar ledenlijst bijhoudt in een spreadsheet."], "answer": 0, "feedback": ["Juist. Foto's delen binnen de eigen familiekring is een zuiver persoonlijke activiteit die de privésfeer niet verlaat.", "Een klantenlijst houdt verband met een beroepsactiviteit, ook op een privételefoon; dat is nooit huishoudelijk.", "Beelden van de openbare weg verlaten de privésfeer; het Hof van Justitie besliste in de zaak Ryneš dat de uitzondering dan niet geldt.", "Een vereniging is geen natuurlijke persoon en de ledenlijst dient het verenigingsleven; de AVG geldt gewoon."]}, {"q": "Een privépersoon bewaart zijn familiefoto's en zijn adresboek in een clouddienst van een groot technologiebedrijf. Wat geldt?", "options": ["De AVG geldt voor beiden: zodra gegevens in de cloud staan, vervalt de huishoudelijke uitzondering.", "De AVG geldt voor geen van beiden: het gaat om een zuiver persoonlijke activiteit.", "De AVG geldt alleen voor de privépersoon, want hij beslist wat er in de cloud wordt bewaard.", "De privépersoon valt onder de huishoudelijke uitzondering, maar de clouddienst moet de AVG naleven."], "answer": 3, "feedback": ["De uitzondering hangt af van de activiteit van de persoon, niet van de plaats van opslag; voor hem blijft ze gelden.", "De uitzondering geldt alleen voor de natuurlijke persoon; de aanbieder van de middelen valt uitdrukkelijk wél onder de AVG.", "Net omgekeerd: de privépersoon is vrijgesteld, de clouddienst niet.", "Juist. De wetgever zegt uitdrukkelijk dat de verordening wel geldt voor wie de middelen verschaft voor persoonlijke of huishoudelijke activiteiten, zoals de clouddienst."]}, {"q": "Een Belgisch bedrijf laat zijn klantengegevens verwerken door een callcenter in Marokko. Geldt de AVG voor die verwerking?", "options": ["Nee: de verwerking gebeurt buiten de Unie, dus geldt het Marokkaanse recht.", "Alleen als de klanten uitdrukkelijk met de uitbesteding hebben ingestemd.", "Ja: het bedrijf is gevestigd in de Unie, waar de verwerking ook gebeurt.", "Alleen voor de klanten met de Belgische nationaliteit of een woonplaats in België."], "answer": 2, "feedback": ["De plaats van de verwerking is niet bepalend; de vestiging van de verwerkingsverantwoordelijke in de Unie wel.", "Instemming is geen voorwaarde voor de toepasselijkheid van de AVG; de uitbesteding vraagt wel andere waarborgen, die we later bekijken.", "Juist. De AVG geldt voor verwerking in het kader van de activiteiten van een vestiging in de Unie, waar die verwerking ook gebeurt.", "Nationaliteit speelt geen rol: de AVG beschermt natuurlijke personen ongeacht hun nationaliteit of verblijfplaats."]}, {"q": "Een Amerikaanse webshop zonder vestiging in Europa heeft een Nederlandstalige site, rekent af in euro en levert in België. Valt zij onder de AVG?", "options": ["Nee, want zij heeft geen vestiging en geen vertegenwoordiger in de Unie.", "Alleen als zij meer dan de helft van haar omzet in Europa haalt.", "Alleen als een Europese klant een klacht indient bij een toezichthouder.", "Ja, want zij richt zich klaarblijkelijk op mensen in de Unie."], "answer": 3, "feedback": ["Een vestiging is niet nodig; de AVG geldt ook voor wie van buiten de Unie goederen of diensten aanbiedt aan mensen in de Unie.", "Er bestaat geen omzetdrempel; het gaat om de klaarblijkelijke bedoeling om zich op de Unie te richten.", "De toepasselijkheid hangt niet af van een klacht; de AVG geldt van bij de eerste verwerking.", "Juist. Taal, munt en levering tonen de bedoeling om zich op de Unie te richten; dan geldt de AVG voor de gegevens van betrokkenen in de Unie."]}, {"q": "Welk element volstaat volgens de AVG op zichzelf níet om te besluiten dat een bedrijf van buiten de Unie zich op de Unie richt?", "options": ["De website is toevallig ook vanuit de Unie bereikbaar.", "De prijzen staan in euro en er kan in het Nederlands besteld worden.", "Het bedrijf vermeldt klanten of gebruikers in de Unie.", "Het bedrijf biedt levering in verschillende lidstaten aan."], "answer": 0, "feedback": ["Juist. De loutere toegankelijkheid van een website vanuit de Unie is op zich ontoereikend; er moet een duidelijke bedoeling blijken.", "Een munt en een taal van een lidstaat, met de mogelijkheid om erin te bestellen, zijn net aanwijzingen dat het bedrijf zich op de Unie richt.", "Het vermelden van klanten in de Unie is een aanwijzing van gerichtheid.", "Levering in lidstaten aanbieden toont de bedoeling om goederen aan betrokkenen in de Unie aan te bieden."]}, {"q": "Een Chinese toerist checkt in bij een hotel in Brugge. Welke rechten heeft hij onder de AVG?", "options": ["Geen: de AVG beschermt alleen burgers van de Unie en mensen die er wonen.", "Dezelfde rechten als een Belgische gast: nationaliteit speelt geen rol.", "Alleen het recht op inzage; de andere rechten zijn voorbehouden aan inwoners van de Unie.", "Alleen als China een gelijkwaardige wet heeft die Belgen dezelfde rechten geeft."], "answer": 1, "feedback": ["De bescherming geldt voor natuurlijke personen, ongeacht hun nationaliteit; het hotel is bovendien gevestigd in de Unie.", "Juist. Het hotel is gevestigd in de Unie en de AVG beschermt elke natuurlijke persoon wiens gegevens het verwerkt.", "De AVG maakt geen onderscheid in rechten volgens nationaliteit of verblijfplaats.", "Wederkerigheid met een ander land speelt geen rol; de AVG geldt op grond van de vestiging van het hotel in de Unie."]}, {"q": "Een Belgische business school werft via marketingcampagnes studenten in India voor een internationaal programma. Wat volgt daaruit?", "options": ["De AVG geldt niet, want de kandidaten zijn geen Europeanen en bevinden zich buiten de Unie.", "De AVG geldt pas zodra een kandidaat effectief in België aankomt en zich inschrijft.", "De AVG geldt volledig, en de hogeschool moet de kandidaten transparant informeren.", "De AVG geldt alleen voor de kandidaten die uiteindelijk worden ingeschreven."], "answer": 2, "feedback": ["De business school is gevestigd in de Unie; waar de kandidaten zitten en welke nationaliteit ze hebben, speelt geen rol.", "De AVG geldt van bij de eerste verwerking, dus al tijdens de campagne, niet pas bij aankomst.", "Juist. De verwerking gebeurt in het kader van de activiteiten van een vestiging in de Unie; een transparante privacyverklaring is een van de gevolgen.", "Ook de gegevens van kandidaten die niet worden ingeschreven, worden verwerkt onder de AVG, inclusief hun rechten op inzage en wissing."]}]}</script>

      case 'summary':
        body = '<div class="keyline">'+esc(s.key)+'</div>'+bullets(s.bullets); break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

  function go(n, play){

    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audiobestand niet gevonden. Controleer of de map "audio" naast dit bestand staat.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  const Q = C.quiz; let qi = 0, answers = [];
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>';
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
</script>
