ieuw.", "result_low": "Bekijk de presentatie nog eens en probeer daarna opnieuw. De feedback bij elke vraag helpt je op weg.", "retry": "Opnieuw oefenen", "review": "Presentatie herbekijken", "your_answer": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "De DPO, toezicht en handhaving", "subtitle": "Toezicht van binnenuit en van buitenaf, de DPO als contactpunt, publieke en private handhaving, en wie in Europa en België toezicht houdt", "script": "Er komt een aangetekende brief binnen van de Gegevensbeschermingsautoriteit. Bij wie belandt die? In de meeste organisaties bij de DPO. Niet omdat de DPO verantwoordelijk is voor wat er misliep. Wel omdat de DPO het contactpunt is van de toezichthouder. In twee delen bekijken we handhaving door de ogen van de DPO. In dit eerste deel leggen we het kader: we bekijken jouw toezichtstaak en je rol als contactpunt, de vormen van handhaving, en wie er in Europa en in België toezicht houdt. In het tweede deel volgen we een dossier bij de Gegevensbeschermingsautoriteit, van de klacht tot het beroep."}, {"id": 2, "type": "bullets", "chip": "Inleiding", "title": "De centrale vraag: wat moet een DPO weten over toezicht en handhaving?", "bullets": [{"k": "Handhaving", "t": "het toezicht op de naleving van de regels en het doen naleven ervan; in België spelen drie wetgevingen een rol: de AVG, de Belgische Gegevensbeschermingswet (de kaderwet, wet van 30 juli 2018) en de oprichtingswet van de GBA (WOG, wet van 3 december 2017)."}, {"k": "Wel", "t": "een praktisch overzicht van het juridische kader, telkens vanuit de invalshoek en de betrokkenheid van de DPO."}, {"k": "Niet", "t": "een exhaustieve uiteenzetting van elk procedureel of juridisch detail; daarvoor schakelt de organisatie haar juridische dienst of een advocaat in."}], "script": "Eerst de afbakening. Handhaving betekent twee dingen: toezien op de naleving van de regels, en ze doen naleven als dat nodig is. Er spelen in België drie wetgevingen een rol: de AVG, de Belgische Gegevensbeschermingswet, ook wel de kaderwet of de wet van 30 juli 2018 genoemd, en de oprichtingswet van de Gegevensbeschermingsautoriteit. De centrale vraag is eenvoudig: wat moet jij als DPO weten over toezicht en handhaving? Je krijgt dus een praktisch overzicht van het juridische kader, telkens vanuit jouw invalshoek. Wat je niet krijgt, is een exhaustieve uiteenzetting van elk procedureel detail. Daarvoor schakelt je organisatie, als het zover komt, haar juridische dienst of een advocaat in. Maar je moet wel weten wanneer dat moment gekomen is."}, {"id": 3, "type": "compare", "chip": "Twee vormen van toezicht", "title": "Toezicht van binnenuit (art. 39 AVG) en van buitenaf (art. 57-58 AVG)", "left": {"head": "De DPO — art. 37 tot 39 AVG", "items": ["Informeert, adviseert en ziet toe op de naleving (art. 39.1, a)-c))", "Werkt samen met de toezichthouder en is er het contactpunt voor (art. 37.7 en 39.1, d)-e))", "Beslist niet: de verantwoordingsplicht ligt bij de verwerkingsverantwoordelijke (art. 5.2 en 24)", "Onafhankelijk en gebonden aan geheimhouding (art. 38.3 en 38.5)"]}, "right": {"head": "De toezichthoudende autoriteit — art. 51 tot 59 AVG", "items": ["Onafhankelijke overheidsinstantie met eigen taken (art. 52 en 57)", "Onderzoeksbevoegdheden (art. 58.1)", "Corrigerende bevoegdheden en administratieve geldboetes (art. 58.2 en 83)", "Rechtsmiddel tegen haar besluiten (art. 78): het Marktenhof"]}, "read": {"text": "Lees artikel 37, lid 7 en de artikelen 38 en 39 AVG: de bekendmaking van de contactgegevens, de positie en de taken van de DPO.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "De DPO ziet toe op de naleving, binnen de organisatie, zoals opgenomen in de AVG. De toezichthouder doet hetzelfde, maar van buitenaf. Jouw werk als DPO is dus het verlengde van dat van de toezichthouder. Maar het is geen kopie. De toezichthouder is een onafhankelijke overheidsinstantie, met een eigen regime. De toezichthouder behandelt klachten, voert onderzoeken, en heeft eigen onderzoeksbevoegdheden. Ook kan de toezichthouder corrigerende maatregelen opleggen, tot administratieve geldboetes. En tegen die besluiten staat een rechtsmiddel open, in België bij het Marktenhof. Jij informeert, adviseert en ziet toe. Je bent onafhankelijk, en gebonden aan geheimhouding. Maar je beslist niet. De verantwoordingsplicht ligt bij de verwerkingsverantwoordelijke, niet bij de DPO. Wat jullie verbindt: je werkt samen met de toezichthouder, en je bent er het contactpunt voor. Daarom deelt je organisatie jouw contactgegevens mee aan de toezichthouder."}, {"id": 4, "type": "cards", "chip": "Het contactpunt", "title": "Jouw rol als contactpunt, in drie richtingen", "cols": 3, "cards": [{"k": "De toezichthouder", "t": "richt zich tot de DPO bij een verzoek tot bemiddeling, een schriftelijke bevraging of een verhoor.", "sub": "Art. 37.7 · 38.5 · 39.1, d) en e) AVG"}, {"k": "De organisatie", "t": "de DPO verzamelt de informatie, ondersteunt de juridische dienst of de advocaat en kent het dossier.", "sub": "Art. 38.1-2 · 39.1, a) en b) AVG"}, {"k": "De betrokkene", "t": "wordt bij een weigering of bij onvrede gewezen op de klacht bij de toezichthouder en het beroep bij de rechter, zoals ook in de privacyverklaring staat (art. 13-14).", "sub": "Art. 12.4 · 13.2, d) · 14.2, e) · 38.4 · 77 AVG", "hl": true}], "read": {"text": "Lees artikel 12, lid 4 AVG: wat je meedeelt als je geen gevolg geeft aan een verzoek.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Die samenwerking met de toezichthouder brengt ons bij jouw rol als contactpunt. Die rol werkt in drie richtingen. De eerste richting is de toezichthouder, die zich tot jou richt bij een verzoek tot bemiddeling, bij een schriftelijke bevraging of bij een verhoor. De tweede richting is de organisatie. Daarbinnen verzamel jij de informatie. Je ondersteunt de juridische dienst of de advocaat, en je kent het dossier. De derde richting is de betrokkene. Geef je geen gevolg aan een verzoek, dan deel je mee waarom niet. En je informeert de betrokkene over de mogelijkheid om klacht in te dienen bij de toezichthouder, en om naar de rechter te stappen. Neemt de betrokkene geen genoegen met een antwoord dat je wel gaf, dan wijs je op de mogelijkheid om klacht in te dienen bij de toezichthouder. Zoals dat ook beschreven staat in de privacyverklaring van de organisatie. Dat voelt misschien vreemd, maar het past bij je rol. En dat veronderstelt één ding: dat je de klachtenprocedure kent, en kunt uitleggen."}, {"id": 5, "type": "bullets", "chip": "Toezichthouder en organisatie", "title": "Tussen toezichthouder en organisatie: samenwerking en geheimhouding", "bullets": [{"k": "Samenwerkingsplicht", "t": "de DPO werkt samen met de toezichthouder (art. 39.1, d)); ook de verwerkingsverantwoordelijke en de verwerker zelf moeten op verzoek met de toezichthouder samenwerken (art. 31)."}, {"k": "Geheimhouding", "t": "de DPO is gebonden aan geheimhouding of vertrouwelijkheid (art. 38.5); volgens de DPO-richtsnoeren (WP243, onderschreven door de EDPB) belet dat niet dat de DPO contact opneemt met de toezichthouder en er advies vraagt."}, {"k": "Het spanningsveld", "t": "de DPO kent de zwakke plekken van de organisatie het best."}, {"k": "De centrale figuur", "t": "de DPO verzamelt vaak de informatie voor de juridische dienst of de externe advocaat, en is het geheugen van het dossier."}, {"k": "Bescherming", "t": "de DPO mag niet worden ontslagen of gestraft voor de uitvoering van de DPO-taken (art. 38.3)."}], "read": {"text": "Lees de richtsnoeren over functionarissen voor gegevensbescherming (WP243 rev.01), onder meer over geheimhouding en samenwerking met de toezichthouder.", "url": "https://ec.europa.eu/newsroom/article29/items/612048", "label": "Open de richtsnoeren"}, "script": "Als contactpunt sta je tussen de toezichthouder en de organisatie. Je werkt samen met de toezichthouder, en ook je organisatie zelf moet op verzoek samenwerken. Tegelijk ben je gebonden aan geheimhouding of vertrouwelijkheid. Volgens de Europese richtsnoeren over de DPO belet die geheimhouding niet dat je contact opneemt met de toezichthouder, en er advies vraagt. Maar er is een spanningsveld. Jij kent de zwakke plekken van je organisatie het best. In een procedure ben je vaak de centrale figuur. Je verzamelt de informatie voor de juridische dienst of de advocaat, en je bent het geheugen van het dossier. En je bent beschermd: je mag niet worden ontslagen of gestraft omdat je je taken uitvoert."}, {"id": 6, "type": "reveal", "chip": "Denkoefening 1", "title": "De betrokkene neemt geen genoegen met je antwoord", "question": "Een klant vroeg om de wissing van de eigen gegevens. De organisatie wiste een deel, maar bewaart de facturen omdat de boekhoudwetgeving dat oplegt. Je hebt dat gemotiveerd uitgelegd. De klant laat weten het daar niet mee eens te zijn en 'ermee verder te gaan'. Wat doe jij als DPO?", "verdict": "Informeren over klacht, bemiddeling en rechter, niet ontraden, en het dossier klaarleggen", "answer": [{"k": "Informeren", "t": "over de klacht of het verzoek tot bemiddeling bij de GBA (art. 77) en over de rechter (art. 79)."}, {"k": "Niet ontraden", "t": "dat is niet de rol van de DPO."}, {"k": "Dossier", "t": "met de wettelijke grondslag om de facturen te bewaren (art. 17.3, b))."}, {"k": "Verwacht de GBA", "t": "een bericht van de Eerstelijnsdienst, gericht aan de DPO als contactpunt."}], "script": "Tijd voor een eerste denkoefening. Een klant vroeg om de wissing van de eigen gegevens. De organisatie wiste een deel, maar bewaart de facturen, omdat de boekhoudwetgeving dat oplegt. Je hebt dat gemotiveerd uitgelegd. De klant laat weten het daar niet mee eens te zijn, en ermee verder te gaan. Wat doe jij als DPO? Denk even na. … Informeer de klant over een klacht of een verzoek tot bemiddeling bij de Gegevensbeschermingsautoriteit, en over de rechter. Ontraad dat niet: dat is niet je rol. Leg je dossier klaar, met de wettelijke grondslag om de facturen te bewaren. En verwacht een bericht van de Eerstelijnsdienst."}, {"id": 7, "type": "compare", "chip": "Publiek en privaat", "title": "Publieke en private handhaving", "left": {"head": "Publieke handhaving — art. 77, 58 en 83 AVG", "items": ["Door een toezichthoudende autoriteit; federaal is dit in België de GBA", "Na een klacht (art. 77), een verzoek tot bemiddeling of ambtshalve", "Corrigerende maatregelen en geldboetes (art. 58.2 en 83)"]}, "right": {"head": "Private handhaving — art. 79 tot 82 AVG", "items": ["Door de betrokkene, een vereniging in opdracht van de betrokkene (art. 80.1), of een concurrent (HvJ C-21/23)", "Vordering voor de rechter, niet voor de GBA (art. 79)", "Bevel tot staking, dwangsom of schadevergoeding (art. 82)", "De twee sporen sluiten elkaar niet uit"]}, "script": "Van de rol van de DPO naar de handhaving zelf. Handhaving loopt langs twee sporen. Links zie je de publieke handhaving, door een toezichthoudende autoriteit. Federaal is dit in België de Gegevensbeschermingsautoriteit. Die treedt op na een klacht, een verzoek tot bemiddeling, of ambtshalve. Ze kan corrigerende maatregelen en geldboetes opleggen. Rechts zie je de private handhaving. Dan stapt een private actor naar de rechter. Dat kan de betrokkene zijn, een vereniging in opdracht van de betrokkene, of zelfs een concurrent. Het resultaat is een bevel tot staking, eventueel onder dwangsom, of een schadevergoeding. Die laatste kent de toezichthouder niet toe. De twee sporen sluiten elkaar niet uit. Een betrokkene kan klacht indienen én naar de rechter stappen. Bij de private handhaving zijn er drie wegen naar de rechter. We bekijken ze een voor een."}, {"id": 8, "type": "bullets", "chip": "Private handhaving", "title": "De stakingsvordering uit de Gegevensbeschermingswet (art. 209 e.v. Wet van 30 juli 2018)", "bullets": [{"k": "Procedure", "t": "voor de voorzitter van de rechtbank van eerste aanleg, zitting houdend zoals in kort geding (art. 209 en 211 § 1)."}, {"k": "Initiatief", "t": "de betrokkene of de bevoegde toezichthoudende autoriteit (art. 211 § 3); niet de verwerkingsverantwoordelijke of de verwerker. Een vereniging alleen met een concreet mandaat van een betrokkene (art. 220; art. 80.1 AVG): de Gegevensbeschermingswet kent verenigingen geen eigen vorderingsrecht toe om uit eigen naam een collectief belang te verdedigen (geen gebruik van art. 80.2 AVG)."}, {"k": "Voorwerp", "t": "elke verwerking die inbreuk maakt op de gegevensbeschermingsregels; daaronder valt ook het onrechtmatig weigeren van een verzoek tot inzage, rectificatie, wissing of bezwaar."}, {"k": "Resultaat", "t": "vaststelling van de inbreuk en bevel tot staking of tot nakoming van de rechten, eventueel onder dwangsom; daarnaast maatregelen om bewijs te vrijwaren (art. 218) en bekendmaking van de uitspraak (art. 215)."}], "read": {"text": "Lees titel 5 van de Gegevensbeschermingswet van 30 juli 2018 (art. 209 tot 220).", "url": "https://www.ejustice.just.fgov.be/eli/wet/2018/07/30/2018040581/justel", "label": "Open de wet op Justel"}, "script": "Een eerste weg naar de rechter is de stakingsvordering uit de Gegevensbeschermingswet. De betrokkene stapt naar de voorzitter van de rechtbank van eerste aanleg, die zetelt zoals in kort geding. Dat gaat snel, maar het levert een beslissing ten gronde op. Ook de bevoegde toezichthouder kan die vordering instellen, maar de verwerkingsverantwoordelijke of de verwerker zelf niet. Een vereniging kan alleen optreden met een concreet mandaat van een betrokkene. België heeft er namelijk voor gekozen om verenigingen in de Gegevensbeschermingswet geen eigen vorderingsrecht te geven. Een vereniging kan met deze vordering dus niet uit eigen naam, los van een opdracht van een betrokkene, een collectief belang verdedigen. Met de vordering kan elke verwerking worden aangepakt die een inbreuk uitmaakt. Daaronder valt ook een situatie die je als DPO goed kent: een verzoek tot inzage, rectificatie, wissing of bezwaar dat ten onrechte werd geweigerd. De voorzitter stelt de inbreuk vast en beveelt de staking, of de nakoming van de rechten, eventueel onder dwangsom. Daarnaast kan de voorzitter maatregelen bevelen om bewijs te vrijwaren, en de uitspraak laten bekendmaken."}, {"id": 9, "type": "bullets", "chip": "Private handhaving", "title": "De stakingsvordering tussen ondernemingen (art. VI.104 en XVII.1 WER)", "bullets": [{"k": "Procedure", "t": "voor de voorzitter van de ondernemingsrechtbank, zitting houdend zoals in kort geding (art. XVII.1 en XVII.5 WER)."}, {"k": "Initiatief", "t": "in de eerste plaats een concurrent; ook andere belanghebbenden, de minister en beroepsverenigingen (art. XVII.7 WER)."}, {"k": "Voorwerp", "t": "elke met de eerlijke marktpraktijken strijdige daad waardoor een onderneming de beroepsbelangen van andere ondernemingen schaadt of kan schaden (art. VI.104 WER); een inbreuk op de AVG kan zo'n daad zijn."}, {"k": "Resultaat", "t": "vaststelling en bevel tot staking, eventueel onder dwangsom; volgens de rechtspraak ook preventief, tegen een praktijk die nog in voorbereiding is."}, {"k": "Hof van Justitie", "t": "de AVG verzet zich niet tegen nationale regels waardoor een concurrent een inbreuk op de AVG aanvecht als verboden oneerlijke handelspraktijk (HvJ 4 oktober 2024, C-21/23, Lindenapotheke)."}], "read": {"text": "Lees het arrest Lindenapotheke (C-21/23).", "url": "https://curia.europa.eu/juris/liste.jsf?num=C-21/23", "label": "Open het arrest op Curia"}, "script": "Een tweede weg naar de rechter is de stakingsvordering tussen ondernemingen, uit het Wetboek van economisch recht. Hier stapt typisch een concurrent naar de voorzitter van de ondernemingsrechtbank. Ook andere belanghebbenden, de minister of een beroepsvereniging kunnen dat. Het voorwerp is elke daad die strijdig is met de eerlijke marktpraktijken, en die de beroepsbelangen van andere ondernemingen schaadt of kan schaden. Een inbreuk op de AVG kan zo'n daad zijn. Denk aan een concurrent die zonder rechtsgrond adressen verzamelt en daarmee klanten werft. De voorzitter beveelt de staking, eventueel onder dwangsom, en volgens de rechtspraak zelfs preventief. Het Hof van Justitie oordeelde in tweeduizend vierentwintig dat de AVG zich daar niet tegen verzet. Niet alleen betrokkenen en toezichthouders kijken dus mee. Ook concurrenten kunnen de AVG inroepen."}, {"id": 10, "type": "bullets", "chip": "Private handhaving", "title": "De vordering tot schadevergoeding (art. 82 AVG)", "bullets": [{"k": "Inbreuk", "t": "de verwerkingsverantwoordelijke is aansprakelijk voor schade door een verwerking die inbreuk maakt op de AVG; de verwerker alleen bij schending van de eigen verplichtingen of buiten of tegen de rechtmatige instructies (art. 82.2)."}, {"k": "Schade", "t": "materieel of immaterieel, zonder drempel van ernst, maar wel aan te tonen; ook een gegronde vrees voor misbruik kan volstaan (HvJ C-300/21, C-340/21). Uitsluitend vergoedend, niet punitief (C-667/21, C-741/21)."}, {"k": "Causaal verband en bevrijdend bewijs", "t": "de verwerkingsverantwoordelijke ontsnapt alleen door te bewijzen op geen enkele wijze verantwoordelijk te zijn (art. 82.3); een fout van een medewerker volstaat niet (C-741/21)."}, {"k": "Meerdere partijen", "t": "hoofdelijke aansprakelijkheid tegenover de betrokkene (art. 82.4-5); een contractuele vrijwaring werkt alleen in de onderlinge verhouding."}, {"k": "Rechter", "t": "de bevoegde gewone rechter (art. 79.2 en 82.6), niet de GBA."}], "read": {"text": "Lees artikel 82 AVG in de volledige tekst.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Een derde weg naar de rechter is de vordering tot schadevergoeding, die rechtstreeks in de AVG staat. Er zijn drie voorwaarden: een inbreuk, schade, en een oorzakelijk verband. De eerste voorwaarde is een inbreuk. De verwerkingsverantwoordelijke is aansprakelijk voor schade door elke verwerking die inbreuk maakt. De verwerker is alleen aansprakelijk bij schending van de eigen verplichtingen, of bij handelen buiten de instructies. De tweede voorwaarde is schade. Die kan materieel of immaterieel zijn. Er is geen drempel, maar de betrokkene moet ze wel aantonen. Ook een gegronde vrees voor misbruik, bijvoorbeeld na een cyberaanval, kan schade zijn. De vergoeding is alleen vergoedend, niet bestraffend. De derde voorwaarde is het oorzakelijk verband, en daar speelt het bewijs. De organisatie ontsnapt alleen als ze bewijst dat ze op geen enkele wijze verantwoordelijk is. Wijzen naar een medewerker volstaat niet. Zijn er meerdere partijen, dan kan de betrokkene elk van hen voor het geheel aanspreken. Een vrijwaringsclausule in de verwerkersovereenkomst werkt alleen onderling. En de vordering gaat naar de gewone rechter, niet naar de Gegevensbeschermingsautoriteit. Voor jou betekent dit: wat je niet kunt aantonen, kan je organisatie niet verdedigen."}, {"type": "table", "chip": "Overzicht", "title": "Overzicht: publieke handhaving en drie wegen naar de rechter", "intro": "Publieke handhaving gebeurt door de toezichthouder, private handhaving via de rechter. De sporen sluiten elkaar niet uit.", "head": ["Spoor", "Wie neemt het initiatief", "Bij wie", "Resultaat"], "rows": [["Publiek: de toezichthouder", "betrokkene (klacht of verzoek tot bemiddeling) of de toezichthouder ambtshalve", "federaal de GBA; beroep bij het Marktenhof", "corrigerende maatregelen, administratieve geldboete"], ["Privaat 1: stakingsvordering Gegevensbeschermingswet", "betrokkene, vereniging met mandaat, toezichthouder", "voorzitter rechtbank van eerste aanleg", "bevel tot staking of nakoming, dwangsom"], ["Privaat 2: stakingsvordering tussen ondernemingen", "concurrent of andere belanghebbende", "voorzitter ondernemingsrechtbank", "bevel tot staking, dwangsom"], ["Privaat 3: schadevergoeding (art. 82)", "betrokkene die schade leed", "gewone rechter", "schadevergoeding"]], "hl": [0], "script": "Voor deze opleiding is het belangrijk dat je het verschil kent tussen publieke en private handhaving. Daarom zetten we alles nog eens op een rij. Bij publieke handhaving treedt de toezichthouder op. Federaal is dat in België de Gegevensbeschermingsautoriteit. Dat gebeurt na een klacht, na een verzoek tot bemiddeling, of ambtshalve. Het resultaat is een corrigerende maatregel of een administratieve geldboete, en daartegen staat beroep open bij het Marktenhof. Bij private handhaving stapt een private actor naar de rechter, langs drie wegen. De eerste weg is de stakingsvordering uit de Gegevensbeschermingswet, bij de voorzitter van de rechtbank van eerste aanleg. Die vordering kan worden ingesteld door de betrokkene, door een vereniging met mandaat of door de toezichthouder, en leidt tot een bevel tot staking of nakoming, eventueel onder dwangsom. De tweede weg is de stakingsvordering tussen ondernemingen, bij de voorzitter van de ondernemingsrechtbank, meestal op initiatief van een concurrent of een andere belanghebbende. Ook die weg leidt tot een bevel tot staking, eventueel onder dwangsom. De derde weg is de vordering tot schadevergoeding, bij de gewone rechter. Alleen langs die derde weg krijgt de betrokkene een vergoeding. En onthoud: de sporen sluiten elkaar niet uit.", "id": 11}, {"id": 12, "type": "figure", "chip": "Europa", "title": "De one-stop-shop bij grensoverschrijdende verwerking (art. 56 AVG)", "svg": "<svg viewBox=\"0 0 900 380\" role=\"img\" aria-label=\"One-stop-shop: de organisatie heeft één aanspreekpunt, de leidende toezichthouder van de hoofdvestiging; die werkt samen met de betrokken toezichthouders, die een bezwaar kunnen maken; bij een aanhoudend geschil beslist de EDPB; de toezichthouder bij wie een klacht werd ingediend, blijft het aanspreekpunt van de klager.\"><rect x=\"280\" y=\"18\" width=\"340\" height=\"60\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"450\" y=\"43.8\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--title);font-weight:700\"><tspan x=\"450\">EDPB<\/tspan><\/text><text x=\"450\" y=\"64.2\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"450\">bij aanhoudend geschil: bindend besluit (art. 65)<\/tspan><\/text><rect x=\"20\" y=\"152\" width=\"180\" height=\"96\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"110\" y=\"179.85\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"110\">Organisatie<\/tspan><\/text><text x=\"110\" y=\"199.975\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"110\">hoofdvestiging<\/tspan><tspan x=\"110\" dy=\"15.6\">in lidstaat A<\/tspan><tspan x=\"110\" dy=\"15.6\">(art. 4.16)<\/tspan><\/text><rect x=\"300\" y=\"152\" width=\"200\" height=\"96\" rx=\"12\" style=\"fill:var(--accent);stroke:var(--accent);stroke-width:1.5\"/><text x=\"400\" y=\"185.8\" text-anchor=\"middle\" style=\"font-size:16px;fill:#fff;font-weight:700\"><tspan x=\"400\">Leidende<\/tspan><tspan x=\"400\" dy=\"20\">toezichthouder<\/tspan><\/text><text x=\"400\" y=\"226.2\" text-anchor=\"middle\" style=\"font-size:12px;fill:#fff\"><tspan x=\"400\">lidstaat A · art. 56.1<\/tspan><\/text><rect x=\"645\" y=\"150\" width=\"230\" height=\"100\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"760\" y=\"179.5\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--title);font-weight:700\"><tspan x=\"760\">Betrokken toezichthouder<\/tspan><\/text><text x=\"760\" y=\"199.35\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"760\">lidstaat B (art. 4.22):<\/tspan><tspan x=\"760\" dy=\"15.6\">vestiging, wezenlijke<\/tspan><tspan x=\"760\" dy=\"15.6\">gevolgen of klacht<\/tspan><\/text><rect x=\"645\" y=\"310\" width=\"230\" height=\"60\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"760\" y=\"335.1\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--title);font-weight:700\"><tspan x=\"760\">Klager in lidstaat B<\/tspan><\/text><text x=\"760\" y=\"354.95\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"760\">dient klacht in (art. 77)<\/tspan><\/text><line x1=\"200\" y1=\"200\" x2=\"298\" y2=\"200\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"298,200 288.789,203.894 288.789,196.106\" style=\"fill:var(--muted)\"/><text x=\"249\" y=\"158.1\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--muted)\"><tspan x=\"249\">één<\/tspan><tspan x=\"249\" dy=\"13.75\">aanspreekpunt<\/tspan><tspan x=\"249\" dy=\"13.75\">(art. 56.6)<\/tspan><\/text><line x1=\"502\" y1=\"200\" x2=\"643\" y2=\"200\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"643,200 633.789,203.894 633.789,196.106\" style=\"fill:var(--muted)\"/><polygon points=\"502,200 511.211,196.106 511.211,203.894\" style=\"fill:var(--muted)\"/><text x=\"572\" y=\"168.7\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"572\">samenwerking<\/tspan><tspan x=\"572\" dy=\"15\">(art. 60)<\/tspan><\/text><text x=\"572\" y=\"226.975\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--muted)\"><tspan x=\"572\">ontwerpbesluit en<\/tspan><tspan x=\"572\" dy=\"13.75\">bezwaar (art. 60.4)<\/tspan><\/text><line x1=\"740\" y1=\"144\" x2=\"625\" y2=\"66\" style=\"stroke:var(--muted);stroke-width:2.2;stroke-dasharray:6 5\"/><polygon points=\"625,66 634.809,67.9473 630.437,74.393\" style=\"fill:var(--muted)\"/><text x=\"712\" y=\"99.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--muted)\"><tspan x=\"712\">geschil<\/tspan><\/text><line x1=\"760\" y1=\"308\" x2=\"760\" y2=\"257\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"760,257 763.894,266.211 756.106,266.211\" style=\"fill:var(--muted)\"/><polygon points=\"760,308 756.106,298.789 763.894,298.789\" style=\"fill:var(--muted)\"/><text x=\"655\" y=\"280.975\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--muted)\"><tspan x=\"655\">blijft aanspreekpunt<\/tspan><tspan x=\"655\" dy=\"13.75\">van de klager (art. 77.2)<\/tspan><\/text><\/svg>", "caption": "Leidende toezichthouder: die van de hoofdvestiging (art. 4.16 en 56.1), enig aanspreekpunt van de organisatie (art. 56.6); betrokken toezichthouders (art. 4.22); samenwerking, ontwerpbesluit en bezwaar (art. 60); geschillenbeslechting door de EDPB (art. 65); de klager behoudt het eigen aanspreekpunt (art. 77.2).", "script": "Dan het toezicht zelf, en eerst het toezicht in geval van een bedrijf of organisatie die actief is in meerdere lidstaten. Verwerkt een organisatie gegevens over de grenzen heen, dan geldt de one-stop-shop. Eén toezichthouder neemt de leiding: die van het land van de hoofdvestiging. Zo heeft de organisatie één aanspreekpunt. Andere toezichthouders zijn betrokken, omdat de organisatie er een vestiging heeft, omdat burgers er wezenlijke gevolgen ondervinden, of omdat er een klacht werd ingediend. De leidende toezichthouder stelt een ontwerpbesluit op, en de betrokken toezichthouders kunnen een relevant en gemotiveerd bezwaar maken. Raken ze het niet eens, dan beslist het Europees Comité voor gegevensbescherming, de EDPB, met een bindend besluit. Dient iemand een klacht in bij de toezichthouder van het eigen land, dan blijft die toezichthouder wel het aanspreekpunt van de klager.", "read": {"text": "Wil je je verder verdiepen? De EDPB-richtsnoeren 8/2022 leggen uit hoe je de leidende toezichthouder en de hoofdvestiging bepaalt.", "links": [{"label": "Richtsnoeren 8/2022 (EDPB)", "url": "https://www.edpb.europa.eu/documents/431_nl"}]}}, {"id": 13, "type": "bullets", "chip": "Europa", "title": "De EDPB: geen toezichthouder, wel de gezaghebbende uitleg van de AVG", "bullets": [{"k": "Wat (art. 68)", "t": "een orgaan van de Unie waarin de nationale toezichthouders en de Europese toezichthouder voor gegevensbescherming samenzitten; zelf geen toezichthouder."}, {"k": "Eerste instrument: richtsnoeren (art. 70.1, e))", "t": "uitleg over de toepassing van de AVG, bv. over datalekken of de DPO, doorgaans na publieke consultatie."}, {"k": "Tweede instrument: adviezen (art. 64)", "t": "over ontwerpbesluiten van nationale toezichthouders en over vragen van algemene strekking; de toezichthouder houdt er maximaal rekening mee (art. 64.7)."}, {"k": "Derde instrument: bindende besluiten (art. 65)", "t": "bij een geschil tussen toezichthouders in de one-stop-shop."}, {"k": "Waarom voor de DPO", "t": "niet bindend, maar gezaghebbend: toezichthouders en rechters volgen ze; ze bepalen de lat waaraan de verwerkingsverantwoordelijke wordt gemeten en onderbouwen je advies."}], "read": {"text": "Zoek in de documenten van de EDPB (filter op richtsnoeren, adviezen of bindende besluiten). Op de website staan ook de lopende publieke consultaties.", "links": [{"label": "Documenten van de EDPB", "url": "https://www.edpb.europa.eu/documents_en"}]}, "script": "In de one-stop-shop zagen we al het Europees Comité voor gegevensbescherming, afgekort de EDPB, dat we verder gewoon het comité noemen. Het comité is geen toezichthouder, maar een orgaan van de Unie waarin de nationale toezichthouders samenzitten, met de Europese toezichthouder voor gegevensbescherming. De voornaamste taak van het comité is ervoor zorgen dat de AVG overal op dezelfde manier wordt toegepast. Daarvoor heeft het comité drie instrumenten. Een eerste instrument van het comité zijn de richtsnoeren. Deze geven uitleg over hoe een regel moet worden toegepast, bijvoorbeeld over datalekken of over de DPO, doorgaans na een publieke consultatie. Een tweede instrument van het comité zijn de adviezen, over ontwerpbesluiten van nationale toezichthouders, en over vragen van algemene strekking. De toezichthouder moet daar maximaal rekening mee houden. Een derde instrument van het comité is het nemen van bindende besluiten, bij een geschil tussen toezichthouders. Als DPO kom je vooral de richtsnoeren en de adviezen tegen. Ze zijn niet bindend, maar de toezichthouders en de rechters volgen ze. Ze tonen de lat waaraan je organisatie gemeten wordt. Verwijs er dus naar in je adviezen: een standpunt dat steunt op de EDPB, weegt zwaarder dan je eigen mening."}, {"id": 14, "type": "reveal", "chip": "Denkoefening 2", "title": "Een klacht in Brussel tegen een webwinkel uit Dublin", "question": "Een Belgische klant dient bij de GBA klacht in tegen een grote webwinkel. De webwinkel heeft haar Europese hoofdvestiging in Ierland en verkoopt in heel Europa. Welke toezichthouder neemt de leiding, en wat doet de GBA?", "verdict": "De Ierse toezichthouder leidt; de GBA is een betrokken toezichthouder", "answer": [{"k": "Leidend", "t": "de toezichthouder van de hoofdvestiging, hier de Ierse: grensoverschrijdende verwerking (art. 4.23 en 56.1)."}, {"k": "Betrokken", "t": "de GBA, omdat de klacht bij haar werd ingediend (art. 4.22, c)); ze blijft het aanspreekpunt van de klager (art. 77.2)."}, {"k": "Bij onenigheid", "t": "relevant en gemotiveerd bezwaar tegen het ontwerpbesluit (art. 60.4); bij aanhoudend geschil beslist de EDPB (art. 65)."}, {"k": "Voor de DPO van de webwinkel", "t": "het aanspreekpunt is de leidende toezichthouder (art. 56.6); ken de procedure en de verwachtingen van die toezichthouder."}], "script": "Tijd voor een tweede denkoefening. Een Belgische klant dient bij de Gegevensbeschermingsautoriteit klacht in tegen een grote webwinkel. Die heeft haar Europese hoofdvestiging in Ierland, en verkoopt in heel Europa. Welke toezichthouder neemt de leiding, en wat doet de Gegevensbeschermingsautoriteit? Denk even na. … De Ierse toezichthouder leidt, want het gaat om een grensoverschrijdende verwerking. De Gegevensbeschermingsautoriteit is een betrokken toezichthouder, omdat de klacht bij haar werd ingediend. Ze blijft het aanspreekpunt van de klant. Is ze het niet eens met het ontwerpbesluit, dan kan ze bezwaar maken, en dan beslist de EDPB. En voor de DPO van die webwinkel? Het aanspreekpunt is dan de Ierse toezichthouder. Ken dus de procedure en de verwachtingen van de toezichthouder die voor jouw organisatie leidt. Niet alleen die van je eigen land."}, {"id": 15, "type": "figure", "chip": "België", "title": "In België: de GBA als federale toezichthouder, naast enkele sectorale", "svg": "<svg viewBox=\"0 0 900 440\" role=\"img\" aria-label=\"De Belgische toezichthouders: de GBA als federale toezichthouder, met sectorale toezichthouders voor politie, inlichtingendiensten, OCAD en Vlaamse bestuursinstanties.\"><rect x=\"315\" y=\"125\" width=\"270\" height=\"120\" rx=\"12\" style=\"fill:var(--accent);stroke:var(--accent);stroke-width:1.5\"/><text x=\"450\" y=\"165.35\" text-anchor=\"middle\" style=\"font-size:22px;fill:#fff;font-weight:700\"><tspan x=\"450\">GBA<\/tspan><\/text><text x=\"450\" y=\"188.4\" text-anchor=\"middle\" style=\"font-size:13px;fill:#fff\"><tspan x=\"450\">Gegevensbeschermingsautoriteit<\/tspan><tspan x=\"450\" dy=\"16.9\">federale toezichthouder:<\/tspan><tspan x=\"450\" dy=\"16.9\">privé én overheid<\/tspan><\/text><rect x=\"25\" y=\"29\" width=\"250\" height=\"82\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"150\" y=\"58\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--title);font-weight:700\"><tspan x=\"150\">COC<\/tspan><\/text><text x=\"150\" y=\"78.4\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"150\">Controleorgaan op de<\/tspan><tspan x=\"150\" dy=\"15.6\">politionele informatie<\/tspan><\/text><rect x=\"625\" y=\"29\" width=\"250\" height=\"82\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"750\" y=\"58\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--title);font-weight:700\"><tspan x=\"750\">Vast Comité I<\/tspan><\/text><text x=\"750\" y=\"78.4\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"750\">inlichtingen- en<\/tspan><tspan x=\"750\" dy=\"15.6\">veiligheidsdiensten<\/tspan><\/text><rect x=\"25\" y=\"259\" width=\"250\" height=\"82\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"150\" y=\"288\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--title);font-weight:700\"><tspan x=\"150\">VTC<\/tspan><\/text><text x=\"150\" y=\"308.4\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"150\">Vlaamse Toezichtcommissie:<\/tspan><tspan x=\"150\" dy=\"15.6\">Vlaamse bestuursinstanties<\/tspan><\/text><rect x=\"625\" y=\"259\" width=\"250\" height=\"82\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"750\" y=\"287.65\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"750\">Comité I + Comité P<\/tspan><\/text><text x=\"750\" y=\"307.775\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"750\">samen: OCAD en de<\/tspan><tspan x=\"750\" dy=\"15.6\">diensten die het ondersteunen<\/tspan><\/text><line x1=\"275\" y1=\"95\" x2=\"315\" y2=\"140\" style=\"stroke:var(--line);stroke-width:2\"/><line x1=\"625\" y1=\"95\" x2=\"585\" y2=\"140\" style=\"stroke:var(--line);stroke-width:2\"/><line x1=\"275\" y1=\"275\" x2=\"315\" y2=\"230\" style=\"stroke:var(--line);stroke-width:2\"/><line x1=\"625\" y1=\"275\" x2=\"585\" y2=\"230\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"40\" y=\"370\" width=\"820\" height=\"62\" rx=\"12\" style=\"fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5\"/><text x=\"450\" y=\"392.2\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted);font-weight:700\"><tspan x=\"450\">Aanverwante toezichthouders, voor regels die raken aan privacy<\/tspan><\/text><text x=\"450\" y=\"418.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--title)\"><tspan x=\"450\">BIPT: elektronische communicatie   ·   FOD Economie: onder meer ongevraagde elektronische reclame<\/tspan><\/text><\/svg>", "caption": "Grondslagen: GBA — wet van 3 december 2017 (WOG); COC, Vast Comité I en Comités I + P — bevoegdheid inzake gegevensbescherming: wet van 30 juli 2018; VTC — decreet van 18 juli 2008. De GBA is bevoegd tenzij een sectorale toezichthouder het is.", "script": "Van toezicht op Europees niveau naar België. De federale toezichthouder is de Gegevensbeschermingsautoriteit, voor de privésector én voor de meeste overheden. Daarnaast zijn er sectorale toezichthouders. Een eerste is het Controleorgaan op de politionele informatie. Dat houdt toezicht op de geïntegreerde politie, de passagiersinformatie-eenheid en de algemene inspectie van de politie. Het geeft daarover ook adviezen. Een tweede is het Vast Comité I. Dat is bevoegd voor de Veiligheid van de Staat en de militaire inlichtingendienst, en voor verwerkingen in het kader van de nationale veiligheid. Samen met het Vast Comité P houdt het toezicht op het coördinatieorgaan voor de dreigingsanalyse en de diensten die het ondersteunen. Een derde is de Vlaamse Toezichtcommissie, die toeziet op de Vlaamse bestuursinstanties. Opvallend: die commissie kan geen boetes opleggen, en houdt geen toezicht op de leveranciers van die instanties. Verder zijn er toezichthouders voor aanverwante regels: het Belgisch Instituut voor postdiensten en telecommunicatie is bevoegd voor elektronische communicatie, en de federale overheidsdienst Economie onder meer voor ongevraagde elektronische reclame."}, {"id": 16, "type": "figure", "chip": "België", "title": "De Gegevensbeschermingsautoriteit: een Directiecomité en vijf diensten", "svg": "<svg viewBox=\"0 0 900 440\" role=\"img\" aria-label=\"De structuur van de GBA: een directiecomité en vijf diensten; de eerstelijnsdienst en de inspectiedienst zijn voor de DPO de eerste aanspreekpunten.\"><rect x=\"30\" y=\"20\" width=\"70\" height=\"400\" rx=\"12\" style=\"fill:var(--accent)\"/><text x=\"65\" y=\"220\" text-anchor=\"middle\" transform=\"rotate(-90 65 220)\" style=\"font-size:18px;font-weight:700;fill:#fff\">Directiecomité<\/text><line x1=\"100\" y1=\"60\" x2=\"140\" y2=\"60\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"145\" y=\"29\" width=\"370\" height=\"62\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"330\" y=\"65.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"330\">Algemeen Secretariaat<\/tspan><\/text><line x1=\"515\" y1=\"60\" x2=\"545\" y2=\"60\" style=\"stroke:var(--line);stroke-width:2\"/><text x=\"555\" y=\"64.9\" text-anchor=\"start\" style=\"font-size:14px;fill:var(--text)\"><tspan x=\"555\">ondersteuning, datalekken, beslissingen<\/tspan><\/text><line x1=\"100\" y1=\"140\" x2=\"140\" y2=\"140\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"145\" y=\"109\" width=\"370\" height=\"62\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"330\" y=\"145.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"330\">Autorisatie- en adviesdienst<\/tspan><\/text><line x1=\"515\" y1=\"140\" x2=\"545\" y2=\"140\" style=\"stroke:var(--line);stroke-width:2\"/><text x=\"555\" y=\"144.9\" text-anchor=\"start\" style=\"font-size:14px;fill:var(--text)\"><tspan x=\"555\">adviezen, aanbevelingen, machtigingen<\/tspan><\/text><line x1=\"100\" y1=\"220\" x2=\"140\" y2=\"220\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"145\" y=\"189\" width=\"370\" height=\"62\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"330\" y=\"225.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"330\"><\/tspan><\/text><text x=\"290\" y=\"225.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"290\">Eerstelijnsdienst<\/tspan><\/text><line x1=\"515\" y1=\"220\" x2=\"545\" y2=\"220\" style=\"stroke:var(--line);stroke-width:2\"/><text x=\"555\" y=\"224.9\" text-anchor=\"start\" style=\"font-size:14px;fill:var(--text)\"><tspan x=\"555\">ontvangt klachten en verzoeken, bemiddelt<\/tspan><\/text><rect x=\"420\" y=\"208\" width=\"86\" height=\"24\" rx=\"12\" style=\"fill:var(--accent)\"/><text x=\"463\" y=\"223.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:#fff;font-weight:700\"><tspan x=\"463\">DPO-contact<\/tspan><\/text><line x1=\"100\" y1=\"300\" x2=\"140\" y2=\"300\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"145\" y=\"269\" width=\"370\" height=\"62\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"330\" y=\"305.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"330\"><\/tspan><\/text><text x=\"290\" y=\"305.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"290\">Inspectiedienst<\/tspan><\/text><line x1=\"515\" y1=\"300\" x2=\"545\" y2=\"300\" style=\"stroke:var(--line);stroke-width:2\"/><text x=\"555\" y=\"304.9\" text-anchor=\"start\" style=\"font-size:14px;fill:var(--text)\"><tspan x=\"555\">onderzoeksorgaan<\/tspan><\/text><rect x=\"420\" y=\"288\" width=\"86\" height=\"24\" rx=\"12\" style=\"fill:var(--accent)\"/><text x=\"463\" y=\"303.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:#fff;font-weight:700\"><tspan x=\"463\">DPO-contact<\/tspan><\/text><line x1=\"100\" y1=\"380\" x2=\"140\" y2=\"380\" style=\"stroke:var(--line);stroke-width:2\"/><rect x=\"145\" y=\"349\" width=\"370\" height=\"62\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"330\" y=\"385.95\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--title);font-weight:700\"><tspan x=\"330\">Geschillenkamer<\/tspan><\/text><line x1=\"515\" y1=\"380\" x2=\"545\" y2=\"380\" style=\"stroke:var(--line);stroke-width:2\"/><text x=\"555\" y=\"384.9\" text-anchor=\"start\" style=\"font-size:14px;fill:var(--text)\"><tspan x=\"555\">administratief geschillenorgaan: beslist<\/tspan><\/text><\/svg>", "caption": "Wet van 3 december 2017 tot oprichting van de Gegevensbeschermingsautoriteit (WOG).", "script": "Laten we inzoomen op de federale toezichthouder. Hoe zit de Gegevensbeschermingsautoriteit in elkaar? Bovenaan staat het Directiecomité. Het heeft een actieve, coördinerende rol: het bepaalt prioriteiten en kan een onderzoek laten starten. Daaronder werken vijf diensten. Het Algemeen Secretariaat ondersteunt, ontvangt de meldingen van datalekken, en neemt bepaalde beslissingen. De Autorisatie- en adviesdienst geeft adviezen, aanbevelingen en machtigingen. De Eerstelijnsdienst ontvangt klachten en verzoeken, en bemiddelt. De Inspectiedienst is het onderzoeksorgaan. En de Geschillenkamer is het administratieve geschillenorgaan dat beslist. We bekijken elke dienst afzonderlijk. Voor jou zijn twee diensten de eerste aanspreekpunten. De Eerstelijnsdienst, als een betrokkene een klacht indient of om bemiddeling vraagt: dan word je betrokken. En de Inspectiedienst, als er een onderzoek loopt.", "read": {"text": "Alle publicaties van de GBA: adviezen, aanbevelingen, machtigingen, beslissingen.", "links": [{"label": "Publicaties van de GBA", "url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/publicaties"}]}}, {"type": "bullets", "nav": {"items": ["Algemeen Secretariaat", "Autorisatie- en adviesdienst", "Eerstelijnsdienst", "Inspectiedienst", "Geschillenkamer"], "active": 0}, "chip": "De GBA", "title": "Het Algemeen Secretariaat", "bullets": [{"k": "Ondersteuning", "t": "horizontale ondersteunende en uitvoerende taken voor de hele GBA."}, {"k": "Meldingen van datalekken", "t": "ontvangt de meldingen van inbreuken in verband met persoonsgegevens (art. 33 AVG)."}, {"k": "Beslissingen", "t": "keurt onder meer bindende bedrijfsvoorschriften (art. 47) en gedragscodes (art. 40) goed, accrediteert toezichtsorganen voor gedragscodes (art. 41), legt de accreditatievereisten vast voor certificeringsorganen, die BELAC accrediteert (art. 43), keurt administratieve regelingen voor doorgiften goed (art. 46.3, b)) en stelde de lijst vast van verwerkingen waarvoor een DPIA verplicht is (art. 35.4)."}, {"k": "Voor de DPO", "t": "een datalek meld je via het meldingsformulier van de GBA, binnen 72 uur na kennisname; de melding kan aanleiding geven tot verdere opvolging."}], "script": "Van de structuur naar de diensten zelf. De eerste dienst is het Algemeen Secretariaat. Dat neemt de ondersteunende en uitvoerende taken op voor de hele Gegevensbeschermingsautoriteit. Voor jou is één taak belangrijk: het ontvangt de meldingen van datalekken. Meld je als organisatie een datalek, dan doe je dat via het meldingsformulier, binnen tweeënzeventig uur nadat je er kennis van kreeg. Zo'n melding blijft niet altijd zonder gevolg: ze kan aanleiding geven tot verdere opvolging. Daarnaast neemt het Algemeen Secretariaat een aantal beslissingen. Het keurt bijvoorbeeld bindende bedrijfsvoorschriften en gedragscodes goed. Het accrediteert organen die toezien op gedragscodes, en legt de vereisten vast voor de accreditatie van certificeringsorganen. Het keurt administratieve regelingen voor doorgiften goed. En het stelde de lijst vast van verwerkingen waarvoor een DPIA verplicht is. Die beslissingen worden gepubliceerd op de website.", "id": 17, "read": {"text": "Hier vind je de beslissingen van het Algemeen Secretariaat. Een datalek meld je via het meldingsformulier op de website van de GBA.", "links": [{"label": "Beslissingen van het Algemeen Secretariaat", "url": "https://www.gegevensbeschermingsautoriteit.be/burger/zoeken?q=&search_category%5B%5D=taxonomy%3Apublications&search_type%5B%5D=decision&search_subtype%5B%5D=taxonomy%3Ageneral_secretary_international_decisions&search_subtype%5B%5D=taxonomy%3Ageneral_secretary_general_decisions&s=recent&l=25"}]}}, {"type": "bullets", "nav": {"items": ["Algemeen Secretariaat", "Autorisatie- en adviesdienst", "Eerstelijnsdienst", "Inspectiedienst", "Geschillenkamer"], "active": 1}, "chip": "De GBA", "title": "De Autorisatie- en adviesdienst", "bullets": [{"k": "Adviezen en aanbevelingen", "t": "adviezen over ontwerpen van wet- en regelgeving (art. 36.4 en 57.1, c) AVG) en aanbevelingen over de toepassing van de regels."}, {"k": "Machtigingen", "t": "verleent machtigingen waar de wet dat voorziet, binnen vastgelegde termijnen."}, {"k": "Voor de DPO", "t": "vooral de adviezen en aanbevelingen over wetgeving die op de eigen organisatie van toepassing is; ze tonen hoe de GBA de regels leest. Gebruik ze in je eigen advies."}], "script": "De tweede dienst is de Autorisatie- en adviesdienst. Die geeft adviezen over ontwerpen van wetten en andere regelgeving. Ze formuleert aanbevelingen over de toepassing van de regels. Verder verleent ze machtigingen waar de wet dat voorziet, binnen vaste termijnen. Voor jou zijn vooral de adviezen en aanbevelingen over de wetgeving nuttig, vooral wanneer deze wetten van toepassing zijn op jouw organisatie. Ze tonen hoe de Gegevensbeschermingsautoriteit de regels leest. Gebruik ze dus in je eigen advies, net zoals de richtsnoeren van de EDPB.", "id": 18, "read": {"text": "Hier vind je de adviezen over wetgeving. De GBA publiceert ook aanbevelingen en machtigingen, en beschrijft de procedure voor een voorafgaande raadpleging.", "links": [{"label": "Adviezen over wetgeving", "url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/publicaties/adviezen"}]}}, {"type": "bullets", "nav": {"items": ["Algemeen Secretariaat", "Autorisatie- en adviesdienst", "Eerstelijnsdienst", "Inspectiedienst", "Geschillenkamer"], "active": 2}, "chip": "De GBA", "title": "De Eerstelijnsdienst", "bullets": [{"k": "Ontvangst", "t": "ontvangt klachten en verzoeken tot bemiddeling (art. 77 AVG; art. 58-60 WOG) en informeert het publiek."}, {"k": "Ontvankelijkheid", "t": "beoordeelt of een klacht ontvankelijk is en maakt ze over aan de Geschillenkamer."}, {"k": "Bemiddeling", "t": "bemiddelt, ook proactief, en kan eenvoudige dossiers zelf afhandelen."}, {"k": "Voor de DPO", "t": "bij een klacht of een verzoek tot bemiddeling neemt de Eerstelijnsdienst contact op, meestal via de DPO."}], "script": "De derde dienst, de Eerstelijnsdienst, is de toegangspoort. Ze ontvangt klachten en verzoeken tot bemiddeling, en informeert het publiek. Ze beoordeelt of een klacht ontvankelijk is, en maakt ze dan over aan de Geschillenkamer. En ze bemiddelt. Ze kan dat ook proactief doen, en eenvoudige dossiers zelf afhandelen. Voor jou is dit vaak het eerste contact: dient een betrokkene een klacht in, of wordt er om bemiddeling gevraagd, dan neemt de Eerstelijnsdienst contact op, meestal via jou. Hoe dat verloopt, zie je in het volgende deel.", "id": 19, "read": {"text": "Zo dient een betrokkene een klacht in. Op de website vind je ook het verzoek tot bemiddeling en het informatieverzoek.", "links": [{"label": "Klacht indienen", "url": "https://www.gegevensbeschermingsautoriteit.be/burger/acties/klacht-indienen"}]}}, {"type": "bullets", "nav": {"items": ["Algemeen Secretariaat", "Autorisatie- en adviesdienst", "Eerstelijnsdienst", "Inspectiedienst", "Geschillenkamer"], "active": 3}, "chip": "De GBA", "title": "De Inspectiedienst", "bullets": [{"k": "Onderzoeksorgaan", "t": "bestaat uit inspecteurs onder leiding van een inspecteur-generaal."}, {"k": "Opdrachten", "t": "onderzoeken op vraag van de Geschillenkamer of het Directiecomité, thematische onderzoeken, en Europese audittaken."}, {"k": "Bevoegdheden", "t": "schriftelijke bevraging, onderzoek ter plaatse, verhoor, raadplegen van systemen, beslag en verzegeling (art. 58.1 AVG en de WOG)."}, {"k": "Voor de DPO", "t": "bijna elk onderzoek start met een schriftelijke bevraging aan de DPO als contactpunt."}], "script": "De vierde dienst is de Inspectiedienst, het onderzoeksorgaan van de Gegevensbeschermingsautoriteit. De dienst bestaat uit inspecteurs, die werken onder leiding van een inspecteur-generaal. Ze onderzoeken op vraag van de Geschillenkamer of van het Directiecomité. Daarnaast voeren ze thematische onderzoeken, en nemen ze Europese audittaken op. Hun bevoegdheden zijn ruim: vragen stellen, ter plaatse komen, mensen horen, systemen raadplegen, zelfs beslag leggen en verzegelen. Maar in de praktijk start bijna elk onderzoek met een schriftelijke bevraging. En die komt bij jou terecht.", "id": 20, "read": {"text": "Volg de thema's en vaststellingen van de Inspectiedienst.", "links": [{"label": "Onder de loep – Nieuws van de Inspectie", "url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/publicaties/onder-de-loep-nieuws-van-de-inspectie"}]}}, {"type": "bullets", "nav": {"items": ["Algemeen Secretariaat", "Autorisatie- en adviesdienst", "Eerstelijnsdienst", "Inspectiedienst", "Geschillenkamer"], "active": 4}, "chip": "De GBA", "title": "De Geschillenkamer", "bullets": [{"k": "Administratief geschillenorgaan", "t": "behandelt klachten en dossiers van de Inspectiedienst, en beslist."}, {"k": "Beslissingen", "t": "van sepot en waarschuwing tot bevelen, verbod en administratieve geldboete (art. 58.2 en 83 AVG; art. 100 WOG)."}, {"k": "Openbaarheid", "t": "de beslissingen worden gepubliceerd op de website van de GBA."}, {"k": "Beroep", "t": "tegen de beslissingen staat beroep open bij het Marktenhof (art. 78 AVG; art. 108 WOG)."}, {"k": "Voor de DPO", "t": "de gepubliceerde beslissingen tonen hoe de GBA de AVG toepast; in de Stay Tuned als DPO-sessies gaan we er elk kwartaal dieper op in."}], "script": "De vijfde en laatste dienst is de Geschillenkamer, het administratieve geschillenorgaan. Zij behandelt de klachten en de dossiers van de Inspectiedienst, en zij beslist. Haar mogelijkheden gaan van een sepot of een waarschuwing tot bevelen, een verwerkingsverbod en een administratieve geldboete. Haar beslissingen worden gepubliceerd op de website van de Gegevensbeschermingsautoriteit. En tegen die beslissingen staat beroep open bij het Marktenhof. Een tip: lees regelmatig de gepubliceerde beslissingen. Ze tonen concreet hoe de Gegevensbeschermingsautoriteit de AVG toepast, en wat ze van organisaties verwacht. In onze Stay Tuned als DPO-sessies gaan we hier op kwartaalbasis dieper op in.", "id": 21, "read": {"text": "Zoek in de beslissingen van de Geschillenkamer (filter bovenaan de pagina); daar staan ook de arresten van het Marktenhof.", "links": [{"label": "Beslissingen", "url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/publicaties/beslissingen"}]}}, {"id": 22, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "De DPO houdt van binnenuit toezicht en is het contactpunt van de toezichthouder, die van buitenaf toezicht houdt met een eigen regime; daarom moet de DPO handhaving kennen en kunnen uitleggen.", "bullets": [{"k": "Verlengde, geen kopie", "t": "de DPO ziet toe en adviseert (art. 39); de toezichthouder onderzoekt en sanctioneert (art. 57-58); de verantwoordelijkheid blijft bij de verwerkingsverantwoordelijke."}, {"k": "Contactpunt", "t": "voor de toezichthouder, binnen de organisatie, en voor de betrokkene, die je op de klacht wijst (art. 12.4)."}, {"k": "Twee sporen", "t": "publiek via de toezichthouder; privaat via de rechter: stakingsvordering, stakingsvordering tussen ondernemingen, schadevergoeding (art. 82)."}, {"k": "Het landschap", "t": "in Europa de one-stop-shop en de EDPB met richtsnoeren en adviezen; in België federaal de GBA, met vijf diensten, naast sectorale toezichthouders."}], "script": "Wat neem je mee? Jij houdt van binnenuit toezicht, en je bent het contactpunt van de toezichthouder. Die houdt van buitenaf toezicht, met een eigen regime. Verlengde, geen kopie: jij ziet toe en adviseert, de toezichthouder onderzoekt en sanctioneert. De verantwoordelijkheid blijft bij de verwerkingsverantwoordelijke. Je bent contactpunt in drie richtingen, en je wijst de betrokkene op het klachtrecht. Handhaving loopt via de toezichthouder of via de rechter, met drie wegen: de stakingsvordering, de stakingsvordering tussen ondernemingen en de schadevergoeding. En wat het landschap betreft: in Europa gelden de one-stop-shop en de EDPB, met de richtsnoeren en adviezen. In België is de Gegevensbeschermingsautoriteit de federale toezichthouder, met haar vijf diensten, naast de sectorale toezichthouders. In het volgende deel volgen we een dossier bij de Gegevensbeschermingsautoriteit, stap voor stap."}], "quiz": [{"q": "Waarom is het werk van de DPO het verlengde van dat van de toezichthouder?", "options": ["Beiden zien toe op de naleving, elk vanuit een andere positie.", "Omdat de DPO door de toezichthouder wordt aangesteld.", "Omdat de DPO dezelfde sancties kan opleggen.", "Omdat de DPO verantwoordelijk is voor de naleving."], "answer": 0, "feedback": ["Juist. De DPO van binnenuit (art. 39), de toezichthouder van buitenaf met een eigen regime (art. 57-58).", "De organisatie stelt de DPO aan, niet de toezichthouder.", "De DPO kan geen sancties opleggen.", "De verantwoordingsplicht ligt bij de verwerkingsverantwoordelijke (art. 5.2 en 24)."]}, {"q": "Wat moet een verwerkingsverantwoordelijke meedelen bij het niet ingaan op een verzoek van een betrokkene?", "options": ["Alleen dat het verzoek is geweigerd.", "De naam van de behandelende medewerker.", "De redenen, en de mogelijkheid van klacht en beroep.", "Dat een nieuw verzoek pas na zes maanden kan."], "answer": 2, "feedback": ["Een loutere weigering volstaat niet.", "Die naam is niet vereist.", "Juist. Dat volgt uit art. 12.4 AVG, binnen één maand na ontvangst van het verzoek.", "De AVG kent zo'n wachttermijn niet."]}, {"q": "Hoe verhoudt de geheimhoudingsplicht van de DPO zich tot de samenwerking met de toezichthouder?", "options": ["Ze verbiedt elk contact met de toezichthouder.", "De DPO moet spontaan alle interne documenten doorgeven.", "Ze geldt alleen tegenover betrokkenen.", "Ze belet niet dat de DPO contact opneemt met de toezichthouder."], "answer": 3, "feedback": ["De DPO moet net samenwerken met de toezichthouder (art. 39.1, d)).", "Samenwerken betekent niet dat de DPO spontaan alles doorgeeft.", "De geheimhouding geldt bij de uitvoering van alle DPO-taken (art. 38.5).", "Juist. Zo staat het in de DPO-richtsnoeren; het spanningsveld met de organisatie blijft wel bestaan."]}, {"q": "Wie kan de stakingsvordering uit de Gegevensbeschermingswet NIET instellen?", "options": ["De betrokkene met hoedanigheid en belang.", "De verwerkingsverantwoordelijke zelf.", "De bevoegde toezichthoudende autoriteit.", "Een vereniging in opdracht van betrokkenen."], "answer": 1, "feedback": ["De betrokkene kan dat wel.", "Juist. De vordering staat open voor de betrokkene en de toezichthouder, niet voor de verwerkingsverantwoordelijke of de verwerker.", "De toezichthouder kan dat wel.", "Een vereniging kan dat, maar alleen in opdracht van betrokkenen."]}, {"q": "Wat besliste het Hof van Justitie in de zaak Lindenapotheke?", "options": ["Alleen de toezichthouder mag een inbreuk vervolgen.", "Een concurrent mag optreden via de oneerlijke praktijken.", "Een concurrent moet zelf betrokkene zijn.", "Een concurrent kan alleen schadevergoeding vragen."], "answer": 1, "feedback": ["Het Hof aanvaardde net dat een concurrent kan optreden.", "Juist. De AVG verzet zich niet tegen zo'n nationale regeling.", "De concurrent treedt op voor de eigen beroepsbelangen.", "Het ging net om een vordering tot staking."]}, {"q": "Een organisatie wordt aangesproken voor schadevergoeding na een cyberaanval. Wat geldt?", "options": ["Elke inbreuk geeft recht op een forfait.", "Een fout van een medewerker bevrijdt.", "Ontsnappen kan alleen met bevrijdend bewijs.", "Immateriële schade telt niet mee."], "answer": 2, "feedback": ["De betrokkene moet schade aantonen; er is geen forfait.", "Een fout van een medewerker volstaat niet om te ontsnappen.", "Juist. De organisatie moet bewijzen dat ze op geen enkele wijze verantwoordelijk is (art. 82.3 AVG).", "Ook een gegronde vrees voor misbruik kan immateriële schade zijn."]}, {"q": "Welke toezichthouder neemt de leiding bij een grensoverschrijdende verwerking?", "options": ["Die van het land waar de klager woont.", "De EDPB.", "Elke betrokken toezichthouder voor de eigen burgers.", "Die van het land van de hoofdvestiging."], "answer": 3, "feedback": ["Die toezichthouder is betrokken, maar leidt niet.", "De EDPB beslist alleen bij een geschil tussen toezichthouders (art. 65).", "Net om dat te vermijden bestaat de one-stop-shop.", "Juist. Dat is de kern van de one-stop-shop (art. 56.1)."]}, {"q": "Wat is opvallend aan de Vlaamse Toezichtcommissie?", "options": ["Ze kan geen boetes opleggen.", "Ze is bevoegd voor alle Vlaamse ondernemingen.", "Ze vervangt de GBA in Vlaanderen.", "Ze beslist over beroepen tegen de GBA."], "answer": 0, "feedback": ["Juist. En ze houdt geen toezicht op de leveranciers van de Vlaamse bestuursinstanties.", "Ze is bevoegd voor Vlaamse bestuursinstanties, niet voor ondernemingen.", "De GBA blijft de federale toezichthouder.", "Beroep tegen de GBA gaat naar het Marktenhof."]}, {"q": "Met welke twee diensten van de GBA komt een DPO het vaakst in contact?", "options": ["Het Directiecomité en het Algemeen Secretariaat.", "De Eerstelijnsdienst en de Inspectiedienst.", "De Autorisatie- en adviesdienst en de Geschillenkamer.", "Het Algemeen Secretariaat en de Geschillenkamer."], "answer": 1, "feedback": ["Die sturen aan en ondersteunen, maar zijn zelden je eerste aanspreekpunt.", "Juist. De Eerstelijnsdienst bij bemiddeling, de Inspectiedienst bij een onderzoek.", "Die spelen een rol, maar zijn niet je eerste aanspreekpunt.", "Het Algemeen Secretariaat ontvangt datalekmeldingen, maar is zelden je eerste aanspreekpunt in een dossier."]}, {"q": "Waarom zijn de richtsnoeren van de EDPB belangrijk voor een DPO?", "options": ["Omdat ze bindend zijn zoals de AVG zelf.", "Omdat ze alleen gelden voor grote ondernemingen.", "Omdat de toezichthouders ze volgen en ze de lat tonen.", "Omdat ze nationale wetgeving vervangen."], "answer": 2, "feedback": ["Ze zijn niet bindend, maar wel gezaghebbend.", "Ze gelden voor iedereen die de AVG toepast.", "Juist. Ze tonen hoe de toezichthouders de AVG toepassen, en ze onderbouwen je advies.", "Ze leggen de AVG uit; ze vervangen geen wetgeving."]}]}</script>

        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+(s.question?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);
    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audiobestand niet gevonden. Controleer of de map "audio" naast dit bestand staat.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;
    $('btn-quiz-start').classList.add('hidden');
    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
</script>
</body>
