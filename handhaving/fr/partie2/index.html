<!DOCTYPE html>
<html lang="fr" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partie 2 · Un dossier à l'APD</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

ession. Relisez le retour des questions manquées et réessayez.", "result_low": "Revoyez la présentation, puis réessayez. Le retour sur chaque question vous aidera.", "retry": "Recommencer les exercices", "review": "Revoir la présentation", "your_answer": "Votre réponse", "open_link": "Ouvrir le lien dans un nouvel onglet", "practice_hint": "Exercice pratique : mettez en pause, suivez les étapes, puis cliquez sur Suivant.", "back_to_slides": "Retour aux diapositives", "resume_quiz": "Reprendre les exercices", "download_pdf": "Télécharger votre résultat en PDF", "pdf_title": "Résultat des exercices", "pdf_question": "Question", "pdf_your": "Votre réponse", "pdf_correct": "Réponse correcte", "pdf_feedback": "Retour", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "sans réponse", "transcript": "Texte parlé", "show_text": "Afficher le texte", "hide_text": "Masquer le texte", "ai_notice_title": "Transparence sur l'IA", "ai_notice": "La voix de ce module a été générée par IA à partir de la voix de Peter Berghmans, avec son consentement. Le texte et les diapositives ont été réalisés avec l'aide de l'IA et relus sur le fond par le formateur.", "ai_voice_label": "Voix IA", "ai_icon_alt": "Label officiel de l'UE : contenu généré par IA", "ai_footer": "Voix générée par IA (avec le consentement de l'orateur) ; texte et diapositives réalisés avec l'aide de l'IA et relus par le formateur.", "skip_to_quiz": "Aller directement aux exercices", "nav_home": "Accueil", "nav_slides": "Présentation", "nav_quiz": "Exercices", "speed": "Vitesse", "reveal_question": "Qu'en pensez-vous ?", "reveal_show": "Afficher la réponse", "optional_label": "Approfondissement (facultatif)", "optional_skip": "Passer l'approfondissement", "optional_intro": "Les diapositives suivantes sont un approfondissement facultatif. Vous pouvez les passer et aller directement aux exercices.", "autoplay_short": "Auto", "read_label": "Ouvrir le RGPD sur EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "Un dossier à l'APD : de la plainte au recours", "subtitle": "Saisine, enquête, procédure, sanctions et recours, et ce que fait le DPO à chaque moment", "script": "Dans la partie précédente, nous avons vu que vous êtes le point de contact de l'autorité de contrôle. Dans cette partie, nous suivons un dossier à l'Autorité de protection des données, du début à la fin. Nous le faisons en cinq étapes : la saisine, l'enquête, la procédure, les sanctions possibles et le recours. À chaque étape, nous posons la même question : que faites-vous en tant que DPO ? Car une personne concernée qui introduit une plainte veut savoir ce qui va se passer. Et votre organisation veut savoir ce qu'elle risque. Dans les deux cas, c'est vers vous qu'on se tourne. Vous ne devez pas être avocat plaideur. Mais vous devez connaître le déroulement, reconnaître les délais à chaque étape, et savoir quand informer qui."}, {"id": 2, "type": "figure", "chip": "Le déroulement", "title": "Contrôle par l'APD : cinq étapes", "svg": "<svg viewBox=\"0 0 900 425\" role=\"img\" aria-label=\"Le déroulement d'un dossier à l'APD : plainte ou demande de médiation via le Service de Première Ligne vers la Chambre Contentieuse, qui peut faire appel au Service d'Inspection ; recours devant la Cour des marchés. Le DPO est le point de contact auprès du Service de Première Ligne, de la Chambre Contentieuse et du Service d'Inspection.\"><rect x=\"60\" y=\"10\" width=\"140\" height=\"30\" rx=\"15\" style=\"fill:var(--chip-bg)\"/><text x=\"130\" y=\"29.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--chip-text);font-weight:700\"><tspan x=\"130\">1  Saisine<\/tspan><\/text><rect x=\"230\" y=\"10\" width=\"140\" height=\"30\" rx=\"15\" style=\"fill:var(--chip-bg)\"/><text x=\"300\" y=\"29.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--chip-text);font-weight:700\"><tspan x=\"300\">2  Enquête<\/tspan><\/text><rect x=\"400\" y=\"10\" width=\"140\" height=\"30\" rx=\"15\" style=\"fill:var(--chip-bg)\"/><text x=\"470\" y=\"29.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--chip-text);font-weight:700\"><tspan x=\"470\">3  Procédure<\/tspan><\/text><rect x=\"570\" y=\"10\" width=\"140\" height=\"30\" rx=\"15\" style=\"fill:var(--chip-bg)\"/><text x=\"640\" y=\"29.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--chip-text);font-weight:700\"><tspan x=\"640\">4  Sanctions<\/tspan><\/text><rect x=\"730\" y=\"10\" width=\"140\" height=\"30\" rx=\"15\" style=\"fill:var(--chip-bg)\"/><text x=\"800\" y=\"29.55\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--chip-text);font-weight:700\"><tspan x=\"800\">5  Recours<\/tspan><\/text><rect x=\"25\" y=\"94\" width=\"170\" height=\"52\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"110\" y=\"125.25\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"110\">Plainte<\/tspan><\/text><rect x=\"25\" y=\"164\" width=\"170\" height=\"52\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"110\" y=\"186.15\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--title);font-weight:700\"><tspan x=\"110\">Demande de<\/tspan><tspan x=\"110\" dy=\"17.5\">médiation<\/tspan><\/text><rect x=\"25\" y=\"300\" width=\"170\" height=\"60\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5\"/><text x=\"110\" y=\"326.425\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--title);font-weight:700\"><tspan x=\"110\">Indices,<\/tspan><tspan x=\"110\" dy=\"16.25\">propre initiative<\/tspan><\/text><rect x=\"230\" y=\"116\" width=\"180\" height=\"78\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"320\" y=\"142.65\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"320\">Première Ligne<\/tspan><\/text><text x=\"320\" y=\"162.775\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"320\">recevabilité<\/tspan><tspan x=\"320\" dy=\"15.6\">médiation<\/tspan><\/text><rect x=\"230\" y=\"300\" width=\"180\" height=\"60\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"320\" y=\"335.25\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"320\">Comité de direction<\/tspan><\/text><rect x=\"450\" y=\"116\" width=\"180\" height=\"78\" rx=\"12\" style=\"fill:var(--accent);stroke:var(--accent);stroke-width:1.5\"/><text x=\"540\" y=\"143\" text-anchor=\"middle\" style=\"font-size:16px;fill:#fff;font-weight:700\"><tspan x=\"540\">Ch. Contentieuse<\/tspan><\/text><text x=\"540\" y=\"163.4\" text-anchor=\"middle\" style=\"font-size:12px;fill:#fff\"><tspan x=\"540\">décide et<\/tspan><tspan x=\"540\" dy=\"15.6\">sanctionne<\/tspan><\/text><rect x=\"450\" y=\"300\" width=\"180\" height=\"60\" rx=\"12\" style=\"fill:var(--chain-bg);stroke:var(--accent);stroke-width:1.5\"/><text x=\"540\" y=\"325.45\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--title);font-weight:700\"><tspan x=\"540\">Service d'Inspection<\/tspan><\/text><text x=\"540\" y=\"345.575\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"540\">enquête<\/tspan><\/text><rect x=\"705\" y=\"116\" width=\"170\" height=\"78\" rx=\"12\" style=\"fill:var(--card-bg);stroke:var(--line);stroke-width:1.5\"/><text x=\"790\" y=\"143\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--title);font-weight:700\"><tspan x=\"790\">Cour des marchés<\/tspan><\/text><text x=\"790\" y=\"163.4\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"790\">recours dans<\/tspan><tspan x=\"790\" dy=\"15.6\">les 30 jours<\/tspan><\/text><line x1=\"195\" y1=\"120\" x2=\"228\" y2=\"140\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"228,140 218.105,138.556 222.141,131.896\" style=\"fill:var(--muted)\"/><line x1=\"195\" y1=\"190\" x2=\"228\" y2=\"170\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"228,170 222.141,178.104 218.105,171.444\" style=\"fill:var(--muted)\"/><line x1=\"410\" y1=\"155\" x2=\"448\" y2=\"155\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"448,155 438.789,158.894 438.789,151.106\" style=\"fill:var(--muted)\"/><line x1=\"540\" y1=\"195\" x2=\"540\" y2=\"298\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"540,298 536.106,288.789 543.894,288.789\" style=\"fill:var(--muted)\"/><polygon points=\"540,195 543.894,204.211 536.106,204.211\" style=\"fill:var(--muted)\"/><text x=\"600\" y=\"244.975\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--muted)\"><tspan x=\"600\">mission<\/tspan><tspan x=\"600\" dy=\"13.75\">d'enquête<\/tspan><\/text><line x1=\"195\" y1=\"330\" x2=\"228\" y2=\"330\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"228,330 218.789,333.894 218.789,326.106\" style=\"fill:var(--muted)\"/><line x1=\"410\" y1=\"330\" x2=\"448\" y2=\"330\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"448,330 438.789,333.894 438.789,326.106\" style=\"fill:var(--muted)\"/><line x1=\"630\" y1=\"155\" x2=\"703\" y2=\"155\" style=\"stroke:var(--muted);stroke-width:2.2\"/><polygon points=\"703,155 693.789,158.894 693.789,151.106\" style=\"fill:var(--muted)\"/><text x=\"666.5\" y=\"146.2\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\"><tspan x=\"666.5\">recours<\/tspan><\/text><rect x=\"267\" y=\"92\" width=\"106\" height=\"22\" rx=\"11\" style=\"fill:var(--accent)\"/><text x=\"320\" y=\"106.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:#fff;font-weight:700\"><tspan x=\"320\">Contact DPO<\/tspan><\/text><rect x=\"487\" y=\"368\" width=\"106\" height=\"22\" rx=\"11\" style=\"fill:var(--accent)\"/><text x=\"540\" y=\"382.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:#fff;font-weight:700\"><tspan x=\"540\">Contact DPO<\/tspan><\/text><rect x=\"487\" y=\"92\" width=\"106\" height=\"22\" rx=\"11\" style=\"fill:var(--accent)\"/><text x=\"540\" y=\"106.85\" text-anchor=\"middle\" style=\"font-size:11px;fill:#fff;font-weight:700\"><tspan x=\"540\">Contact DPO<\/tspan><\/text><\/svg>", "caption": "Droit de plainte : art. 77 RGPD · procédure : loi du 3 décembre 2017 portant création de l'APD (LCA) · recours : art. 78 RGPD et art. 108 LCA.", "script": "Nous commençons par la vue d'ensemble. Un dossier commence le plus souvent par une plainte ou une demande de médiation. Il faut toutefois nuancer : le Secrétariat Général peut lui aussi, via un signalement interne au Service d'Inspection, être à l'origine d'un dossier, par exemple lorsque la presse évoque un traitement déterminé. Nous suivons ici le parcours le plus classique. Les plaintes et les demandes de médiation arrivent au Service de Première Ligne. Celui-ci vérifie si une plainte est recevable, et peut mener une médiation. Une plainte recevable est transmise à la Chambre Contentieuse. La Chambre Contentieuse peut demander au Service d'Inspection de mener une enquête. Le Comité de direction peut lui aussi faire ouvrir une enquête, par exemple en cas d'indices d'une infraction. Ensuite, la Chambre Contentieuse décide, et impose éventuellement des sanctions. Contre cette décision, un recours est ouvert devant la Cour des marchés, dans les trente jours de la notification de la décision. Pour vous, trois moments sont importants. Le premier moment est une médiation : le Service de Première Ligne s'adresse alors à vous. Le deuxième moment est une enquête : le Service d'Inspection se tourne alors vers vous. Le troisième moment est la procédure devant la Chambre Contentieuse : vous fournissez alors les faits et les documents, et vous êtes souvent à la table lors d'une audience."}, {"id": 3, "type": "timeline", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 0}, "chip": "Étape 1 · Saisine", "title": "La saisine : plainte ou demande de médiation", "steps": [{"y": "Introduire", "t": "plainte de la personne concernée ou demande de médiation (art. 77 RGPD) : gratuite (art. 59 LCA), écrite, datée et signée, via le formulaire (art. 58 LCA)"}, {"y": "Recevable ?", "t": "le Service de Première Ligne vérifie notamment la langue, les faits, la compétence de l'APD, l'intérêt à agir, et si le plaignant s'est d'abord adressé au responsable du traitement (art. 60 LCA)"}, {"y": "Médiation", "t": "par écrit, le plus souvent via le DPO ; rapport du Service de Première Ligne, qui n'exclut pas la compétence de contrôle de l'APD"}, {"y": "Chambre Contentieuse", "t": "plainte recevable, ou conversion de la demande avec l'accord du demandeur ou en cas d'indices sérieux d'une infraction"}], "read": {"text": "Un dossier peut aussi commencer sans plainte : en cas d'indices d'une infraction, de signalements internes au sein de l'APD ou d'une enquête thématique. Voici comment une personne concernée introduit une plainte ; le site propose aussi la demande de médiation.", "links": [{"label": "Introduire une plainte", "url": "https://www.autoriteprotectiondonnees.be/citoyen/agir/introduire-une-plainte"}]}, "script": "La première étape est la saisine. Une plainte de la personne concernée, ou une demande de médiation, est gratuite. La personne concernée l'introduit par écrit, datée et signée, via le formulaire sur le site de l'Autorité de protection des données. Le Service de Première Ligne vérifie d'abord si la plainte est recevable. Est-elle rédigée dans l'une des langues nationales ? Les faits sont-ils clairs ? L'Autorité de protection des données est-elle compétente ? Et le plaignant a-t-il un intérêt ? Le Service de Première Ligne vérifie aussi si le plaignant s'est d'abord adressé, dans la mesure du possible, au responsable du traitement. Ce critère vous concerne directement : une demande traitée avec soin par votre organisation compte aussi dans la procédure. En cas de demande de médiation, le Service de Première Ligne prend contact par écrit avec l'organisation, le plus souvent par votre intermédiaire. Le résultat de la médiation fait l'objet d'un rapport. Attention : ce rapport n'exclut pas un contrôle ultérieur. Une plainte recevable est transmise à la Chambre Contentieuse. Si une médiation échoue, la demande peut être convertie en plainte, avec l'accord de la personne concernée. C'est aussi possible en cas d'indices sérieux d'une infraction. Un dossier peut d'ailleurs commencer sans plainte, par exemple sur la base d'indices d'une infraction ou dans le cadre d'une enquête thématique. Quel est votre rôle ? À une personne concernée mécontente, vous expliquez exactement cela. Et prenez une demande de médiation au sérieux, car une bonne médiation peut éviter une plainte."}, {"id": 4, "type": "cards", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 0}, "chip": "Étape 1 · Saisine", "title": "Une plainte recevable : le choix de la Chambre Contentieuse", "cols": 3, "cards": [{"k": "Service d'Inspection", "t": "faire mener une enquête si les faits ne sont pas encore établis"}, {"k": "Procédure « light »", "t": "une décision prima facie lorsque les faits sont clairs à première vue"}, {"k": "Classement sans suite", "t": "classer la plainte sans suite pour des raisons techniques ou d'opportunité"}, {"k": "Examen au fond", "t": "une procédure complète et contradictoire", "hl": true}, {"k": "Procureur du Roi", "t": "transmettre le dossier en cas d'aspects pénaux"}, {"k": "Transaction", "t": "un accord entre la Chambre Contentieuse et la partie défenderesse : des mesures et/ou une somme d'argent, après quoi la procédure prend fin ; le plaignant est entendu (art. 95 et 100 LCA)"}], "numbered": false, "script": "Une plainte recevable arrive à la Chambre Contentieuse, qui dispose de six possibilités. Une première possibilité est de faire mener une enquête par le Service d'Inspection, si les faits ne sont pas encore établis. Une deuxième possibilité est une procédure « light », si les faits sont clairs à première vue. Une troisième possibilité est de classer la plainte sans suite, pour des raisons techniques ou d'opportunité. Une quatrième possibilité est d'examiner l'affaire au fond, dans une procédure contradictoire. Une cinquième possibilité est de transmettre le dossier au procureur du Roi, s'il y a des aspects pénaux. Et une sixième possibilité est de proposer une transaction. Une transaction est un accord entre la Chambre Contentieuse et l'organisation visée par la plainte. L'organisation paie une somme d'argent, s'engage à prendre certaines mesures, par exemple pour améliorer le respect des règles ou pour répondre aux griefs du plaignant, ou les deux. En contrepartie, la Chambre Contentieuse met fin à la procédure, sans mesures correctrices. Le plaignant n'est pas partie à cet accord, mais il est bien entendu sur la proposition. Une transaction peut aussi être proposée plus tard dans la procédure. La voie que la Chambre Contentieuse choisit dépend de la gravité, de la clarté des faits et de ses priorités. Pour vous, la première possibilité est surtout importante, car une enquête suit alors, et c'est à vous qu'on s'adresse. Mais une transaction mérite aussi votre attention. Elle met fin à la procédure, et souvent avec moins d'atteinte à la réputation. Examinez donc avec votre responsable du traitement si une transaction a du sens, dès que cette possibilité se présente.", "read": {"text": "Découvrez comment la Chambre Contentieuse décide en pratique.", "links": [{"label": "Décisions", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/decisions"}]}}, {"id": 5, "type": "bullets", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 1}, "chip": "Étape 2 · Enquête", "title": "Le Service d'Inspection : mission, pouvoirs et limites", "bullets": [{"k": "Qui", "t": "des inspecteurs placés sous la direction d'un inspecteur général : l'organe d'enquête de l'APD."}, {"k": "Mission", "t": "confiée par la Chambre Contentieuse ou par le Comité de direction, ou de sa propre initiative à la suite d'indices et de signalements internes d'infractions potentielles, pour autant que l'enquête soit appropriée et nécessaire (règlement d'ordre intérieur de l'APD)."}, {"k": "Pouvoirs", "t": "questionnaire écrit, enquête sur place, audition, consultation des systèmes informatiques, saisie et mise sous scellés (art. 66, § 1er LCA ; art. 58.1 RGPD)."}, {"k": "Limite 1 : pas de « fishing expedition »", "t": "une enquête exige un motif concret et un périmètre délimité ; le Service d'Inspection ne peut pas tout fouiller dans l'espoir de trouver quelque chose."}, {"k": "Limite 2 : pas d'auto-incrimination forcée", "t": "l'organisation doit collaborer (art. 66, § 2 LCA) et fournir des informations factuelles et des documents existants, mais l'organisation ou le DPO ne peuvent pas être contraints d'avouer une infraction."}], "read": {"text": "Lisez l'article 58, paragraphe 1 du RGPD : les pouvoirs d'enquête de l'autorité de contrôle.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir l'art. 58 RGPD"}, "script": "La deuxième étape est l'enquête. Le Service d'Inspection se compose d'inspecteurs, qui travaillent sous la direction d'un inspecteur général. Le service reçoit une mission de la Chambre Contentieuse ou du Comité de direction. Le service peut aussi ouvrir une enquête de sa propre initiative, à la suite d'indices ou de signalements internes d'une infraction possible, à condition que l'enquête soit appropriée et nécessaire. Les pouvoirs sont étendus : un questionnaire écrit, une enquête sur place, une audition, la consultation des systèmes informatiques, et même la saisie et la mise sous scellés. Mais il y a deux limites. La première limite est l'interdiction de toute « fishing expedition ». Une enquête a un motif concret et un périmètre délimité. Le Service d'Inspection ne peut donc pas tout fouiller dans l'espoir de trouver quelque chose. La deuxième limite est l'interdiction de l'auto-incrimination forcée. Votre organisation doit collaborer au contrôle, et fournir des informations factuelles et des documents existants. Mais votre organisation ou vous, en tant que DPO, ne pouvez pas être contraints d'avouer une infraction."}, {"id": 6, "type": "bullets", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 1}, "chip": "Étape 2 · Enquête", "title": "Le questionnaire écrit : le DPO, premier destinataire", "bullets": [{"k": "En pratique", "t": "presque toute enquête commence par un questionnaire écrit, adressé au DPO en tant que point de contact (art. 39.1, e) RGPD)."}, {"k": "Questions typiques", "t": "qui est le DPO, le registre des activités de traitement, l'organigramme, ce qui relève ou non du périmètre (y compris techniquement), la base juridique et les durées de conservation."}, {"k": "Délai de réponse", "t": "court, souvent quelques semaines ; demandez à temps un report motivé plutôt que de répondre trop tard."}, {"k": "Documents justificatifs", "t": "politiques, AIPD, mise en balance des intérêts, contrats de sous-traitance, information des personnes concernées : le dossier, c'est la réponse."}, {"k": "En interne", "t": "signalez l'enquête à la direction et au service juridique ; convenez de qui fait quoi dans le traitement interne de toutes les questions."}], "script": "En pratique, presque toute enquête commence par un questionnaire écrit. Et il arrive chez vous, en tant que point de contact. Que demande-t-on ? Typiquement, le Service d'Inspection demande qui est le DPO, et il demande le registre des activités de traitement et l'organigramme. Il veut savoir ce qui relève ou non du périmètre du traitement, y compris sur le plan technique. Et il pose des questions sur la base juridique et sur les durées de conservation. Les délais pour répondre aux demandes du Service d'Inspection sont courts, souvent quelques semaines. Demandez à temps un report motivé si nécessaire, plutôt que de répondre trop tard. Joignez les documents justificatifs : les politiques, l'AIPD, la mise en balance des intérêts, les contrats de sous-traitance et l'information des personnes concernées. Le dossier, c'est votre réponse. Et en interne, vous signalez immédiatement l'enquête à la direction et au service juridique. Convenez de qui fait quoi dans le traitement interne de toutes les questions.", "read": {"text": "Suivez les thèmes et les constats du Service d'Inspection.", "links": [{"label": "Sous la loupe – News de l'Inspection", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/sous-la-loupe-news-de-l-inspection"}]}}, {"id": 7, "type": "compare", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 1}, "chip": "Étape 2 · Enquête", "title": "Plus exceptionnel : enquête sur place, audition et mesures provisoires", "left": {"head": "Enquête sur place et audition", "items": ["Dans une entreprise, pas d'autorisation requise ; locaux habités : consentement de l'occupant ou autorisation du juge d'instruction (art. 79 LCA) ; locaux d'un professionnel tenu au secret : accord, autorisation ou présence d'un représentant de l'ordre (art. 78 LCA)", "Mandat d'inspection mentionnant notamment l'objet de l'enquête", "Assistance d'un avocat ; mise sous scellés et saisie possibles", "Audition dans les bureaux de l'APD ou sur place, avec procès-verbal"]}, "right": {"head": "Mesures provisoires (art. 70 LCA)", "items": ["Suspension, limitation ou gel provisoire du traitement", "Pour éviter un préjudice grave, immédiat et difficilement réparable"]}, "script": "Outre le questionnaire écrit, il existe des moyens plus exceptionnels. Une enquête sur place et une audition sont possibles, mais elles sont rares en pratique. Pour une enquête sur place dans une entreprise, l'autorisation d'un juge d'instruction n'est pas nécessaire. Pour des locaux habités, il faut le consentement de l'occupant ou une autorisation du juge d'instruction. Et les locaux d'un professionnel tenu au secret, comme un avocat ou un médecin, ne sont accessibles qu'avec l'accord de ce professionnel, avec une autorisation, ou en présence d'un représentant de l'ordre professionnel. Les inspecteurs disposent d'un mandat d'inspection, dans lequel figure notamment l'objet de l'enquête. Vous pouvez vous faire assister par un avocat, et la mise sous scellés et la saisie sont possibles. Une audition a lieu dans les bureaux de l'Autorité de protection des données ou sur place, et un procès-verbal est dressé. En cas de danger urgent, le Service d'Inspection peut prendre des mesures provisoires : suspendre, limiter ou geler un traitement. Ce n'est possible que pour éviter un préjudice grave, immédiat et difficilement réparable."}, {"id": 8, "type": "reveal", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 1}, "chip": "Exercice de réflexion 1", "title": "Le questionnaire écrit est sur votre bureau", "question": "Le Service d'Inspection vous envoie, en tant que DPO, douze questions sur la vidéosurveillance dans les entrepôts. Le délai pour répondre est de trois semaines. Une question est formulée ainsi : « Confirmez que les images sont conservées plus d'un mois. » Quelles sont vos premières démarches, et comment traitez-vous cette question ?", "verdict": "Signaler, convenir, surveiller le délai, préparer le dossier ; répondre de manière factuelle et précise", "answer": [{"k": "Signaler et convenir", "t": "informer la direction et le service juridique ; convenir de qui prend en charge quelle tâche pour rassembler les réponses ; si nécessaire, faire appel à un avocat."}, {"k": "Délai", "t": "le noter et demander à temps un report motivé si nécessaire."}, {"k": "Dossier", "t": "registre, mise en balance des intérêts, durées de conservation, information des travailleurs, pictogrammes de caméra."}, {"k": "La question", "t": "répondre de manière factuelle et précise avec la durée de conservation réelle et les documents qui l'attestent ; pas de qualifications ni d'aveux non demandés."}], "script": "Place à un premier exercice de réflexion. Le Service d'Inspection vous envoie douze questions sur la vidéosurveillance dans les entrepôts. Le délai pour répondre est de trois semaines. Une question est formulée ainsi : confirmez que les images sont conservées plus d'un mois. Quelles sont vos premières démarches, et comment traitez-vous cette question ? Réfléchissez un instant. … Une première démarche consiste à signaler et à convenir. Informez la direction et le service juridique, et convenez de qui prend en charge quelle tâche pour rassembler les réponses. Faites appel à un avocat si nécessaire. Une deuxième démarche consiste à surveiller le délai de réponse. Notez le délai, et demandez à temps un report motivé si nécessaire. Une troisième démarche consiste à préparer votre dossier : le registre, la mise en balance des intérêts, les durées de conservation, l'information des travailleurs et les pictogrammes de caméra. Et comment traiter cette question ? Répondez de manière factuelle et précise, avec la durée de conservation réelle et les documents qui l'attestent. Ne donnez pas de qualifications juridiques ni d'aveux qui ne sont pas demandés."}, {"id": 9, "type": "timeline", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 2}, "chip": "Étape 3 · Procédure", "title": "La procédure devant la Chambre Contentieuse", "steps": [{"y": "Notification", "t": "notification sans délai de la décision de traiter l'affaire au fond (art. 98 LCA)"}, {"y": "Défense", "t": "conclusions et pièces utiles ; procédure écrite avec possibilité d'entendre les parties (art. 93 LCA)"}, {"y": "Décision", "t": "constat de l'infraction et mesure la plus appropriée ; encore possible : classement sans suite ou transaction (art. 100, § 1er, 1° et 4° LCA)"}], "script": "La troisième étape est la procédure devant la Chambre Contentieuse. Si la Chambre Contentieuse décide de traiter l'affaire au fond, elle le notifie sans délai aux parties. Les parties déposent leurs conclusions et leurs pièces utiles. La procédure est écrite, mais les parties peuvent être entendues. Ensuite, la Chambre Contentieuse décide s'il y a une infraction, et quelle mesure est la plus appropriée. À ce stade aussi, elle peut encore classer sans suite ou proposer une transaction. Quel est votre rôle ? L'avocat rédige les conclusions, mais c'est vous qui connaissez les faits et les documents. Lors d'une audience, vous êtes souvent à la table. Et après la décision, c'est généralement vous qui vérifiez que les mesures imposées sont exécutées.", "read": {"text": "Recherchez dans les décisions de la Chambre Contentieuse (filtre en haut de la page).", "links": [{"label": "Décisions", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/decisions"}]}}, {"id": 10, "type": "compare", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 2}, "chip": "Étape 3 · Procédure", "title": "Classement sans suite et procédure « light »", "left": {"head": "Classement sans suite (art. 95, § 1er, 3° LCA)", "items": ["Pour des raisons techniques (p. ex. preuves insuffisantes) ou d'opportunité (politique de classement sans suite de la Chambre Contentieuse)", "À motiver formellement et matériellement", "Insuffisant selon la jurisprudence de la Cour des marchés : un simple renvoi à l'absence d'impact sociétal, à une plainte auprès d'une autre instance ou à des moyens limités", "Encore possible après un examen au fond (art. 100, § 1er, 1° LCA)"]}, "right": {"head": "Procédure « light » (art. 95, § 1er, 4°-6° LCA)", "items": ["Décision prima facie : avertissement ou injonction, en principe sans débat préalable avec le défendeur", "Conditions : faits suffisamment clairs ; p. ex. une obligation d'information", "Exécutée à temps : fin du litige", "Non exécutée : examen au fond ; en outre, recours devant la Cour des marchés"]}, "script": "Deux possibilités de la Chambre Contentieuse méritent une attention particulière. La première possibilité est le classement sans suite. La Chambre Contentieuse classe sans suite pour des raisons techniques, par exemple des preuves insuffisantes, ou pour des raisons d'opportunité, selon sa politique de classement sans suite. Un classement sans suite doit être motivé formellement et matériellement. Selon la Cour des marchés, un simple renvoi à l'absence d'impact sociétal, à une plainte auprès d'une autre instance, ou à des moyens limités ne suffit pas à cet égard. Un classement sans suite reste aussi possible après un examen au fond. La deuxième possibilité est la procédure « light ». Si les faits sont suffisamment clairs, par exemple en cas d'obligation d'information non respectée, la Chambre Contentieuse peut immédiatement adresser un avertissement ou une injonction, en principe sans débat préalable. Si l'organisation s'y conforme à temps, le litige prend fin. Sinon, un examen au fond suit. Contre cet avertissement ou cette injonction, un recours est en outre ouvert devant la Cour des marchés. Pour vous, une procédure « light » est en fait une chance : corriger rapidement, et l'affaire est close.", "read": {"text": "Recherchez dans les décisions de la Chambre Contentieuse (filtre en haut de la page).", "links": [{"label": "Décisions", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/decisions"}]}}, {"id": 11, "type": "cards", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 3}, "chip": "Étape 4 · Sanctions", "title": "Plus large qu'une amende : les sanctions possibles", "cols": 3, "cards": [{"k": "Avertissement", "t": "un traitement envisagé est susceptible de violer le règlement", "sub": "Art. 58.2, a) RGPD"}, {"k": "Réprimande", "t": "le traitement a entraîné une violation du règlement", "sub": "Art. 58.2, b) RGPD"}, {"k": "Injonction : satisfaire une demande", "t": "satisfaire malgré tout à une demande d'exercice des droits", "sub": "Art. 58.2, c) RGPD"}, {"k": "Injonction : mise en conformité", "t": "adapter le traitement, d'une manière déterminée et dans un délai", "sub": "Art. 58.2, d) RGPD"}, {"k": "Injonction : communiquer la violation", "t": "informer malgré tout les personnes concernées", "sub": "Art. 58.2, e) RGPD"}, {"k": "Limitation, interdiction ou suspension", "t": "limitation ou interdiction temporaire ou définitive du traitement ; suspension des transferts", "sub": "Art. 58.2, f) et j) RGPD"}, {"k": "Astreinte", "t": "par jour d'inexécution d'une injonction", "sub": "Art. 100, § 1er LCA"}, {"k": "Amende administrative", "t": "effective, proportionnée et dissuasive", "sub": "Art. 58.2, i) et 83 RGPD", "hl": true}, {"k": "Publication", "t": "sur le site de l'APD ; au cas par cas, parfois avec identification", "sub": "Art. 100, § 1er LCA"}], "numbered": false, "script": "La quatrième étape concerne les sanctions. Ne pensez pas tout de suite à une amende. La Chambre Contentieuse dispose de bien d'autres possibilités, énumérées dans le RGPD et dans la loi portant création de l'Autorité de protection des données. Une première sanction est l'avertissement : un traitement envisagé est susceptible de constituer une infraction. Une deuxième sanction est la réprimande : le traitement a constitué une infraction. Un troisième type de sanction, ce sont les injonctions. La Chambre Contentieuse peut ordonner de satisfaire malgré tout à la demande d'une personne concernée, de mettre le traitement en conformité, d'une manière déterminée et dans un délai, ou de communiquer malgré tout une violation de données aux personnes concernées. Une quatrième sanction est la limitation ou l'interdiction, temporaire ou définitive, d'un traitement, ou la suspension d'un transfert. Une cinquième sanction est l'astreinte, par jour d'inexécution d'une injonction. Une sixième sanction est l'amende administrative, qui doit être effective, proportionnée et dissuasive. Et une septième sanction est la publication de la décision sur le site de l'Autorité de protection des données, au cas par cas, parfois avec identification de l'organisation. Attention : une réprimande assortie d'une publication peut nuire davantage à la réputation qu'une petite amende.", "read": {"text": "Recherchez dans les décisions de la Chambre Contentieuse (filtre en haut de la page).", "links": [{"label": "Décisions", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/decisions"}]}}, {"id": 12, "type": "table", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 3}, "chip": "Étape 4 · Sanctions", "title": "Deux catégories d'amendes (art. 83.4 et 83.5-6 RGPD)", "intro": "Attention aux obligations relatives au DPO dans la première catégorie.", "head": ["Jusqu'à 10 M€ ou 2 % (art. 83.4)", "Jusqu'à 20 M€ ou 4 % (art. 83.5-6)"], "rows": [["Enfants (art. 8) · dès la conception et par défaut (art. 25)", "Principes, base juridique, consentement, catégories particulières (art. 5-7, 9)"], ["Responsables conjoints, sous-traitants (art. 26-29)", "Droits des personnes concernées (art. 12-22)"], ["Registre et coopération (art. 30-31)", "Transferts hors de l'EEE (art. 44-49)"], ["Sécurité et violations de données (art. 32-34) · AIPD (art. 35-36)", "Droit national, chapitre IX (art. 85-91)"], ["Désignation, fonction et missions du DPO (art. 37-39)", "Non-respect d'une injonction ou refus d'accès (art. 58 ; 83.6)"]], "hl": [4], "read": {"text": "Lisez l'article 83 du RGPD dans son intégralité.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir l'art. 83 RGPD"}, "script": "Pour les amendes, le RGPD prévoit deux catégories. La première catégorie va jusqu'à dix millions d'euros, ou pour une entreprise jusqu'à deux pour cent du chiffre d'affaires annuel mondial si ce montant est plus élevé. Cette catégorie couvre notamment les infractions relatives au consentement des enfants, à la protection des données dès la conception et par défaut, et aux règles sur les responsables conjoints et les sous-traitants, sur le registre et sur la coopération avec l'autorité de contrôle. Cette catégorie couvre aussi les manquements en matière de sécurité, et le non-respect des obligations relatives aux violations de données et à l'AIPD. Et, attention : les règles sur la désignation, la fonction et les missions du DPO lui-même relèvent elles aussi de cette première catégorie. La seconde catégorie va jusqu'à vingt millions d'euros, ou pour une entreprise jusqu'à quatre pour cent du chiffre d'affaires annuel mondial si ce montant est plus élevé. Cette catégorie couvre les principes de base, la licéité, le consentement et les catégories particulières de données à caractère personnel. Cette catégorie d'amendes couvre aussi les droits des personnes concernées, les transferts hors d'Europe, le droit national relatif à des situations particulières, et le non-respect d'une injonction ou le refus d'accès. Notez donc qu'une infraction aux règles relatives au DPO est elle-même passible d'une amende. Une organisation tenue de désigner un DPO qui ne le fait pas, ou qui n'associe pas le DPO à temps ou ne lui donne pas de moyens, risque une amende jusqu'à dix millions d'euros, ou pour une entreprise jusqu'à deux pour cent du chiffre d'affaires annuel mondial si ce montant est plus élevé."}, {"id": 13, "type": "bullets", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 3}, "chip": "Étape 4 · Sanctions", "title": "Le montant de l'amende", "bullets": [{"k": "Critères (art. 83.2 RGPD)", "t": "notamment la nature, la gravité et la durée ; le caractère délibéré ou la négligence ; les mesures d'atténuation du dommage ; les violations antérieures ; la coopération ; les catégories de données."}, {"k": "Montant de départ (CEPD 04/2022)", "t": "selon la gravité : faible 0-10 %, moyenne 10-20 %, élevée 20-100 % du maximum légal applicable ; ensuite ajusté au chiffre d'affaires de l'entreprise."}, {"k": "Aggravant ou atténuant", "t": "chaque critère ne peut être pris en compte qu'une seule fois ; ensuite, contrôle au regard du maximum légal et du caractère effectif, proportionné et dissuasif."}, {"k": "Autorités publiques belges (art. 221, § 2 de la loi du 30 juillet 2018)", "t": "pas d'amendes administratives, sauf si l'autorité offre des biens ou des services sur un marché ; les autres mesures correctrices s'appliquent bel et bien."}], "read": {"text": "Lisez les lignes directrices 04/2022 du CEPD sur le calcul des amendes administratives.", "url": "https://www.edpb.europa.eu/documents/guideline/guidelines-042022-on-the-calculation-of-administrative-fines-under-the-gdpr_en", "label": "Ouvrir les lignes directrices"}, "script": "Comment la Chambre Contentieuse fixe-t-elle le montant d'une amende ? Le RGPD énumère des critères à cet effet. Un premier critère est la nature, la gravité et la durée de l'infraction. Un deuxième critère est le fait que l'infraction a été commise délibérément ou par négligence. Un troisième critère, ce sont les mesures prises par l'organisation pour atténuer le dommage subi par les personnes concernées. Un quatrième critère, ce sont les éventuelles infractions antérieures. Un cinquième critère est le degré de coopération de l'organisation avec l'autorité de contrôle. Et un sixième critère est le type de données à caractère personnel concernées, par exemple des données de santé. Le Comité européen de la protection des données a élaboré une méthode par étapes pour le calcul. Le montant de départ dépend de la gravité de l'infraction. Pour une gravité faible, il s'élève jusqu'à dix pour cent du maximum légal, pour une gravité moyenne entre dix et vingt pour cent, et pour une gravité élevée entre vingt et cent pour cent. Suit ensuite un ajustement au chiffre d'affaires de l'entreprise, et il est tenu compte des circonstances aggravantes ou atténuantes. Chaque critère n'y compte qu'une seule fois. Enfin, la Chambre Contentieuse vérifie le maximum légal, et examine si l'amende est effective, proportionnée et dissuasive. Deux de ces critères sont en partie entre vos mains, en tant que DPO : l'atténuation du dommage, et la coopération avec l'autorité de contrôle. Encore une particularité belge : les autorités publiques ne reçoivent pas d'amendes administratives, sauf si elles offrent des biens ou des services sur un marché. Les autres sanctions s'appliquent bel et bien."}, {"id": 14, "type": "reveal", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 3}, "chip": "Exercice de réflexion 2", "title": "« Quelle sanction risquons-nous ? »", "question": "Un hôpital a notifié à temps une violation de données à l'APD, mais n'a pas informé les patients touchés, alors que le risque était élevé. L'APD ouvre un dossier. Le directeur vous demande : « Que risquons-nous, et que pouvons-nous encore faire maintenant ? »", "verdict": "Une injonction de communication, une réprimande ou une amende de la catégorie jusqu'à 2 % ; agir maintenant compte", "answer": [{"k": "Sanctions possibles", "t": "injonction de communiquer la violation de données aux personnes concernées (art. 58.2, e)), réprimande (art. 58.2, b)), éventuellement assortie d'une astreinte et d'une publication."}, {"k": "Amende", "t": "l'art. 34 relève de la catégorie jusqu'à 10 millions d'euros ou 2 % (art. 83.4) ; l'exception belge pour les autorités publiques (art. 221, § 2) ne joue sans doute pas, car un hôpital public offre généralement des soins en concurrence avec des hôpitaux privés."}, {"k": "Agir maintenant", "t": "informer malgré tout les patients, limiter le dommage et le documenter : circonstances atténuantes (art. 83.2, c))."}, {"k": "Coopérer", "t": "communiquer de manière ouverte et complète avec l'APD (art. 31 et 83.2, f))."}], "script": "Place à un deuxième exercice de réflexion. Un hôpital a notifié à temps une violation de données à l'Autorité de protection des données, mais n'a pas informé les patients touchés, alors que le risque était élevé. L'Autorité de protection des données ouvre un dossier. Le directeur vous demande : que risquons-nous, et que pouvons-nous encore faire maintenant ? Réfléchissez un instant. … Les sanctions possibles sont une injonction de communiquer malgré tout la violation aux patients, et une réprimande, éventuellement assortie d'une astreinte et d'une publication. Une amende relève de la catégorie jusqu'à dix millions d'euros, ou pour une entreprise jusqu'à deux pour cent du chiffre d'affaires si ce montant est plus élevé. Mais attention à l'exception belge pour les autorités publiques. Un hôpital public offre généralement des soins en concurrence avec des hôpitaux privés. Cette exception ne joue alors sans doute pas. Que peut encore faire l'hôpital maintenant ? Il peut informer malgré tout les patients, limiter le dommage, et le documenter. Et il peut coopérer ouvertement avec l'Autorité de protection des données. Ce sont précisément les circonstances atténuantes que la Chambre Contentieuse examine."}, {"id": 15, "type": "timeline", "nav": {"items": ["Saisine", "Enquête", "Procédure", "Sanctions", "Recours"], "active": 4}, "chip": "Étape 5 · Recours", "title": "Le recours devant la Cour des marchés", "steps": [{"y": "Décision", "t": "notification aux parties ; exécutoire par provision, même en cas de recours, sauf décision contraire de la Chambre Contentieuse (art. 108, § 1er LCA)"}, {"y": "30 jours", "t": "recours devant la Cour des marchés dans les 30 jours de la notification de la décision de la Chambre Contentieuse (art. 108, § 1er LCA) ; tiers intéressés : dans les 30 jours de la publication sur le site (art. 108, § 3 LCA)"}, {"y": "Cour des marchés", "t": "section de la cour d'appel de Bruxelles : contrôle de la légalité, de la motivation, de la minutie et de la proportionnalité ; recours effectif (art. 78 RGPD)"}, {"y": "Arrêt", "t": "confirmation ou annulation de la décision ; ensuite uniquement pourvoi en cassation"}], "script": "La cinquième et dernière étape est le recours. La Cour des marchés est une section de la cour d'appel de Bruxelles. Elle connaît des recours contre les décisions de certaines autorités de contrôle, dont l'Autorité de protection des données, et statue en premier et dernier ressort. Elle vérifie si la décision est légale, soigneusement préparée, bien motivée et proportionnée. Elle peut confirmer ou annuler la décision. Ensuite, seul un pourvoi en cassation est encore possible. La Cour des marchés constitue ainsi le recours effectif qu'exige le RGPD. La Cour des marchés fait toutefois preuve de retenue. Elle ne se substitue pas simplement à la Chambre Contentieuse, mais vérifie par exemple si une sanction est proportionnée. Contre une décision de la Chambre Contentieuse, votre organisation peut introduire un recours devant la Cour des marchés, dans les trente jours après la notification de la décision par la Chambre Contentieuse. Les tiers intéressés peuvent aussi introduire un recours, dans les trente jours de la publication de la décision sur le site. Attention : le recours ne suspend pas la décision de la Chambre Contentieuse. Cette décision est exécutoire par provision, sauf décision contraire de la Chambre Contentieuse. Votre organisation doit donc exécuter les mesures imposées, même si elle introduit un recours. Pour vous, cela signifie : dès qu'une décision arrive, avertissez immédiatement la direction et l'avocat. Trente jours passent vite.", "read": {"text": "Les arrêts de la Cour des marchés figurent parmi les décisions sur le site de l'APD (filtre « Arrêts de la Cour des marchés »).", "links": [{"label": "Décisions", "url": "https://www.autoriteprotectiondonnees.be/professionnel/publications/decisions"}]}}, {"id": 16, "type": "summary", "chip": "Synthèse", "title": "Ce que vous retenez", "key": "Un dossier à l'APD suit un déroulement typique de la saisine à une éventuelle sanction et à un recours, en passant par l'enquête et la procédure, et à chaque moment le DPO est le point de contact et la mémoire du dossier.", "bullets": [{"k": "Saisine", "t": "le plus souvent une plainte ou une demande de médiation via le Service de Première Ligne (art. 58-60 LCA) ; expliquez-le à la personne concernée et prenez une médiation au sérieux."}, {"k": "Enquête", "t": "le plus souvent un questionnaire écrit adressé au DPO ; répondre de manière factuelle et précise, sans qualifications non demandées ; surveiller les délais de réponse."}, {"k": "Procédure et sanctions", "t": "la Chambre Contentieuse choisit sa voie ; sanctions de l'avertissement à l'amende (art. 58.2 et 83 RGPD) ; informez le responsable du traitement."}, {"k": "Recours", "t": "devant la Cour des marchés, dans les trente jours de la notification de la décision (art. 108 LCA)."}], "script": "Que retenez-vous ? Un dossier à l'Autorité de protection des données suit un déroulement typique en cinq étapes. La saisine passe le plus souvent par le Service de Première Ligne. Là, vous expliquez à la personne concernée comment se déroule une plainte, et vous prenez une médiation au sérieux. Lors d'une enquête, vous recevez le plus souvent un questionnaire écrit. Répondez de manière factuelle et précise, sans qualifications non demandées, et surveillez les délais de réponse. Dans la procédure, la Chambre Contentieuse choisit sa voie, et vous êtes la mémoire du dossier. Sur les sanctions, vous informez votre responsable du traitement : elles vont de l'avertissement à l'amende. Et contre la décision de la Chambre Contentieuse, un recours est ouvert devant la Cour des marchés, dans les trente jours de la notification de cette décision. À chaque moment, vous êtes le point de contact."}], "quiz": [{"q": "Une personne concernée mécontente demande comment introduire une plainte auprès de l'APD. Que lui dites-vous ?", "options": ["Gratuitement, via le formulaire de l'APD.", "D'abord désigner un avocat.", "Payer des frais de dossier.", "D'abord saisir le juge."], "answer": 0, "feedback": ["Exact. Gratuite (art. 59 LCA), écrite, datée et signée (art. 58 LCA).", "Un avocat n'est pas nécessaire pour une plainte auprès de l'APD.", "Une plainte auprès de l'APD est gratuite.", "Une plainte ne requiert aucune procédure préalable devant le juge."]}, {"q": "Que se passe-t-il si une médiation du Service de Première Ligne échoue ?", "options": ["Le dossier est automatiquement clôturé.", "Elle peut devenir une plainte.", "L'organisation reçoit d'emblée une amende.", "La personne concernée doit saisir la Cour des marchés."], "answer": 1, "feedback": ["Une médiation qui échoue ne clôture pas automatiquement le dossier.", "Exact. Avec l'accord du demandeur, ou en cas d'indices sérieux d'une infraction.", "Seule la Chambre Contentieuse inflige une amende, après une procédure.", "La Cour des marchés connaît des recours contre les décisions de la Chambre Contentieuse."]}, {"q": "Quelle possibilité la Chambre Contentieuse n'a-t-elle PAS face à une plainte recevable ?", "options": ["Faire mener une enquête par le Service d'Inspection.", "Classer la plainte sans suite.", "Accorder des dommages et intérêts à la personne concernée.", "Proposer une transaction."], "answer": 2, "feedback": ["C'est bien possible.", "Le classement sans suite est possible, moyennant motivation.", "Exact. Seul le juge accorde des dommages et intérêts (art. 82 RGPD).", "Une transaction est bien possible."]}, {"q": "Comment une enquête du Service d'Inspection commence-t-elle le plus souvent en pratique ?", "options": ["Par une perquisition sans préavis.", "Par la saisie des serveurs.", "Par une audience publique.", "Par un questionnaire écrit."], "answer": 3, "feedback": ["Une enquête sur place est possible, mais exceptionnelle.", "La saisie est possible, mais exceptionnelle.", "Une audience relève de la procédure au fond.", "Exact. Adressé au DPO en tant que point de contact."]}, {"q": "Qu'implique l'interdiction de l'auto-incrimination forcée lors d'une enquête ?", "options": ["Ne répondre à aucune question.", "Fournir faits et documents, sans avouer d'infraction.", "Le DPO ne peut pas être entendu.", "Le Service d'Inspection ne peut demander aucun document."], "answer": 1, "feedback": ["Il faut bel et bien répondre aux questions factuelles.", "Exact. C'est pourquoi vous répondez de manière factuelle et précise, sans qualifications non demandées.", "Le DPO peut bel et bien être entendu.", "Demander des documents est bel et bien permis."]}, {"q": "Qu'est-ce qui caractérise la procédure « light » ?", "options": ["L'organisation est toujours d'abord longuement entendue.", "Elle aboutit toujours à une amende administrative.", "Un avertissement ou une injonction sans audition préalable.", "Elle n'est possible que pour les autorités publiques."], "answer": 2, "feedback": ["Dans une procédure « light », justement, on n'entend pas d'abord l'organisation.", "Elle mène à un avertissement ou à une injonction, pas à une amende.", "Exact. S'il n'y est pas donné suite, un examen au fond suit.", "La procédure « light » vaut pour toute organisation."]}, {"q": "Quelle est la différence entre un avertissement et une réprimande ?", "options": ["Aucune différence : les deux termes signifient la même chose.", "L'avertissement regarde vers l'avant, la réprimande en arrière.", "Une réprimande va toujours de pair avec une amende.", "Un avertissement ne vaut que pour les sous-traitants."], "answer": 1, "feedback": ["Il y a bel et bien une différence.", "Exact. Art. 58.2, a) et b) RGPD.", "Une réprimande est indépendante d'une amende.", "Les deux valent pour les responsables du traitement et les sous-traitants."]}, {"q": "Dans quelle catégorie d'amendes tombe une infraction aux obligations relatives à la désignation et aux missions du DPO ?", "options": ["Jusqu'à 20 millions d'euros ou 4 %.", "Aucune amende n'est possible.", "Seule une astreinte est possible.", "Jusqu'à 10 millions d'euros ou 2 %."], "answer": 3, "feedback": ["Cette catégorie vaut notamment pour les principes de base et les droits des personnes concernées.", "Une amende est bel et bien possible.", "Une amende est aussi possible.", "Exact. Les art. 37-39 relèvent de l'art. 83.4 RGPD."]}, {"q": "L'APD peut-elle infliger une amende administrative à une commune belge qui n'offre pas de biens ou de services sur un marché ?", "options": ["Oui, comme à toute organisation.", "Non, mais bien les autres sanctions.", "Oui, mais seulement jusqu'à dix millions d'euros.", "Oui, mais seulement après un avertissement."], "answer": 1, "feedback": ["La Belgique a prévu une exception pour les autorités publiques.", "Exact. Art. 221, § 2 de la loi du 30 juillet 2018 ; une réprimande, une injonction ou une interdiction restent possibles.", "L'exception vaut pour l'amende elle-même.", "Un avertissement préalable ne change rien à l'exception."]}, {"q": "Dans quel délai et devant quelle juridiction introduisez-vous un recours contre une décision de la Chambre Contentieuse ?", "options": ["30 jours, Cour des marchés.", "1 an, Conseil d'État.", "15 jours, juge de paix.", "60 jours, Cour constitutionnelle."], "answer": 0, "feedback": ["Exact. Art. 108, § 1er LCA : dans les 30 jours de la notification de la décision de la Chambre Contentieuse.", "Le Conseil d'État n'est pas compétent ici.", "Le juge de paix n'est pas compétent ici.", "La Cour constitutionnelle n'est pas compétente ici."]}]}</script>
