<!DOCTYPE html>
<html lang="fr" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 14 · Codes de conduite, certification et accréditation</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.back{color:var(--accent);border-color:var(--accent)}
nav.main a.dl{display:inline-block;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--accent);text-decoration:none;background:var(--card-bg)}nav.main a.dl:hover{background:var(--chip-bg)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}
/* verdieping (sprong naar een aparte verdiepingsmodule) */
.readmore.deep{border-top:1px dashed var(--line)}
.readmore.deep a.btn{background:var(--btn-bg);color:var(--btn-text)}
.readmore.deep .lbl{font-weight:700;color:var(--accent)}
/* avatar (HeyGen): video in plaats van audio; het tekstpaneel kan inklappen, de avatar blijft zichtbaar */
.avatar-box{position:relative;background:#e9e9e6;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:1/1}
.avatar-box video{width:100%;height:100%;object-fit:cover;display:block}
.avatar-box .avatar-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.transcript.has-avatar.notext .t-body{display:none}
.transcript.has-avatar.notext{max-height:none}
@media (max-width:1099px){
  .transcript.has-avatar .avatar-box{position:fixed;right:12px;bottom:12px;width:150px;z-index:60;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side ul.bul{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px}
@media (max-width:900px){.figure.stack .side ul.bul{grid-template-columns:1fr}}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
/* flipkaarten: s.flip=true -> kaart toont k (+ q) en na een klik de uitleg t (+ sub) */
.cards .cd.flip{cursor:pointer;min-height:clamp(150px,22vw,250px);transition:border-color .15s}.cards .cd.flip:hover,.cards .cd.flip:focus{border-color:var(--accent);outline:none}
.cards .cd.flip .ft,.cards .cd.flip .sub{display:none}.cards .cd.flip .fq{font-style:italic}.cards .cd.flip .fh{margin-top:auto;color:var(--accent);font-weight:700;font-size:clamp(10px,1.05vw,13px)}
.cards .cd.flip.open{background:var(--card-bg);border-color:var(--accent)}.cards .cd.flip.open .ft{display:inline}.cards .cd.flip.open .sub{display:block}.cards .cd.flip.open .fq,.cards .cd.flip.open .fh{display:none}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl a.tlink{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tbl a.tlink:hover{text-decoration-thickness:2px}
.tbl .recchip{display:inline-block;margin-top:4px;font:inherit;font-weight:500;font-size:.82em;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .recchip:hover{background:var(--chain-bg)}
.tbl td:first-child .recchip{display:block;width:max-content}
.tbl-hint{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:8px}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* opname (Vimeo) */
.readmore.rec{border-top:1px dashed var(--line);margin-top:8px}
.readmore.rec .btn{font-variant-numeric:tabular-nums}
.readmore.rec .btn small{font-weight:400;opacity:.8;margin-left:4px}
.rec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-head h1{margin-bottom:4px}
.rec-src{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rec-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.rec-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rec-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.rec-ch{position:relative;max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.rec-ch h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 12px 4px;position:sticky;top:0;background:var(--card-bg)}
.rec-ch button{display:grid;grid-template-columns:58px 1fr;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);background:var(--card-bg)}
.rec-ch button:hover{background:var(--chain-bg)}
.rec-ch button.on{background:var(--chip-bg);color:var(--chip-text)}
.rec-ch button .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.rec-ch button .qp{font-weight:700;color:var(--muted)}
.rec-ch h4.rv{font-size:13px;color:var(--title);background:var(--chain-bg);z-index:1}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}.rec-ch{max-height:none}}
.intro-src{font-size:13px;color:var(--muted);margin:-14px 0 22px;line-height:1.5}

/* profielkeuze */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 18px}
.profiles .qset b{font-size:clamp(16px,1.8vw,21px)}
.profchip{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:999px;vertical-align:middle}
/* meer weten: verwijzingen naar de opname */
.pointers{display:grid;gap:clamp(8px,1.2vw,14px)}
.pointers .pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--chain-bg);border-radius:12px;padding:clamp(10px,1.3vw,16px) clamp(12px,1.6vw,20px)}
.pointers .pt b{color:var(--title);font-size:clamp(13px,1.45vw,17px)}
.pointers .pt span{grid-column:1;font-size:clamp(12px,1.2vw,15px);line-height:1.4}
.pointers .pt .btn{grid-column:2;grid-row:1/span 2;font-variant-numeric:tabular-nums}
.pointers .pt .btn small{font-weight:400;opacity:.85;margin-left:6px}
.pointers .lead{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(6px,1vw,12px)}
@media (max-width:640px){.pointers .pt{grid-template-columns:1fr}.pointers .pt .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.btn .ico{display:inline-flex;align-items:center;font-style:normal}
.actions.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.actions.three .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;white-space:normal;line-height:1.25}
@media (max-width:760px){.actions.three{grid-template-columns:1fr}}
.navtop .controls{margin:0 0 14px}
.dotsrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.dotsrow .dots{margin-top:0}
.dotsrow .btn.mini{padding:6px 14px;font-size:18px;line-height:1.2;flex-shrink:0}
.dotsrow .btn.mini span{font-size:14px;margin-right:6px}
.dotsrow .btn.mini span:empty{display:none}
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.q-ctx{background:var(--chain-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:clamp(13.5px,1.35vw,16px);line-height:1.5;color:var(--text)}
.q-ctx .ctx-k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.fb .fb-key{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95em}
.fb .fb-key b{display:inline;margin-right:4px}
.fb .fb-rec{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .fb-src a.btn{text-decoration:none}
.fb .fb-rec .btn small{font-weight:400;opacity:.85;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* layout-fix v1: niets mag buiten de slidekaart vallen, ook niet in een breed lettertype of met het tekstpaneel open */
#slidecard{container-type:inline-size;container-name:sl}
header.top{flex-wrap:wrap}
nav.main{flex-wrap:wrap}
.chain{grid-auto-columns:minmax(0,1fr)}.timeline{grid-auto-columns:minmax(0,1fr)}
.chain .st,.timeline .st,.cards .cd,.compare .col,.figure .side,.practice>*{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.slide li,.slide td,.slide th,.slide p{overflow-wrap:anywhere}
.slide .readmore a.btn{white-space:normal;max-width:100%;text-align:left;line-height:1.25}
@container sl (max-width:900px){
  .chain,.timeline{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));grid-auto-columns:auto}
  .chain .st:not(:last-child)::after{display:none}
  .timeline::before{display:none}
}
@container sl (max-width:640px){.cards{grid-template-columns:1fr 1fr!important}.tbl{display:block;overflow-x:auto}.tbl td:first-child{width:auto}}
@container sl (max-width:380px){.cards{grid-template-columns:1fr!important}}
.slide h1,.slide h2,.slide h3{overflow-wrap:anywhere;hyphens:auto}
.slide a.btn{white-space:normal;max-width:100%}
.btn{max-width:100%}
@media (max-width:640px){.btn{white-space:normal}}
.optbar,.resume{flex-wrap:wrap}.optbar .btn,.resume .btn{min-width:0;white-space:normal}
/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

, "read_label": "Ouvrir le RGPD sur EUR-Lex", "deep_label": "Approfondissement", "deep_btn": "Ouvrir l'approfondissement", "flip_hint": "Cliquez pour retourner la carte"}, "nav_top": true, "silent": true, "slides": [{"id": 1, "type": "title", "title": "Un cachet n'est pas une preuve : codes de conduite, certification et accréditation", "subtitle": "Les articles 40 à 43 du RGPD : ce que valent un code de conduite et un certificat, qui peut les délivrer, et comment distinguer un vrai certificat RGPD d'un label du marché", "script": "Votre organisation choisit un nouveau logiciel. Dans l'offre du fournisseur figurent trois éléments censés inspirer confiance. Un logo avec les mots cent pour cent conforme au RGPD. Un certificat ISO 27001. Et un certificat Europrivacy pour le service lui-même. La direction vous demande, à vous, le DPO : est-ce que cela suffit ? Cela dépend de ce qui se cache derrière chacun des trois : qui l'a délivré, sur la base de quelles règles, et qui contrôle celui qui l'a délivré ? Giovanni Buttarelli, qui fut jusqu'en 2019 le Contrôleur européen de la protection des données, l'autorité de contrôle des institutions européennes, appelait la certification une carte de visite pour la responsabilité. Dans ce module, vous apprenez à lire cette carte de visite. D'abord, un aperçu de ce qui vous attend."}, {"type": "cards", "cols": 3, "numbered": false, "chip": "Aperçu", "title": "Ce que vous apprenez dans ce module, en trois parties", "cards": [{"k": "Partie 1 · Aperçu", "t": "ce que sont une marque, un sceau et un certificat, et les articles sur les codes de conduite d'une part et sur la certification d'autre part."}, {"k": "Partie 2 · Certification", "t": "d'abord des notions courantes et les principes : normalisation, accréditation, évaluation de la conformité et certification. Puis la certification selon le RGPD : le certificat, avec ses avantages et ses limites, et qui contrôle le certificateur (articles 42 et 43)."}, {"k": "Partie 3 · Codes de conduite", "t": "auxquels une organisation peut adhérer (articles 40 et 41), et ce que les codes de conduite et les certificats vous apportent sur le plan juridique."}], "script": "Ce module comporte trois parties. La première partie est un aperçu : ce que sont une marque, un sceau et un certificat, et les articles sur les codes de conduite d'une part et sur la certification d'autre part. La deuxième partie porte sur la certification. D'abord, nous voyons des notions courantes et les principes : normalisation, accréditation, évaluation de la conformité et certification. Puis la certification selon le RGPD : le certificat qu'une organisation peut obtenir pour un traitement, avec ses avantages et ses limites, et la question de savoir qui contrôle le certificateur. La troisième partie porte sur les codes de conduite, auxquels une organisation peut adhérer, et sur ce que les codes de conduite et les certificats vous apportent sur le plan juridique.", "id": 2, "note": "Comptez environ 27 minutes, avec une réflexion et dix questions d'exercice."}, {"id": 3, "type": "cards", "flip": true, "cols": 3, "numbered": false, "chip": "Partie 1 · Aperçu", "title": "Marque, sceau ou certificat ? Une certification peut y mener", "cards": [{"k": "Marque", "q": "Qui est derrière le marquage CE sur un appareil ?", "t": "Une marque est une déclaration du producteur lui-même. Avec le marquage CE, le fabricant déclare que son produit respecte les règles européennes. Un tiers n'intervient pas nécessairement.", "sub": "p. ex. le marquage CE"}, {"k": "Sceau", "q": "Que montre un cachet de cire sur une lettre ?", "t": "Un sceau rend visibles l'origine et l'intégrité : il montre de qui vient quelque chose et que personne n'y a touché. Autrefois avec de la cire, aujourd'hui avec un sceau électronique fondé sur la cryptographie.", "sub": "p. ex. cachet de cire, sceau électronique"}, {"k": "Certificat", "q": "Que recevez-vous après un audit réussi ?", "t": "Un certificat est une attestation formelle d'un tiers. Il relie le résultat d'une évaluation à une organisation ou à une personne, pour une période déterminée.", "sub": "p. ex. attestation d'un tiers"}], "script": "Vous êtes-vous déjà demandé si l'on peut voir, à un produit ou à un service, qu'il est conforme au RGPD ? Vous l'avez sûrement déjà vu : une petite icône sur un site web qui dit : conforme au RGPD. Souvent, ce sont des déclarations de l'entreprise elle-même, mais ce n'est pas obligatoire : le RGPD prévoit bel et bien un mécanisme pour cela. Une certification peut mener à une marque, à un sceau ou à un certificat, et le RGPD les cite tous les trois : mécanismes de certification, labels et marques en matière de protection des données. Sur la diapositive figurent trois cartes. Cliquez dessus pour les retourner. Une marque est une déclaration du producteur lui-même. L'exemple le plus connu est le marquage CE sur un appareil : le fabricant déclare que son produit respecte les règles européennes, et un tiers n'intervient pas nécessairement. Un sceau rend visibles l'origine et l'intégrité. Il montre de qui vient quelque chose et que personne n'y a touché. Autrefois, cela se faisait avec un cachet de cire sur une lettre, aujourd'hui avec un sceau électronique fondé sur la cryptographie. Et un certificat est une attestation formelle d'un tiers. Il relie le résultat d'une évaluation à une organisation ou à une personne, pour une période déterminée.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "comment contrôler un label RGPD : ce qu'il faut regarder et comment le rechercher."}}, {"type": "figure", "layout": "stack", "chip": "Partie 1 · Les articles 40 à 43", "title": "Les quatre articles : deux paires", "svg": "<svg viewBox=\"0 0 1010 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Les articles 40 et 41 vont ensemble, les articles 42 et 43 vont ensemble\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"252\" y=\"42\" text-anchor=\"middle\">PARTIE 2<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"252\" y=\"68\" text-anchor=\"middle\">Certification : certification et accréditation<\/text><rect class=\"cbx2\" x=\"28\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"128.0\" y=\"158.0\" text-anchor=\"middle\">Article 42<\/text><text class=\"b2\" x=\"128.0\" y=\"182.0\" text-anchor=\"middle\">le certificat lui-même<\/text><rect class=\"cbx2\" x=\"277\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"377.0\" y=\"158.0\" text-anchor=\"middle\">Article 43<\/text><text class=\"b2\" x=\"377.0\" y=\"182.0\" text-anchor=\"middle\">qui peut certifier<\/text><line class=\"bln\" x1=\"232\" y1=\"160\" x2=\"272\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"515\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"757\" y=\"42\" text-anchor=\"middle\">PARTIE 3<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"757\" y=\"68\" text-anchor=\"middle\">Codes de conduite<\/text><rect class=\"cbx2\" x=\"533\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"633.0\" y=\"158.0\" text-anchor=\"middle\">Article 40<\/text><text class=\"b2\" x=\"633.0\" y=\"182.0\" text-anchor=\"middle\">le code de conduite lui-même<\/text><rect class=\"cbx2\" x=\"782\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"882.0\" y=\"158.0\" text-anchor=\"middle\">Article 41<\/text><text class=\"b2\" x=\"882.0\" y=\"182.0\" text-anchor=\"middle\">le contrôle du code<\/text><line class=\"bln\" x1=\"737\" y1=\"160\" x2=\"777\" y2=\"160\" marker-end=\"url(#cah)\"/><\/svg>", "caption": "Ensemble, ils forment la section 5 du chapitre IV du RGPD : codes de conduite et certification.", "read": {"text": "Ouvrez les articles 40 à 43 du RGPD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "Voici les quatre articles dont traite ce module, en deux paires. Ils figurent ensemble dans la section 5 du chapitre IV du RGPD, sous le titre codes de conduite et certification. À gauche figurent les articles 42 et 43. L'article 42 porte sur la certification : un tiers indépendant certifie un traitement, de manière volontaire et pour trois ans au maximum. L'article 43 dit qui peut certifier : uniquement des organismes eux-mêmes accrédités, en Belgique par BELAC. Ces deux articles forment ensemble la deuxième partie de ce module, sur la certification. À droite figurent les articles 40 et 41. L'article 40 porte sur les codes de conduite : des secteurs qui traduisent le RGPD dans leur pratique, avec l'approbation de l'autorité de contrôle. L'article 41 règle le contrôle de ces codes, par un organisme lui-même accrédité. Ces deux articles forment ensemble la troisième et dernière partie, sur les codes de conduite. Mais d'abord les notions et les principes, car sans ce vocabulaire, les articles restent abstraits.", "id": 4}, {"id": 5, "type": "figure", "layout": "stack", "chip": "Partie 2.1 · Notions", "title": "De la norme au certificat : qui fait quoi ?", "svg": "<svg viewBox=\"0 0 1010 372\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"De la norme au certificat\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accréditation<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certification<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Normalisation<\/text><rect class=\"cbx2\" x=\"14\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"78\" text-anchor=\"middle\">Global ACI<\/text><text class=\"ct2\" x=\"139.0\" y=\"95\" text-anchor=\"middle\">coupole mondiale de l&#x27;accréditation<\/text><rect class=\"cbx2\" x=\"14\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"176\" text-anchor=\"middle\">EA<\/text><text class=\"ct2\" x=\"139.0\" y=\"193\" text-anchor=\"middle\">coupole européenne de l&#x27;accréditation<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">Belgique<\/text><line class=\"cln2\" x1=\"139.0\" y1=\"112\" x2=\"139.0\" y2=\"146\" marker-end=\"url(#cah2)\"/><line class=\"cln2\" x1=\"139.0\" y1=\"210\" x2=\"139.0\" y2=\"244\" marker-end=\"url(#cah2)\"/><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Organisme de certification<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">p. ex. Brand Compliance, Vinçotte<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Auditeur<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">évaluation de la conformité<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Organisation<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">reçoit le certificat<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accrédite<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">désigne<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">évalue<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certifie<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">monde<\/text><rect class=\"cbx2\" x=\"746\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"176\" text-anchor=\"middle\">CEN<\/text><text class=\"ct2\" x=\"871.0\" y=\"193\" text-anchor=\"middle\">Europe<\/text><rect class=\"cbx2\" x=\"746\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"274\" text-anchor=\"middle\">NBN<\/text><text class=\"ct2\" x=\"871.0\" y=\"291\" text-anchor=\"middle\">Belgique (France : AFNOR)<\/text><line class=\"cln\" x1=\"743\" y1=\"179.0\" x2=\"660\" y2=\"179.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"703.0\" y=\"157.0\" text-anchor=\"middle\">norme =<\/text><text class=\"cl\" x=\"703.0\" y=\"171.0\" text-anchor=\"middle\">référence<\/text><text class=\"ct2\" x=\"505.0\" y=\"350\" text-anchor=\"middle\">Le résultat positif de l&#x27;évaluation de la conformité s&#x27;appelle la certification ; la preuve en est le certificat.<\/text><\/svg>", "bullets": [{"k": "Normalisation", "t": "un organisme de normalisation écrit la norme : ISO pour le monde, CEN pour l'Europe, NBN pour la Belgique."}, {"k": "Accréditation", "t": "l'organisme national d'accréditation, en Belgique BELAC, confirme qu'un organisme de certification est compétent et indépendant (règlement 765/2008)."}, {"k": "Évaluation de la conformité", "t": "un auditeur de l'organisme de certification évalue l'organisation par rapport à la norme."}, {"k": "Certification", "t": "le résultat positif de cette évaluation ; l'organisme de certification délivre le certificat."}], "read": {"text": "Lisez l'article 2, point 10, du règlement 765/2008 (la définition de l'accréditation) et voyez ce que fait BELAC.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32008R0765", "label": "Règlement 765/2008 · accréditation"}, {"url": "https://economie.fgov.be/belac", "label": "BELAC · organisme belge d'accréditation"}]}, "script": "Quatre mots sont sans cesse employés l'un pour l'autre, et le schéma les remet à leur place. À droite figure la normalisation. Un organisme de normalisation écrit la norme, la référence : ISO pour le monde, le CEN pour l'Europe, et le NBN pour la Belgique, comme le fait l'AFNOR pour la France. À gauche figure l'accréditation. Un organisme d'accréditation confirme qu'un organisme de certification est compétent et indépendant. Chaque État membre en a un seul, ainsi le veut le règlement 765 de 2008. En Belgique, c'est BELAC. BELAC est lui-même évalué par ses collègues européens au sein d'EA, la coopération européenne pour l'accréditation, qui s'inscrit dans la coupole mondiale, depuis début 2026 Global ACI, en toutes lettres la Global Accreditation Cooperation. Au milieu se trouve le travail proprement dit. L'organisme de certification, par exemple Brand Compliance, Vinçotte ou TÜV Nord, désigne un auditeur. Celui-ci réalise chez l'organisation l'évaluation de la conformité : il confronte ce qu'il voit à la norme. Si le résultat est positif, l'organisme de certification délivre le certificat. Ce résultat positif s'appelle la certification."}, {"type": "figure", "chip": "Partie 2.1 · Un exemple connu", "title": "Un exemple connu : la certification en sécurité de l'information", "svg": "<svg viewBox=\"0 0 700 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Un système de management en cycle\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"680\" height=\"380\" rx=\"20\"/><text class=\"bh\" x=\"350\" y=\"50\" text-anchor=\"middle\">UN SYSTÈME DE MANAGEMENT<\/text><rect class=\"cbx\" x=\"235\" y=\"160\" width=\"230\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"208.0\" text-anchor=\"middle\">Politique et<\/text><text class=\"b2\" x=\"350.0\" y=\"232.0\" text-anchor=\"middle\">objectifs<\/text><rect class=\"cbx2\" x=\"260\" y=\"76\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"112.0\" text-anchor=\"middle\">Planifier<\/text><rect class=\"cbx2\" x=\"490\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"575.0\" y=\"208.0\" text-anchor=\"middle\">Mettre en œuvre<\/text><rect class=\"cbx2\" x=\"260\" y=\"288\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"324.0\" text-anchor=\"middle\">Contrôler<\/text><rect class=\"cbx2\" x=\"40\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"125.0\" y=\"208.0\" text-anchor=\"middle\">Ajuster<\/text><path class=\"bln\" d=\"M445,104 C510,104 570,130 575,166\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M575,234 C570,275 510,316 445,316\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M255,316 C190,316 130,275 125,234\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M125,166 C130,130 190,104 255,104\" marker-end=\"url(#cah)\"/><text class=\"bc\" x=\"350\" y=\"374\" text-anchor=\"middle\">l&#x27;organisation elle-même : politique, processus, responsabilités, suivi<\/text><\/svg>", "bullets": [{"k": "Pas le RGPD", "t": "un domaine voisin, où la certification est courante depuis des années."}, {"k": "NIS2", "t": "encourage fortement la certification et l'impose d'une certaine manière."}, {"k": "Ce qui est certifié", "t": "un système de management, comme ISO 27001, ISO 9001 et ISO 14001."}], "read": {"text": "Voyez comment le Centre pour la Cybersécurité Belgique organise l'évaluation de la conformité sous NIS2, avec ISO 27001 ou CyberFundamentals.", "links": [{"url": "https://cyfun.eu/en/cabs/cabs-belgium", "label": "CCB · évaluation de la conformité sous NIS2"}]}, "script": "Pour rendre ces notions concrètes, prenons un exemple dans un domaine où la certification est bien plus connue : la sécurité de l'information. Ce n'est donc pas le RGPD, mais un domaine voisin. Certifier y est courant depuis des années, et la directive NIS2 l'encourage encore davantage. NIS2 encourage beaucoup plus la certification et, d'une certaine manière, l'impose aussi. En Belgique, les entités essentielles font évaluer leur conformité, par une certification ou par une inspection, par un organisme accrédité et reconnu. Dans ce domaine, on certifie un système de management. Qu'est-ce que c'est ? Vous le voyez sur le dessin. Un système de management est l'ensemble de la politique et des objectifs, des processus, des responsabilités et du suivi par lesquels une organisation maîtrise systématiquement un sujet. Il tourne en cycle continu : planifier, mettre en œuvre, contrôler et ajuster. Il s'agit donc de l'organisation elle-même, de la manière dont elle fonctionne. Vous le connaissez pour la qualité, avec ISO 9001, et pour l'environnement, avec ISO 14001. En sécurité de l'information, la norme la plus connue s'appelle ISO 27001. Nous complétons maintenant le schéma de tout à l'heure avec ISO 27001.", "id": 6}, {"type": "figure", "layout": "stack", "chip": "Partie 2.1 · Le schéma complété", "title": "Le même schéma, maintenant avec ISO 27001", "svg": "<svg viewBox=\"0 0 1010 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Le schéma complété avec ISO 27001\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accréditation<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certification<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Normalisation<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">accrédite pour ISO 27001<\/text><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Brand Compliance<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">organisme de certification<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Auditeur principal<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">évalue le système de management<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Data Protection Institute<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">reçoit le certificat ISO 27001<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO/IEC 27001<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">norme pour la sécurité de l&#x27;information<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accrédite<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">désigne<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">évalue<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certifie<\/text><line class=\"cln\" x1=\"743\" y1=\"81.0\" x2=\"668\" y2=\"81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"707.0\" y=\"73.0\" text-anchor=\"middle\">référence<\/text><\/svg>", "caption": "Sans accréditation, un auditeur peut aussi évaluer, mais cela ne mène pas à un certificat reconnu.", "bullets": [{"k": "Le but", "t": "le Data Protection Institute veut se faire certifier."}, {"k": "La norme", "t": "il faut pour cela une norme : ISO/IEC 27001."}, {"k": "L'organisme", "t": "Brand Compliance, accrédité par BELAC."}, {"k": "L'auditeur", "t": "un auditeur principal évalue le système de management ; le certificat suit."}], "script": "Voici de nouveau le schéma du début de cette partie, maintenant complété pour un cas concret, et limité à l'essentiel. Supposons que le Data Protection Institute veuille se faire certifier en sécurité de l'information. De quoi a-t-il besoin ? D'abord d'une norme de référence. C'est ISO 27001, tout à droite sur le dessin, la référence. Ensuite d'un organisme de certification autorisé à délivrer le certificat. C'est Brand Compliance, accrédité par BELAC, l'organisme belge d'accréditation. Brand Compliance désigne ensuite un auditeur principal. Celui-ci évalue le système de management de l'institut par rapport à la norme. Si le résultat est positif, l'institut reçoit le certificat ISO 27001. Notez ce que dit ce certificat : quelque chose sur le système de management de l'organisation, pas sur chaque traitement de données à caractère personnel. Et remarquez encore une chose, en bas du dessin. L'audit lui-même aurait aussi pu avoir lieu sans organisme accrédité, simplement par un auditeur choisi par l'institut. Mais cela n'aurait pas mené à un certificat reconnu. C'est l'accréditation par BELAC qui donne sa valeur au certificat. Nous le reprenons maintenant, étape par étape.", "id": 7}, {"id": 8, "type": "chain", "chip": "Partie 2.1 · Les notions dans un exemple", "title": "Le certificat ISO 27001 du Data Protection Institute, étape par étape", "steps": [{"k": "La norme", "t": "ISO/IEC 27001 : les exigences pour un système de management de la sécurité de l'information."}, {"k": "L'accréditation", "t": "BELAC accrédite l'organisme de certification, ici Brand Compliance, pour cette norme."}, {"k": "L'auditeur", "t": "Brand Compliance choisit un auditeur titulaire d'un certificat personnel comme auditeur principal."}, {"k": "L'audit", "t": "l'auditeur évalue le système de management de la sécurité de l'information de l'institut par rapport à la norme."}, {"k": "Le certificat", "t": "Brand Compliance délivre à l'institut le certificat ISO 27001 ; chaque année, un audit de suivi a lieu."}], "read": {"text": "Cherchez un organisme de certification dans la liste des organismes accrédités de BELAC et voyez pour quelles normes l'accréditation vaut.", "links": [{"url": "https://economie.fgov.be/fr/themes/qualite-securite/accreditation-belac/organismes-accredites", "label": "BELAC · organismes accrédités"}]}, "script": "Reprenons cela de manière récapitulative, étape par étape. Un : la norme. ISO 27001 décrit les exigences d'un système de management de la sécurité de l'information. Deux : l'accréditation. BELAC accrédite Brand Compliance pour délivrer des certificats pour cette norme. Trois : l'auditeur. Brand Compliance choisit un auditeur principal, qui détient lui-même un certificat personnel comme preuve de sa compétence. Quatre : l'audit, l'évaluation de la conformité. L'auditeur évalue le système de management du Data Protection Institute par rapport à la norme. Cinq : le certificat. Si le résultat est positif, Brand Compliance délivre le certificat ISO 27001, et un audit de suivi a lieu chaque année. Vous voyez ici deux certificats différents : le certificat personnel de l'auditeur dit quelque chose d'une personne, le certificat ISO 27001 dit quelque chose de l'organisation. Il existe aussi une norme qui ajoute la vie privée à un tel système de management. Vous la voyez sur la diapositive suivante."}, {"type": "figure", "layout": "stack", "chip": "Partie 2.1 · ISO 27701 et le PIMS", "title": "ISO 27701 : un PIMS, mais pas un certificat RGPD", "svg": "<svg viewBox=\"0 0 1010 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Un PIMS, c&#x27;est ISO 27001 avec une couche vie privée d&#x27;ISO 27701\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><text class=\"ch\" x=\"320\" y=\"28\" text-anchor=\"middle\">Deux couches, un seul système de management<\/text><rect class=\"cbx\" x=\"30\" y=\"50\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"98.0\" text-anchor=\"middle\">Exigences de vie privée<\/text><text class=\"b2\" x=\"320.0\" y=\"122.0\" text-anchor=\"middle\">pour les responsables du traitement et les sous-traitants · ISO 27701<\/text><rect class=\"cbx2\" x=\"30\" y=\"170\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"218.0\" text-anchor=\"middle\">Sécurité de l&#x27;information<\/text><text class=\"b2\" x=\"320.0\" y=\"242.0\" text-anchor=\"middle\">le système de management d&#x27;ISO 27001 (SMSI)<\/text><path class=\"bln\" d=\"M630,55 C660,55 660,265 630,265\"/><line class=\"bln\" x1=\"660\" y1=\"160\" x2=\"700\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"710\" y=\"80\" width=\"280\" height=\"160\" rx=\"18\"/><text class=\"b1\" style=\"font-size:34px;fill:var(--accent)\" x=\"850\" y=\"150\" text-anchor=\"middle\">PIMS<\/text><text class=\"b2\" x=\"850\" y=\"180\" text-anchor=\"middle\">Privacy Information<\/text><text class=\"b2\" x=\"850\" y=\"202\" text-anchor=\"middle\">Management System<\/text><text class=\"bc\" x=\"320\" y=\"302\" text-anchor=\"middle\">politique, processus, responsabilités et suivi, aussi pour la vie privée<\/text><\/svg>", "bullets": [{"k": "Un PIMS", "t": "ISO 27001 plus une couche vie privée : un seul système de management pour l'information et la vie privée."}, {"k": "Ce que cela apporte", "t": "une organisation montre qu'elle respecte soigneusement les règles du RGPD : elle a par exemple une politique de vie privée et un registre."}, {"k": "Ce que ce n'est pas", "t": "un certificat RGPD : normatif, mais non prévu par le RGPD."}], "caption": "Un certificat ISO 27701 ne peut jamais être présenté comme un certificat RGPD.", "read": {"text": "Consultez la norme ISO/IEC 27701 chez ISO même.", "links": [{"url": "https://www.iso.org/standard/27701", "label": "ISO · ISO/IEC 27701"}]}, "script": "La norme qui ajoute la vie privée à ISO 27001 est ISO 27701. Elle décrit un PIMS, un Privacy Information Management System. Regardez le dessin. En bas figure le système de management de la sécurité de l'information d'ISO 27001. ISO 27701 y ajoute une couche, avec des exigences propres à la vie privée, pour qui traite des données à caractère personnel en tant que responsable du traitement et pour qui le fait en tant que sous-traitant. Ensemble, ces deux couches forment un seul système de management : le PIMS. L'organisation gère alors non seulement la sécurité de son information, mais aussi la manière dont elle traite les données à caractère personnel, avec une politique, des processus, des responsabilités et un suivi, dans le même cycle de planification, de mise en œuvre, de contrôle et d'ajustement. Cela apporte quelque chose. Une entreprise titulaire d'un tel certificat peut démontrer qu'elle respecte soigneusement les règles du RGPD : elle a par exemple une politique de vie privée, un registre des activités de traitement, et ainsi de suite. Mais ce n'est pas un certificat RGPD. C'est une norme par rapport à laquelle on évalue, donc normative. Le RGPD lui-même ne prévoit pas la certification d'un système de management.", "id": 9}, {"type": "cards", "cols": 3, "numbered": true, "chip": "Partie 2.1 · Ce que le RGPD peut certifier", "title": "Que peut-on certifier ? Article 42 et considérant 100", "cards": [{"k": "Certains traitements d'organisations", "t": "un responsable du traitement ou un sous-traitant fait certifier ses activités de traitement, pour démontrer qu'il respecte le RGPD."}, {"k": "Certains produits et services", "t": "considérant 100 : les personnes concernées peuvent ainsi évaluer rapidement le niveau de protection des produits et services concernés."}, {"k": "Certains transferts vers des pays tiers", "t": "des organisations hors du RGPD peuvent aussi utiliser un mécanisme approuvé comme garantie appropriée pour les transferts."}], "note": "On certifie toujours un traitement délimité, avec ses données à caractère personnel, ses systèmes techniques et ses processus : jamais l'organisation dans son ensemble, ni une personne, comme un DPO.", "read": {"text": "Lisez l'article 42, paragraphes 1, 2 et 7, le considérant 100, et les lignes directrices 1/2018 du Comité européen de la protection des données sur la certification.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_fr.pdf", "label": "EDPB · lignes directrices 1/2018 certification"}]}, "script": "Si un système de management ne peut pas faire l'objet d'une certification RGPD, que peut-on certifier ? L'article 42 et le considérant 100 donnent trois réponses. Un : certains traitements d'organisations. Un responsable du traitement ou un sous-traitant fait certifier ses activités de traitement, pour démontrer qu'il respecte le RGPD. Un tel traitement a toujours trois composantes : les données à caractère personnel, les systèmes techniques, et les processus et procédures qui l'entourent. Deux : certains produits et services. Le considérant 100 veut que les personnes concernées puissent évaluer rapidement le niveau de protection des produits et services concernés. Trois : certains transferts vers des pays tiers. Des organisations hors de l'Union européenne, qui ne relèvent pas du RGPD, peuvent aussi utiliser un mécanisme approuvé comme garantie appropriée. Dans les trois cas, il s'agit d'un traitement délimité, jamais de l'organisation dans son ensemble, et jamais d'une personne, comme un DPO. Ce que cela signifie en pratique, vous le voyez dans un exemple.", "id": 10}, {"type": "compare", "chip": "Partie 2.1 · Un exemple", "title": "Un exemple connu : l'administration des salaires", "left": {"head": "Un produit", "items": ["Un logiciel de paie ou un service RH dans lequel des données de travailleurs sont traitées ; le fournisseur le fait certifier", "Objet : le traitement dans ce logiciel : les données, le logiciel et les processus de gestion qui l'entourent", "Le certificat dit quelque chose de ce traitement dans ce produit, pas de l'ensemble du fournisseur"]}, "right": {"head": "Un processus", "items": ["Le traitement des salaires lui-même, des données des travailleurs à la fiche de paie et au paiement ; un employeur ou un secrétariat social le fait certifier", "Objet : la série de traitements, avec les procédures et le traitement des plaintes qui y sont liés", "Le certificat dit quelque chose de ce traitement délimité, pas de l'ensemble de l'organisation"]}, "note": "Le Comité européen utilise lui-même cet exemple : le traitement de données de travailleurs pour le paiement des salaires ou la gestion des congés est une série de traitements certifiable.", "read": {"text": "Lisez l'exemple du paiement des salaires dans les lignes directrices 1/2018 du Comité européen de la protection des données sur la certification.", "links": [{"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_fr.pdf", "label": "EDPB · lignes directrices 1/2018 certification"}]}, "script": "Un exemple connu rend cela concret : l'administration des salaires. Le Comité européen de la protection des données l'utilise lui-même. Le traitement de données de travailleurs pour le paiement des salaires ou la gestion des congés est une série de traitements, et on peut la certifier. À gauche, vous voyez le produit. Pensez à un logiciel de paie ou à un service RH dans lequel des données de travailleurs sont traitées. L'objet est le traitement dans ce logiciel : les données, le logiciel et les processus de gestion qui l'entourent. Le fournisseur le fait certifier, afin que ses clients puissent utiliser le certificat comme élément de preuve. Le certificat dit quelque chose de ce traitement dans ce produit, pas de l'ensemble du fournisseur. À droite, vous voyez le processus : le traitement des salaires lui-même, des données des travailleurs à la fiche de paie et au paiement, avec les procédures et le traitement des plaintes qui y sont liés. Un employeur ou un secrétariat social le fait certifier. Ici aussi, le certificat dit quelque chose du traitement délimité, pas de l'ensemble de l'organisation. Dans les deux cas, l'objet est donc un traitement. C'est ainsi que vous distinguez un certificat RGPD du certificat ISO d'un système de management que vous avez vu tout à l'heure. Les notions et les principes sont ainsi traités. Voyons maintenant la deuxième partie de la certification : la certification selon le RGPD.", "id": 11}, {"type": "compare", "chip": "Partie 2.2 · Le cadre", "title": "Articles 42 et 43 : les principes", "left": {"head": "Article 42 · Le certificat", "items": ["Volontaire et transparent", "Un tiers indépendant le délivre, sur la base de critères approuvés", "Valable trois ans au maximum, renouvelable et retirable", "Votre propre responsabilité subsiste"]}, "right": {"head": "Article 43 · Les organismes de certification", "items": ["Seulement un organisme compétent, lui-même accrédité", "Accréditation par l'autorité de contrôle, l'organisme national d'accréditation ou les deux, cinq ans au maximum", "L'organisme reste responsable et signale la délivrance et le retrait", "Les exigences et critères sont publics"]}, "read": {"text": "Lisez l'article 42 et l'article 43 du RGPD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "La certification selon le RGPD est réglée par deux articles, et vous voyez leurs principes sur la diapositive. L'article 42 porte sur le certificat. La certification est volontaire et transparente. Un tiers indépendant délivre le certificat, sur la base de critères approuvés au préalable. Il est valable trois ans au maximum, et peut être renouvelé ou retiré. Et votre propre responsabilité subsiste. L'article 43 porte sur qui peut certifier. Seulement un organisme compétent, lui-même accrédité, par l'autorité de contrôle, par l'organisme national d'accréditation ou par les deux, pour cinq ans au maximum. L'organisme reste responsable de son évaluation et signale à l'autorité de contrôle quand il délivre ou retire un certificat. Et les exigences et critères sont publics. Nous examinons maintenant ces deux articles dans cet ordre : d'abord le certificat, puis l'accréditation.", "id": 12}, {"id": 13, "type": "bullets", "chip": "Partie 2.2 · Le certificat", "title": "La certification dans le RGPD : volontaire, par un tiers, et toujours sur un traitement", "bullets": [{"k": "Volontaire et transparente", "t": "personne n'est obligé ; la procédure est accessible et transparente (article 42, paragraphe 3)."}, {"k": "Par un tiers indépendant", "t": "un organisme de certification accrédité ou l'autorité de contrôle elle-même délivre le certificat (article 42, paragraphe 5) ; pas une auto-déclaration, comme pour l'ancien Privacy Shield."}, {"k": "Que certifie-t-on ?", "t": "des traitements d'un responsable du traitement ou d'un sous-traitant ; un produit ou un service peut être l'objet pour autant qu'un traitement y ait lieu ; un système de management en soi ou une personne, comme un DPO, ne relève pas de l'article 42."}, {"k": "Sur la base de critères approuvés", "t": "approuvés par l'autorité de contrôle ou par le Comité européen de la protection des données : le certificat s'appelle alors label européen de protection des données."}, {"k": "Trois ans au maximum", "t": "renouvelable aux mêmes conditions, et retirable dès que les exigences ne sont plus remplies (article 42, paragraphe 7)."}], "read": {"text": "Lisez l'article 42, paragraphes 1 à 7, et les lignes directrices 1/2018 du Comité européen de la protection des données sur la certification (points 50 à 58 : ce qui peut faire l'objet d'une certification).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_fr.pdf", "label": "EDPB · lignes directrices 1/2018 certification"}]}, "script": "
