D'abord le certificat. Une organisation peut obtenir un certificat RGPD pour un traitement déterminé ; c'est ce que règle l'article 42. Cinq caractéristiques. Un : la certification est volontaire, et la procédure est accessible et transparente. Personne n'y est obligé. Deux : le certificat provient d'un tiers indépendant, un organisme de certification accrédité ou l'autorité de contrôle elle-même. C'est autre chose qu'une auto-déclaration, comme pour l'ancien Privacy Shield. Trois, et c'est là que cela se passe souvent mal : que certifie-t-on ? Rappelez-vous la différence que vous avez vue : avec ISO 27001 et ISO 27701, un système de management de l'organisation, avec le RGPD, un traitement. L'article 42 parle de traitements d'un responsable du traitement ou d'un sous-traitant. Un produit ou un service peut en être l'objet, pour autant qu'un traitement de données à caractère personnel y ait lieu. Mais un système de management en soi, ou une personne comme un DPO, ne relève pas de l'article 42. Quatre : l'évaluation se fait sur la base de critères approuvés au préalable, par l'autorité de contrôle ou par le Comité européen de la protection des données. Dans ce dernier cas, le certificat s'appelle le label européen de protection des données, et il vaut dans toute l'Union. Cinq : un certificat est valable trois ans au maximum. Il peut être renouvelé, et il est retiré dès que les exigences ne sont plus remplies."}, {"id": 14, "type": "figure", "chip": "Partie 2.2 · Un mythe", "title": "Cent pour cent conforme au RGPD n'existe pas", "svg": "<svg viewBox=\"0 0 520 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cachet 100 % conforme au RGPD, barré\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><g transform=\"rotate(-8 260 125)\"><rect class=\"cst\" x=\"70\" y=\"55\" width=\"380\" height=\"140\" rx=\"18\"/><rect class=\"cst\" x=\"84\" y=\"69\" width=\"352\" height=\"112\" rx=\"10\" style=\"stroke-width:2\"/><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"118\" text-anchor=\"middle\">100 %<\/text><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"160\" text-anchor=\"middle\">CONFORME AU RGPD<\/text><\/g><line class=\"cbad\" x1=\"60\" y1=\"30\" x2=\"460\" y2=\"220\"/><line class=\"cbad\" x1=\"460\" y1=\"30\" x2=\"60\" y2=\"220\"/><\/svg>", "caption": "Article 42, paragraphe 4 du RGPD : Une certification en vertu du présent article ne diminue par [sic] la responsabilité du responsable du traitement ou du sous-traitant quant au respect du présent règlement et est sans préjudice des missions et des pouvoirs des autorités de contrôle qui sont compétentes en vertu de l'article 55 ou 56.", "bullets": [{"k": "Un instantané", "t": "le certificat dit quelque chose du jour de l'audit et de l'objet délimité, pas de tout ce que fait l'organisation."}, {"k": "Pas de sécurité juridique", "t": "un juge ou l'autorité de contrôle peut toujours constater une violation."}, {"k": "Vos obligations subsistent", "t": "la certification ne diminue en rien votre responsabilité de respecter le RGPD."}, {"k": "Pas moins de contrôle", "t": "les missions et pouvoirs de l'APD demeurent ; l'APD peut même faire retirer un certificat."}], "read": {"text": "Lisez l'article 42, paragraphe 4, et l'article 58, paragraphe 2, point h (le pouvoir de retirer une certification ou d'ordonner son retrait).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "Et voici le cachet de l'offre : cent pour cent conforme au RGPD. Sur la diapositive, il est barré d'une croix rouge, et cette croix y est pour une raison. Un certificat est un instantané : il dit quelque chose du jour de l'audit et de l'objet délimité, pas de tout ce que fait l'organisation. Il ne donne pas non plus de sécurité juridique, car un juge ou l'autorité de contrôle peut toujours constater une violation. Et la loi le dit elle-même. Lisez l'article 42, paragraphe 4, sous le dessin : une certification ne diminue en rien la responsabilité du responsable du traitement ou du sous-traitant quant au respect du règlement, et est sans préjudice des missions et des pouvoirs des autorités de contrôle. Vos obligations subsistent donc entièrement, et il n'y a pas moins de contrôle : l'APD peut même faire retirer un certificat. Retenez donc : un certificat vous aide à démontrer, il ne prend pas votre responsabilité à sa charge."}, {"id": 15, "type": "compare", "chip": "Partie 2.2 · La balance", "title": "Obtenir un certificat : que gagne-t-on, et que cela coûte-t-il ?", "left": {"head": "Avantages", "items": ["La confiance des clients, des personnes concernées et de l'autorité de contrôle : vous montrez, vous n'affirmez pas", "Une preuve de protection des données dès la conception et par défaut (article 25, paragraphe 3)", "Choisir des sous-traitants devient plus simple : un certificat est un élément pour démontrer des garanties suffisantes (article 28, paragraphe 5, et article 32, paragraphe 3)", "Une garantie appropriée possible pour les transferts hors de l'EEE (article 42, paragraphe 2, et article 46, paragraphe 2, point f)", "La préparation oblige à mettre de l'ordre : délimiter, documenter, améliorer"]}, "right": {"head": "Inconvénients", "items": ["Coûts : préparation, l'audit lui-même, suivi annuel et recertification après trois ans au maximum", "Contrôle formel supplémentaire : l'organisme de certification regarde et signale délivrance et retrait à l'autorité de contrôle", "Un objet étroit : seul le traitement délimité est certifié, pas toute l'organisation", "Un certificat retiré est visible et nuit à la confiance que vous vouliez gagner"]}, "read": {"text": "Lisez l'article 25, paragraphe 3, l'article 28, paragraphe 5, et l'article 42, paragraphe 2 ; les lignes directrices 07/2022 du Comité européen de la protection des données traitent la certification comme instrument de transfert.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/2023-05/edpb_guidelines_07-2022_on_certification_as_a_tool_for_transfers_v2_fr_0.pdf", "label": "EDPB · lignes directrices 07/2022 transferts"}]}, "script": "Cela vaut-il la peine d'obtenir un certificat ? D'abord les avantages. Un certificat inspire confiance aux clients, aux personnes concernées et à l'autorité de contrôle, car vous montrez quelque chose au lieu de simplement l'affirmer. C'est un élément de preuve de la protection des données dès la conception et par défaut. Il simplifie le choix des sous-traitants : un certificat est un élément pour démontrer des garanties suffisantes. Il peut être une garantie appropriée pour les transferts hors de l'Espace économique européen. Et la préparation oblige à mettre de l'ordre : délimiter, documenter, améliorer. Puis les inconvénients. Les coûts : la préparation, l'audit, le suivi annuel et la recertification après trois ans au maximum. Le contrôle formel supplémentaire : l'organisme de certification regarde et signale la délivrance et le retrait à l'autorité de contrôle. L'objet étroit : seul le traitement délimité est certifié, pas toute l'organisation. Et un certificat retiré est visible, et nuit à la confiance que vous vouliez gagner."}, {"id": 16, "type": "figure", "layout": "stack", "chip": "Partie 2.2 · Accréditation", "title": "Qui contrôle le certificateur ? L'accréditation à l'article 43", "svg": "<svg viewBox=\"0 0 940 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Accréditation cinq ans, certificat trois ans\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><line class=\"cax\" x1=\"250\" y1=\"200\" x2=\"900\" y2=\"200\"/><line class=\"cax\" x1=\"250.0\" y1=\"194\" x2=\"250.0\" y2=\"206\"/><text class=\"ct2\" x=\"250.0\" y=\"224\" text-anchor=\"middle\">début<\/text><line class=\"cax\" x1=\"380.0\" y1=\"194\" x2=\"380.0\" y2=\"206\"/><text class=\"ct2\" x=\"380.0\" y=\"224\" text-anchor=\"middle\">an 1<\/text><line class=\"cax\" x1=\"510.0\" y1=\"194\" x2=\"510.0\" y2=\"206\"/><text class=\"ct2\" x=\"510.0\" y=\"224\" text-anchor=\"middle\">an 2<\/text><line class=\"cax\" x1=\"640.0\" y1=\"194\" x2=\"640.0\" y2=\"206\"/><text class=\"ct2\" x=\"640.0\" y=\"224\" text-anchor=\"middle\">an 3<\/text><line class=\"cax\" x1=\"770.0\" y1=\"194\" x2=\"770.0\" y2=\"206\"/><text class=\"ct2\" x=\"770.0\" y=\"224\" text-anchor=\"middle\">an 4<\/text><line class=\"cax\" x1=\"900.0\" y1=\"194\" x2=\"900.0\" y2=\"206\"/><text class=\"ct2\" x=\"900.0\" y=\"224\" text-anchor=\"middle\">an 5<\/text><text class=\"ct1\" x=\"12\" y=\"62\">Accréditation<\/text><text class=\"ct2\" x=\"12\" y=\"79\">BELAC → organisme de certification<\/text><text class=\"ct2\" x=\"12\" y=\"94\">article 43, paragraphe 4<\/text><rect class=\"cbar2\" x=\"250\" y=\"48\" width=\"650.0\" height=\"42\" rx=\"8\"/><text class=\"ctw\" style=\"fill:#fff\" x=\"575.0\" y=\"74\" text-anchor=\"middle\">cinq ans au maximum, renouvelable<\/text><text class=\"ct1\" x=\"12\" y=\"140\">Certificat<\/text><text class=\"ct2\" x=\"12\" y=\"157\">organisme de certification → organisation<\/text><text class=\"ct2\" x=\"12\" y=\"172\">article 42, paragraphe 7<\/text><rect class=\"cbar\" x=\"250\" y=\"126\" width=\"390.0\" height=\"42\" rx=\"8\"/><text class=\"ct1\" x=\"445.0\" y=\"152\" text-anchor=\"middle\">trois ans au maximum, renouvelable<\/text><line class=\"cln2\" x1=\"380.0\" y1=\"120\" x2=\"380.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><line class=\"cln2\" x1=\"510.0\" y1=\"120\" x2=\"510.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><text class=\"cl\" x=\"654.0\" y=\"144\">surveillance intermédiaire : au moins<\/text><text class=\"cl\" x=\"654.0\" y=\"160\">tous les 12 mois (exigence de l&#x27;APD)<\/text><\/svg>", "bullets": [{"k": "Qui accrédite ?", "t": "l'État membre choisit : l'autorité de contrôle, l'organisme national d'accréditation selon la norme ISO 17065 avec des exigences supplémentaires de l'autorité de contrôle, ou les deux (article 43, paragraphe 1)."}, {"k": "Belgique", "t": "BELAC accrédite, selon ISO 17065 et les exigences supplémentaires de l'APD (article 18 de la loi du 30 juillet 2018 ; décision 02/2026 de l'APD du 2 juin 2026)."}, {"k": "Conditions", "t": "l'organisme de certification doit remplir les conditions que fixe l'article 43, paragraphe 2."}, {"k": "Cinq contre trois ans", "t": "l'accréditation vaut cinq ans au maximum, un certificat trois ans au maximum."}, {"k": "Obligation de signalement", "t": "l'organisme de certification signale à l'autorité de contrôle pourquoi il délivre ou retire un certificat (article 43, paragraphe 5)."}, {"k": "Registre public", "t": "le Comité européen de la protection des données tient un registre public de tous les mécanismes de certification, labels et marques (article 42, paragraphe 8)."}], "read": {"text": "Lisez l'article 43, paragraphes 1, 2, 4 et 5, l'article 18 de la loi du 30 juillet 2018, et les exigences d'accréditation supplémentaires de l'APD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.ejustice.just.fgov.be/eli/loi/2018/07/30/2018040581/justel", "label": "Loi du 30 juillet 2018 · article 18 (Justel)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/decision-n0-02-2026-of-2-june-2026.pdf", "label": "APD 02/2026 · exigences supplémentaires d'accréditation"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_fr", "label": "EDPB · registre des certifications"}]}, "script": "Voyons la seconde moitié de la certification selon le RGPD : l'accréditation. Qui contrôle le certificateur ? Un organisme de certification ne peut délivrer des certificats RGPD que s'il est lui-même accrédité. C'est ce que règle l'article 43. Qui accrédite ? L'État membre choisit : l'autorité de contrôle elle-même, l'organisme national d'accréditation, ou les deux. L'organisme d'accréditation travaille alors selon la norme ISO 17065 et avec les exigences supplémentaires de l'autorité de contrôle. La Belgique a choisi cette voie. L'article 18 de la loi du 30 juillet 2018 dit que BELAC accrédite les organismes de certification, et l'APD a fixé ses exigences supplémentaires dans une décision du 2 juin 2026. L'article 43 fixe aussi des conditions que l'organisme de certification doit remplir. Regardez alors la ligne du temps. L'accréditation vaut cinq ans au maximum. Un certificat vaut trois ans au maximum, avec, selon les exigences de l'APD, une surveillance intermédiaire au moins tous les douze mois. L'organisme de certification signale à l'autorité de contrôle pourquoi il délivre ou retire un certificat. Et tout ce qui est approuvé figure dans un registre public du Comité européen de la protection des données."}, {"id": 17, "type": "table", "chip": "Partie 2.2 · La pratique en Europe", "title": "Vrai certificat RGPD ou label du marché ? Le registre tranche", "head": ["Nom", "De quoi s'agit-il ?", "Certificat de l'article 42 ?"], "rows": [["Europrivacy", "schéma du Luxembourg ; premier label européen de protection des données (avis 28/2022 du Comité, octobre 2022) ; étendu en avril 2026 à un instrument pour les transferts", "oui, label européen"], ["EuroPriSe", "né auprès de l'autorité de contrôle du Schleswig-Holstein ; le schéma pour sous-traitants figure depuis 2024 au registre comme label européen", "oui, label européen (sous-traitants)"], ["BC 5701", "schéma de Brand Compliance, approuvé aux Pays-Bas ; depuis 2025 au registre comme label européen", "oui, label européen"], ["GDPR-CARPA", "schéma de l'autorité de contrôle luxembourgeoise elle-même, avec des critères nationaux", "oui, national (Luxembourg)"], ["ISO/IEC 27701 et ISO/IEC 27001", "normes internationales pour un système de management ; démontrent une bonne gouvernance", "non : un système de management"], ["ISDP©10003 et ePrivacyseal", "schémas de vie privée issus du marché ; ne figurent pas au registre du Comité", "non : label du marché"], ["Certificat de DPO", "certification d'une personne", "non : l'article 42 porte sur des traitements"]], "hl": [0, 1, 2, 3], "read": {"text": "Ouvrez le registre du Comité européen de la protection des données et cherchez un schéma ; en novembre 2026, il compte dix-sept entrées, aucune avec des critères belges.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_fr", "label": "EDPB · registre des certifications"}, {"url": "https://www.edpb.europa.eu/system/files/documents/2022-10/edpb_opinion_202228_approval_of_europrivacy_certification_criteria_as_eu_data_protection_seal_en.pdf", "label": "EDPB 28/2022 · Europrivacy"}, {"url": "https://www.edpb.europa.eu/system/files/2026-04/edpb_opinion_202615_europrivacy_en.pdf", "label": "EDPB 15/2026 · Europrivacy transferts"}]}, "script": "À quoi cela ressemble-t-il aujourd'hui en Europe ? Tout logo de vie privée sur un site web n'est pas un certificat RGPD. Le critère est simple : le schéma figure-t-il dans le registre du Comité européen de la protection des données ? Le tableau aligne sept noms. Les quatre premiers sont de vrais certificats de l'article 42. Europrivacy, un schéma du Luxembourg, est devenu en octobre 2022 le premier label européen de protection des données, et a été étendu en avril 2026 à un instrument pour les transferts. EuroPriSe est né auprès de l'autorité de contrôle du Schleswig-Holstein ; le schéma pour sous-traitants figure depuis 2024 au registre comme label européen. BC 5701, le schéma de Brand Compliance, a d'abord été approuvé aux Pays-Bas et figure depuis 2025 au registre comme label européen. Et GDPR-CARPA est un schéma de l'autorité de contrôle luxembourgeoise elle-même, avec des critères nationaux. La certification est un instrument. Il y en a un second, qu'une organisation peut aussi utiliser : le code de conduite. C'est la troisième et dernière partie.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "contrôler un label RGPD étape par étape : ce qu'il faut regarder et comment le rechercher."}}, {"type": "compare", "chip": "Partie 3 · Le cadre", "title": "Articles 40 et 41 : les principes", "left": {"head": "Article 40 · Le code de conduite", "items": ["Un secteur établit le code, par une association ou un organisme qui le représente", "L'autorité de contrôle approuve ; pour plusieurs États membres, d'abord l'avis du Comité", "Le code contient des mécanismes de contrôle obligatoire", "Des organisations hors du RGPD peuvent aussi y adhérer, comme garantie pour les transferts"]}, "right": {"head": "Article 41 · Le contrôle", "items": ["Un organisme accrédité contrôle le respect", "L'organisme est indépendant et compétent, sans conflit d'intérêts, avec une procédure de plaintes", "En cas de violation, des mesures suivent, jusqu'à la suspension ou l'exclusion", "Ne vaut pas pour les autorités et organismes publics"]}, "read": {"text": "Lisez l'article 40 et l'article 41 du RGPD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "La troisième et dernière partie porte sur les codes de conduite, auxquels une organisation peut adhérer. Deux articles les règlent, et vous voyez leurs principes sur la diapositive. L'article 40 porte sur le code lui-même. Un secteur l'établit, par une association ou un autre organisme qui représente ce secteur. L'autorité de contrôle l'approuve, et pour un code valable dans plusieurs États membres, le Comité européen de la protection des données rend d'abord un avis. Le code contient des mécanismes de contrôle obligatoire. Et des organisations hors du RGPD peuvent aussi y adhérer, comme garantie pour les transferts. L'article 41 porte sur le contrôle du code. Un organisme accrédité contrôle le respect. Il est indépendant et compétent, n'a pas de conflit d'intérêts et dispose d'une procédure de plaintes. En cas de violation, il prend des mesures, jusqu'à la suspension ou l'exclusion de l'organisation. Cela ne vaut pas pour les autorités et organismes publics. À quoi cela ressemble dans la pratique, vous le voyez sur la diapositive suivante.", "id": 18}, {"id": 19, "type": "cards", "cols": 3, "numbered": false, "chip": "Partie 3 · Codes de conduite", "title": "Le code de conduite : un secteur traduit le RGPD, et une organisation peut y adhérer", "cards": [{"k": "Qui l'établit ?", "t": "des associations et d'autres organismes qui représentent des catégories de responsables du traitement ou de sous-traitants : une fédération, une organisation faîtière, une organisation professionnelle (article 40, paragraphe 2)."}, {"k": "Qui approuve ?", "t": "l'autorité de contrôle, en Belgique l'APD ; pour un code valable dans plusieurs États membres, d'abord un avis du Comité européen de la protection des données (article 40, paragraphes 5 et 7)."}, {"k": "Qui contrôle ?", "t": "un organisme compétent et indépendant accrédité par l'APD (article 41) ; cette règle ne vaut pas pour les autorités et organismes publics (article 41, paragraphe 6)."}, {"k": "Adhérer", "t": "une organisation du secteur peut adhérer s'il existe un code approuvé pour son secteur ; elle s'engage à respecter les règles du code et accepte le contrôle."}, {"k": "Belgique · notaires", "t": "le code de conduite de la Chambre nationale des notaires, le premier code national (décision 04/2021 de l'APD du 8 avril 2021) ; la Chambre nationale assure elle-même le contrôle, car les notaires sont des officiers publics.", "hl": true}, {"k": "Europe · cloud", "t": "l'EU Cloud Code of Conduct pour les sous-traitants cloud, approuvé par l'APD le 20 mai 2021 après avis du Comité ; SCOPE Europe est l'organisme de contrôle accrédité.", "hl": true}], "read": {"text": "Lisez l'article 40, paragraphes 1, 2 et 5, et l'article 41, paragraphes 1, 2 et 6. Consultez la page de l'APD sur les codes de conduite et les deux codes approuvés.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.autoriteprotectiondonnees.be/professionnel/rgpd-/codes-de-conduite-et-organismes-de-supervision", "label": "APD · codes de conduite et organismes de supervision"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/decision-n-04-2021-du-8-avril-2021.pdf", "label": "APD 04/2021 · code de conduite des notaires"}, {"url": "https://www.autoriteprotectiondonnees.be/lautorite-de-protection-des-donnees-approuve-son-premier-code-de-conduite-europeen", "label": "APD · EU Cloud Code of Conduct (20 mai 2021)"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/codes-of-conduct_fr", "label": "EDPB · registre des codes de conduite"}]}, "script": "Qu'est-ce que cela signifie en pratique ? Un code de conduite est un ensemble de règles par lequel un secteur traduit le RGPD dans sa propre pratique, et auquel une organisation de ce secteur peut adhérer. Qui établit un code ? Pas une entreprise individuelle, mais une association ou un autre organisme qui représente une catégorie de responsables du traitement ou de sous-traitants, comme une fédération ou une organisation professionnelle. Qui approuve ? L'autorité de contrôle, en Belgique l'APD. Si le code vaut dans plusieurs États membres, le Comité européen de la protection des données rend d'abord un avis. Qui contrôle les membres ? Un organisme compétent et indépendant accrédité par l'APD. Une organisation ne peut adhérer que s'il existe un code approuvé pour son secteur. Elle s'engage alors à respecter les règles du code, et elle accepte le contrôle. Deux codes concrets. En Belgique, l'APD a approuvé le 8 avril 2021 le code de conduite de la Chambre nationale des notaires, le premier code national. Comme les notaires sont des officiers publics, la Chambre nationale assure elle-même le contrôle. Au niveau européen, l'APD a approuvé le 20 mai 2021 l'EU Cloud Code of Conduct, un code pour les sous-traitants cloud, avec SCOPE Europe comme organisme de contrôle accrédité."}, {"id": 20, "type": "quote", "chip": "Partie 3 · Pourquoi adhérer ?", "title": "Ce qu'un code de conduite ou un certificat vous apporte sur le plan juridique", "source": "Article 24, paragraphe 3 du RGPD", "quote": "L'application d'un code de conduite approuvé comme le prévoit l'article 40 ou de mécanismes de certification approuvés comme le prévoit l'article 42 peut servir d'élément pour démontrer le respect des obligations incombant au responsable du traitement.", "bullets": [{"k": "Preuve pour la responsabilité", "t": "un élément pour démontrer que vous respectez vos obligations ; il en va de même pour les garanties d'un sous-traitant (article 28, paragraphe 5), pour la sécurité (article 32, paragraphe 3) et pour la protection des données dès la conception (article 25, paragraphe 3, seulement la certification)."}, {"k": "Amendes", "t": "pour décider s'il y a une amende et de quel montant, l'APD tient dûment compte de l'adhésion à un code de conduite approuvé ou d'une certification (article 83, paragraphe 2, point j)."}, {"k": "Transferts", "t": "un code de conduite approuvé ou une certification, avec des engagements contraignants et exécutoires du destinataire dans le pays tiers, est une garantie appropriée (article 46, paragraphe 2, points e et f)."}, {"k": "Pas un passe-droit", "t": "c'est un élément de preuve, pas une présomption de conformité : qui signe un code et ne le respecte pas se retrouve plus faible, pas plus fort."}], "read": {"text": "Lisez l'article 24, paragraphe 3, l'article 28, paragraphe 5, l'article 32, paragraphe 3, l'article 83, paragraphe 2, point j, et l'article 46, paragraphe 2, points e et f.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "Pourquoi une organisation adhérerait-elle à un code de conduite ou obtiendrait-elle un certificat ? Parce que le RGPD y attache une conséquence à trois endroits. D'abord la preuve. Lisez l'article 24, paragraphe 3, sur la diapositive : l'application d'un code de conduite approuvé ou de mécanismes de certification approuvés peut servir d'élément pour démontrer le respect des obligations du responsable du traitement. C'est la responsabilité en pratique. Ensuite les amendes. Selon l'article 83, paragraphe 2, l'autorité de contrôle en tient dûment compte pour décider s'il y a une amende et de quel montant. Et les transferts hors de l'Espace économique européen : un code de conduite approuvé ou une certification peut être une garantie appropriée. Mais attention au mot du texte de loi : un élément. Ce n'est ni un passe-droit ni une présomption de conformité. Qui signe un code et ne le respecte pas ensuite se retrouve plus faible auprès de l'autorité de contrôle, pas plus fort. Il est temps de l'appliquer vous-même, avec une réflexion."}, {"id": 21, "type": "reveal", "chip": "Réflexion", "title": "Retour à l'offre : que valent les trois pièces ?", "question": "Le fournisseur présente trois pièces. Un : un logo avec les mots cent pour cent conforme au RGPD, sans autre explication. Deux : un certificat ISO 27001 d'un organisme de certification accrédité. Trois : un certificat Europrivacy pour le service que vous voulez acquérir. Que vaut chaque pièce pour vous comme DPO, et que vérifiez-vous ?", "verdict": "Le logo est une déclaration propre et ne prouve rien ; ISO 27001 dit quelque chose de la sécurité, pas du RGPD ; seul le certificat Europrivacy est un certificat de l'article 42, si l'objet est correct et s'il est encore valable", "answer": [{"k": "Le logo", "t": "une marque du fournisseur lui-même ; personne ne l'a évalué, et cent pour cent de conformité est exclu par l'article 42, paragraphe 4 lui-même. Demandez ce qu'il y a derrière."}, {"k": "ISO 27001", "t": "un vrai certificat d'un tiers, sur le système de management de la sécurité de l'information ; un élément utile pour la sécurité (article 32), pas un certificat RGPD. Vérifiez le périmètre et l'accréditation."}, {"k": "Europrivacy", "t": "un label européen de protection des données : un élément pour démontrer des garanties suffisantes (article 28, paragraphe 5). Vérifiez que l'objet couvre votre service, qui l'a délivré, et s'il est encore valable."}, {"k": "Et ensuite", "t": "vos propres obligations demeurent : le contrat de sous-traitance, votre propre évaluation des risques et le suivi du sous-traitant."}], "read": {"text": "Cherchez le schéma dans le registre du Comité européen de la protection des données et demandez au fournisseur le certificat lui-même, avec son objet et sa date de validité.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_fr", "label": "EDPB · registre des certifications"}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "Il est temps de le faire vous-même. Retour à l'offre du début. Le fournisseur présente trois pièces. Un : un logo avec les mots cent pour cent conforme au RGPD, sans autre explication. Deux : un certificat ISO 27001 d'un organisme de certification accrédité. Trois : un certificat Europrivacy pour le service que vous voulez acquérir. Que vaut chaque pièce pour vous comme DPO, et que vérifiez-vous ? Mettez l'audio en pause et réfléchissez. … Le logo est une marque du fournisseur lui-même. Personne ne l'a évalué, et cent pour cent de conformité est exclu par la loi elle-même. Il ne prouve donc rien ; demandez ce qu'il y a derrière. Le certificat ISO 27001 est un vrai certificat d'un tiers, mais il porte sur le système de management de la sécurité de l'information. C'est un élément utile pour la sécurité, pas un certificat RGPD. Vérifiez le périmètre : couvre-t-il le service que vous acquérez ? Le certificat Europrivacy est le seul certificat de l'article 42 des trois. C'est un élément pour démontrer que le sous-traitant offre des garanties suffisantes. Vérifiez que l'objet couvre votre service, qui l'a délivré, et s'il est encore valable. Et ensuite, vos propres obligations demeurent : le contrat de sous-traitance, votre propre évaluation des risques et le suivi du sous-traitant."}, {"id": 22, "type": "summary", "chip": "Synthèse", "title": "Ce que vous retenez", "key": "La norme dit ce à quoi il faut satisfaire, l'organisme de certification évalue, et l'organisme d'accréditation contrôle le certificateur ; un code de conduite et un certificat sont des éléments de preuve pour la responsabilité, comptent lors d'une amende et peuvent être une garantie pour les transferts, mais ne prennent jamais votre responsabilité à leur charge ; en Belgique, BELAC accrédite avec les exigences de l'APD ; et pour savoir si un label est un vrai certificat RGPD, consultez le registre du Comité européen de la protection des données.", "bullets": [{"k": "Notions", "t": "normalisation, accréditation, évaluation de la conformité, certification ; marque (le producteur lui-même), sceau (origine et intégrité), certificat (attestation d'un tiers)."}, {"k": "Ne pas confondre", "t": "ISO 27001 et ISO 27701 certifient un système de management ; elles sont utiles, mais ne sont pas un certificat RGPD."}, {"k": "Certification", "t": "volontaire, par un tiers, sur un traitement, trois ans au maximum ; cent pour cent conforme au RGPD n'existe pas (article 42)."}, {"k": "Accréditation", "t": "BELAC avec les exigences supplémentaires de l'APD, cinq ans au maximum (article 43)."}, {"k": "Code de conduite", "t": "par une organisation sectorielle, approuvé par l'APD, avec contrôle ; une organisation peut y adhérer (articles 40 et 41) ; exemples : notaires et cloud."}, {"k": "Conséquences", "t": "élément de preuve (article 24, paragraphe 3), facteur lors d'une amende (article 83, paragraphe 2, point j), garantie pour les transferts (article 46, paragraphe 2, points e et f)."}, {"k": "En pratique", "t": "demandez le certificat lui-même, vérifiez l'objet, l'émetteur et la validité, et cherchez le schéma dans le registre."}], "script": "Récapitulons. La norme dit ce à quoi il faut satisfaire, l'organisme de certification évalue si vous y satisfaites, et l'organisme d'accréditation contrôle le certificateur. Une marque vient du producteur lui-même, un sceau montre l'origine et l'intégrité, un certificat est une attestation d'un tiers. ISO 27001 et ISO 27701 certifient un système de management et sont utiles, mais jamais un certificat RGPD. Un certificat RGPD est volontaire, vient d'un tiers, porte sur un traitement délimité, et vaut trois ans au maximum. En Belgique, BELAC accrédite les organismes de certification, avec les exigences supplémentaires de l'APD, pour cinq ans au maximum. Un code de conduite vient d'une organisation sectorielle et est approuvé par l'APD ; une organisation du secteur peut y adhérer, comme chez les notaires ou chez les sous-traitants cloud. Les codes de conduite et les certificats sont un élément de preuve, un facteur lors d'une amende et une garantie possible pour les transferts. Mais ils ne prennent jamais votre responsabilité à leur charge : cent pour cent conforme au RGPD n'existe pas. Et en pratique : demandez le certificat lui-même, vérifiez l'objet, l'émetteur et la validité, et cherchez le schéma dans le registre. Pour savoir si un tel label est vrai, vous apprenez à le contrôler étape par étape dans l'approfondissement, que vous ouvrez en bas de cette diapositive. Ensuite viennent les dix questions d'exercice.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "contrôler un label RGPD étape par étape : ce qu'il faut regarder et comment le rechercher."}}], "quiz": [{"q": "Que fait un organisme d'accréditation comme BELAC ?", "options": ["Il rédige les normes par rapport auxquelles les organisations sont vérifiées.", "Il atteste qu'un organisme de certification est compétent.", "Il réalise l'audit auprès des organisations et délivre le certificat.", "Il approuve les codes de conduite et contrôle leurs membres."], "answer": 1, "feedback": ["Rédiger des normes, c'est la normalisation : le travail de l'ISO, du CEN ou du NBN.", "Exact. L'accréditation est le contrôle du certificateur lui-même.", "C'est ce que fait l'organisme de certification avec son auditeur, pas l'organisme d'accréditation.", "Les codes de conduite sont approuvés par l'APD ; le contrôle revient à un organisme agréé."]}, {"q": "Un fabricant appose lui-même le marquage CE sur son appareil. De quoi s'agit-il ?", "options": ["D'une marque : une déclaration du producteur lui-même.", "D'un certificat : une attestation d'un tiers indépendant.", "D'un sceau : une preuve de l'origine et de l'intégrité.", "D'une accréditation : une reconnaissance par les pouvoirs publics."], "answer": 0, "feedback": ["Exact. Avec une marque, c'est le producteur lui-même qui parle.", "Un certificat émane d'un tiers après une évaluation.", "Un sceau montre de qui vient une chose et qu'on n'y a pas touché.", "L'accréditation concerne les organismes de certification, pas les produits."]}, {"q": "Qui peut, selon l'article 40 du RGPD, rédiger un code de conduite ?", "options": ["Tout responsable du traitement, pour sa propre organisation interne.", "L'autorité de contrôle, pour chaque secteur de son pays.", "Une association représentant une catégorie d'organisations.", "Un organisme de certification accrédité, pour ses clients."], "answer": 2, "feedback": ["Une politique interne n'est pas un code de conduite au sens de l'article 40.", "L'autorité de contrôle approuve, mais ne rédige pas elle-même le code.", "Exact. Une fédération, une coupole ou une organisation professionnelle rédige le code.", "Un organisme de certification certifie ; il ne rédige pas de code de conduite."]}, {"q": "Qui contrôle le respect d'un code de conduite approuvé par ses membres ?", "options": ["L'organisme national d'accréditation, donc BELAC en Belgique.", "Le Comité européen de la protection des données à Bruxelles.", "L'organisation sectorielle qui a rédigé et soumis le code de conduite.", "Un organisme que l'autorité de contrôle a agréé à cette fin."], "answer": 3, "feedback": ["BELAC accrédite des organismes de certification, pas les organismes de contrôle des codes.", "Le Comité rend un avis sur les codes couvrant plusieurs États membres, mais ne contrôle pas les membres.", "L'auteur n'est pas d'office le contrôleur ; l'organisme doit être indépendant et agréé.", "Exact. Article 41 : un organisme compétent, agréé par l'autorité de contrôle."]}, {"q": "Quelle est la conséquence de l'application d'un code de conduite approuvé selon l'article 24, paragraphe 3 ?", "options": ["Elle crée une présomption légale de respect du RGPD.", "C'est un élément pour démontrer le respect des obligations.", "Elle exclut que l'autorité de contrôle impose encore une amende.", "Elle remplace l'obligation de tenir un registre des traitements."], "answer": 1, "feedback": ["La loi parle d'un élément, pas d'une présomption de conformité.", "Exact. Un élément de preuve pour la responsabilité.", "C'est un facteur pour l'amende (article 83, paragraphe 2, point j), pas une exclusion.", "Toutes les autres obligations du RGPD demeurent."]}, {"q": "Que peut viser une certification au titre de l'article 42 du RGPD ?", "options": ["Une personne, comme un délégué à la protection des données.", "Un système de management de la sécurité de l'information.", "Un traitement par un responsable ou un sous-traitant.", "Toute une organisation, avec tous ses traitements actuels et futurs."], "answer": 2, "feedback": ["La certification de personnes ne relève pas de l'article 42.", "Un système de management en tant que tel n'est pas un traitement ; c'est le terrain des normes ISO.", "Exact. L'article 42 vise des traitements, y compris au moyen d'un produit ou d'un service.", "L'objet est délimité ; un certificat ne couvre jamais tout."]}, {"q": "Affirmation : celui qui a un certificat RGPD est soumis à moins de contrôle de l'APD.", "options": ["Exact, car l'APD se fie au travail du certificateur accrédité.", "Exact, mais seulement tant que le certificat reste valable.", "Inexact, sauf pour le traitement certifié lui-même.", "Inexact : les pouvoirs de l'APD restent entiers."], "answer": 3, "feedback": ["L'article 42, paragraphe 4 dit l'inverse : les pouvoirs restent entiers.", "La validité ne change rien aux pouvoirs de l'APD.", "Même pour le traitement certifié, l'APD reste pleinement compétente.", "Exact. L'APD peut même faire retirer un certificat."]}, {"q": "Combien de temps valent au maximum un certificat RGPD et l'accréditation d'un organisme de certification ?", "options": ["Certificat trois ans, accréditation cinq.", "Certificat cinq ans, accréditation trois ans.", "Tous deux trois ans, chaque fois renouvelables.", "Certificat un an, accréditation cinq ans."], "answer": 0, "feedback": ["Exact. Article 42, paragraphe 7 et article 43, paragraphe 4.", "C'est l'inverse : le certificat trois, l'accréditation cinq.", "L'accréditation vaut plus longtemps : cinq ans au maximum.", "Il y a une surveillance annuelle, mais le certificat vaut jusqu'à trois ans."]}, {"q": "Qui accrédite en Belgique les organismes de certification pour les certificats RGPD ?", "options": ["L'APD seule, sur la base de ses propres critères d'accréditation.", "BELAC, selon ISO 17065 et les exigences supplémentaires de l'APD.", "Le Comité européen de la protection des données, via son registre.", "Le SPF Économie, après avis des organisations sectorielles belges."], "answer": 1, "feedback": ["Le RGPD permet ce choix, mais la Belgique a opté pour l'organisme d'accréditation.", "Exact. Article 18 de la loi du 30 juillet 2018.", "Le Comité approuve des critères et tient le registre, mais n'accrédite pas.", "BELAC relève du SPF Économie, mais accrédite lui-même, avec les exigences de l'APD."]}, {"q": "Un fournisseur présente un certificat ISO/IEC 27701. Qu'est-ce que cela signifie pour vous, DPO ?", "options": ["C'est un label européen de protection des données selon l'article 42.", "Il prouve que le fournisseur respecte entièrement le RGPD.", "Il n'a aucune valeur pour l'évaluation de ce sous-traitant.", "Il démontre une bonne gouvernance, sans être un certificat RGPD."], "answer": 3, "feedback": ["Un label européen figure au registre du Comité ; cette norme n'y figure pas.", "Aucun certificat ne prouve un respect complet.", "C'est bel et bien un élément utile dans votre évaluation.", "Exact. Une norme pour un système de management, sans les conséquences de l'article 42."]}]}</script>

<script>
(function(){

  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = C.module + ' · ' + C.title + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  if(C.silent){
    $('intro-actions').classList.add('three'); $('btn-start').querySelector('.ico').innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    $('btn-skip').textContent = U.skip_short || ({nl:'Naar de oefeningen',fr:'Aux exercices',en:'To the exercises'})[C.lang] || U.skip_to_quiz;
    $('btn-silent').querySelector('span').textContent = U.silent_label || ({nl:'Zonder geluid',fr:'Sans son',en:'Without sound'})[C.lang] || 'Without sound';
  }
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  let SILENT = false, silentHid = false;
  const SILENT_TXT = ({nl:'Presentatie zonder geluid',fr:'Présentation sans son',en:'Presentation without sound'})[C.lang] || 'Presentation without sound';
  if(C.silent){ const b=$('btn-silent'); b.classList.remove('hidden'); b.title = U.silent_title || SILENT_TXT; }
  function setSilent(on){ SILENT = on; audio.muted = on; }
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  /* download (bv. volledige slidedeck in pdf naast index.html): C.download = {url,label} */
  if(C.download){ const a=$('nav-dl'); a.href=C.download.url; a.textContent='⤓ '+C.download.label; a.title=C.download.title||C.download.label; a.classList.remove('hidden'); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });
  $('nav-quiz').addEventListener('click',()=>{ audio.pause(); if(!$('quiz').classList.contains('hidden')||!$('result').classList.contains('hidden')) return; if(typeof paused!=='undefined' && paused){ $('btn-resume').click(); } else show('quiz-intro'); });
  $('btn-prev').querySelector('span').textContent = U.prev;
  $('btn-next').querySelector('span').textContent = U.next;
  $('lbl-autoplay').textContent = U.autoplay_short || U.autoplay; $('lbl-autoplay-wrap').title = U.autoplay; $('speed').title = U.speed; $('btn-prev').title = U.prev; $('btn-next').title = U.next;
  let rate = 1; try{ rate = parseFloat(localStorage.getItem('module-speed')) || 1; }catch(e){}
  const RATES=[1,1.25,1.5];
  function setRate(r){ rate = r; audio.playbackRate = r; $('speed').textContent = r+'×'; $('speed').classList.toggle('fast', r!==1); $('speed').title = U.speed + ': ' + r + '×'; try{ localStorage.setItem('module-speed', String(r)); }catch(e){} }
  $('speed').addEventListener('click',()=>{ setRate(RATES[(RATES.indexOf(rate)+1)%RATES.length]); });
  $('qi-title').textContent = U.quiz_intro_title;
  $('qi-text').textContent = U.quiz_intro_text;
  $('btn-quiz-start').textContent = U.quiz_start;
  $('btn-review-1').textContent = U.review;
  $('btn-review-2').textContent = U.review;
  $('btn-retry').textContent = U.retry;
  $('r-title').textContent = U.result_title;
  $('btn-q-back').querySelector('span').textContent = U.back_to_slides;
  $('btn-resume').textContent = U.resume_quiz;
  $('btn-pdf').querySelector('span').textContent = U.download_pdf;
  $('ai-title').textContent = U.ai_notice_title; $('ai-text').textContent = U.ai_notice; $('ai-badge').querySelector('span').textContent = U.ai_voice_label; $('ai-footer').textContent = U.ai_footer; document.querySelectorAll('.ai-notice img,.ai-badge img,.ai-line img').forEach(im=>im.alt=U.ai_icon_alt);
  $('t-title').textContent = U.transcript; $('btn-text-hide').textContent = U.hide_text; $('btn-text-show').textContent = U.show_text;
  const NOQUIZ = !(C.quiz && C.quiz.length) && !(C.quizzes && C.quizzes.length);
  if(NOQUIZ){ $('btn-skip').classList.add('hidden'); $('nav-quiz').classList.add('hidden'); }
  $('btn-text-hide').addEventListener('click',()=>{ if(AV){ const t=$('transcript'); t.classList.toggle('notext'); $('btn-text-hide').textContent = t.classList.contains('notext') ? U.show_text : U.hide_text; return; } $('transcript').classList.add('hidden'); $('pres-grid').classList.remove('with-text'); $('btn-text-show').classList.remove('hidden'); });
  $('btn-text-show').addEventListener('click',()=>{ $('transcript').classList.remove('hidden'); $('pres-grid').classList.add('with-text'); $('btn-text-show').classList.add('hidden'); });
  let sent=[], sentEnds=[];
  function setTranscript(t){ sent = t.split(/(?<=[.!?…])\s+(?=\S)/).filter(x=>x.length).map((x,n,a)=>n<a.length-1?x+' ':x); let acc=0, tot=t.length; sentEnds = sent.map(x=>{ acc+=x.length; return acc/tot; }); $('t-body').innerHTML = sent.map((x,n)=>'<span data-n="'+n+'">'+esc(x)+'</span>').join(''); $('t-body').scrollTop=0; }
  function highlight(){ if(!audio.duration) return; const f=audio.currentTime/audio.duration; let k=sentEnds.findIndex(e=>f<e); if(k<0) k=sent.length-1; [...$('t-body').children].forEach((el,n)=>{ const on=n===k; if(on!==el.classList.contains('now')){ el.classList.toggle('now',on); if(on) el.scrollIntoView({block:'nearest',behavior:'smooth'}); } }); }

  /* ---- slides ---- */
  const ALL = C.slides; let S = ALL; let i = 0; const seen = new Set(); let PROFILE = null;
  function setProfile(id){ PROFILE = id; S = ALL.filter(x=>!x.profiles || x.profiles.includes(id)); seen.clear(); i = 0; const pr=(C.profiles||[]).find(x=>x.id===id); $('modlabel').innerHTML = esc(C.course + ' · ' + C.module) + (pr?'<span class="profchip">'+esc(pr.short||pr.label)+'</span>':''); }
  const AV = C.avatar || null;
  const audio = AV ? $('avatar-video') : new Audio(); audio.preload = 'auto';
  if(AV){ $('avatar-box').classList.remove('hidden'); $('transcript').classList.add('has-avatar'); $('avatar-tag').textContent = AV.label || ''; }
  let audioOk = true;

  const hms = t => { t=Math.max(0,Math.floor(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
  function bullets(arr){ return '<ul class="bul">'+arr.map(b=>'<li><span><b>'+esc(b.k)+'</b> — '+esc(b.t)+'</span></li>').join('')+'</ul>'; }

          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':

      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */

        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+(s.rec&&RS.length?'<div class="readmore rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+s.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')+(s.deep?'<div class="readmore deep"><span><span class="lbl">'+esc(U.deep_label||'Verdieping')+'</span> · '+esc(s.deep.text||'')+'</span><a class="btn" href="'+esc(s.deep.url)+'?back='+(S.indexOf(s)+1)+'">'+esc(s.deep.label||U.deep_btn||'Open de verdieping')+' ›</a></div>':'')+'</div></div>';
  }

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});

    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){

      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
<script>
/* layout-fix v1 js: tekst in tekeningen (svg) die uit zijn vak of uit de tekening valt, krimpt tot hij past (breed lettertype, andere taal) */
(function(){
  function boxOf(t,bb){var g=t.parentNode,best=null,tx=bb.x+bb.width/2,ty=bb.y+bb.height/2;
    [].forEach.call(g.children,function(rc){var n=rc.tagName.toLowerCase();if(n!=='rect')return;var x=+rc.getAttribute('x'),y=+rc.getAttribute('y'),w=+rc.getAttribute('width'),h=+rc.getAttribute('height');if(isNaN(x)||isNaN(w)||h>100||w>520)return;
      if(tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h&&(!best||w*h<best.w*best.h))best={x:x,y:y,w:w,h:h};});return best;}
  function fit(root){
    [].forEach.call(root.querySelectorAll('svg'),function(sv){var vb=sv.viewBox&&sv.viewBox.baseVal;
      [].forEach.call(sv.querySelectorAll('text'),function(t){if(/rotate/.test(t.getAttribute('transform')||''))return;var off=0,n=0,fs0=parseFloat(getComputedStyle(t).fontSize)||12,fs=fs0;
        function over(){try{var bb=t.getBBox();bb={x:bb.x+off,y:bb.y,width:bb.width,height:bb.height};if(vb&&vb.width&&(bb.x<vb.x-1||bb.x+bb.width>vb.x+vb.width+1))return true;var b=boxOf(t,bb);return !!b&&(bb.x<b.x-1||bb.x+bb.width>b.x+b.w+1);}catch(e){return false;}}
        try{var b0=t.getBBox();if(vb&&vb.width){var dx=0;if(b0.x<vb.x-1)dx=vb.x-b0.x+2;else if(b0.x+b0.width>vb.x+vb.width+1)dx=vb.x+vb.width-(b0.x+b0.width)-2;if(dx&&Math.abs(dx)<=40){t.setAttribute('transform',(t.getAttribute('transform')||'')+' translate('+dx+' 0)');off=dx;}}}catch(e){}
        while(over()&&n++<14&&fs>fs0*0.72){fs*=0.94;t.style.fontSize=fs+'px';}});});
  }
  function start(){var c=document.getElementById('slidecard');if(!c)return;fit(c);new MutationObserver(function(){fit(c);}).observe(c,{childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
