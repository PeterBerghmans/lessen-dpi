<!DOCTYPE html>
<html lang="nl" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 14 · Gedragscodes, certificering en accreditatie</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.back{color:var(--accent);border-color:var(--accent)}
nav.main a.dl{display:inline-block;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--accent);text-decoration:none;background:var(--card-bg)}nav.main a.dl:hover{background:var(--chip-bg)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}
/* verdieping (sprong naar een aparte verdiepingsmodule) */
.readmore.deep{border-top:1px dashed var(--line)}
.readmore.deep a.btn{background:var(--btn-bg);color:var(--btn-text)}
.readmore.deep .lbl{font-weight:700;color:var(--accent)}
/* avatar (HeyGen): video in plaats van audio; het tekstpaneel kan inklappen, de avatar blijft zichtbaar */
.avatar-box{position:relative;background:#e9e9e6;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:1/1}
.avatar-box video{width:100%;height:100%;object-fit:cover;display:block}
.avatar-box .avatar-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.transcript.has-avatar.notext .t-body{display:none}
.transcript.has-avatar.notext{max-height:none}
@media (max-width:1099px){
  .transcript.has-avatar .avatar-box{position:fixed;right:12px;bottom:12px;width:150px;z-index:60;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side ul.bul{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px}
@media (max-width:900px){.figure.stack .side ul.bul{grid-template-columns:1fr}}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
/* flipkaarten: s.flip=true -> kaart toont k (+ q) en na een klik de uitleg t (+ sub) */
.cards .cd.flip{cursor:pointer;min-height:clamp(150px,22vw,250px);transition:border-color .15s}.cards .cd.flip:hover,.cards .cd.flip:focus{border-color:var(--accent);outline:none}
.cards .cd.flip .ft,.cards .cd.flip .sub{display:none}.cards .cd.flip .fq{font-style:italic}.cards .cd.flip .fh{margin-top:auto;color:var(--accent);font-weight:700;font-size:clamp(10px,1.05vw,13px)}
.cards .cd.flip.open{background:var(--card-bg);border-color:var(--accent)}.cards .cd.flip.open .ft{display:inline}.cards .cd.flip.open .sub{display:block}.cards .cd.flip.open .fq,.cards .cd.flip.open .fh{display:none}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl a.tlink{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tbl a.tlink:hover{text-decoration-thickness:2px}
.tbl .recchip{display:inline-block;margin-top:4px;font:inherit;font-weight:500;font-size:.82em;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .recchip:hover{background:var(--chain-bg)}
.tbl td:first-child .recchip{display:block;width:max-content}
.tbl-hint{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:8px}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* opname (Vimeo) */
.readmore.rec{border-top:1px dashed var(--line);margin-top:8px}
.readmore.rec .btn{font-variant-numeric:tabular-nums}
.readmore.rec .btn small{font-weight:400;opacity:.8;margin-left:4px}
.rec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-head h1{margin-bottom:4px}
.rec-src{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rec-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.rec-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rec-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.rec-ch{position:relative;max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.rec-ch h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 12px 4px;position:sticky;top:0;background:var(--card-bg)}
.rec-ch button{display:grid;grid-template-columns:58px 1fr;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);background:var(--card-bg)}
.rec-ch button:hover{background:var(--chain-bg)}
.rec-ch button.on{background:var(--chip-bg);color:var(--chip-text)}
.rec-ch button .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.rec-ch button .qp{font-weight:700;color:var(--muted)}
.rec-ch h4.rv{font-size:13px;color:var(--title);background:var(--chain-bg);z-index:1}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}.rec-ch{max-height:none}}
.intro-src{font-size:13px;color:var(--muted);margin:-14px 0 22px;line-height:1.5}

/* profielkeuze */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 18px}
.profiles .qset b{font-size:clamp(16px,1.8vw,21px)}
.profchip{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:999px;vertical-align:middle}
/* meer weten: verwijzingen naar de opname */
.pointers{display:grid;gap:clamp(8px,1.2vw,14px)}
.pointers .pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--chain-bg);border-radius:12px;padding:clamp(10px,1.3vw,16px) clamp(12px,1.6vw,20px)}
.pointers .pt b{color:var(--title);font-size:clamp(13px,1.45vw,17px)}
.pointers .pt span{grid-column:1;font-size:clamp(12px,1.2vw,15px);line-height:1.4}
.pointers .pt .btn{grid-column:2;grid-row:1/span 2;font-variant-numeric:tabular-nums}
.pointers .pt .btn small{font-weight:400;opacity:.85;margin-left:6px}
.pointers .lead{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(6px,1vw,12px)}
@media (max-width:640px){.pointers .pt{grid-template-columns:1fr}.pointers .pt .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.btn .ico{display:inline-flex;align-items:center;font-style:normal}
.actions.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.actions.three .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;white-space:normal;line-height:1.25}
@media (max-width:760px){.actions.three{grid-template-columns:1fr}}
.navtop .controls{margin:0 0 14px}
.dotsrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.dotsrow .dots{margin-top:0}
.dotsrow .btn.mini{padding:6px 14px;font-size:18px;line-height:1.2;flex-shrink:0}
.dotsrow .btn.mini span{font-size:14px;margin-right:6px}
.dotsrow .btn.mini span:empty{display:none}
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.q-ctx{background:var(--chain-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:clamp(13.5px,1.35vw,16px);line-height:1.5;color:var(--text)}
.q-ctx .ctx-k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.fb .fb-key{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95em}
.fb .fb-key b{display:inline;margin-right:4px}
.fb .fb-rec{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .fb-src a.btn{text-decoration:none}
.fb .fb-rec .btn small{font-weight:400;opacity:.85;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* layout-fix v1: niets mag buiten de slidekaart vallen, ook niet in een breed lettertype of met het tekstpaneel open */
#slidecard{container-type:inline-size;container-name:sl}
header.top{flex-wrap:wrap}
nav.main{flex-wrap:wrap}
.chain{grid-auto-columns:minmax(0,1fr)}.timeline{grid-auto-columns:minmax(0,1fr)}
.chain .st,.timeline .st,.cards .cd,.compare .col,.figure .side,.practice>*{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.slide li,.slide td,.slide th,.slide p{overflow-wrap:anywhere}
.slide .readmore a.btn{white-space:normal;max-width:100%;text-align:left;line-height:1.25}
@container sl (max-width:900px){
  .chain,.timeline{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));grid-auto-columns:auto}
  .chain .st:not(:last-child)::after{display:none}
  .timeline::before{display:none}
}
@container sl (max-width:640px){.cards{grid-template-columns:1fr 1fr!important}.tbl{display:block;overflow-x:auto}.tbl td:first-child{width:auto}}
@container sl (max-width:380px){.cards{grid-template-columns:1fr!important}}
.slide h1,.slide h2,.slide h3{overflow-wrap:anywhere;hyphens:auto}
.slide a.btn{white-space:normal;max-width:100%}
.btn{max-width:100%}
@media (max-width:640px){.btn{white-space:normal}}
.optbar,.resume{flex-wrap:wrap}.optbar .btn,.resume .btn{min-width:0;white-space:normal}
/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

d op weg. Bekijk de feedback bij de vragen die je fout had en probeer opnieuw.", "result_low": "Bekijk de presentatie nog eens en probeer daarna opnieuw. De feedback bij elke vraag helpt je op weg.", "retry": "Opnieuw oefenen", "review": "Presentatie herbekijken", "your_answer": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex", "deep_label": "Verdieping", "deep_btn": "Open de verdieping", "flip_hint": "Klik om de kaart om te draaien"}, "nav_top": true, "silent": true, "slides": [{"id": 1, "type": "title", "title": "Een stempel is nog geen bewijs: gedragscodes, certificering en accreditatie", "subtitle": "De artikelen 40 tot en met 43 van de AVG: wat een gedragscode en een certificaat waard zijn, wie ze mag afgeven, en hoe je een echt AVG-certificaat onderscheidt van een marktlabel", "script": "Je organisatie kiest een nieuw softwarepakket. In de offerte van de leverancier staan drie dingen die vertrouwen moeten wekken. Een logo met de woorden honderd procent AVG-compliant. Een ISO 27001-certificaat. En een Europrivacy-certificaat voor de dienst zelf. De directie vraagt aan jou, de DPO: is dat dan in orde? Dat hangt ervan af wat er achter elk van die drie zit: wie gaf het af, op basis van welke regels, en wie controleert die afgever? Giovanni Buttarelli, die tot 2019 aan het hoofd stond van de EDPS, de toezichthouder van de Europese instellingen, noemde certificering een visitekaartje voor de verantwoordingsplicht. In deze module leer je dat visitekaartje lezen. Eerst een overzicht van wat je te wachten staat."}, {"type": "cards", "cols": 3, "numbered": false, "chip": "Overzicht", "title": "Wat je in deze module leert, in drie delen", "cards": [{"k": "Deel 1 · Overzicht", "t": "wat een merkteken, een zegel en een certificaat zijn, en de artikelen over gedragscodes enerzijds en over certificatie anderzijds."}, {"k": "Deel 2 · Certificatie", "t": "eerst veel voorkomende begrippen en de principes: normalisatie, accreditatie, conformiteitsbeoordeling en certificering. Dan certificering volgens de AVG: het certificaat met zijn voordelen en grenzen, en wie de certificeerder controleert (artikelen 42 en 43)."}, {"k": "Deel 3 · Gedragscodes", "t": "waartoe een organisatie kan toetreden (artikelen 40 en 41), en wat gedragscodes en certificaten je juridisch opleveren."}], "script": "Deze module bestaat uit drie delen. Het eerste deel is een overzicht: wat een merkteken, een zegel en een certificaat zijn, en de artikelen over gedragscodes enerzijds en deze over certificatie anderzijds. Het tweede deel gaat over certificatie. Eerst bespreken we veel voorkomende begrippen en de principes: normalisatie, accreditatie, conformiteitsbeoordeling en certificering. Dan certificering volgens de AVG: het certificaat dat een organisatie voor een verwerking kan behalen, met zijn voordelen en zijn grenzen, en de vraag wie de certificeerder controleert. Het derde deel gaat over gedragscodes, waartoe een organisatie kan toetreden, en over wat gedragscodes en certificaten je juridisch opleveren. ", "id": 2, "note": "Reken op ± 25 minuten, met een denkoefening en tien oefenvragen."}, {"id": 3, "type": "cards", "flip": true, "cols": 3, "numbered": false, "chip": "Deel 1 · Overzicht", "title": "Merkteken, zegel of certificaat? Een certificering kan daartoe leiden", "cards": [{"k": "Merkteken", "q": "Wie staat achter de CE-markering op een toestel?", "t": "Een merkteken is een verklaring van de producent zelf. Met de CE-markering verklaart de fabrikant dat zijn product aan de Europese regels voldoet. Er komt niet noodzakelijk een derde aan te pas.", "sub": "bv. CE-markering"}, {"k": "Zegel", "q": "Wat toont een lakzegel op een brief?", "t": "Een zegel maakt oorsprong en integriteit zichtbaar: het toont van wie iets komt en dat er niet aan geraakt is. Vroeger met lak, vandaag met een elektronisch zegel op basis van cryptografie.", "sub": "bv. lakzegel, elektronisch zegel"}, {"k": "Certificaat", "q": "Wat krijg je na een geslaagde audit?", "t": "Een certificaat is een formeel attest van een derde partij. Het verbindt het resultaat van een beoordeling aan een organisatie of een persoon, voor een bepaalde periode.", "sub": "bv. attest van een derde"}], "script": "Heb je je ooit afgevraagd of je aan een product of dienst kan zien dat het AVG-conform is? Je hebt het vast al gezien: een icoontje op een website dat zegt: AVG compliant. Vaak zijn dit zelfverklaarde uitspraken, maar het hoeft niet zo te zijn: de AVG heeft wel degelijk een mechanisme hiervoor. Een certificering kan leiden tot een merkteken, tot een zegel of tot een certificaat, en de AVG noemt ze alle drie: certificeringsmechanismen, gegevensbeschermingszegels en merktekens. Op de slide staan drie kaarten. Klik erop om ze om te draaien. Een merkteken is een verklaring van de producent zelf. Het bekendste voorbeeld is de CE-markering op een toestel: de fabrikant verklaart dat zijn product aan de Europese regels voldoet, en daar komt niet noodzakelijk een derde aan te pas. Een zegel maakt oorsprong en integriteit zichtbaar. Het toont van wie iets komt en dat er niet aan geraakt is. Vroeger gebeurde dat met een lakzegel op een brief, vandaag met een elektronisch zegel op basis van cryptografie. En een certificaat is een formeel attest van een derde partij. Het verbindt het resultaat van een beoordeling aan een organisatie of aan een persoon, voor een bepaalde periode.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "hoe je een AVG-label controleert: waarop je let en hoe je het opzoekt."}}, {"type": "figure", "layout": "stack", "chip": "Deel 1 · De artikelen 40 tot en met 43", "title": "De vier artikelen: twee paren", "svg": "<svg viewBox=\"0 0 1010 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Artikelen 40 en 41 horen samen, artikelen 42 en 43 horen samen\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"252\" y=\"42\" text-anchor=\"middle\">DEEL 2<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"252\" y=\"68\" text-anchor=\"middle\">Certificatie: certificering en accreditatie<\/text><rect class=\"cbx2\" x=\"28\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"128.0\" y=\"158.0\" text-anchor=\"middle\">Artikel 42<\/text><text class=\"b2\" x=\"128.0\" y=\"182.0\" text-anchor=\"middle\">het certificaat zelf<\/text><rect class=\"cbx2\" x=\"277\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"377.0\" y=\"158.0\" text-anchor=\"middle\">Artikel 43<\/text><text class=\"b2\" x=\"377.0\" y=\"182.0\" text-anchor=\"middle\">wie mag certificeren<\/text><line class=\"bln\" x1=\"232\" y1=\"160\" x2=\"272\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"515\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"757\" y=\"42\" text-anchor=\"middle\">DEEL 3<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"757\" y=\"68\" text-anchor=\"middle\">Gedragscodes<\/text><rect class=\"cbx2\" x=\"533\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"633.0\" y=\"158.0\" text-anchor=\"middle\">Artikel 40<\/text><text class=\"b2\" x=\"633.0\" y=\"182.0\" text-anchor=\"middle\">de gedragscode zelf<\/text><rect class=\"cbx2\" x=\"782\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"882.0\" y=\"158.0\" text-anchor=\"middle\">Artikel 41<\/text><text class=\"b2\" x=\"882.0\" y=\"182.0\" text-anchor=\"middle\">toezicht op de code<\/text><line class=\"bln\" x1=\"737\" y1=\"160\" x2=\"777\" y2=\"160\" marker-end=\"url(#cah)\"/><\/svg>", "caption": "Samen vormen ze afdeling 5 van hoofdstuk IV van de AVG: gedragscodes en certificering.", "read": {"text": "Open de artikelen 40 tot en met 43 van de AVG.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "Hier zie je de vier artikelen waar deze module over gaat, in twee paren. Ze staan samen in afdeling vijf van hoofdstuk vier van de AVG, onder de titel gedragscodes en certificering. Links staan de artikelen 42 en 43. Artikel 42 gaat over certificering: een onafhankelijke derde die een verwerking certificeert, vrijwillig en voor maximaal drie jaar. Artikel 43 zegt wie mag certificeren: alleen organen die zelf geaccrediteerd zijn, in België door BELAC. Samen vormen die twee het tweede deel van deze module, over certificatie. Rechts staan de artikelen 40 en 41. Artikel 40 gaat over gedragscodes: sectoren die de AVG vertalen naar hun praktijk, goedgekeurd door de toezichthouder. Artikel 41 regelt het toezicht op die codes, door een orgaan dat zelf geaccrediteerd is. Samen vormen die twee het derde en laatste deel, over gedragscodes. Maar eerst de begrippen en de principes, want zonder die woordenschat blijven de artikelen abstract.", "id": 4}, {"id": 5, "type": "figure", "layout": "stack", "chip": "Deel 2.1 · Begrippen", "title": "Van norm tot certificaat: wie doet wat?", "svg": "<svg viewBox=\"0 0 1010 372\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Van norm tot certificaat\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accreditatie<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certificering<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Normalisatie<\/text><rect class=\"cbx2\" x=\"14\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"78\" text-anchor=\"middle\">Global ACI<\/text><text class=\"ct2\" x=\"139.0\" y=\"95\" text-anchor=\"middle\">wereldwijde koepel voor accreditatie<\/text><rect class=\"cbx2\" x=\"14\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"176\" text-anchor=\"middle\">EA<\/text><text class=\"ct2\" x=\"139.0\" y=\"193\" text-anchor=\"middle\">Europese koepel voor accreditatie<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">België<\/text><line class=\"cln2\" x1=\"139.0\" y1=\"112\" x2=\"139.0\" y2=\"146\" marker-end=\"url(#cah2)\"/><line class=\"cln2\" x1=\"139.0\" y1=\"210\" x2=\"139.0\" y2=\"244\" marker-end=\"url(#cah2)\"/><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Certificeringsorgaan<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">bv. Brand Compliance, Vinçotte<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Auditor<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">conformiteitsbeoordeling<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Organisatie<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">krijgt het certificaat<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accrediteert<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">stelt aan<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">beoordeelt<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certificeert<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">wereld<\/text><rect class=\"cbx2\" x=\"746\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"176\" text-anchor=\"middle\">CEN<\/text><text class=\"ct2\" x=\"871.0\" y=\"193\" text-anchor=\"middle\">Europa<\/text><rect class=\"cbx2\" x=\"746\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"274\" text-anchor=\"middle\">NBN<\/text><text class=\"ct2\" x=\"871.0\" y=\"291\" text-anchor=\"middle\">België (Nederland: NEN)<\/text><line class=\"cln\" x1=\"743\" y1=\"179.0\" x2=\"660\" y2=\"179.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"703.0\" y=\"157.0\" text-anchor=\"middle\">norm =<\/text><text class=\"cl\" x=\"703.0\" y=\"171.0\" text-anchor=\"middle\">toetssteen<\/text><text class=\"ct2\" x=\"505.0\" y=\"350\" text-anchor=\"middle\">De positieve uitkomst van de conformiteitsbeoordeling heet certificering (ook: certificatie); het bewijs ervan is het certificaat.<\/text><\/svg>", "bullets": [{"k": "Normalisatie", "t": "een normalisatie-instelling schrijft de norm: ISO voor de wereld, CEN voor Europa, NBN voor België."}, {"k": "Accreditatie", "t": "de nationale accreditatie-instantie, in België BELAC, bevestigt dat een certificeringsorgaan bekwaam en onafhankelijk is (Verordening 765/2008)."}, {"k": "Conformiteitsbeoordeling", "t": "een auditor van het certificeringsorgaan toetst de organisatie aan de norm."}, {"k": "Certificering", "t": "de positieve uitkomst van die beoordeling; het certificeringsorgaan geeft het certificaat af."}], "read": {"text": "Lees artikel 2, punt 10, van Verordening 765/2008 (de definitie van accreditatie) en bekijk wat BELAC doet.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32008R0765", "label": "Verordening 765/2008 · accreditatie"}, {"url": "https://economie.fgov.be/belac", "label": "BELAC · Belgische accreditatie-instelling"}]}, "script": "Vier woorden worden voortdurend door elkaar gebruikt, en het schema zet ze op hun plaats. Rechts staat de normalisatie. Een normalisatie-instelling schrijft de norm, de toetssteen: ISO voor de wereld, CEN voor Europa, en NBN voor België, zoals NEN dat voor Nederland doet. Links staat de accreditatie. Een accreditatie-instantie bevestigt dat een certificeringsorgaan bekwaam en onafhankelijk is. Elke lidstaat heeft er precies één, zo wil het Verordening 765/2008. In België is dat BELAC. BELAC wordt zelf beoordeeld door zijn Europese collega's binnen EA, de Europese samenwerking voor accreditatie, en die sluit aan bij de wereldwijde koepel, sinds begin 2026 Global ACI, voluit de Global Accreditation Cooperation. In het midden staat het eigenlijke werk. Het certificeringsorgaan, bijvoorbeeld Brand Compliance, Vinçotte of TÜV Nord, stelt een auditor aan. Die auditor voert bij de organisatie de conformiteitsbeoordeling uit: hij toetst wat hij ziet aan de norm. Is de uitkomst positief, dan geeft het certificeringsorgaan het certificaat af. Die positieve uitkomst heet certificering; in de wereld van de normen zegt men ook certificatie."}, {"type": "figure", "chip": "Deel 2.1 · Een bekend voorbeeld", "title": "Een bekend voorbeeld: certificatie in de informatieveiligheid", "svg": "<svg viewBox=\"0 0 700 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Een managementsysteem als cyclus\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"680\" height=\"380\" rx=\"20\"/><text class=\"bh\" x=\"350\" y=\"50\" text-anchor=\"middle\">EEN MANAGEMENTSYSTEEM<\/text><rect class=\"cbx\" x=\"235\" y=\"160\" width=\"230\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"208.0\" text-anchor=\"middle\">Beleid en<\/text><text class=\"b2\" x=\"350.0\" y=\"232.0\" text-anchor=\"middle\">doelstellingen<\/text><rect class=\"cbx2\" x=\"260\" y=\"76\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"112.0\" text-anchor=\"middle\">Plannen<\/text><rect class=\"cbx2\" x=\"490\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"575.0\" y=\"208.0\" text-anchor=\"middle\">Uitvoeren<\/text><rect class=\"cbx2\" x=\"260\" y=\"288\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"324.0\" text-anchor=\"middle\">Controleren<\/text><rect class=\"cbx2\" x=\"40\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"125.0\" y=\"208.0\" text-anchor=\"middle\">Bijsturen<\/text><path class=\"bln\" d=\"M445,104 C510,104 570,130 575,166\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M575,234 C570,275 510,316 445,316\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M255,316 C190,316 130,275 125,234\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M125,166 C130,130 190,104 255,104\" marker-end=\"url(#cah)\"/><text class=\"bc\" x=\"350\" y=\"374\" text-anchor=\"middle\">de organisatie zelf: beleid, processen, verantwoordelijkheden, opvolging<\/text><\/svg>", "bullets": [{"k": "Niet de AVG", "t": "een buurdomein, waar certificatie al jaren gangbaar is."}, {"k": "NIS2", "t": "moedigt certificering sterk aan en legt ze op een bepaalde manier op."}, {"k": "Wat wordt gecertificeerd", "t": "een managementsysteem, zoals ISO 27001, ISO 9001 en ISO 14001."}], "read": {"text": "Bekijk hoe het Centrum voor Cybersecurity België de conformiteitsbeoordeling onder NIS2 organiseert, met ISO 27001 of CyberFundamentals.", "links": [{"url": "https://cyfun.eu/en/cabs/cabs-belgium", "label": "CCB · conformiteitsbeoordeling onder NIS2"}]}, "script": "Om die begrippen concreet te maken, nemen we een voorbeeld uit een omgeving waar certificatie veel bekender is: de informatieveiligheid. Dat is dus niet de AVG, maar een buurdomein. Daar is certificeren al jaren gangbaar, en door de NIS2-richtlijn nog meer. NIS2 moedigt certificering veel sterker aan en legt ze op een bepaalde manier ook op. In België laten essentiële entiteiten hun conformiteit beoordelen, via een certificering of via inspectie, door een geaccrediteerd en erkend orgaan. In die omgeving wordt een managementsysteem gecertificeerd. Wat is dat? Op de tekening zie je het. Een managementsysteem is het geheel van beleid en doelstellingen, processen, verantwoordelijkheden en opvolging waarmee een organisatie een onderwerp systematisch beheerst. Het draait in een voortdurende cyclus: plannen, uitvoeren, controleren en bijsturen. Het gaat dus over de organisatie zelf, over hoe zij werkt. Je kent het van kwaliteit, met ISO 9001, en van milieu, met ISO 14001. Bij informatieveiligheid heet de bekendste norm ISO 27001. Nu vullen we het schema van daarnet in met ISO 27001.", "id": 6}, {"type": "figure", "layout": "stack", "chip": "Deel 2.1 · Het schema ingevuld", "title": "Hetzelfde schema, nu met ISO 27001", "svg": "<svg viewBox=\"0 0 1010 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Het schema met ISO 27001 ingevuld\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accreditatie<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certificering<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Normalisatie<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">accrediteert voor ISO 27001<\/text><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Brand Compliance<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">certificeringsorgaan<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Lead auditor<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">toetst het managementsysteem<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Data Protection Institute<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">krijgt het ISO 27001-certificaat<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO/IEC 27001<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">norm voor informatiebeveiliging<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accrediteert<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">stelt aan<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">beoordeelt<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certificeert<\/text><line class=\"cln\" x1=\"743\" y1=\"81.0\" x2=\"668\" y2=\"81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"707.0\" y=\"73.0\" text-anchor=\"middle\">toetssteen<\/text><\/svg>", "caption": "Zonder accreditatie kan een auditor ook toetsen, maar dat leidt niet tot een erkend certificaat.", "bullets": [{"k": "Het doel", "t": "het Data Protection Institute wil zich laten certificeren."}, {"k": "De norm", "t": "daarvoor is een norm nodig: ISO/IEC 27001."}, {"k": "Het orgaan", "t": "Brand Compliance, geaccrediteerd door BELAC."}, {"k": "De auditor", "t": "een lead auditor toetst het managementsysteem; daarna volgt het certificaat."}], "script": "Hier zie je opnieuw het schema van het begin van dit deel, nu ingevuld voor één concreet geval, en beperkt tot wat ertoe doet. Stel dat het Data Protection Institute zich wil laten certificeren voor informatieveiligheid. Wat is er dan nodig? Eerst een norm om tegen te toetsen. Dat is ISO 27001, helemaal rechts op de tekening, de toetssteen. Dan een certificeringsorgaan dat het certificaat mag afgeven. Dat is Brand Compliance, en het is geaccrediteerd door BELAC, de Belgische accreditatie-instantie. Brand Compliance stelt vervolgens een lead auditor aan. Die toetst het managementsysteem van het instituut aan de norm. Is de uitkomst positief, dan krijgt het instituut het ISO 27001-certificaat. Let op wat dat certificaat zegt: iets over het managementsysteem van de organisatie, niet over elke verwerking van persoonsgegevens. En merk nog iets op, onderaan de tekening. De audit zelf had ook zonder geaccrediteerde instelling gekund, gewoon door een auditor die het instituut zelf kiest. Maar dat had niet tot een erkend certificaat geleid. Pas de accreditatie door BELAC geeft het certificaat zijn waarde. Dat overlopen we nu nog eens samenvattend, stap voor stap.", "id": 7}, {"id": 8, "type": "chain", "chip": "Deel 2.1 · De begrippen in een voorbeeld", "title": "Het ISO 27001-certificaat van het Data Protection Institute, stap voor stap", "steps": [{"k": "De norm", "t": "ISO/IEC 27001: de eisen voor een managementsysteem voor informatiebeveiliging."}, {"k": "De accreditatie", "t": "BELAC accrediteert het certificeringsorgaan, hier Brand Compliance, voor die norm."}, {"k": "De auditor", "t": "Brand Compliance kiest een auditor met een persoonscertificaat als lead auditor."}, {"k": "De audit", "t": "de auditor toetst het managementsysteem voor informatiebeveiliging van het instituut aan de norm."}, {"k": "Het certificaat", "t": "Brand Compliance geeft het ISO 27001-certificaat af aan het instituut; elk jaar volgt een opvolgingsaudit."}], "read": {"text": "Zoek een certificeringsorgaan op in de lijst van geaccrediteerde instellingen van BELAC en bekijk voor welke normen de accreditatie geldt.", "links": [{"url": "https://economie.fgov.be/nl/themas/kwaliteit-veiligheid/accreditatie-belac/geaccrediteerde-instellingen", "label": "BELAC · geaccrediteerde instellingen"}]}, "script": "Dit overlopen we nog eens samenvattend, stap voor stap. Eén: de norm. ISO 27001 beschrijft de eisen voor een managementsysteem voor informatiebeveiliging. Twee: de accreditatie. BELAC accrediteert Brand Compliance om voor die norm certificaten af te geven. Drie: de auditor. Brand Compliance kiest een lead auditor, die zelf een persoonscertificaat heeft als bewijs van zijn bekwaamheid. Vier: de audit, de conformiteitsbeoordeling. De auditor toetst het managementsysteem van het Data Protection Institute aan de norm. Vijf: het certificaat. Is de uitkomst positief, dan geeft Brand Compliance het ISO 27001-certificaat af, en volgt er elk jaar een opvolgingsaudit. Je ziet hier twee verschillende certificaten: het persoonscertificaat van de auditor zegt iets over een mens, het ISO 27001-certificaat zegt iets over de organisatie. Er bestaat ook een norm die privacy toevoegt aan zo'n managementsysteem. Die zie je op de volgende slide."}, {"type": "figure", "layout": "stack", "chip": "Deel 2.1 · ISO 27701 en het PIMS", "title": "ISO 27701: een PIMS, maar geen AVG-certificaat", "svg": "<svg viewBox=\"0 0 1010 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Een PIMS is ISO 27001 met een privacylaag van ISO 27701\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><text class=\"ch\" x=\"320\" y=\"28\" text-anchor=\"middle\">Twee lagen, één managementsysteem<\/text><rect class=\"cbx\" x=\"30\" y=\"50\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"98.0\" text-anchor=\"middle\">Privacy-eisen<\/text><text class=\"b2\" x=\"320.0\" y=\"122.0\" text-anchor=\"middle\">voor verwerkingsverantwoordelijken en verwerkers · ISO 27701<\/text><rect class=\"cbx2\" x=\"30\" y=\"170\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"218.0\" text-anchor=\"middle\">Informatiebeveiliging<\/text><text class=\"b2\" x=\"320.0\" y=\"242.0\" text-anchor=\"middle\">het managementsysteem van ISO 27001 (ISMS)<\/text><path class=\"bln\" d=\"M630,55 C660,55 660,265 630,265\"/><line class=\"bln\" x1=\"660\" y1=\"160\" x2=\"700\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"710\" y=\"80\" width=\"280\" height=\"160\" rx=\"18\"/><text class=\"b1\" style=\"font-size:34px;fill:var(--accent)\" x=\"850\" y=\"150\" text-anchor=\"middle\">PIMS<\/text><text class=\"b2\" x=\"850\" y=\"180\" text-anchor=\"middle\">Privacy Information<\/text><text class=\"b2\" x=\"850\" y=\"202\" text-anchor=\"middle\">Management System<\/text><text class=\"bc\" x=\"320\" y=\"302\" text-anchor=\"middle\">beleid, processen, verantwoordelijkheden en opvolging, ook voor privacy<\/text><\/svg>", "bullets": [{"k": "Een PIMS", "t": "ISO 27001 plus een privacylaag: één managementsysteem voor informatie en privacy."}, {"k": "Wat het oplevert", "t": "een organisatie toont aan dat ze zorgvuldig met de AVG-regels omgaat: ze heeft bijvoorbeeld een privacybeleid en een register."}, {"k": "Wat het niet is", "t": "een AVG-certificaat: normatief, maar niet opgenomen in de AVG."}], "caption": "Een ISO 27701-certificaat mag je nooit voorstellen als een AVG-certificaat.", "read": {"text": "Bekijk de norm ISO/IEC 27701 bij ISO zelf.", "links": [{"url": "https://www.iso.org/standard/27701", "label": "ISO · ISO/IEC 27701"}]}, "script": "De norm die privacy toevoegt aan ISO 27001 is ISO 27701. Die beschrijft een PIMS, een Privacy Information Management System. Kijk naar de tekening. Onderaan staat het managementsysteem voor informatiebeveiliging van ISO 27001. ISO 27701 legt daar een laag bovenop, met eisen die specifiek over privacy gaan, voor wie persoonsgegevens verwerkt als verwerkingsverantwoordelijke en voor wie dat doet als verwerker. Samen vormen die twee lagen één managementsysteem: het PIMS. De organisatie beheert dan niet alleen de beveiliging van haar informatie, maar ook de manier waarop ze met persoonsgegevens omgaat, met beleid, processen, verantwoordelijkheden en opvolging, in dezelfde cyclus van plannen, uitvoeren, controleren en bijsturen. Dat levert iets op. Een bedrijf met zo'n certificaat kan aantonen dat het zorgvuldig omgaat met de AVG-regels: het heeft bijvoorbeeld een privacybeleid, een register van de verwerkingsactiviteiten, en zo verder. Maar het is geen AVG-certificaat. Het is een norm waartegen je toetst, dus normatief. De AVG zelf voorziet niet in de certificatie van een managementsysteem.", "id": 9}, {"type": "cards", "cols": 3, "numbered": true, "chip": "Deel 2.1 · Wat de AVG kan certificeren", "title": "Wat kan worden gecertificeerd? Artikel 42 en overweging 100", "cards": [{"k": "Bepaalde verwerkingen van organisaties", "t": "een verwerkingsverantwoordelijke of verwerker laat zijn verwerkingsactiviteiten certificeren, om aan te tonen dat hij de AVG naleeft."}, {"k": "Bepaalde producten en diensten", "t": "overweging 100: betrokkenen kunnen zo snel het beschermingsniveau van relevante producten en diensten beoordelen."}, {"k": "Bepaalde doorgiften naar derde landen", "t": "ook organisaties buiten de AVG kunnen een goedgekeurd mechanisme gebruiken als passende waarborg bij doorgiften."}], "note": "Gecertificeerd wordt steeds een afgebakende verwerking, met haar persoonsgegevens, technische systemen en processen: nooit de organisatie als geheel, en nooit een persoon, zoals een DPO.", "read": {"text": "Lees artikel 42, leden 1, 2 en 7, overweging 100, en de richtsnoeren 1/2018 van het Europees Comité voor gegevensbescherming over certificering.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_nl.pdf", "label": "EDPB · richtsnoeren 1/2018 certificering"}]}, "script": "Als een managementsysteem geen voorwerp kan zijn van AVG-certificering, wat dan wel? Artikel 42 en overweging 100 geven drie antwoorden. Eén: bepaalde verwerkingen van organisaties. Een verwerkingsverantwoordelijke of een verwerker laat zijn verwerkingsactiviteiten certificeren, om aan te tonen dat hij de AVG naleeft. Zo'n verwerking heeft altijd drie onderdelen: de persoonsgegevens, de technische systemen, en de processen en procedures errond. Twee: bepaalde producten en diensten. Overweging 100 wil dat betrokkenen snel het beschermingsniveau van relevante producten en diensten kunnen beoordelen. Drie: bepaalde doorgiften naar derde landen. Ook organisaties buiten de Europese Unie, die niet onder de AVG vallen, kunnen een goedgekeurd mechanisme gebruiken als passende waarborg. In alle drie de gevallen gaat het om een afgebakende verwerking, nooit om de organisatie als geheel, en nooit om een persoon, zoals een DPO. Wat dat in de praktijk betekent, zie je in een voorbeeld.", "id": 10}, {"type": "compare", "chip": "Deel 2.1 · Een voorbeeld", "title": "Een bekend voorbeeld: de loonadministratie", "left": {"head": "Een product", "items": ["Een loonpakket of HR-dienst waarin werknemersgegevens worden verwerkt; de leverancier laat het certificeren", "Voorwerp: de verwerking in dat pakket: gegevens, software en de beheerprocessen errond", "Het certificaat zegt iets over deze verwerking in dit product, niet over de hele leverancier"]}, "right": {"head": "Een proces", "items": ["De loonverwerking zelf, van werknemersgegevens tot loonfiche en betaling; een werkgever of sociaal secretariaat laat ze certificeren", "Voorwerp: de reeks verwerkingen, met de procedures en de klachtenbehandeling die erbij horen", "Het certificaat zegt iets over deze afgebakende verwerking, niet over de hele organisatie"]}, "note": "Het Europees Comité gebruikt zelf dit voorbeeld: de verwerking van werknemersgegevens voor loonbetaling of verlofbeheer is een reeks verwerkingen die certificeerbaar is.", "read": {"text": "Lees het voorbeeld van de loonbetaling in de richtsnoeren 1/2018 van het Europees Comité voor gegevensbescherming over certificering.", "links": [{"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_nl.pdf", "label": "EDPB · richtsnoeren 1/2018 certificering"}]}, "script": "Een bekend voorbeeld maakt dit concreet: de loonadministratie. Het Europees Comité voor gegevensbescherming gebruikt het zelf. De verwerking van werknemersgegevens voor de loonbetaling of het verlofbeheer is een reeks verwerkingen, en die kan je certificeren. Links zie je het product. Denk aan een loonpakket of een HR-dienst waarin werknemersgegevens worden verwerkt. Het voorwerp is de verwerking in dat pakket: de gegevens, de software en de beheerprocessen errond. De leverancier laat dat certificeren, zodat zijn klanten het certificaat kunnen gebruiken als element van bewijs. Het certificaat zegt iets over deze verwerking in dit product, niet over de hele leverancier. Rechts zie je het proces: de loonverwerking zelf, van de werknemersgegevens tot de loonfiche en de betaling, met de procedures en de klachtenbehandeling die erbij horen. Een werkgever of een sociaal secretariaat laat dat certificeren. Ook hier zegt het certificaat iets over de afgebakende verwerking, niet over de hele organisatie. In beide gevallen is het voorwerp dus een verwerking. Zo onderscheid je een AVG-certificaat van het ISO-certificaat voor een managementsysteem dat je daarnet zag. Daarmee zijn de begrippen en de principes behandeld. Dan nu het tweede stuk van de certificatie: certificering volgens de AVG.", "id": 11}, {"type": "compare", "chip": "Deel 2.2 · Het kader", "title": "Artikel 42 en 43: de principes", "left": {"head": "Artikel 42 · Het certificaat", "items": ["Vrijwillig en transparant", "Een onafhankelijke derde geeft het af, op grond van goedgekeurde criteria", "Maximaal drie jaar geldig, verlengbaar en in te trekken", "Je eigen verantwoordelijkheid blijft"]}, "right": {"head": "Artikel 43 · De certificeringsorganen", "items": ["Alleen een deskundig orgaan dat zelf geaccrediteerd is", "Accreditatie door de toezichthouder, de nationale accreditatie-instantie of beide, maximaal vijf jaar", "Het orgaan blijft verantwoordelijk en meldt afgifte en intrekking", "Eisen en criteria zijn openbaar"]}, "read": {"text": "Lees artikel 42 en artikel 43 van de AVG.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "Certificering volgens de AVG regelen twee artikelen, en je ziet hun principes op de slide. Artikel 42 gaat over het certificaat. Certificering is vrijwillig en transparant. Een onafhankelijke derde geeft het certificaat af, op grond van criteria die vooraf zijn goedgekeurd. Het geldt maximaal drie jaar, en kan worden verlengd of ingetrokken. En je eigen verantwoordelijkheid blijft. Artikel 43 gaat over wie mag certificeren. Alleen een deskundig orgaan dat zelf geaccrediteerd is, door de toezichthouder, door de nationale accreditatie-instantie of door beide, voor maximaal vijf jaar. Het orgaan blijft verantwoordelijk voor zijn beoordeling en meldt aan de toezichthouder wanneer het een certificaat afgeeft of intrekt. En de eisen en criteria zijn openbaar. We bekijken die twee artikelen nu in die volgorde: eerst het certificaat, dan de accreditatie.", "id": 12}, {"id": 13, "type": "bullets", "chip": "Deel 2.2 · Het certificaat", "title": "Certificering in de AVG: vrijwillig, door een derde, en altijd over een verwerking", "bullets": [{"k": "Vrijwillig en transparant", "t": "niemand is verplicht; het proces is toegankelijk en transparant (artikel 42, lid 3)."}, {"k": "Door een onafhankelijke derde", "t": "een geaccrediteerd certificeringsorgaan of de toezichthouder zelf geeft het certificaat af (artikel 42, lid 5); geen zelfverklaring, zoals bij het vroegere Privacy Shield."}, {"k": "Wat wordt gecertificeerd?", "t": "verwerkingen van een verwerkingsverantwoordelijke of een verwerker; een product of dienst kan het voorwerp zijn voor zover er een verwerking mee gebeurt; een managementsysteem op zich of een persoon, zoals een DPO, valt niet onder artikel 42."}, {"k": "Op basis van goedgekeurde criteria", "t": "goedgekeurd door de toezichthouder, of door het Europees Comité voor gegevensbescherming: dan heet het certificaat het Europees gegevensbeschermingszegel."}, {"k": "Maximaal drie jaar", "t": "verlengbaar onder dezelfde voorwaarden, en in te trekken zodra niet meer aan de eisen is voldaan (artikel 42, lid 7)."}], "read": {"text": "Lees artikel 42, leden 1 tot en met 7, en de richtsnoeren 1/2018 van het Europees Comité voor gegevensbescherming over certificering (randnummers 50 tot en met 58: wat kan het voorwerp van certificering zijn).", "links": [{"url": "https://eur-lex.eur
