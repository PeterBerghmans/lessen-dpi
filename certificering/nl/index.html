opa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_nl.pdf", "label": "EDPB · richtsnoeren 1/2018 certificering"}]}, "script": "Eerst het certificaat. Een organisatie kan voor een bepaalde verwerking een AVG-certificaat behalen; dat regelt artikel 42. Vijf kenmerken. Eén: certificering is vrijwillig, en het proces is toegankelijk en transparant. Niemand is verplicht. Twee: het certificaat komt van een onafhankelijke derde, een geaccrediteerd certificeringsorgaan of de toezichthouder zelf. Dat is iets anders dan een zelfverklaring, zoals bij het vroegere Privacy Shield. Drie, en hier loopt het vaak fout: wat wordt er gecertificeerd? Denk terug aan het verschil dat je zag: bij ISO 27001 en ISO 27701 een managementsysteem van de organisatie, bij de AVG een verwerking. Artikel 42 spreekt over verwerkingen van een verwerkingsverantwoordelijke of een verwerker. Een product of een dienst kan het voorwerp zijn, voor zover er een verwerking van persoonsgegevens mee gebeurt. Maar een managementsysteem op zich, of een persoon zoals een DPO, valt niet onder artikel 42. Vier: de beoordeling gebeurt op basis van criteria die vooraf zijn goedgekeurd, door de toezichthouder of door het Europees Comité voor gegevensbescherming. In dat laatste geval heet het certificaat het Europees gegevensbeschermingszegel, en geldt het in de hele Unie. Vijf: een certificaat geldt maximaal drie jaar. Het kan worden verlengd, en het wordt ingetrokken zodra niet meer aan de eisen is voldaan."}, {"id": 14, "type": "figure", "chip": "Deel 2.2 · Een mythe", "title": "Honderd procent AVG-compliant bestaat niet", "svg": "<svg viewBox=\"0 0 520 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Stempel 100 % AVG-compliant, doorgestreept\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><g transform=\"rotate(-8 260 125)\"><rect class=\"cst\" x=\"70\" y=\"55\" width=\"380\" height=\"140\" rx=\"18\"/><rect class=\"cst\" x=\"84\" y=\"69\" width=\"352\" height=\"112\" rx=\"10\" style=\"stroke-width:2\"/><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"118\" text-anchor=\"middle\">100 %<\/text><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"160\" text-anchor=\"middle\">AVG-COMPLIANT<\/text><\/g><line class=\"cbad\" x1=\"60\" y1=\"30\" x2=\"460\" y2=\"220\"/><line class=\"cbad\" x1=\"460\" y1=\"30\" x2=\"60\" y2=\"220\"/><\/svg>", "caption": "Artikel 42, lid 4 van de AVG: Een certificering op grond van dit artikel doet niets af aan de verantwoordelijkheid van de verwerkingsverantwoordelijke of de verwerker om deze verordening na te leven en laat de taken en bevoegdheden van de overeenkomstig artikel 55 of 56 bevoegde toezichthoudende autoriteiten onverlet.", "bullets": [{"k": "Een momentopname", "t": "het certificaat zegt iets over de dag van de audit en over het afgebakende voorwerp, niet over alles wat de organisatie doet."}, {"k": "Geen rechtszekerheid", "t": "een rechter of de toezichthouder kan nog altijd een inbreuk vaststellen."}, {"k": "Je verplichtingen blijven", "t": "de certificering doet niets af aan je verantwoordelijkheid om de AVG na te leven."}, {"k": "Niet minder toezicht", "t": "de taken en bevoegdheden van de GBA blijven onverlet; de GBA kan zelfs een certificaat laten intrekken."}], "read": {"text": "Lees artikel 42, lid 4, en artikel 58, lid 2, punt h (de bevoegdheid om een certificering in te trekken of te laten intrekken).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "En dan het stempel uit de offerte: honderd procent AVG-compliant. Op de slide staat er een rood kruis door, en dat kruis staat er met reden. Een certificaat is een momentopname: het zegt iets over de dag van de audit en over het afgebakende voorwerp, niet over alles wat de organisatie doet. Het geeft ook geen rechtszekerheid, want een rechter of de toezichthouder kan nog altijd een inbreuk vaststellen. En de wet zegt het zelf. Lees artikel 42, lid 4, onder de tekening: een certificering doet niets af aan de verantwoordelijkheid van de verwerkingsverantwoordelijke of de verwerker om de verordening na te leven, en laat de taken en bevoegdheden van de toezichthoudende autoriteiten onverlet. Je verplichtingen blijven dus volledig bestaan, en er komt niet minder toezicht: de GBA kan een certificaat zelfs laten intrekken. Onthoud dus: een certificaat helpt je aantonen, het neemt je verantwoordelijkheid niet over."}, {"id": 15, "type": "compare", "chip": "Deel 2.2 · De afweging", "title": "Een certificaat halen: wat win je, en wat kost het?", "left": {"head": "Voordelen", "items": ["Vertrouwen bij klanten, betrokkenen en de toezichthouder: je toont, je beweert niet", "Bewijs voor gegevensbescherming door ontwerp en door standaardinstellingen (artikel 25, lid 3)", "Verwerkers kiezen wordt eenvoudiger: een certificaat is een element om voldoende garanties aan te tonen (artikel 28, lid 5, en artikel 32, lid 3)", "Een mogelijke passende waarborg voor doorgiften buiten de EER (artikel 42, lid 2, en artikel 46, lid 2, punt f)", "De voorbereiding dwingt tot orde: afbakenen, documenteren, verbeteren"]}, "right": {"head": "Nadelen", "items": ["Kosten: voorbereiding, de audit zelf, jaarlijkse opvolging en hercertificering na ten hoogste drie jaar", "Extra formeel toezicht: het certificeringsorgaan kijkt mee en meldt afgifte en intrekking aan de toezichthouder", "Een smal voorwerp: alleen de afgebakende verwerking is gecertificeerd, niet de hele organisatie", "Een ingetrokken certificaat is zichtbaar en schaadt het vertrouwen dat je wou winnen"]}, "read": {"text": "Lees artikel 25, lid 3, artikel 28, lid 5, en artikel 42, lid 2; de richtsnoeren 07/2022 van het Europees Comité voor gegevensbescherming behandelen certificering als instrument voor doorgiften.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/2023-05/edpb_guidelines_07-2022_on_certification_as_a_tool_for_transfers_v2_nl_0.pdf", "label": "EDPB · richtsnoeren 07/2022 doorgiften"}]}, "script": "Loont het om een certificaat te halen? Eerst de voordelen. Een certificaat wekt vertrouwen bij klanten, betrokkenen en de toezichthouder, want je toont iets in plaats van het te beweren. Het is een element van bewijs voor gegevensbescherming door ontwerp en door standaardinstellingen. Het maakt het kiezen van verwerkers eenvoudiger: een certificaat is een element om voldoende garanties aan te tonen. Het kan een passende waarborg zijn voor doorgiften buiten de Europese Economische Ruimte. En de voorbereiding dwingt tot orde: afbakenen, documenteren, verbeteren. Dan de nadelen. De kosten: de voorbereiding, de audit, de jaarlijkse opvolging en de hercertificering na ten hoogste drie jaar. Het extra formele toezicht: het certificeringsorgaan kijkt mee en meldt afgifte en intrekking aan de toezichthouder. Het smalle voorwerp: alleen de afgebakende verwerking is gecertificeerd, niet de hele organisatie. En een ingetrokken certificaat is zichtbaar, en schaadt het vertrouwen dat je wou winnen."}, {"id": 16, "type": "figure", "layout": "stack", "chip": "Deel 2.2 · Accreditatie", "title": "Wie controleert de certificeerder? Accreditatie in artikel 43", "svg": "<svg viewBox=\"0 0 940 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Accreditatie vijf jaar, certificaat drie jaar\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><line class=\"cax\" x1=\"250\" y1=\"200\" x2=\"900\" y2=\"200\"/><line class=\"cax\" x1=\"250.0\" y1=\"194\" x2=\"250.0\" y2=\"206\"/><text class=\"ct2\" x=\"250.0\" y=\"224\" text-anchor=\"middle\">start<\/text><line class=\"cax\" x1=\"380.0\" y1=\"194\" x2=\"380.0\" y2=\"206\"/><text class=\"ct2\" x=\"380.0\" y=\"224\" text-anchor=\"middle\">jaar 1<\/text><line class=\"cax\" x1=\"510.0\" y1=\"194\" x2=\"510.0\" y2=\"206\"/><text class=\"ct2\" x=\"510.0\" y=\"224\" text-anchor=\"middle\">jaar 2<\/text><line class=\"cax\" x1=\"640.0\" y1=\"194\" x2=\"640.0\" y2=\"206\"/><text class=\"ct2\" x=\"640.0\" y=\"224\" text-anchor=\"middle\">jaar 3<\/text><line class=\"cax\" x1=\"770.0\" y1=\"194\" x2=\"770.0\" y2=\"206\"/><text class=\"ct2\" x=\"770.0\" y=\"224\" text-anchor=\"middle\">jaar 4<\/text><line class=\"cax\" x1=\"900.0\" y1=\"194\" x2=\"900.0\" y2=\"206\"/><text class=\"ct2\" x=\"900.0\" y=\"224\" text-anchor=\"middle\">jaar 5<\/text><text class=\"ct1\" x=\"12\" y=\"62\">Accreditatie<\/text><text class=\"ct2\" x=\"12\" y=\"79\">BELAC → certificeringsorgaan<\/text><text class=\"ct2\" x=\"12\" y=\"94\">artikel 43, lid 4<\/text><rect class=\"cbar2\" x=\"250\" y=\"48\" width=\"650.0\" height=\"42\" rx=\"8\"/><text class=\"ctw\" style=\"fill:#fff\" x=\"575.0\" y=\"74\" text-anchor=\"middle\">maximaal 5 jaar, verlengbaar<\/text><text class=\"ct1\" x=\"12\" y=\"140\">Certificaat<\/text><text class=\"ct2\" x=\"12\" y=\"157\">certificeringsorgaan → organisatie<\/text><text class=\"ct2\" x=\"12\" y=\"172\">artikel 42, lid 7<\/text><rect class=\"cbar\" x=\"250\" y=\"126\" width=\"390.0\" height=\"42\" rx=\"8\"/><text class=\"ct1\" x=\"445.0\" y=\"152\" text-anchor=\"middle\">maximaal 3 jaar, verlengbaar<\/text><line class=\"cln2\" x1=\"380.0\" y1=\"120\" x2=\"380.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><line class=\"cln2\" x1=\"510.0\" y1=\"120\" x2=\"510.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><text class=\"cl\" x=\"654.0\" y=\"144\">tussentijds toezicht: minstens<\/text><text class=\"cl\" x=\"654.0\" y=\"160\">om de 12 maanden (eis GBA)<\/text><\/svg>", "bullets": [{"k": "Wie accrediteert?", "t": "de lidstaat kiest: de toezichthouder, de nationale accreditatie-instantie volgens de norm ISO 17065 met aanvullende eisen van de toezichthouder, of beide (artikel 43, lid 1)."}, {"k": "België", "t": "BELAC accrediteert, volgens ISO 17065 en de aanvullende eisen van de GBA (artikel 18 van de wet van 30 juli 2018; beslissing 02/2026 van de GBA van 2 juni 2026)."}, {"k": "Voorwaarden", "t": "het certificeringsorgaan moet aan voorwaarden voldoen die artikel 43, lid 2, vastlegt."}, {"k": "Vijf tegenover drie jaar", "t": "de accreditatie geldt maximaal vijf jaar, een certificaat maximaal drie jaar."}, {"k": "Meldplicht", "t": "het certificeringsorgaan meldt aan de toezichthouder waarom het een certificaat afgeeft of intrekt (artikel 43, lid 5)."}, {"k": "Openbaar register", "t": "het Europees Comité voor gegevensbescherming houdt een openbaar register bij van alle certificeringsmechanismen, zegels en merktekens (artikel 42, lid 8)."}], "read": {"text": "Lees artikel 43, leden 1, 2, 4 en 5, artikel 18 van de wet van 30 juli 2018, en de aanvullende accreditatie-eisen van de GBA.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://www.ejustice.just.fgov.be/eli/wet/2018/07/30/2018040581/justel", "label": "Wet van 30 juli 2018 · artikel 18 (Justel)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/decision-n0-02-2026-of-2-june-2026.pdf", "label": "GBA 02/2026 · aanvullende accreditatie-eisen"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_nl", "label": "EDPB · register van certificeringen"}]}, "script": "Dan de tweede helft van de certificering volgens de AVG: accreditatie. Wie controleert de certificeerder? Een certificeringsorgaan mag pas AVG-certificaten afgeven als het zelf geaccrediteerd is. Dat regelt artikel 43. Wie accrediteert? De lidstaat kiest: de toezichthouder zelf, de nationale accreditatie-instantie, of beide. De accreditatie-instantie werkt dan volgens de norm ISO 17065 en met de aanvullende eisen van de toezichthouder. België koos voor die weg. Artikel 18 van de wet van dertig juli tweeduizend achttien zegt dat BELAC de certificeringsorganen accrediteert, en de GBA legde haar aanvullende eisen vast in een beslissing van twee juni tweeduizend zesentwintig. Artikel 43 legt ook voorwaarden vast waaraan het certificeringsorgaan moet voldoen. Kijk dan naar de tijdlijn. De accreditatie geldt maximaal vijf jaar. Een certificaat geldt maximaal drie jaar, met volgens de eisen van de GBA minstens om de twaalf maanden tussentijds toezicht. Het certificeringsorgaan meldt aan de toezichthouder waarom het een certificaat afgeeft of intrekt. En alles wat goedgekeurd is, komt in een openbaar register van het Europees Comité voor gegevensbescherming."}, {"id": 17, "type": "table", "chip": "Deel 2.2 · De praktijk in Europa", "title": "Echt AVG-certificaat of marktlabel? Het register beslist", "head": ["Naam", "Wat is het?", "Artikel 42-certificaat?"], "rows": [["Europrivacy", "schema uit Luxemburg; eerste Europees gegevensbeschermingszegel (advies 28/2022 van het Comité, oktober 2022); in april 2026 uitgebreid tot instrument voor doorgiften", "ja, Europees zegel"], ["EuroPriSe", "ontstaan bij de toezichthouder van Sleeswijk-Holstein; het schema voor verwerkers staat sinds 2024 in het register als Europees zegel", "ja, Europees zegel (verwerkers)"], ["BC 5701", "schema van Brand Compliance, goedgekeurd in Nederland; sinds 2025 in het register als Europees zegel", "ja, Europees zegel"], ["GDPR-CARPA", "schema van de Luxemburgse toezichthouder zelf, met nationale criteria", "ja, nationaal (Luxemburg)"], ["ISO/IEC 27701 en ISO/IEC 27001", "internationale normen voor een managementsysteem; tonen goed bestuur aan", "nee: een managementsysteem"], ["ISDP©10003 en ePrivacyseal", "privacyschema's uit de markt; staan niet in het register van het Comité", "nee: marktlabel"], ["DPO-certificaat", "certificering van een persoon", "nee: artikel 42 gaat over verwerkingen"]], "hl": [0, 1, 2, 3], "read": {"text": "Open het register van het Europees Comité voor gegevensbescherming en zoek een schema op; in november 2026 telt het zeventien vermeldingen, geen enkele met Belgische criteria.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_nl", "label": "EDPB · register van certificeringen"}, {"url": "https://www.edpb.europa.eu/system/files/documents/2022-10/edpb_opinion_202228_approval_of_europrivacy_certification_criteria_as_eu_data_protection_seal_en.pdf", "label": "EDPB 28/2022 · Europrivacy"}, {"url": "https://www.edpb.europa.eu/system/files/2026-04/edpb_opinion_202615_europrivacy_en.pdf", "label": "EDPB 15/2026 · Europrivacy doorgiften"}]}, "script": "Hoe ziet dat er vandaag uit in Europa? Niet elk privacylogo op een website is een AVG-certificaat. De toets is eenvoudig: staat het schema in het register van het Europees Comité voor gegevensbescherming? De tabel zet zeven namen op een rij. De eerste vier zijn echte artikel 42-certificaten. Europrivacy, een schema uit Luxemburg, werd in oktober tweeduizend tweeëntwintig het eerste Europees gegevensbeschermingszegel, en is in april tweeduizend zesentwintig uitgebreid tot een instrument voor doorgiften. EuroPriSe ontstond bij de toezichthouder van Sleeswijk-Holstein; het schema voor verwerkers staat sinds tweeduizend vierentwintig in het register als Europees zegel. BC 5701, het schema van Brand Compliance, werd eerst in Nederland goedgekeurd en staat sinds tweeduizend vijfentwintig in het register als Europees zegel. En GDPR-CARPA is een schema van de Luxemburgse toezichthouder zelf, met nationale criteria. Certificering is één instrument. Er is een tweede, dat een organisatie ook kan gebruiken: de gedragscode. Dat is het derde en laatste deel.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "stap voor stap een AVG-label controleren: waarop je let en hoe je het opzoekt."}}, {"type": "compare", "chip": "Deel 3 · Het kader", "title": "Artikel 40 en 41: de principes", "left": {"head": "Artikel 40 · De gedragscode", "items": ["Een sector stelt de code op, via een vereniging of orgaan dat haar vertegenwoordigt", "De toezichthouder keurt goed; bij meerdere lidstaten eerst advies van het Comité", "De code bevat mechanismen voor verplicht toezicht", "Ook organisaties buiten de AVG kunnen toetreden, als waarborg bij doorgiften"]}, "right": {"head": "Artikel 41 · Het toezicht", "items": ["Een geaccrediteerd orgaan controleert de naleving", "Het orgaan is onafhankelijk en deskundig, zonder belangenconflict, met een klachtenprocedure", "Bij een inbreuk volgen maatregelen, tot schorsing of uitsluiting", "Geldt niet voor overheidsinstanties en overheidsorganen"]}, "read": {"text": "Lees artikel 40 en artikel 41 van de AVG.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "Het derde en laatste deel gaat over gedragscodes, waartoe een organisatie kan toetreden. Dat regelen twee artikelen, en je ziet hun principes op de slide. Artikel 40 gaat over de code zelf. Een sector stelt ze op, via een vereniging of een ander orgaan dat die sector vertegenwoordigt. De toezichthouder keurt ze goed, en bij een code voor meerdere lidstaten geeft eerst het Europees Comité voor gegevensbescherming advies. De code bevat mechanismen voor verplicht toezicht. En ook organisaties buiten de AVG kunnen toetreden, als waarborg bij doorgiften. Artikel 41 gaat over het toezicht op de code. Een geaccrediteerd orgaan controleert de naleving. Het is onafhankelijk en deskundig, heeft geen belangenconflict en heeft een klachtenprocedure. Bij een inbreuk neemt het maatregelen, tot schorsing of uitsluiting van de organisatie. Dit geldt niet voor overheidsinstanties en overheidsorganen. Hoe dat er in de praktijk uitziet, zie je op de volgende slide.", "id": 18}, {"id": 19, "type": "cards", "cols": 3, "numbered": false, "chip": "Deel 3 · Gedragscodes", "title": "De gedragscode: een sector vertaalt de AVG, en een organisatie kan toetreden", "cards": [{"k": "Wie stelt op?", "t": "verenigingen en andere organen die categorieën van verwerkingsverantwoordelijken of verwerkers vertegenwoordigen: een federatie, een koepel, een beroepsorganisatie (artikel 40, lid 2)."}, {"k": "Wie keurt goed?", "t": "de toezichthoudende autoriteit, in België de GBA; bij een code voor meerdere lidstaten eerst een advies van het Europees Comité voor gegevensbescherming (artikel 40, leden 5 en 7)."}, {"k": "Wie houdt toezicht?", "t": "een deskundig en onafhankelijk orgaan dat door de GBA is geaccrediteerd (artikel 41); die regel geldt niet voor overheidsinstanties en -organen (artikel 41, lid 6)."}, {"k": "Toetreden", "t": "een organisatie uit de sector kan toetreden als er voor haar sector een goedgekeurde code bestaat; ze verbindt zich tot de regels van de code en aanvaardt het toezicht."}, {"k": "België · notarissen", "hl": true, "t": "de gedragscode van de Nationale Kamer van Notarissen, de eerste nationale code (beslissing 04/2021 van de GBA van 8 april 2021); de Nationale Kamer houdt zelf toezicht, omdat notarissen openbare ambtenaren zijn."}, {"k": "Europa · cloud", "hl": true, "t": "de EU Cloud Code of Conduct voor cloudverwerkers, goedgekeurd door de GBA op 20 mei 2021 na advies van het Comité; SCOPE Europe is het geaccrediteerde toezichthoudende orgaan."}], "read": {"text": "Lees artikel 40, leden 1, 2 en 5, en artikel 41, leden 1, 2 en 6. Bekijk de pagina van de GBA over gedragscodes en de twee goedgekeurde codes.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/gedragscodes-en-toezichthoudend-orgaan", "label": "GBA · gedragscodes en toezichthoudend orgaan"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-nr.-04-2021-van-8-april-2021.pdf", "label": "GBA 04/2021 · gedragscode notarissen"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/burger/de-gegevensbeschermingsautoriteit-keurt-zijn-eerste-europese-gedragscode-goed", "label": "GBA · EU Cloud Code of Conduct (20 mei 2021)"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/codes-of-conduct_nl", "label": "EDPB · register van gedragscodes"}]}, "script": "Wat betekent dat in de praktijk? Een gedragscode is een reeks regels waarmee een sector de AVG vertaalt naar zijn eigen praktijk, en waartoe een organisatie uit die sector kan toetreden. Wie stelt een code op? Geen individueel bedrijf, wel een vereniging of een ander orgaan dat een categorie van verwerkingsverantwoordelijken of verwerkers vertegenwoordigt, zoals een federatie of een beroepsorganisatie. Wie keurt goed? De toezichthoudende autoriteit, in België de GBA. Geldt de code in meerdere lidstaten, dan geeft het Europees Comité voor gegevensbescherming eerst een advies. Wie houdt toezicht op de leden? Een deskundig en onafhankelijk orgaan dat door de GBA is geaccrediteerd. Toetreden kan een organisatie alleen als er voor haar sector een goedgekeurde code bestaat. Ze verbindt zich dan tot de regels van de code, en ze aanvaardt het toezicht. Twee concrete codes. In België keurde de GBA op acht april tweeduizend eenentwintig de gedragscode van de Nationale Kamer van Notarissen goed, de eerste nationale code. Omdat notarissen openbare ambtenaren zijn, houdt de Nationale Kamer zelf toezicht. Op Europees niveau keurde de GBA op twintig mei tweeduizend eenentwintig de EU Cloud Code of Conduct goed, een code voor cloudverwerkers, met SCOPE Europe als geaccrediteerd toezichthoudend orgaan."}, {"id": 20, "type": "quote", "chip": "Deel 3 · Waarom toetreden?", "title": "Wat een gedragscode of een certificaat je juridisch oplevert", "source": "Artikel 24, lid 3 van de AVG", "quote": "Het aansluiten bij goedgekeurde gedragscodes als bedoeld in artikel 40 of goedgekeurde certificeringsmechanismen als bedoeld in artikel 42 kan worden gebruikt als element om aan te tonen dat de verplichtingen van de verwerkingsverantwoordelijke zijn nagekomen.", "bullets": [{"k": "Bewijs voor de verantwoordingsplicht", "t": "een element om aan te tonen dat je je verplichtingen nakomt; hetzelfde geldt voor de garanties van een verwerker (artikel 28, lid 5), voor de beveiliging (artikel 32, lid 3) en voor gegevensbescherming door ontwerp (artikel 25, lid 3, alleen certificering)."}, {"k": "Geldboeten", "t": "bij de beslissing of er een boete komt en hoe hoog die is, houdt de GBA naar behoren rekening met het aansluiten bij een goedgekeurde gedragscode of certificering (artikel 83, lid 2, punt j)."}, {"k": "Doorgiften", "t": "een goedgekeurde gedragscode of certificering, samen met bindende en afdwingbare toezeggingen van de ontvanger in het derde land, is een passende waarborg (artikel 46, lid 2, punten e en f)."}, {"k": "Geen vrijbrief", "t": "het is een element van bewijs, geen vermoeden van conformiteit: wie een code ondertekent en ze niet naleeft, staat zwakker, niet sterker."}], "read": {"text": "Lees artikel 24, lid 3, artikel 28, lid 5, artikel 32, lid 3, artikel 83, lid 2, punt j, en artikel 46, lid 2, punten e en f.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "Waarom zou een organisatie tot een gedragscode toetreden of een certificaat halen? Omdat de AVG er op drie plaatsen een gevolg aan koppelt. Eerst bewijs. Lees artikel 24, lid 3, op de slide: het aansluiten bij goedgekeurde gedragscodes of certificeringsmechanismen kan worden gebruikt als element om aan te tonen dat de verplichtingen van de verwerkingsverantwoordelijke zijn nagekomen. Dat is de verantwoordingsplicht in de praktijk. Dan geldboeten. Volgens artikel 83, lid 2, houdt de toezichthouder daar naar behoren rekening mee bij de beslissing of er een boete komt, en hoe hoog die is. En doorgiften buiten de Europese Economische Ruimte: een goedgekeurde gedragscode of certificering kan een passende waarborg zijn. Maar let op het woord in de wettekst: een element. Het is geen vrijbrief en geen vermoeden van conformiteit. Wie een code ondertekent en ze daarna niet naleeft, staat bij de toezichthouder zwakker, niet sterker. Tijd om dat zelf toe te passen, met een denkoefening."}, {"id": 21, "type": "reveal", "chip": "Denkoefening", "title": "Terug naar de offerte: wat zijn de drie stukken waard?", "question": "De leverancier legt drie stukken voor. Eén: een logo met de woorden honderd procent AVG-compliant, zonder verdere uitleg. Twee: een ISO 27001-certificaat van een geaccrediteerd certificeringsorgaan. Drie: een Europrivacy-certificaat voor de dienst die jullie willen afnemen. Wat is elk stuk waard voor jou als DPO, en wat kijk je na?", "verdict": "Het logo is een eigen verklaring en bewijst niets; ISO 27001 zegt iets over de beveiliging, niet over de AVG; alleen het Europrivacy-certificaat is een artikel 42-certificaat, als het voorwerp klopt en het nog geldig is", "answer": [{"k": "Het logo", "t": "een merkteken van de leverancier zelf; niemand heeft het getoetst, en honderd procent conformiteit sluit artikel 42, lid 4 zelf uit. Vraag wat erachter zit."}, {"k": "ISO 27001", "t": "een echt certificaat van een derde, over het managementsysteem voor informatiebeveiliging; een nuttig element voor de beveiliging (artikel 32), geen AVG-certificaat. Kijk het toepassingsgebied en de accreditatie na."}, {"k": "Europrivacy", "t": "een Europees gegevensbeschermingszegel: een element om voldoende garanties aan te tonen (artikel 28, lid 5). Kijk na of het voorwerp jullie dienst dekt, wie het afgaf, en of het nog geldig is."}, {"k": "En daarna", "t": "je eigen verplichtingen blijven: de verwerkersovereenkomst, je eigen beoordeling van de risico's en de opvolging van de verwerker."}], "read": {"text": "Zoek het schema op in het register van het Europees Comité voor gegevensbescherming en vraag de leverancier naar het certificaat zelf, met het voorwerp en de geldigheidsdatum.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_nl", "label": "EDPB · register van certificeringen"}, {"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}]}, "script": "Tijd om het zelf te doen. Terug naar de offerte van het begin. De leverancier legt drie stukken voor. Eén: een logo met de woorden honderd procent AVG-compliant, zonder verdere uitleg. Twee: een ISO 27001-certificaat van een geaccrediteerd certificeringsorgaan. Drie: een Europrivacy-certificaat voor de dienst die jullie willen afnemen. Wat is elk stuk waard voor jou als DPO, en wat kijk je na? Zet de audio even stil en denk na. … Het logo is een merkteken van de leverancier zelf. Niemand heeft het getoetst, en honderd procent conformiteit sluit de wet zelf uit. Het bewijst dus niets; vraag wat erachter zit. Het ISO 27001-certificaat is een echt certificaat van een derde, maar het gaat over het managementsysteem voor informatiebeveiliging. Het is een nuttig element voor de beveiliging, geen AVG-certificaat. Kijk het toepassingsgebied na: dekt het de dienst die jullie afnemen? Het Europrivacy-certificaat is het enige artikel 42-certificaat van de drie. Het is een element om aan te tonen dat de verwerker voldoende garanties biedt. Kijk na of het voorwerp jullie dienst dekt, wie het afgaf, en of het nog geldig is. En daarna blijven je eigen verplichtingen: de verwerkersovereenkomst, je eigen beoordeling van de risico's en de opvolging van de verwerker."}, {"id": 22, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "De norm zegt waaraan je moet voldoen, het certificeringsorgaan beoordeelt, en de accreditatie-instantie controleert de certificeerder; een gedragscode en een certificaat zijn elementen van bewijs voor de verantwoordingsplicht, tellen mee bij een geldboete en kunnen een waarborg zijn voor doorgiften, maar nemen je verantwoordelijkheid nooit over; in België accrediteert BELAC met de eisen van de GBA; en of een label een echt AVG-certificaat is, lees je in het register van het Europees Comité voor gegevensbescherming.", "bullets": [{"k": "Begrippen", "t": "normalisatie, accreditatie, conformiteitsbeoordeling, certificering; merkteken (producent zelf), zegel (oorsprong en integriteit), certificaat (attest van een derde)."}, {"k": "Niet verwarren", "t": "ISO 27001 en ISO 27701 certificeren een managementsysteem; ze zijn nuttig, maar geen AVG-certificaat."}, {"k": "Certificering", "t": "vrijwillig, door een derde, over een verwerking, maximaal drie jaar; honderd procent AVG-compliant bestaat niet (artikel 42)."}, {"k": "Accreditatie", "t": "BELAC met de aanvullende eisen van de GBA, maximaal vijf jaar (artikel 43)."}, {"k": "Gedragscode", "t": "door een sectororganisatie, goedgekeurd door de GBA, met toezicht; een organisatie kan toetreden (artikelen 40 en 41); voorbeelden: notarissen en cloud."}, {"k": "Gevolgen", "t": "element van bewijs (artikel 24, lid 3), factor bij een geldboete (artikel 83, lid 2, punt j), waarborg voor doorgiften (artikel 46, lid 2, punten e en f)."}, {"k": "In de praktijk", "t": "vraag het certificaat zelf, kijk voorwerp, afgever en geldigheid na, en zoek het schema op in het register."}], "script": "Tijd om samen te vatten. De norm zegt waaraan je moet voldoen, het certificeringsorgaan beoordeelt of je eraan voldoet, en de accreditatie-instantie controleert de certificeerder. Een merkteken komt van de producent zelf, een zegel toont oorsprong en integriteit, een certificaat is een attest van een derde. ISO 27001 en ISO 27701 certificeren een managementsysteem en zijn nuttig, maar nooit een AVG-certificaat. Een AVG-certificaat is vrijwillig, komt van een derde, gaat over een afgebakende verwerking, en geldt maximaal drie jaar. In België accrediteert BELAC de certificeringsorganen, met de aanvullende eisen van de GBA, voor maximaal vijf jaar. Een gedragscode komt van een sectororganisatie en wordt goedgekeurd door de GBA; een organisatie uit de sector kan toetreden, zoals bij de notarissen of bij de cloudverwerkers. Gedragscodes en certificaten zijn een element van bewijs, een factor bij een geldboete en een mogelijke waarborg voor doorgiften. Maar ze nemen je verantwoordelijkheid nooit over: honderd procent AVG-compliant bestaat niet. En in de praktijk: vraag het certificaat zelf, kijk het voorwerp, de afgever en de geldigheid na, en zoek het schema op in het register. Of zo'n label echt is, leer je stap voor stap controleren in de verdieping, die je onderaan deze slide opent. Daarna volgen de tien oefenvragen.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "een AVG-label stap voor stap controleren: waarop je let en hoe je het opzoekt."}}], "quiz": [{"q": "Wat doet een accreditatie-instantie zoals BELAC?", "options": ["Ze schrijft de normen waaraan organisaties getoetst worden.", "Ze bevestigt dat een certificeringsorgaan bekwaam is.", "Ze voert bij organisaties de audit uit en geeft het certificaat af.", "Ze keurt gedragscodes goed en houdt toezicht op de leden ervan."], "answer": 1, "feedback": ["Normen schrijven is normalisatie: het werk van ISO, CEN of NBN.", "Juist. Accreditatie is de controle van de certificeerder zelf.", "Dat doet het certificeringsorgaan met zijn auditor, niet de accreditatie-instantie.", "Gedragscodes keurt de GBA goed; het toezicht doet een geaccrediteerd orgaan."]}, {"q": "Een fabrikant brengt zelf de CE-markering aan op zijn toestel. Wat is dat?", "options": ["Een merkteken: een verklaring van de producent zelf.", "Een certificaat: een attest van een onafhankelijke derde.", "Een zegel: een bewijs van oorsprong en van integriteit.", "Een accreditatie: een erkenning door de nationale overheid."], "answer": 0, "feedback": ["Juist. Bij een merkteken spreekt de producent zelf.", "Een certificaat komt van een derde partij na een beoordeling.", "Een zegel toont van wie iets komt en dat er niet aan geraakt is.", "Accreditatie gaat over certificeringsorganen, niet over producten."]}, {"q": "Wie kan volgens artikel 40 van de AVG een gedragscode opstellen?", "options": ["Elke verwerkingsverantwoordelijke, voor zijn eigen interne organisatie.", "De toezichthoudende autoriteit, voor elke sector in haar land.", "Een vereniging die een categorie van organisaties vertegenwoordigt.", "Een geaccrediteerd certificeringsorgaan, voor zijn eigen klanten."], "answer": 2, "feedback": ["Een intern beleid is geen gedragscode in de zin van artikel 40.", "De toezichthouder keurt goed, maar stelt de code niet zelf op.", "Juist. Een federatie, koepel of beroepsorganisatie stelt de code op.", "Een certificeringsorgaan certificeert; het stelt geen gedragscode op."]}, {"q": "Wie houdt toezicht op de naleving van een goedgekeurde gedragscode door de leden?", "options": ["De nationale accreditatie-instantie, in België dus BELAC.", "Het Europees Comité voor gegevensbescherming in Brussel.", "De sectororganisatie die de gedragscode zelf heeft opgesteld en ingediend.", "Een orgaan dat de toezichthouder daartoe heeft geaccrediteerd."], "answer": 3, "feedback": ["BELAC accrediteert certificeringsorganen, geen toezichthoudende organen van codes.", "Het Comité geeft advies over codes voor meerdere lidstaten, maar houdt geen toezicht op leden.", "De opsteller is niet vanzelf de toezichthouder; het orgaan moet onafhankelijk en geaccrediteerd zijn.", "Juist. Artikel 41: een deskundig orgaan, geaccrediteerd door de toezichthouder."]}, {"q": "Welk gevolg heeft het aansluiten bij een goedgekeurde gedragscode volgens artikel 24, lid 3?", "options": ["Het levert een wettelijk vermoeden op dat de AVG wordt nageleefd.", "Het is een element om aan te tonen dat je je plichten nakomt.", "Het sluit uit dat de toezichthouder nog een geldboete oplegt.", "Het vervangt de verplichting om een register bij te houden."], "answer": 1, "feedback": ["De wet spreekt van een element, niet van een vermoeden van conformiteit.", "Juist. Een element van bewijs voor de verantwoordingsplicht.", "Het is een factor bij de boete (artikel 83, lid 2, punt j), geen uitsluiting.", "Alle andere verplichtingen van de AVG blijven gewoon bestaan."]}, {"q": "Wat kan het voorwerp zijn van een certificering onder artikel 42 van de AVG?", "options": ["Een persoon, zoals een functionaris voor gegevensbescherming.", "Een managementsysteem voor informatiebeveiliging als geheel.", "Een verwerking door een verantwoordelijke of een verwerker.", "Een hele organisatie, met al haar huidige en latere verwerkingen."], "answer": 2, "feedback": ["Certificering van personen valt buiten artikel 42.", "Een managementsysteem op zich is geen verwerking; dat is het terrein van ISO-normen.", "Juist. Artikel 42 gaat over verwerkingen, ook via een product of dienst.", "Het voorwerp is afgebakend; een certificaat dekt nooit alles."]}, {"q": "Stelling: wie een AVG-certificaat heeft, staat onder minder toezicht van de GBA.", "options": ["Juist, want de GBA vertrouwt op het werk van de certificeerder.", "Juist, maar alleen zolang het certificaat geldig blijft.", "Onjuist, behalve voor de gecertificeerde verwerking zelf.", "Onjuist: de bevoegdheden van de GBA blijven onverlet."], "answer": 3, "feedback": ["Artikel 42, lid 4 zegt het omgekeerde: de bevoegdheden blijven onverlet.", "De geldigheid verandert niets aan de bevoegdheden van de GBA.", "Ook voor de gecertificeerde verwerking blijft de GBA volledig bevoegd.", "Juist. De GBA kan een certificaat zelfs laten intrekken."]}, {"q": "Hoe lang gelden een AVG-certificaat en de accreditatie van een certificeringsorgaan maximaal?", "options": ["Certificaat drie jaar, accreditatie vijf.", "Certificaat vijf jaar, accreditatie drie jaar.", "Beide drie jaar, telkens verlengbaar.", "Certificaat één jaar, accreditatie vijf jaar."], "answer": 0, "feedback": ["Juist. Artikel 42, lid 7 en artikel 43, lid 4.", "Net omgekeerd: het certificaat drie, de accreditatie vijf.", "De accreditatie geldt langer: maximaal vijf jaar.", "Jaarlijks is er tussentijds toezicht, maar het certificaat geldt tot drie jaar."]}, {"q": "Wie accrediteert in België de certificeringsorganen voor AVG-certificaten?", "options": ["De GBA alleen, op basis van haar eigen accreditatiecriteria.", "BELAC, volgens ISO 17065 en de aanvullende eisen van de GBA.", "Het Europees Comité voor gegevensbescherming, via het register.", "De FOD Economie, na advies van de sectororganisaties."], "answer": 1, "feedback": ["De AVG laat die keuze toe, maar België koos voor de accreditatie-instantie.", "Juist. Artikel 18 van de wet van 30 juli 2018.", "Het Comité keurt criteria goed en houdt het register bij, maar accrediteert niet.", "BELAC hoort bij de FOD Economie, maar accrediteert zelf, met de eisen van de GBA."]}, {"q": "Een leverancier toont een ISO/IEC 27701-certificaat. Wat betekent dat voor jou als DPO?", "options": ["Het is een Europees gegevensbeschermingszegel volgens artikel 42.", "Het bewijst dat de leverancier de AVG volledig naleeft.", "Het heeft geen enkele waarde bij het beoordelen van de verwerker.", "Het toont goed bestuur aan, maar is geen artikel 42-certificaat."], "answer": 3, "feedback": ["Een Europees zegel staat in het register van het Comité; deze norm niet.", "Geen enkel certificaat bewijst volledige naleving.", "Het is wel degelijk een nuttig element in je beoordeling.", "Juist. Een norm voor een managementsysteem, zonder de gevolgen van artikel 42."]}]}</script>

<script>

  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  $('footer').textContent = C.module + ' · ' + C.title + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;

  $('intro-sub').textContent = C.subtitle;

  $('intro-meta').textContent = C.duration;

    $('btn-skip').textContent = U.skip_short || ({nl:'Naar de oefeningen',fr:'Aux exercices',en:'To the exercises'})[C.lang] || U.skip_to_quiz;
    $('btn-silent').querySelector('span').textContent = U.silent_label || ({nl:'Zonder geluid',fr:'Sans son',en:'Without sound'})[C.lang] || 'Without sound';
  }
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;

  if(C.silent){ const b=$('btn-silent'); b.classList.remove('hidden'); b.title = U.silent_title || SILENT_TXT; }
  function setSilent(on){ SILENT = on; audio.muted = on; }
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  /* download (bv. volledige slidedeck in pdf naast index.html): C.download = {url,label} */
  if(C.download){ const a=$('nav-dl'); a.href=C.download.url; a.textContent='⤓ '+C.download.label; a.title=C.download.title||C.download.label; a.classList.remove('hidden'); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });
  $('nav-quiz').addEventListener('click',()=>{ audio.pause(); if(!$('quiz').classList.contains('hidden')||!$('result').classList.contains('hidden')) return; if(typeof paused!=='undefined' && paused){ $('btn-resume').click(); } else show('quiz-intro'); });
  $('btn-prev').querySelector('span').textContent = U.prev;
  $('btn-next').querySelector('span').textContent = U.next;
  $('lbl-autoplay').textContent = U.autoplay_short || U.autoplay; $('lbl-autoplay-wrap').title = U.autoplay; $('speed').title = U.speed; $('btn-prev').title = U.prev; $('btn-next').title = U.next;
  let rate = 1; try{ rate = parseFloat(localStorage.getItem('module-speed')) || 1; }catch(e){}
  const RATES=[1,1.25,1.5];
  function setRate(r){ rate = r; audio.playbackRate = r; $('speed').textContent = r+'×'; $('speed').classList.toggle('fast', r!==1); $('speed').title = U.speed + ': ' + r + '×'; try{ localStorage.setItem('module-speed', String(r)); }catch(e){} }
  $('speed').addEventListener('click',()=>{ setRate(RATES[(RATES.indexOf(rate)+1)%RATES.length]); });
  $('qi-title').textContent = U.quiz_intro_title;
  $('qi-text').textContent = U.quiz_intro_text;
  $('btn-quiz-start').textContent = U.quiz_start;
  $('btn-review-1').textContent = U.review;
  $('btn-review-2').textContent = U.review;
  $('btn-retry').textContent = U.retry;
  $('r-title').textContent = U.result_title;
  $('btn-q-back').querySelector('span').textContent = U.back_to_slides;
  $('btn-resume').textContent = U.resume_quiz;
  $('btn-pdf').querySelector('span').textContent = U.download_pdf;
  $('ai-title').textContent = U.ai_notice_title; $('ai-text').textContent = U.ai_notice; $('ai-badge').querySelector('span').textContent = U.ai_voice_label; $('ai-footer').textContent = U.ai_footer; document.querySelectorAll('.ai-notice img,.ai-badge img,.ai-line img').forEach(im=>im.alt=U.ai_icon_alt);
  $('t-title').textContent = U.transcript; $('btn-text-hide').textContent = U.hide_text; $('btn-text-show').textContent = U.show_text;
  const NOQUIZ = !(C.quiz && C.quiz.length) && !(C.quizzes && C.quizzes.length);
  if(NOQUIZ){ $('btn-skip').classList.add('hidden'); $('nav-quiz').classList.add('hidden'); }
  $('btn-text-hide').addEventListener('click',()=>{ if(AV){ const t=$('transcript'); t.classList.toggle('notext'); $('btn-text-hide').textContent = t.classList.contains('notext') ? U.show_text : U.hide_text; return; } $('transcript').classList.add('hidden'); $('pres-grid').classList.remove('with-text'); $('btn-text-show').classList.remove('hidden'); });
  $('btn-text-show').addEventListener('click',()=>{ $('transcript').classList.remove('hidden'); $('pres-grid').classList.add('with-text'); $('btn-text-show').classList.add('hidden'); });
  let sent=[], sentEnds=[];

          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':

        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';

        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+(s.rec&&RS.length?'<div class="readmore rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+s.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')+(s.deep?'<div class="readmore deep"><span><span class="lbl">'+esc(U.deep_label||'Verdieping')+'</span> · '+esc(s.deep.text||'')+'</span><a class="btn" href="'+esc(s.deep.url)+'?back='+(S.indexOf(s)+1)+'">'+esc(s.deep.label||U.deep_btn||'Open de verdieping')+' ›</a></div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;

      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
<script>
/* layout-fix v1 js: tekst in tekeningen (svg) die uit zijn vak of uit de tekening valt, krimpt tot hij past (breed lettertype, andere taal) */
(function(){
  function boxOf(t,bb){var g=t.parentNode,best=null,tx=bb.x+bb.width/2,ty=bb.y+bb.height/2;
    [].forEach.call(g.children,function(rc){var n=rc.tagName.toLowerCase();if(n!=='rect')return;var x=+rc.getAttribute('x'),y=+rc.getAttribute('y'),w=+rc.getAttribute('width'),h=+rc.getAttribute('height');if(isNaN(x)||isNaN(w)||h>100||w>520)return;
      if(tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h&&(!best||w*h<best.w*best.h))best={x:x,y:y,w:w,h:h};});return best;}
  function fit(root){
    [].forEach.call(root.querySelectorAll('svg'),function(sv){var vb=sv.viewBox&&sv.viewBox.baseVal;
      [].forEach.call(sv.querySelectorAll('text'),function(t){if(/rotate/.test(t.getAttribute('transform')||''))return;var off=0,n=0,fs0=parseFloat(getComputedStyle(t).fontSize)||12,fs=fs0;
        function over(){try{var bb=t.getBBox();bb={x:bb.x+off,y:bb.y,width:bb.width,height:bb.height};if(vb&&vb.width&&(bb.x<vb.x-1||bb.x+bb.width>vb.x+vb.width+1))return true;var b=boxOf(t,bb);return !!b&&(bb.x<b.x-1||bb.x+bb.width>b.x+b.w+1);}catch(e){return false;}}
        try{var b0=t.getBBox();if(vb&&vb.width){var dx=0;if(b0.x<vb.x-1)dx=vb.x-b0.x+2;else if(b0.x+b0.width>vb.x+vb.width+1)dx=vb.x+vb.width-(b0.x+b0.width)-2;if(dx&&Math.abs(dx)<=40){t.setAttribute('transform',(t.getAttribute('transform')||'')+' translate('+dx+' 0)');off=dx;}}}catch(e){}
        while(over()&&n++<14&&fs>fs0*0.72){fs*=0.94;t.style.fontSize=fs+'px';}});});
  }
  function start(){var c=document.getElementById('slidecard');if(!c)return;fit(c);new MutationObserver(function(){fit(c);}).observe(c,{childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
