<!DOCTYPE html>
<html lang="en" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 14 · Codes of conduct, certification and accreditation</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.back{color:var(--accent);border-color:var(--accent)}
nav.main a.dl{display:inline-block;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--accent);text-decoration:none;background:var(--card-bg)}nav.main a.dl:hover{background:var(--chip-bg)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}
/* verdieping (sprong naar een aparte verdiepingsmodule) */
.readmore.deep{border-top:1px dashed var(--line)}
.readmore.deep a.btn{background:var(--btn-bg);color:var(--btn-text)}
.readmore.deep .lbl{font-weight:700;color:var(--accent)}
/* avatar (HeyGen): video in plaats van audio; het tekstpaneel kan inklappen, de avatar blijft zichtbaar */
.avatar-box{position:relative;background:#e9e9e6;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:1/1}
.avatar-box video{width:100%;height:100%;object-fit:cover;display:block}
.avatar-box .avatar-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.transcript.has-avatar.notext .t-body{display:none}
.transcript.has-avatar.notext{max-height:none}
@media (max-width:1099px){
  .transcript.has-avatar .avatar-box{position:fixed;right:12px;bottom:12px;width:150px;z-index:60;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side ul.bul{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px}
@media (max-width:900px){.figure.stack .side ul.bul{grid-template-columns:1fr}}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
/* flipkaarten: s.flip=true -> kaart toont k (+ q) en na een klik de uitleg t (+ sub) */
.cards .cd.flip{cursor:pointer;min-height:clamp(150px,22vw,250px);transition:border-color .15s}.cards .cd.flip:hover,.cards .cd.flip:focus{border-color:var(--accent);outline:none}
.cards .cd.flip .ft,.cards .cd.flip .sub{display:none}.cards .cd.flip .fq{font-style:italic}.cards .cd.flip .fh{margin-top:auto;color:var(--accent);font-weight:700;font-size:clamp(10px,1.05vw,13px)}
.cards .cd.flip.open{background:var(--card-bg);border-color:var(--accent)}.cards .cd.flip.open .ft{display:inline}.cards .cd.flip.open .sub{display:block}.cards .cd.flip.open .fq,.cards .cd.flip.open .fh{display:none}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl a.tlink{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tbl a.tlink:hover{text-decoration-thickness:2px}
.tbl .recchip{display:inline-block;margin-top:4px;font:inherit;font-weight:500;font-size:.82em;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .recchip:hover{background:var(--chain-bg)}
.tbl td:first-child .recchip{display:block;width:max-content}
.tbl-hint{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:8px}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* opname (Vimeo) */
.readmore.rec{border-top:1px dashed var(--line);margin-top:8px}
.readmore.rec .btn{font-variant-numeric:tabular-nums}
.readmore.rec .btn small{font-weight:400;opacity:.8;margin-left:4px}
.rec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-head h1{margin-bottom:4px}
.rec-src{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rec-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.rec-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rec-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.rec-ch{position:relative;max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.rec-ch h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 12px 4px;position:sticky;top:0;background:var(--card-bg)}
.rec-ch button{display:grid;grid-template-columns:58px 1fr;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);background:var(--card-bg)}
.rec-ch button:hover{background:var(--chain-bg)}
.rec-ch button.on{background:var(--chip-bg);color:var(--chip-text)}
.rec-ch button .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.rec-ch button .qp{font-weight:700;color:var(--muted)}
.rec-ch h4.rv{font-size:13px;color:var(--title);background:var(--chain-bg);z-index:1}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}.rec-ch{max-height:none}}
.intro-src{font-size:13px;color:var(--muted);margin:-14px 0 22px;line-height:1.5}

/* profielkeuze */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 18px}
.profiles .qset b{font-size:clamp(16px,1.8vw,21px)}
.profchip{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:999px;vertical-align:middle}
/* meer weten: verwijzingen naar de opname */
.pointers{display:grid;gap:clamp(8px,1.2vw,14px)}
.pointers .pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--chain-bg);border-radius:12px;padding:clamp(10px,1.3vw,16px) clamp(12px,1.6vw,20px)}
.pointers .pt b{color:var(--title);font-size:clamp(13px,1.45vw,17px)}
.pointers .pt span{grid-column:1;font-size:clamp(12px,1.2vw,15px);line-height:1.4}
.pointers .pt .btn{grid-column:2;grid-row:1/span 2;font-variant-numeric:tabular-nums}
.pointers .pt .btn small{font-weight:400;opacity:.85;margin-left:6px}
.pointers .lead{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(6px,1vw,12px)}
@media (max-width:640px){.pointers .pt{grid-template-columns:1fr}.pointers .pt .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.btn .ico{display:inline-flex;align-items:center;font-style:normal}
.actions.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.actions.three .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;white-space:normal;line-height:1.25}
@media (max-width:760px){.actions.three{grid-template-columns:1fr}}
.navtop .controls{margin:0 0 14px}
.dotsrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.dotsrow .dots{margin-top:0}
.dotsrow .btn.mini{padding:6px 14px;font-size:18px;line-height:1.2;flex-shrink:0}
.dotsrow .btn.mini span{font-size:14px;margin-right:6px}
.dotsrow .btn.mini span:empty{display:none}
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.q-ctx{background:var(--chain-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:clamp(13.5px,1.35vw,16px);line-height:1.5;color:var(--text)}
.q-ctx .ctx-k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.fb .fb-key{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95em}
.fb .fb-key b{display:inline;margin-right:4px}
.fb .fb-rec{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .fb-src a.btn{text-decoration:none}
.fb .fb-rec .btn small{font-weight:400;opacity:.85;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* layout-fix v1: niets mag buiten de slidekaart vallen, ook niet in een breed lettertype of met het tekstpaneel open */
#slidecard{container-type:inline-size;container-name:sl}
header.top{flex-wrap:wrap}
nav.main{flex-wrap:wrap}
.chain{grid-auto-columns:minmax(0,1fr)}.timeline{grid-auto-columns:minmax(0,1fr)}
.chain .st,.timeline .st,.cards .cd,.compare .col,.figure .side,.practice>*{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.slide li,.slide td,.slide th,.slide p{overflow-wrap:anywhere}
.slide .readmore a.btn{white-space:normal;max-width:100%;text-align:left;line-height:1.25}
@container sl (max-width:900px){
  .chain,.timeline{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));grid-auto-columns:auto}
  .chain .st:not(:last-child)::after{display:none}
  .timeline::before{display:none}
}
@container sl (max-width:640px){.cards{grid-template-columns:1fr 1fr!important}.tbl{display:block;overflow-x:auto}.tbl td:first-child{width:auto}}
@container sl (max-width:380px){.cards{grid-template-columns:1fr!important}}
.slide h1,.slide h2,.slide h3{overflow-wrap:anywhere;hyphens:auto}
.slide a.btn{white-space:normal;max-width:100%}
.btn{max-width:100%}
@media (max-width:640px){.btn{white-space:normal}}
.optbar,.resume{flex-wrap:wrap}.optbar .btn,.resume .btn{min-width:0;white-space:normal}
/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Module 14", "title": "Codes of conduct, certification and accreditation", "subtitle": "Articles 40 to 43 of the GDPR: the basic concepts, codes of conduct, certification, accreditation and the difference between a real GDPR certificate and a market label", "duration": "± 27 minutes of presentation, 1 think-along exercise and 10 practice questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will be able to do after this module", "goals": ["Explain the basic concepts: standardisation, accreditation, conformity assessment and certification, and the difference between a mark, a seal and a certificate.", "Place codes of conduct (Articles 40 and 41) and certification (Article 42) as instruments for accountability, for transfers and when a fine is set.", "Name the rules on accreditation (Article 43), with the role of BELAC, the Belgian Data Protection Authority and the European Data Protection Board.", "Tell an official GDPR certificate from a commercial privacy label, and know what to check with a supplier."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI support and reviewed by the lecturer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto", "read_label": "Open the GDPR on EUR-Lex", "deep_label": "Deep dive", "deep_btn": "Open the deep dive", "flip_hint": "Click to turn the card over"}, "nav_top": true, "silent": true, "slides": [{"id": 1, "type": "title", "title": "A stamp is not proof: codes of conduct, certification and accreditation", "subtitle": "Articles 40 to 43 of the GDPR: what a code of conduct and a certificate are worth, who may issue them, and how to tell a real GDPR certificate from a market label", "script": "Your organisation is choosing a new software package. The supplier's offer contains three things that are meant to inspire trust. A logo with the words one hundred per cent GDPR compliant. An ISO 27001 certificate. And a Europrivacy certificate for the service itself. Management asks you, the DPO: so is that all right? That depends on what lies behind each of the three: who issued it, on the basis of which rules, and who checks the issuer? Giovanni Buttarelli, who until 2019 was the European Data Protection Supervisor, the supervisory authority for the European institutions, called certification a business card for accountability. In this module you learn to read that business card. First, an overview of what awaits you."}, {"type": "cards", "cols": 3, "numbered": false, "chip": "Overview", "title": "What you learn in this module, in three parts", "cards": [{"k": "Part 1 · Overview", "t": "what a mark, a seal and a certificate are, and the articles on codes of conduct on the one hand and on certification on the other."}, {"k": "Part 2 · Certification", "t": "first common concepts and the principles: standardisation, accreditation, conformity assessment and certification. Then certification under the GDPR: the certificate with its benefits and limits, and who checks the certifier (Articles 42 and 43)."}, {"k": "Part 3 · Codes of conduct", "t": "which an organisation can adhere to (Articles 40 and 41), and what codes of conduct and certificates give you legally."}], "script": "This module has three parts. The first part is an overview: what a mark, a seal and a certificate are, and the articles on codes of conduct on the one hand and on certification on the other. The second part is about certification. First we look at common concepts and the principles: standardisation, accreditation, conformity assessment and certification. Then certification under the GDPR: the certificate an organisation can obtain for a processing operation, with its benefits and its limits, and the question of who checks the certifier. The third part is about codes of conduct, which an organisation can adhere to, and about what codes of conduct and certificates give you legally.", "id": 2, "note": "Allow about 27 minutes, with one think-along exercise and ten practice questions."}, {"id": 3, "type": "cards", "flip": true, "cols": 3, "numbered": false, "chip": "Part 1 · Overview", "title": "Mark, seal or certificate? A certification can lead to one", "cards": [{"k": "Mark", "q": "Who is behind the CE marking on a device?", "t": "A mark is a declaration by the producer itself. With the CE marking, the manufacturer declares that its product meets the European rules. A third party is not necessarily involved.", "sub": "e.g. the CE marking"}, {"k": "Seal", "q": "What does a wax seal on a letter show?", "t": "A seal makes origin and integrity visible: it shows who something comes from and that it has not been tampered with. In the past with wax, today with an electronic seal based on cryptography.", "sub": "e.g. wax seal, electronic seal"}, {"k": "Certificate", "q": "What do you get after a successful audit?", "t": "A certificate is a formal attestation by a third party. It links the result of an assessment to an organisation or a person, for a given period.", "sub": "e.g. attestation by a third party"}], "script": "Have you ever wondered whether you can tell from a product or service that it is GDPR compliant? You have surely seen it: a small icon on a website saying: GDPR compliant. Often these are statements by the company itself, but that does not have to be so: the GDPR does provide a mechanism for this. A certification can lead to a mark, a seal or a certificate, and the GDPR names all three: certification mechanisms, data protection seals and marks. On the slide you see three cards. Click on them to turn them over. A mark is a declaration by the producer itself. The best-known example is the CE marking on a device: the manufacturer declares that its product meets the European rules, and a third party is not necessarily involved. A seal makes origin and integrity visible. It shows who something comes from and that it has not been tampered with. In the past this was done with a wax seal on a letter, today with an electronic seal based on cryptography. And a certificate is a formal attestation by a third party. It links the result of an assessment to an organisation or a person, for a given period.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "how to check a GDPR label: what to look at and how to look it up."}}, {"type": "figure", "layout": "stack", "chip": "Part 1 · Articles 40 to 43", "title": "The four articles: two pairs", "svg": "<svg viewBox=\"0 0 1010 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Articles 40 and 41 belong together, Articles 42 and 43 belong together\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"252\" y=\"42\" text-anchor=\"middle\">PART 2<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"252\" y=\"68\" text-anchor=\"middle\">Certification: certification and accreditation<\/text><rect class=\"cbx2\" x=\"28\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"128.0\" y=\"158.0\" text-anchor=\"middle\">Article 42<\/text><text class=\"b2\" x=\"128.0\" y=\"182.0\" text-anchor=\"middle\">the certificate itself<\/text><rect class=\"cbx2\" x=\"277\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"377.0\" y=\"158.0\" text-anchor=\"middle\">Article 43<\/text><text class=\"b2\" x=\"377.0\" y=\"182.0\" text-anchor=\"middle\">who may certify<\/text><line class=\"bln\" x1=\"232\" y1=\"160\" x2=\"272\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"515\" y=\"10\" width=\"485\" height=\"240\" rx=\"18\"/><text class=\"bh\" style=\"letter-spacing:.03em\" x=\"757\" y=\"42\" text-anchor=\"middle\">PART 3<\/text><text class=\"b1\" style=\"font-size:19px\" x=\"757\" y=\"68\" text-anchor=\"middle\">Codes of conduct<\/text><rect class=\"cbx2\" x=\"533\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"633.0\" y=\"158.0\" text-anchor=\"middle\">Article 40<\/text><text class=\"b2\" x=\"633.0\" y=\"182.0\" text-anchor=\"middle\">the code of conduct itself<\/text><rect class=\"cbx2\" x=\"782\" y=\"98\" width=\"200\" height=\"124\" rx=\"14\"/><text class=\"b1\" x=\"882.0\" y=\"158.0\" text-anchor=\"middle\">Article 41<\/text><text class=\"b2\" x=\"882.0\" y=\"182.0\" text-anchor=\"middle\">monitoring of the code<\/text><line class=\"bln\" x1=\"737\" y1=\"160\" x2=\"777\" y2=\"160\" marker-end=\"url(#cah)\"/><\/svg>", "caption": "Together they form Section 5 of Chapter IV of the GDPR: codes of conduct and certification.", "read": {"text": "Open Articles 40 to 43 of the GDPR.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "Here you see the four articles this module is about, in two pairs. Together they form Section 5 of Chapter IV of the GDPR, under the title codes of conduct and certification. On the left are Articles 42 and 43. Article 42 is about certification: an independent third party certifies a processing operation, voluntarily and for three years at most. Article 43 says who may certify: only bodies that are themselves accredited, in Belgium by BELAC. Together these two form the second part of this module, on certification. On the right are Articles 40 and 41. Article 40 is about codes of conduct: sectors that translate the GDPR into their practice, approved by the supervisory authority. Article 41 provides for the monitoring of those codes, by a body that is itself accredited. Together these two form the third and last part, on codes of conduct. But first the concepts and the principles, because without this vocabulary the articles stay abstract.", "id": 4}, {"id": 5, "type": "figure", "layout": "stack", "chip": "Part 2.1 · Concepts", "title": "From standard to certificate: who does what?", "svg": "<svg viewBox=\"0 0 1010 372\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"From standard to certificate\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accreditation<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certification<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Standardisation<\/text><rect class=\"cbx2\" x=\"14\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"78\" text-anchor=\"middle\">Global ACI<\/text><text class=\"ct2\" x=\"139.0\" y=\"95\" text-anchor=\"middle\">global umbrella body for accreditation<\/text><rect class=\"cbx2\" x=\"14\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"176\" text-anchor=\"middle\">EA<\/text><text class=\"ct2\" x=\"139.0\" y=\"193\" text-anchor=\"middle\">European umbrella body for accreditation<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">Belgium<\/text><line class=\"cln2\" x1=\"139.0\" y1=\"112\" x2=\"139.0\" y2=\"146\" marker-end=\"url(#cah2)\"/><line class=\"cln2\" x1=\"139.0\" y1=\"210\" x2=\"139.0\" y2=\"244\" marker-end=\"url(#cah2)\"/><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Certification body<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">e.g. Brand Compliance, Vinçotte<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Auditor<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">conformity assessment<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Organisation<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">receives the certificate<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accredits<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">appoints<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">assesses<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certifies<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">world<\/text><rect class=\"cbx2\" x=\"746\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"176\" text-anchor=\"middle\">CEN<\/text><text class=\"ct2\" x=\"871.0\" y=\"193\" text-anchor=\"middle\">Europe<\/text><rect class=\"cbx2\" x=\"746\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"274\" text-anchor=\"middle\">NBN<\/text><text class=\"ct2\" x=\"871.0\" y=\"291\" text-anchor=\"middle\">Belgium (Netherlands: NEN)<\/text><line class=\"cln\" x1=\"743\" y1=\"179.0\" x2=\"660\" y2=\"179.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"703.0\" y=\"157.0\" text-anchor=\"middle\">standard =<\/text><text class=\"cl\" x=\"703.0\" y=\"171.0\" text-anchor=\"middle\">yardstick<\/text><text class=\"ct2\" x=\"505.0\" y=\"350\" text-anchor=\"middle\">The positive outcome of the conformity assessment is called certification; the proof of it is the certificate.<\/text><\/svg>", "bullets": [{"k": "Standardisation", "t": "a standardisation body writes the standard: ISO for the world, CEN for Europe, NBN for Belgium."}, {"k": "Accreditation", "t": "the national accreditation body, in Belgium BELAC, confirms that a certification body is competent and independent (Regulation 765/2008)."}, {"k": "Conformity assessment", "t": "an auditor of the certification body assesses the organisation against the standard."}, {"k": "Certification", "t": "the positive outcome of that assessment; the certification body issues the certificate."}], "read": {"text": "Read Article 2, point 10, of Regulation 765/2008 (the definition of accreditation) and see what BELAC does.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32008R0765", "label": "Regulation 765/2008 · accreditation"}, {"url": "https://economie.fgov.be/belac", "label": "BELAC · Belgian accreditation body"}]}, "script": "Four words are constantly used interchangeably, and the diagram puts them in their place. On the right is standardisation. A standardisation body writes the standard, the yardstick: ISO for the world, CEN for Europe, and NBN for Belgium, just as NEN does for the Netherlands. On the left is accreditation. An accreditation body confirms that a certification body is competent and independent. Every Member State has exactly one, as Regulation 765 of 2008 requires. In Belgium that is BELAC. BELAC is itself assessed by its European counterparts within EA, the European co-operation for accreditation, which is part of the global umbrella body, since early 2026 Global ACI, in full the Global Accreditation Cooperation. In the middle is the actual work. The certification body, for example Brand Compliance, Vinçotte or TÜV Nord, appoints an auditor. The auditor carries out the conformity assessment at the organisation: he tests what he sees against the standard. If the outcome is positive, the certification body issues the certificate. That positive outcome is called certification."}, {"type": "figure", "chip": "Part 2.1 · A well-known example", "title": "A well-known example: certification in information security", "svg": "<svg viewBox=\"0 0 700 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A management system as a cycle\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><rect class=\"cgrp\" x=\"10\" y=\"10\" width=\"680\" height=\"380\" rx=\"20\"/><text class=\"bh\" x=\"350\" y=\"50\" text-anchor=\"middle\">A MANAGEMENT SYSTEM<\/text><rect class=\"cbx\" x=\"235\" y=\"160\" width=\"230\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"208.0\" text-anchor=\"middle\">Policy and<\/text><text class=\"b2\" x=\"350.0\" y=\"232.0\" text-anchor=\"middle\">objectives<\/text><rect class=\"cbx2\" x=\"260\" y=\"76\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"112.0\" text-anchor=\"middle\">Plan<\/text><rect class=\"cbx2\" x=\"490\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"575.0\" y=\"208.0\" text-anchor=\"middle\">Do<\/text><rect class=\"cbx2\" x=\"260\" y=\"288\" width=\"180\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"350.0\" y=\"324.0\" text-anchor=\"middle\">Check<\/text><rect class=\"cbx2\" x=\"40\" y=\"172\" width=\"170\" height=\"56\" rx=\"14\"/><text class=\"b1\" x=\"125.0\" y=\"208.0\" text-anchor=\"middle\">Act<\/text><path class=\"bln\" d=\"M445,104 C510,104 570,130 575,166\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M575,234 C570,275 510,316 445,316\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M255,316 C190,316 130,275 125,234\" marker-end=\"url(#cah)\"/><path class=\"bln\" d=\"M125,166 C130,130 190,104 255,104\" marker-end=\"url(#cah)\"/><text class=\"bc\" x=\"350\" y=\"374\" text-anchor=\"middle\">the organisation itself: policy, processes, responsibilities, follow-up<\/text><\/svg>", "bullets": [{"k": "Not the GDPR", "t": "a neighbouring field, where certification has been common for years."}, {"k": "NIS2", "t": "strongly encourages certification and in a way makes it compulsory."}, {"k": "What is certified", "t": "a management system, such as ISO 27001, ISO 9001 and ISO 14001."}], "read": {"text": "See how the Centre for Cybersecurity Belgium organises conformity assessment under NIS2, with ISO 27001 or CyberFundamentals.", "links": [{"url": "https://cyfun.eu/en/cabs/cabs-belgium", "label": "CCB · conformity assessment under NIS2"}]}, "script": "To make these concepts concrete, let us take an example from a field where certification is much better known: information security. So this is not the GDPR, but a neighbouring field. Certifying has been common there for years, and the NIS2 Directive encourages it even more. NIS2 encourages certification much more strongly and in a way also makes it compulsory. In Belgium, essential entities have their conformity assessed, through certification or through inspection, by an accredited and recognised body. In that field, a management system is certified. What is that? You can see it in the drawing. A management system is the whole of policy and objectives, processes, responsibilities and follow-up by which an organisation systematically manages a subject. It runs in a continuous cycle: plan, do, check and act. So it is about the organisation itself, about how it works. You know it from quality, with ISO 9001, and from the environment, with ISO 14001. In information security, the best-known standard is ISO 27001. Now we fill in the diagram from just now with ISO 27001.", "id": 6}, {"type": "figure", "layout": "stack", "chip": "Part 2.1 · The scheme filled in", "title": "The same scheme, now with ISO 27001", "svg": "<svg viewBox=\"0 0 1010 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"The scheme filled in with ISO 27001\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><text class=\"ch\" x=\"139.0\" y=\"28\" text-anchor=\"middle\">Accreditation<\/text><text class=\"ch\" x=\"485.0\" y=\"28\" text-anchor=\"middle\">Certification<\/text><text class=\"ch\" x=\"871.0\" y=\"28\" text-anchor=\"middle\">Standardisation<\/text><rect class=\"cbx\" x=\"14\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"139.0\" y=\"274\" text-anchor=\"middle\">BELAC<\/text><text class=\"ct2\" x=\"139.0\" y=\"291\" text-anchor=\"middle\">accredits for ISO 27001<\/text><rect class=\"cbx\" x=\"360\" y=\"248\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"274\" text-anchor=\"middle\">Brand Compliance<\/text><text class=\"ct2\" x=\"485.0\" y=\"291\" text-anchor=\"middle\">certification body<\/text><rect class=\"cbx2\" x=\"360\" y=\"150\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"176\" text-anchor=\"middle\">Lead auditor<\/text><text class=\"ct2\" x=\"485.0\" y=\"193\" text-anchor=\"middle\">assesses the management system<\/text><rect class=\"cbx\" x=\"360\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"485.0\" y=\"78\" text-anchor=\"middle\">Data Protection Institute<\/text><text class=\"ct2\" x=\"485.0\" y=\"95\" text-anchor=\"middle\">receives the ISO 27001 certificate<\/text><rect class=\"cbx2\" x=\"746\" y=\"52\" width=\"250\" height=\"58\" rx=\"10\"/><text class=\"ct1\" x=\"871.0\" y=\"78\" text-anchor=\"middle\">ISO/IEC 27001<\/text><text class=\"ct2\" x=\"871.0\" y=\"95\" text-anchor=\"middle\">standard for information security<\/text><line class=\"cln\" x1=\"267\" y1=\"277.0\" x2=\"355\" y2=\"277.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"312.0\" y=\"269.0\" text-anchor=\"middle\">accredits<\/text><line class=\"cln\" x1=\"485.0\" y1=\"246\" x2=\"485.0\" y2=\"213\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"232.0\">appoints<\/text><line class=\"cln\" x1=\"485.0\" y1=\"148\" x2=\"485.0\" y2=\"115\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"493.0\" y=\"134.0\">assesses<\/text><path class=\"cln\" d=\"M612,277.0 C662,277.0 662,81.0 616,81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"658\" y=\"234\">certifies<\/text><line class=\"cln\" x1=\"743\" y1=\"81.0\" x2=\"668\" y2=\"81.0\" marker-end=\"url(#cah)\"/><text class=\"cl\" x=\"707.0\" y=\"73.0\" text-anchor=\"middle\">yardstick<\/text><\/svg>", "caption": "Without accreditation, an auditor can also assess, but that does not lead to a recognised certificate.", "bullets": [{"k": "The aim", "t": "the Data Protection Institute wants to be certified."}, {"k": "The standard", "t": "this needs a standard: ISO/IEC 27001."}, {"k": "The body", "t": "Brand Compliance, accredited by BELAC."}, {"k": "The auditor", "t": "a lead auditor assesses the management system; the certificate follows."}], "script": "Here you see the scheme from the start of this part again, now filled in for one concrete case, and limited to what matters. Suppose the Data Protection Institute wants to be certified for information security. What does it need? First a standard to test against. That is ISO 27001, on the far right of the drawing, the yardstick. Then a certification body that may issue the certificate. That is Brand Compliance, and it is accredited by BELAC, the Belgian accreditation body. Brand Compliance then appoints a lead auditor. The lead auditor assesses the institute's management system against the standard. If the outcome is positive, the institute receives the ISO 27001 certificate. Note what that certificate says: something about the organisation's management system, not about every processing of personal data. And notice one more thing, at the bottom of the drawing. The audit itself could also have been carried out without an accredited body, simply by an auditor the institute chooses itself. But that would not have led to a recognised certificate. It is the accreditation by BELAC that gives the certificate its value. We now go through it once more in summary, step by step.", "id": 7}, {"id": 8, "type": "chain", "chip": "Part 2.1 · The concepts in an example", "title": "The Data Protection Institute's ISO 27001 certificate, step by step", "steps": [{"k": "The standard", "t": "ISO/IEC 27001: the requirements for an information security management system."}, {"k": "The accreditation", "t": "BELAC accredits the certification body, here Brand Compliance, for that standard."}, {"k": "The auditor", "t": "Brand Compliance chooses an auditor holding a personal certificate as lead auditor."}, {"k": "The audit", "t": "the auditor assesses the institute's information security management system against the standard."}, {"k": "The certificate", "t": "Brand Compliance issues the ISO 27001 certificate to the institute; a follow-up audit takes place every year."}], "read": {"text": "Look up a certification body in BELAC's list of accredited bodies and see for which standards the accreditation applies.", "links": [{"url": "https://economie.fgov.be/belac", "label": "BELAC · accredited bodies"}]}, "script": "We go through this once more in summary, step by step. One: the standard. ISO 27001 describes the requirements for an information security management system. Two: the accreditation. BELAC accredits Brand Compliance to issue certificates for that standard. Three: the auditor. Brand Compliance chooses a lead auditor, who holds a personal certificate as proof of competence. Four: the audit, the conformity assessment. The auditor assesses the Data Protection Institute's management system against the standard. Five: the certificate. If the outcome is positive, Brand Compliance issues the ISO 27001 certificate, and a follow-up audit takes place every year. Here you see two different certificates: the auditor's personal certificate says something about a person, the ISO 27001 certificate says something about the organisation. There is also a standard that adds privacy to such a management system. You see it on the next slide."}, {"type": "figure", "layout": "stack", "chip": "Part 2.1 · ISO 27701 and the PIMS", "title": "ISO 27701: a PIMS, but not a GDPR certificate", "svg": "<svg viewBox=\"0 0 1010 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A PIMS is ISO 27001 with a privacy layer from ISO 27701\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><style>.cgrp{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.cgrp2{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:7 5}.fig text.cgh,text.cgh{font-size:15px;font-weight:700;fill:var(--accent);letter-spacing:.04em}.fig text.cgh2,text.cgh2{font-size:15px;font-weight:700;fill:var(--text);letter-spacing:.04em}.cbig{fill:var(--card-bg);stroke:var(--accent);stroke-width:3}.cno{stroke:var(--bad);stroke-width:5;stroke-linecap:round}.fig text.cbt,text.cbt{font-size:15px;font-weight:700;fill:var(--text)}.fig text.cbs,text.cbs{font-size:12px;fill:var(--muted)}<\/style><style>.fig text.b1,text.b1{font-size:22px;font-weight:700;fill:var(--text)}.fig text.b2,text.b2{font-size:15px;fill:var(--muted)}.fig text.bh,text.bh{font-size:19px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.bc,text.bc{font-size:16px;fill:var(--muted)}.bln{stroke:var(--accent);stroke-width:3;fill:none}<\/style><text class=\"ch\" x=\"320\" y=\"28\" text-anchor=\"middle\">Two layers, one management system<\/text><rect class=\"cbx\" x=\"30\" y=\"50\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"98.0\" text-anchor=\"middle\">Privacy requirements<\/text><text class=\"b2\" x=\"320.0\" y=\"122.0\" text-anchor=\"middle\">for controllers and processors · ISO 27701<\/text><rect class=\"cbx2\" x=\"30\" y=\"170\" width=\"580\" height=\"100\" rx=\"14\"/><text class=\"b1\" x=\"320.0\" y=\"218.0\" text-anchor=\"middle\">Information security<\/text><text class=\"b2\" x=\"320.0\" y=\"242.0\" text-anchor=\"middle\">the management system of ISO 27001 (ISMS)<\/text><path class=\"bln\" d=\"M630,55 C660,55 660,265 630,265\"/><line class=\"bln\" x1=\"660\" y1=\"160\" x2=\"700\" y2=\"160\" marker-end=\"url(#cah)\"/><rect class=\"cgrp\" x=\"710\" y=\"80\" width=\"280\" height=\"160\" rx=\"18\"/><text class=\"b1\" style=\"font-size:34px;fill:var(--accent)\" x=\"850\" y=\"150\" text-anchor=\"middle\">PIMS<\/text><text class=\"b2\" x=\"850\" y=\"180\" text-anchor=\"middle\">Privacy Information<\/text><text class=\"b2\" x=\"850\" y=\"202\" text-anchor=\"middle\">Management System<\/text><text class=\"bc\" x=\"320\" y=\"302\" text-anchor=\"middle\">policy, processes, responsibilities and follow-up, for privacy too<\/text><\/svg>", "bullets": [{"k": "A PIMS", "t": "ISO 27001 plus a privacy layer: one management system for information and privacy."}, {"k": "What it delivers", "t": "an organisation shows that it handles the GDPR rules carefully: it has, for example, a privacy policy and a record."}, {"k": "What it is not", "t": "a GDPR certificate: normative, but not provided for in the GDPR."}], "caption": "An ISO 27701 certificate must never be presented as a GDPR certificate.", "read": {"text": "Look at the ISO/IEC 27701 standard on the ISO website.", "links": [{"url": "https://www.iso.org/standard/27701", "label": "ISO · ISO/IEC 27701"}]}, "script": "The standard that adds privacy to ISO 27001 is ISO 27701. It describes a PIMS, a Privacy Information Management System. Look at the drawing. At the bottom is the information security management system of ISO 27001. ISO 27701 adds a layer on top, with requirements specific to privacy, for those who process personal data as a controller and for those who do so as a processor. Together these two layers form one management system: the PIMS. The organisation then manages not only the security of its information, but also the way it handles personal data, with policy, processes, responsibilities and follow-up, in the same cycle of plan, do, check and act. That delivers something. A company with such a certificate can show that it handles the GDPR rules carefully: it has, for example, a privacy policy, a record of processing activities, and so on. But it is not a GDPR certificate. It is a standard against which you assess, so normative. The GDPR itself does not provide for the certification of a management system.", "id": 9}, {"type": "cards", "cols": 3, "numbered": true, "chip": "Part 2.1 · What the GDPR can certify", "title": "What can be certified? Article 42 and recital 100", "cards": [{"k": "Certain processing operations of organisations", "t": "a controller or processor has its processing activities certified, to demonstrate that it complies with the GDPR."}, {"k": "Certain products and services", "t": "recital 100: data subjects can quickly assess the level of data protection of relevant products and services."}, {"k": "Certain transfers to third countries", "t": "organisations outside the GDPR can also use an approved mechanism as an appropriate safeguard for transfers."}], "note": "What is certified is always a delimited processing operation, with its personal data, technical systems and processes: never the organisation as a whole, and never a person, such as a DPO.", "read": {"text": "Read Article 42(1), (2) and (7), recital 100, and the European Data Protection Board's Guidelines 1/2018 on certification.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_en.pdf", "label": "EDPB · Guidelines 1/2018 certification"}]}, "script": "If a management system cannot be the object of GDPR certification, what can? Article 42 and recital 100 give three answers. One: certain processing operations of organisations. A controller or a processor has its processing activities certified, to demonstrate that it complies with the GDPR. Such a processing operation always has three components: the personal data, the technical systems, and the processes and procedures around them. Two: certain products and services. Recital 100 wants data subjects to be able to quickly assess the level of data protection of relevant products and services. Three: certain transfers to third countries. Organisations outside the European Union, which are not subject to the GDPR, can also use an approved mechanism as an appropriate safeguard. In all three cases it concerns a delimited processing operation, never the organisation as a whole, and never a person, such as a DPO. What that means in practice, you see in an example.", "id": 10}, {"type": "compare", "chip": "Part 2.1 · An example", "title": "A well-known example: payroll administration", "left": {"head": "A product", "items": ["A payroll package or HR service in which employee data are processed; the supplier has it certified", "Object: the processing in that package: the data, the software and the management processes around it", "The certificate says something about this processing in this product, not about the whole supplier"]}, "right": {"head": "A process", "items": ["The payroll processing itself, from employee data to payslip and payment; an employer or payroll office has it certified", "Object: the set of processing operations, with the procedures and complaint handling that go with it", "The certificate says something about this delimited processing, not about the whole organisation"]}, "note": "The European Data Protection Board itself uses this example: the processing of employee data for payroll or leave management is a set of processing operations that can be certified.", "read": {"text": "Read the payroll example in the European Data Protection Board's Guidelines 1/2018 on certification.", "links": [{"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_en.pdf", "label": "EDPB · Guidelines 1/2018 certification"}]}, "script": "A well-known example makes this concrete: payroll administration. The European Data Protection Board uses it itself. The processing of employee data for payroll or leave management is a set of processing operations, and you can certify it. On the left you see the product. Think of a payroll package or an HR service in which employee data are processed. The object is the processing in that package: the data, the software and the management processes around it. The supplier has it certified, so that its customers can use the certificate as an element of proof. The certificate says something about this processing in this product, not about the whole supplier. On the right you see the process: the payroll processing itself, from employee data to payslip and payment, with the procedures and complaint handling that go with it. An employer or a payroll office has it certified. Here too, the certificate says something about the delimited processing, not about the whole organisation. In both cases the object is therefore a processing operation. That is how you tell a GDPR certificate from the ISO certificate for a management system that you saw just now. That covers the concepts and the principles. Now the second piece of certification: certification under the GDPR.", "id": 11}, {"type": "compare", "chip": "Part 2.2 · The framework", "title": "Articles 42 and 43: the principles", "left": {"head": "Article 42 · The certificate", "items": ["Voluntary and transparent", "An independent third party issues it, on the basis of approved criteria", "Valid for three years at most, renewable and withdrawable", "Your own responsibility remains"]}, "right": {"head": "Article 43 · The certification bodies", "items": ["Only a competent body that is itself accredited", "Accreditation by the supervisory authority, the national accreditation body or both, five years at most", "The body remains responsible and reports issuing and withdrawal", "The requirements and criteria are public"]}, "read": {"text": "Read Article 42 and Article 43 of the GDPR.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "Certification under the GDPR is governed by two articles, and you see their principles on the slide. Article 42 is about the certificate. Certification is voluntary and transparent. An independent third party issues the certificate, on the basis of criteria approved in advance. It is valid for three years at most, and can be renewed or withdrawn. And your own responsibility remains. Article 43 is about who may certify. Only a competent body that is itself accredited, by the supervisory authority, by the national accreditation body or by both, for five years at most. The body remains responsible for its assessment and tells the supervisory authority when it issues or withdraws a certificate. And the requirements and criteria are public. We now look at those two articles in that order: first the certificate, then the accreditation.", "id": 12}, {"id": 13, "type": "bullets", "chip": "Part 2.2 · The certificate", "title": "Certification in the GDPR: voluntary, by a third party, and al
