ways about a processing operation", "bullets": [{"k": "Voluntary and transparent", "t": "nobody is obliged; the process is accessible and transparent (Article 42(3))."}, {"k": "By an independent third party", "t": "an accredited certification body or the supervisory authority itself issues the certificate (Article 42(5)); not a self-declaration, as with the former Privacy Shield."}, {"k": "What is certified?", "t": "processing operations of a controller or a processor; a product or service can be the object insofar as a processing operation takes place with it; a management system as such or a person, such as a DPO, does not fall under Article 42."}, {"k": "On the basis of approved criteria", "t": "approved by the supervisory authority, or by the European Data Protection Board: the certificate is then called the European Data Protection Seal."}, {"k": "Three years at most", "t": "renewable under the same conditions, and withdrawn as soon as the requirements are no longer met (Article 42(7))."}], "read": {"text": "Read Article 42(1) to (7), and the European Data Protection Board's Guidelines 1/2018 on certification (paragraphs 50 to 58: what can be the object of certification).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201801_v3.0_certificationcriteria_annex2_en.pdf", "label": "EDPB · Guidelines 1/2018 certification"}]}, "script": "First the certificate. An organisation can obtain a GDPR certificate for a particular processing operation; that is what Article 42 provides. Five characteristics. One: certification is voluntary, and the process is accessible and transparent. Nobody is obliged. Two: the certificate comes from an independent third party, an accredited certification body or the supervisory authority itself. That is different from a self-declaration, as with the former Privacy Shield. Three, and this is where it often goes wrong: what is certified? Think back to the difference you saw: with ISO 27001 and ISO 27701, a management system of the organisation, with the GDPR, a processing operation. Article 42 speaks of processing operations by a controller or a processor. A product or a service can be the object, insofar as a processing of personal data takes place with it. But a management system as such, or a person such as a DPO, does not fall under Article 42. Four: the assessment is based on criteria approved in advance, by the supervisory authority or by the European Data Protection Board. In the latter case the certificate is called the European Data Protection Seal, and it applies throughout the Union. Five: a certificate is valid for three years at most. It can be renewed, and it is withdrawn as soon as the requirements are no longer met."}, {"id": 14, "type": "figure", "chip": "Part 2.2 · A myth", "title": "One hundred per cent GDPR compliant does not exist", "svg": "<svg viewBox=\"0 0 520 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Stamp 100 % GDPR compliant, crossed out\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><g transform=\"rotate(-8 260 125)\"><rect class=\"cst\" x=\"70\" y=\"55\" width=\"380\" height=\"140\" rx=\"18\"/><rect class=\"cst\" x=\"84\" y=\"69\" width=\"352\" height=\"112\" rx=\"10\" style=\"stroke-width:2\"/><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"118\" text-anchor=\"middle\">100 %<\/text><text class=\"cstt\" style=\"font-size:34px\" x=\"260\" y=\"160\" text-anchor=\"middle\">GDPR COMPLIANT<\/text><\/g><line class=\"cbad\" x1=\"60\" y1=\"30\" x2=\"460\" y2=\"220\"/><line class=\"cbad\" x1=\"460\" y1=\"30\" x2=\"60\" y2=\"220\"/><\/svg>", "caption": "Article 42(4) GDPR: A certification pursuant to this Article does not reduce the responsibility of the controller or the processor for compliance with this Regulation and is without prejudice to the tasks and powers of the supervisory authorities which are competent pursuant to Article 55 or 56.", "bullets": [{"k": "A snapshot", "t": "the certificate says something about the day of the audit and about the delimited object, not about everything the organisation does."}, {"k": "No legal certainty", "t": "a court or the supervisory authority can still find an infringement."}, {"k": "Your obligations remain", "t": "the certification does not reduce your responsibility to comply with the GDPR."}, {"k": "Not less supervision", "t": "the tasks and powers of the Belgian DPA remain unaffected; the Belgian DPA can even have a certificate withdrawn."}], "read": {"text": "Read Article 42(4) and Article 58(2)(h) (the power to withdraw a certification or order it to be withdrawn).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "And now the stamp from the offer: one hundred per cent GDPR compliant. On the slide it has a red cross through it, and that cross is there for a reason. A certificate is a snapshot: it says something about the day of the audit and about the delimited object, not about everything the organisation does. It also gives no legal certainty, because a court or the supervisory authority can still find an infringement. And the law says so itself. Read Article 42(4) below the drawing: a certification does not reduce the responsibility of the controller or the processor for compliance with the Regulation, and is without prejudice to the tasks and powers of the supervisory authorities. So your obligations remain in full, and there is not less supervision: the Belgian DPA can even have a certificate withdrawn. So remember: a certificate helps you demonstrate, it does not take over your responsibility."}, {"id": 15, "type": "compare", "chip": "Part 2.2 · The trade-off", "title": "Getting a certificate: what do you gain, and what does it cost?", "left": {"head": "Benefits", "items": ["Trust from customers, data subjects and the supervisory authority: you show, you do not claim", "Evidence for data protection by design and by default (Article 25(3))", "Choosing processors becomes easier: a certificate is an element to demonstrate sufficient guarantees (Article 28(5) and Article 32(3))", "A possible appropriate safeguard for transfers outside the EEA (Article 42(2) and Article 46(2)(f))", "The preparation forces order: delimiting, documenting, improving"]}, "right": {"head": "Drawbacks", "items": ["Costs: preparation, the audit itself, annual follow-up and recertification after three years at most", "Extra formal supervision: the certification body looks over your shoulder and reports issuing and withdrawal to the supervisory authority", "A narrow object: only the delimited processing is certified, not the whole organisation", "A withdrawn certificate is visible and damages the trust you wanted to win"]}, "read": {"text": "Read Article 25(3), Article 28(5) and Article 42(2); the European Data Protection Board's Guidelines 07/2022 treat certification as a tool for transfers.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/system/files/documents/2023-02/edpb_guidelines_07-2022_on_certification_as_a_tool_for_transfers_v2_en_0.pdf", "label": "EDPB · Guidelines 07/2022 transfers"}]}, "script": "Is it worth getting a certificate? First the benefits. A certificate inspires trust among customers, data subjects and the supervisory authority, because you show something instead of just claiming it. It is an element of evidence for data protection by design and by default. It makes choosing processors easier: a certificate is an element to demonstrate sufficient guarantees. It can be an appropriate safeguard for transfers outside the European Economic Area. And the preparation forces order: delimiting, documenting, improving. Then the drawbacks. The costs: the preparation, the audit, the annual follow-up and the recertification after three years at most. The extra formal supervision: the certification body looks over your shoulder and reports issuing and withdrawal to the supervisory authority. The narrow object: only the delimited processing is certified, not the whole organisation. And a withdrawn certificate is visible, and damages the trust you wanted to win."}, {"id": 16, "type": "figure", "layout": "stack", "chip": "Part 2.2 · Accreditation", "title": "Who checks the certifier? Accreditation in Article 43", "svg": "<svg viewBox=\"0 0 940 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Accreditation five years, certificate three years\"><style>.cbx{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbx2{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig text.ch,text.ch{font-size:13px;font-weight:700;fill:var(--accent);letter-spacing:.06em;text-transform:uppercase}.fig text.ct1,text.ct1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.ct2,text.ct2{font-size:11px;fill:var(--muted)}.fig text.cl,text.cl{font-size:12px;font-weight:700;fill:var(--accent)}.cln{stroke:var(--accent);stroke-width:2.2;fill:none}.cln2{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:5 4}.cbad{stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.85}.cst{fill:none;stroke:var(--muted);stroke-width:5}.fig text.cstt,text.cstt{font-size:30px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.cbar{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2}.cbar2{fill:var(--accent)}.cax{stroke:var(--muted);stroke-width:1.5}.fig text.ctw,text.ctw{font-size:13px;font-weight:700;fill:#fff}<\/style><defs><marker id=\"cah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"cah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><\/defs><line class=\"cax\" x1=\"250\" y1=\"200\" x2=\"900\" y2=\"200\"/><line class=\"cax\" x1=\"250.0\" y1=\"194\" x2=\"250.0\" y2=\"206\"/><text class=\"ct2\" x=\"250.0\" y=\"224\" text-anchor=\"middle\">start<\/text><line class=\"cax\" x1=\"380.0\" y1=\"194\" x2=\"380.0\" y2=\"206\"/><text class=\"ct2\" x=\"380.0\" y=\"224\" text-anchor=\"middle\">year 1<\/text><line class=\"cax\" x1=\"510.0\" y1=\"194\" x2=\"510.0\" y2=\"206\"/><text class=\"ct2\" x=\"510.0\" y=\"224\" text-anchor=\"middle\">year 2<\/text><line class=\"cax\" x1=\"640.0\" y1=\"194\" x2=\"640.0\" y2=\"206\"/><text class=\"ct2\" x=\"640.0\" y=\"224\" text-anchor=\"middle\">year 3<\/text><line class=\"cax\" x1=\"770.0\" y1=\"194\" x2=\"770.0\" y2=\"206\"/><text class=\"ct2\" x=\"770.0\" y=\"224\" text-anchor=\"middle\">year 4<\/text><line class=\"cax\" x1=\"900.0\" y1=\"194\" x2=\"900.0\" y2=\"206\"/><text class=\"ct2\" x=\"900.0\" y=\"224\" text-anchor=\"middle\">year 5<\/text><text class=\"ct1\" x=\"12\" y=\"62\">Accreditation<\/text><text class=\"ct2\" x=\"12\" y=\"79\">BELAC → certification body<\/text><text class=\"ct2\" x=\"12\" y=\"94\">Article 43(4)<\/text><rect class=\"cbar2\" x=\"250\" y=\"48\" width=\"650.0\" height=\"42\" rx=\"8\"/><text class=\"ctw\" style=\"fill:#fff\" x=\"575.0\" y=\"74\" text-anchor=\"middle\">five years at most, renewable<\/text><text class=\"ct1\" x=\"12\" y=\"140\">Certificate<\/text><text class=\"ct2\" x=\"12\" y=\"157\">certification body → organisation<\/text><text class=\"ct2\" x=\"12\" y=\"172\">Article 42(7)<\/text><rect class=\"cbar\" x=\"250\" y=\"126\" width=\"390.0\" height=\"42\" rx=\"8\"/><text class=\"ct1\" x=\"445.0\" y=\"152\" text-anchor=\"middle\">three years at most, renewable<\/text><line class=\"cln2\" x1=\"380.0\" y1=\"120\" x2=\"380.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><line class=\"cln2\" x1=\"510.0\" y1=\"120\" x2=\"510.0\" y2=\"174\" style=\"stroke:var(--accent)\"/><text class=\"cl\" x=\"654.0\" y=\"144\">surveillance: at least<\/text><text class=\"cl\" x=\"654.0\" y=\"160\">every 12 months (Belgian DPA)<\/text><\/svg>", "bullets": [{"k": "Who accredits?", "t": "the Member State chooses: the supervisory authority, the national accreditation body under the ISO 17065 standard with additional requirements from the supervisory authority, or both (Article 43(1))."}, {"k": "Belgium", "t": "BELAC accredits, under ISO 17065 and the additional requirements of the Belgian DPA (Article 18 of the Act of 30 July 2018; Belgian DPA decision 02/2026 of 2 June 2026)."}, {"k": "Conditions", "t": "the certification body must meet the conditions set out in Article 43(2)."}, {"k": "Five versus three years", "t": "the accreditation is valid for five years at most, a certificate for three years at most."}, {"k": "Duty to report", "t": "the certification body informs the supervisory authority of the reasons for issuing or withdrawing a certificate (Article 43(5))."}, {"k": "Public register", "t": "the European Data Protection Board keeps a public register of all certification mechanisms, seals and marks (Article 42(8))."}], "read": {"text": "Read Article 43(1), (2), (4) and (5), Article 18 of the Act of 30 July 2018, and the Belgian DPA's additional accreditation requirements.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.ejustice.just.fgov.be/eli/wet/2018/07/30/2018040581/justel", "label": "Act of 30 July 2018 · Article 18 (Justel, Dutch)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/decision-n0-02-2026-of-2-june-2026.pdf", "label": "Belgian DPA 02/2026 · additional accreditation requirements"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_en", "label": "EDPB · register of certifications"}]}, "script": "Now the second half of certification under the GDPR: accreditation. Who checks the certifier? A certification body may only issue GDPR certificates if it is itself accredited. That is what Article 43 provides. Who accredits? The Member State chooses: the supervisory authority itself, the national accreditation body, or both. The accreditation body then works according to the ISO 17065 standard and with the additional requirements of the supervisory authority. Belgium chose that route. Article 18 of the Act of 30 July 2018 says that BELAC accredits the certification bodies, and the Belgian DPA laid down its additional requirements in a decision of 2 June 2026. Article 43 also sets conditions that the certification body must meet. Then look at the timeline. The accreditation is valid for five years at most. A certificate is valid for three years at most, with, under the Belgian DPA's requirements, intermediate surveillance at least every twelve months. The certification body informs the supervisory authority why it issues or withdraws a certificate. And everything approved goes into a public register of the European Data Protection Board."}, {"id": 17, "type": "table", "chip": "Part 2.2 · Practice in Europe", "title": "Real GDPR certificate or market label? The register decides", "head": ["Name", "What is it?", "Article 42 certificate?"], "rows": [["Europrivacy", "scheme from Luxembourg; first European Data Protection Seal (Board opinion 28/2022, October 2022); extended in April 2026 to a tool for transfers", "yes, European seal"], ["EuroPriSe", "originated at the Schleswig-Holstein supervisory authority; the scheme for processors has been in the register since 2024 as a European seal", "yes, European seal (processors)"], ["BC 5701", "scheme of Brand Compliance, approved in the Netherlands; in the register since 2025 as a European seal", "yes, European seal"], ["GDPR-CARPA", "scheme of the Luxembourg supervisory authority itself, with national criteria", "yes, national (Luxembourg)"], ["ISO/IEC 27701 and ISO/IEC 27001", "international standards for a management system; show good governance", "no: a management system"], ["ISDP©10003 and ePrivacyseal", "privacy schemes from the market; not in the Board's register", "no: market label"], ["DPO certificate", "certification of a person", "no: Article 42 is about processing operations"]], "hl": [0, 1, 2, 3], "read": {"text": "Open the European Data Protection Board's register and look up a scheme; in November 2026 it has seventeen entries, none with Belgian criteria.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_en", "label": "EDPB · register of certifications"}, {"url": "https://www.edpb.europa.eu/system/files/documents/2022-10/edpb_opinion_202228_approval_of_europrivacy_certification_criteria_as_eu_data_protection_seal_en.pdf", "label": "EDPB 28/2022 · Europrivacy"}, {"url": "https://www.edpb.europa.eu/system/files/2026-04/edpb_opinion_202615_europrivacy_en.pdf", "label": "EDPB 15/2026 · Europrivacy transfers"}]}, "script": "What does that look like in Europe today? Not every privacy logo on a website is a GDPR certificate. The test is simple: is the scheme in the register of the European Data Protection Board? The table lists seven names. The first four are real Article 42 certificates. Europrivacy, a scheme from Luxembourg, became the first European Data Protection Seal in October 2022, and was extended in April 2026 to a tool for transfers. EuroPriSe originated at the supervisory authority of Schleswig-Holstein; the scheme for processors has been in the register since 2024 as a European seal. BC 5701, the scheme of Brand Compliance, was first approved in the Netherlands and has been in the register since 2025 as a European seal. And GDPR-CARPA is a scheme of the Luxembourg supervisory authority itself, with national criteria. Certification is one tool. There is a second one, which an organisation can also use: the code of conduct. That is the third and last part.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "checking a GDPR label step by step: what to look at and how to look it up."}}, {"type": "compare", "chip": "Part 3 · The framework", "title": "Articles 40 and 41: the principles", "left": {"head": "Article 40 · The code of conduct", "items": ["A sector drafts the code, through an association or body that represents it", "The supervisory authority approves; for several Member States, first an opinion of the Board", "The code contains mechanisms for mandatory monitoring", "Organisations outside the GDPR can also adhere, as a safeguard for transfers"]}, "right": {"head": "Article 41 · The monitoring", "items": ["An accredited body monitors compliance", "The body is independent and competent, without conflict of interest, with a complaints procedure", "In case of an infringement, measures follow, up to suspension or exclusion", "Does not apply to public authorities and bodies"]}, "read": {"text": "Read Article 40 and Article 41 of the GDPR.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "The third and last part is about codes of conduct, which an organisation can adhere to. Two articles govern them, and you see their principles on the slide. Article 40 is about the code itself. A sector drafts it, through an association or another body that represents that sector. The supervisory authority approves it, and for a code covering several Member States, the European Data Protection Board first gives an opinion. The code contains mechanisms for mandatory monitoring. And organisations outside the GDPR can also adhere, as a safeguard for transfers. Article 41 is about monitoring the code. An accredited body monitors compliance. It is independent and competent, has no conflict of interest and has a complaints procedure. In case of an infringement, it takes measures, up to suspension or exclusion of the organisation. This does not apply to public authorities and bodies. What that looks like in practice, you see on the next slide.", "id": 18}, {"id": 19, "type": "cards", "cols": 3, "numbered": false, "chip": "Part 3 · Codes of conduct", "title": "The code of conduct: a sector translates the GDPR, and an organisation can adhere", "cards": [{"k": "Who drafts?", "t": "associations and other bodies representing categories of controllers or processors: a federation, an umbrella organisation, a professional body (Article 40(2))."}, {"k": "Who approves?", "t": "the supervisory authority, in Belgium the Belgian DPA; for a code covering several Member States, first an opinion of the European Data Protection Board (Article 40(5) and (7))."}, {"k": "Who monitors?", "t": "a competent and independent body accredited by the Belgian DPA (Article 41); this rule does not apply to public authorities and bodies (Article 41(6))."}, {"k": "Adhering", "t": "an organisation from the sector can adhere if an approved code exists for its sector; it commits to the rules of the code and accepts the monitoring."}, {"k": "Belgium · notaries", "t": "the code of conduct of the National Chamber of Notaries, the first national code (Belgian DPA decision 04/2021 of 8 April 2021); the National Chamber monitors it itself, because notaries are public officers.", "hl": true}, {"k": "Europe · cloud", "t": "the EU Cloud Code of Conduct for cloud processors, approved by the Belgian DPA on 20 May 2021 after an opinion of the Board; SCOPE Europe is the accredited monitoring body.", "hl": true}], "read": {"text": "Read Article 40(1), (2) and (5), and Article 41(1), (2) and (6). See the Belgian DPA's page on codes of conduct and the two approved codes.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-nr.-04-2021-van-8-april-2021.pdf", "label": "Belgian DPA 04/2021 · notaries' code (Dutch)"}, {"url": "https://www.dataprotectionauthority.be/the-be-dpa-approves-its-first-european-code-of-conduct", "label": "Belgian DPA · EU Cloud Code of Conduct (20 May 2021)"}, {"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/codes-of-conduct_en", "label": "EDPB · register of codes of conduct"}]}, "script": "What does that mean in practice? A code of conduct is a set of rules by which a sector translates the GDPR into its own practice, and which an organisation from that sector can adhere to. Who drafts a code? Not an individual company, but an association or another body that represents a category of controllers or processors, such as a federation or a professional body. Who approves? The supervisory authority, in Belgium the Belgian DPA. If the code applies in several Member States, the European Data Protection Board first gives an opinion. Who monitors the members? A competent and independent body accredited by the Belgian DPA. An organisation can only adhere if an approved code exists for its sector. It then commits to the rules of the code, and it accepts the monitoring. Two concrete codes. In Belgium, on 8 April 2021 the Belgian DPA approved the code of conduct of the National Chamber of Notaries, the first national code. Because notaries are public officers, the National Chamber monitors it itself. At European level, on 20 May 2021 the Belgian DPA approved the EU Cloud Code of Conduct, a code for cloud processors, with SCOPE Europe as the accredited monitoring body."}, {"id": 20, "type": "quote", "chip": "Part 3 · Why adhere?", "title": "What a code of conduct or a certificate gives you legally", "source": "Article 24(3) GDPR", "quote": "Adherence to approved codes of conduct as referred to in Article 40 or approved certification mechanisms as referred to in Article 42 may be used as an element by which to demonstrate compliance with the obligations of the controller.", "bullets": [{"k": "Evidence for accountability", "t": "an element to demonstrate that you meet your obligations; the same goes for a processor's guarantees (Article 28(5)), for security (Article 32(3)) and for data protection by design (Article 25(3), certification only)."}, {"k": "Fines", "t": "when deciding whether to impose a fine and how high it is, the Belgian DPA gives due regard to adherence to an approved code of conduct or certification (Article 83(2)(j))."}, {"k": "Transfers", "t": "an approved code of conduct or certification, together with binding and enforceable commitments of the recipient in the third country, is an appropriate safeguard (Article 46(2)(e) and (f))."}, {"k": "Not a free pass", "t": "it is an element of evidence, not a presumption of compliance: whoever signs a code and does not comply with it stands weaker, not stronger."}], "read": {"text": "Read Article 24(3), Article 28(5), Article 32(3), Article 83(2)(j), and Article 46(2)(e) and (f).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "Why would an organisation adhere to a code of conduct or obtain a certificate? Because the GDPR attaches a consequence to it in three places. First evidence. Read Article 24(3) on the slide: adherence to approved codes of conduct or approved certification mechanisms may be used as an element by which to demonstrate compliance with the obligations of the controller. That is accountability in practice. Then fines. Under Article 83(2), the supervisory authority gives due regard to it when deciding whether to impose a fine and how high it is. And transfers outside the European Economic Area: an approved code of conduct or certification can be an appropriate safeguard. But note the word in the legal text: an element. It is not a free pass and not a presumption of compliance. Whoever signs a code and then does not comply with it stands weaker with the supervisory authority, not stronger. Time to apply this yourself, with a think-along exercise."}, {"id": 21, "type": "reveal", "chip": "Think-along exercise", "title": "Back to the offer: what are the three items worth?", "question": "The supplier submits three items. One: a logo with the words one hundred per cent GDPR compliant, without further explanation. Two: an ISO 27001 certificate from an accredited certification body. Three: a Europrivacy certificate for the service you want to buy. What is each item worth to you as a DPO, and what do you check?", "verdict": "The logo is a self-declaration and proves nothing; ISO 27001 says something about security, not about the GDPR; only the Europrivacy certificate is an Article 42 certificate, if the object is right and it is still valid", "answer": [{"k": "The logo", "t": "a mark of the supplier itself; nobody has tested it, and one hundred per cent compliance is excluded by Article 42(4) itself. Ask what lies behind it."}, {"k": "ISO 27001", "t": "a real certificate from a third party, about the information security management system; a useful element for security (Article 32), not a GDPR certificate. Check the scope and the accreditation."}, {"k": "Europrivacy", "t": "a European Data Protection Seal: an element to demonstrate sufficient guarantees (Article 28(5)). Check that the object covers your service, who issued it, and whether it is still valid."}, {"k": "And then", "t": "your own obligations remain: the processing agreement, your own assessment of the risks and the follow-up of the processor."}], "read": {"text": "Look up the scheme in the European Data Protection Board's register and ask the supplier for the certificate itself, with its scope and expiry date.", "links": [{"url": "https://www.edpb.europa.eu/registers/register-of-consistency-and-of-accountability-tools/certification-mechanisms-and-data_en", "label": "EDPB · register of certifications"}, {"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "Time to do it yourself. Back to the offer from the beginning. The supplier submits three items. One: a logo with the words one hundred per cent GDPR compliant, without further explanation. Two: an ISO 27001 certificate from an accredited certification body. Three: a Europrivacy certificate for the service you want to buy. What is each item worth to you as a DPO, and what do you check? Pause the audio for a moment and think about it. … The logo is a mark of the supplier itself. Nobody has tested it, and one hundred per cent compliance is excluded by the law itself. So it proves nothing; ask what lies behind it. The ISO 27001 certificate is a real certificate from a third party, but it is about the information security management system. It is a useful element for security, not a GDPR certificate. Check the scope: does it cover the service you are buying? The Europrivacy certificate is the only Article 42 certificate of the three. It is an element to demonstrate that the processor provides sufficient guarantees. Check that the object covers your service, who issued it, and whether it is still valid. And then your own obligations remain: the processing agreement, your own assessment of the risks and the follow-up of the processor."}, {"id": 22, "type": "summary", "chip": "Summary", "title": "What you take away", "key": "The standard says what you must meet, the certification body assesses, and the accreditation body checks the certifier; a code of conduct and a certificate are elements of evidence for accountability, count when a fine is set and can be a safeguard for transfers, but never take over your responsibility; in Belgium BELAC accredits with the requirements of the Belgian DPA; and whether a label is a real GDPR certificate, you read in the register of the European Data Protection Board.", "bullets": [{"k": "Concepts", "t": "standardisation, accreditation, conformity assessment, certification; mark (the producer itself), seal (origin and integrity), certificate (attestation by a third party)."}, {"k": "Do not confuse", "t": "ISO 27001 and ISO 27701 certify a management system; they are useful, but not a GDPR certificate."}, {"k": "Certification", "t": "voluntary, by a third party, about a processing operation, three years at most; one hundred per cent GDPR compliant does not exist (Article 42)."}, {"k": "Accreditation", "t": "BELAC with the additional requirements of the Belgian DPA, five years at most (Article 43)."}, {"k": "Code of conduct", "t": "by a sector organisation, approved by the Belgian DPA, with monitoring; an organisation can adhere (Articles 40 and 41); examples: notaries and cloud."}, {"k": "Consequences", "t": "element of evidence (Article 24(3)), factor in a fine (Article 83(2)(j)), safeguard for transfers (Article 46(2)(e) and (f))."}, {"k": "In practice", "t": "ask for the certificate itself, check the object, the issuer and the validity, and look up the scheme in the register."}], "script": "Time to summarise. The standard says what you must meet, the certification body assesses whether you meet it, and the accreditation body checks the certifier. A mark comes from the producer itself, a seal shows origin and integrity, a certificate is an attestation by a third party. ISO 27001 and ISO 27701 certify a management system and are useful, but never a GDPR certificate. A GDPR certificate is voluntary, comes from a third party, is about a delimited processing operation, and is valid for three years at most. In Belgium, BELAC accredits the certification bodies, with the additional requirements of the Belgian DPA, for five years at most. A code of conduct comes from a sector organisation and is approved by the Belgian DPA; an organisation from the sector can adhere, as with the notaries or with the cloud processors. Codes of conduct and certificates are an element of evidence, a factor in a fine and a possible safeguard for transfers. But they never take over your responsibility: one hundred per cent GDPR compliant does not exist. And in practice: ask for the certificate itself, check the object, the issuer and the validity, and look up the scheme in the register. Whether such a label is real, you learn to check step by step in the deep dive, which you open at the bottom of this slide. After that come the ten practice questions.", "deep": {"url": "verdieping/label-controleren/index.html", "text": "checking a GDPR label step by step: what to look at and how to look it up."}}], "quiz": [{"q": "What does an accreditation body such as BELAC do?", "options": ["It writes the standards against which organisations are checked.", "It attests that a certification body is competent.", "It carries out the audit at organisations and issues the certificate.", "It approves codes of conduct and monitors their members."], "answer": 1, "feedback": ["Writing standards is standardisation: the work of ISO, CEN or NBN.", "Correct. Accreditation is the check on the certifier itself.", "That is what the certification body does with its auditor, not the accreditation body.", "Codes of conduct are approved by the supervisory authority; an accredited body does the monitoring."]}, {"q": "A manufacturer affixes the CE marking to its device itself. What is that?", "options": ["A mark: a declaration by the producer itself.", "A certificate: an attestation by an independent third party.", "A seal: proof of origin and of integrity.", "An accreditation: a recognition by the national government."], "answer": 0, "feedback": ["Correct. With a mark the producer itself speaks.", "A certificate comes from a third party after an assessment.", "A seal shows who something comes from and that it has not been tampered with.", "Accreditation concerns certification bodies, not products."]}, {"q": "Who can draw up a code of conduct under Article 40 of the GDPR?", "options": ["Any controller, for its own internal organisation.", "The supervisory authority, for each sector in its country.", "An association representing a category of organisations.", "An accredited certification body, for its own customers."], "answer": 2, "feedback": ["An internal policy is not a code of conduct within the meaning of Article 40.", "The supervisory authority approves, but does not draw up the code itself.", "Correct. A federation, umbrella organisation or professional body draws up the code.", "A certification body certifies; it does not draw up a code of conduct."]}, {"q": "Who monitors compliance with an approved code of conduct by its members?", "options": ["The national accreditation body, so BELAC in Belgium.", "The European Data Protection Board in Brussels.", "The sector organisation that drew up and submitted the code.", "A body the supervisory authority has accredited for it."], "answer": 3, "feedback": ["BELAC accredits certification bodies, not monitoring bodies of codes.", "The Board gives an opinion on codes covering several Member States, but does not monitor members.", "The author is not automatically the monitor; the body must be independent and accredited.", "Correct. Article 41: an expert body, accredited by the supervisory authority."]}, {"q": "What is the consequence of adhering to an approved code of conduct under Article 24(3)?", "options": ["It creates a legal presumption that the GDPR is complied with.", "It is an element by which to demonstrate compliance.", "It rules out that the supervisory authority still imposes a fine.", "It replaces the obligation to keep a record of processing."], "answer": 1, "feedback": ["The law speaks of an element, not of a presumption of conformity.", "Correct. An element of evidence for accountability.", "It is a factor for the fine (Article 83(2)(j)), not an exclusion.", "All other obligations of the GDPR simply remain."]}, {"q": "What can be the object of a certification under Article 42 of the GDPR?", "options": ["A person, such as a data protection officer of a company.", "An information security management system as a whole.", "A processing operation by a controller or processor.", "A whole organisation, with all its present and future processing."], "answer": 2, "feedback": ["Certification of persons falls outside Article 42.", "A management system as such is not processing; that is the field of ISO standards.", "Correct. Article 42 is about processing operations, also through a product or service.", "The object is defined; a certificate never covers everything."]}, {"q": "Statement: whoever holds a GDPR certificate is subject to less supervision by the authority.", "options": ["True, because the authority relies on the work of the certifier.", "True, but only as long as the certificate remains valid.", "False, except for the certified processing operation itself.", "False: the powers of the authority are unaffected."], "answer": 3, "feedback": ["Article 42(4) says the opposite: the powers are unaffected.", "Validity changes nothing about the powers of the authority.", "The authority remains fully competent for the certified processing too.", "Correct. The authority can even have a certificate withdrawn."]}, {"q": "For how long are a GDPR certificate and the accreditation of a certification body valid at most?", "options": ["Certificate three years, accreditation five.", "Certificate five years, accreditation three years.", "Both three years, renewable each time.", "Certificate one year, accreditation five years."], "answer": 0, "feedback": ["Correct. Article 42(7) and Article 43(4).", "The other way round: the certificate three, the accreditation five.", "The accreditation lasts longer: five years at most.", "There is yearly surveillance, but the certificate is valid for up to three years."]}, {"q": "Who accredits the certification bodies for GDPR certificates in Belgium?", "options": ["The Data Protection Authority alone, on its own accreditation criteria.", "BELAC, under ISO 17065 and the authority's additional requirements.", "The European Data Protection Board, through its public register.", "The Federal Public Service Economy, after advice from the sectors."], "answer": 1, "feedback": ["The GDPR allows that choice, but Belgium opted for the accreditation body.", "Correct. Article 18 of the Act of 30 July 2018.", "The Board approves criteria and keeps the register, but does not accredit.", "BELAC is part of the FPS Economy, but accredits itself, with the authority's requirements."]}, {"q": "A supplier shows an ISO/IEC 27701 certificate. What does that mean for you as DPO?", "options": ["It is a European Data Protection Seal under Article 42.", "It proves that the supplier complies fully with the whole GDPR.", "It has no value at all when you assess this processor.", "It shows good governance, but is no Article 42 certificate."], "answer": 3, "feedback": ["A European seal is in the Board's register; this standard is not.", "No certificate proves full compliance.", "It is certainly a useful element in your assessment.", "Correct. A standard for a management system, without the consequences of Article 42."]}]}</script>

<script>

  /* ---- teksten ---- */

  $('footer').textContent = C.module + ' · ' + C.title + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  if(C.silent){
    $('intro-actions').classList.add('three'); $('btn-start').querySelector('.ico').innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    $('btn-skip').textContent = U.skip_short || ({nl:'Naar de oefeningen',fr:'Aux exercices',en:'To the exercises'})[C.lang] || U.skip_to_quiz;
    $('btn-silent').querySelector('span').textContent = U.silent_label || ({nl:'Zonder geluid',fr:'Sans son',en:'Without sound'})[C.lang] || 'Without sound';
  }
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  let SILENT = false, silentHid = false;
  const SILENT_TXT = ({nl:'Presentatie zonder geluid',fr:'Présentation sans son',en:'Presentation without sound'})[C.lang] || 'Presentation without sound';
  if(C.silent){ const b=$('btn-silent'); b.classList.remove('hidden'); b.title = U.silent_title || SILENT_TXT; }
  function setSilent(on){ SILENT = on; audio.muted = on; }
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  /* download (bv. volledige slidedeck in pdf naast index.html): C.download = {url,label} */
  if(C.download){ const a=$('nav-dl'); a.href=C.download.url; a.textContent='⤓ '+C.download.label; a.title=C.download.title||C.download.label; a.classList.remove('hidden'); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });
  $('nav-quiz').addEventListener('click',()=>{ audio.pause(); if(!$('quiz').classList.contains('hidden')||!$('result').classList.contains('hidden')) return; if(typeof paused!=='undefined' && paused){ $('btn-resume').click(); } else show('quiz-intro'); });
  $('btn-prev').querySelector('span').textContent = U.prev;
  $('btn-next').querySelector('span').textContent = U.next;
  $('lbl-autoplay').textContent = U.autoplay_short || U.autoplay; $('lbl-autoplay-wrap').title = U.autoplay; $('speed').title = U.speed; $('btn-prev').title = U.prev; $('btn-next').title = U.next;
  let rate = 1; try{ rate = parseFloat(localStorage.getItem('module-speed')) || 1; }catch(e){}
  const RATES=[1,1.25,1.5];
  function setRate(r){ rate = r; audio.playbackRate = r; $('speed').textContent = r+'×'; $('speed').classList.toggle('fast', r!==1); $('speed').title = U.speed + ': ' + r + '×'; try{ localStorage.setItem('module-speed', String(r)); }catch(e){} }
  $('speed').addEventListener('click',()=>{ setRate(RATES[(RATES.indexOf(rate)+1)%RATES.length]); });
  $('qi-title').textContent = U.quiz_intro_title;
  $('qi-text').textContent = U.quiz_intro_text;
  $('btn-quiz-start').textContent = U.quiz_start;
  $('btn-review-1').textContent = U.review;
  $('btn-review-2').textContent = U.review;
  $('btn-retry').textContent = U.retry;
  $('r-title').textContent = U.result_title;
  $('btn-q-back').querySelector('span').textContent = U.back_to_slides;
  $('btn-resume').textContent = U.resume_quiz;
  $('btn-pdf').querySelector('span').textContent = U.download_pdf;
  $('ai-title').textContent = U.ai_notice_title; $('ai-text').textContent = U.ai_notice; $('ai-badge').querySelector('span').textContent = U.ai_voice_label; $('ai-footer').textContent = U.ai_footer; document.querySelectorAll('.ai-notice img,.ai-badge img,.ai-line img').forEach(im=>im.alt=U.ai_icon_alt);
  $('t-title').textContent = U.transcript; $('btn-text-hide').textContent = U.hide_text; $('btn-text-show').textContent = U.show_text;
  const NOQUIZ = !(C.quiz && C.quiz.length) && !(C.quizzes && C.quizzes.length);
  if(NOQUIZ){ $('btn-skip').classList.add('hidden'); $('nav-quiz').classList.add('hidden'); }
  $('btn-text-hide').addEventListener('click',()=>{ if(AV){ const t=$('transcript'); t.classList.toggle('notext'); $('btn-text-hide').textContent = t.classList.contains('notext') ? U.show_text : U.hide_text; return; } $('transcript').classList.add('hidden'); $('pres-grid').classList.remove('with-text'); $('btn-text-show').classList.remove('hidden'); });
  $('btn-text-show').addEventListener('click',()=>{ $('transcript').classList.remove('hidden'); $('pres-grid').classList.add('with-text'); $('btn-text-show').classList.add('hidden'); });
  let sent=[], sentEnds=[];
  function setTranscript(t){ sent = t.split(/(?<=[.!?…])\s+(?=\S)/).filter(x=>x.length).map((x,n,a)=>n<a.length-1?x+' ':x); let acc=0, tot=t.length; sentEnds = sent.map(x=>{ acc+=x.length; return acc/tot; }); $('t-body').innerHTML = sent.map((x,n)=>'<span data-n="'+n+'">'+esc(x)+'</span>').join(''); $('t-body').scrollTop=0; }
  function highlight(){ if(!audio.duration) return; const f=audio.currentTime/audio.duration; let k=sentEnds.findIndex(e=>f<e); if(k<0) k=sent.length-1; [...$('t-body').children].forEach((el,n)=>{ const on=n===k; if(on!==el.classList.contains('now')){ el.classList.toggle('now',on); if(on) el.scrollIntoView({block:'nearest',behavior:'smooth'}); } }); }

  /* ---- slides ---- */
  const ALL = C.slides; let S = ALL; let i = 0; const seen = new Set(); let PROFILE = null;
  function setProfile(id){ PROFILE = id; S = ALL.filter(x=>!x.profiles || x.profiles.includes(id)); seen.clear(); i = 0; const pr=(C.profiles||[]).find(x=>x.id===id); $('modlabel').innerHTML = esc(C.course + ' · ' + C.module) + (pr?'<span class="profchip">'+esc(pr.short||pr.label)+'</span>':''); }
  const AV = C.avatar || null;
  const audio = AV ? $('avatar-video') : new Audio(); audio.preload = 'auto';
  if(AV){ $('avatar-box').classList.remove('hidden'); $('transcript').classList.add('has-avatar'); $('avatar-tag').textContent = AV.label || ''; }
  let audioOk = true;

  const hms = t => { t=Math.max(0,Math.floor(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
  function bullets(arr){ return '<ul class="bul">'+arr.map(b=>'<li><span><b>'+esc(b.k)+'</b> — '+esc(b.t)+'</span></li>').join('')+'</ul>'; }
  function render(s){
    const chip = s.chip ? '<span class="chip'+(s.optional?' opt':'')+'">'+esc(s.chip)+'</span>' : '';
    let body = '';

          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':
        /* s.items: [{t, end, k, t2}] -> sprongknoppen naar de opname */
        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */

        else if(s.bullets){ side = bullets(s.bullets); }

        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+(s.rec&&RS.length?'<div class="readmore rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+s.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')+(s.deep?'<div class="readmore deep"><span><span class="lbl">'+esc(U.deep_label||'Verdieping')+'</span> · '+esc(s.deep.text||'')+'</span><a class="btn" href="'+esc(s.deep.url)+'?back='+(S.indexOf(s)+1)+'">'+esc(s.deep.label||U.deep_btn||'Open de verdieping')+' ›</a></div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;

      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });

  function showResult(){

  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
<script>
/* layout-fix v1 js: tekst in tekeningen (svg) die uit zijn vak of uit de tekening valt, krimpt tot hij past (breed lettertype, andere taal) */
(function(){
  function boxOf(t,bb){var g=t.parentNode,best=null,tx=bb.x+bb.width/2,ty=bb.y+bb.height/2;
    [].forEach.call(g.children,function(rc){var n=rc.tagName.toLowerCase();if(n!=='rect')return;var x=+rc.getAttribute('x'),y=+rc.getAttribute('y'),w=+rc.getAttribute('width'),h=+rc.getAttribute('height');if(isNaN(x)||isNaN(w)||h>100||w>520)return;
      if(tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h&&(!best||w*h<best.w*best.h))best={x:x,y:y,w:w,h:h};});return best;}
  function fit(root){
    [].forEach.call(root.querySelectorAll('svg'),function(sv){var vb=sv.viewBox&&sv.viewBox.baseVal;
      [].forEach.call(sv.querySelectorAll('text'),function(t){if(/rotate/.test(t.getAttribute('transform')||''))return;var off=0,n=0,fs0=parseFloat(getComputedStyle(t).fontSize)||12,fs=fs0;
        function over(){try{var bb=t.getBBox();bb={x:bb.x+off,y:bb.y,width:bb.width,height:bb.height};if(vb&&vb.width&&(bb.x<vb.x-1||bb.x+bb.width>vb.x+vb.width+1))return true;var b=boxOf(t,bb);return !!b&&(bb.x<b.x-1||bb.x+bb.width>b.x+b.w+1);}catch(e){return false;}}
        try{var b0=t.getBBox();if(vb&&vb.width){var dx=0;if(b0.x<vb.x-1)dx=vb.x-b0.x+2;else if(b0.x+b0.width>vb.x+vb.width+1)dx=vb.x+vb.width-(b0.x+b0.width)-2;if(dx&&Math.abs(dx)<=40){t.setAttribute('transform',(t.getAttribute('transform')||'')+' translate('+dx+' 0)');off=dx;}}}catch(e){}
        while(over()&&n++<14&&fs>fs0*0.72){fs*=0.94;t.style.fontSize=fs+'px';}});});
  }
  function start(){var c=document.getElementById('slidecard');if(!c)return;fit(c);new MutationObserver(function(){fit(c);}).observe(c,{childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
