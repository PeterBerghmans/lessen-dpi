<!DOCTYPE html>
<html lang="en" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 4 · The basic principles of processing</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Module 4", "title": "The basic principles of processing", "subtitle": "Seven principles from Article 5 that determine whether you may process personal data, and how the rest of the GDPR develops them", "duration": "± 17 minutes of presentation, 3 think-along exercises and 10 questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will be able to do after this module", "goals": ["What the basic principles of Article 5 are and why that article is the backbone on which the rest of the GDPR hangs.", "Recognising each principle in an everyday situation: lawful, fair and transparent, purpose limitation, data minimisation, accuracy, storage limitation, integrity and confidentiality.", "The difference between data minimisation and storage limitation, and between integrity and confidentiality.", "What accountability means and why it makes supervision possible."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI assistance and reviewed by the trainer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto", "read_label": "Open the GDPR on EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "The basic principles: the backbone of the GDPR", "subtitle": "Seven principles from Article 5 that determine whether you may process personal data, and how the rest of the Regulation develops them", "script": "A football club asks me to look over its registration form. Name, address, date of birth, that is what you would expect. But also: national register number, the parents' profession, a copy of the identity card, and a box for any medical problems. All mandatory. Why, I ask. Because we have always done it this way, says the secretary. And they keep the data forever, because you never know. None of this is necessarily ill-intentioned. But almost every line on that form collides with a principle of the GDPR. Which principles those are, that is what this module is about. They are all in a single article, Article five, and you can safely memorise that article, because it is the backbone on which the whole Regulation hangs. After this quarter of an hour you will be able to recognise each of those principles in an everyday situation, and you will know what it means that you must be able to demonstrate them."}, {"id": 2, "type": "cards", "chip": "The structure", "title": "Article 5 lists the seven principles; the rest of the GDPR develops them", "cols": 4, "cards": [{"k": "Lawful, fair and transparent", "t": "legal under every applicable rule, fair, and open towards the data subject.", "sub": "Lawful: Art. 6–10 · Transparent: Chapter III (Art. 12–23)"}, {"k": "Purpose limitation", "t": "collect for a specified purpose, and stick to it.", "sub": "Art. 6(4) · Art. 30 (register)"}, {"k": "Data minimisation", "t": "adequate, relevant and no more than necessary.", "sub": "Chapter IV: Art. 25 (by design and by default)"}, {"k": "Accuracy", "t": "accurate and, where necessary, kept up to date.", "sub": "Art. 16 (rectification) · Art. 19"}, {"k": "Storage limitation", "t": "not kept in identifiable form for longer than the purpose requires.", "sub": "Art. 17 (erasure) · Art. 30 (retention periods)"}, {"k": "Integrity and confidentiality", "t": "appropriate security against leaks, loss and unwanted alteration.", "sub": "Chapter IV: Art. 32–34 (security, data breaches)"}, {"k": "Accountability", "t": "comply and be able to demonstrate it.", "sub": "Chapter IV: Art. 24 · Art. 30 (register) · Art. 35 (DPIA)"}], "read": {"text": "Look at the table of contents of the GDPR: after Article 5 come the chapters that develop each principle.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "First the structure, because it helps you to read the whole Regulation. Whether a processing operation is allowed does not depend on a single question, but on a series of assessments. Those assessments are listed in Article five, under the heading principles. One article, seven principles, and you see all seven on the slide. Look also at the line at the bottom of each card. It shows where the Regulation develops that principle further. Lawful is developed in the legal bases, the part that comes right after the principles and that we will discuss in a later module. Transparent is developed in a whole chapter on information duties and the rights of the data subject. Purpose limitation, data minimisation and storage limitation return in the obligations of the controller: the register, data protection by design, the retention periods. Accuracy and storage limitation each have a right of the data subject as their counterpart: rectification and erasure. Integrity and confidentiality are developed in the rules on security and data breaches. And accountability in the register, the risk assessment and the general responsibility of whoever processes. For the rest of this module we keep this overview at the top of every slide, so that you always see where we are. So remember: Article five is the table of contents in miniature. Whoever knows the seven principles knows the structure of the GDPR."}, {"id": 3, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 0}, "chip": "Principle 1", "title": "Lawful, fair and transparent", "source": "Article 5(1)(a) GDPR", "quote": "Personal data shall be: (a) processed lawfully, fairly and in a transparent manner in relation to the data subject (‘lawfulness, fairness and transparency’);", "bullets": [{"k": "Lawful", "t": "in line with the law: not only the GDPR, but every rule that says something about that processing, such as employment law or the camera act."}, {"k": "Fair", "t": "no surprises, no deception, no use of data in a way the data subject would not reasonably expect."}, {"k": "Transparent", "t": "the data subject knows who processes their data, why, and what their rights are, in clear and plain language."}], "read": {"text": "Read recital 39 for the legislator's explanation of these three words (search for '(39)').", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The first principle contains three words. Lawful, fair and transparent. Lawful means: in line with the law. Careful, not only the GDPR. Every rule that says something about that processing counts. Whoever uses camera footage of employees must also comply with the rules on camera surveillance at work. Whoever processes payroll data, with social law as well. Lawfulness is broader than one law. Fair is the word that is skipped most often. It means: fair play. No surprises for the data subject. You do not use data in a way someone would not reasonably expect, even if strictly speaking it might be allowed. An example: a web shop that deduces from your order history that you are pregnant and approaches you about it. Technically perhaps justifiable, fair certainly not. And transparent: the data subject knows who processes their data, for what purpose, and what they can do about it. In clear and plain language, not in ten pages of legal prose. So remember: legal, fair and open. All three at the same time."}, {"id": 4, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 1}, "chip": "Principle 2", "title": "Purpose limitation: collect for a specified purpose, and stick to it", "source": "Article 5(1)(b) GDPR", "quote": "collected for specified, explicit and legitimate purposes and not further processed in a manner that is incompatible with those purposes; further processing for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes shall, in accordance with Article 89(1), not be considered to be incompatible with the initial purposes (‘purpose limitation’);", "bullets": [{"k": "Specified and explicit", "t": "'for our services' is not a purpose; 'to deliver and invoice your order' is."}, {"k": "No incompatible further processing", "t": "data you collected to deliver an order, you do not simply use to build a credit profile."}, {"k": "The exceptions", "t": "archiving in the public interest, scientific or historical research and statistics are not considered incompatible, subject to the safeguards the Regulation imposes."}], "read": {"text": "Also read Article 6(4): the criteria for assessing whether a further purpose is compatible with the original purpose.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Second principle: purpose limitation. Two parts. The first: you collect data for a specified, explicit and legitimate purpose. You must be able to name that purpose in advance. For our services is not a purpose. To deliver and invoice your order, that is one. The second part: you do not use those data afterwards for something incompatible with that purpose. A hospital collects data to treat you. Passing those same data on to an insurer who wants to know whether you are a good risk, that is incompatible. Now a nuance the legislator makes itself. Some further purposes are not considered incompatible: archiving in the public interest, scientific or historical research, and statistics. So that hospital may use its treatment data for research into the effectiveness of a therapy, or for an annual report on the number of operations. Provided it complies with the safeguards that go with it, such as pseudonymisation. So remember: name your purpose in advance, and stick to it. Research and statistics are the permitted side roads."}, {"id": 5, "type": "reveal", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 2}, "chip": "Think-along exercise 1", "title": "The football club's registration form", "question": "The football club from the introduction requires, with every registration, the national register number, the parents' profession and a copy of the identity card. The purpose is 'the registration of the member'. Which principle is at stake here?", "verdict": "Data minimisation", "answer": [{"k": "The test", "t": "which data do you need to achieve this purpose? For a registration: name, contact details, date of birth (for the age category) and a payment. Nothing more."}, {"k": "Who decides that", "t": "the controller, here the club, determines itself which data are needed; but it must be able to justify that choice against the purpose."}, {"k": "The parents' profession", "t": "does not serve the purpose, so it may not be asked, not even 'just in case'."}], "script": "First think-along exercise, back to the football club. Mandatory on the form: the national register number, the parents' profession and a copy of the identity card. Purpose: the registration of the member. Which principle is at stake here? Think about it for a moment. … Data minimisation, the third principle. The test is simple: which data do you need to achieve this purpose? For a registration: name, contact details, date of birth to determine the age category, and a payment. The parents' profession does not serve that purpose. Nor does a copy of the identity card. Who decides which data are needed? The controller, here the club itself. That is important: the GDPR gives no list, the club makes that choice. But it must be able to justify that choice against the purpose. And just in case is not a justification. So remember: not what might come in handy, but what is needed. And whoever processes decides that, and must be able to explain it."}, {"id": 6, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 2}, "chip": "Principle 3", "title": "Data minimisation: adequate, relevant and limited to what is necessary", "source": "Article 5(1)(c) GDPR", "quote": "adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed (‘data minimisation’);", "bullets": [{"k": "Adequate", "t": "enough to achieve the purpose: too little data is a problem too, because then you work with an incomplete picture."}, {"k": "Relevant", "t": "relevant to the purpose; a question that has nothing to do with it does not belong on the form."}, {"k": "Limited to what is necessary", "t": "not 'everything that might ever be useful', but what you need now; the controller determines that and justifies it."}], "script": "The principle itself is on the slide. Three words: adequate, relevant and limited to what is necessary. Adequate means: enough. People sometimes forget that. Whoever grants a loan on the basis of half a file processes too little and takes decisions on an incomplete picture. Relevant means: relevant to the purpose. And limited to what is necessary, that is the core. Not everything that might ever be useful. A rule of thumb I use myself: put every item on your form next to your purpose and ask the question: what happens if I do not ask this? Can you still achieve the purpose? Then it does not belong there. So remember: enough, relevant, and no more than necessary."}, {"id": 7, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 3}, "chip": "Principle 4", "title": "Accuracy: accurate and, where necessary, kept up to date", "source": "Article 5(1)(d) GDPR", "quote": "accurate and, where necessary, kept up to date; every reasonable step must be taken to ensure that personal data that are inaccurate, having regard to the purposes for which they are processed, are erased or rectified without delay (‘accuracy’);", "bullets": [{"k": "Accurate", "t": "a wrong address, an incorrect date of birth or an outdated diagnosis in a file are no small matter: decisions are based on them."}, {"k": "Where necessary kept up to date", "t": "not every item must be continuously updated; a historical fact remains what it was, a current situation must be correct."}, {"k": "Reasonable steps", "t": "whoever discovers an error corrects or erases it without delay; the data subject has a right to rectification for that."}], "script": "Fourth principle: accuracy. Data must be accurate and, where necessary, kept up to date. Why is that a principle and not a matter of course? Because decisions are based on them. A wrong address, and the reminder never arrives but the fine keeps growing. An outdated diagnosis in a file, and someone gets the wrong treatment. A wrong credit score, and a loan is refused. Note the words where necessary. Not every item must be permanently updated. That you lived in Brussels in twenty ten remains accurate as a historical fact. But your current address must be correct if someone sends you mail. And the last part: whoever discovers an error must correct or erase it without delay. The data subject has a right for that, by the way, the right to rectification, which we will come to later. So remember: accurate where it matters, and quickly corrected where it is wrong."}, {"id": 8, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 4}, "chip": "Principle 5", "title": "Storage limitation: not kept in identifiable form for longer than the purpose requires", "source": "Article 5(1)(e) GDPR", "quote": "kept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed; personal data may be stored for longer periods insofar as the personal data will be processed solely for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes in accordance with Article 89(1) subject to implementation of the appropriate technical and organisational measures required by this Regulation in order to safeguard the rights and freedoms of the data subject (‘storage limitation’);", "bullets": [{"k": "In a form which permits identification", "t": "the principle is about identifiable data; erasing or anonymising are both a way out."}, {"k": "No longer than necessary for the purpose", "t": "every purpose has an end date: as long as the membership runs, as long as a dispute is possible, as long as the law imposes a retention period."}, {"k": "The exceptions", "t": "archiving in the public interest, research and statistics may take longer, with the safeguards the Regulation imposes."}], "read": {"text": "Read the literal text of the storage limitation principle in Article 5(1)(e).", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Fifth principle: storage limitation. Read the text on the slide. Personal data are kept in a form which permits identification of the data subject for no longer than is necessary for the purpose. Three things stand out. One: it is about identifiable data. So you have two ways out once the purpose is achieved: erase, or anonymise. Anonymised figures you may keep. Two: no longer than necessary for the purpose. Every purpose has an end date. As long as the membership runs. As long as a dispute about an invoice is still possible. As long as the law obliges you to keep something, such as the accounts. You must be able to name that period for each purpose, and that is exactly what will come back later in the register. Three: here too, archiving, research and statistics are the permitted exceptions, with safeguards. Back to the football club. A member who left ten years ago is still in the membership file, with address, date of birth and medical record. The purpose, managing the membership, was achieved ten years ago. So remember: every purpose has an end date, and on that date the keeping of identifiable data stops."}, {"id": 9, "type": "compare", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 4}, "chip": "Principle 5", "title": "Storage limitation is not the same as data minimisation", "left": {"head": "Data minimisation", "items": ["Is about which data you collect", "The question: do I need this item for my purpose?", "Comes into play when designing your form or your system", "Example: the parents' profession does not belong on the registration form"]}, "right": {"head": "Storage limitation", "items": ["Is about how long you keep data", "The question: has this purpose been achieved, and may I still keep the item?", "Comes into play throughout the whole life cycle of the data", "Example: the data of a member who left ten years ago no longer belong in the membership file"]}, "script": "Now the difference, because storage limitation is constantly confused with data minimisation. Look at the two columns. Data minimisation is about which data you collect. Storage limitation is about how long you keep them. The first question you ask when designing your form: do I need this? The second question you ask throughout the whole life cycle of the data: has the purpose been achieved, and may I still keep them? Back to the football club. That they ask for the parents' profession is a problem of data minimisation. That they still have the data of members who left ten years ago in their file is a problem of storage limitation. Two different mistakes, two different principles. So remember: minimisation is about what, storage limitation about how long."}, {"id": 10, "type": "reveal", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 4}, "chip": "Think-along exercise 2", "title": "The football club: two mistakes, two principles", "question": "Two situations at the same football club. One: the club keeps the complete files of all former members forever, including the medical records, 'because it might be useful one day if someone comes back'. Two: for the newsletter, the secretary copies the whole membership file, with address, date of birth and medical record, into the mail program. Which principle is at stake in each case, and what would a correct approach be?", "verdict": "One: storage limitation. Two: data minimisation.", "answer": [{"k": "The former members", "t": "storage limitation: the purpose, managing the membership, has been achieved; 'might be useful one day' is not a purpose. Correct: set a retention period per purpose, then erase or anonymise."}, {"k": "The newsletter", "t": "data minimisation: to send a newsletter you need a name and an email address, nothing more. Correct: only those two items into the mail program."}, {"k": "What is allowed", "t": "keeping anonymised figures, for example how many members leave each season, because nobody can be recognised in them any more."}], "script": "Second think-along exercise, at the same football club. Two situations. One: the club keeps the complete files of all former members forever, including the medical records. It might be useful one day if someone comes back, says the secretary. Two: for the newsletter, that same secretary copies the whole membership file into the mail program. Address, date of birth, medical record, everything. Which principle is at stake in each case, and what would be better? Think about it for a moment. … The former members: storage limitation. The purpose of that file was managing the membership. That purpose has been achieved. Might be useful one day is not a purpose, and so not a reason to keep identifiable data. The correct approach is: set a retention period per purpose, for example until the end of the season after someone leaves, and then erase or anonymise. The newsletter: data minimisation. Which data do you need to send a newsletter? A name and an email address. Not the address, not the date of birth, and certainly not the medical record. The correct approach is: only those two items in the mail program. And note what is allowed: keeping figures on how many members leave each season, as long as nobody can be recognised in them any more. So remember: two questions for every item. Do I need this? And for how long?"}, {"id": 11, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 5}, "chip": "Principle 6", "title": "Integrity and confidentiality: appropriate security", "source": "Article 5(1)(f) GDPR", "quote": "processed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing and against accidental loss, destruction or damage, using appropriate technical or organisational measures (‘integrity and confidentiality’).", "bullets": [{"k": "Integrity", "t": "the data remain correct and complete: nobody can alter them unnoticed, and they are not lost or damaged (backups, change control, protection against a crash)."}, {"k": "Confidentiality", "t": "only those who need access have it: access rights, passwords, encryption, a discreet conversation at the reception desk."}, {"k": "Technology-neutral, but this is where cybersecurity comes in", "t": "the GDPR prescribes no technology; it requires measures that match the risk. This principle is the place where cybersecurity (access management, encryption, backups, updates) becomes part of data protection."}], "read": {"text": "Read Article 32 on the security of processing: the same two words, developed further.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Sixth principle: integrity and confidentiality. Two words that are often said together as if they were one. They are two. Integrity means that the data remain correct and complete. Nobody can alter them unnoticed, and they are not lost. An example: an employee accidentally changes the dosage in a patient file, and nobody notices. Or a server crashes and there is no backup of the accounts. Those are problems of integrity. Nobody has seen anything they were not allowed to see, and yet something is wrong. Confidentiality means that only those who need access have it. Access rights, passwords, encryption. But also: a conversation at the reception desk that the whole waiting room can follow is a problem of confidentiality, without a single computer. Another important point: the GDPR is technology-neutral. It does not say which software or which encryption you must use. It says: appropriate measures, appropriate to the risk. How you fill that in comes in the rules on security, further on in the Regulation. And this is precisely the place where cybersecurity enters the GDPR. Access management, encryption, backups, updates of your systems, the training of your staff: those are not matters for the IT department alone. They are measures by which you comply with this principle, and in a data breach it is precisely this principle that has been violated. So remember: integrity is that it is correct, confidentiality is that it does not leak, and cybersecurity is how you make that happen."}, {"id": 12, "type": "reveal", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 5}, "chip": "Think-along exercise 3", "title": "Integrity or confidentiality?", "question": "Three situations. One: a laptop with the membership file is stolen from a car. Two: because of a software error, the dates of birth of all members are shifted by one year. Three: a volunteer emails the member list to his private address to continue working at home. Which aspect is affected in each case?", "verdict": "One and three: confidentiality. Two: integrity.", "answer": [{"k": "The stolen laptop", "t": "confidentiality: unauthorised persons can access the data; whether the laptop was encrypted determines how serious it is."}, {"k": "The shifted dates of birth", "t": "integrity: nobody has seen anything, but the data are no longer correct and decisions are based on them (age categories, insurance)."}, {"k": "The volunteer", "t": "confidentiality: the data leave the club's secured environment, even if the intention is good."}], "script": "Third think-along exercise, to pin down those two words. Three situations. One: a laptop with the membership file is stolen from a car. Two: because of a software error, the dates of birth of all members shift by one year. Three: a volunteer emails the member list to his private address to continue working at home. Which aspect is affected in each case? Think about it for a moment. … The stolen laptop: confidentiality. Unauthorised persons can access the data. Whether the disk was encrypted determines how serious that is. The shifted dates of birth: integrity. Nobody has seen anything, but the data are no longer correct, and the club puts members in the wrong age category. The volunteer: confidentiality. The intention is good, but the data leave the club's secured environment and end up in a private mailbox that nobody supervises. So remember: with every incident you ask the question: has something leaked, or has something been changed or lost? Often both."}, {"id": 13, "type": "quote", "nav": {"items": ["Lawful, fair, transparent", "Purpose limitation", "Data minimisation", "Accuracy", "Storage limitation", "Integrity & confidentiality", "Accountability"], "active": 6}, "chip": "Principle 7", "title": "Accountability: comply and be able to demonstrate it", "source": "Article 5(2) GDPR", "quote": "The controller shall be responsible for, and be able to demonstrate compliance with, paragraph 1 (‘accountability’).", "bullets": [{"k": "Two verbs", "t": "the controller must comply with the principles and be able to demonstrate that it complies; the second is new compared with the old Directive."}, {"k": "How you demonstrate it", "t": "a register of processing activities, a privacy notice, documented retention periods, a security policy, a risk assessment where needed: the obligations that come further on in the GDPR."}, {"k": "Why it matters", "t": "without documentation a supervisory authority can only establish that something went wrong; with documentation it can check whether the organisation did its job. That makes supervision possible."}], "read": {"text": "Read Article 24 on the responsibility of the controller: that is where the development of this principle begins.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "And then the seventh principle, in a separate paragraph: accountability. Read the sentence on the slide. Two verbs. The controller is responsible for compliance, and is able to demonstrate it. That second part is the innovation. Under the old Directive you also had to comply with the rules, but you did not have to prove that you did. The consequence: a supervisory authority that came in could only establish that something had gone wrong. It could not check whether the organisation had done its job. Supervision was therefore difficult, and often only possible after an incident. The GDPR turns that around. You must be able to show what you have done. How? With the obligations that come further on in the Regulation: a register of your processing activities, a privacy notice, documented retention periods, a security policy, and where needed a risk assessment. Each of those documents is a piece of evidence. Back to the football club. If the supervisory authority rings the doorbell tomorrow and asks: why do you ask for the national register number, and how long do you keep it? Then I do not know is no longer an answer. So remember: complying is not enough, you must be able to show it. That is what makes supervision possible."}, {"id": 14, "type": "summary", "chip": "Summary", "title": "What you take away", "key": "Article 5 is the backbone of the GDPR: seven principles that together determine whether a processing operation is allowed, each developed further in the rest of the Regulation, and the controller must not only comply with them but also be able to demonstrate it.", "bullets": [{"k": "Lawful, fair, transparent", "t": "legal under every applicable rule, fair without surprises, and open in clear language."}, {"k": "Purpose limitation and data minimisation", "t": "name your purpose in advance and stick to it; collect only what is needed for that purpose, and justify that choice."}, {"k": "Accuracy and storage limitation", "t": "data are correct where it matters; every purpose has an end date, after which you erase or anonymise."}, {"k": "Integrity, confidentiality and accountability", "t": "it is correct and it does not leak, with appropriate measures; and you can demonstrate that you do all of this."}], "script": "What do you take away? One key sentence: Article five is the backbone of the GDPR. Seven principles that together determine whether a processing operation is allowed, each developed further in the rest of the Regulation. And whoever processes must not only comply with them, but also be able to demonstrate it. Then the principles themselves, in four groups. Lawful, fair and transparent: legal, fair and open. Purpose limitation and data minimisation: name your purpose in advance, stick to it, and collect only what is needed for it. Accuracy and storage limitation: data are correct where it matters, and every purpose has an end date. Integrity and confidentiality: it is correct and it does not leak. And accountability as the keystone. Before you go to the questions, one task. Pause the audio and take a form or a file from your own organisation. Put every item next to the purpose and ask two questions: do I need this, and for how long? Chances are you will cross out at least one box. Then there are ten questions to test whether you recognise the principles."}], "quiz": [{"q": "Why is Article 5 of the GDPR called the 'backbone' of the Regulation?", "options": ["Because it is the only provision that directly contains sanctions for those who do not comply with the rules.", "Because it lists the principles that the rest of the Regulation develops.", "Because it contains the definitions that are used in all the other articles of the Regulation.", "Because it is the only article that also applies to processing in the household sphere."], "answer": 1, "feedback": ["Sanctions are elsewhere in the Regulation; Article 5 contains the principles, not the fines.", "Correct. Lawfulness, transparency, security and accountability each get their own chapter further on.", "The definitions are in Article 4; Article 5 contains the principles relating to processing.", "The household exemption takes a processing operation entirely outside the GDPR, including outside Article 5."]}, {"q": "A web shop deduces from a customer's purchasing behaviour that she is pregnant and sends her unsolicited baby advertising. Which part of the first principle is most at stake here?", "options": ["Lawfulness, because the web shop has no licence to do marketing.", "Transparency, because the web shop has no privacy notice.", "None: a web shop may freely analyse purchase data for its own marketing.", "Fairness, because the customer does not expect such use of her purchases."], "answer": 3, "feedback": ["No licence is needed for marketing; the problem does not lie in a missing authorisation.", "Whether there is a privacy notice, we do not know; the core problem is the unexpected and intrusive inference from the data.", "Purchase data are personal data too, and every processing operation must be fair.", "Correct. Fair means: no use that the data subject would not reasonably expect, even if it were technically possible."]}, {"q": "A hospital collects data to treat patients. Which further processing does the GDPR expressly consider not incompatible with that purpose?", "options": ["Passing the data on to an insurer who wants to know the patient's risk profile.", "Selling the data to a pharmaceutical company for targeted advertising.", "Using the data for scientific research or statistics.", "Using the data to assess the performance of its own staff."], "answer": 2, "feedback": ["Informing an insurer about the risk profile is a different purpose the patient does not expect; that is incompatible.", "Selling for advertising has nothing to do with treatment and is incompatible with the original purpose.", "Correct. Archiving in the public interest, scientific or historical research and statistics are not considered incompatible, subject to the safeguards the Regulation imposes.", "Staff assessment is a different purpose; patient data were not collected for that."]}, {"q": "Who determines which data are needed to achieve a purpose, within the meaning of the data minimisation principle?", "options": ["The controller, who must be able to justify that choice.", "The supervisory authority, which publishes a list of permitted data per sector.", "The data subject, who indicates which data they do and do not want to share.", "The processor, because it manages the technical systems and stores the data."], "answer": 0, "feedback": ["Correct. The controller decides which data are needed, and must be able to explain that choice; 'just in case' is not enough.", "The GDPR contains no lists per sector; the choice lies with whoever processes, subject to supervision afterwards.", "The data subject can refuse, but does not determine what is needed for the organisation's purpose.", "The processor acts on instructions; the choice of purpose and means lies with the controller."]}, {"q": "What is the difference between data minimisation and storage limitation?", "options": ["There is no difference: both are about limiting the amount of data you process.", "The first is about which data you collect, the second about how long you keep them.", "Data minimisation applies to paper, storage limitation to digital data.", "Data minimisation applies to companies, storage limitation only to public authorities."], "answer": 1, "feedback": ["They are two different principles with two different questions: 'what' and 'how long'.", "Correct. The first question you ask when designing your form, the second throughout the whole life cycle of the data.", "Both principles apply to every medium, paper or digital.", "Both principles apply to every controller, company or public authority."]}, {"q": "An association keeps the complete data of members who left more than ten years ago, 'because you never know'. What is a correct approach under the storage limitation principle?", "options": ["Keep the data, but in a separate file with restricted access.", "Keep the data as long as the association exists, because they were once lawfully collected.", "Ask the former members every year for consent to keep the data.", "Set a retention period per purpose and then erase or anonymise the data."], "answer": 3, "feedback": ["Restricted access is a security measure, but does not solve the fact that the data are kept in identifiable form for longer than necessary.", "That the collection was once lawful gives no right to keep identifiable data indefinitely.", "Asking consent for something that no longer serves a purpose is not a solution; the purpose itself has disappeared.", "Correct. Every purpose has an end date; after that only anonymised data (for example for statistics) are kept."]}, {"q": "Because of a software error, all dates of birth in a membership file are shifted by one year; nobody outside the organisation has seen the data. Which aspect of the security principle is affected?", "options": ["Integrity, because the data are no longer correct.", "Confidentiality, because a software error is always a leak.", "Neither, because there has been no unauthorised access.", "Transparency, because the members have not been informed about the error."], "answer": 0, "feedback": ["Correct. Integrity means that data remain correct and complete; an unnoticed alteration or loss is an integrity problem.", "Nothing has leaked; confidentiality is about who has access, not about errors in the content.", "Security is not only about access: unwanted alteration, loss or damage are covered too.", "Whether the members must be informed is a follow-up question; the incident itself affects the integrity of the data."]}, {"q": "What is meant when it is said that the GDPR is 'technology-neutral' in the area of security?", "options": ["The GDPR does not apply to data processed with new technology that is not yet regulated.", "The GDPR requires encryption for all personal data, whatever the technology.", "The GDPR prescribes no technology, but requires measures that match the risk.", "The GDPR leaves the choice of security entirely to the processor."], "answer": 2, "feedback": ["On the contrary: the GDPR applies whatever the technology, including the newest.", "Encryption is one possible measure, not a general obligation for all data.", "Correct. The Regulation names no products or techniques; it requires appropriate technical and organisational measures, matched to the risk.", "The controller remains responsible for appropriate security, even if a processor implements it."]}, {"q": "What does accountability add compared with the old Directive?", "options": ["The obligation to comply with the principles, which did not yet exist under the Directive.", "The obligation to notify every processing operation to the supervisory authority in advance.", "The obligation to appoint a lawyer or legal adviser for every processing operation.", "The obligation to be able to demonstrate that you comply with the principles."], "answer": 3, "feedback": ["The principles themselves largely existed already under the Directive; what is new is having to demonstrate.", "A general prior notification existed precisely under the Directive and was abolished by the GDPR.", "The GDPR does not require a lawyer; in certain cases it does require a data protection officer, which is something else.", "Correct. 'Be able to demonstrate' is the innovation: register, privacy notice, retention periods and security policy are the evidence."]}, {"q": "Why does accountability make supervision easier?", "options": ["Because the supervisory authority then no longer has to conduct its own investigation into a complaint.", "Because the supervisory authority can see from the documentation whether the organisation did its job.", "Because organisations with documentation are automatically exempt from fines.", "Because the data subject can then no longer lodge a complaint with the supervisory authority."], "answer": 1, "feedback": ["The supervisory authority still investigates, but now has something to rely on.", "Correct. Under the Directive the supervisory authority could often only establish that something went wrong; with a register, policies and assessments it can now assess the operation itself.", "Documentation is no free pass; it does show that the organisation was diligent, which counts.", "The data subject's right to lodge a complaint remains fully intact."]}]}</script>
