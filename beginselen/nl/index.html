<!DOCTYPE html>
<html lang="nl" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 4 · De basisprincipes van de verwerking</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

<script id="content" type="application/json">{"lang": "nl", "course": "Gegevensbescherming", "module": "Module 4", "title": "De basisprincipes van de verwerking", "subtitle": "Zeven principes uit artikel 5 die bepalen of je persoonsgegevens mag verwerken, en hoe de rest van de AVG ze uitwerkt", "duration": "± 17 minuten presentatie, 3 denkoefeningen en 10 oefenvragen", "ui": {"start": "Start de presentatie", "intro_lead": "Wat je na deze module kunt", "goals": ["Wat de basisprincipes van artikel 5 zijn en waarom dat artikel de kapstok is waaraan de rest van de AVG hangt.", "Elk principe herkennen in een gewone situatie: rechtmatig, behoorlijk en transparant, doelbinding, minimale gegevensverwerking, juistheid, opslagbeperking, integriteit en vertrouwelijkheid.", "Het verschil tussen minimale gegevensverwerking en opslagbeperking, en tussen integriteit en vertrouwelijkheid.", "Wat de verantwoordingsplicht (accountability) inhoudt en waarom ze het toezicht mogelijk maakt."], "slide_of": "Slide {n} van {total}", "play": "Afspelen", "pause": "Pauze", "replay": "Opnieuw", "prev": "Vorige", "next": "Volgende", "autoplay": "Automatisch doorgaan", "to_quiz": "Naar de oefeningen", "quiz_intro_title": "Test je kennis", "quiz_intro_text": "Tien vragen, telkens vier antwoordmogelijkheden waarvan er precies één juist is. Na elk antwoord krijg je meteen feedback. Er wordt niets geregistreerd: oefen zo vaak je wil.", "quiz_start": "Start de oefeningen", "question_of": "Vraag {n} van {total}", "correct": "Juist", "incorrect": "Niet juist", "next_question": "Volgende vraag", "show_result": "Bekijk je resultaat", "result_title": "Je resultaat", "result_text": "Je had {score} van de {total} vragen juist.", "result_good": "Prima. Je beheerst de kern van deze module.", "result_mid": "Goed op weg. Bekijk de feedback bij de vragen die je fout had en probeer opnieuw.", "result_low": "Bekijk de presentatie nog eens en probeer daarna opnieuw. De feedback bij elke vraag helpt je op weg.", "retry": "Opnieuw oefenen", "review": "Presentatie herbekijken", "your_answer": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "De basisprincipes: de kapstok van de AVG", "subtitle": "Zeven principes uit artikel 5 die bepalen of je persoonsgegevens mag verwerken, en hoe de rest van de verordening ze uitwerkt", "script": "Een voetbalclub vraagt me om hun inschrijvingsformulier na te kijken. Naam, adres, geboortedatum, dat verwacht je. Maar ook: rijksregisternummer, beroep van de ouders, een kopie van de identiteitskaart, en een vakje voor eventuele medische problemen. Alles verplicht. Waarom, vraag ik. Omdat we het altijd zo gedaan hebben, zegt de secretaris. En de gegevens bewaren ze voor altijd, want je weet nooit. Niets daarvan is per se kwaad bedoeld. Maar bijna elke regel op dat formulier botst met een principe uit de AVG. Welke principes dat zijn, daar gaat deze module over. Ze staan allemaal in één artikel, artikel vijf, en dat artikel mag je gerust onthouden, want het is de kapstok waaraan de hele verordening hangt. Na dit kwartier kun je elk van die principes herkennen in een gewone situatie, en weet je wat het betekent dat je ze moet kunnen aantonen."}, {"id": 2, "type": "cards", "chip": "De structuur", "title": "Artikel 5 somt de zeven principes op; de rest van de AVG werkt ze uit", "cols": 4, "cards": [{"k": "Rechtmatig, behoorlijk en transparant", "t": "wettig volgens elke toepasselijke regel, fair, en open voor de betrokkene.", "sub": "Rechtmatig: art. 6–10 · Transparant: hoofdstuk III (art. 12–23)"}, {"k": "Doelbinding", "t": "verzamelen voor een welbepaald doel, en daarbij blijven.", "sub": "Art. 6, lid 4 · art. 30 (register)"}, {"k": "Minimale gegevensverwerking", "t": "toereikend, ter zake dienend en niet meer dan nodig.", "sub": "Hoofdstuk IV: art. 25 (door ontwerp en standaard)"}, {"k": "Juistheid", "t": "juist en, zo nodig, geactualiseerd.", "sub": "Art. 16 (rectificatie) · art. 19"}, {"k": "Opslagbeperking", "t": "niet langer identificeerbaar bewaren dan nodig voor het doel.", "sub": "Art. 17 (wissing) · art. 30 (bewaartermijnen)"}, {"k": "Integriteit en vertrouwelijkheid", "t": "passende beveiliging tegen lek, verlies en ongewenste wijziging.", "sub": "Hoofdstuk IV: art. 32–34 (beveiliging, datalekken)"}, {"k": "Verantwoordingsplicht", "t": "naleven én kunnen aantonen.", "sub": "Hoofdstuk IV: art. 24 · art. 30 (register) · art. 35 (DPIA)"}], "read": {"text": "Bekijk de inhoudsopgave van de AVG: na artikel 5 volgen de hoofdstukken die elk principe uitwerken.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Eerst de structuur, want die helpt je om de hele verordening te lezen. Of een verwerking mag, hangt niet af van één vraag, maar van een reeks afwegingen. Die afwegingen staan opgesomd in artikel vijf, onder de titel beginselen. Eén artikel, zeven principes, en je ziet ze alle zeven op de slide. Kijk ook naar de regel onderaan elke kaart. Daar staat waar de verordening dat principe verder uitwerkt. Rechtmatig wordt uitgewerkt in de rechtsgronden, het stuk dat meteen na de beginselen komt en waar we het in een volgende module over hebben. Transparant wordt uitgewerkt in een heel hoofdstuk over informatieplichten en de rechten van de betrokkene. Doelbinding, minimale gegevensverwerking en opslagbeperking keren terug in de verplichtingen van de verwerkingsverantwoordelijke: het register, gegevensbescherming door ontwerp, de bewaartermijnen. Juistheid en opslagbeperking hebben elk een recht van de betrokkene als tegenhanger: rectificatie en wissing. Integriteit en vertrouwelijkheid worden uitgewerkt in de regels over beveiliging en datalekken. En de verantwoordingsplicht in het register, de risicoanalyse en de algemene verantwoordelijkheid van wie verwerkt. In de rest van deze module houden we dit overzicht bovenaan elke slide, zodat je altijd ziet waar we zitten. Onthoud dus: artikel vijf is de inhoudstafel in het klein. Wie de zeven principes kent, kent de structuur van de AVG."}, {"id": 3, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 0}, "chip": "Principe 1", "title": "Rechtmatig, behoorlijk en transparant", "source": "Artikel 5, lid 1, a AVG", "quote": "Persoonsgegevens moeten: a) worden verwerkt op een wijze die ten aanzien van de betrokkene rechtmatig, behoorlijk en transparant is („rechtmatigheid, behoorlijkheid en transparantie”);", "bullets": [{"k": "Rechtmatig", "t": "in lijn met de wet: niet alleen met de AVG, maar met elke regel die iets over die verwerking zegt, zoals het arbeidsrecht of de camerawet."}, {"k": "Behoorlijk", "t": "fair: geen verrassingen, geen misleiding, geen gebruik van gegevens op een manier die de betrokkene redelijkerwijs niet verwacht."}, {"k": "Transparant", "t": "de betrokkene weet wie zijn gegevens verwerkt, waarom en wat zijn rechten zijn, in duidelijke en eenvoudige taal."}], "read": {"text": "Lees overweging 39 voor de uitleg van de wetgever bij deze drie woorden (zoek naar '(39)').", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Het eerste principe bevat drie woorden. Rechtmatig, behoorlijk en transparant. Rechtmatig betekent: in lijn met de wet. Let op, niet alleen de AVG. Elke regel die iets zegt over die verwerking telt mee. Wie camerabeelden van werknemers gebruikt, moet ook de regels over camerabewaking op het werk naleven. Wie loongegevens verwerkt, ook het sociaal recht. Rechtmatigheid is ruimer dan één wet. Behoorlijk is het woord dat het vaakst wordt overgeslagen. Het betekent: fair. Geen verrassingen voor de betrokkene. Je gebruikt gegevens niet op een manier die iemand redelijkerwijs niet verwacht, ook al zou het strikt genomen mogen. Een voorbeeld: een webshop die uit je bestelgeschiedenis afleidt dat je zwanger bent en je daarop aanspreekt. Technisch misschien te verantwoorden, behoorlijk zeker niet. En transparant: de betrokkene weet wie zijn gegevens verwerkt, waarvoor, en wat hij kan doen. In duidelijke en eenvoudige taal, niet in tien pagina's juridisch proza. Onthoud dus: wettig, fair en open. Alle drie tegelijk."}, {"id": 4, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 1}, "chip": "Principe 2", "title": "Doelbinding: verzamel voor een welbepaald doel, en blijf daarbij", "source": "Artikel 5, lid 1, b AVG", "quote": "voor welbepaalde, uitdrukkelijk omschreven en gerechtvaardigde doeleinden worden verzameld en mogen vervolgens niet verder op een met die doeleinden onverenigbare wijze worden verwerkt; de verdere verwerking met het oog op archivering in het algemeen belang, wetenschappelijk of historisch onderzoek of statistische doeleinden wordt overeenkomstig artikel 89, lid 1, niet als onverenigbaar met de oorspronkelijke doeleinden beschouwd („doelbinding”);", "bullets": [{"k": "Welbepaald en uitdrukkelijk omschreven", "t": "'voor onze dienstverlening' is geen doel; 'om je bestelling te leveren en te factureren' wel."}, {"k": "Niet onverenigbaar verder verwerken", "t": "gegevens die je verzamelde om een bestelling te leveren, gebruik je niet zomaar om een kredietprofiel op te bouwen."}, {"k": "De uitzonderingen", "t": "archivering in het algemeen belang, wetenschappelijk of historisch onderzoek en statistiek gelden niet als onverenigbaar, mits de waarborgen die de verordening oplegt."}], "read": {"text": "Lees ook artikel 6, lid 4: de criteria om te beoordelen of een verder doel verenigbaar is met het oorspronkelijke doel.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Tweede principe: doelbinding. Twee delen. Het eerste: je verzamelt gegevens voor een welbepaald, uitdrukkelijk omschreven en gerechtvaardigd doel. Dat doel moet je vooraf kunnen benoemen. Voor onze dienstverlening is geen doel. Om je bestelling te leveren en te factureren, dat is er een. Het tweede deel: je gebruikt die gegevens nadien niet voor iets wat met dat doel onverenigbaar is. Een ziekenhuis verzamelt gegevens om je te behandelen. Diezelfde gegevens doorgeven aan een verzekeraar die wil weten of je een goed risico bent, dat is onverenigbaar. Nu een nuance die de wetgever zelf maakt. Sommige verdere doelen worden niet als onverenigbaar beschouwd: archivering in het algemeen belang, wetenschappelijk of historisch onderzoek, en statistiek. Dat ziekenhuis mag zijn behandelgegevens dus wel gebruiken voor onderzoek naar de werkzaamheid van een therapie, of voor een jaarlijkse rapportering over het aantal ingrepen. Op voorwaarde dat het de waarborgen naleeft die daarbij horen, zoals pseudonimisering. Onthoud dus: benoem je doel vooraf, en blijf erbij. Onderzoek en statistiek zijn de toegelaten zijpaden."}, {"id": 5, "type": "reveal", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 2}, "chip": "Denkoefening 1", "title": "Het inschrijvingsformulier van de voetbalclub", "question": "De voetbalclub uit de inleiding vraagt bij elke inschrijving verplicht het rijksregisternummer, het beroep van de ouders en een kopie van de identiteitskaart. Het doel is 'de inschrijving van het lid'. Welk principe komt hier in het gedrang?", "verdict": "Minimale gegevensverwerking", "answer": [{"k": "De toets", "t": "welke gegevens heb je nodig om dit doel te bereiken? Voor een inschrijving: naam, contactgegevens, geboortedatum (voor de leeftijdscategorie) en een betaling. Meer niet."}, {"k": "Wie beslist dat", "t": "de verwerkingsverantwoordelijke, hier de club, bepaalt zelf welke gegevens nodig zijn; maar ze moet die keuze kunnen verantwoorden tegenover het doel."}, {"k": "Het beroep van de ouders", "t": "dient het doel niet, dus het mag niet gevraagd worden, ook niet 'voor het geval dat'."}], "script": "Eerste denkoefening, terug naar de voetbalclub. Verplicht op het formulier: het rijksregisternummer, het beroep van de ouders en een kopie van de identiteitskaart. Doel: de inschrijving van het lid. Welk principe komt hier in het gedrang? Denk even na. … Minimale gegevensverwerking, het derde principe. De toets is eenvoudig: welke gegevens heb je nodig om dit doel te bereiken? Voor een inschrijving: naam, contactgegevens, geboortedatum om de leeftijdscategorie te bepalen, en een betaling. Het beroep van de ouders dient dat doel niet. Een kopie van de identiteitskaart ook niet. Wie beslist welke gegevens nodig zijn? De verwerkingsverantwoordelijke, hier de club zelf. Dat is belangrijk: de AVG geeft geen lijstje, de club maakt die keuze. Maar ze moet die keuze kunnen verantwoorden tegenover het doel. En voor het geval dat is geen verantwoording. Onthoud dus: niet wat handig zou kunnen zijn, maar wat nodig is. En wie verwerkt, bepaalt dat én moet het kunnen uitleggen."}, {"id": 6, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 2}, "chip": "Principe 3", "title": "Minimale gegevensverwerking: toereikend, ter zake dienend en beperkt tot wat nodig is", "source": "Artikel 5, lid 1, c AVG", "quote": "toereikend zijn, ter zake dienend en beperkt tot wat noodzakelijk is voor de doeleinden waarvoor zij worden verwerkt („minimale gegevensverwerking”);", "bullets": [{"k": "Toereikend", "t": "genoeg om het doel te bereiken: te weinig gegevens is ook een probleem, want dan werk je met een onvolledig beeld."}, {"k": "Ter zake dienend", "t": "relevant voor het doel; een vraag die er niets mee te maken heeft, hoort niet op het formulier."}, {"k": "Beperkt tot wat noodzakelijk is", "t": "niet 'alles wat ooit nuttig kan zijn', maar wat je nu nodig hebt; de verwerkingsverantwoordelijke bepaalt dat en verantwoordt het."}], "script": "Het principe zelf staat op de slide. Drie woorden: toereikend, ter zake dienend en beperkt tot wat noodzakelijk is. Toereikend betekent: genoeg. Dat vergeet men soms. Wie een lening toekent op basis van een half dossier, verwerkt te weinig en neemt beslissingen op een onvolledig beeld. Ter zake dienend betekent: relevant voor het doel. En beperkt tot wat noodzakelijk is, dat is de kern. Niet alles wat ooit nuttig zou kunnen zijn. Een vuistregel die ik zelf gebruik: leg elk gegeven op je formulier naast je doel en stel de vraag: wat gebeurt er als ik dit niet vraag? Kun je het doel nog bereiken? Dan hoort het er niet op. Onthoud dus: genoeg, relevant, en niet meer dan nodig."}, {"id": 7, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 3}, "chip": "Principe 4", "title": "Juistheid: juist, en zo nodig geactualiseerd", "source": "Artikel 5, lid 1, d AVG", "quote": "juist zijn en zo nodig worden geactualiseerd; alle redelijke maatregelen moeten worden genomen om de persoonsgegevens die, gelet op de doeleinden waarvoor zij worden verwerkt, onjuist zijn, onverwijld te wissen of te rectificeren („juistheid”);", "bullets": [{"k": "Juist", "t": "een fout adres, een verkeerde geboortedatum of een achterhaalde diagnose in een dossier zijn geen detail: er worden beslissingen op gebaseerd."}, {"k": "Zo nodig geactualiseerd", "t": "niet elk gegeven moet continu bijgewerkt worden; een historisch feit blijft wat het was, een huidige situatie moet kloppen."}, {"k": "Redelijke maatregelen", "t": "wie een fout ontdekt, verbetert of wist ze onverwijld; de betrokkene heeft daarvoor een recht op rectificatie."}], "script": "Vierde principe: juistheid. Gegevens moeten juist zijn en, zo nodig, geactualiseerd. Waarom is dat een principe en geen vanzelfsprekendheid? Omdat er beslissingen op gebaseerd worden. Een verkeerd adres, en de aanmaning komt nooit aan maar de boete loopt op. Een achterhaalde diagnose in een dossier, en iemand krijgt de verkeerde behandeling. Een fout kredietscore, en een lening wordt geweigerd. Let op het woordje zo nodig. Niet elk gegeven moet permanent bijgewerkt worden. Dat je in tweeduizend tien in Brussel woonde, blijft juist als historisch feit. Maar je huidige adres moet kloppen als iemand je post stuurt. En het laatste deel: wie een fout ontdekt, moet ze onverwijld verbeteren of wissen. De betrokkene heeft daar trouwens een recht voor, het recht op rectificatie, dat later aan bod komt. Onthoud dus: juist waar het ertoe doet, en snel verbeterd waar het fout is."}, {"id": 8, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 4}, "chip": "Principe 5", "title": "Opslagbeperking: niet langer identificeerbaar bewaren dan nodig voor het doel", "source": "Artikel 5, lid 1, e AVG", "quote": "worden bewaard in een vorm die het mogelijk maakt de betrokkenen niet langer te identificeren dan voor de doeleinden waarvoor de persoonsgegevens worden verwerkt noodzakelijk is; persoonsgegevens mogen voor langere perioden worden opgeslagen voor zover de persoonsgegevens louter met het oog op archivering in het algemeen belang, wetenschappelijk of historisch onderzoek of statistische doeleinden worden verwerkt overeenkomstig artikel 89, lid 1, mits de bij deze verordening vereiste passende technische en organisatorische maatregelen worden getroffen om de rechten en vrijheden van de betrokkene te beschermen („opslagbeperking”);", "bullets": [{"k": "In een vorm die identificatie mogelijk maakt", "t": "het principe gaat over herkenbare gegevens; wissen of anonimiseren zijn allebei een uitweg."}, {"k": "Niet langer dan nodig voor het doel", "t": "elk doel heeft een einddatum: zolang het lidmaatschap loopt, zolang een geschil mogelijk is, zolang de wet een bewaartermijn oplegt."}, {"k": "De uitzonderingen", "t": "archivering in het algemeen belang, onderzoek en statistiek mogen langer, met de waarborgen die de verordening oplegt."}], "read": {"text": "Lees de letterlijke tekst van het principe van opslagbeperking in artikel 5, lid 1, e.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Vijfde principe: opslagbeperking. Lees de tekst op de slide. Persoonsgegevens worden bewaard in een vorm die het mogelijk maakt de betrokkene te identificeren, niet langer dan nodig is voor het doel. Drie dingen vallen op. Eén: het gaat over herkenbare gegevens. Je hebt dus twee uitwegen als het doel bereikt is: wissen, of anonimiseren. Geanonimiseerde cijfers mag je houden. Twee: niet langer dan nodig voor het doel. Elk doel heeft een einddatum. Zolang het lidmaatschap loopt. Zolang een geschil over een factuur nog mogelijk is. Zolang de wet je verplicht om iets te bewaren, zoals de boekhouding. Die termijn moet je per doel kunnen benoemen, en dat is precies wat straks in het register terugkomt. Drie: ook hier zijn archivering, onderzoek en statistiek de toegelaten uitzonderingen, met waarborgen. Terug naar de voetbalclub. Een lid dat tien jaar geleden vertrok, staat nog altijd in het ledenbestand, met adres, geboortedatum en medische fiche. Het doel, het lidmaatschap beheren, is al tien jaar bereikt. Onthoud dus: elk doel heeft een einddatum, en op die datum stopt het bewaren van herkenbare gegevens."}, {"id": 9, "type": "compare", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 4}, "chip": "Principe 5", "title": "Opslagbeperking is niet hetzelfde als minimale gegevensverwerking", "left": {"head": "Minimale gegevensverwerking", "items": ["Gaat over wélke gegevens je verzamelt", "De vraag: heb ik dit gegeven nodig voor mijn doel?", "Speelt bij het ontwerp van je formulier of je systeem", "Voorbeeld: het beroep van de ouders hoort niet op het inschrijvingsformulier"]}, "right": {"head": "Opslagbeperking", "items": ["Gaat over hoe láng je gegevens bewaart", "De vraag: is dit doel al bereikt, en mag ik het gegeven dan nog bijhouden?", "Speelt tijdens de hele levensduur van de gegevens", "Voorbeeld: de gegevens van een lid dat tien jaar geleden vertrok, horen niet meer in het ledenbestand"]}, "script": "Nu het verschil, want opslagbeperking wordt voortdurend verward met minimale gegevensverwerking. Kijk naar de twee kolommen. Minimale gegevensverwerking gaat over welke gegevens je verzamelt. Opslagbeperking gaat over hoe lang je ze bewaart. De eerste vraag stel je bij het ontwerp van je formulier: heb ik dit nodig? De tweede vraag stel je tijdens de hele levensduur van de gegevens: is het doel bereikt, en mag ik ze dan nog bijhouden? Terug naar de voetbalclub. Dat ze het beroep van de ouders vragen, is een probleem van minimale gegevensverwerking. Dat ze de gegevens van leden die tien jaar geleden vertrokken zijn nog altijd in hun bestand hebben, is een probleem van opslagbeperking. Twee verschillende fouten, twee verschillende principes. Onthoud dus: minimaal gaat over wat, opslagbeperking over hoe lang."}, {"id": 10, "type": "reveal", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 4}, "chip": "Denkoefening 2", "title": "De voetbalclub: twee fouten, twee principes", "question": "Twee situaties bij dezelfde voetbalclub. Eén: de club bewaart de volledige dossiers van alle oud-leden voor altijd, ook de medische fiches, 'omdat het ooit nuttig kan zijn als iemand terugkomt'. Twee: voor de nieuwsbrief kopieert de secretaris het hele ledenbestand, met adres, geboortedatum en medische fiche, naar het mailprogramma. Welk principe is telkens in het gedrang, en wat zou een correcte aanpak zijn?", "verdict": "Eén: opslagbeperking. Twee: minimale gegevensverwerking.", "answer": [{"k": "De oud-leden", "t": "opslagbeperking: het doel, het lidmaatschap beheren, is bereikt; 'ooit nuttig' is geen doel. Correct: een bewaartermijn per doel vastleggen, daarna wissen of anonimiseren."}, {"k": "De nieuwsbrief", "t": "minimale gegevensverwerking: om een nieuwsbrief te sturen heb je een naam en een e-mailadres nodig, meer niet. Correct: alleen die twee gegevens naar het mailprogramma."}, {"k": "Wat wél mag", "t": "geanonimiseerde cijfers bijhouden, bijvoorbeeld hoeveel leden per seizoen vertrekken, want daar is niemand meer in te herkennen."}], "script": "Tweede denkoefening, bij dezelfde voetbalclub. Twee situaties. Eén: de club bewaart de volledige dossiers van alle oud-leden voor altijd, ook de medische fiches. Het kan ooit nuttig zijn als iemand terugkomt, zegt de secretaris. Twee: voor de nieuwsbrief kopieert diezelfde secretaris het hele ledenbestand naar het mailprogramma. Adres, geboortedatum, medische fiche, alles. Welk principe is telkens in het gedrang, en wat zou beter zijn? Denk even na. … De oud-leden: opslagbeperking. Het doel van dat dossier was het lidmaatschap beheren. Dat doel is bereikt. Ooit nuttig is geen doel, en dus geen reden om herkenbare gegevens bij te houden. Correct is: een bewaartermijn per doel vastleggen, bijvoorbeeld tot het einde van het seizoen na het vertrek, en daarna wissen of anonimiseren. De nieuwsbrief: minimale gegevensverwerking. Welke gegevens heb je nodig om een nieuwsbrief te sturen? Een naam en een e-mailadres. Niet het adres, niet de geboortedatum, en zeker niet de medische fiche. Correct is: alleen die twee gegevens in het mailprogramma. En let op wat wél mag: cijfers bijhouden over hoeveel leden per seizoen vertrekken, zolang daar niemand meer in te herkennen is. Onthoud dus: bij elk gegeven twee vragen. Heb ik dit nodig? En hoelang?"}, {"id": 11, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 5}, "chip": "Principe 6", "title": "Integriteit en vertrouwelijkheid: passende beveiliging", "source": "Artikel 5, lid 1, f AVG", "quote": "door het nemen van passende technische of organisatorische maatregelen op een dusdanige manier worden verwerkt dat een passende beveiliging ervan gewaarborgd is, en dat zij onder meer beschermd zijn tegen ongeoorloofde of onrechtmatige verwerking en tegen onopzettelijk verlies, vernietiging of beschadiging („integriteit en vertrouwelijkheid”).", "bullets": [{"k": "Integriteit", "t": "de gegevens blijven correct en volledig: niemand kan ze ongemerkt wijzigen, en ze gaan niet verloren of kapot (back-ups, controle op wijzigingen, bescherming tegen een crash)."}, {"k": "Vertrouwelijkheid", "t": "alleen wie het nodig heeft, kan erbij: toegangsrechten, wachtwoorden, versleuteling, een discreet gesprek aan de balie."}, {"k": "Technologieneutraal, maar hier komt cyberveiligheid binnen", "t": "de AVG schrijft geen technologie voor; ze eist maatregelen die passen bij het risico. Dit principe is de plaats waar cyberveiligheid (toegangsbeheer, versleuteling, back-ups, updates) deel wordt van gegevensbescherming."}], "read": {"text": "Lees artikel 32 over de beveiliging van de verwerking: dezelfde twee woorden, verder uitgewerkt.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Zesde principe: integriteit en vertrouwelijkheid. Twee woorden die vaak samen worden uitgesproken alsof het er één is. Het zijn er twee. Integriteit betekent dat de gegevens correct en volledig blijven. Niemand kan ze ongemerkt wijzigen, en ze gaan niet verloren. Een voorbeeld: een medewerker past per ongeluk de dosering in een patiëntendossier aan, en niemand merkt het. Of een server crasht en er is geen back-up van de boekhouding. Dat zijn problemen van integriteit. Niemand heeft iets gezien wat hij niet mocht zien, en toch is het mis. Vertrouwelijkheid betekent dat alleen wie het nodig heeft, erbij kan. Toegangsrechten, wachtwoorden, versleuteling. Maar ook: een gesprek aan de balie dat de hele wachtzaal kan volgen, is een probleem van vertrouwelijkheid, zonder één computer. Nog een belangrijk punt: de AVG is technologieneutraal. Ze zegt niet welke software of welke versleuteling je moet gebruiken. Ze zegt: passende maatregelen, passend bij het risico. Hoe je dat invult, komt in de regels over beveiliging, die verder in de verordening staan. En dit is meteen de plaats waar cyberveiligheid de AVG binnenkomt. Toegangsbeheer, versleuteling, back-ups, updates van je systemen, de opleiding van je medewerkers: dat zijn geen zaken van de IT-dienst alleen. Het zijn maatregelen waarmee je dit principe naleeft, en bij een datalek is het precies dit principe dat geschonden is. Onthoud dus: integriteit is dat het klopt, vertrouwelijkheid is dat het niet lekt, en cyberveiligheid is hoe je dat waarmaakt."}, {"id": 12, "type": "reveal", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 5}, "chip": "Denkoefening 3", "title": "Integriteit of vertrouwelijkheid?", "question": "Drie situaties. Eén: een laptop met het ledenbestand wordt gestolen uit een auto. Twee: door een softwarefout worden de geboortedata van alle leden met een jaar verschoven. Drie: een vrijwilliger mailt de ledenlijst naar zijn privé-adres om thuis verder te werken. Welk aspect is telkens geraakt?", "verdict": "Eén en drie: vertrouwelijkheid. Twee: integriteit.", "answer": [{"k": "De gestolen laptop", "t": "vertrouwelijkheid: onbevoegden kunnen bij de gegevens; of de laptop versleuteld was, bepaalt hoe erg het is."}, {"k": "De verschoven geboortedata", "t": "integriteit: niemand heeft iets gezien, maar de gegevens kloppen niet meer en er worden beslissingen op gebaseerd (leeftijdscategorieën, verzekering)."}, {"k": "De vrijwilliger", "t": "vertrouwelijkheid: de gegevens verlaten de beveiligde omgeving van de club, ook al is de bedoeling goed."}], "script": "Derde denkoefening, om die twee woorden vast te zetten. Drie situaties. Eén: een laptop met het ledenbestand wordt gestolen uit een auto. Twee: door een softwarefout schuiven de geboortedata van alle leden een jaar op. Drie: een vrijwilliger mailt de ledenlijst naar zijn privé-adres om thuis verder te werken. Welk aspect is telkens geraakt? Denk even na. … De gestolen laptop: vertrouwelijkheid. Onbevoegden kunnen bij de gegevens. Of de schijf versleuteld was, bepaalt hoe erg dat is. De verschoven geboortedata: integriteit. Niemand heeft iets gezien, maar de gegevens kloppen niet meer, en de club deelt leden in de verkeerde leeftijdscategorie in. De vrijwilliger: vertrouwelijkheid. De bedoeling is goed, maar de gegevens verlaten de beveiligde omgeving van de club en komen op een privémailbox terecht waar niemand toezicht op heeft. Onthoud dus: bij elk incident stel je de vraag: is er iets gelekt, of is er iets veranderd of verloren? Vaak allebei."}, {"id": 13, "type": "quote", "nav": {"items": ["Rechtmatig, behoorlijk, transparant", "Doelbinding", "Minimale gegevens", "Juistheid", "Opslagbeperking", "Integriteit & vertrouwelijkheid", "Verantwoording"], "active": 6}, "chip": "Principe 7", "title": "Verantwoordingsplicht: naleven én kunnen aantonen", "source": "Artikel 5, lid 2 AVG", "quote": "De verwerkingsverantwoordelijke is verantwoordelijk voor de naleving van lid 1 en kan deze aantonen („verantwoordingsplicht”).", "bullets": [{"k": "Twee werkwoorden", "t": "de verwerkingsverantwoordelijke moet de principes naleven én kunnen aantonen dat hij ze naleeft; het tweede is nieuw tegenover de oude richtlijn."}, {"k": "Hoe je dat aantoont", "t": "een register van verwerkingen, een privacyverklaring, vastgelegde bewaartermijnen, een beveiligingsbeleid, een risicoanalyse waar nodig: de verplichtingen die verderop in de AVG staan."}, {"k": "Waarom het ertoe doet", "t": "zonder documentatie kan een toezichthouder alleen vaststellen dat iets misliep; met documentatie kan hij nagaan of de organisatie haar werk deed. Dat maakt toezicht mogelijk."}], "read": {"text": "Lees artikel 24 over de verantwoordelijkheid van de verwerkingsverantwoordelijke: daar begint de uitwerking van dit principe.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "En dan het zevende principe, in een apart lid: de verantwoordingsplicht. In het Engels accountability. Lees de zin op de slide. Twee werkwoorden. De verwerkingsverantwoordelijke is verantwoordelijk voor de naleving, én kan die aantonen. Dat tweede is de vernieuwing. Onder de oude richtlijn moest je de regels ook naleven, maar je hoefde niet te bewijzen dat je het deed. Het gevolg: een toezichthouder die binnenkwam, kon alleen vaststellen dat er iets was misgelopen. Hij kon niet nagaan of de organisatie haar werk gedaan had. Toezicht was daardoor moeilijk, en vaak pas mogelijk na een incident. De AVG draait dat om. Je moet kunnen laten zien wat je gedaan hebt. Hoe? Met de verplichtingen die verderop in de verordening staan: een register van je verwerkingen, een privacyverklaring, vastgelegde bewaartermijnen, een beveiligingsbeleid, en waar nodig een risicoanalyse. Elk van die documenten is een stukje bewijs. Terug naar de voetbalclub. Als de toezichthouder morgen aanbelt en vraagt: waarom vraagt u het rijksregisternummer, en hoelang bewaart u dat? Dan is ik weet het niet geen antwoord meer. Onthoud dus: naleven volstaat niet, je moet het kunnen tonen. Dat is wat toezicht mogelijk maakt."}, {"id": 14, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "Artikel 5 is de kapstok van de AVG: zeven principes die samen bepalen of een verwerking mag, elk verder uitgewerkt in de rest van de verordening, en de verwerkingsverantwoordelijke moet ze niet alleen naleven maar ook kunnen aantonen.", "bullets": [{"k": "Rechtmatig, behoorlijk, transparant", "t": "wettig volgens elke toepasselijke regel, fair zonder verrassingen, en open in duidelijke taal."}, {"k": "Doelbinding en minimale gegevensverwerking", "t": "benoem je doel vooraf en blijf erbij; verzamel alleen wat voor dat doel nodig is, en verantwoord die keuze."}, {"k": "Juistheid en opslagbeperking", "t": "gegevens kloppen waar het ertoe doet; elk doel heeft een einddatum, daarna wissen of anonimiseren."}, {"k": "Integriteit, vertrouwelijkheid en verantwoording", "t": "het klopt en het lekt niet, met passende maatregelen; en je kunt aantonen dat je dit alles doet."}], "script": "Wat neem je mee? Eén kernzin: artikel vijf is de kapstok van de AVG. Zeven principes die samen bepalen of een verwerking mag, elk verder uitgewerkt in de rest van de verordening. En wie verwerkt, moet ze niet alleen naleven, maar ook kunnen aantonen. Dan de principes zelf, in vier groepen. Rechtmatig, behoorlijk en transparant: wettig, fair en open. Doelbinding en minimale gegevensverwerking: benoem je doel vooraf, blijf erbij, en verzamel alleen wat daarvoor nodig is. Juistheid en opslagbeperking: gegevens kloppen waar het ertoe doet, en elk doel heeft een einddatum. Integriteit en vertrouwelijkheid: het klopt en het lekt niet. En de verantwoordingsplicht als sluitstuk. Voor je naar de oefenvragen gaat, één opdracht. Zet de audio stil en neem een formulier of een bestand uit je eigen organisatie. Leg elk gegeven naast het doel en stel twee vragen: heb ik dit nodig, en hoelang? Grote kans dat je minstens één vakje schrapt. Daarna zijn er tien vragen om te toetsen of je de principes herkent."}], "quiz": [{"q": "Waarom wordt artikel 5 van de AVG de 'kapstok' van de verordening genoemd?", "options": ["Omdat het de enige bepaling is die rechtstreeks sancties bevat voor wie de regels niet naleeft.", "Omdat het de principes opsomt die de rest van de verordening uitwerkt.", "Omdat het de definities bevat die in alle andere artikelen van de verordening worden gebruikt.", "Omdat het als enige artikel ook geldt voor verwerkingen in de huishoudelijke sfeer."], "answer": 1, "feedback": ["Sancties staan elders in de verordening; artikel 5 bevat de principes, niet de boetes.", "Juist. Rechtmatigheid, transparantie, beveiliging en verantwoording krijgen elk hun eigen hoofdstuk verderop.", "De definities staan in artikel 4; artikel 5 bevat de beginselen van de verwerking.", "De huishoudelijke uitzondering haalt een verwerking volledig buiten de AVG, ook buiten artikel 5."]}, {"q": "Een webshop leidt uit het aankoopgedrag van een klant af dat zij zwanger is en stuurt haar ongevraagd babyreclame. Welk onderdeel van het eerste principe komt hier het meest in het gedrang?", "options": ["Rechtmatigheid, want de webshop heeft geen vergunning om aan marketing te doen.", "Transparantie, want de webshop heeft geen privacyverklaring.", "Geen enkel: aankoopgegevens mag een webshop vrij analyseren voor eigen marketing.", "Behoorlijkheid, want de klant verwacht zo'n gebruik van haar aankopen niet."], "answer": 3, "feedback": ["Voor marketing is geen vergunning nodig; het probleem ligt niet in een ontbrekende toelating.", "Of er een privacyverklaring is, weten we niet; het kernprobleem is de onverwachte en indringende afleiding uit de gegevens.", "Ook aankoopgegevens zijn persoonsgegevens en elke verwerking moet behoorlijk zijn.", "Juist. Behoorlijk betekent fair: geen gebruik dat de betrokkene redelijkerwijs niet verwacht, ook al zou het technisch kunnen."]}, {"q": "Een ziekenhuis verzamelt gegevens om patiënten te behandelen. Welke verdere verwerking beschouwt de AVG uitdrukkelijk als niet onverenigbaar met dat doel?", "options": ["De gegevens doorgeven aan een verzekeraar die het risicoprofiel van de patiënt wil kennen.", "De gegevens verkopen aan een farmaceutisch bedrijf voor gerichte reclame.", "De gegevens gebruiken voor wetenschappelijk onderzoek of statistiek.", "De gegevens gebruiken om de prestaties van het eigen personeel te beoordelen."], "answer": 2, "feedback": ["Een verzekeraar informeren over het risicoprofiel is een ander doel dat de patiënt niet verwacht; dat is onverenigbaar.", "Verkoop voor reclame heeft niets met behandeling te maken en is onverenigbaar met het oorspronkelijke doel.", "Juist. Archivering in het algemeen belang, wetenschappelijk of historisch onderzoek en statistiek gelden niet als onverenigbaar, mits de waarborgen die de verordening oplegt.", "Personeelsbeoordeling is een ander doel; patiëntgegevens zijn daarvoor niet verzameld."]}, {"q": "Wie bepaalt welke gegevens nodig zijn om een doel te bereiken, in de zin van het principe van minimale gegevensverwerking?", "options": ["De verwerkingsverantwoordelijke, die die keuze moet kunnen verantwoorden.", "De toezichthouder, die per sector een lijst van toegelaten gegevens publiceert.", "De betrokkene, die zelf aangeeft welke gegevens hij wel en niet wil delen.", "De verwerker, omdat die de technische systemen beheert en de gegevens opslaat."], "answer": 0, "feedback": ["Juist. De verwerkingsverantwoordelijke beslist welke gegevens nodig zijn, en moet die keuze kunnen uitleggen; 'voor het geval dat' volstaat niet.", "De AVG bevat geen lijsten per sector; de keuze ligt bij wie verwerkt, onder toezicht achteraf.", "De betrokkene kan weigeren, maar bepaalt niet wat nodig is voor het doel van de organisatie.", "De verwerker voert uit in opdracht; de keuze van doel en middelen ligt bij de verwerkingsverantwoordelijke."]}, {"q": "Wat is het verschil tussen minimale gegevensverwerking en opslagbeperking?", "options": ["Er is geen verschil: beide gaan over het beperken van de hoeveelheid gegevens die je verwerkt.", "Het eerste gaat over welke gegevens je verzamelt, het tweede over hoe lang je ze bewaart.", "Minimale gegevensverwerking geldt voor papier, opslagbeperking voor digitale gegevens.", "Minimale gegevensverwerking geldt voor bedrijven, opslagbeperking alleen voor overheden."], "answer": 1, "feedback": ["Het zijn twee verschillende principes met twee verschillende vragen: 'wat' en 'hoe lang'.", "Juist. De eerste vraag stel je bij het ontwerp van je formulier, de tweede tijdens de hele levensduur van de gegevens.", "Beide principes gelden voor elke drager, papier of digitaal.", "Beide principes gelden voor elke verwerkingsverantwoordelijke, bedrijf of overheid."]}, {"q": "Een vereniging bewaart de volledige gegevens van leden die meer dan tien jaar geleden vertrokken, 'omdat je nooit weet'. Wat is een correcte aanpak volgens het principe van opslagbeperking?", "options": ["De gegevens verder bewaren, maar in een apart bestand met beperkte toegang.", "De gegevens bewaren zolang de vereniging bestaat, want ze zijn ooit rechtmatig verzameld.", "De oud-leden elk jaar om toestemming vragen om de gegevens te mogen bewaren.", "Een bewaartermijn per doel vastleggen en de gegevens daarna wissen of anonimiseren."], "answer": 3, "feedback": ["Beperkte toegang is een beveiligingsmaatregel, maar lost niet op dat de gegevens langer dan nodig identificeerbaar bewaard blijven.", "Dat de verzameling ooit rechtmatig was, geeft geen recht om identificeerbare gegevens eindeloos te bewaren.", "Toestemming vragen voor iets wat geen doel meer dient, is geen oplossing; het doel zelf is weggevallen.", "Juist. Elk doel heeft een einddatum; daarna blijven alleen geanonimiseerde gegevens (bijvoorbeeld voor statistiek) bewaard."]}, {"q": "Door een softwarefout worden alle geboortedata in een ledenbestand met een jaar verschoven; niemand buiten de organisatie heeft de gegevens gezien. Welk aspect van het beveiligingsprincipe is geraakt?", "options": ["Integriteit, want de gegevens kloppen niet meer.", "Vertrouwelijkheid, want een softwarefout is altijd een lek.", "Geen van beide, want er is geen onbevoegde toegang geweest.", "Transparantie, want de leden zijn niet over de fout geïnformeerd."], "answer": 0, "feedback": ["Juist. Integriteit betekent dat gegevens correct en volledig blijven; een ongemerkte wijziging of verlies is een integriteitsprobleem.", "Er is niets gelekt; vertrouwelijkheid gaat over wie erbij kan, niet over fouten in de inhoud.", "Beveiliging gaat niet alleen over toegang: ook ongewenste wijziging, verlies of beschadiging valt eronder.", "Of de leden geïnformeerd moeten worden, is een vervolgvraag; het incident zelf raakt de integriteit van de gegevens."]}, {"q": "Wat bedoelt men wanneer men zegt dat de AVG 'technologieneutraal' is op het vlak van beveiliging?", "options": ["De AVG geldt niet voor gegevens die met nieuwe, nog niet gereglementeerde technologie worden verwerkt.", "De AVG verplicht versleuteling voor alle persoonsgegevens, ongeacht de technologie.", "De AVG schrijft geen technologie voor, maar eist maatregelen die passen bij het risico.", "De AVG laat de keuze van beveiliging volledig aan de verwerker over."], "answer": 2, "feedback": ["Integendeel: de AVG geldt ongeacht de technologie, ook voor de nieuwste.", "Versleuteling is een mogelijke maatregel, geen algemene verplichting voor alle gegevens.", "Juist. De verordening noemt geen producten of technieken; ze eist passende technische en organisatorische maatregelen, afgestemd op het risico.", "De verwerkingsverantwoordelijke blijft verantwoordelijk voor passende beveiliging, ook als een verwerker ze uitvoert."]}, {"q": "Wat voegt de verantwoordingsplicht toe tegenover de oude richtlijn?", "options": ["De verplichting om de principes na te leven, die onder de richtlijn nog niet bestond.", "De verplichting om elke verwerking vooraf aan de toezichthouder te melden.", "De verplichting om voor elke verwerking een advocaat of jurist aan te stellen.", "De verplichting om te kunnen aantonen dat je de principes naleeft."], "answer": 3, "feedback": ["De principes zelf bestonden grotendeels al onder de richtlijn; nieuw is het moeten aantonen.", "Een algemene voorafgaande melding bestond net onder de richtlijn en is door de AVG afgeschaft.", "De AVG verplicht geen advocaat; in bepaalde gevallen wel een functionaris voor gegevensbescherming, wat iets anders is.", "Juist. 'Kan deze aantonen' is de vernieuwing: register, privacyverklaring, bewaartermijnen en beveiligingsbeleid zijn het bewijs."]}, {"q": "Waarom maakt de verantwoordingsplicht het toezicht gemakkelijker?", "options": ["Omdat de toezichthouder dan geen eigen onderzoek meer hoeft te voeren bij een klacht.", "Omdat de toezichthouder aan de documentatie kan zien of de organisatie haar werk deed.", "Omdat organisaties met documentatie automatisch vrijgesteld zijn van boetes.", "Omdat de betrokkene dan geen klacht meer kan indienen bij de toezichthouder."], "answer": 1, "feedback": ["De toezichthouder onderzoekt nog altijd, maar heeft nu iets om op te steunen.", "Juist. Onder de richtlijn kon de toezichthouder vaak alleen vaststellen dat iets misliep; met register, beleid en analyses kan hij nu de werking zelf beoordelen.", "Documentatie is geen vrijgeleide; ze toont wel dat de organisatie zorgvuldig was, wat meeweegt.", "Het klachtrecht van de betrokkene blijft volledig bestaan."]}]}</script>

      case 'bullets': body = bullets(s.bullets); break;
      case 'compare':
        body = '<div class="compare">'+[s.left,s.right].map(c=>'<div class="col"><h3>'+esc(c.head)+'</h3><ul>'+c.items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>').join('')+'</div>'; break;

      case 'chain':
        body = '<div class="chain">'+s.steps.map((t,n)=>'<div class="st"><div class="n">'+(n+1)+'</div><b>'+esc(t.k)+'</b><span>'+esc(t.t)+'</span></div>').join('')+'</div>'; break;
      case 'practice':
        body = '<div class="intro">'+esc(s.intro)+'</div><div class="practice"><ol>'+s.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="side"><a class="btn" target="_blank" rel="noopener" href="'+esc(s.url)+'">'+esc(s.url_label)+' ↗</a><div class="hint">'+esc(U.practice_hint)+'</div></div></div>'; break;
      case 'quote':
        body = '<div class="quote"><div class="src">'+esc(s.source)+'</div><div class="txt">'+esc(s.quote).replace(/\n/g,'<br>')+'</div></div>'+(s.bullets?bullets(s.bullets):''); break;
      case 'reveal':
        body = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; break;
      case 'summary':
        body = '<div class="keyline">'+esc(s.key)+'</div>'+bullets(s.bullets); break;
      case 'cards':
        /* s.cards: [{k, t, sub, hl}], s.cols (aantal kolommen), optioneel s.intro */
        body = (s.intro?'<p class="intro" style="font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.2vw,14px);color:var(--text)">'+esc(s.intro)+'</p>':'')+'<div class="cards'+(s.cards.length>6?' dense':'')+'" style="grid-template-columns:repeat('+(s.cols||Math.min(s.cards.length,4))+',minmax(0,1fr))">'+s.cards.map((c,n)=>'<div class="cd'+(c.hl?' hl':'')+'">'+(s.numbered===false?'':'<div class="n">'+(n+1)+'</div>')+'<b>'+esc(c.k)+'</b>'+(c.t?'<span>'+esc(c.t)+'</span>':'')+(c.sub?'<div class="sub">'+esc(c.sub)+'</div>':'')+'</div>').join('')+'</div>'; break;

      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+(s.question?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
