e.", "result_mid": "Bonne progression. Relisez le retour des questions manquées et réessayez.", "result_low": "Revoyez la présentation, puis réessayez. Le retour sur chaque question vous aidera.", "retry": "Recommencer les exercices", "review": "Revoir la présentation", "your_answer": "Votre réponse", "open_link": "Ouvrir le lien dans un nouvel onglet", "practice_hint": "Exercice pratique : mettez en pause, suivez les étapes, puis cliquez sur Suivant.", "back_to_slides": "Retour aux diapositives", "resume_quiz": "Reprendre les exercices", "download_pdf": "Télécharger votre résultat en PDF", "pdf_title": "Résultat des exercices", "pdf_question": "Question", "pdf_your": "Votre réponse", "pdf_correct": "Réponse correcte", "pdf_feedback": "Retour", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "sans réponse", "transcript": "Texte parlé", "show_text": "Afficher le texte", "hide_text": "Masquer le texte", "ai_notice_title": "Transparence sur l'IA", "ai_notice": "La voix de ce module a été générée par IA à partir de la voix de Peter Berghmans, avec son consentement. Le texte et les diapositives ont été réalisés avec l'aide de l'IA et relus sur le fond par le formateur.", "ai_voice_label": "Voix IA", "ai_icon_alt": "Label officiel de l'UE : contenu généré par IA", "ai_footer": "Voix générée par IA (avec l'accord de l'orateur) ; texte et diapositives réalisés avec l'aide de l'IA et relus par l'enseignant.", "skip_to_quiz": "Aller directement aux exercices", "nav_home": "Accueil", "nav_slides": "Présentation", "nav_quiz": "Exercices", "speed": "Vitesse", "reveal_question": "Qu'en pensez-vous ?", "reveal_show": "Afficher la réponse", "optional_label": "Approfondissement (facultatif)", "optional_skip": "Passer l'approfondissement", "optional_intro": "Les diapositives suivantes sont un approfondissement facultatif. Vous pouvez les passer et aller directement aux exercices.", "autoplay_short": "Auto", "read_label": "Ouvrir le RGPD sur EUR-Lex", "deep_label": "Approfondissement", "deep_btn": "Ouvrir l'approfondissement"}, "slides": [{"id": 1, "type": "title", "title": "Le délégué à la protection des données : désignation, position et missions", "subtitle": "Chapitre IV, quatrième groupe d'obligations : quand un DPO est obligatoire, comment le désigner sans conflit d'intérêts, ce qui protège sa position, ce qu'il fait et comment il se situe par rapport à l'autorité de contrôle", "script": "Une banque de taille moyenne désigne son chef de l'audit, du risque et de la conformité comme délégué à la protection des données. Un choix logique, estime la direction : il connaît les processus, il siège déjà à chaque réunion, et il ne coûte rien de plus. Trois ans plus tard, l'autorité de contrôle inflige cinquante mille euros d'amende. Pas à cause d'une fuite de données, ni parce que l'homme faisait mal son travail, mais parce que, comme chef de ces services, il déterminait lui-même comment les données étaient traitées, et ne pouvait donc pas contrôler de façon indépendante ses propres décisions. C'est le sujet de ce module : le délégué à la protection des données, le DPO, le quatrième groupe d'obligations du chapitre sur le responsable du traitement et le sous-traitant. Trois articles, trois questions. Quand devez-vous désigner un DPO, et comment le choisir ? Quelle position doit-il recevoir, et qu'est-ce qu'un conflit d'intérêts ? Et quelles sont ses missions, que fait l'organisation de ses avis, et comment coopère-t-il avec l'autorité de contrôle ? Vous suivez cette formation pour exercer vous-même cette fonction ; à la fin, vous saurez donc aussi ce que vous pouvez attendre de votre organisation."}, {"id": 2, "type": "table", "chip": "La vue d'ensemble", "title": "Chapitre IV : quatre groupes d'obligations, aujourd'hui le quatrième", "head": ["Groupe", "Sur quoi", "Articles"], "rows": [["1 · Mesures techniques et organisationnelles", "politique de protection des données, privacy by design et by default, registre des activités de traitement, sécurité technique et organisationnelle, notification des violations", "24, 25, 30, 32, 33, 34"], ["2 · Collaboration avec d'autres parties", "responsables conjoints du traitement, le sous-traitant et le contrat de sous-traitance, traitement sous l'autorité, coopération avec l'autorité de contrôle", "26, 28, 29, 31"], ["3 · Traitements à haut risque", "analyse d'impact relative à la protection des données et consultation préalable", "35, 36"], ["4 · Le délégué à la protection des données", "désignation, position et missions du DPO", "37, 38, 39"]], "hl": [3], "read": {"text": "Lisez l'article 5, paragraphe 2 : le DPO est l'un des moyens par lesquels le responsable du traitement garantit et peut démontrer le respect du règlement.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "D'abord la place dans l'ensemble. Nous divisons le chapitre sur les obligations en quatre groupes : les mesures techniques et organisationnelles, la collaboration avec d'autres parties, les obligations en cas de haut risque, et le délégué à la protection des données. Dans ce module, nous traitons le quatrième groupe, surligné dans le tableau : la désignation, la position et les missions du DPO, aux articles 37, 38 et 39. Ce groupe aussi découle de la responsabilité inscrite dans les principes : le responsable du traitement doit garantir le respect du règlement et pouvoir le démontrer. Un DPO est un instrument pour cela, et un instrument particulier. Les autres mesures du chapitre sont des documents, des procédures et de la technique. Le DPO est une personne, avec une position légale propre au sein de l'organisation, qui conseille l'organisation et la contrôle, et qui est, pour les personnes concernées et l'autorité de contrôle, le visage de la protection des données. Le règlement protège cette position, et c'est unique : pour aucune autre fonction dans une organisation, il ne prescrit que quelqu'un ne peut recevoir d'instructions ni être licencié pour l'exercice de sa mission. Retenez donc : le DPO est la seule obligation de ce chapitre qui soit une personne, et le règlement protège cette personne pour concrétiser la responsabilité."}, {"id": 3, "type": "cards", "chip": "Trois articles", "title": "Désignation, position, missions : la structure des trois articles", "cols": 3, "cards": [{"k": "Désignation", "t": "quand un DPO est obligatoire (autorité publique, suivi à grande échelle, catégories particulières à grande échelle) ; un seul DPO pour un groupe ou pour plusieurs autorités publiques ; désigné sur la base de ses connaissances spécialisées ; interne ou externe ; publier ses coordonnées et les communiquer à l'autorité de contrôle.", "sub": "Article 37"}, {"k": "Position", "t": "associé en temps utile à tout ce qui touche à la protection des données ; soutenu par un accès et des ressources ; aucune instruction, pas de licenciement ni de sanction pour ses missions ; fait rapport au niveau le plus élevé de la direction ; point de contact pour les personnes concernées ; secret ; d'autres missions uniquement sans conflit d'intérêts.", "sub": "Article 38"}, {"k": "Missions", "t": "informer et conseiller ; contrôler le respect du règlement, y compris la répartition des responsabilités, la sensibilisation, la formation et les audits ; conseiller sur l'analyse d'impact ; coopérer avec l'autorité de contrôle et en être le point de contact ; en tenant chaque fois compte du risque.", "sub": "Article 39"}], "read": {"text": "Lisez les articles 37, 38 et 39 en entier, l'un après l'autre ; les lignes directrices sur le DPO (WP243) expliquent chaque paragraphe ; l'APD les résume en dix règles de base.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/de-10-basisregels-over-de-functionaris-voor-gegevensbescherming-dpo.pdf", "label": "APD · 10 règles de base DPO"}]}, "script": "Les trois articles suivent le parcours de la fonction, et les cartes en donnent la vue d'ensemble. Le premier article porte sur la désignation : quand un DPO est obligatoire, qu'un groupe ou plusieurs autorités publiques peuvent en partager un, qu'il est désigné pour ses connaissances spécialisées, qu'il peut être interne ou externe, et que ses coordonnées sont publiées et communiquées à l'autorité de contrôle. Le deuxième article porte sur sa position : il est associé en temps utile à tout ce qui touche à la protection des données, il reçoit un accès et des ressources, aucune instruction, ni licenciement ni sanction pour ses missions, il fait rapport au niveau le plus élevé de la direction, les personnes concernées peuvent s'adresser à lui, il est tenu au secret, et d'autres missions seulement sans conflit d'intérêts. Le troisième article énumère ses missions : informer et conseiller, contrôler le respect du règlement, conseiller sur l'analyse d'impact, et coopérer avec l'autorité de contrôle comme point de contact. Les lignes directrices européennes sur le DPO expliquent chaque paragraphe, et l'autorité belge de protection des données les a résumées en dix règles de base ; les deux se trouvent derrière les boutons. Nous parcourons maintenant les trois articles, en demandant chaque fois ce que cela signifie pour vous, futur DPO. Retenez donc : désignation, position, missions, dans cet ordre."}, {"id": 4, "type": "reveal", "chip": "Article 37, paragraphe 1 · exercice : cherchez vous-même", "title": "Pour laquelle de ces quatre organisations un DPO est-il obligatoire ?", "question": "Mettez l'audio en pause et lisez le premier paragraphe de l'article sur la désignation. Évaluez ensuite quatre organisations : une commune de 8.000 habitants ; un hôpital ; une boutique en ligne de dix employés qui envoie une lettre d'information ; et une société de gardiennage qui visionne des images de caméras pour des chaînes de magasins. Pour qui un DPO est-il obligatoire, et sur la base de quel point ?", "verdict": "La commune (autorité publique), l'hôpital (catégories particulières à grande échelle) et la société de gardiennage (suivi régulier et systématique à grande échelle) ; pas la boutique en ligne, même si elle peut en désigner un volontairement", "answer": [{"k": "a · Autorité publique", "t": "toute autorité publique ou tout organisme public, à l'exception des juridictions dans leur fonction juridictionnelle ; donc la commune, quelle que soit sa taille, et selon la loi-cadre belge aussi les organisations privées qui exécutent des missions d'intérêt général pour les pouvoirs publics."}, {"k": "b · Suivi", "t": "une activité de base qui exige un suivi régulier et systématique à grande échelle : la société de gardiennage, mais aussi un opérateur télécom, une plateforme qui suit les comportements, ou une ville avec un parc de caméras."}, {"k": "c · Catégories particulières", "t": "une activité de base qui consiste en un traitement à grande échelle de catégories particulières ou de données pénales : l'hôpital ; pas un médecin généraliste isolé, dit le considérant du règlement."}, {"k": "La boutique en ligne", "t": "pas une autorité publique, pas de suivi à grande échelle, pas de catégories particulières : pas obligatoire ; si elle désigne tout de même volontairement un DPO, toutes les règles sur la position et les missions s'appliquent intégralement."}], "read": {"text": "Lisez l'article 37, paragraphes 1 à 4, et le considérant 97 ; les lignes directrices WP243 sur l'activité de base, la grande échelle et le suivi ; la page de l'APD sur le DPO.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/functionaris-voor-gegevensbescherming", "label": "APD · délégué à la protection des données"}]}, "script": "Nous commençons par la désignation, et par un exercice. Mettez l'audio en pause et lisez le premier paragraphe de l'article 37, sur la désignation. Évaluez ensuite quatre organisations : une commune de huit mille habitants, un hôpital, une boutique en ligne de dix employés qui envoie une lettre d'information, et une société de gardiennage qui visionne des images de caméras pour des chaînes de magasins. Pour qui un DPO est-il obligatoire, et sur quel point ? Prenez votre temps. … Le paragraphe nomme trois cas. Le premier : toute autorité publique ou tout organisme public, sauf les juridictions dans leur fonction juridictionnelle. Donc la commune, si petite soit-elle. La loi-cadre belge l'étend aux organisations privées qui exécutent des missions d'intérêt général pour les pouvoirs publics. Le deuxième : une organisation dont les activités de base exigent un suivi régulier et systématique à grande échelle. C'est la société de gardiennage, mais aussi un opérateur télécom, une plateforme qui suit les comportements, ou une ville avec un parc de caméras. Notez les mots activités de base : le cœur de l'activité, pas l'administration du personnel que toute organisation possède. Le troisième : une organisation dont les activités de base consistent en un traitement à grande échelle de catégories particulières ou de données pénales. L'hôpital donc ; pas un médecin généraliste isolé, dit expressément le considérant du règlement. Et la boutique en ligne ? Pas une autorité publique, pas de suivi à grande échelle, pas de catégories particulières : pas obligatoire. Mais si elle en désigne tout de même un volontairement, toutes les règles sur la position et les missions s'appliquent intégralement ; on ne peut pas avoir un DPO à moitié. Attention : qui ne doit pas désigner de DPO n'est pas dispensé des autres règles. Le registre doit toujours exister, et une fuite doit toujours être notifiée."}, {"id": 5, "type": "compare", "chip": "Article 37, paragraphes 5 et 6 · interne ou externe", "title": "Désigné sur la base de ses connaissances spécialisées : un membre du personnel ou un externe, chacun avec ses avantages et ses inconvénients", "left": {"head": "DPO interne (membre du personnel)", "items": ["Avantage : connaît l'organisation, les personnes et les systèmes ; est rapidement associé à chaque projet", "Inconvénient : combine souvent la fonction avec d'autres tâches, et alors un conflit d'intérêts ou un manque de temps menace", "Point d'attention : dépendance envers son supérieur ; le règlement le protège contre les instructions et le licenciement pour ses missions", "Exige : une analyse de risque de la combinaison avec d'autres tâches, un budget de formation, et une place dans l'organigramme sous le niveau le plus élevé de la direction"]}, "right": {"head": "DPO externe (contrat de service)", "items": ["Avantage : pas de conflit d'intérêts avec des fonctions internes, des connaissances spécialisées de niveau, souvent une équipe derrière lui", "Inconvénient : connaît moins bien le fonctionnement interne et est moins visible ; risque d'être associé trop tard", "Point d'attention : le contrat doit régler l'indépendance et la disponibilité ; un DPO externe ne peut pas être en même temps votre fournisseur informatique", "Exige : une personne de contact fixe en interne, des accords sur la disponibilité, et l'accès aux réunions et aux documents"]}, "read": {"text": "Lisez l'article 37, paragraphes 5 et 6 ; les lignes directrices WP243 sur les connaissances spécialisées et sur le DPO externe.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}]}, "script": "Qui désignez-vous ? L'article 37 est clair sur le critère, au paragraphe 5 : le DPO est désigné sur la base de ses qualités professionnelles, et en particulier de ses connaissances spécialisées du droit et des pratiques en matière de protection des données, et de sa capacité à accomplir les missions. Des connaissances spécialisées donc, et surtout la connaissance de la législation. Cela paraît évident, mais en pratique, le DPO est souvent choisi parce qu'il est disponible, ou parce qu'il connaît l'informatique, ou parce qu'il fait déjà de la conformité. Ce n'est pas un critère. La profondeur de ces connaissances dépend du risque des traitements : un hôpital en demande plus qu'une bibliothèque communale. Et le paragraphe 6 rend le choix double : un membre du personnel, ou un externe sur la base d'un contrat de service. Regardez les deux colonnes. Le DPO interne connaît l'organisation, les personnes et les systèmes, et est vite associé à chaque projet. Mais il combine souvent la fonction avec d'autres tâches, et alors un conflit d'intérêts menace, ou simplement un manque de temps. Et il dépend de son supérieur, même si le règlement le protège contre les instructions et le licenciement pour ses missions. Le DPO externe n'a pas de conflit d'intérêts avec des fonctions internes, apporte des connaissances de niveau et souvent une équipe. Mais il connaît moins bien le fonctionnement interne, est moins visible, et risque d'être associé trop tard. Et lui aussi peut être en conflit : un DPO externe qui est en même temps votre fournisseur informatique évalue son propre travail. Chaque choix a donc ses avantages et ses inconvénients, et l'organisation doit les peser et documenter cette pondération. Retenez donc : les connaissances spécialisées sont le critère, interne ou externe est une pondération, et dans les deux cas vous surveillez le conflit d'intérêts."}, {"id": 6, "type": "bullets", "chip": "Article 37, paragraphe 7 · documenter la désignation", "title": "Documenter la désignation : qualités, analyse de risque, organigramme, publication", "bullets": [{"k": "Qualités vérifiées", "t": "consignez pourquoi cette personne est compétente : formation, expérience, certificats, et comment ces connaissances sont entretenues ; l'autorité de contrôle le demande lors d'une enquête."}, {"k": "Analyse de risque en cas de dépendance ou de cumul", "t": "si le DPO combine la fonction avec d'autres tâches, ou fait rapport en pratique à quelqu'un qu'il doit contrôler, vous analysez le conflit d'intérêts et documentez les mesures."}, {"k": "Organigramme et mandat", "t": "le DPO figure dans l'organigramme, avec une ligne vers le niveau le plus élevé de la direction, et avec un mandat écrit qui fixe ses missions, son temps, ses ressources et son accès."}, {"k": "Publier et communiquer", "t": "les coordonnées figurent dans la déclaration de confidentialité et sont communiquées à l'APD via un dossier DPO sur le portail ; une modification ou une radiation passe aussi par là ; ce n'est pas nécessairement le nom, mais bien un point de contact joignable."}, {"k": "Pas pour une partie", "t": "un DPO est désigné pour l'organisation, pas pour une partie de ses traitements : un DPO qui ne contrôle que les données clients et pas le personnel, cela n'existe pas."}], "read": {"text": "Lisez l'article 37, paragraphe 7 ; la page de l'APD pour gérer un dossier DPO (déclarer, modifier, radier) ; les dix règles de base de l'APD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/acties/functionaris-voor-gegevensbescherming-dpo", "label": "APD · gérer un dossier DPO"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/de-10-basisregels-over-de-functionaris-voor-gegevensbescherming-dpo.pdf", "label": "APD · 10 règles de base DPO"}]}, "script": "La désignation est une décision que vous devez pouvoir démontrer, et donc vous la documentez. Quatre choses. Premièrement les qualités : consignez pourquoi cette personne est compétente, avec sa formation, son expérience et ses certificats, même si un certificat n'est pas obligatoire en soi ; il aide bien à démontrer les connaissances ; et consignez comment ces connaissances sont entretenues ; lors d'une enquête, l'autorité de contrôle le demande. Deuxièmement une analyse de risque lorsqu'il y a un soupçon de dépendance ou de cumul : si le DPO combine la fonction avec d'autres tâches, ou fait rapport en pratique à quelqu'un qu'il doit contrôler, vous analysez le conflit d'intérêts et documentez les mesures que vous prenez. Troisièmement l'organigramme et le mandat : le DPO figure dans l'organigramme, avec une ligne vers le niveau le plus élevé de la direction, et avec un mandat écrit qui fixe ses missions, son temps, ses ressources et son accès. Quatrièmement la publication, le paragraphe 7 de l'article 37 : les coordonnées figurent dans la déclaration de confidentialité et sont communiquées à l'Autorité de protection des données, en Belgique via un dossier DPO sur le portail de l'autorité ; une modification ou une radiation passe aussi par là. Ce n'est pas nécessairement le nom, mais bien un point de contact qui fonctionne. Et une chose impossible : désigner un DPO pour une partie des traitements. Un DPO qui ne contrôle que le traitement des données clients, mais pas celui du personnel, cela n'existe pas. La fonction vaut pour toute l'organisation. Retenez donc : qualités, analyse de risque, organigramme et publication, et toujours pour l'ensemble."}, {"id": 7, "type": "quote", "chip": "Article 38, paragraphes 3 et 6 · indépendance", "title": "Aucune instruction, pas de licenciement pour ses missions, et directement au niveau le plus élevé de la direction", "source": "Article 38, paragraphe 3 du RGPD", "quote": "Le responsable du traitement et le sous-traitant veillent à ce que le délégué à la protection des données ne reçoive aucune instruction en ce qui concerne l'exercice des missions. Le délégué à la protection des données ne peut être relevé de ses fonctions ou pénalisé par le responsable du traitement ou le sous-traitant pour l'exercice de ses missions. Le délégué à la protection des données fait directement rapport au niveau le plus élevé de la direction du responsable du traitement ou du sous-traitant.", "bullets": [{"k": "Aucune instruction", "t": "l'organisation ne détermine pas ce que le DPO conseille, comment il évalue une plainte ou ce qu'il dit à l'autorité de contrôle ; elle peut bien lui poser des questions et lui soumettre des priorités."}, {"k": "Pas de licenciement ni de sanction pour ses missions", "t": "un DPO ne peut être licencié ni pénalisé parce que son avis est indésirable ; la Cour de justice admet que les États membres le protègent même plus largement, tant qu'il peut encore être remplacé en cas de conflit d'intérêts ou de manque de connaissances."}, {"k": "Directement au niveau le plus élevé de la direction", "t": "le DPO fait rapport au niveau le plus élevé de la direction, pas à un chef de département ; une banque dont le DPO ne faisait pas directement rapport au sommet et dirigeait en même temps trois services a reçu 75.000 euros d'amende."}, {"k": "Le conflit d'intérêts", "t": "d'autres missions sont permises, mais pas si le DPO détermine ainsi lui-même les finalités et les moyens des traitements : chef du personnel, de l'informatique, du marketing, de l'audit ou de la conformité sont des conflits classiques ; la Cour de justice l'apprécie au cas par cas, sur la base de toutes les circonstances."}], "read": {"text": "Lisez l'article 38, paragraphes 3 et 6 ; les décisions 18/2020 et 141/2021 de l'APD ; les arrêts de la Cour de justice C-534/20 (Leistritz), C-560/21 et C-453/21 (X-FAB).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-18-2020.pdf", "label": "APD 18/2020 · DPO également chef de l'audit et de la conformité"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-141-2021.pdf", "label": "APD 141/2021 · DPO également chef de service (banque)"}, {"url": "https://curia.europa.eu/juris/liste.jsf?num=C-453/21", "label": "CJUE C-453/21 X-FAB · conflit d'intérêts du DPO"}, {"url": "https://curia.europa.eu/juris/liste.jsf?num=C-534/20", "label": "CJUE C-534/20 Leistritz · protection du DPO contre le licenciement"}]}, "script": "Puis la position, à l'article 38, et lisez le paragraphe 3 sur la diapositive, car c'est le cœur du statut. Le responsable du traitement et le sous-traitant veillent à ce que le délégué ne reçoive aucune instruction pour l'exercice de ses missions. Il ne peut être relevé de ses fonctions ou pénalisé pour l'exercice de ses missions. Et il fait directement rapport au niveau le plus élevé de la direction. Trois garanties. Aucune instruction : l'organisation ne détermine pas ce que le DPO conseille, comment il évalue une plainte ou ce qu'il dit à l'autorité de contrôle. Elle peut lui poser des questions et lui soumettre des priorités ; indépendant ne veut pas dire injoignable. Pas de licenciement ni de sanction pour ses missions : un DPO ne peut être licencié ni pénalisé parce que son avis est indésirable. La Cour de justice a admis que les États membres le protègent même davantage, comme l'Allemagne, tant qu'il peut encore être remplacé en cas de conflit d'intérêts ou de manque de connaissances. Et directement au niveau le plus élevé de la direction : au sommet, pas à un chef de département qui peut filtrer son avis. Nous voilà revenus à la banque du début, et à une deuxième affaire belge : une banque dont le DPO ne faisait pas rapport au sommet et dirigeait en même temps trois services de traitement a reçu soixante-quinze mille euros d'amende. Cela nous amène au conflit d'intérêts du paragraphe 6. D'autres missions sont permises, mais pas si le DPO détermine ainsi lui-même les finalités et les moyens de traitements. Chef du personnel, de l'informatique, du marketing, de l'audit ou de la conformité : les conflits classiques, car qui décide ne peut pas contrôler sa propre décision de façon indépendante. La Cour de justice l'a confirmé et l'apprécie au cas par cas, selon toutes les circonstances. Retenez donc : aucune instruction, pas de licenciement pour ses missions, rapport au sommet, et aucune fonction dans laquelle il décide lui-même des traitements."}, {"id": 8, "type": "reveal", "chip": "Réflexion 1 · articles 37 et 38", "title": "Trois candidats à la fonction de DPO", "question": "Une entreprise de 600 employés cherche un DPO et a trois candidats. Un : le directeur des ressources humaines, qui connaît à fond les traitements du personnel. Deux : un juriste interne, motivé, mais sans aucune expérience en protection des données. Trois : un bureau externe qui gère aussi l'infrastructure informatique de l'entreprise. Qui entre en ligne de compte, et à quelles conditions ?", "verdict": "Aucun des trois tels qu'ils sont maintenant : le directeur des ressources humaines est en conflit d'intérêts, le juriste n'a pas les connaissances requises, et le bureau évalue son propre travail", "answer": [{"k": "Le directeur des ressources humaines", "t": "détermine lui-même les finalités et les moyens des traitements du personnel et devrait les contrôler comme DPO : un conflit d'intérêts, et précisément le cas pour lequel l'autorité belge a déjà infligé des amendes ; possible seulement s'il abandonne cette fonction dirigeante."}, {"k": "Le juriste interne", "t": "pas de conflit d'intérêts, mais le règlement exige des connaissances spécialisées du droit et des pratiques en matière de protection des données ; la désignation n'est possible qu'après une formation, avec un parcours documenté et, en attendant, le soutien d'un expert externe."}, {"k": "Le bureau externe", "t": "un DPO externe est permis, mais qui gère l'infrastructure informatique détermine en partie les moyens et évalue comme DPO sa propre sécurité ; le contrat doit séparer les rôles, ou vous choisissez un autre bureau."}, {"k": "Ce que vous documentez", "t": "la pondération par candidat, l'analyse de risque du conflit d'intérêts, la solution choisie et le mandat ; cette documentation est la preuve de la responsabilité."}], "read": {"text": "Lisez l'article 37, paragraphe 5 et l'article 38, paragraphe 6 ; les lignes directrices WP243, chapitre sur le conflit d'intérêts ; la décision 141/2021 de l'APD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-141-2021.pdf", "label": "APD 141/2021 · DPO également chef de service (banque)"}]}, "script": "Première réflexion. Une entreprise de six cents employés cherche un DPO et a trois candidats. Un : le directeur des ressources humaines, qui connaît à fond les traitements du personnel. Deux : un juriste interne, motivé, mais sans aucune expérience en protection des données. Trois : un bureau externe qui gère aussi l'infrastructure informatique de l'entreprise. Qui entre en ligne de compte, et à quelles conditions ? Réfléchissez un instant. … Aucun des trois, tels qu'ils sont maintenant. Le directeur des ressources humaines détermine lui-même les finalités et les moyens des traitements du personnel, et devrait les contrôler comme DPO. C'est un conflit d'intérêts, et précisément le cas pour lequel l'autorité belge de protection des données a déjà infligé des amendes. Ce n'est possible que s'il abandonne cette fonction dirigeante. Le juriste interne n'a pas de conflit d'intérêts, mais le règlement exige des connaissances spécialisées du droit et des pratiques en matière de protection des données, et il ne les a pas encore. Le désigner n'est possible qu'après une formation, avec un parcours documenté, et en attendant le soutien d'un expert externe. Le bureau externe enfin : un DPO externe est permis, mais qui gère l'infrastructure informatique détermine en partie les moyens et évaluerait comme DPO sa propre sécurité. Le contrat doit séparer ces rôles, avec d'autres personnes et une autre ligne de rapport, ou vous choisissez un autre bureau. Vous documentez en tout cas la pondération par candidat, l'analyse de risque du conflit d'intérêts, la solution choisie et le mandat. Retenez donc : connaissances spécialisées et indépendance, et la pondération sur papier."}, {"id": 9, "type": "quote", "chip": "Article 38, paragraphes 1, 2, 4 et 5 · associé et soutenu", "title": "Associé en temps utile, avec un accès et des ressources, joignable par les personnes concernées, et tenu au secret", "source": "Article 38, paragraphe 1 du RGPD", "quote": "Le responsable du traitement et le sous-traitant veillent à ce que le délégué à la protection des données soit associé, d'une manière appropriée et en temps utile, à toutes les questions relatives à la protection des données à caractère personnel.", "bullets": [{"k": "D'une manière appropriée et en temps utile", "t": "le DPO est présent à la conception d'un projet, pas à l'évaluation après coup ; une organisation qui ne peut pas démontrer que son DPO a été associé à la sécurité, au registre ou à l'analyse d'impact viole cette obligation, a jugé la Chambre contentieuse à propos de la plateforme d'inscription gantoise."}, {"k": "Accès et ressources", "t": "accès aux données à caractère personnel et aux opérations de traitement, temps, budget, formation et, si nécessaire, une équipe ; mais attention : le DPO consulte rarement les données elles-mêmes ; ce n'est possible que lorsque sa mission l'exige, et c'est rarement le cas."}, {"k": "Point de contact pour les personnes concernées", "t": "les personnes concernées peuvent prendre contact avec le DPO au sujet de leurs données et de leurs droits ; d'où les coordonnées publiées ; une organisation qui ne pouvait pas démontrer quel avis son DPO avait donné sur une demande d'accès a reçu une réprimande pour cela."}, {"k": "Secret", "t": "le DPO est tenu au secret sur ce qu'il apprend dans sa mission ; cela protège la personne concernée qui s'adresse à lui, le collaborateur qui signale un problème, et l'organisation elle-même."}], "read": {"text": "Lisez l'article 38, paragraphes 1, 2, 4 et 5 ; les décisions 171/2024 et 59/2025 de l'APD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-171-2024.pdf", "label": "APD 171/2024 · plateforme d'inscription Gand"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-59-2025.pdf", "label": "APD 59/2025 · opticien, avis du DPO sur une demande d'accès"}]}, "script": "L'indépendance seule ne suffit pas ; un DPO à qui personne ne demande rien est inutile. Lisez le paragraphe 1 de l'article 38 sur la diapositive : le DPO est associé, d'une manière appropriée et en temps utile, à toutes les questions relatives à la protection des données à caractère personnel. En temps utile signifie à la conception d'un projet, pas à l'évaluation après coup. Et l'autorité de contrôle le vérifie : à propos de la plateforme d'inscription gantoise d'un module précédent, la Chambre contentieuse a jugé que l'organisation ne pouvait pas démontrer que son DPO avait été associé à la sécurité, au registre et à l'analyse d'impact, une violation de ce paragraphe. Le paragraphe 2 de l'article 38 demande un soutien : l'accès aux données à caractère personnel et aux opérations de traitement, et les ressources nécessaires : du temps, un budget, une formation, et si nécessaire une équipe. Sur cet accès, une nuance souvent mal comprise. Le DPO a droit à l'accès, mais consulte rarement les données elles-mêmes. Ce n'est possible que lorsque sa mission l'exige, par exemple pour instruire une plainte, et c'est rarement le cas. Un DPO qui regarde chaque jour dans les dossiers fait autre chose que contrôler. Le paragraphe 4 fait de lui le point de contact des personnes concernées : elles peuvent s'adresser à lui pour leurs données et leurs droits, et c'est pourquoi ses coordonnées sont publiées. Là aussi, l'autorité de contrôle regarde : une entreprise qui ne pouvait pas démontrer quel avis son DPO avait donné sur une demande d'accès a reçu une réprimande pour cela. Et le paragraphe 5 lui impose le secret sur ce qu'il apprend dans sa mission. Cela protège la personne concernée qui s'adresse à lui, le collaborateur qui signale un problème, et l'organisation elle-même. Retenez donc : associé en temps utile, soutenu, joignable et discret, et l'accès aux données uniquement lorsque la mission l'exige."}, {"id": 10, "type": "quote", "chip": "Article 39 · les missions", "title": "Informer et conseiller, contrôler, l'analyse d'impact, et l'autorité de contrôle", "source": "Article 39, paragraphe 1 du RGPD", "quote": "Les missions du délégué à la protection des données sont au moins les suivantes:\na) informer et conseiller le responsable du traitement ou le sous-traitant ainsi que les employés qui procèdent au traitement sur les obligations qui leur incombent en vertu du présent règlement et d'autres dispositions du droit de l'Union ou du droit des États membres en matière de protection des données;\nb) contrôler le respect du présent règlement, d'autres dispositions du droit de l'Union ou du droit des États membres en matière de protection des données et des règles internes du responsable du traitement ou du sous-traitant en matière de protection des données à caractère personnel, y compris en ce qui concerne la répartition des responsabilités, la sensibilisation et la formation du personnel participant aux opérations de traitement, et les audits s'y rapportant;\nc) dispenser des conseils, sur demande, en ce qui concerne l'analyse d'impact relative à la protection des données et vérifier l'exécution de celle-ci en vertu de l'article 35;\nd) coopérer avec l'autorité de contrôle;\ne) faire office de point de contact pour l'autorité de contrôle sur les questions relatives au traitement, y compris la consultation préalable visée à l'article 36, et mener des consultations, le cas échéant, sur tout autre sujet.", "bullets": [{"k": "Informer et conseiller", "t": "l'organisation et les employés qui procèdent au traitement, sur leurs obligations ; le DPO conseille, le responsable du traitement décide."}, {"k": "Contrôler le respect", "t": "du règlement et des règles internes, y compris la répartition des responsabilités, la sensibilisation, la formation et les audits ; contrôler n'est pas exécuter : le DPO n'écrit pas la politique et ne réalise pas lui-même les audits, il veille à ce que cela se fasse."}, {"k": "L'analyse d'impact", "t": "dispenser des conseils sur demande et vérifier l'exécution ; la rédaction incombe à l'organisation, comme dans un module précédent."}, {"k": "Que faire de l'avis", "t": "le responsable du traitement prend l'avis à cœur, ou explique par écrit pourquoi il ne le suit pas ; un avis qui disparaît sans trace est, pour l'autorité de contrôle, le signe que le DPO n'est pas associé."}, {"k": "À la mesure du risque", "t": "le DPO tient compte, dans ses missions, du risque, de la nature, de la portée, du contexte et des finalités : il consacre son temps là où le risque est le plus grand."}], "read": {"text": "Lisez l'article 39 en entier ; les lignes directrices WP243 sur les missions et sur la documentation d'un avis non suivi.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}]}, "script": "L'article 39 énumère les missions, et la diapositive les montre ; ce sont des missions minimales, l'organisation peut en ajouter sans créer de conflit. La première mission : informer et conseiller l'organisation et les employés qui procèdent au traitement sur leurs obligations. Notez le verbe : conseiller. Le DPO conseille, le responsable du traitement décide et porte la responsabilité. La deuxième mission : contrôler le respect du règlement et des règles internes, y compris la répartition des responsabilités, la sensibilisation, la formation et les audits. Contrôler n'est pas exécuter. Le DPO n'écrit pas la politique, ne réalise pas lui-même les audits et ne donne pas chaque formation ; il veille à ce que cela se fasse, et il le signale si cela ne se fait pas. La troisième mission : dispenser des conseils sur demande au sujet de l'analyse d'impact et en vérifier l'exécution, comme dans un module précédent. La quatrième et la cinquième mission concernent l'autorité de contrôle, nous y venons. Maintenant le point qui compte le plus en pratique : que fait l'organisation de l'avis ? Le règlement ne le dit pas en toutes lettres, mais les lignes directrices et les autorités de contrôle sont claires : le responsable du traitement suit l'avis, ou explique par écrit pourquoi il ne le suit pas. S'écarter est permis, car c'est lui qui décide ; s'écarter sans motivation ne l'est pas. Un avis qui disparaît sans trace est, pour l'autorité de contrôle, le signe que le DPO n'est pas vraiment associé. Comme DPO, vous veillez donc à ce que chaque avis soit écrit, daté et reçoive une réponse. Enfin, le paragraphe 2 de l'article 39 dit que le DPO tient compte du risque dans ses missions : il consacre son temps là où le risque est le plus grand, pas partout également. Retenez donc : conseiller et contrôler, pas décider ni exécuter ; et chaque avis est suivi ou réfuté de façon motivée."}, {"id": 11, "type": "bullets", "chip": "Article 39, paragraphe 1, d) et e) · l'autorité de contrôle", "title": "Le DPO et l'autorité de contrôle : point de contact et coopération, mais pas un prolongement de l'autorité", "bullets": [{"k": "Point de contact", "t": "l'autorité de contrôle s'adresse au DPO pour les questions sur les traitements, lors d'une plainte, lors d'une enquête du Service d'inspection et lors de la consultation préalable ; c'est pourquoi l'autorité connaît ses coordonnées via le dossier DPO."}, {"k": "Coopérer", "t": "le DPO coopère avec l'autorité de contrôle : répondre aux questions, fournir des documents, accompagner l'organisation pendant une enquête ; l'obligation de coopération elle-même incombe au responsable du traitement et au sous-traitant, et les sanctions aussi."}, {"k": "Pas un prolongement", "t": "le DPO n'est pas un inspecteur de l'autorité au sein de l'organisation : il n'est pas tenu de signaler de sa propre initiative des violations à l'autorité de contrôle, et son secret vaut aussi envers elle, sauf là où le droit l'oblige à répondre."}, {"k": "Concertation", "t": "le DPO peut demander conseil à l'autorité de contrôle ou se concerter avec elle sur une question ; l'autorité belge organise notamment pour cela des concertations et des lignes directrices pour les DPO."}, {"k": "Qui est sanctionné", "t": "pas le DPO : les amendes pour une fonction mal remplie, un conflit d'intérêts ou un DPO non associé frappent l'organisation ; le DPO porte bien sa responsabilité professionnelle."}], "read": {"text": "Lisez l'article 39, paragraphe 1, d) et e), et l'article 31 ; la page de l'APD sur le DPO et le dossier DPO ; les lignes directrices WP243 sur la coopération avec l'autorité de contrôle.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/functionaris-voor-gegevensbescherming", "label": "APD · délégué à la protection des données"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}]}, "script": "Enfin la relation avec l'autorité de contrôle, la quatrième et la cinquième mission de l'article 39. Le DPO coopère avec l'autorité de contrôle, et il est son point de contact pour tout ce qui touche aux traitements, y compris la consultation préalable. En pratique, cela signifie : l'autorité s'adresse au DPO pour une question, lors d'une plainte, lors d'une enquête du Service d'inspection, et lors d'une consultation préalable. C'est pourquoi elle connaît ses coordonnées, via le dossier DPO sur son portail. Le DPO répond aux questions, fournit des documents et accompagne l'organisation pendant une enquête. Mais attention à deux limites. La première : l'obligation de coopération elle-même incombe au responsable du traitement et au sous-traitant, et les sanctions aussi. Le DPO organise la coopération, il ne la porte pas à la place de l'organisation. La deuxième limite est plus importante : le DPO n'est pas un prolongement de l'autorité au sein de l'organisation. Il n'est pas tenu de signaler de sa propre initiative des violations à l'autorité de contrôle, et son secret vaut aussi envers elle, sauf là où le droit l'oblige à répondre. Qui le voit comme un inspecteur interne le rend inutilisable : les collaborateurs ne lui signalent alors plus rien. Son rôle est d'amener l'organisation à la conformité, avec l'autorité de contrôle comme partenaire quand c'est nécessaire. Inversement, le DPO peut demander conseil à l'autorité de contrôle ou se concerter avec elle, et l'autorité belge organise pour cela des concertations et publie des lignes directrices. Et qui est sanctionné quand cela tourne mal ? Pas le DPO. Les amendes pour une fonction mal remplie, un conflit d'intérêts ou un DPO non associé frappent l'organisation ; le DPO porte sa responsabilité professionnelle, mais le règlement dirige ses sanctions vers le responsable du traitement et le sous-traitant. Retenez donc : point de contact et partenaire de l'autorité de contrôle, mais pas un inspecteur au service de l'autorité."}, {"id": 12, "type": "reveal", "chip": "Réflexion 2 · articles 38 et 39", "title": "L'avis qui a disparu dans un tiroir", "question": "Le DPO d'un hôpital conseille par écrit de ne pas lancer un nouveau portail patients sans authentification à deux facteurs et sans analyse d'impact. La direction lance quand même le portail, sans répondre à l'avis. Six mois plus tard, le portail fuit, et le Service d'inspection demande le dossier. Que constate le Service d'inspection, et qu'aurait dû faire la direction ?", "verdict": "Que le DPO a bien été associé mais que son avis a été ignoré sans motivation : la direction aurait dû suivre l'avis ou expliquer par écrit pourquoi pas, et le DPO aurait dû faire consigner cela", "answer": [{"k": "Ce que voit le Service d'inspection", "t": "un avis daté du DPO, pas de réponse, pas d'analyse d'impact et pas d'authentification à deux facteurs : l'organisation connaissait le risque et n'a pas agi ; cela aggrave la violation de la sécurité et de l'analyse d'impact, et montre que le DPO n'a pas été associé d'une manière appropriée."}, {"k": "Ce que la direction aurait dû faire", "t": "suivre l'avis, ou motiver par écrit pourquoi pas, avec les mesures prises à la place ; s'écarter est permis, car le responsable du traitement décide, mais s'écarter sans motivation viole la responsabilité."}, {"k": "Ce que le DPO aurait dû faire", "t": "remettre son avis directement au niveau le plus élevé de la direction, demander une réponse motivée et tenir le dossier ; ne pas décider lui-même, ne pas avertir lui-même l'autorité de contrôle, mais veiller à ce que la décision et sa motivation existent."}, {"k": "Qui est sanctionné", "t": "l'hôpital, comme responsable du traitement ; pas le DPO, qui a accompli sa mission et peut le démontrer."}], "read": {"text": "Lisez l'article 38, paragraphes 1 et 3, et l'article 39, paragraphe 1, a) et c) ; les lignes directrices WP243 sur la documentation d'un avis non suivi.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "Lignes directrices DPO (WP243)"}]}, "script": "Deuxième réflexion. Le DPO d'un hôpital conseille par écrit de ne pas lancer un nouveau portail patients sans authentification à deux facteurs et sans analyse d'impact. La direction lance quand même le portail, sans répondre à l'avis. Six mois plus tard, le portail fuit, et le Service d'inspection demande le dossier. Que constate le Service d'inspection, et qu'aurait dû faire la direction ? Réfléchissez un instant. … Le Service d'inspection voit un avis daté du DPO, pas de réponse, pas d'analyse d'impact et pas d'authentification à deux facteurs. L'organisation connaissait donc le risque et n'a pas agi. Cela aggrave la violation de la sécurité et de l'analyse d'impact, et montre que le DPO n'a pas été associé de manière appropriée, comme l'exige l'article 38 : être associé, c'est plus que pouvoir envoyer un courriel. Qu'aurait dû faire la direction ? Suivre l'avis, ou motiver par écrit pourquoi pas, avec les mesures prises à la place. S'écarter est permis, car le responsable du traitement décide. S'écarter sans motivation viole la responsabilité. Et qu'aurait dû faire le DPO ? Remettre son avis directement au niveau le plus élevé de la direction, demander une réponse motivée, et tenir le dossier. Ne pas décider lui-même, ne pas avertir lui-même l'autorité de contrôle, mais veiller à ce que la décision et sa motivation existent. Qui est sanctionné ? L'hôpital, comme responsable du traitement. Pas le DPO, qui a accompli sa mission et peut le démontrer ; voilà pourquoi, comme DPO, vous faites tout par écrit. Retenez donc : un avis est suivi ou réfuté de façon motivée, et le DPO veille à ce que cette trace existe."}, {"id": 13, "type": "summary", "chip": "Résumé", "title": "Ce que vous retenez", "key": "Le DPO est la seule obligation du chapitre qui soit une personne : obligatoire pour les autorités publiques et en cas de suivi à grande échelle ou de catégories particulières comme activité de base, désigné sur la base de ses connaissances spécialisées, interne ou externe mais sans conflit d'intérêts, avec une désignation documentée pour toute l'organisation ; associé en temps utile, soutenu, sans instructions, protégé contre le licenciement et faisant rapport au sommet ; il conseille et contrôle mais ne décide pas, son avis est suivi ou réfuté de façon motivée, et il est le point de contact de l'autorité de contrôle sans en être le prolongement.", "bullets": [{"k": "Désignation", "t": "autorité publique, suivi à grande échelle, catégories particulières à grande échelle ; volontaire signifie intégral ; les connaissances spécialisées sont le critère ; interne ou externe est une pondération ; documentez les qualités, l'analyse de risque, l'organigramme et le dossier DPO auprès de l'APD ; jamais pour une partie des traitements."}, {"k": "Position", "t": "associé en temps utile, accès et ressources, aucune instruction, pas de licenciement ni de sanction pour ses missions, directement au niveau le plus élevé de la direction, point de contact pour les personnes concernées, secret, pas de conflit d'intérêts ; consultation des données uniquement si la mission l'exige."}, {"k": "Missions", "t": "informer et conseiller, contrôler, conseiller sur l'analyse d'impact ; conseiller et contrôler, pas décider ni exécuter ; chaque avis suivi ou réfuté de façon motivée."}, {"k": "Autorité de contrôle", "t": "point de contact et coopération, mais pas un inspecteur au service de l'autorité ; les sanctions frappent l'organisation."}], "script": "Que retenez-vous ? Une phrase clé : le DPO est la seule obligation de ce chapitre qui soit une personne, et le règlement protège cette personne pour qu'elle puisse conseiller et contrôler de façon indépendante. Vous retenez en outre quatre choses. La désignation : obligatoire pour les autorités publiques et pour les organisations dont l'activité de base est un suivi à grande échelle ou des catégories particulières à grande échelle ; volontaire signifie intégral ; les connaissances spécialisées sont le critère ; interne ou externe est une pondération ; et vous documentez les qualités, l'analyse de risque, l'organigramme et le dossier DPO auprès de l'autorité de contrôle, toujours pour toute l'organisation. La position : associé en temps utile, avec accès et ressources, sans instructions, protégé contre le licenciement et la sanction pour ses missions, directement au niveau le plus élevé de la direction, joignable par les personnes concernées, tenu au secret, sans conflit d'intérêts ; et la consultation des données uniquement si la mission l'exige. Les missions : informer et conseiller, contrôler, conseiller sur l'analyse d'impact ; conseiller et contrôler, pas décider ni exécuter ; et chaque avis est suivi ou réfuté de façon motivée. Et l'autorité de contrôle : le DPO est son point de contact et coopère avec elle, mais n'est pas un inspecteur à son service, et les sanctions frappent l'organisation. Retour à la banque du début : la faute n'était pas la personne, mais le cumul de fonctions, sans analyse de risque ni ligne directe vers le sommet. Avant les questions d'exercice, une tâche. Mettez l'audio en pause et cherchez comment le DPO de votre organisation a été désigné : la désignation est-elle sur papier, communiquée à l'autorité de contrôle, à qui fait-il rapport, et quelles autres tâches a-t-il ? Ensuite, dix questions."}], "quiz": [{"q": "Dans quels cas la désignation d'un DPO est-elle obligatoire ?", "options": ["Pour toute organisation de plus de 250 employés, quelles que soient la nature et l'ampleur de ses traitements de données.", "Uniquement pour les organisations qui doivent réaliser une analyse d'impact pour un traitement présentant un risque.", "Pour toute organisation qui traite des données de clients et qui publie une déclaration de confidentialité en ligne.", "Pour les autorités publiques, et si l'activité de base est un suivi ou des catégories particulières à grande échelle."], "answer": 3, "feedback": ["Le nombre d'employés n'est pas un critère pour le DPO.", "L'analyse d'impact et le DPO sont des obligations distinctes ; l'une n'entraîne pas l'autre.", "Traiter des données de clients ne suffit pas ; il s'agit des trois cas de l'article.", "Exact. Les autorités publiques et organismes publics, et les organisations dont l'activité de base consiste en un suivi régulier et systématique à grande échelle ou en un traitement à grande échelle de catégories particulières ou de données pénales."]}, {"q": "Une boutique en ligne qui n'est pas tenue de désigner un DPO le fait quand même volontairement. Quelle en est la conséquence ?", "options": ["La boutique en ligne peut déterminer elle-même quelles missions, quelles ressources et quelle protection reçoit le DPO volontaire.", "Les règles sur la position et les missions du DPO s'appliquent intégralement, comme si la désignation était obligatoire.", "Le DPO ne doit pas être communiqué à l'autorité de contrôle, parce que la désignation a eu lieu volontairement.", "Le DPO volontaire peut se limiter aux traitements que la boutique en ligne lui attribue expressément."], "answer": 1, "feedback": ["Le règlement n'admet pas de DPO sur mesure ; la position et les missions sont fixées.", "Exact. Qui désigne volontairement un DPO applique intégralement les articles sur la position et les missions ; on ne peut pas avoir un DPO à moitié.", "Un DPO volontaire aussi est publié et communiqué à l'autorité de contrôle.", "Un DPO est désigné pour toute l'organisation, pas pour une partie des traitements."]}, {"q": "Sur quelle base le DPO doit-il être désigné ?", "options": ["Sur la base de ses qualités professionnelles, surtout ses connaissances spécialisées du droit et des pratiques.", "Sur la base de sa disponibilité au sein de l'organisation et de sa connaissance des systèmes informatiques et des processus.", "Sur la base de son ancienneté, afin qu'il ait suffisamment d'autorité face à la direction et aux chefs de service.", "Sur la base d'un certificat que l'autorité de contrôle délivre après un examen et renouvelle chaque année."], "answer": 0, "feedback": ["Exact. Des connaissances spécialisées du droit et des pratiques en matière de protection des données, et la capacité à accomplir les missions.", "La disponibilité et les connaissances informatiques ne sont pas un critère légal.", "L'ancienneté n'est pas un critère ; les connaissances spécialisées, oui.", "Le règlement n'exige pas de certificat ; l'organisation évalue et documente les connaissances."]}, {"q": "Quel est le principal risque lorsqu'un membre du personnel combine la fonction de DPO avec une fonction dirigeante ?", "options": ["Que l'organisation doive payer deux salaires pour une seule personne qui exerce deux fonctions en même temps.", "Que l'autorité de contrôle doive approuver au préalable la combinaison de fonctions, avant que la désignation prenne effet.", "Qu'il détermine lui-même les finalités et les moyens des traitements et ne puisse pas les contrôler de façon indépendante.", "Qu'en tant que dirigeant, il ne puisse plus avoir accès aux données à caractère personnel de son propre service."], "answer": 2, "feedback": ["Le problème n'est pas financier, c'est le conflit d'intérêts.", "L'autorité de contrôle n'approuve pas les désignations au préalable.", "Exact. Qui décide des traitements ne peut pas les contrôler de façon indépendante ; l'autorité belge a infligé pour cela des amendes de 50.000 et 75.000 euros.", "L'accès est justement un droit du DPO ; le problème réside dans le pouvoir de décision."]}, {"q": "Quelle affirmation sur un DPO externe est correcte ?", "options": ["Un DPO externe n'est pas permis ; le DPO doit être un membre du personnel de l'organisation.", "Un DPO externe ne doit pas être communiqué à l'autorité de contrôle, seulement un DPO interne.", "Un DPO externe ne peut jamais être en conflit d'intérêts, parce qu'il se trouve en dehors de l'organisation.", "Un DPO externe est permis, mais lui non plus ne peut pas être en conflit d'intérêts."], "answer": 3, "feedback": ["Le règlement admet expressément un contrat de service.", "Les coordonnées d'un DPO externe aussi sont publiées et communiquées.", "Un externe aussi peut avoir un conflit, par exemple comme fournisseur de l'organisation.", "Exact. Externe est permis, mais celui qui gère par exemple l'infrastructure informatique évalue comme DPO son propre travail."]}, {"q": "À qui le DPO fait-il rapport ?", "options": ["Au chef du service auquel il appartient, comme le service juridique ou l'informatique.", "Directement au niveau le plus élevé de la direction.", "À l'autorité de contrôle, qui évalue ses rapports chaque année.", "Au conseil d'entreprise, qui veille à son indépendance et approuve son rapport."], "answer": 1, "feedback": ["Un chef de département peut filtrer l'avis ; le règlement exige une ligne directe vers le sommet.", "Exact. Directement au niveau le plus élevé de la direction ; une banque dont le DPO ne faisait pas rapport au sommet a été sanctionnée pour cela.", "Le DPO fait rapport en interne ; il n'est pas un prolongement de l'autorité de contrôle.", "Le conseil d'entreprise n'est pas une ligne de rapport dans le règlement."]}, {"q": "Que doit faire le responsable du traitement d'un avis du DPO qu'il ne veut pas suivre ?", "options": ["Il peut s'en écarter, mais explique par écrit pourquoi, et quelles mesures il prend à la place.", "Il doit toujours suivre l'avis, car le DPO a le dernier mot en matière de protection des données.", "Il peut écarter l'avis sans motivation, car lui seul décide du traitement.", "Il doit d'abord soumettre le désaccord à l'autorité de contrôle, qui tranche la question."], "answer": 0, "feedback": ["Exact. S'écarter est permis, s'écarter sans motivation viole la responsabilité ; l'avis et la réponse ont leur place dans le dossier.", "Le DPO conseille ; le responsable du traitement décide.", "Sans motivation, il ne peut pas démontrer qu'il a pesé le risque.", "L'autorité de contrôle n'intervient pas ici ; la décision et la motivation sont internes."]}, {"q": "Qu'en est-il de l'accès du DPO aux données à caractère personnel ?", "options": ["Il n'a pas droit à l'accès ; il travaille exclusivement sur la base du registre, de la politique et des procédures.", "Il doit contrôler régulièrement les dossiers lui-même pour pouvoir exercer sa mission de contrôle du respect du règlement.", "Il a droit à l'accès, mais ne consulte les données elles-mêmes que si sa mission l'exige.", "Il n'obtient l'accès aux données qu'après autorisation de l'autorité de contrôle et du niveau le plus élevé de la direction."], "answer": 2, "feedback": ["Le règlement oblige l'organisation à lui donner accès.", "Contrôler n'est pas la même chose que consulter soi-même les dossiers.", "Exact. L'organisation lui donne accès aux données et aux opérations de traitement, mais la consultation effective des données est rarement nécessaire à sa mission.", "L'autorité de contrôle n'intervient pas ici."]}, {"q": "Un DPO apprend, lors d'une plainte d'un collaborateur, qu'un département traite des données de façon illicite. Doit-il le signaler à l'autorité de contrôle ?", "options": ["Oui, le DPO est tenu de signaler directement et sans délai à l'autorité de contrôle toute violation qu'il constate.", "Oui, mais seulement si le collaborateur qui a introduit la plainte le demande expressément et par écrit.", "Non, car le DPO ne peut jamais communiquer avec l'autorité de contrôle sans l'autorisation de <script>

          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':
        /* s.items: [{t, end, k, t2}] -> sprongknoppen naar de opname */
        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+((s.question||s.layout==='stack')?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+(s.rec&&RS.length?'<div class="readmore rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+s.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')+(s.deep?'<div class="readmore deep"><span><span class="lbl">'+esc(U.deep_label||'Verdieping')+'</span> · '+esc(s.deep.text||'')+'</span><a class="btn" href="'+esc(s.deep.url)+'?back='+(S.indexOf(s)+1)+'">'+esc(s.deep.label||U.deep_btn||'Open de verdieping')+' ›</a></div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;

    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];

    $('q-text').textContent = q.q;
    if(q.context){ $('q-ctx').innerHTML = (U.q_ctx_label?'<span class="ctx-k">'+esc(U.q_ctx_label)+'</span>':'')+esc(q.context); $('q-ctx').classList.remove('hidden'); } else { $('q-ctx').classList.add('hidden'); $('q-ctx').innerHTML=''; }
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';

  $('opts').addEventListener('click',e=>{

    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n])
      + (q.key?'<div class="fb-key"><b>'+esc(U.q_key_label||'À retenir')+' —</b>'+esc(q.key)+'</div>':'')
      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});

  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });

  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
