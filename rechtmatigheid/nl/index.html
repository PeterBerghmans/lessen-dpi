<!DOCTYPE html>
<html lang="nl" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 5 · Rechtmatigheid: wanneer mag je persoonsgegevens verwerken?</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.back{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}
/* verdieping (sprong naar een aparte verdiepingsmodule) */
.readmore.deep{border-top:1px dashed var(--line)}
.readmore.deep a.btn{background:var(--btn-bg);color:var(--btn-text)}
.readmore.deep .lbl{font-weight:700;color:var(--accent)}
/* avatar (HeyGen): video in plaats van audio; het tekstpaneel kan inklappen, de avatar blijft zichtbaar */
.avatar-box{position:relative;background:#e9e9e6;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:1/1}
.avatar-box video{width:100%;height:100%;object-fit:cover;display:block}
.avatar-box .avatar-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.transcript.has-avatar.notext .t-body{display:none}
.transcript.has-avatar.notext{max-height:none}
@media (max-width:1099px){
  .transcript.has-avatar .avatar-box{position:fixed;right:12px;bottom:12px;width:150px;z-index:60;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side ul.bul{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px}
@media (max-width:900px){.figure.stack .side ul.bul{grid-template-columns:1fr}}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl a.tlink{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tbl a.tlink:hover{text-decoration-thickness:2px}
.tbl .recchip{display:inline-block;margin-top:4px;font:inherit;font-weight:500;font-size:.82em;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .recchip:hover{background:var(--chain-bg)}
.tbl td:first-child .recchip{display:block;width:max-content}
.tbl-hint{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:8px}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* opname (Vimeo) */
.readmore.rec{border-top:1px dashed var(--line);margin-top:8px}
.readmore.rec .btn{font-variant-numeric:tabular-nums}
.readmore.rec .btn small{font-weight:400;opacity:.8;margin-left:4px}
.rec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-head h1{margin-bottom:4px}
.rec-src{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rec-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.rec-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rec-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.rec-ch{position:relative;max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.rec-ch h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 12px 4px;position:sticky;top:0;background:var(--card-bg)}
.rec-ch button{display:grid;grid-template-columns:58px 1fr;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);background:var(--card-bg)}
.rec-ch button:hover{background:var(--chain-bg)}
.rec-ch button.on{background:var(--chip-bg);color:var(--chip-text)}
.rec-ch button .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.rec-ch button .qp{font-weight:700;color:var(--muted)}
.rec-ch h4.rv{font-size:13px;color:var(--title);background:var(--chain-bg);z-index:1}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}.rec-ch{max-height:none}}
.intro-src{font-size:13px;color:var(--muted);margin:-14px 0 22px;line-height:1.5}

/* profielkeuze */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 18px}
.profiles .qset b{font-size:clamp(16px,1.8vw,21px)}
.profchip{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:999px;vertical-align:middle}
/* meer weten: verwijzingen naar de opname */
.pointers{display:grid;gap:clamp(8px,1.2vw,14px)}
.pointers .pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--chain-bg);border-radius:12px;padding:clamp(10px,1.3vw,16px) clamp(12px,1.6vw,20px)}
.pointers .pt b{color:var(--title);font-size:clamp(13px,1.45vw,17px)}
.pointers .pt span{grid-column:1;font-size:clamp(12px,1.2vw,15px);line-height:1.4}
.pointers .pt .btn{grid-column:2;grid-row:1/span 2;font-variant-numeric:tabular-nums}
.pointers .pt .btn small{font-weight:400;opacity:.85;margin-left:6px}
.pointers .lead{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(6px,1vw,12px)}
@media (max-width:640px){.pointers .pt{grid-template-columns:1fr}.pointers .pt .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.q-ctx{background:var(--chain-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:clamp(13.5px,1.35vw,16px);line-height:1.5;color:var(--text)}
.q-ctx .ctx-k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.fb .fb-key{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95em}
.fb .fb-key b{display:inline;margin-right:4px}
.fb .fb-rec{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .fb-src a.btn{text-decoration:none}
.fb .fb-rec .btn small{font-weight:400;opacity:.85;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

a opnieuw. De feedback bij elke vraag helpt je op weg.", "retry": "Opnieuw oefenen", "review": "Presentatie herbekijken", "your_answer": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex"}, "slides": [{"id": 1, "type": "title", "title": "Rechtmatigheid: wanneer mag je persoonsgegevens verwerken?", "subtitle": "De zes rechtsgronden, de voorwaarden voor toestemming en de afweging bij het gerechtvaardigd belang", "script": "Een bakker in mijn straat hangt een briefje aan de kassa. Door hier te kopen geeft u toestemming om uw gegevens te verwerken. Ik vraag hem welke gegevens dan. Wel, zegt hij, de camerabeelden, de klantenkaart, en de mails voor de nieuwsbrief. Toestemming, denkt hij, en dan is alles in orde. Dat is de redenering van heel veel organisaties: als ik maar toestemming heb. In dit kwartier leg ik uit waarom dat niet klopt. Niet omdat toestemming slecht is, maar omdat ze maar één van zes mogelijke redenen is om persoonsgegevens te mogen verwerken, en vaak niet de beste. Na afloop ken je die zes rechtsgronden, weet je wat een geldige toestemming vereist, en begrijp je hoe de afweging werkt bij de rechtsgrond die het vaakst wordt gebruikt en het minst wordt begrepen: het gerechtvaardigd belang."}, {"id": 2, "type": "chain", "chip": "Het kader", "title": "Rechtmatigheid is meer dan één vinkje", "steps": [{"k": "1. Een rechtsgrond", "t": "je hebt een van de zes redenen uit de AVG om de gegevens te mogen verwerken, bijvoorbeeld de toestemming van de betrokkene, de persoon over wie de gegevens gaan."}, {"k": "2. De andere basisprincipes", "t": "ook met een rechtsgrond verwerk je niet meer gegevens dan nodig, niet langer dan nodig, en niet voor een onverenigbaar doel."}, {"k": "3. De bijkomende regels", "t": "soms legt een andere wet nog voorwaarden op, zoals bij gezondheidsgegevens of camerabewaking."}], "script": "Eerst het kader. In een vorige module zagen we de basisprincipes, en het eerste daarvan was: rechtmatig. Die rechtmatigheid heeft een eigen uitwerking in de AVG, en daar gaat deze module over. Maar hou één ding vast vanaf het begin. Of een verwerking mag, is niet één vinkje. Kijk naar het schema. Stap één: je hebt een rechtsgrond. Een van de zes redenen die de AVG opsomt om persoonsgegevens te mogen verwerken. Een daarvan is dat de betrokkene, dat is de persoon over wie de gegevens gaan, toestemming heeft gegeven. Stap twee: ook met die rechtsgrond moet je de andere principes naleven. Terug naar de bakker. Stel dat zijn briefje een geldige toestemming zou zijn, wat het niet is, daar komen we op terug. Zelfs dan mag hij niet meer gegevens verwerken dan nodig, ze niet eindeloos bewaren, en de nieuwsbriefadressen niet doorverkopen aan een reisbureau. De beoordeling stopt dus niet bij de vraag of er toestemming is. Onthoud dus: een rechtsgrond opent de deur, maar de basisprincipes bepalen wat je binnen mag doen."}, {"id": 3, "type": "cards", "chip": "De zes rechtsgronden", "title": "Zes redenen, en minstens één moet van toepassing zijn", "cols": 3, "cards": [{"k": "Toestemming", "t": "de betrokkene zegt vrij, specifiek, geïnformeerd en ondubbelzinnig ja, voor één doel.", "sub": "Voorbeeld: de nieuwsbrief"}, {"k": "Overeenkomst", "t": "noodzakelijk om een contract met de betrokkene uit te voeren, of om er op zijn vraag een voor te bereiden.", "sub": "Voorbeeld: het leveringsadres voor een bestelling"}, {"k": "Wettelijke verplichting", "t": "noodzakelijk om een verplichting na te komen die de wet aan de organisatie oplegt.", "sub": "Voorbeeld: loongegevens aan de sociale zekerheid"}, {"k": "Vitaal belang", "t": "noodzakelijk om een leven of de fysieke integriteit van iemand te beschermen.", "sub": "Voorbeeld: de bewusteloze patiënt op de spoeddienst"}, {"k": "Algemeen belang of openbaar gezag", "t": "noodzakelijk voor een taak die de regelgeving aan de organisatie opdraagt.", "sub": "Voorbeeld: een gemeente die haar inwoners registreert"}, {"k": "Gerechtvaardigd belang", "t": "noodzakelijk voor een belang van de organisatie of een derde, tenzij de belangen van de betrokkene zwaarder wegen; niet voor overheidstaken.", "sub": "Voorbeeld: fraudepreventie, netwerkbeveiliging"}], "read": {"text": "Lees de letterlijke tekst van de zes rechtsgronden in artikel 6, lid 1, en de bepaling over verdere verwerking voor een ander doel.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Hier staan ze, alle zes, in een schema; je vindt ze in artikel 6 van de verordening. De letterlijke tekst vind je via de knop onderaan de slide. Toestemming. Overeenkomst. Wettelijke verplichting. Vitaal belang. Algemeen belang of openbaar gezag. En gerechtvaardigd belang. Drie dingen vallen op. Eén: er is geen rangorde. Toestemming staat eerst, maar is niet belangrijker dan de andere. Je kiest de grond die bij de situatie past, en je kiest vooraf, niet achteraf als het misloopt. Twee: let op het woord noodzakelijk. Het staat bij vijf van de zes. De verwerking moet nodig zijn voor het doel. Niet handig, niet interessant, nodig. Drie: er staat een uitzondering voor de overheid. Een overheid kan voor haar taken niet terugvallen op het gerechtvaardigd belang. Voor haar hoort de wetgever de rechtsgrond te maken. We overlopen de zes gronden nu één voor één, met telkens een voorbeeld. Onthoud dus: zes gelijkwaardige gronden, minstens één moet van toepassing zijn, en bijna altijd staat er noodzakelijk."}, {"id": 4, "type": "quote", "chip": "Rechtsgrond 1", "title": "Toestemming: vrij, specifiek, geïnformeerd en ondubbelzinnig", "source": "Artikel 4, punt 11 AVG", "quote": "„toestemming” van de betrokkene: elke vrije, specifieke, geïnformeerde en ondubbelzinnige wilsuiting waarmee de betrokkene door middel van een verklaring of een ondubbelzinnige actieve handeling hem betreffende verwerking van persoonsgegevens aanvaardt;", "bullets": [{"k": "Vrij", "t": "zonder druk en zonder nadeel bij weigering; wie de toestemming nodig heeft om een dienst te krijgen die er niets mee te maken heeft, geeft ze niet vrij."}, {"k": "Specifiek en geïnformeerd", "t": "voor een welbepaald doel, en de betrokkene weet waarvoor hij ja zegt; één vinkje voor 'alles' is geen toestemming."}, {"k": "Ondubbelzinnig, door een actieve handeling", "t": "een vooraf aangevinkt vakje, stilzwijgen of 'door verder te surfen' telt niet; aantoonbaar, en even makkelijk in te trekken als te geven."}], "read": {"text": "Lees ook de voorwaarden voor toestemming in artikel 7 (aantoonbaarheid, intrekking) en de regels voor kinderen in artikel 8.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "De eerste rechtsgrond: toestemming. De definitie staat op de slide, en elk woord telt. Vrij: zonder druk, en zonder nadeel als je weigert. Wie zijn job dreigt te verliezen als hij nee zegt, geeft geen vrije toestemming. En wie een dienst alleen krijgt als hij toestemt in een verwerking die met die dienst niets te maken heeft, ook niet. Specifiek: voor een welbepaald doel. Geïnformeerd: je weet waarvoor je ja zegt. Ondubbelzinnig, door een verklaring of een actieve handeling: je doet iets. Een vooraf aangevinkt vakje is geen toestemming. Stilzwijgen is geen toestemming. Door verder te surfen gaat u akkoord, is geen toestemming. En het briefje van de bakker aan de kassa? Niet vrij, want je wilt gewoon brood. Niet specifiek, want drie verschillende doelen in één zin: de camerabeelden, de klantenkaart en de nieuwsbrief. Niet geïnformeerd, want wat staat er op die camera en hoelang? En niet ondubbelzinnig, want brood kopen is geen wilsuiting over je gegevens. Vier keer mis. Verderop in de verordening staan nog kwaliteitsvereisten, zonder dat ik ze hier ontleed: je moet de toestemming kunnen aantonen, en intrekken moet even makkelijk zijn als geven. Onthoud dus: toestemming is een actieve, vrije, geïnformeerde ja voor één duidelijk doel."}, {"id": 5, "type": "bullets", "chip": "Rechtsgrond 1 · kinderen", "title": "Kinderen en onlinediensten: zestien jaar, tenzij de lidstaat lager gaat", "bullets": [{"k": "Wanneer de regel geldt", "t": "alleen wanneer een kind zelf toestemming geeft voor een onlinedienst die rechtstreeks aan kinderen wordt aangeboden: een app, een sociaal netwerk, een game."}, {"k": "Wanneer niet", "t": "een school die toestemming vraagt om een foto van je kind op de website te zetten, vraagt wel toestemming, maar biedt het kind geen onlinedienst aan; daar geldt deze regel niet."}, {"k": "De leeftijdsgrens verschilt per land", "t": "de AVG zegt 16, maar laat de lidstaten zakken tot 13; België koos 13, Nederland en Duitsland 16, Frankrijk 15. Onder die grens moet de ouder toestemmen."}, {"k": "Gevolg voor wie apps bouwt", "t": "per land weten vanaf welke leeftijd een kind zelf mag toestemmen, daaronder de ouder betrekken, en redelijke inspanningen doen om dat te controleren."}], "read": {"text": "Lees de volledige tekst van de regel voor kinderen in artikel 8.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Bij toestemming hoort een bijzondere regel voor kinderen. Ze geldt wanneer een kind zich op een onlineplatform begeeft, zoals een app, een sociaal netwerk of een game, en daar zelf om toestemming wordt gevraagd. De regel geldt dus niet voor elke toestemming die over een kind gaat. Een school die toestemming vraagt om een foto van je kind op de website te zetten, vraagt wel toestemming, maar biedt het kind geen onlinedienst aan. Daar geldt deze regel niet. De AVG zegt dat er een leeftijdsgrens van zestien jaar geldt om in zo'n situatie een geldige toestemming te kunnen geven. Onder die leeftijd moet de ouder toestemmen. Maar de lidstaten mogen lager gaan, tot dertien jaar. En dat hebben ze gedaan, elk anders. België koos dertien. Nederland en Duitsland hielden zestien. Frankrijk koos vijftien. Dit is een mooi voorbeeld van wat we eerder zagen: ook een verordening laat op bepaalde punten ruimte voor nationale keuzes. Wat betekent dat in de praktijk? Stel, je ontwikkelt een app voor jongeren die in de hele Unie wordt aangeboden. Dan moet je per land weten vanaf welke leeftijd een kind zelf mag toestemmen, en daaronder de ouder betrekken. En je moet redelijke inspanningen doen om dat te controleren. Eén leeftijdsvraag bij de registratie volstaat dus niet. Onthoud dus: een regel met beperkte impact, met per land een andere grens."}, {"id": 6, "type": "reveal", "chip": "Denkoefening 1", "title": "Toestemming: populair, maar met strakke voorwaarden", "question": "Een werkgever vraagt zijn werknemers om toestemming om hun foto op het intranet te plaatsen, met een vakje op het evaluatieformulier. Is dit een goede keuze van rechtsgrond?", "verdict": "Nee, en toestemming is hier zelfs de slechtste keuze", "answer": [{"k": "Niet vrij", "t": "tussen werkgever en werknemer is er een machtsverhouding; een vraag op het evaluatieformulier maakt weigeren nog moeilijker."}, {"k": "Intrekbaar", "t": "toestemming kan op elk moment worden ingetrokken; dan moet de foto weg en moet de werkgever dat ook kunnen aantonen. Wie zijn verwerking op toestemming bouwt, bouwt op zand."}, {"k": "De les", "t": "toestemming is de meest gekozen grond omdat ze het eenvoudigst lijkt, maar de voorwaarden zijn streng; vaak past een andere grond beter, of hoort de verwerking gewoon niet te gebeuren."}], "script": "Eerste denkoefening. Een werkgever wil de foto's van zijn werknemers op het intranet zetten. Hij vraagt toestemming, met een vakje op het evaluatieformulier. Goede keuze? Denk even na. … Nee. Om te beginnen is die toestemming niet vrij. Tussen een werkgever en een werknemer is er een machtsverhouding. En een vakje op het evaluatieformulier, uitgerekend het moment waarop je beoordeeld wordt, maakt weigeren nog moeilijker. Maar er is een tweede probleem, en dat is de reden waarom ik toestemming vaak afraad. Toestemming kan op elk moment worden ingetrokken. Dan moet de foto weg, en de werkgever moet kunnen aantonen dat hij dat deed. Wie zijn verwerking bouwt op toestemming, bouwt op zand. Toestemming is de meest gekozen rechtsgrond, omdat ze het eenvoudigst lijkt. Eén vinkje en klaar. Maar het is de grond met de strengste voorwaarden. Vaak past een andere grond beter. En soms is de conclusie gewoon dat de verwerking niet hoort te gebeuren, en dat toestemming dat niet kan rechttrekken. Onthoud dus: toestemming is geen reddingsboei voor verwerkingen die anders niet mogen."}, {"id": 7, "type": "quote", "chip": "Rechtsgrond 2", "title": "Overeenkomst: noodzakelijk om het contract met de betrokkene uit te voeren", "source": "Artikel 6, lid 1, b AVG", "quote": "de verwerking is noodzakelijk voor de uitvoering van een overeenkomst waarbij de betrokkene partij is, of om op verzoek van de betrokkene vóór de sluiting van een overeenkomst maatregelen te nemen;", "bullets": [{"k": "Wie zijn de partijen", "t": "de betrokkene moet zelf partij zijn: de klant die een abonnement neemt, de huurder, de patiënt met een behandelingsovereenkomst. Niet de werknemer van een klant-bedrijf."}, {"k": "Noodzakelijk voor de uitvoering", "t": "het leveringsadres voor een bestelling: ja. De geboortedatum om een jas te leveren: nee. 'Het staat in onze voorwaarden' maakt een gegeven niet noodzakelijk."}, {"k": "Ook vóór het contract", "t": "maatregelen op verzoek van de betrokkene vóór de sluiting, zoals een offerte opmaken, vallen eronder."}], "script": "Tweede rechtsgrond: de overeenkomst. De verwerking is noodzakelijk om een contract uit te voeren waarbij de betrokkene partij is. Twee aandachtspunten. Het eerste: wie zijn de partijen? De betrokkene moet zelf partij zijn bij het contract. Je bestelt online een jas. Jij bent partij bij dat contract, en de webshop mag je naam en je adres verwerken om die jas te leveren. Maar stel dat je die jas bestelt als cadeau en laat leveren bij je zus. Je zus is geen partij bij het contract. Haar adres verwerkt de webshop dus niet op grond van een overeenkomst met haar, want die is er niet. Het tweede aandachtspunt: noodzakelijk voor de uitvoering. Het leveringsadres voor een bestelling, ja. De geboortedatum om een jas te leveren, nee. En let op de klassieke truc: het staat in onze algemene voorwaarden. Dat maakt een gegeven niet noodzakelijk. De vraag is of je het contract kunt uitvoeren zonder dat gegeven. Ook hier geldt dus: passend, niet meer dan nodig. Tot slot: ook de stappen vóór het contract vallen eronder, als de betrokkene erom vraagt. Een offerte opmaken, bijvoorbeeld. Onthoud dus: contract met de betrokkene zelf, en alleen die gegevens verwerken die nodig zijn om het contract uit te voeren."}, {"id": 8, "type": "quote", "chip": "Rechtsgrond 3", "title": "Wettelijke verplichting: de wet zegt dat je moet verwerken", "source": "Artikel 6, lid 1, c AVG", "quote": "de verwerking is noodzakelijk om te voldoen aan een wettelijke verplichting die op de verwerkingsverantwoordelijke rust;", "bullets": [{"k": "Voor overheden", "t": "een overheid mag niet zomaar gegevens verwerken; meestal mag ze alleen wat de wet die haar taak regelt uitdrukkelijk toelaat: welke gegevens, waarvoor, hoelang."}, {"k": "Voor bedrijven en organisaties", "t": "ook een private organisatie kan door de wet verplicht worden gegevens te verwerken; dan is die verplichting de rechtsgrond."}, {"k": "Belgisch voorbeeld: loonverwerking", "t": "een werkgever in België moet van elke werknemer loon- en identificatiegegevens doorgeven aan de sociale zekerheid en bedrijfsvoorheffing inhouden voor de fiscus; hij heeft daarvoor geen toestemming nodig, hij is ertoe verplicht."}], "script": "Derde rechtsgrond: de wettelijke verplichting. De verwerking is noodzakelijk om een verplichting na te komen die de wet oplegt. Eerst de overheid, want daar is dit de belangrijkste grond. Een overheid mag niet zomaar gegevens verwerken omdat het nuttig lijkt. In de meeste gevallen mag ze alleen die gegevens verwerken die vastliggen in de wet die haar taak regelt. En die wet moet duidelijk zijn: welke gegevens, voor welk doel, hoelang bewaard. Dat is een waarborg tegen een overheid die alles over iedereen zou willen weten. Maar de wet kan ook anderen verplichten. Een bedrijf, een vereniging, een school. Dan is die wettelijke plicht de rechtsgrond. Het Belgische voorbeeld bij uitstek: de loonverwerking. Elke werkgever moet van elke werknemer identificatie- en loongegevens doorgeven aan de sociale zekerheid, via de aangiften bij de aanwerving en per kwartaal, en moet bedrijfsvoorheffing inhouden en doorstorten aan de fiscus. Daarvoor vraagt hij geen toestemming. Hij is ertoe verplicht, en die verplichting is zijn rechtsgrond. Zou hij toestemming vragen, dan zou een werknemer die kunnen intrekken, en dat kan natuurlijk niet. Onthoud dus: als de wet je verplicht, is dat je rechtsgrond, en geen toestemming."}, {"id": 9, "type": "bullets", "chip": "Rechtsgrond 4 en 5", "title": "Vitaal belang en algemeen belang: twee gronden voor bijzondere situaties", "bullets": [{"k": "Vitaal belang", "t": "een leven of de fysieke integriteit staat op het spel: de bewusteloze patiënt op de spoeddienst, de evacuatie bij een ramp. Een noodgrond, alleen als er geen andere grond is."}, {"k": "Algemeen belang of openbaar gezag", "t": "een taak van algemeen belang die aan de organisatie is opgedragen, zoals een gemeente die inwoners registreert of een universiteit die examens afneemt; de taak zelf moet voortvloeien uit de regelgeving."}, {"k": "Het verschil met de wettelijke verplichting", "t": "bij de verplichting zegt de wet 'je moet dit verwerken'; bij het algemeen belang zegt de wet 'dit is je taak' en bepaalt de organisatie zelf welke verwerking daarvoor nodig is."}], "read": {"text": "Lees overweging 46 (vitaal belang) en overweging 45 (algemeen belang) voor de toelichting van de wetgever.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Vierde en vijfde rechtsgrond, kort, want ze zijn voor bijzondere situaties. Het vitaal belang: er staat een leven op het spel, of de fysieke integriteit van iemand. De bewusteloze patiënt op de spoeddienst, van wie het ziekenhuis gegevens opvraagt bij de huisarts. De evacuatie bij een ramp. Dit is een noodgrond. Je gebruikt ze alleen als er geen enkele andere grond is, en de situatie echt dringend is. Wie het vitaal belang inroept voor zijn nieuwsbrief, heeft iets niet begrepen. Dan het algemeen belang, of de uitoefening van openbaar gezag. Dit is de grond voor taken die aan een organisatie zijn opgedragen. Een gemeente die haar inwoners registreert. Een universiteit die examens afneemt. Een ziekenfonds dat terugbetalingen regelt. Voorwaarde: die taak moet voortvloeien uit de regelgeving. Je kunt jezelf geen taak van algemeen belang toekennen. En het verschil met de wettelijke verplichting? Bij de verplichting zegt de wet: je moet dit verwerken. Bij het algemeen belang zegt de wet: dit is je taak, en de organisatie bepaalt zelf welke verwerking daarvoor nodig is. Onthoud dus: vitaal belang is voor noodgevallen, algemeen belang is voor opgedragen taken."}, {"id": 10, "type": "quote", "chip": "Rechtsgrond 6", "title": "Gerechtvaardigd belang: een afweging in drie stappen", "source": "Artikel 6, lid 1, f AVG", "quote": "de verwerking is noodzakelijk voor de behartiging van de gerechtvaardigde belangen van de verwerkingsverantwoordelijke of van een derde, behalve wanneer de belangen of de grondrechten en de fundamentele vrijheden van de betrokkene die tot bescherming van persoonsgegevens nopen, zwaarder wegen dan die belangen, met name wanneer de betrokkene een kind is.", "bullets": [{"k": "1. Doeltoets", "t": "is er een echt, actueel en legitiem belang van de organisatie of van een derde? Fraudepreventie, netwerkbeveiliging, de bescherming van je eigendom, direct marketing aan bestaande klanten."}, {"k": "2. Noodzakelijkheidstoets", "t": "is deze verwerking nodig om dat belang te behartigen, of kan het met minder gegevens of op een minder ingrijpende manier?"}, {"k": "3. Afweging", "t": "wegen de belangen, rechten en vrijheden van de betrokkene niet zwaarder? Wat verwacht die redelijkerwijs? Gaat het om een kind? Zijn er waarborgen, zoals pseudonimisering of een opt-out?"}], "read": {"text": "Lees overweging 47 en 49: de wetgever noemt fraudepreventie, direct marketing en netwerkbeveiliging als voorbeelden van gerechtvaardigde belangen.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Zesde rechtsgrond, de meest gebruikte en de minst begrepen: het gerechtvaardigd belang. Lees de tekst. De verwerking is noodzakelijk voor een gerechtvaardigd belang van de organisatie of van een derde, behalve wanneer de belangen of grondrechten van de betrokkene zwaarder wegen. Dat behalve is de kern. Je hebt hier geen vinkje, maar een afweging. In de praktijk gebeurt die in drie stappen, de zogenaamde triple test, en ik wil dat je ze herkent, niet dat je ze al zelf kunt uitvoeren. Stap één, de doeltoets: is er een echt, actueel en legitiem belang? De wetgever geeft zelf voorbeelden: fraudepreventie, direct marketing aan eigen klanten, en de beveiliging van netwerken en informatie. De Belgische toezichthouder aanvaardde bijvoorbeeld het belang van een sportfederatie om een stadionverbod te doen naleven, en het belang van een bewoner om zijn eigendom met een camera te beschermen, zolang die camera op zijn eigen domein gericht blijft. Stap twee, de noodzakelijkheidstoets: is deze verwerking nodig, of kan het met minder? Een voorbeeld. Een bedrijf wil de toegang tot zijn gebouw beveiligen met een vingerscan. Beveiliging is een legitiem belang, de eerste stap is dus in orde. Maar is een vingerscan nodig? Een badge doet hetzelfde, met veel minder ingrijpende gegevens. De vingerscan zakt dus door de tweede stap. Stap drie, de afweging: wat mag de betrokkene redelijkerwijs verwachten? Gaat het om een kind? Zijn er waarborgen, zoals een opt-out? Ook hier een voorbeeld. Een webshop die zijn eigen klanten af en toe een aanbieding mailt: dat mag een klant verwachten, en hij kan zich uitschrijven. Diezelfde webshop die het aankoopgedrag van zijn klanten doorverkoopt aan een verzekeraar: dat verwacht niemand. De eerste verwerking haalt de afweging, de tweede niet. Een overheid kan deze grond niet gebruiken voor haar taken, want voor haar hoort de wetgever de rechtsgrond te maken. Onthoud dus: gerechtvaardigd belang is geen vrijbrief, maar een afweging die je moet kunnen voorleggen."}, {"id": 11, "type": "bullets", "chip": "De link met de rechten", "title": "Wie op het gerechtvaardigd belang steunt, moet bezwaar aanvaarden", "bullets": [{"k": "Recht van bezwaar", "t": "wie zijn verwerking steunt op het gerechtvaardigd belang of het algemeen belang, moet aanvaarden dat de betrokkene bezwaar maakt om redenen die eigen zijn aan zijn situatie."}, {"k": "Gevolg", "t": "de organisatie staakt de verwerking, tenzij ze dwingende gerechtvaardigde gronden kan aanvoeren die zwaarder wegen."}, {"k": "Bij direct marketing", "t": "geen afweging meer: bezwaar is altijd mogelijk en de verwerking stopt. Daarom hoort onder elke marketingmail een uitschrijflink."}, {"k": "Het spiegelbeeld van de afweging", "t": "de organisatie heeft de belangen afgewogen voor iedereen in het algemeen; de betrokkene mag die afweging voor zijn eigen situatie betwisten."}], "read": {"text": "Lees de volledige tekst van het recht van bezwaar in artikel 21.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "En nu een link die ik hier voor het eerst leg: die tussen een rechtsgrond en de rechten van de betrokkene. Wie zijn verwerking steunt op het gerechtvaardigd belang, of op het algemeen belang, heeft een afweging gemaakt. Maar die afweging is algemeen, voor alle betrokkenen samen. De betrokkene mag ze voor zijn eigen situatie betwisten. Dat is het recht van bezwaar, en de kern ervan staat op de slide. Hij maakt bezwaar, en dan moet de organisatie de verwerking staken, tenzij ze dwingende gronden kan aanvoeren die zwaarder wegen. Bij direct marketing gaat de wetgever nog verder. Daar is geen afweging meer: bezwaar is altijd mogelijk, en de verwerking stopt. Daarom staat onder elke marketingmail een uitschrijflink. Dat is geen beleefdheid, dat is dit recht. Zie je de logica? De organisatie krijgt een soepele rechtsgrond, maar de betrokkene krijgt een even soepel recht om nee te zeggen. De twee horen bij elkaar. De rechten van de betrokkene komen in een latere module volledig aan bod. Onthoud dus: gerechtvaardigd belang en recht van bezwaar zijn twee kanten van dezelfde munt."}, {"id": 12, "type": "reveal", "chip": "Denkoefening 2", "title": "Welke rechtsgrond?", "question": "Vier situaties. Eén: een webshop bewaart je leveringsadres om je bestelling te verzenden. Twee: een ziekenhuis vraagt gegevens op over een bewusteloze patiënt. Drie: een bank controleert transacties op fraude. Vier: een werkgever geeft loongegevens door aan de sociale zekerheid. Welke rechtsgrond past telkens het best?", "verdict": "Overeenkomst · vitaal belang · gerechtvaardigd belang · wettelijke verplichting", "answer": [{"k": "De webshop", "t": "overeenkomst: het adres is noodzakelijk om het contract met de klant uit te voeren; toestemming vragen zou zelfs verkeerd zijn, want de klant kan ze intrekken terwijl de bestelling onderweg is."}, {"k": "Het ziekenhuis", "t": "vitaal belang: de patiënt kan niet toestemmen en er staat een leven op het spel."}, {"k": "De bank en de werkgever", "t": "fraudepreventie is een gerechtvaardigd belang dat de wetgever zelf noemt (al kan ook een wettelijke verplichting meespelen); de loonaangifte is een wettelijke verplichting, geen toestemming."}], "script": "Tweede denkoefening. Vier situaties, en bij elk zoek je de rechtsgrond die het best past. Eén: een webshop bewaart je leveringsadres om je bestelling te verzenden. Twee: een ziekenhuis vraagt gegevens op over een bewusteloze patiënt. Drie: een bank controleert transacties op fraude. Vier: een werkgever geeft loongegevens door aan de sociale zekerheid. Denk even na. … De webshop: de overeenkomst. Het adres is nodig om het contract uit te voeren. Toestemming vragen zou hier zelfs verkeerd zijn, want de klant zou ze kunnen intrekken terwijl het pakje onderweg is. Het ziekenhuis: het vitaal belang. De patiënt kan niet toestemmen, en er staat een leven op het spel. De bank: het gerechtvaardigd belang. Fraudepreventie is een belang dat de wetgever zelf als voorbeeld noemt, al spelen voor banken vaak ook wettelijke verplichtingen mee. En de werkgever: de wettelijke verplichting. Geen toestemming, want de aangifte is verplicht. Merk op: in geen van de vier is toestemming de beste keuze. Onthoud dus: kies de grond die bij de situatie past, en toestemming is zelden die grond."}, {"id": 13, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "Een verwerking is pas rechtmatig met een van de zes rechtsgronden én met naleving van de andere basisprincipes; toestemming is maar één grond, met strenge voorwaarden, en wie op het gerechtvaardigd belang steunt, moet de afweging kunnen tonen en bezwaar aanvaarden.", "bullets": [{"k": "Zes gelijkwaardige gronden", "t": "toestemming, overeenkomst, wettelijke verplichting, vitaal belang, algemeen belang, gerechtvaardigd belang; bijna altijd met de toets of de verwerking noodzakelijk is."}, {"k": "Toestemming", "t": "vrij, specifiek, geïnformeerd en ondubbelzinnig, aantoonbaar en intrekbaar; voor kinderen online een leeftijdsgrens die per land verschilt."}, {"k": "Overheid en wet", "t": "de overheid verwerkt wat de wet haar toelaat; wie wettelijk verplicht is, heeft daarmee zijn rechtsgrond, ook een bedrijf."}, {"k": "Gerechtvaardigd belang", "t": "doeltoets, noodzakelijkheidstoets en afweging; en de betrokkene mag die afweging betwisten via het recht van bezwaar."}], "script": "Wat neem je mee? Eén kernzin: een verwerking is pas rechtmatig met een van de zes rechtsgronden én met naleving van de andere basisprincipes. Toestemming is maar één grond, met strenge voorwaarden. En wie op het gerechtvaardigd belang steunt, moet de afweging kunnen tonen en bezwaar aanvaarden. Dan vier dingen. Zes gelijkwaardige gronden, bijna altijd met de toets of de verwerking noodzakelijk is. Toestemming: vrij, specifiek, geïnformeerd, ondubbelzinnig, en voor kinderen online een leeftijdsgrens die per land verschilt. De overheid verwerkt wat de wet haar toelaat, en wie wettelijk verplicht is, heeft daarmee zijn rechtsgrond. En het gerechtvaardigd belang: drie stappen, en het recht van bezwaar als spiegelbeeld. Voor je naar de oefenvragen gaat, één opdracht. Zet de audio stil en denk aan één verwerking in je eigen organisatie waarvoor toestemming wordt gevraagd. Stel de vraag: is die toestemming echt vrij, en wat gebeurt er als iemand ze intrekt? Als het antwoord je ongemakkelijk maakt, past wellicht een andere grond beter. Daarna zijn er tien vragen om te toetsen of je de rechtsgronden herkent."}], "quiz": [{"q": "Een bakker hangt aan de kassa: 'Door hier te kopen geeft u toestemming om uw gegevens te verwerken.' Waarom is dit geen geldige toestemming?", "options": ["Omdat toestemming altijd schriftelijk gegeven en ondertekend moet worden.", "Omdat een bakker als kleine onderneming geen toestemming mag vragen.", "Omdat toestemming alleen geldig is als ze online wordt gegeven.", "Omdat ze vrij noch specifiek, geïnformeerd of ondubbelzinnig is."], "answer": 3, "feedback": ["Toestemming hoeft niet schriftelijk te zijn; ze moet wel aantoonbaar zijn en aan de vier voorwaarden voldoen.", "De grootte van de onderneming speelt geen rol; de voorwaarden van de toestemming wel.", "Toestemming kan op elke manier gegeven worden, zolang ze een actieve, vrije en geïnformeerde handeling is.", "Juist. Brood kopen is geen actieve wilsuiting over je gegevens, er zijn drie doelen in één zin, en de klant weet niet waarvoor hij ja zegt."]}, {"q": "Een organisatie heeft een geldige toestemming voor een nieuwsbrief. Mag ze de e-mailadressen daarna doorverkopen aan een reisbureau?", "options": ["Nee, want de toestemming geldt voor één doel en de basisprincipes blijven gelden.", "Ja, want met een geldige toestemming is elke verdere verwerking rechtmatig.", "Ja, zolang het reisbureau ook in de Unie gevestigd is en de AVG naleeft.", "Nee, want e-mailadressen mogen nooit aan derden worden doorgegeven."], "answer": 0, "feedback": ["Juist. De toestemming dekt de nieuwsbrief; doorverkoop is een ander, onverenigbaar doel en schendt de doelbinding.", "Een rechtsgrond opent de deur voor één doel; de basisprincipes, zoals doelbinding, bepalen wat je binnen mag doen.", "De vestigingsplaats van de ontvanger verandert niets aan het doel waarvoor toestemming is gegeven.", "Doorgifte aan derden kan rechtmatig zijn met een passende rechtsgrond en binnen het doel; hier ontbreken beide."]}, {"q": "Welke uitspraak over de zes rechtsgronden is juist?", "options": ["Toestemming staat eerst en gaat dus voor op de andere gronden.", "Je moet altijd minstens twee gronden tegelijk kunnen inroepen.", "De gronden zijn gelijkwaardig en je kiest vooraf de grond die past.", "Het gerechtvaardigd belang is de enige grond die een bedrijf mag gebruiken."], "answer": 2, "feedback": ["De volgorde in de tekst is geen rangorde; toestemming is niet belangrijker dan de andere gronden.", "Eén grond volstaat; meerdere gronden stapelen is zelfs af te raden omdat het verwarrend is voor de betrokkene.", "Juist. Eén passende grond volstaat, en de keuze maak je vooraf, niet achteraf als het misloopt.", "Een bedrijf kan alle gronden gebruiken; alleen de overheid kan het gerechtvaardigd belang niet inroepen voor haar taken."]}, {"q": "Een app voor jongeren wordt in België, Nederland en Frankrijk aangeboden en steunt op toestemming. Waarop moet de ontwikkelaar letten?", "options": ["Overal geldt dezelfde grens van 16 jaar, want de AVG is een verordening.", "De leeftijdsgrens verschilt per land en daaronder moet de ouder toestemmen.", "Kinderen mogen nooit zelf toestemmen voor een app; de ouder moet altijd meetekenen.", "De leeftijdsregel geldt alleen voor betalende apps, niet voor gratis apps."], "answer": 1, "feedback": ["De AVG laat de lidstaten toe om tot 13 jaar te zakken, en ze hebben dat verschillend gedaan.", "Juist. België koos 13, Nederland 16, Frankrijk 15; de app moet per land de juiste grens toepassen en redelijke inspanningen doen om ouderlijke toestemming te controleren.", "Boven de nationale leeftijdsgrens mag een kind zelf toestemmen voor een onlinedienst.", "Of de app betalend is, speelt geen rol; de regel geldt voor elk rechtstreeks aanbod van onlinediensten aan een kind."]}, {"q": "Waarom raadt men toestemming vaak af als rechtsgrond voor een verwerking door een werkgever ten aanzien van zijn werknemers?", "options": ["Omdat werknemers volgens de AVG nooit rechtsgeldig toestemming kunnen geven.", "Omdat de werkgever daarvoor eerst de vakbond moet raadplegen.", "Omdat toestemming van werknemers alleen geldig is met een notariële akte.", "Omdat ze door de machtsverhouding zelden vrij is en altijd kan worden ingetrokken."], "answer": 3, "feedback": ["Werknemers kunnen in uitzonderlijke gevallen toestemmen, maar de vrijheid is meestal het probleem.", "Overleg kan nuttig zijn, maar is geen voorwaarde uit de AVG voor toestemming.", "Er bestaat geen vormvereiste; het probleem ligt bij de vrijheid en de intrekbaarheid.", "Juist. Wie weigert, vreest nadeel, en wie zijn verwerking op toestemming bouwt, moet ze stoppen zodra de werknemer ze intrekt."]}, {"q": "Een bedrijf sluit een contract met een leverancier en bewaart de gegevens van de contactpersoon bij die leverancier. Welke rechtsgrond past hier het best?", "options": ["Gerechtvaardigd belang, want de contactpersoon is zelf geen partij.", "Overeenkomst, want er is een contract gesloten met de leverancier.", "Toestemming, die de contactpersoon bij de eerste mail stilzwijgend geeft.", "Wettelijke verplichting, want contracten moeten bewaard worden."], "answer": 0, "feedback": ["Juist. Het bedrijf heeft een legitiem belang om zijn leveranciers te kunnen contacteren; dat is de gebruikelijke grond voor contactpersonen bij zakelijke relaties.", "De grond 'overeenkomst' vereist dat de betrokkene zelf partij is; de contactpersoon is dat niet, zijn werkgever wel.", "Stilzwijgen is geen toestemming; er is een actieve handeling nodig.", "Een bewaarplicht voor contracten verklaart niet de verwerking van de contactgegevens voor de samenwerking zelf."]}, {"q": "Een Belgische werkgever geeft de loongegevens van zijn werknemers door aan de sociale zekerheid en de fiscus. Welke rechtsgrond is dit?", "options": ["Toestemming van elke werknemer, elk jaar opnieuw te vernieuwen.", "Gerechtvaardigd belang van de werkgever om correct te boekhouden.", "Wettelijke verplichting: de wet legt de aangiften op.", "Vitaal belang, want het loon is noodzakelijk om te leven."], "answer": 2, "feedback": ["Toestemming zou intrekbaar zijn, en de aangifte kan niet stoppen omdat een werknemer dat wil.", "Boekhouden is een belang, maar de aangiften zijn geen keuze: ze zijn opgelegd, en dan is de verplichting de grond.", "Juist. De aangiften bij de aanwerving en per kwartaal en de bedrijfsvoorheffing zijn wettelijke verplichtingen; die verplichting is de rechtsgrond.", "Vitaal belang gaat over leven en fysieke integriteit in noodsituaties, niet over loonadministratie."]}, {"q": "Wat is het verschil tussen de rechtsgrond 'wettelijke verplichting' en de rechtsgrond 'algemeen belang'?", "options": ["Er is geen verschil: beide gelden alleen voor de overheid en haar instellingen.", "Bij de verplichting zegt de wet wat je moet verwerken; bij het algemeen belang draagt ze een taak op.", "De wettelijke verplichting geldt voor bedrijven, het algemeen belang voor burgers en verenigingen.", "Het algemeen belang vereist altijd toestemming van de betrokkene, de wettelijke verplichting niet."], "answer": 1, "feedback": ["De wettelijke verplichting geldt ook voor bedrijven en organisaties; het verschil zit in wat de wet precies bepaalt.", "Juist. Een gemeente die inwoners registreert, heeft een opgedragen taak en kiest zelf de nodige verwerking; een werkgever die loon aangeeft, voert een opgelegde verplichting uit.", "Het algemeen belang geldt voor organisaties met een opgedragen taak, niet voor burgers als verwerkingsverantwoordelijke.", "Geen van beide gronden vereist toestemming; dat is net het punt van een eigen rechtsgrond."]}, {"q": "Uit welke drie stappen bestaat de afweging bij het gerechtvaardigd belang?", "options": ["Toestemming vragen, de toezichthouder informeren en een boete reserveren.", "Register bijhouden, privacyverklaring publiceren en functionaris aanstellen.", "Gegevens pseudonimiseren, versleutelen en na een jaar wissen.", "Doeltoets, noodzakelijkheidstoets en belangenafweging."], "answer": 3, "feedback": ["Toestemming is een andere rechtsgrond; bij het gerechtvaardigd belang vraag je ze net niet, maar maak je een afweging.", "Dat zijn verplichtingen uit de verantwoordingsplicht, geen stappen van de belangenafweging.", "Dat zijn mogelijke waarborgen die in de derde stap meewegen, maar niet de drie stappen zelf.", "Juist. Is er een echt belang, is de verwerking daarvoor nodig, en wegen de belangen en verwachtingen van de betrokkene niet zwaarder?"]}, {"q": "Een organisatie steunt haar direct marketing op het gerechtvaardigd belang. Wat volgt daaruit voor de betrokkene?", "options": ["De betrokkene kan altijd bezwaar maken en dan stopt de marketing.", "De betrokkene kan niets ondernemen, want de organisatie heeft een geldige rechtsgrond.", "De betrokkene moet eerst een klacht indienen bij de toezichthouder voor de marketing stopt.", "De betrokkene kan alleen bezwaar maken als hij kan bewijzen dat hij schade lijdt."], "answer": 0, "feedback": ["Juist. Bij direct marketing is het recht van bezwaar onvoorwaardelijk; daarom staat onder elke marketingmail een uitschrijflink.", "Het gerechtvaardigd belang is net de grond waarbij de betrokkene de afweging mag betwisten.", "Een klacht is mogelijk, maar niet nodig: bezwaar bij de organisatie zelf volstaat en moet gevolgd worden.", "Bij direct marketing hoeft de betrokkene geen reden of schade aan te tonen."]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const RS = C.recordings ? C.recordings : (C.recording ? [Object.assign({id:'main'}, C.recording)] : []);
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = C.module + ' · ' + C.title + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */

      case 'quote':
        body = '<div class="quote"><div class="src">'+esc(s.source)+'</div><div class="txt">'+esc(s.quote).replace(/\n/g,'<br>')+'</div></div>'+(s.bullets?bullets(s.bullets):''); break;
      case 'reveal':
        body = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; break;
      case 'summary':
        body = '<div class="keyline">'+esc(s.key)+'</div>'+bullets(s.bullets); break;
      case 'cards':
        /* s.cards: [{k, t, sub, hl}], s.cols (aantal kolommen), optioneel s.intro */
        body = (s.intro?'<p class="intro" style="font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.2vw,14px);color:var(--text)">'+esc(s.intro)+'</p>':'')+'<div class="cards'+(s.cards.length>6?' dense':'')+'" style="grid-template-columns:repeat('+(s.cols||Math.min(s.cards.length,4))+',minmax(0,1fr))">'+s.cards.map((c,n)=>'<div class="cd'+(c.hl?' hl':'')+'">'+(s.numbered===false?'':'<div class="n">'+(n+1)+'</div>')+'<b>'+esc(c.k)+'</b>'+(c.t?'<span>'+esc(c.t)+'</span>':'')+(c.sub?'<div class="sub">'+esc(c.sub)+'</div>':'')+'</div>').join('')+'</div>'; break;
      case 'table':
        /* s.head: [..], s.rows: [[..]], s.hl: [rij-indexen], s.dim: [rij-indexen] */
        body = (s.intro?'<p style="font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.2vw,14px)">'+esc(s.intro)+'</p>':'')+'<table class="tbl">'+(s.head?'<thead><tr>'+s.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+s.rows.map((r,n)=>'<tr class="'+((s.hl||[]).includes(n)?'hl':((s.dim||[]).includes(n)?'dim':''))+'">'+r.map((c,k)=>{ const rl=(k===0&&s.rowlinks)?s.rowlinks[n]:null; if(!rl) return '<td>'+esc(c)+'</td>';
          /* s.rowlinks[n]: {url, rec:{v,t}} -> eerste cel aanklikbaar + kleine sprongknop naar de opname */
          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':
        /* s.items: [{t, end, k, t2}] -> sprongknoppen naar de opname */
        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+((s.question||s.layout==='stack')?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
