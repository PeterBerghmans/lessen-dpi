 finalités et des moyens, pas selon qui écrit techniquement. Si la conformité ne peut être garantie, l'EDPB recommande de ne pas utiliser la blockchain pour ce traitement.", "rec": [{"v": "p4", "t": 2314, "label": "La blockchain"}], "links": [{"label": "EDPB : lignes directrices blockchain (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202502_blockchain_v2_en.pdf"}]}]}, {"id": "A2", "title": "Partie A · Qualifier les parties — les 7 scénarios d'IA", "intro": "Les sept scénarios de la session : banque, VOD, assurance, hôpital, caméras, stress au travail, CHU.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons résolu sept scénarios de qualification des parties dans un système d'IA. Scénario 1 : une banque fait développer un chatbot de service client par « Eggsplain », une société d'infrastructure IA ; elle lui transmet ses données clients et des instructions précises de fine-tuning.", "q": "Vous êtes le DPO de la banque. Comment qualifiez-vous Eggsplain pour ce fine-tuning ?", "options": ["Responsable conjoint, car Eggsplain apporte son expertise technique.", "Responsable du traitement, car c'est elle qui entraîne le modèle.", "Destinataire sans rôle RGPD.", "Sous-traitant : la banque détermine la finalité et les moyens essentiels, Eggsplain exécute selon des instructions documentées."], "answer": 3, "feedback": ["L'expertise technique relève des moyens non essentiels ; elle ne crée pas de responsabilité conjointe.", "Entraîner le modèle sur instruction ne suffit pas pour devenir responsable.", "Eggsplain traite des données personnelles pour le compte de la banque.", "Variante : si Eggsplain avait fine-tuné de sa propre initiative pour revendre le modèle à plusieurs clients, elle serait responsable de cette activité."], "key": "Un même prestataire peut avoir des rôles différents selon l'activité de traitement : qualifiez traitement par traitement.", "rec": [{"v": "p3", "t": 1305, "label": "Scénario 1 : le chatbot bancaire"}], "links": [{"label": "IMY : rôles et fine-tuning d'IA (SV)", "url": "https://www.imy.se/globalassets/dokument/rapporter/ansvarsroller-enligt-gdpr-vid-finjustering-av-ai-applikationer.pdf"}]}, {"context": "Dans cette session de Stay Tuned, scénario 2 : un fournisseur pré-entraîne un modèle d'IA sur des données publiques. Une plateforme de VOD l'intègre et le ré-entraîne sur l'historique de visionnage de ses abonnés, collecté pour fournir le service, afin de recommander des contenus.", "q": "Vous êtes le DPO de la plateforme de VOD. Qui est responsable de quoi ?", "options": ["Le fournisseur est responsable de tout, puisque le modèle est le sien.", "Le fournisseur est sous-traitant de la plateforme pour l'ensemble.", "Deux traitements distincts : le fournisseur est responsable de l'entraînement initial ; la plateforme est responsable du ré-entraînement et de la recommandation.", "Plateforme et fournisseur sont responsables conjoints de la recommandation."], "answer": 2, "feedback": ["La plateforme décide seule de réutiliser les données de ses abonnés pour les recommandations.", "L'entraînement initial sur des données publiques est l'activité propre du fournisseur, pas une prestation pour la plateforme.", "La plateforme décide de la finalité (fidélisation) et des moyens essentiels (les données de visionnage utilisées).", "Il n'y a pas de décision commune sur les finalités et les moyens de la recommandation."], "key": "« Fournisseur d'un outil d'IA » n'est pas une qualification en soi : identifiez toujours l'activité de traitement précise.", "rec": [{"v": "p3", "t": 1500, "label": "Scénario 2 : la plateforme de VOD"}], "links": [{"label": "CNIL : qualification des fournisseurs d'IA", "url": "https://www.cnil.fr/fr/determiner-la-qualification-juridique-des-fournisseurs-de-systemes-dia"}]}, {"context": "Dans cette session de Stay Tuned, scénario 3 : un assureur externalise la gestion de ses dossiers de sinistres à un prestataire équipé d'un outil d'IA de tri automatique, selon un cahier des charges détaillé.", "q": "Vous êtes le DPO de l'assureur. Le prestataire propose, dans une nouvelle version du contrat, de réutiliser les dossiers de tous ses clients assureurs pour améliorer son propre outil. Qu'est-ce que cela change ?", "options": ["Rien : il reste sous-traitant pour tout, puisque le contrat principal ne change pas.", "Pour la gestion des sinistres, il reste sous-traitant ; pour l'entraînement de son propre outil, il deviendrait responsable (au moins conjoint) de cette activité.", "Il devient responsable conjoint de toute la gestion des sinistres.", "L'assureur devient sous-traitant du prestataire."], "answer": 1, "feedback": ["Un sous-traitant qui détermine des finalités propres devient responsable pour ce traitement (art. 28.10).", "Pour la gestion des sinistres, l'assureur détermine la finalité et les moyens essentiels ; l'entraînement de l'outil avec les données de plusieurs clients est une autre activité, avec une finalité propre au prestataire.", "La gestion des sinistres reste exécutée selon les instructions de l'assureur.", "L'assureur ne traite pas de données pour le compte du prestataire."], "key": "Lisez les clauses de réutilisation des données dans les contrats de prestataires d'IA : elles peuvent créer une nouvelle activité de traitement, avec un autre responsable.", "rec": [{"v": "p3", "t": 1740, "label": "Scénario 3 : la gestion des sinistres"}], "links": [{"label": "AP : liste d'exemples responsable / sous-traitant (NL)", "url": "https://autoriteitpersoonsgegevens.nl/documenten/voorbeeldlijst-wie-is-hier-de-verwerker-en-wie-de-verantwoordelijke"}]}, {"context": "Dans cette session de Stay Tuned, scénario 4 : un hôpital met en place un agent d'IA qui transmet automatiquement à l'assureur du patient les données de dépenses de santé nécessaires au remboursement, sans validation humaine ponctuelle. L'hôpital veut ainsi fluidifier sa facturation ; l'assureur instruit le remboursement selon ses propres règles.", "q": "Vous êtes le DPO de l'hôpital. Comment qualifiez-vous l'hôpital et l'assureur l'un envers l'autre pour cette transmission ?", "options": ["Responsable à responsable : chacun est responsable indépendant pour sa propre finalité.", "Responsables conjoints, car l'agent d'IA relie automatiquement leurs systèmes.", "L'hôpital est sous-traitant de l'assureur.", "L'assureur est sous-traitant de l'hôpital."], "answer": 0, "feedback": ["L'hôpital poursuit sa finalité (la facturation des soins), l'assureur la sienne (l'instruction du remboursement). Il n'y a ni finalité commune ni moyens décidés ensemble.", "L'automatisation par un agent d'IA ne crée pas, à elle seule, une responsabilité conjointe.", "L'hôpital ne traite pas les données pour le compte de l'assureur.", "L'assureur ne traite pas les données pour le compte de l'hôpital."], "key": "Une transmission automatisée entre deux organisations reste en principe une communication de responsable à responsable.", "rec": [{"v": "p3", "t": 1858, "label": "Scénario 4 : l'agent d'IA hospitalier"}], "links": [{"label": "AEPD : orientations sur l'IA agentique (EN)", "url": "https://www.aepd.es/en/guides/agentic-artificial-intelligence.pdf"}]}, {"context": "Dans cette session de Stay Tuned, scénario 5 : une commune, un éditeur de logiciel d'analyse d'images et un fournisseur de caméras forment un consortium pour tester des caméras augmentées qui analysent le flux et le comportement des véhicules. Ils définissent ensemble l'expérimentation. Le contrat prévoit en outre que les deux sociétés peuvent améliorer le logiciel avec les données collectées en temps réel.", "q": "Vous êtes le DPO de la commune. Qui est responsable de la constitution de la base d'apprentissage du logiciel ?", "options": ["La commune seule, puisque les caméras filment la voie publique.", "L'éditeur seul, puisque c'est son logiciel.", "Le fournisseur de caméras, qui collecte les images.", "La commune et les deux sociétés en responsables conjoints, si elles décident ensemble des finalités et des moyens ; une société qui réutilise les données pour une finalité propre serait responsable distincte."], "answer": 3, "feedback": ["Les sociétés n'agissent pas uniquement pour la commune : elles améliorent leur propre logiciel.", "La commune participe à la décision sur l'expérimentation et les données collectées.", "Collecter techniquement les images ne suffit pas à déterminer les finalités et les moyens.", "La session a présenté ces deux solutions, selon la manière dont les décisions sont prises en pratique."], "key": "Dans un consortium, documentez qui décide de quoi : la qualification dépend de la façon dont les finalités et les moyens sont réellement fixés.", "rec": [{"v": "p3", "t": 2348, "label": "Scénario 5 : les caméras augmentées"}], "links": [{"label": "CNIL : qualification des fournisseurs d'IA", "url": "https://www.cnil.fr/fr/determiner-la-qualification-juridique-des-fournisseurs-de-systemes-dia"}]}, {"context": "Dans cette session de Stay Tuned, scénario 6, inspiré d'un avertissement du Garante italien : Myndoor commercialise un plug-in d'analyse du stress par IA pour des salariés volontaires. Dès 10 utilisateurs actifs, l'employeur peut demander un rapport hebdomadaire agrégé ; il n'a pas accès aux données individuelles. Le Garante a estimé que le risque de réidentification ne pouvait pas être structurellement exclu. La session a aussi rappelé que l'AI Act interdit les systèmes d'IA qui infèrent les émotions sur le lieu de travail.", "q": "Vous êtes le DPO de l'employeur. La direction veut activer le rapport agrégé. Que lui dites-vous ?", "options": ["L'employeur devient responsable des données individuelles dès qu'il reçoit le rapport.", "Myndoor reste seule responsable des données individuelles ; le rapport agrégé ne montre pas de traitement côté employeur à ce stade, mais le risque de réidentification ne peut être exclu et l'AI Act interdit l'inférence des émotions au travail.", "Aucun problème : des données agrégées sont toujours anonymes.", "L'employeur et Myndoor sont responsables conjoints de tout le traitement."], "answer": 1, "feedback": ["L'employeur n'a structurellement pas accès aux données individuelles.", "Le Garante a adressé un avertissement : le risque de réidentification ne peut être structurellement exclu. En parallèle, l'art. 5.1.f de l'AI Act interdit l'inférence des émotions sur le lieu de travail par l'IA.", "Une architecture protectrice ne suffit pas seule si un risque résiduel de réidentification subsiste.", "L'employeur ne décide pas des finalités et des moyens de l'analyse individuelle."], "key": "Une agrégation n'est pas une garantie absolue : évaluez le risque résiduel de réidentification, et vérifiez l'AI Act en parallèle du RGPD.", "rec": [{"v": "p3", "t": 2984, "label": "Scénario 6 : le rapport de stress"}], "links": [{"label": "Garante : avertissement (IT)", "url": "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10255494"}]}, {"context": "Dans cette session de Stay Tuned, scénario 7 : plusieurs CHU, chacun responsable de ses propres données d'imagerie, entraînent ensemble un système d'IA de diagnostic par apprentissage fédéré, sans jamais partager leurs données brutes. Ils ont décidé ensemble d'entraîner ce système et en ont fixé ensemble le protocole. La session a rappelé que, selon la Cour de justice, la responsabilité conjointe ne suppose pas que chacun ait accès aux données.", "q": "Vous êtes le DPO d'un de ces CHU. Votre direction estime qu'en l'absence de partage des données brutes, chaque CHU reste responsable distinct. Qu'en pensez-vous ?", "options": ["Elle a raison : sans accès mutuel aux données, il ne peut y avoir de responsabilité conjointe.", "Chaque CHU est sous-traitant des autres.", "Les CHU sont responsables conjoints du traitement d'apprentissage, car ils en déterminent ensemble la finalité et les moyens essentiels.", "Seul le CHU qui coordonne le projet est responsable."], "answer": 2, "feedback": ["La CJUE l'a rappelé : la coresponsabilité ne suppose pas un accès mutuel aux données.", "Aucun CHU ne traite des données pour le compte d'un autre.", "Ils décident ensemble d'entraîner le système et des moyens essentiels (protocole, données exploitées par chacun). Un CHU qui réutiliserait le modèle pour une recherche propre serait responsable d'un traitement distinct.", "Tous les CHU participent aux décisions sur la finalité et les moyens."], "key": "Décider ensemble des finalités et des moyens essentiels suffit pour une responsabilité conjointe ; prévoyez alors un accord au sens de l'art. 26 RGPD.", "rec": [{"v": "p3", "t": 3528, "label": "Scénario 7 : l'apprentissage fédéré"}], "links": [{"label": "CNIL : qualification des fournisseurs d'IA", "url": "https://www.cnil.fr/fr/determiner-la-qualification-juridique-des-fournisseurs-de-systemes-dia"}]}]}, {"id": "B1", "title": "Partie B · Rôle du DPO et procédure", "intro": "La fiche de la CNIL sur l'AI officer, KFC, l'arrêt C-414/24, l'affaire d'Anvers.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné la fiche pratique de la CNIL (août 2026) sur les conflits d'intérêts du DPO, et la question du cumul avec un rôle d'« AI officer ». La CNIL rappelle qu'un pouvoir de décision sur les finalités et les moyens d'un traitement rend le DPO « juge et partie ». La session en a tiré une règle pratique : conseiller, encadrer les AIPD, former et auditer restent compatibles, à condition de décrire les missions par écrit.", "q": "Vous êtes DPO. On vous propose de devenir aussi « AI officer », chargé de valider les achats et les déploiements de systèmes d'IA. Que faites-vous ?", "options": ["Vous acceptez : l'AI Act ne prévoit aucune fonction légale d'AI officer, donc il n'y a pas d'incompatibilité.", "Vous acceptez, à condition d'en informer l'APD.", "Vous refusez toute mission liée à l'IA.", "Vous demandez d'abord une description écrite des missions : conseiller, encadrer les AIPD, former et auditer sont compatibles, mais décider des achats et des déploiements ne l'est pas."], "answer": 3, "feedback": ["L'absence de fonction légale équivalente ne règle pas la question du conflit d'intérêts (art. 38.6 RGPD).", "Il n'existe pas d'obligation de notifier un tel cumul à l'APD ; c'est l'analyse du conflit d'intérêts qui compte.", "Selon la session, conseiller, encadrer les AIPD, former et auditer restent compatibles.", "Un pouvoir de décision sur les finalités et les moyens rend le DPO « juge et partie ». Exercer soi-même le contrôle humain de l'art. 26.2 de l'AI Act est aussi un rôle opérationnel que le DPO ne devrait pas exercer."], "key": "Sans description écrite des missions, l'analyse de l'art. 38.6 est impossible. La CNIL introduit aussi la figure du DPO suppléant en cas de conflit sur un périmètre donné.", "rec": [{"v": "p1", "t": 665, "label": "La fiche de la CNIL"}], "links": [{"label": "CNIL : fiche DPO et conflits d'intérêts", "url": "https://www.cnil.fr/fr/dpo-identifier-gerer-conflits-interets"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de l'Audiencia Nacional (Espagne) qui confirme l'obligation de KFC de désigner un DPO, alors que KFC ne réalise que 1,1 % de son chiffre d'affaires en ligne. L'AEPD, dont la sanction a été confirmée par l'Audiencia Nacional, a retenu que l'activité de base d'une chaîne de restauration peut impliquer un suivi régulier et systématique à grande échelle, et s'est fondée sur la propre politique de confidentialité de KFC (application, géolocalisation, cookies de suivi, programme de fidélité). Il n'existe aucun seuil chiffré, et un « privacy lead » établi au Royaume-Uni n'a pas suffi.", "q": "Vous êtes le DPO d'une chaîne de restauration qui exploite une application de fidélité avec géolocalisation et cookies de suivi. La direction veut supprimer la fonction de DPO, « car nous ne sommes pas une entreprise de données ». Que répondez-vous ?", "options": ["Elle a raison : sans activité centrée sur les données, l'art. 37.1.b ne s'applique pas.", "Il faut analyser au cas par cas : si l'activité de base implique un suivi régulier et systématique à grande échelle, un DPO est obligatoire, même si les données ne sont pas le métier.", "Un DPO n'est obligatoire qu'au-delà d'un seuil chiffré d'utilisateurs.", "Le DPO de groupe basé au Royaume-Uni suffit."], "answer": 1, "feedback": ["L'argument de KFC a été rejeté : l'activité de base peut impliquer un suivi à grande échelle sans être une activité « de données ».", "L'obligation a même été déduite de la propre politique de confidentialité de KFC, y compris de traitements futurs mentionnés.", "Il n'existe aucun seuil chiffré : la grande échelle s'apprécie selon le contexte.", "Un privacy lead au Royaume-Uni n'a pas suffi : le DPO doit être facilement joignable localement (et, en Espagne, notifié à l'AEPD sous 10 jours)."], "key": "Votre politique de confidentialité peut être utilisée contre vous : ce qui y est annoncé compte pour apprécier l'obligation de désigner un DPO.", "rec": [{"v": "p1", "t": 1005, "label": "L'affaire KFC"}], "links": [{"label": "Audiencia Nacional : arrêt KFC (The DPO)", "url": "https://thedpo.eu/fr/decisions/0b275d3c-69f1-4e01-8a14-8c94e49e8794"}, {"label": "AEPD : décision PS-00140-2022 (ES)", "url": "https://www.aepd.es/documento/ps-00140-2022.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 18 juin 2026 (C-414/24, Datenschutzbehörde) : une médecin avait saisi le juge civil, puis l'autorité de contrôle, pour obtenir l'effacement de données sur une plateforme d'évaluation de médecins. L'autorité avait rejeté la plainte parce que le juge était déjà saisi. La Cour a jugé que la plainte devant l'autorité et le recours devant le juge sont des voies concurrentes et indépendantes, et que le droit national peut organiser leur articulation. Le rejet reste exclu même si le juge a déjà statué sans décision définitive ; une suspension de l'examen de la plainte jusqu'à la décision du juge est en revanche conforme au RGPD.", "q": "Vous êtes le DPO de la plateforme. Un plaignant a saisi à la fois le tribunal et l'APD. Votre direction compte sur un classement de la plainte par l'APD. Que lui dites-vous ?", "options": ["L'APD ne peut pas rejeter la plainte au seul motif qu'un juge est saisi ; elle peut en revanche, si le droit national le prévoit, suspendre son examen jusqu'à la décision du juge.", "L'APD doit rejeter la plainte, car le juge a une compétence prioritaire.", "L'APD peut la rejeter dès que le juge a statué en première instance.", "L'APD doit instruire la plainte et statuer avant le juge."], "answer": 0, "feedback": ["Les recours des art. 77 et 79 sont concurrents et indépendants. Un mécanisme de suspension est conforme au RGPD, un rejet pur et simple ne l'est pas.", "Le RGPD n'institue aucune compétence prioritaire ou exclusive au profit du juge ou de l'autorité.", "Même une décision au fond qui n'est pas encore définitive ne permet pas le rejet.", "Les États membres peuvent organiser l'articulation des recours, notamment par une suspension."], "key": "Préparez-vous à mener deux procédures en parallèle : un recours judiciaire n'éteint pas la plainte devant l'autorité.", "rec": [{"v": "p1", "t": 1480, "label": "L'arrêt C-414/24"}], "links": [{"label": "CJUE : arrêt C-414/24", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0414"}]}, {"context": "Dans cette session de Stay Tuned, nous avons parcouru le rapport annuel 2025 de l'APD, qui rappelle l'affaire d'Anvers : la ville a été sanctionnée pour ne pas avoir suivi l'avis de son DPO, qui avait pourtant signalé les problèmes en amont d'un test de mesure du bruit avec des enregistrements.", "q": "Vous êtes le DPO d'une ville qui veut tester des capteurs de bruit qui enregistrent des sons dans l'espace public. Vous estimez que le projet pose de sérieux problèmes. Que faites-vous ?", "options": ["Vous rendez un avis écrit et motivé, en amont, et veillez à ce qu'il soit consigné : la décision reste celle de la ville, qui en porte la responsabilité si elle passe outre.", "Vous bloquez vous-même le projet, puisque vous êtes le DPO.", "Vous signalez d'office le projet à l'APD avant toute décision de la ville.", "Vous donnez un avis oral, pour ne pas freiner le projet."], "answer": 0, "feedback": ["Dans l'affaire d'Anvers, le DPO avait signalé les problèmes en amont ; c'est la ville, qui avait continué à traiter les données, qui a été sanctionnée.", "Le DPO conseille et contrôle ; il ne décide pas à la place du responsable du traitement.", "Rien n'impose au DPO de saisir l'APD dans cette situation ; son rôle est d'abord de conseiller le responsable du traitement.", "Sans trace écrite, il sera difficile de démontrer que les risques ont été signalés à temps."], "key": "Un avis négatif du DPO, documenté et donné à temps, protège l'organisation s'il est suivi, et montre où se situe la responsabilité s'il ne l'est pas.", "rec": [{"v": "p4", "t": 2250, "label": "L'affaire d'Anvers"}, {"v": "p4", "t": 2150, "label": "Le rapport annuel de l'APD"}], "links": [{"label": "APD : rapport annuel 2025", "url": "https://www.autoriteprotectiondonnees.be/publications/rapport-annuel-2025.pdf"}]}]}, {"id": "B2", "title": "Partie B · Concepts et anonymisation", "intro": "Enschede, les cas pratiques de l'EDPB, IQVIA.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné l'affaire d'Enschede (Pays-Bas) : la commune comptait les visiteurs du centre-ville via les adresses MAC pseudonymisées des smartphones. L'amende de 600 000 € a été annulée, car l'autorité n'avait pas prouvé à temps qu'il s'agissait de données personnelles. Le Conseil d'État n'a pas tranché la question de savoir si ces données étaient personnelles. La session a rappelé qu'en conformité, c'est au responsable de démontrer le respect du RGPD (responsabilité, art. 5.2).", "q": "Vous êtes le DPO d'une commune qui utilise un système similaire. Votre échevin conclut de cet arrêt que vos données sont anonymes. Que lui répondez-vous ?", "options": ["Il a tort : l'arrêt n'a pas tranché la qualification. En répression, la charge de la preuve pèse sur l'autorité ; en conformité, c'est à vous de démontrer l'anonymat (art. 5.2).", "Il a raison, car « c'est techniquement possible » ne suffit jamais.", "Il a raison : le Conseil d'État néerlandais a jugé que des adresses MAC pseudonymisées ne sont pas des données personnelles.", "Il a tort : des adresses MAC sont toujours des données personnelles."], "answer": 0, "feedback": ["Une amende annulée ne valide pas votre propre revendication d'anonymat. Documentez une analyse d'identifiabilité motivée et datée.", "Le critère du considérant 26 vaut dans les deux sens : vous devez aussi pouvoir montrer vos propres analyses.", "Le Conseil d'État ne dit pas cela : la question reste entièrement ouverte.", "L'identifiabilité s'apprécie au cas par cas, selon les moyens raisonnablement susceptibles d'être utilisés."], "key": "L'asymétrie à connaître : la preuve déterminante doit exister au moment de la décision de l'autorité, mais en conformité la charge de prouver l'anonymat pèse sur vous.", "rec": [{"v": "p1", "t": 1788, "label": "L'affaire d'Enschede"}], "links": [{"label": "Raad van State : arrêt du 29 juillet 2026 (NL)", "url": "https://www.raadvanstate.nl/uitspraken/@159747/202401622-1-a3/"}]}, {"context": "Dans cette session de Stay Tuned, nous avons résolu le cas pratique 1 des lignes directrices de l'EDPB sur l'anonymisation : un jeu de données de patients contient le sexe, la date de naissance complète, le code postal et une maladie auto-immune, sans modification. Ces attributs se retrouvent aussi dans des registres publics. Les lignes directrices proposent trois critères : No Record Isolation (aucune ligne ne permet d'isoler une personne), No Linkage (pas de recoupement avec d'autres sources) et No Inference (pas de déduction d'une information sur une personne). La violation d'un critère impose une analyse approfondie, sans conclure automatiquement.", "q": "Vous êtes le DPO de l'institut de recherche qui détient ce jeu. Un chercheur affirme que les données sont anonymes, puisqu'elles ne contiennent pas de noms. Que lui répondez-vous ?", "options": ["Il a raison : sans nom, il n'y a pas d'identification.", "Le critère « No Record Isolation » est violé et, comme les attributs peuvent être recoupés avec des registres publics, les données doivent être traitées comme personnelles.", "Les données sont personnelles uniquement parce qu'elles concernent la santé.", "Il suffit de supprimer la colonne « maladie » pour les rendre anonymes."], "answer": 1, "feedback": ["Chaque ligne est une combinaison unique d'attributs qui permet de singulariser une personne.", "La violation d'un critère n'entraîne pas automatiquement la qualification de donnée personnelle, mais ici l'isolement permet réellement de singulariser l'individu par des moyens raisonnables.", "La nature sensible de la donnée ne décide pas de l'anonymat ; c'est le risque de réidentification qui compte.", "Sexe, date de naissance et code postal restent une combinaison unique et recoupable."], "key": "Testez systématiquement les trois critères (No Record Isolation, No Linkage, No Inference) et approfondissez en cas de violation, sans conclure trop vite.", "rec": [{"v": "p1", "t": 3195, "label": "Le cas pratique 1"}], "links": [{"label": "EDPB : lignes directrices anonymisation (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons résolu le cas pratique 2 des lignes directrices de l'EDPB sur l'anonymisation : un rapport public indique que les ingénieurs coûtent au total 550 000 € par an ; un rapport interne indique que l'équipe « Product Engineering » compte 5 des 6 ingénieurs pour 480 000 €. Rappel des trois critères : No Record Isolation (aucune ligne ne permet d'isoler une personne), No Linkage (pas de recoupement avec d'autres sources) et No Inference (pas de déduction d'une information sur une personne).", "q": "Vous êtes le DPO de l'entreprise. Le service financier veut transmettre le rapport interne à un partenaire qui a aussi accès au rapport public. Quel est le risque ?", "options": ["Aucun : les deux rapports ne contiennent que des montants agrégés.", "Le critère « No Record Isolation » est violé.", "Le risque n'existe que si les rapports mentionnent des noms.", "Le critère « No Inference » est violé : le partenaire peut déduire le salaire du sixième ingénieur (70 000 €)."], "answer": 3, "feedback": ["Pris séparément, ils sont agrégés ; combinés, ils recréent une donnée individuelle.", "Aucune ligne isolée ne vise un individu ; le problème vient de la déduction.", "Le sixième ingénieur est identifiable au sein de l'entreprise sans être nommé.", "L'inférence est spécifique (un individu identifiable) et significative (son salaire). Elle ne concerne toutefois que les entités qui ont accès aux deux rapports."], "key": "Avant de partager des données agrégées, vérifiez ce que le destinataire peut déjà savoir : la combinaison de sources peut recréer une donnée personnelle.", "rec": [{"v": "p1", "t": 3505, "label": "Le cas pratique 2"}], "links": [{"label": "EDPB : lignes directrices anonymisation (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons résolu le cas pratique 3 des lignes directrices de l'EDPB sur l'anonymisation : un média veut partager des informations anonymisées avec une autorité publique locale. Seul le média détient l'information privilégiée qui permet de lever l'anonymisation ; la loi interdit aux tiers d'y accéder. Mais la sécurité informatique du média est obsolète et des médias similaires ont été piratés. Les lignes directrices demandent d'évaluer l'anonymat selon chaque perspective pertinente, y compris celle d'un attaquant.", "q": "Vous êtes le DPO du média. Selon le raisonnement des lignes directrices de l'EDPB, les données sont-elles anonymes ?", "options": ["Oui, pour tout le monde : l'interdiction légale suffit.", "Non, pour personne : une interdiction légale n'a jamais aucune valeur.", "Elles sont anonymes pour l'autorité publique, soumise à l'État de droit, mais pas du point de vue d'un pirate, vu la sécurité obsolète du média.", "Oui, à condition de signer un contrat de confidentialité avec l'autorité."], "answer": 2, "feedback": ["Une interdiction légale n'est un frein efficace que si elle est réellement respectée en pratique.", "Une interdiction légale est un frein réel pour une entité soumise à l'État de droit, mais elle doit être appréciée avec les mesures techniques.", "Même jeu de données, deux conclusions selon la perspective. La session a toutefois nuancé cette solution : en combinant l'interdiction légale et la sécurité obsolète, le risque peut devenir réel pour tout le monde, y compris pour l'autorité. Une interdiction légale doit toujours s'accompagner de mesures techniques documentées.", "Une interdiction purement contractuelle ne vaut pas interdiction légale."], "key": "Identifiez toujours les perspectives pertinentes, y compris celle des cybercriminels : une sécurité défaillante peut à elle seule faire basculer une donnée du côté « personnel ».", "rec": [{"v": "p1", "t": 3905, "label": "Le cas pratique 3"}], "links": [{"label": "EDPB : lignes directrices anonymisation (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné la sanction de 5 millions d'euros de la CNIL contre IQVIA. Les données provenaient des pharmacies, qui les transmettaient à un premier tiers de confiance. IQVIA mettait elle-même en place, avec des tiers de confiance, la chaîne de pseudonymisation de ses entrepôts de données de santé, et suivait chaque patient par un code unique ; elle s'était engagée par contrat à ne pas réidentifier. Elle invoquait l'arrêt SRB, selon lequel des données pseudonymisées peuvent être anonymes pour un destinataire qui n'a aucun moyen raisonnable de réidentifier. La CNIL a considéré la chaîne comme un seul traitement d'IQVIA, et son rapporteur a réidentifié une patiente en quelques minutes.", "q": "Vous êtes le DPO d'une entreprise qui met elle-même en place une chaîne de pseudonymisation avec des tiers de confiance, et suit chaque patient par un code unique. Votre direction invoque l'arrêt SRB. Que répondez-vous ?", "options": ["L'arrêt SRB n'aide que le simple destinataire : qui met en place la chaîne et peut individualiser les patients traite des données personnelles.", "L'arrêt SRB s'applique : des données pseudonymisées sont anonymes pour qui ne détient pas la clé.", "Une interdiction contractuelle de réidentifier suffit pour conclure à l'anonymat.", "Les pharmaciens en amont sont seuls responsables de la chaîne."], "answer": 0, "feedback": ["Le suivi dans le temps par un code unique prouve l'individualisation ; le rapporteur de la CNIL a réidentifié une patiente en quelques minutes.", "La CNIL a rejeté cet argument : la chaîne est un seul traitement d'IQVIA.", "Une interdiction contractuelle ne vaut pas interdiction légale.", "La CNIL considère la chaîne comme un seul traitement d'IQVIA ; le défaut d'information reste en outre imputable au responsable."], "key": "N'invoquez jamais Breyer ou SRB comme un totem : démontrez, pour l'entité concernée, que le risque de réidentification est réellement insignifiant.", "rec": [{"v": "p2", "t": 845, "label": "La sanction IQVIA"}], "links": [{"label": "CNIL : délibération SAN-2026-008 (IQVIA)", "url": "https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000054136834"}]}]}, {"id": "B3", "title": "Partie B · Champ d'application et licéité", "intro": "Lusha, la décision 163/2026, Infobel, Elkjøp, RRC Sports.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné la sanction de 2 millions d'euros du Garante italien contre Lusha, une société américaine sans établissement dans l'UE qui agrège des contacts professionnels et met à jour chaque semaine leur fonction. Le Garante a appliqué le RGPD au titre du « suivi du comportement » (art. 3.2.b), sans exiger de profilage technique. En 2022, la CNIL avait au contraire jugé le RGPD inapplicable à la même société. Sans établissement dans l'UE, il n'y a pas de guichet unique : chaque autorité apprécie les faits librement.", "q": "Vous êtes le DPO d'une entreprise européenne qui achète l'accès à une base de ce type. Le fournisseur affirme que le RGPD ne s'applique pas à lui, citant une ancienne décision de la CNIL de 2022. Comment évaluez-vous cet argument ?", "options": ["Il est solide : sans établissement dans l'UE, le RGPD ne s'applique jamais.", "Il est solide : la décision de la CNIL lie toutes les autorités.", "Il ne suffit pas : selon le Garante, suivre en continu la position professionnelle des personnes est un « suivi du comportement » (art. 3.2.b), et hors guichet unique, chaque autorité peut juger autrement.", "Il ne suffit pas, car tout traitement de données d'Européens relève toujours du RGPD."], "answer": 2, "feedback": ["L'art. 3.2 étend le champ d'application aux responsables non établis dans l'UE.", "Sans établissement principal dans l'UE, il n'y a pas de guichet unique : chaque autorité reste libre d'apprécier les mêmes faits.", "Le Garante n'a pas exigé de profilage technique. La même activité peut être jugée hors champ dans un État membre et sanctionnée dans un autre.", "Le champ territorial suit les critères de l'art. 3, pas la seule nationalité ou résidence des personnes."], "key": "Avant d'acheter l'accès à une base de contacts, vérifiez la base légale et la transparence du fournisseur : l'absence d'établissement dans l'UE ne met plus un courtier en données à l'abri.", "rec": [{"v": "p2", "t": 1350, "label": "L'affaire Lusha"}], "links": [{"label": "Garante : décision Lusha (IT)", "url": "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10275035"}, {"label": "CNIL : délibération SAN-2022-024 (2022)", "url": "https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000046775564"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné la décision 163/2026 de l'APD : après un achat de billet en ligne, un client recevait des e-mails de marketing personnalisés fondés sur son historique d'achats. L'affaire s'est terminée par une transaction de 5 000 €. L'APD distingue deux traitements : l'envoi de l'e-mail, où le soft opt-in de la directive e-Privacy couvre une offre similaire liée au dernier achat (et, selon l'arrêt Inteligo Media, ne requiert pas en plus une base de l'art. 6 RGPD), et le profilage à partir de l'historique, qui doit se justifier séparément sous l'art. 6.1 RGPD.", "q": "Vous êtes le DPO d'une salle de spectacles. Le service marketing veut construire des segments à partir de l'historique d'achats et envoyer des offres, en invoquant le soft opt-in. Que lui dites-vous ?", "options": ["Le soft opt-in couvre aussi la segmentation, puisqu'il s'agit du même client.", "Il faut le consentement du client pour tout e-mail, même pour un produit similaire.", "Selon l'arrêt Inteligo Media, dès que le soft opt-in s'applique, aucune base de l'art. 6 n'est requise, segmentation comprise.", "Le soft opt-in couvre l'envoi d'une offre similaire ; le profilage à partir de l'historique est un traitement distinct, à justifier séparément sous l'art. 6.1 RGPD."], "answer": 3, "feedback": ["L'APD distingue deux traitements : l'envoi (e-Privacy) et le profilage (RGPD).", "Le soft opt-in permet l'envoi d'offres similaires liées au dernier achat, avec une opposition aisée.", "Inteligo Media vise l'envoi ; le profilage reste un traitement distinct, à justifier séparément.", "Selon les constatations du Service d'Inspection, reprises dans la décision de transaction (sans décision au fond), l'intérêt légitime ne passait pas le test de mise en balance, au regard des attentes raisonnables. Prévoyez aussi un lien de désinscription sans login dans chaque e-mail."], "key": "Séparez l'envoi et le profilage, vérifiez l'exactitude des mentions de canal (« en ligne uniquement ») et limitez les durées de conservation.", "rec": [{"v": "p2", "t": 2360, "label": "La décision 163/2026"}], "links": [{"label": "APD : décision de transaction 163/2026", "url": "https://www.autoriteprotectiondonnees.be/publications/decision-de-transaction-n0-163-2026-du-16-juillet-2026.pdf"}, {"label": "APD : recommandation marketing direct", "url": "https://www.autoriteprotectiondonnees.be/publications/recommandation-01-2025-relative-aux-traitements-de-donnees-a-caractere-personnel-dans-le-cadre-du-marketing-direct.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la Cour des marchés du 3 juin 2026 dans l'affaire Infobel : un courtier en données revendait, à des fins de marketing, des données obtenues d'un opérateur télécom sur la base d'un consentement donné en 2006. Ce consentement n'était ni libre, ni spécifique, ni éclairé au sens du RGPD. La Cour a rappelé que chaque responsable de la chaîne doit pouvoir démontrer lui-même sa base légale.", "q": "Vous êtes le DPO d'une agence média qui veut acheter une base de prospects à un courtier. Le contrat garantit que « toutes les données ont été obtenues avec un consentement valable ». Est-ce suffisant ?", "options": ["Oui : la garantie contractuelle du fournisseur transfère la responsabilité.", "Non : chaque maillon de la chaîne doit démontrer lui-même sa base légale (art. 24) ; vérifiez vous-même que la base invoquée tient réellement.", "Oui, si le consentement date d'avant le RGPD.", "Non, car l'achat de données est interdit en Belgique."], "answer": 1, "feedback": ["Un responsable ne peut jamais se contenter de renvoyer au contrat d'un tiers en amont.", "Le consentement de 2006 n'était ni libre, ni spécifique, ni éclairé au sens de l'art. 4.11. La Cour a toutefois réduit l'amende de 40 000 € à 5 000 € et annulé une injonction trop générale.", "Un consentement ancien doit répondre aux exigences du RGPD pour un traitement postérieur au 25 mai 2018.", "L'achat de données n'est pas interdit en soi ; il faut une base légale démontrable."], "key": "Avant d'exploiter des données achetées, vérifiez la base légale vous-même. En cas de contestation, examinez aussi la formulation des injonctions et la méthode de calcul de l'amende.", "rec": [{"v": "p2", "t": 3160, "label": "L'arrêt Infobel"}], "links": [{"label": "Cour des marchés : arrêt Infobel", "url": "https://www.autoriteprotectiondonnees.be/publications/arret-du-3-juin-2026-de-la-cour-des-marches-ar-2079.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné la sanction de 20 millions de couronnes norvégiennes contre Elkjøp : l'adhésion au club de fidélité était conditionnée à l'acceptation du profilage et de l'analyse. Le Datatilsynet a jugé ce consentement « tout ou rien » invalide : « marketing » n'est pas une finalité assez précise, et newsletter, profilage et analyse sont des finalités distinctes, qui demandent chacune un consentement spécifique, libre et éclairé.", "q": "Vous êtes le DPO d'une chaîne de magasins qui lance un club de fidélité avec une seule case « J'accepte le marketing ». Que conseillez-vous ?", "options": ["Une case unique suffit si les conditions générales détaillent les finalités.", "Remplacer le consentement par l'intérêt légitime pour éviter le problème.", "Un choix actif et distinct pour la newsletter, le profilage et l'analyse : un consentement « tout ou rien » n'est jamais valable.", "Conditionner l'adhésion au profilage, puisque le club offre un avantage commercial."], "answer": 2, "feedback": ["« Marketing » seul n'est pas une finalité assez précise, et le consentement doit être spécifique pour chaque finalité.", "L'intérêt légitime ne répare pas l'absence de base ; il exige en outre une mise en balance documentée.", "Une nouvelle finalité exige aussi une évaluation de compatibilité (art. 6.4), et aucun profilage marketing de mineurs sans vérification d'âge réelle.", "Même avec un avantage commercial, on ne peut pas conditionner l'adhésion à l'acceptation du profilage."], "key": "Une base légale distincte et documentée par finalité de marketing : c'est le message commun des décisions norvégienne et belge.", "rec": [{"v": "p3", "t": 13, "label": "L'affaire Elkjøp"}], "links": [{"label": "Datatilsynet : décision Elkjøp (NO)", "url": "https://www.datatilsynet.no/regelverk-og-verktoy/lover-og-regler/avgjorelser-fra-datatilsynet/2026/overtredelsesgebyr-til-elkjop/"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 16 juillet 2026 (C-209/23, RRC Sports) sur le règlement des agents de la FIFA, qui impose la collecte des contrats et paiements des agents et la publication de nombreuses informations, dont toutes les sanctions et le détail des transactions. La Cour admet que la fédération collecte les données nécessaires au contrôle de sa réglementation, et que la publication de données professionnelles peut se fonder sur l'intérêt légitime ; mais elle censure la publication de toutes les sanctions, quelle que soit leur gravité, et rappelle que les données pénales exigent le contrôle d'une autorité publique d'un État membre (art. 10).", "q": "Vous êtes le DPO d'une fédération sportive qui veut publier en ligne, pour tous, l'ensemble des sanctions infligées à ses agents, sans limite de durée. Que conseillez-vous ?", "options": ["Publier sans réserve : la publication est plus dissuasive qu'une amende.", "Ne rien publier : l'intérêt légitime ne peut jamais justifier une publication.", "Publier uniquement les sanctions pénales, qui sont les plus graves.", "Limiter la publication selon la gravité, la durée et le préjudice causé ; ne publier aucune sanction pénale, qui exige le contrôle d'une autorité publique d'un État membre (art. 10)."], "answer": 3, "feedback": ["Publier toute sanction, quelle que soit sa gravité et sans limite de durée, échoue à la mise en balance.", "Hors champ pénal, la publication peut être nécessaire et l'emporter dans la balance, car les données sont professionnelles.", "C'est l'inverse : une fédération ne peut pas traiter des données pénales, qui exigent le contrôle d'une autorité publique d'un État membre.", "Hors champ pénal, la publication peut l'emporter dans la balance, mais pas pour toute sanction, quelle que soit sa gravité et sans limite de durée. Pour le détail des transactions, la Cour exige en outre de réserver l'accès aux personnes soumises aux obligations de vérification (art. 5.1.c)."], "key": "Le test de l'intérêt légitime comporte trois conditions cumulatives : intérêt légitime, nécessité (pas de moyen moins intrusif aussi efficace) et mise en balance.", "rec": [{"v": "p3", "t": 520, "label": "L'arrêt RRC Sports"}], "links": [{"label": "CJUE : arrêt C-209/23 (RRC Sports)", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62023CJ0209"}]}]}, {"id": "B4", "title": "Partie B · IA et web scraping", "intro": "AI Act et RGPD, le web scraping et les données sensibles.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné l'articulation entre l'AI Act et le RGPD : les deux s'appliquent cumulativement, et une même violation peut ouvrir deux procédures devant deux autorités. Pour certains déployeurs de systèmes d'IA à haut risque, l'AI Act prévoit une analyse d'impact sur les droits fondamentaux (FRIA) ; le RGPD prévoit une AIPD. Les deux analyses se recoupent largement : la CNIL relève qu'au moins quatre volets de l'AIPD peuvent être repris dans la FRIA.", "q": "Vous êtes le DPO d'une entreprise qui déploie un système d'IA à haut risque. Le service juridique propose de mener l'analyse d'impact sur les droits fondamentaux de l'AI Act (FRIA) séparément de l'AIPD du RGPD, par deux équipes. Que conseillez-vous ?", "options": ["Garder deux analyses séparées, car ce sont deux règlements distincts.", "Articuler l'AIPD et la FRIA en un seul processus, sur un référentiel commun entre IT, juridique et DPO.", "Ne faire que la FRIA : l'AI Act remplace le RGPD pour les systèmes d'IA.", "Ne faire que l'AIPD : le RGPD prime sur l'AI Act."], "answer": 1, "feedback": ["Dupliquer les analyses en silos est justement ce que la session déconseille.", "Tenez aussi un inventaire des systèmes d'IA et revoyez les contrats fournisseurs pour couvrir la supervision humaine et le partage des responsabilités.", "Les deux règlements s'appliquent cumulativement.", "Aucun ne prime : les obligations s'additionnent, tout comme les amendes en théorie."], "key": "Cartographiez, articulez, sécurisez les contrats et décloisonnez la gouvernance de l'IA. Notez aussi le report du calendrier « haut risque » par le Digital Omnibus (annexe III : 2 décembre 2027).", "rec": [{"v": "p3", "t": 965, "label": "AI Act et RGPD"}], "links": [{"label": "Commission européenne : AI Omnibus, calendrier (EN)", "url": "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force"}]}, {"context": "Dans cette session de Stay Tuned, nous avons parcouru les lignes directrices de l'EDPB sur le web scraping pour entraîner des modèles d'IA générative. Selon l'EDPB, le consentement est en général inadapté, faute de relation directe avec les personnes ; la base la plus utilisée est l'intérêt légitime, avec ses trois conditions (intérêt réel, nécessité, mise en balance). La présence de signaux techniques comme robots.txt ou ai.txt pèse contre le scraping dans la mise en balance, mais leur absence n'autorise rien.", "q": "Vous êtes le DPO d'une start-up qui collecte des forums publics pour entraîner un agent conversationnel. Le développeur affirme : « Les sites n'ont pas de robots.txt, donc les gens sont d'accord. » Que répondez-vous ?", "options": ["L'absence de robots.txt ne vaut jamais un consentement ; la base la plus utilisée est l'intérêt légitime, avec ses trois conditions documentées.", "Il a raison : l'absence de signal technique vaut consentement.", "Le consentement de chaque personne est la seule base possible.", "Le RGPD ne s'applique pas à des données publiées volontairement."], "answer": 0, "feedback": ["La présence de signaux (robots.txt, ai.txt, CAPTCHA) pèse contre le scraping dans la mise en balance ; leur absence n'autorise rien. L'intérêt légitime doit être réel et précis, nécessaire, et passer la mise en balance.", "L'absence de ces signaux ne vaut jamais un consentement au sens du RGPD.", "Le consentement est en général inadapté : il n'y a pas de relation directe avec chaque personne.", "Le RGPD s'applique dès qu'il y a une opération sur des données personnelles, même publiques."], "key": "Exigez des mesures de minimisation avant et après la collecte, et une information publique complète : sources, caractéristiques du robot, modalités d'exercice des droits.", "rec": [{"v": "p3", "t": 3770, "label": "Le web scraping"}], "links": [{"label": "EDPB : lignes directrices web scraping (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons vu que la collecte de données sensibles par scraping est une « voie étroite ». Par analogie avec l'arrêt GC e.a. (C-136/17, moteurs de recherche), l'EDPB admet une collecte incidente et résiduelle à quatre conditions cumulatives, dont une collecte non intentionnelle. Ce n'est jamais une exemption générale, et l'art. 9.2 exige une dérogation en plus d'une base de l'art. 6.", "q": "Vous êtes le DPO d'une start-up qui collecte des forums publics pour entraîner un agent conversationnel. Le jeu de données collecté contient inévitablement des opinions politiques et des données de santé. Que faut-il au minimum ?", "options": ["Rien de plus : ces données ont été rendues publiques par les personnes.", "Un simple filtre après l'entraînement suffit.", "Le consentement explicite de chaque personne concernée.", "Documenter les quatre conditions (similarité avec un moteur de recherche, collecte non intentionnelle, impossibilité de filtrer avant collecte, mesures effectives) et appliquer des mesures à chaque étape du cycle de vie."], "answer": 3, "feedback": ["L'art. 9.2 exige une dérogation, en plus d'une base de l'art. 6.", "Les mesures doivent couvrir chaque étape : filtres avant collecte, suppression dès identification, tests pendant l'entraînement, surveillance après la mise sur le marché.", "Le consentement explicite est pratiquement impossible à obtenir dans un scraping à grande échelle.", "La collecte incidente et résiduelle peut rester dans les « responsabilités, pouvoirs et capacités » du responsable, à ces conditions cumulatives."], "key": "Réévaluez régulièrement les risques de mémorisation et de régurgitation : une fois le modèle entraîné, les données ne peuvent plus être facilement supprimées.", "rec": [{"v": "p3", "t": 4150, "label": "Le web scraping et les données sensibles"}], "links": [{"label": "EDPB : lignes directrices web scraping (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf"}]}]}, {"id": "B5", "title": "Partie B · Droits", "intro": "La décision maltaise, Darashev, Lexbase.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné une décision de l'autorité maltaise (IDPC, 5 août 2026) : une ancienne employée réclamait à son ex-employeur la copie de « tous ses e-mails » ; l'employeur n'avait transmis qu'un relevé de temps et l'historique des congés. L'IDPC a rappelé que le droit d'accès porte sur les données personnelles de la personne, et non sur une boîte mail en tant que telle : le contenu d'un e-mail professionnel n'est pas forcément une donnée personnelle de son auteur. La plainte a été rejetée.", "q": "Vous êtes le DPO de cet employeur. L'ancienne employée insiste et menace de saisir l'autorité. Que lui répondez-vous ?", "options": ["Vous transmettez l'intégralité de sa boîte mail : son adresse est une donnée personnelle, donc tout son contenu aussi.", "Vous examinez les messages selon leur contenu et transmettez ceux qui contiennent réellement des données personnelles la concernant, en motivant pourquoi les e-mails professionnels ou liés aux clients n'en font pas partie.", "Vous refusez toute communication : un compte professionnel appartient à l'organisation.", "Vous demandez d'abord le consentement des clients mentionnés."], "answer": 1, "feedback": ["L'adresse est une donnée personnelle, mais le contenu d'un e-mail professionnel ne l'est pas nécessairement.", "Le droit d'accès suit les données personnelles, pas la boîte aux lettres. L'IDPC a rejeté la plainte dans son intégralité.", "Les messages de nature réellement personnelle, même envoyés depuis la messagerie professionnelle, restent communicables.", "La question n'est pas le consentement des clients, mais la présence de données personnelles de la demanderesse."], "key": "Formalisez une politique écrite pour la période qui suit la fin du contrat, et gardez la preuve d'une réponse dans le mois.", "rec": [{"v": "p3", "t": 4336, "label": "La décision maltaise"}], "links": [{"label": "IDPC Malte : décision CDP/COMP/130/2025 (EN)", "url": "https://idpc.org.mt/wp-content/uploads/2026/08/CDP_COMP_130_2025.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 4 juin 2026 (C-312/24, Darashev) : un policier bulgare, soupçonné puis jamais poursuivi, voyait sa garde à vue mentionnée dans son dossier personnel et s'était vu refuser une promotion. La Cour a jugé que la conservation dans le dossier personnel, à des fins RH, relève du RGPD et non de la directive « police » ; que la qualité de suspect est une donnée pénale (art. 10) ; et que conserver la trace d'une enquête sans poursuites n'est pas apte à garantir la probité du personnel.", "q": "Vous êtes le DPO d'un service public dont un agent a été suspect dans une enquête, finalement suspendue faute d'identification de l'auteur. Le service RH veut garder la mention dans le dossier. Que conseillez-vous ?", "options": ["La garder : la directive 2016/680 s'applique, pas le RGPD.", "La garder : une simple qualité de suspect n'est pas une donnée pénale.", "La garder : une instruction ministérielle interne suffit toujours comme base légale.", "La conservation à des fins RH relève du RGPD ; elle se justifie si l'enquête est en cours ou a abouti à des poursuites, mais difficilement après une enquête suspendue, et l'agent peut alors obtenir l'effacement."], "answer": 3, "feedback": ["La collecte initiale relève de la directive ; la conservation dans le dossier personnel, à des fins RH, relève du RGPD.", "Les données relatives à la qualité de suspect sont des données pénales au sens de l'art. 10, même si l'infraction n'est pas établie.", "Un acte réglementaire peut servir de base s'il est clair, précis, prévisible et habilité par le droit national ; encore faut-il que la conservation soit apte à atteindre l'objectif.", "Garantir la probité du personnel est un objectif légitime, mais conserver la trace d'une enquête suspendue, sans preuve ni procédure disciplinaire, n'est pas apte à le satisfaire."], "key": "Quand des données d'enquête passent dans un dossier RH, changez de grille : RGPD, base légale claire, art. 10, et durée de conservation limitée au nécessaire.", "rec": [{"v": "p3", "t": 4728, "label": "L'arrêt Darashev"}], "links": [{"label": "CJUE : arrêt C-312/24 (Darashev)", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0312"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 9 juillet 2026 (C-199/24, Legal Newsdesk Sweden) sur Lexbase, une base payante qui permet de rechercher les personnes poursuivies pénalement en Suède. La Cour a jugé que mettre des jugements bruts à disposition de quiconque paie ne relève pas des fins journalistiques, qui supposent un travail éditorial, et que les États membres ne peuvent pas supprimer les voies de recours du RGPD au nom de la liberté d'expression.", "q": "Vous êtes le DPO d'une société qui veut lancer une base payante de jugements pénaux bruts, en invoquant la liberté de la presse. Que lui dites-vous ?", "options": ["Mettre des jugements bruts à disposition de quiconque paie ne relève pas des fins journalistiques ; et aucun État ne peut supprimer les recours du chapitre VIII du RGPD.", "C'est du journalisme dès que l'activité est payante et en ligne.", "C'est du journalisme, car les jugements sont publics.", "Le RGPD ne s'applique pas à la publication de décisions de justice."], "answer": 0, "feedback": ["Les fins journalistiques supposent une rédaction ou une ligne éditoriale, une vérification des faits et le respect de la déontologie. Les recours (art. 77 à 79 et 82) restent toujours acquis.", "Ni le caractère payant ni le support internet ne suffisent ; ils n'excluent pas non plus en soi les fins journalistiques.", "La nature publique des jugements ne suffit pas : il faut un travail éditorial.", "Publier en ligne des décisions de justice est bien un traitement au sens de l'art. 4.2."], "key": "L'art. 85 impose une conciliation par la loi, mais n'autorise aucune exemption générale, et jamais pour les voies de recours.", "rec": [{"v": "p3", "t": 5200, "label": "L'arrêt Lexbase"}], "links": [{"label": "CJUE : arrêt C-199/24 (Legal Newsdesk Sweden)", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0199"}]}]}, {"id": "B6", "title": "Partie B · Conservation et transferts", "intro": "Blankenburg, NADA Austria, Trump v. Slaughter, Yango, la DSB.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné le jugement du tribunal de Rotterdam du 8 juillet 2026 sur le péage du tunnel Blankenburg : trois amendes ont été annulées, car l'administration avait effacé les rappels de paiement « pour des raisons de vie privée » et ne pouvait plus les produire ; le tribunal ne pouvait vérifier ni leur contenu ni l'adresse. Une loi sectorielle permettait pourtant de les conserver jusqu'à cinq ans après que l'amende était devenue définitive.", "q": "Vous êtes le DPO d'un organisme qui envoie des rappels de paiement suivis d'amendes. L'IT propose d'effacer les rappels 30 jours après l'envoi, par minimisation. Que conseillez-vous ?", "options": ["Prévoir un palier « durée contentieuse » : conserver les pièces tant qu'un recours est possible, et aligner la purge sur le sort réel du dossier.", "Conserver tous les rappels indéfiniment, par prudence.", "Accepter : la minimisation impose d'effacer au plus vite.", "Ne conserver que la date et l'heure d'envoi."], "answer": 0, "feedback": ["L'absence de preuve retombe sur qui a choisi d'effacer. Ici, une loi sectorielle autorisait même la conservation jusqu'à cinq ans après que l'amende est devenue définitive.", "Une conservation illimitée violerait la limitation de la conservation (art. 5.1.e).", "La minimisation et la limitation de la conservation ne signifient pas « effacer au plus vite » ; elles s'articulent avec la conservation des preuves.", "C'est exactement ce qui a fait tomber les amendes : le tribunal ne pouvait vérifier ni le contenu ni l'adresse."], "key": "Liez la durée de conservation au cycle de vie du dossier, pas à une date fixe déconnectée de la procédure.", "rec": [{"v": "p4", "t": 72, "label": "L'affaire Blankenburg"}], "links": [{"label": "Rechtbank Rotterdam : jugement du 8 juillet 2026 (NL)", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBROT:2026:8302"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 14 juillet 2026 (C-474/24, NADA Austria) : l'agence antidopage autrichienne publie en ligne, en vertu de la loi, une liste nominative des sportifs suspendus. La Cour admet cette publication dans son principe, car elle dissuade et rend les sanctions effectives, mais elle doit rester proportionnée, notamment dans sa durée ; quand les situations prévues par la loi ne suffisent pas, une mise en balance individuelle s'impose.", "q": "Vous êtes le DPO d'une agence antidopage. Une sportive suspendue deux ans demande que son nom soit retiré du site à la fin de sa suspension. Que conseillez-vous ?", "options": ["Refuser : la loi impose la publication, donc aucune mise en balance n'est nécessaire.", "Refuser : une sanction antidopage relève du régime pénal de l'art. 10, ce qui justifie la publication.", "Retirer immédiatement toutes les publications : publier des noms de sportifs est illicite.", "Retirer le nom : une publication qui dépasse la durée de la sanction est en principe disproportionnée, et une mise en balance individuelle s'impose quand les situations prévues par la loi ne suffisent pas."], "answer": 3, "feedback": ["La loi peut prédéfinir des situations, mais quand elles ne suffisent pas, le responsable doit procéder à une mise en balance individuelle.", "Les sanctions antidopage s'apparentent à des sanctions disciplinaires ; elles ne relèvent pas de l'art. 10.", "La Cour juge la publication nominative licite dans son principe : elle dissuade et assure l'effectivité des sanctions.", "La pondération tient compte de la gravité de l'infraction et de la notoriété du sportif. La seule mention de la substance ne suffit généralement pas à en faire une donnée de santé, sauf si, combinée à d'autres informations, elle révèle l'état de santé."], "key": "Une publication imposée par la loi reste soumise à la proportionnalité, notamment quant à sa durée.", "rec": [{"v": "p4", "t": 247, "label": "L'arrêt NADA Austria"}], "links": [{"label": "CJUE : arrêt C-474/24 (NADA Austria)", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0474"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la Cour suprême américaine Trump v. Slaughter (29 juin 2026) sur la révocation des commissaires de la FTC, et ses conséquences possibles pour le Data Privacy Framework (DPF). L'arrêt ne porte pas sur le DPF, et la DPRC (Data Protection Review Court) n'est pas une agence de type FTC. Mais le rôle futur de la FTC reste une vraie question, et l'EDPB a demandé à la Commission d'évaluer l'impact. La session a aussi présenté la checklist de l'EDPS pour l'analyse d'impact des transferts (TIA).", "q": "Vous êtes le DPO d'une entreprise qui transfère des données vers des prestataires américains certifiés DPF. La direction demande s'il faut migrer d'urgence vers un autre mécanisme. Que répondez-vous ?", "options": ["Oui : l'arrêt a invalidé le DPF.", "Non, pas d'urgence : le DPF et la décision d'adéquation restent en vigueur et la DPRC (Data Protection Review Court) reste opérationnelle ; pour les transferts fondés sur des CCT ou des BCR, actualisez la TIA, et suivez l'EDPB, la Commission et la CJUE.", "Oui : il faut basculer vers l'art. 49 pour tous les transferts.", "Non, et il n'y a rien à surveiller : l'arrêt ne concerne que le droit américain."], "answer": 1, "feedback": ["L'arrêt ne porte pas sur le DPF.", "La DPRC n'est pas une agence de type FTC et la Cour suprême l'a laissée hors de son raisonnement. Mais le rôle futur de la FTC reste une vraie question, et l'EDPB a demandé à la Commission d'évaluer l'impact.", "L'art. 49 contient des dérogations, pas une solution générale pour des transferts réguliers.", "Le risque d'un recours devant la CJUE augmente : la vigilance reste de mise."], "key": "Pas de panique, mais une veille active. Pour vos transferts au titre de l'art. 46, la checklist de l'EDPS pour l'analyse d'impact du transfert (TIA, 5 étapes) est directement transposable.", "rec": [{"v": "p4", "t": 756, "label": "Trump v. Slaughter"}, {"v": "p4", "t": 694, "label": "La checklist TIA de l'EDPS"}], "links": [{"label": "EDPS : checklist TIA (EN)", "url": "https://www.edps.europa.eu/system/files/2026-06/26-06-30-edps_tia_checklist_art48-3_eudpr_en.pdf"}, {"label": "Congrès US : révocation des commissaires (EN)", "url": "https://constitution.congress.gov/browse/essay/intro.9-4-6/ALDE_00000130/"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'amende de 100 millions d'euros de l'autorité néerlandaise (AP) contre MLU, la société mère européenne du service de taxi Yango (groupe Yandex), pour des transferts de données de chauffeurs et de clients vers la Russie. Le chapitre V du RGPD s'applique aussi aux transferts au sein d'un groupe. Selon l'AP, faute de contrôle indépendant et vu le risque d'accès par les autorités publiques, des garanties contractuelles ne suffisaient pas vers la Russie.", "q": "Vous êtes le DPO d'une filiale européenne d'un groupe dont le centre informatique est en Russie. La direction considère qu'un transfert interne au groupe ne pose pas de problème. Que répondez-vous ?", "options": ["Elle a raison : les transferts intragroupe sont libres.", "Des clauses contractuelles types suffisent toujours.", "L'art. 44 est un verrou : sans adéquation ni garanties appropriées, aucun transfert n'est licite, même partiel ou interne au groupe ; vers la Russie, selon l'AP, des garanties contractuelles seules ne suffisent pas.", "Il suffit d'anonymiser les noms des chauffeurs."], "answer": 2, "feedback": ["Le chapitre V s'applique aussi aux transferts au sein d'un groupe.", "L'absence de contrôle indépendant et le risque d'accès par les autorités publiques rendent, selon l'AP, toute garantie contractuelle insuffisante à elle seule.", "L'amende a été calculée sur le chiffre d'affaires mondial du groupe Yandex, avec une injonction de cesser immédiatement le transfert.", "Des permis de conduire, des IBAN, des localisations précises ou des conversations restent des données personnelles, souvent sensibles."], "key": "Cartographiez tous les flux vers des pays tiers, y compris via les filiales et l'infrastructure du groupe, et anticipez une amende calculée sur le chiffre d'affaires mondial.", "rec": [{"v": "p4", "t": 993, "label": "L'affaire Yango"}], "links": [{"label": "AP : décision d'amende Yango (NL)", "url": "https://www.autoriteitpersoonsgegevens.nl/documenten/besluit-boete-yango"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné une décision de l'autorité autrichienne (DSB, 31 juillet 2026) : un consommateur avait commandé sur une marketplace un produit vendu depuis la Chine, et ses données avaient été transférées vers la Chine et les États-Unis, sur la base de clauses contractuelles que la DSB a jugées douteuses. La session a rappelé l'ordre d'analyse : adéquation, garanties appropriées (art. 46), puis, à titre exceptionnel, les dérogations de l'art. 49, dont la nécessité du transfert pour exécuter un contrat entre la personne concernée et le responsable du traitement.", "q": "Vous êtes le DPO de cette marketplace. Le transfert vers un vendeur chinois, pour une commande passée par le client lui-même, est-il couvert ?", "options": ["Non : un transfert vers la Chine est toujours interdit.", "Oui, par les clauses contractuelles types, qui suffisent toujours.", "Oui, mais seulement avec le consentement explicite du client.", "Oui, par l'art. 49.1.b : le transfert est nécessaire à l'exécution du contrat demandé par le client ; mais revoyez vos clauses pour les autres transferts."], "answer": 3, "feedback": ["L'art. 49 permet certains transferts dérogatoires, même sans adéquation.", "La DSB a justement jugé les clauses douteuses : les mesures techniques ne couvraient ni l'accès des autorités, ni le chiffrement, ni la gestion des clés.", "Le consentement est une autre dérogation ; ici, c'est l'exécution du contrat qui s'applique.", "Pas de violation dans ce cas précis, mais un avertissement : la DSB invite à revoir régulièrement les clauses vers les pays tiers."], "key": "Documentez la base de chaque transfert : adéquation, clauses contractuelles types avec mesures supplémentaires, BCR ou art. 49, et conservez-en la preuve.", "rec": [{"v": "p4", "t": 1160, "label": "La décision de la DSB"}], "links": [{"label": "DSB : décision du 31 juillet 2026 (DE)", "url": "https://www.ris.bka.gv.at/Dokumente/Dsk/DSBT_20260731_2026_0_617_893_00/DSBT_20260731_2026_0_617_893_00.html"}]}]}, {"id": "B7", "title": "Partie B · Preuves, déréférencement, sanctions, juridictions", "intro": "NTH Haustechnik, la décision 217/2026, la Poste autrichienne, la décision 215/2026.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la CJUE du 18 juin 2026 (C-484/24, NTH Haustechnik) : un employeur avait prouvé des ventes non autorisées en accédant au compte eBay privé d'une ancienne employée. La Cour a jugé que le RGPD n'impose pas d'écarter automatiquement une telle preuve : le juge traite les données sur la base de son obligation légale, selon son droit procédural, et limite les données au nécessaire. La partie qui produit la pièce n'a pas à justifier d'un intérêt supérieur.", "q": "Vous êtes le DPO de cet employeur. L'avocat de l'employée soutient que le juge doit écarter la preuve, puisqu'elle a été collectée illicitement au regard du RGPD. Qu'en pensez-vous ?", "options": ["Il a raison : le RGPD interdit toute utilisation de données traitées illicitement.", "Le RGPD n'impose pas d'écarter automatiquement la preuve : le juge la traite sur la base de son obligation légale (art. 6.1.c), en limitant les données au nécessaire.", "La partie qui produit la preuve doit démontrer un intérêt supérieur.", "Le défaut d'information de l'employée (art. 13) suffit à écarter la preuve."], "answer": 1, "feedback": ["Le RGPD ne pose aucune interdiction générale et absolue d'utiliser de telles données.", "Le juge statue sur l'admissibilité des preuves selon son droit procédural et doit limiter les données au nécessaire, au besoin par anonymisation ou pseudonymisation.", "La Cour juge que la partie qui produit la pièce n'a pas à justifier d'un intérêt supérieur.", "Le manquement à l'obligation d'information n'interdit pas au juge d'utiliser les données."], "key": "L'arrêt porte sur le traitement par le juge ; il ne se prononce pas sur la licéité de la collecte par l'employeur, que la juridiction n'excluait pas d'être illégale.", "rec": [{"v": "p4", "t": 1286, "label": "L'arrêt NTH Haustechnik"}], "links": [{"label": "CJUE : arrêt C-484/24 (NTH Haustechnik)", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0484"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné la décision 217/2026 de l'APD : un moteur de recherche avait refusé de déréférencer une décision de justice américaine, publiée sur un site officiel, relative à des condamnations prononcées en Belgique pour criminalité économique. L'APD a mis en balance la fiabilité de la source, l'ancienneté des faits, la sphère professionnelle et la gravité des faits, et a classé la plainte comme manifestement non fondée.", "q": "Vous êtes le DPO d'un moteur de recherche. Une personne condamnée il y a trois ans pour escroquerie demande le déréférencement d'un jugement officiel, en invoquant son licenciement. Comment évaluez-vous la demande ?", "options": ["Le déréférencement est automatique dès que la personne invoque un préjudice professionnel.", "Vous renvoyez systématiquement la personne vers le webmaster du site, sans autre analyse.", "Vous mettez en balance : source officielle et exacte, faits récents, activité professionnelle et criminalité économique grave plaident pour maintenir le référencement.", "Les données pénales doivent toujours être déréférencées."], "answer": 2, "feedback": ["Le déréférencement n'est pas automatique : chaque élément du cas d'espèce est pesé (art. 17.3.a).", "Renvoyer vers le webmaster ne dispense pas le moteur de recherche d'apprécier lui-même la demande.", "L'APD a jugé le référencement strictement nécessaire au droit à l'information et a classé la plainte comme manifestement non fondée.", "Des données pénales récentes, exactes et issues d'une publication officielle peuvent rester accessibles."], "key": "Documentez la mise en balance avec les quatre éléments de la décision : fiabilité de la source, ancienneté des faits, sphère professionnelle et gravité.", "rec": [{"v": "p4", "t": 1500, "label": "La décision 217/2026"}], "links": [{"label": "APD : classement sans suite 217/2026", "url": "https://www.autoriteprotectiondonnees.be/publications/classement-sans-suite-n0-217-2026.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné l'arrêt de la Cour administrative suprême autrichienne (24 juin 2026) : la Poste autrichienne avait calculé les « affinités partisanes » de 2,2 millions de personnes, en se fondant sur un avis d'avocats selon lequel il ne s'agissait pas de données personnelles. La Cour a retenu la négligence : selon l'arrêt Deutsche Wohnen de la CJUE, il suffit que l'entreprise ait pu avoir conscience de l'illicéité, et la Poste n'avait ni lu ni respecté les lignes directrices de l'EDPB. L'amende a été ramenée de 18 à 13 millions d'euros.", "q": "Vous êtes le DPO d'une grande entreprise. Pour un nouveau projet de profilage, la direction veut se couvrir par un avis juridique externe. Que lui dites-vous ?", "options": ["Un avis d'avocat exonère de toute amende.", "Un avis d'avocat n'exonère pas en soi : compte le fait de savoir si l'entreprise pouvait avoir conscience de l'illicéité ; ne pas lire ni respecter les lignes directrices de l'EDPB est un indice de négligence.", "Seule la connaissance de la direction peut engager l'entreprise.", "Un système de conformité certifié suffit à éviter la responsabilité."], "answer": 1, "feedback": ["L'avis d'avocats n'a pas exonéré la Poste : l'amende a été maintenue dans son principe, même si elle a été ramenée de 18 à 13 millions d'euros.", "Seul compte le fait de savoir si l'entreprise pouvait avoir conscience de l'illicéité (CJUE, C-807/21, Deutsche Wohnen). Selon la Cour administrative suprême, plus l'organisation dispose de moyens juridiques, plus le critère de négligence est sévère.", "Aucun acte ou connaissance de l'organe de direction n'est requis.", "Ni un système de conformité ni un avis d'avocat n'exonèrent en soi."], "key": "Lisez et appliquez les lignes directrices existantes : c'est l'indice de négligence qu'a retenu la Cour. Elle reproche aussi à l'avis de ne trouver aucun appui dans la pratique décisionnelle existante.", "rec": [{"v": "p4", "t": 1684, "label": "L'affaire de la Poste autrichienne"}], "links": [{"label": "VwGH : communiqué sur l'arrêt (DE)", "url": "https://www.vwgh.gv.at/medien/mitteilungen/ro2025-04-0007.html"}]}, {"context": "Dans cette session de Stay Tuned, nous avons examiné la décision 215/2026 de l'APD : le Conseil d'État avait publié un arrêt en ligne avec le nom du plaignant et des conclusions d'expertises médicales. L'APD s'est déclarée incompétente : elle ne contrôle pas les traitements effectués par les juridictions dans l'exercice de leur fonction juridictionnelle (art. 55.3 RGPD). Un jour après la demande du plaignant, le Conseil d'État s'est engagé à dépersonnaliser immédiatement la publication.", "q": "Vous êtes le DPO d'une organisation. Un collaborateur vous signale que le Conseil d'État a publié un arrêt contenant son nom et des données médicales. Que lui conseillez-vous en premier lieu ?", "options": ["Introduire une plainte à l'APD, qui contrôle tous les traitements de données de santé.", "Saisir la Cour des marchés.", "Considérer que le classement sans suite de l'APD valide la publication.", "Adresser la demande directement à la juridiction : l'APD est incompétente pour les traitements effectués dans la fonction juridictionnelle (art. 55.3)."], "answer": 3, "feedback": ["Ce n'est pas la sensibilité des données qui détermine qui contrôle, mais le fait que la juridiction agit dans sa fonction juridictionnelle.", "La Cour des marchés connaît des recours contre les décisions de l'APD ; elle n'est pas le premier interlocuteur ici.", "Un classement pour incompétence ne dit rien de la licéité de la publication.", "Le Conseil d'État s'est engagé à dépersonnaliser l'arrêt un jour après la demande. La CJUE interprète largement la fonction juridictionnelle (C-245/20)."], "key": "Vérifiez d'abord si votre interlocuteur est une juridiction qui agit dans sa fonction juridictionnelle : cela détermine si l'APD peut intervenir.", "rec": [{"v": "p4", "t": 2485, "label": "La décision 215/2026"}], "links": [{"label": "APD : classement sans suite 215/2026", "url": "https://www.autoriteprotectiondonnees.be/publications/classement-sans-suite-n0-215-2026.pdf"}]}]}], "recordings": [{"id": "p1", "short": "Partie 1", "vimeo": "1226417751", "title": "Enregistrement, partie 1 : actualités, rôle du DPO, procédure, concepts, anonymisation", "source": "Source : Stay Tuned as DPO 2026Q3 (Data Protection Institute, Nivelles, 10 septembre 2026), présentation de Saba Parsa, modération de Florence de Villenfagne.", "chapters": [{"t": 0, "k": "Introduction et actualités", "part": "Introduction"}, {"t": 665, "k": "CNIL : DPO et AI officer", "part": "Rôle du DPO"}, {"t": 1005, "k": "KFC : l'obligation de désigner un DPO", "part": "Rôle du DPO"}, {"t": 1480, "k": "CJUE C-414/24 : cumul des recours", "part": "Procédure"}, {"t": 1788, "k": "Enschede : la preuve des données personnelles", "part": "Concepts"}, {"t": 2370, "k": "Lignes directrices EDPB sur l'anonymisation", "part": "Concepts"}, {"t": 3195, "k": "Cas pratique 1", "part": "Concepts"}, {"t": 3505, "k": "Cas pratique 2", "part": "Concepts"}, {"t": 3905, "k": "Cas pratique 3", "part": "Concepts"}, {"t": 4800, "k": "Cas pratique 4 : hôpital et institut de recherche", "part": "Concepts"}]}, {"id": "p2", "short": "Partie 2", "vimeo": "1226417753", "title": "Enregistrement, partie 2 : anonymisation, champ d'application, rôles, marketing", "source": "Source : Stay Tuned as DPO 2026Q3 (Data Protection Institute, Nivelles, 10 septembre 2026), présentation de Saba Parsa, modération de Florence de Villenfagne.", "chapters": [{"t": 25, "k": "Cas pratique 4 : la solution", "part": "Concepts"}, {"t": 565, "k": "Breyer, SRB et les moyens raisonnables", "part": "Concepts"}, {"t": 845, "k": "CNIL : IQVIA", "part": "Concepts"}, {"t": 1420, "k": "Garante : Lusha", "part": "Champ d'application"}, {"t": 1515, "k": "AEPD : VIPTHINK", "part": "Rôles"}, {"t": 2235, "k": "APD : Isabel / TruliUs", "part": "Rôles"}, {"t": 2360, "k": "APD 163/2026 : marketing direct et transaction", "part": "Licéité"}, {"t": 3160, "k": "Cour des marchés : Infobel", "part": "Licéité"}]}, {"id": "p3", "short": "Partie 3", "vimeo": "1226417752", "title": "Enregistrement, partie 3 : marketing, IA, web scraping, droits", "source": "Source : Stay Tuned as DPO 2026Q3 (Data Protection Institute, Nivelles, 10 septembre 2026), présentation de Saba Parsa, modération de Florence de Villenfagne.", "chapters": [{"t": 13, "k": "Datatilsynet : Elkjøp", "part": "Licéité"}, {"t": 520, "k": "CJUE C-209/23 : RRC Sports (FIFA)", "part": "Licéité"}, {"t": 893, "k": "AI Act : calendrier et articulation avec le RGPD", "part": "IA"}, {"t": 1036, "k": "Qualification des parties dans l'IA : la méthode", "part": "IA"}, {"t": 1268, "k": "Scénario 1 : chatbot bancaire", "part": "IA"}, {"t": 1500, "k": "Scénario 2 : VOD", "part": "IA"}, {"t": 1740, "k": "Scénario 3 : sinistres", "part": "IA"}, {"t": 1858, "k": "Scénario 4 : agent IA hospitalier", "part": "IA"}, {"t": 2348, "k": "Scénario 5 : caméras augmentées", "part": "IA"}, {"t": 2984, "k": "Scénario 6 : rapport de stress", "part": "IA"}, {"t": 3528, "k": "Scénario 7 : apprentissage fédéré", "part": "IA"}, {"t": 3770, "k": "Le web scraping", "part": "IA"}, {"t": 4150, "k": "Web scraping et données sensibles", "part": "IA"}, {"t": 4336, "k": "IDPC Malte : e-mails professionnels", "part": "Droits"}, {"t": 4728, "k": "CJUE C-312/24 : Darashev", "part": "Droits"}, {"t": 5200, "k": "CJUE C-199/24 : Lexbase", "part": "Droits"}]}, {"id": "p4", "short": "Partie 4", "vimeo": "1226417754", "title": "Enregistrement, partie 4 : conservation, transferts, preuves, déréférencement, bon à savoir", "source": "Source : Stay Tuned as DPO 2026Q3 (Data Protection Institute, Nivelles, 10 septembre 2026), présentation de Saba Parsa, modération de Florence de Villenfagne.", "chapters": [{"t": 72, "k": "Blankenburg : la preuve effacée trop tôt", "part": "Conservation"}, {"t": 247, "k": "CJUE C-474/24 : NADA Austria", "part": "Conservation"}, {"t": 694, "k": "EDPS : checklist TIA", "part": "Transferts"}, {"t": 756, "k": "Trump v. Slaughter et le DPF", "part": "Transferts"}, {"t": 993, "k": "AP : Yango", "part": "Transferts"}, {"t": 1160, "k": "DSB : transfert vers la Chine", "part": "Transferts"}, {"t": 1286, "k": "CJUE C-484/24 : NTH Haustechnik", "part": "Preuves"}, {"t": 1500, "k": "APD 217/2026 : déréférencement", "part": "Déréférencement"}, {"t": 1684, "k": "Poste autrichienne : 13 M€", "part": "Amende"}, {"t": 2150, "k": "Rapport annuel 2025 de l'APD et affaire d'Anvers", "part": "Bon à savoir"}, {"t": 2314, "k": "La blockchain", "part": "Bon à savoir"}, {"t": 2485, "k": "APD 215/2026 : le Conseil d'État", "part": "Bon à savoir"}]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const RS = C.recordings ? C.recordings : (C.recording ? [Object.assign({id:'main'}, C.recording)] : []);
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
