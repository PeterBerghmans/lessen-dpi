<!DOCTYPE html>
<html lang="fr" data-theme="dpi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercices · Stay Tuned 2026Q3 : les exercices</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
.readmore{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:clamp(10px,1.6vw,18px);padding-top:10px;border-top:1px solid var(--line);font-size:clamp(12px,1.2vw,14px);color:var(--muted)}
.readmore a.btn{padding:7px 14px;font-size:13px;text-decoration:none}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}


/* principe-navigatie (alle onderdelen bovenaan, actieve gemarkeerd) */
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 clamp(10px,1.6vw,18px)}
.pnav span{font-size:clamp(10px,1.05vw,13px);font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card-bg);white-space:nowrap}
.pnav span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnav span.done{border-color:var(--muted)}
/* kaarten (visueel overzicht) */
.cards{display:grid;gap:clamp(8px,1.2vw,14px)}
.cards .cd{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(8px,1.2vw,14px);display:flex;flex-direction:column;gap:6px;font-size:clamp(11px,1.15vw,14px);position:relative;border:2px solid transparent}
.cards .cd.hl{border-color:var(--accent)}
.cards .cd .n{width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.cards .cd b{color:var(--title);font-size:clamp(12px,1.35vw,16px);line-height:1.25}
.cards .cd .sub{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:clamp(10px,1.05vw,13px);color:var(--accent);font-weight:700}
.cards.dense{gap:clamp(6px,.9vw,10px)}.cards.dense .cd{padding:clamp(6px,.9vw,11px) clamp(6px,.9vw,10px);font-size:clamp(10px,1.02vw,12.5px);gap:4px}.cards.dense .cd b{font-size:clamp(11px,1.15vw,14px)}.cards.dense .cd .n{width:1.7em;height:1.7em;font-size:clamp(11px,1.1vw,13px);margin-bottom:0}.cards.dense .cd .sub{font-size:clamp(9.5px,.95vw,11.5px);padding-top:4px}
/* tabel */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.2vw,15px)}
.tbl th{text-align:left;font-size:clamp(10px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px;border-bottom:2px solid var(--accent)}
.tbl td{padding:clamp(4px,.6vw,7px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl td:first-child{font-weight:700;color:var(--title);width:38%}
.tbl tr.hl td{background:var(--chain-bg)}
.tbl a.tlink{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tbl a.tlink:hover{text-decoration-thickness:2px}
.tbl .recchip{display:inline-block;margin-top:4px;font:inherit;font-weight:500;font-size:.82em;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .recchip:hover{background:var(--chain-bg)}
.tbl td:first-child .recchip{display:block;width:max-content}
.tbl-hint{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:8px}
.tbl tr.hl td:first-child{color:var(--accent)}
.tbl tr.dim td{color:var(--muted)}
/* quizkeuze */
.qsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 6px}
.qset{text-align:left;border:2px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card-bg);display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.qset:hover{border-color:var(--accent)}
.qset b{color:var(--title);font-size:clamp(15px,1.6vw,19px)}
.qset span{font-size:14px;color:var(--muted);line-height:1.45}
.qset small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr !important}.tbl td:first-child{white-space:normal}}

/* opname (Vimeo) */
.readmore.rec{border-top:1px dashed var(--line);margin-top:8px}
.readmore.rec .btn{font-variant-numeric:tabular-nums}
.readmore.rec .btn small{font-weight:400;opacity:.8;margin-left:4px}
.rec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rec-head h1{margin-bottom:4px}
.rec-src{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rec-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.rec-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rec-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.rec-ch{position:relative;max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.rec-ch h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 12px 4px;position:sticky;top:0;background:var(--card-bg)}
.rec-ch button{display:grid;grid-template-columns:58px 1fr;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13.5px;line-height:1.35;border-top:1px solid var(--line);background:var(--card-bg)}
.rec-ch button:hover{background:var(--chain-bg)}
.rec-ch button.on{background:var(--chip-bg);color:var(--chip-text)}
.rec-ch button .tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.rec-ch button .qp{font-weight:700;color:var(--muted)}
.rec-ch h4.rv{font-size:13px;color:var(--title);background:var(--chain-bg);z-index:1}
@media (max-width:900px){.rec-grid{grid-template-columns:1fr}.rec-ch{max-height:none}}
.intro-src{font-size:13px;color:var(--muted);margin:-14px 0 22px;line-height:1.5}

/* profielkeuze */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 18px}
.profiles .qset b{font-size:clamp(16px,1.8vw,21px)}
.profchip{display:inline-block;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:999px;vertical-align:middle}
/* meer weten: verwijzingen naar de opname */
.pointers{display:grid;gap:clamp(8px,1.2vw,14px)}
.pointers .pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--chain-bg);border-radius:12px;padding:clamp(10px,1.3vw,16px) clamp(12px,1.6vw,20px)}
.pointers .pt b{color:var(--title);font-size:clamp(13px,1.45vw,17px)}
.pointers .pt span{grid-column:1;font-size:clamp(12px,1.2vw,15px);line-height:1.4}
.pointers .pt .btn{grid-column:2;grid-row:1/span 2;font-variant-numeric:tabular-nums}
.pointers .pt .btn small{font-weight:400;opacity:.85;margin-left:6px}
.pointers .lead{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(6px,1vw,12px)}
@media (max-width:640px){.pointers .pt{grid-template-columns:1fr}.pointers .pt .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.q-ctx{background:var(--chain-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:clamp(13.5px,1.35vw,16px);line-height:1.5;color:var(--text)}
.q-ctx .ctx-k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.fb .fb-key{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95em}
.fb .fb-key b{display:inline;margin-right:4px}
.fb .fb-rec{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .fb-src a.btn{text-decoration:none}
.fb .fb-rec .btn small{font-weight:400;opacity:.85;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Verdana,sans-serif;
  --page-bg:#F2F1F4; --card-bg:#FFFFFF; --text:#1A1A1A; --title:#1A1A1A; --muted:#6B6B73;
  --accent:#BF3CBA; --line:#E4E2E8; --chain-bg:#F6F0F7;
  --chip-bg:#F6E4F5; --chip-text:#8E2A8A;
  --header-bg:#FFFFFF; --header-text:#1A1A1A; --header-border:1px solid #E4E2E8;
  --title-bg:linear-gradient(135deg,#25D9FD 0%,#B02DFF 42%,#C9128C 75%,#C91824 100%); --title-text:#FFFFFF;
  --title-decor:radial-gradient(ellipse 30% 55% at 78% 70%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 22% 60% at 92% 20%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 26% 50% at 12% 85%,rgba(255,255,255,.10),transparent 70%);
  --title-decor-opacity:1;
  --decor:radial-gradient(ellipse 60% 100% at 100% 100%,#EDEBEF 0 60%,transparent 61%); --decor-opacity:.9;
  --btn-bg:#BF3CBA; --btn-text:#FFFFFF; --radius:18px; --shadow:0 10px 30px rgba(60,20,70,.10);
  --bullet-radius:50%; --ok:#1E8E5A; --ok-bg:#E9F6EF; --bad:#C91824; --bad-bg:#FBEAEC; --warn:#B5651D;
}
.slide.title .logo{filter:none}

 progression. Relisez le retour des questions manquées, regardez le passage de l'enregistrement et réessayez.", "result_low": "Reprenez le retour de chaque question manquée et regardez le passage de l'enregistrement, puis réessayez.", "retry": "Recommencer les exercices", "review": "Revoir la présentation", "your_answer": "Votre réponse", "open_link": "Ouvrir le lien dans un nouvel onglet", "practice_hint": "Exercice pratique : mettez en pause, suivez les étapes, puis cliquez sur Suivant.", "back_to_slides": "Retour aux diapositives", "resume_quiz": "Reprendre les exercices", "download_pdf": "Télécharger votre résultat en PDF", "pdf_title": "Résultat des exercices", "pdf_question": "Question", "pdf_your": "Votre réponse", "pdf_correct": "Réponse correcte", "pdf_feedback": "Retour", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "sans réponse", "transcript": "Texte parlé", "show_text": "Afficher le texte", "hide_text": "Masquer le texte", "ai_notice_title": "Transparence sur l'IA", "ai_notice": "La voix de ce module a été générée par IA à partir de la voix de Peter Berghmans, avec son consentement. Le texte et les diapositives ont été réalisés avec l'aide de l'IA et relus sur le fond par le formateur.", "ai_voice_label": "Voix IA", "ai_icon_alt": "Label officiel de l'UE : contenu généré par IA", "ai_footer": "Voix générée par IA (avec le consentement de l'orateur) ; texte et diapositives réalisés avec l'aide de l'IA et relus par le formateur.", "skip_to_quiz": "Aller directement aux exercices", "nav_home": "Accueil", "nav_slides": "Présentation", "nav_quiz": "Exercices", "speed": "Vitesse", "reveal_question": "Qu'en pensez-vous ?", "reveal_show": "Afficher la réponse", "optional_label": "Approfondissement (facultatif)", "optional_skip": "Passer l'approfondissement", "optional_intro": "Les diapositives suivantes sont un approfondissement facultatif. Vous pouvez les passer et aller directement aux exercices.", "autoplay_short": "Auto", "read_label": "Ouvrir le RGPD sur EUR-Lex", "quiz_choose_title": "Choisissez une série", "quiz_choose_text": "Neuf séries, dans l'ordre des thèmes de la session. Faites-les dans l'ordre que vous voulez, aussi souvent que vous le souhaitez. Rien n'est enregistré.", "quiz_set_count": "{n} questions", "quiz_back_to_sets": "Choisir une autre série", "nav_rec": "Enregistrement", "rec_jump": "Voir", "rec_btn_text": "Dans l'enregistrement", "rec_back": "Retour à la diapositive {n}", "rec_back_quiz": "Retour à la question", "rec_q": "Question de la salle", "q_ctx_label": "Rappel de la session", "q_key_label": "À retenir", "q_src_label": "La source", "tbl_hint": "Cliquez sur un sujet pour ouvrir la source ; ▶ mène au passage de l'enregistrement.", "rec_note": "Enregistrement complet de la session, en quatre parties. Cliquez sur un chapitre pour aller au passage correspondant. Les positions exprimées sont celles de l'oratrice et des participants au moment de la session. Si la vidéo ne démarre pas, essayez un autre navigateur ou contactez le formateur."}, "slides": [{"id": 1, "type": "title", "title": "Stay Tuned 2026Q3 : les exercices", "subtitle": "Un aperçu de la session, une boîte à outils pour le DPO, puis des exercices", "script": "Ce module vous permet de vous exercer sur la session Stay Tuned du troisième trimestre deux mille vingt-six, présentée par Saba Parsa, avocate et DPO certifiée, et modérée par Florence de Villenfagne. Il commence par un aperçu de tout ce que la session a couvert, suivi d'une boîte à outils pour le DPO. Ensuite, il vous met dans la peau du DPO, face aux décisions et aux arrêts présentés : vous qualifiez les parties, vous répondez à une question de DPO par décision, et un lien vous mène chaque fois au passage de l'enregistrement et à la décision elle-même."}, {"id": 2, "type": "bullets", "chip": "Le module", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 0}, "title": "Comment fonctionnent les exercices", "bullets": [{"k": "Le rappel", "t": "chaque question commence par un rappel du cas examiné pendant la session, avec tous les éléments nécessaires pour répondre."}, {"k": "Votre rôle", "t": "vous êtes le DPO de l'organisation concernée, et vous devez prendre une décision concrète."}, {"k": "Le retour", "t": "après votre réponse, vous voyez pourquoi elle est correcte ou non, ce que le DPO doit retenir, un bouton vers le passage de l'enregistrement où le cas est expliqué, et un lien vers la décision."}, {"k": "Les séries", "t": "deux séries pour qualifier les parties, puis sept séries qui suivent les thèmes de la session. Rien n'est enregistré."}], "script": "Chaque question commence par un rappel du cas examiné pendant la session, avec tous les éléments nécessaires pour répondre, même si vous n'y étiez pas. Ensuite, vous êtes le DPO de l'organisation concernée, et vous devez prendre une décision concrète, parmi quatre réponses. Après votre réponse, vous voyez pourquoi elle est correcte ou non, et ce que le DPO doit retenir. Un bouton vous mène au passage de l'enregistrement où le cas est expliqué ; avec le bouton retour, vous revenez à la question. Un lien ouvre aussi la décision elle-même. Le module compte deux séries pour qualifier les parties, puis sept séries qui suivent les thèmes de la session. Faites-les dans l'ordre que vous voulez. Rien n'est enregistré."}, {"id": 3, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (1/7) : actualités, rôle du DPO, procédure", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["Actualités", "Un nouveau directeur, Dirk Van Der Kelen, à la Chambre contentieuse de l'APD, et un nouveau site pour l'EDPB."], ["CNIL : DPO et AI officer", "La fiche rappelle qu'un pouvoir de décision sur les finalités et les moyens rend le DPO « juge et partie ». Selon les intervenantes, le cumul avec un rôle d'AI officer reste envisageable si le DPO conseille, encadre les AIPD, forme et audite, mais pas s'il décide des achats et des déploiements d'IA. Décrivez les missions par écrit."], ["KFC (Audiencia Nacional)", "Une chaîne de restauration doit désigner un DPO : son application suit les clients de manière régulière et systématique, à grande échelle. Sa propre politique de confidentialité a servi de preuve."], ["CJUE, Datenschutzbehörde", "La plainte devant l'autorité et le recours devant le juge sont indépendants : l'autorité ne peut pas rejeter une plainte parce qu'un juge est saisi, mais le droit national peut prévoir une suspension."]], "script": "Voici d'abord un aperçu de ce que la session a couvert, en sept diapositives. Elle s'est ouverte sur deux actualités : un nouveau directeur, Dirk Van Der Kelen, à la Chambre contentieuse de l'Autorité de protection des données, et un nouveau site pour l'EDPB. Sur le rôle du DPO, la fiche pratique de la CNIL rappelle qu'un pouvoir de décision sur les finalités et les moyens rend le DPO juge et partie. Selon les intervenantes, le cumul avec une fonction d'AI officer reste envisageable si le DPO conseille, encadre les analyses d'impact, forme et audite, mais pas s'il décide des achats et des déploiements d'IA. Décrivez donc les missions par écrit. En Espagne, l'Audiencia Nacional a confirmé que KFC doit désigner un DPO : son application suit les clients de manière régulière et systématique, à grande échelle, et sa propre politique de confidentialité a servi de preuve. Enfin, dans l'arrêt Datenschutzbehörde, la Cour de justice juge que la plainte devant l'autorité et le recours devant le juge sont indépendants. L'autorité ne peut pas rejeter une plainte parce qu'un juge est saisi, mais le droit national peut prévoir une suspension. Cliquez sur un sujet pour ouvrir la décision ou le document ; le petit bouton sous le sujet mène au passage de l'enregistrement.", "rowlinks": [{"url": "https://www.autoriteprotectiondonnees.be/citoyen/un-nouveau-directeur-pour-la-chambre-contentieuse-de-lapd", "rec": {"v": "p1", "t": 220}}, {"url": "https://www.cnil.fr/fr/dpo-identifier-gerer-conflits-interets", "rec": {"v": "p1", "t": 665}}, {"url": "https://thedpo.eu/fr/decisions/0b275d3c-69f1-4e01-8a14-8c94e49e8794", "rec": {"v": "p1", "t": 1005}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0414", "rec": {"v": "p1", "t": 1480}}]}, {"id": 4, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (2/7) : concepts et anonymisation", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["Enschede (Conseil d'État néerlandais)", "L'annulation de l'amende est confirmée, car l'autorité n'avait pas prouvé à temps qu'il s'agissait de données personnelles. La question de fond reste ouverte ; en conformité, la preuve de l'anonymat pèse sur le responsable."], ["Lignes directrices de l'EDPB sur l'anonymisation", "Une approche entité par entité, et trois critères : No Record Isolation, No Linkage, No Inference. Quatre cas pratiques ont été travaillés en salle."], ["Breyer et SRB", "Les moyens raisonnables de réidentification s'apprécient pour l'entité concernée, mais ils doivent être démontrés."], ["IQVIA (CNIL, 5 M€)", "Qui organise la chaîne de pseudonymisation et suit les patients par un code unique traite des données personnelles ; un engagement contractuel de ne pas réidentifier ne suffit pas."]], "script": "Le deuxième bloc portait sur les concepts et l'anonymisation. Aux Pays-Bas, dans l'affaire d'Enschede, le Conseil d'État a confirmé l'annulation de l'amende, car l'autorité n'avait pas prouvé à temps qu'il s'agissait de données personnelles. La question de fond reste ouverte, et en conformité, la preuve de l'anonymat pèse sur le responsable du traitement. Les nouvelles lignes directrices de l'EDPB sur l'anonymisation adoptent une approche entité par entité, avec trois critères : No Record Isolation, c'est-à-dire pas d'isolement d'une personne, No Linkage, pas de recoupement, et No Inference, pas de déduction. Quatre cas pratiques ont été travaillés en salle. La session a relié ces lignes directrices aux arrêts Breyer et SRB : les moyens raisonnables de réidentification s'apprécient pour l'entité concernée, mais ils doivent être démontrés. Enfin, la CNIL a sanctionné IQVIA de cinq millions d'euros : qui organise la chaîne de pseudonymisation et suit les patients par un code unique traite des données personnelles, et un engagement contractuel de ne pas réidentifier ne suffit pas.", "rowlinks": [{"url": "https://www.raadvanstate.nl/uitspraken/@159747/202401622-1-a3/", "rec": {"v": "p1", "t": 1788}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf", "rec": {"v": "p1", "t": 2370}}, {"url": null, "rec": {"v": "p2", "t": 565}}, {"url": "https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000054136834", "rec": {"v": "p2", "t": 845}}]}, {"id": 5, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (3/7) : champ d'application, rôles, marketing", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["Lusha (Garante, 2 M€)", "Le Garante applique le RGPD à un courtier hors UE qui suit en continu la fonction des personnes ; la CNIL avait jugé l'inverse en 2022."], ["VIPTHINK (AEPD)", "Un « sous-traitant » selon le contrat, qui choisit les fonctionnalités et poursuit ses propres finalités, est requalifié en responsable conjoint."], ["Isabel / TruliUs (APD)", "Rappel : qui conçoit un service et fixe seul ses moyens essentiels est responsable du traitement, même pour un service standardisé."], ["APD 163/2026", "Une transaction de 5 000 € : le soft opt-in couvre l'envoi d'une offre similaire, pas le profilage à partir de l'historique d'achats."], ["Infobel (Cour des marchés)", "Un consentement donné en 2006 ne couvre pas une revente actuelle ; l'amende passe de 40 000 à 5 000 €."], ["Elkjøp (Datatilsynet)", "20 millions de couronnes norvégiennes pour un consentement « tout ou rien » au club de fidélité."], ["CJUE, RRC Sports (FIFA)", "La FIFA peut collecter les données des agents, mais pas publier toutes les sanctions ni le détail de toutes les transactions."]], "script": "Le troisième bloc portait sur le champ d'application, les rôles et le marketing. Le Garante italien a appliqué le RGPD à Lusha, un courtier sans établissement dans l'Union qui suit en continu la fonction des personnes, alors que la CNIL avait jugé l'inverse en deux mille vingt-deux. En Espagne, VIPTHINK, sous-traitant selon le contrat, a été requalifié en responsable conjoint, parce qu'il choisissait les fonctionnalités et poursuivait ses propres finalités. La session a rappelé la décision Isabel de l'Autorité de protection des données : qui conçoit un service et fixe seul ses moyens essentiels est responsable du traitement, même pour un service standardisé. Dans la décision cent soixante-trois, réglée par une transaction de cinq mille euros, l'Autorité distingue le soft opt-in, qui couvre l'envoi d'une offre similaire, du profilage à partir de l'historique d'achats. Dans l'affaire Infobel, la Cour des marchés juge qu'un consentement donné en deux mille six ne couvre pas une revente actuelle, mais elle réduit l'amende de quarante mille à cinq mille euros. En Norvège, Elkjøp reçoit une amende de vingt millions de couronnes pour un consentement tout ou rien à son club de fidélité. Enfin, dans l'arrêt RRC Sports, la Cour de justice admet que la FIFA collecte les données des agents, mais pas qu'elle publie toutes les sanctions ni le détail de toutes les transactions.", "rowlinks": [{"url": "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10275035", "rec": {"v": "p2", "t": 1350}}, {"url": "https://www.aepd.es/documento/ps-00192-2025.pdf", "rec": {"v": "p2", "t": 1515}}, {"url": null, "rec": {"v": "p2", "t": 2235}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/decision-de-transaction-n0-163-2026-du-16-juillet-2026.pdf", "rec": {"v": "p2", "t": 2360}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/arret-du-3-juin-2026-de-la-cour-des-marches-ar-2079.pdf", "rec": {"v": "p2", "t": 3160}}, {"url": "https://www.datatilsynet.no/regelverk-og-verktoy/lover-og-regler/avgjorelser-fra-datatilsynet/2026/overtredelsesgebyr-til-elkjop/", "rec": {"v": "p3", "t": 13}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62023CJ0209", "rec": {"v": "p3", "t": 520}}]}, {"id": 6, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (4/7) : l'intelligence artificielle", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["AI Act et Digital Omnibus", "Les règles « haut risque », hors produits déjà réglementés, sont reportées au 2 décembre 2027. AI Act et RGPD s'appliquent cumulativement : articulez l'analyse d'impact sur les droits fondamentaux (FRIA) et l'AIPD."], ["Sept scénarios de qualification", "Banque, VOD, assurance, hôpital, caméras, stress au travail, CHU : qualifiez activité par activité, selon qui décide des finalités et des moyens essentiels."], ["Web scraping (EDPB)", "L'intérêt légitime est la base la plus utilisée ; les signaux techniques comme robots.txt comptent ; minimisation et transparence avant et après la collecte."], ["Données sensibles", "Une « voie étroite » : une collecte incidente et résiduelle à quatre conditions cumulatives, jamais une exemption générale."]], "script": "Le quatrième bloc était consacré à l'intelligence artificielle. Le Digital Omnibus reporte au deux décembre deux mille vingt-sept les règles de l'AI Act pour les systèmes à haut risque, hors produits déjà réglementés. L'AI Act et le RGPD s'appliquent cumulativement : la session conseille d'articuler l'analyse d'impact sur les droits fondamentaux et l'analyse d'impact relative à la protection des données dans un seul processus. Les participants ont ensuite travaillé sept scénarios de qualification : une banque, une plateforme de VOD, un assureur, un hôpital, des caméras augmentées, le stress au travail et des CHU. Le fil rouge : qualifier activité par activité, selon qui décide des finalités et des moyens essentiels. Pour le web scraping, les lignes directrices de l'EDPB font de l'intérêt légitime la base la plus utilisée ; les signaux techniques, comme le fichier robots.txt, comptent, et la minimisation et la transparence s'imposent avant et après la collecte. Pour les données sensibles, la voie est étroite : une collecte incidente et résiduelle est admise à quatre conditions cumulatives, mais ce n'est jamais une exemption générale. La partie A des exercices reprend ces scénarios.", "rowlinks": [{"url": "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force", "rec": {"v": "p3", "t": 893}}, {"url": "https://www.cnil.fr/fr/determiner-la-qualification-juridique-des-fournisseurs-de-systemes-dia", "rec": {"v": "p3", "t": 1036}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf", "rec": {"v": "p3", "t": 3770}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf", "rec": {"v": "p3", "t": 4150}}]}, {"id": 7, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (5/7) : droits et conservation", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["IDPC (Malte)", "Le droit d'accès porte sur les données personnelles de la personne, pas sur toute la boîte mail professionnelle."], ["CJUE, Darashev", "La trace d'une enquête sans poursuites dans un dossier RH relève du RGPD et du régime des données pénales ; sa conservation n'est pas apte à garantir la probité du personnel quand l'enquête a été suspendue, sans poursuites ni procédure disciplinaire."], ["CJUE, Legal Newsdesk Sweden (Lexbase)", "Une base payante de jugements pénaux bruts n'est pas du journalisme, et les voies de recours du RGPD restent acquises."], ["Blankenburg (tribunal de Rotterdam)", "Trois amendes annulées : les rappels de paiement avaient été effacés trop tôt, et la preuve manquait."], ["CJUE, NADA Austria", "La publication nominative des sportifs suspendus est possible, mais elle doit rester proportionnée, notamment dans sa durée."]], "script": "Le cinquième bloc portait sur les droits des personnes et la conservation. L'autorité maltaise rappelle que le droit d'accès porte sur les données personnelles de la personne, pas sur toute sa boîte mail professionnelle. Dans l'arrêt Darashev, la Cour de justice juge que la trace d'une enquête sans poursuites dans un dossier du personnel relève du RGPD et du régime des données pénales, et que sa conservation n'est pas apte à garantir la probité du personnel quand l'enquête a été suspendue, sans poursuites ni procédure disciplinaire. Dans l'arrêt Legal Newsdesk Sweden, sur la base Lexbase, une base payante de jugements pénaux bruts n'est pas du journalisme, et les voies de recours du RGPD restent acquises. Aux Pays-Bas, le tribunal de Rotterdam a annulé trois amendes de péage du tunnel Blankenburg : les rappels de paiement avaient été effacés trop tôt, et la preuve manquait. Enfin, dans l'arrêt NADA Austria, la Cour admet la publication nominative des sportifs suspendus, mais elle doit rester proportionnée, notamment dans sa durée.", "rowlinks": [{"url": "https://idpc.org.mt/wp-content/uploads/2026/08/CDP_COMP_130_2025.pdf", "rec": {"v": "p3", "t": 4336}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0312", "rec": {"v": "p3", "t": 4728}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0199", "rec": {"v": "p3", "t": 5200}}, {"url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBROT:2026:8302", "rec": {"v": "p4", "t": 72}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0474", "rec": {"v": "p4", "t": 247}}]}, {"id": 8, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (6/7) : les transferts", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["Checklist TIA de l'EDPS", "Conçue pour les institutions de l'UE mais transposable : cinq étapes pour l'analyse d'impact d'un transfert, utiles aussi pour les transferts fondés sur des clauses contractuelles types."], ["Trump v. Slaughter (Cour suprême américaine)", "L'arrêt ne vise pas le Data Privacy Framework, qui reste en vigueur ; une veille active s'impose."], ["Yango (AP, 100 M€)", "Des transferts intragroupe vers la Russie : des clauses contractuelles ne suffisent pas, et l'amende est calculée sur le chiffre d'affaires mondial."], ["DSB (Autriche)", "Des clauses jugées douteuses vers la Chine, mais un transfert couvert par la dérogation « exécution du contrat »."]], "script": "Le sixième bloc était consacré aux transferts. Le Contrôleur européen de la protection des données a publié, pour les institutions de l'Union, une checklist en cinq étapes pour l'analyse d'impact d'un transfert. Elle est transposable et utile aussi pour les transferts fondés sur des clauses contractuelles types. L'arrêt Trump contre Slaughter de la Cour suprême américaine ne vise pas le Data Privacy Framework, qui reste en vigueur, mais une veille active s'impose. L'autorité néerlandaise a infligé cent millions d'euros d'amende à la société mère européenne de Yango pour des transferts intragroupe vers la Russie : des clauses contractuelles ne suffisaient pas, et l'amende a été calculée sur le chiffre d'affaires mondial du groupe. Enfin, l'autorité autrichienne a jugé douteuses des clauses vers la Chine, mais le transfert examiné était couvert par la dérogation liée à l'exécution du contrat.", "rowlinks": [{"url": "https://www.edps.europa.eu/system/files/2026-06/26-06-30-edps_tia_checklist_art48-3_eudpr_en.pdf", "rec": {"v": "p4", "t": 694}}, {"url": "https://constitution.congress.gov/browse/essay/intro.9-4-6/ALDE_00000130/", "rec": {"v": "p4", "t": 756}}, {"url": "https://www.autoriteitpersoonsgegevens.nl/documenten/besluit-boete-yango", "rec": {"v": "p4", "t": 993}}, {"url": "https://www.ris.bka.gv.at/Dokumente/Dsk/DSBT_20260731_2026_0_617_893_00/DSBT_20260731_2026_0_617_893_00.html", "rec": {"v": "p4", "t": 1160}}]}, {"id": 9, "type": "table", "chip": "La session", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 1}, "title": "La session (7/7) : preuves, sanctions, bon à savoir", "head": ["Sujet", "Ce que la session en a retenu"], "rows": [["CJUE, NTH Haustechnik", "Le RGPD n'impose pas d'écarter automatiquement une preuve obtenue de manière illicite ; le juge applique son droit procédural."], ["APD 217/2026", "Le refus de déréférencer est jugé fondé pour un jugement officiel récent sur une criminalité économique grave."], ["Poste autrichienne (Cour administrative suprême)", "Amende ramenée à 13 M€ : un avis d'avocat n'exonère pas en soi, et ne pas suivre les lignes directrices de l'EDPB est un indice de négligence."], ["Rapport annuel 2025 de l'APD", "1 394 plaintes (+ 67 %) et 214 décisions ; les courtiers en données comme dossier phare ; le rappel de l'affaire d'Anvers."], ["Blockchain (EDPB)", "Qualifiez selon qui décide, pas selon qui écrit ; sans effacement effectif possible, la blockchain n'est probablement pas l'outil adapté."], ["APD 215/2026", "L'APD n'est pas compétente pour les traitements effectués par les juridictions dans l'exercice de leur fonction juridictionnelle."]], "script": "Le dernier bloc regroupait les preuves, les sanctions et quelques points bon à savoir. Dans l'arrêt NTH Haustechnik, la Cour de justice juge que le RGPD n'impose pas d'écarter automatiquement une preuve obtenue de manière illicite : le juge applique son droit procédural. Dans sa décision deux cent dix-sept, l'Autorité de protection des données juge fondé le refus de déréférencer un jugement officiel récent sur une criminalité économique grave. En Autriche, la Cour administrative suprême ramène l'amende contre la Poste à treize millions d'euros, mais confirme la négligence : un avis d'avocat n'exonère pas en soi, et ne pas suivre les lignes directrices de l'EDPB est un indice de négligence. Le rapport annuel deux mille vingt-cinq de l'Autorité compte mille trois cent nonante-quatre plaintes, soit soixante-sept pour cent de plus, et deux cent quatorze décisions ; les courtiers en données en sont le dossier phare, et le rapport rappelle l'affaire d'Anvers. Pour la blockchain, l'EDPB demande de qualifier selon qui décide, et non selon qui écrit ; sans effacement effectif possible, la blockchain n'est probablement pas l'outil adapté. Enfin, dans sa décision deux cent quinze, l'Autorité se déclare incompétente pour les traitements effectués par les juridictions dans l'exercice de leur fonction juridictionnelle. Voyons maintenant ce que le DPO peut en retirer en pratique.", "rowlinks": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0484", "rec": {"v": "p4", "t": 1286}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/classement-sans-suite-n0-217-2026.pdf", "rec": {"v": "p4", "t": 1500}}, {"url": "https://www.vwgh.gv.at/medien/mitteilungen/ro2025-04-0007.html", "rec": {"v": "p4", "t": 1684}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/rapport-annuel-2025.pdf", "rec": {"v": "p4", "t": 2150}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202502_blockchain_v2_en.pdf", "rec": {"v": "p4", "t": 2314}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/classement-sans-suite-n0-215-2026.pdf", "rec": {"v": "p4", "t": 2485}}]}, {"id": 10, "type": "table", "chip": "Boîte à outils", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 2}, "title": "Boîte à outils du DPO (1/3) : les documents à garder sous la main", "head": ["Outil", "Pour quoi faire"], "rows": [["Fiche de la CNIL sur les conflits d'intérêts du DPO", "Tester un cumul de fonctions, par exemple avec un rôle d'AI officer : exigez une description écrite des missions. Selon les intervenantes : conseiller, encadrer les AIPD, former et auditer, oui ; décider des achats et des déploiements, ou exercer soi-même le contrôle humain du système, non."], ["Lignes directrices de l'EDPB sur l'anonymisation", "Tester l'anonymat entité par entité, avec les trois critères No Record Isolation, No Linkage et No Inference, et documenter une analyse motivée et datée. Attention : le texte est encore en consultation publique."], ["Lignes directrices de l'EDPB 07/2020 et la méthode « pourquoi / comment »", "Qualifier les parties activité par activité : qui a décidé que le traitement aurait lieu, et qui fixe les moyens essentiels ?"], ["Liste d'exemples de l'AP et fiches de la CNIL sur l'IA", "Comparer votre situation à des cas types de responsable et de sous-traitant, y compris pour les systèmes d'IA."], ["Lignes directrices de l'EDPB sur le web scraping", "Avant tout projet d'IA générative : cartographier les rôles, minimiser avant et après la collecte, constituer un dossier d'intérêt légitime complet, informer, encadrer les données sensibles, réévaluer régulièrement."], ["Checklist TIA de l'EDPS", "Conçue pour les institutions de l'UE, mais transposable. Structurer l'analyse d'impact d'un transfert en cinq étapes : décrire le transfert, identifier l'outil, évaluer son effectivité, ajouter des mesures, faire valider."], ["Recommandation 01/2025 de l'APD sur le marketing direct", "Vérifier vos campagnes de marketing direct à la lumière de la position de l'APD, mise à jour en 2025."]], "rowlinks": [{"url": "https://www.cnil.fr/fr/dpo-identifier-gerer-conflits-interets", "rec": {"v": "p1", "t": 985}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf", "rec": {"v": "p1", "t": 2370}}, {"url": "https://www.edpb.europa.eu/documents/guideline/guidelines-072020-on-the-concepts-of-controller-and-processor-in-the-gdpr_fr", "rec": {"v": "p3", "t": 2917}}, {"url": "https://autoriteitpersoonsgegevens.nl/documenten/voorbeeldlijst-wie-is-hier-de-verwerker-en-wie-de-verantwoordelijke", "rec": {"v": "p3", "t": 1268}}, {"url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf", "rec": {"v": "p3", "t": 3770}}, {"url": "https://www.edps.europa.eu/system/files/2026-06/26-06-30-edps_tia_checklist_art48-3_eudpr_en.pdf", "rec": {"v": "p4", "t": 694}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/recommandation-01-2025-relative-aux-traitements-de-donnees-a-caractere-personnel-dans-le-cadre-du-marketing-direct.pdf", "rec": {"v": "p2", "t": 3133}}], "script": "Pour terminer cette introduction, voici ce que le DPO peut retirer en pratique de cette session : d'abord sept documents à garder sous la main, ensuite les réflexes à adopter. La fiche de la CNIL sur les conflits d'intérêts vous aide à tester un cumul de fonctions, par exemple avec un rôle d'AI officer : exigez une description écrite des missions. Selon les intervenantes, conseiller, encadrer les analyses d'impact, former et auditer : oui. Décider des achats et des déploiements, ou exercer soi-même le contrôle humain du système : non. Les lignes directrices de l'EDPB sur l'anonymisation vous permettent de tester l'anonymat entité par entité, avec les trois critères No Record Isolation, No Linkage et No Inference, c'est-à-dire l'absence d'isolement, de mise en relation et d'inférence, et de documenter une analyse motivée et datée. Ces lignes directrices sont encore en consultation publique et peuvent évoluer. Les lignes directrices de l'EDPB sur les notions de responsable et de sous-traitant, avec la méthode pourquoi et comment, vous aident à qualifier les parties activité par activité : qui a décidé que le traitement aurait lieu, et qui fixe les moyens essentiels ? La liste d'exemples de l'autorité néerlandaise et les fiches de la CNIL sur l'IA vous permettent de comparer votre situation à des cas types de responsable et de sous-traitant, y compris pour les systèmes d'IA. Les lignes directrices de l'EDPB sur le web scraping contiennent une liste de points à vérifier avant tout projet : cartographier les rôles, minimiser avant et après la collecte, constituer un dossier d'intérêt légitime complet, informer, encadrer les données sensibles et réévaluer régulièrement. La liste de contrôle du Contrôleur européen de la protection des données, conçue pour les institutions de l'Union mais transposable à vos propres transferts, structure l'analyse d'impact d'un transfert en cinq étapes : décrire le transfert, identifier l'outil, évaluer son effectivité, ajouter des mesures et faire valider. Enfin, la recommandation de l'Autorité de protection des données sur le marketing direct, mise à jour en deux mille vingt-cinq, vous aide à vérifier vos campagnes à la lumière de sa position. Cliquez sur un outil pour l'ouvrir."}, {"id": 11, "type": "table", "chip": "Boîte à outils", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 2}, "title": "Boîte à outils du DPO (2/3) : les réflexes pour analyser et conseiller", "head": ["Réflexe", "Concrètement"], "rows": [["Documentez vos analyses", "Qualification par activité de traitement, identifiabilité par entité concernée, mise en balance : une analyse motivée et datée. Si vous affirmez être en conformité, par exemple que vos données sont anonymes, c'est à vous de le prouver."], ["Donnez vos avis par écrit, et à temps", "Dans l'affaire d'Anvers, rappelée par le rapport annuel de l'APD, l'organisation a été sanctionnée pour ne pas avoir suivi l'avis du DPO, qui avait signalé les problèmes en amont. Un avis écrit, motivé et rendu avant la mise en œuvre en garde la trace."], ["Lisez les contrats au-delà de l'étiquette", "Un « sous-traitant » qui fixe ses propres finalités, ou réutilise les données pour améliorer son propre outil, devient responsable, ou responsable conjoint, pour cette partie."], ["Ne vous abritez pas derrière un avis externe", "Un avis d'avocat n'exonère pas en soi, surtout s'il ne s'appuie pas sur la pratique décisionnelle existante : lisez et appliquez les lignes directrices de l'EDPB et la jurisprudence."], ["Relisez votre politique de confidentialité", "Une politique de groupe non filtrée sur votre site européen peut servir de preuve contre vous, par exemple pour l'obligation de désigner un DPO."], ["Plainte et procès en parallèle", "Ne demandez pas le classement de la plainte : demandez une suspension motivée, et gardez des positions cohérentes devant le juge et l'autorité."], ["Identifiez le bon interlocuteur", "Face à une juridiction qui agit dans sa fonction juridictionnelle, adressez-vous à elle : l'APD n'est pas compétente."]], "rowlinks": [{"url": "https://www.raadvanstate.nl/uitspraken/@159747/202401622-1-a3/", "rec": {"v": "p1", "t": 2128}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/rapport-annuel-2025.pdf", "rec": {"v": "p4", "t": 2250}}, {"url": "https://www.aepd.es/documento/ps-00192-2025.pdf", "rec": {"v": "p2", "t": 1515}}, {"url": "https://www.vwgh.gv.at/medien/mitteilungen/ro2025-04-0007.html", "rec": {"v": "p4", "t": 1684}}, {"url": "https://thedpo.eu/fr/decisions/0b275d3c-69f1-4e01-8a14-8c94e49e8794", "rec": {"v": "p1", "t": 1005}}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/PDF/?uri=CELEX:62024CJ0414", "rec": {"v": "p1", "t": 1480}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/classement-sans-suite-n0-215-2026.pdf", "rec": {"v": "p4", "t": 2485}}], "script": "Voici maintenant sept réflexes pour analyser et conseiller. Documentez vos analyses : la qualification activité par activité, l'identifiabilité pour chaque entité concernée et la mise en balance, chaque fois avec une analyse motivée et datée. Si vous affirmez être en conformité, par exemple que vos données sont anonymes, c'est à vous de le prouver. Donnez vos avis par écrit, et à temps. Dans l'affaire d'Anvers, rappelée par le rapport annuel de l'Autorité, l'organisation a été sanctionnée pour ne pas avoir suivi l'avis du DPO, qui avait pourtant signalé les problèmes en amont. Un avis écrit, motivé et rendu avant la mise en œuvre en garde la trace. Lisez les contrats au-delà de l'étiquette : un sous-traitant qui fixe ses propres finalités, ou qui réutilise les données pour améliorer son propre outil, devient responsable, ou responsable conjoint, pour cette partie. Ne vous abritez pas derrière un avis externe : un avis d'avocat n'exonère pas en soi, surtout s'il ne s'appuie pas sur la pratique décisionnelle existante. Lisez et appliquez donc les lignes directrices de l'EDPB et la jurisprudence. Relisez votre politique de confidentialité : une politique de groupe non filtrée sur votre site européen peut servir de preuve contre vous, par exemple pour l'obligation de désigner un DPO. Si une plainte et un procès sont menés en parallèle, ne demandez pas le classement de la plainte : demandez une suspension motivée, et gardez des positions cohérentes devant le juge et l'autorité. Enfin, identifiez le bon interlocuteur : face à une juridiction qui agit dans sa fonction juridictionnelle, adressez-vous à elle, car l'Autorité de protection des données n'est pas compétente. Chaque réflexe mène à la décision dont il est tiré, et au passage de l'enregistrement."}, {"id": 12, "type": "table", "chip": "Boîte à outils", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 2}, "title": "Boîte à outils du DPO (3/3) : les réflexes par thème", "head": ["Thème", "Concrètement"], "rows": [["Marketing direct", "Traitez le profilage à part : le soft opt-in ne le couvre pas. Prévoyez dans chaque e-mail une désinscription sans connexion ni ressaisie, et limitez la conservation des données anciennes."], ["Programme de fidélité", "Pas de consentement « tout ou rien » : un choix actif et distinct pour la newsletter, le profilage et l'analyse."], ["Données achetées", "Vérifiez vous-même la base légale : une garantie contractuelle du fournisseur ne suffit pas."], ["Pseudonymisation", "Qui gère lui-même la chaîne de pseudonymisation traite des données personnelles ; une interdiction contractuelle de réidentifier ne suffit pas."], ["Conservation", "Prévoyez un palier « durée contentieuse » et alignez la purge sur le sort réel du dossier, pas sur une date fixe."], ["Transferts", "Cartographiez tous les flux, y compris au sein du groupe, et documentez la base de chaque transfert."], ["Intelligence artificielle", "Tenez un inventaire des systèmes d'IA et, pour les systèmes à haut risque concernés, articulez l'AIPD et l'analyse d'impact sur les droits fondamentaux dans un seul processus."], ["Droit d'accès des travailleurs", "Appréciez chaque message selon son contenu, motivez votre réponse, formalisez une politique pour la période suivant la fin du contrat, et répondez dans le mois."]], "rowlinks": [{"url": "https://www.autoriteprotectiondonnees.be/publications/decision-de-transaction-n0-163-2026-du-16-juillet-2026.pdf", "rec": {"v": "p2", "t": 2360}}, {"url": "https://www.datatilsynet.no/regelverk-og-verktoy/lover-og-regler/avgjorelser-fra-datatilsynet/2026/overtredelsesgebyr-til-elkjop/", "rec": {"v": "p3", "t": 13}}, {"url": "https://www.autoriteprotectiondonnees.be/publications/arret-du-3-juin-2026-de-la-cour-des-marches-ar-2079.pdf", "rec": {"v": "p2", "t": 3160}}, {"url": "https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000054136834", "rec": {"v": "p2", "t": 845}}, {"url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBROT:2026:8302", "rec": {"v": "p4", "t": 72}}, {"url": "https://www.autoriteitpersoonsgegevens.nl/documenten/besluit-boete-yango", "rec": {"v": "p4", "t": 993}}, {"url": "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force", "rec": {"v": "p3", "t": 965}}, {"url": "https://idpc.org.mt/wp-content/uploads/2026/08/CDP_COMP_130_2025.pdf", "rec": {"v": "p3", "t": 4336}}], "script": "Et voici les réflexes par thème. En marketing direct, traitez le profilage à part, car le soft opt-in ne le couvre pas. Prévoyez dans chaque e-mail une désinscription sans connexion à un compte ni ressaisie, et limitez la conservation des données anciennes. Pour un programme de fidélité, pas de consentement tout ou rien : prévoyez un choix actif et distinct pour la newsletter, le profilage et l'analyse. Pour les données achetées, vérifiez vous-même la base légale : une garantie contractuelle du fournisseur ne suffit pas. Si vous gérez vous-même une chaîne de pseudonymisation, vous traitez des données personnelles, et une interdiction contractuelle de réidentifier ne suffit pas. Pour la conservation, prévoyez un palier de durée contentieuse et alignez la purge sur le sort réel du dossier, pas sur une date fixe. Pour les transferts, cartographiez tous les flux, y compris au sein du groupe, et documentez la base de chaque transfert. Pour l'intelligence artificielle, tenez un inventaire des systèmes d'IA et, pour les systèmes à haut risque concernés, articulez l'analyse d'impact relative à la protection des données et l'analyse d'impact sur les droits fondamentaux dans un seul processus. Enfin, pour le droit d'accès des travailleurs, appréciez chaque message selon son contenu, motivez votre réponse, formalisez une politique pour la période suivant la fin du contrat, et répondez dans le mois. Place maintenant aux exercices."}, {"id": 13, "type": "chain", "chip": "Partie A", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 3}, "title": "Partie A : qualifier les parties, la méthode", "steps": [{"k": "Pourquoi ?", "t": "pourquoi le traitement a-t-il lieu, et qui a décidé qu'il devait être réalisé ?"}, {"k": "Comment ?", "t": "qui décide des moyens essentiels : catégories de données et de personnes, durée de conservation, destinataires ?"}, {"k": "La qualification", "t": "responsable (art. 4.7), responsables conjoints (art. 26), sous-traitant (art. 4.8), ou aucun rôle si les données sont anonymes pour cette entité."}, {"k": "Par activité", "t": "qualifiez traitement par traitement : un sous-traitant qui fixe des finalités ou des moyens essentiels devient responsable pour cette partie (art. 28.10)."}], "note": "La notion est fonctionnelle, pas contractuelle : la réalité des faits prime sur l'étiquette choisie dans un contrat.", "rec": [{"v": "p3", "t": 1036, "label": "La méthode dans la session"}], "script": "La partie A porte sur la qualification des parties. La session a proposé une méthode en deux questions. Pourquoi : pourquoi le traitement a-t-il lieu, et qui a décidé qu'il devait être réalisé ? Comment : qui décide des moyens essentiels, c'est-à-dire des catégories de données et de personnes, de la durée de conservation et des destinataires ? Le choix d'un logiciel, lui, est un moyen non essentiel. Vous qualifiez ensuite chaque partie : responsable du traitement, responsables conjoints, sous-traitant, ou aucun rôle si les données sont anonymes pour cette entité. Et vous qualifiez activité par activité, car un sous-traitant qui fixe des finalités ou des moyens essentiels devient responsable pour cette partie du traitement. Retenez surtout que la notion est fonctionnelle : la réalité des faits prime sur l'étiquette du contrat. Avec le bouton en bas, vous retrouvez la méthode dans la session."}, {"id": 14, "type": "cards", "chip": "Partie B", "nav": {"items": ["Le module", "La session", "Boîte à outils", "Partie A", "Partie B"], "active": 4}, "title": "Partie B : une question du DPO par décision", "cols": 4, "numbered": false, "intro": "Sept séries, dans l'ordre des thèmes de la session :", "cards": [{"k": "Rôle du DPO et procédure", "t": "CNIL et AI officer, KFC, C-414/24, Anvers"}, {"k": "Concepts et anonymisation", "t": "Enschede, cas pratiques EDPB, IQVIA"}, {"k": "Champ d'application et licéité", "t": "Lusha, APD 163/2026, Infobel, Elkjøp, RRC Sports"}, {"k": "IA et web scraping", "t": "AI Act et RGPD, scraping, données sensibles"}, {"k": "Droits", "t": "IDPC Malte, Darashev, Lexbase"}, {"k": "Conservation et transferts", "t": "Blankenburg, NADA Austria, Trump v. Slaughter, Yango, DSB"}, {"k": "Preuves, déréférencement, sanctions, juridictions", "t": "NTH Haustechnik, APD 217/2026, Poste autrichienne, APD 215/2026"}], "script": "La partie B vous pose une question ciblée pour chaque décision ou arrêt présenté. Les sept séries suivent l'ordre des thèmes de la session. D'abord le rôle du DPO et la procédure, avec la fiche de la CNIL, l'affaire KFC, l'arrêt de la Cour de justice sur le cumul des recours et l'affaire d'Anvers. Ensuite les concepts et l'anonymisation, avec Enschede, les cas pratiques de l'EDPB et IQVIA. Puis le champ d'application et la licéité, avec Lusha, la décision 163 de l'APD, Infobel, Elkjøp et l'arrêt sur la FIFA. Ensuite l'intelligence artificielle et le web scraping, puis les droits, avec la décision maltaise, Darashev et Lexbase. Puis la conservation et les transferts, avec Blankenburg, NADA Austria, l'arrêt Trump contre Slaughter, Yango et l'autorité autrichienne. Et enfin les preuves, le déréférencement, les sanctions et le contrôle des juridictions, avec NTH Haustechnik, deux décisions de l'APD et la Poste autrichienne. Cliquez maintenant sur le bouton vers les exercices, et choisissez une série."}], "quizzes": [{"id": "A1", "title": "Partie A · Qualifier les parties — les décisions", "intro": "VIPTHINK, Isabel/TruliUs, l'hôpital et l'institut de recherche, la blockchain.", "questions": [{"context": "Dans cette session de Stay Tuned, nous avons examiné la décision de l'AEPD (Espagne) sur VIPTHINK : une application de check-in touristique qui compare la photo de la pièce d'identité à un selfie grâce à une IA. Le contrat désignait VIPTHINK comme « sous-traitant » des propriétaires de logements. L'AEPD a regardé au-delà du contrat : qui a choisi les fonctionnalités, qui poursuit quelles finalités et qui configure les moyens techniques, comme la durée de conservation.", "q": "Vous êtes le DPO du propriétaire du logement. VIPTHINK a choisi les fonctionnalités de l'application et sa politique de confidentialité mentionne ses propres finalités de prospection. Comment qualifiez-vous VIPTHINK ?", "options": ["Responsable conjoint du traitement, car VIPTHINK détermine des finalités propres et les moyens essentiels.", "Sous-traitant, car la technologie biométrique vient d'un fournisseur tiers.", "Sous-traitant, puisque le contrat le prévoit expressément.", "Destinataire, sans rôle de responsable ni de sous-traitant."], "answer": 0, "feedback": ["L'AEPD a requalifié VIPTHINK en responsable conjoint : elle décide des fonctionnalités, poursuit des finalités propres et configure les moyens techniques (art. 4.7 et 28.10 RGPD).", "Le recours à un prestataire technique n'exonère pas VIPTHINK : le choix et le contrôle d'un sous-traitant restent de la responsabilité de qui le mandate.", "Les notions de responsable et de sous-traitant sont fonctionnelles : l'étiquette du contrat ne compte pas.", "VIPTHINK ne se contente pas de recevoir des données : elle intervient sur les finalités et les moyens."], "key": "La qualification se fait sur les activités concrètes, jamais sur la désignation contractuelle. Les données traitées pour la vérification faciale par IA sont en outre des données biométriques (art. 9), même pour une simple authentification.", "rec": [{"v": "p2", "t": 1515, "label": "Le cas VIPTHINK"}], "links": [{"label": "AEPD : décision PS-00192-2025 (VIPTHINK, ES)", "url": "https://www.aepd.es/documento/ps-00192-2025.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons brièvement rappelé la décision 103/2026 de l'APD sur Isabel SA et son service d'authentification B2B TruliUs, déjà discutée lors d'une session précédente. Isabel se disait responsable pour des volets annexes (vérification BCE, facturation), mais sous-traitante pour l'authentification elle-même. Or Isabel avait conçu le service et défini sa finalité avant l'arrivée de tout client, et fixait seule les catégories de données et de personnes, la durée de conservation (13 mois) et les destinataires.", "q": "Vous êtes le DPO d'Isabel. La direction veut maintenir cette répartition « responsable pour certaines briques, sous-traitant pour l'authentification ». Que lui conseillez-vous ?", "options": ["De la maintenir : un service standardisé, comme un cloud, fait toujours d'Isabel un sous-traitant.", "De la maintenir, car c'est le client qui tire un avantage pratique du service.", "De se reconnaître responsable du traitement pour l'authentification aussi : Isabel a conçu le service et fixe seule les moyens essentiels.", "De conclure une responsabilité conjointe avec chaque client, pour partager le risque."], "answer": 2, "feedback": ["L'APD écarte l'analogie avec un cloud standardisé : un vrai sous-traitant ne détermine ni le contenu, ni la finalité, ni les personnes concernées, ni la durée.", "Que le client tire un avantage du service ne le rend pas responsable du traitement.", "Isabel a défini la finalité avant l'arrivée de tout client et fixe seule les catégories de données et de personnes, la durée de conservation (13 mois) et les destinataires. La scission était artificielle.", "Le client ne détermine ni la finalité ni les moyens essentiels de l'authentification : rien ne fonde une responsabilité conjointe."], "key": "Auditez la qualification par activité de traitement : qui a conçu le service et fixé ses paramètres avant l'arrivée du premier client ? Scinder artificiellement un service unique ne protège pas d'une requalification.", "rec": [{"v": "p2", "t": 2235, "label": "Le cas Isabel / TruliUs"}], "links": []}, {"context": "Dans cette session de Stay Tuned, nous avons résolu le cas pratique 4 des lignes directrices de l'EDPB sur l'anonymisation : un hôpital transmet à un institut de recherche indépendant des extraits de dossiers qui, pris isolément, ne permettent pas d'identifier les patients. L'institut n'a aucun moyen raisonnable de lever le lien et agit sans instruction de l'hôpital. Selon les lignes directrices, l'anonymat s'apprécie entité par entité : des données sont anonymes pour une entité qui n'a aucun moyen raisonnable de réidentifier les personnes, et le RGPD ne s'applique pas à des données anonymes.", "q": "Vous êtes le DPO de l'hôpital. Quel est le rôle de l'institut au regard du RGPD pour ce jeu de données ?", "options": ["Aucun : pour l'institut, les données sont anonymes ; seul l'hôpital est responsable, pour le transfert.", "Sous-traitant de l'hôpital, puisque l'hôpital lui fournit les données.", "Responsable conjoint avec l'hôpital, car ils poursuivent ensemble une finalité de recherche.", "Responsable autonome, avec sa propre obligation d'informer les patients."], "answer": 0, "feedback": ["Les données sont anonymes du point de vue de l'institut : le RGPD ne s'applique pas à son traitement. Elles restent personnelles pour l'hôpital, qui reste responsable du transfert, doit avoir une base légale (art. 6 et 9.2) et doit informer les patients.", "L'institut n'agit sur aucune instruction de l'hôpital et définit lui-même ses moyens et finalités.", "Il n'y a pas de décision commune sur les finalités et les moyens d'un même traitement de données personnelles.", "Ce serait le cas si l'institut pouvait recouper ou obtenir la clé (scénario de pseudonymisation). Ici, il ne le peut pas."], "key": "Un même jeu de données peut être personnel pour l'un et anonyme pour l'autre (logique de l'arrêt SRB). L'information des patients et la base légale du transfert restent à charge de l'hôpital.", "rec": [{"v": "p1", "t": 4800, "label": "Le cas pratique 4"}, {"v": "p2", "t": 10, "label": "La solution du cas 4"}], "links": [{"label": "EDPB : lignes directrices anonymisation (EN)", "url": "https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202602_anonymisation_v1_en_0.pdf"}]}, {"context": "Dans cette session de Stay Tuned, nous avons parcouru les lignes directrices de l'EDPB sur la blockchain : la bonne question n'est pas « qui écrit techniquement la donnée ? », mais « qui décide des finalités et des moyens ? ». L'EDPB distingue les blockchains permissionnées, où une autorité définit qui peut participer, et les blockchains sans permission, où personne ne contrôle l'accès.", "q": "Vous êtes le DPO d'une fédération qui veut créer une blockchain permissionnée pour certifier des diplômes : la fédération définit qui participe et les règles ; des nœuds se contentent de valider les transactions. Qui est responsable du traitement ?", "options": ["Chaque nœud, puisque chacun stocke une copie de la chaîne.", "La fédération : dans une blockchain permissionnée, l'autorité qui définit qui participe est en principe responsable.", "Personne : une blockchain n'a pas d'autorité centrale.", "Le prestataire informatique qui inscrit les données sur la chaîne."], "answer": 1, "feedback": ["Un nœud qui ne fait que valider techniquement n'est pas responsable du traitement.", "Dans une blockchain permissionnée, l'autorité qui définit les participants est en principe responsable. C'est d'ailleurs le modèle que l'EDPB recommande, parce que la répartition des rôles y est claire.", "L'EDPB recommande justement, lorsque des nœuds décident collectivement des règles, de constituer un consortium ou une entité juridique pour qu'il y ait un responsable identifiable.", "Un prestataire qui écrit sur la chaîne selon des instructions documentées est sous-traitant (art. 28)."], "key": "Qualifiez selon qui décide des
