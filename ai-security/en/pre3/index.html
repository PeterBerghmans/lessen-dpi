,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><g><rect class=\"bxa\" x=\"30\" y=\"24\" width=\"280\" height=\"92\" rx=\"10\"/><text class=\"t1\" x=\"170.0\" y=\"67\" text-anchor=\"middle\">What we protect<\/text><text class=\"t2\" x=\"170.0\" y=\"84\" text-anchor=\"middle\">three properties<\/text><\/g><circle cx=\"30\" cy=\"24\" r=\"15\" style=\"fill:var(--accent)\"/><text class=\"nb\" x=\"30\" y=\"29\" text-anchor=\"middle\" style=\"font-size:14px\">1<\/text><line class=\"lna\" x1=\"314\" y1=\"70\" x2=\"356\" y2=\"70\" marker-end=\"url(#aa)\"/><g><rect class=\"bxa\" x=\"360\" y=\"24\" width=\"280\" height=\"92\" rx=\"10\"/><text class=\"t1\" x=\"500.0\" y=\"67\" text-anchor=\"middle\">What can go wrong<\/text><text class=\"t2\" x=\"500.0\" y=\"84\" text-anchor=\"middle\">threat, vulnerability, impact<\/text><\/g><circle cx=\"360\" cy=\"24\" r=\"15\" style=\"fill:var(--accent)\"/><text class=\"nb\" x=\"360\" y=\"29\" text-anchor=\"middle\" style=\"font-size:14px\">2<\/text><line class=\"lna\" x1=\"644\" y1=\"70\" x2=\"686\" y2=\"70\" marker-end=\"url(#aa)\"/><g><rect class=\"bxa\" x=\"690\" y=\"24\" width=\"280\" height=\"92\" rx=\"10\"/><text class=\"t1\" x=\"830.0\" y=\"67\" text-anchor=\"middle\">How bad is it<\/text><text class=\"t2\" x=\"830.0\" y=\"84\" text-anchor=\"middle\">risk = likelihood × impact<\/text><\/g><circle cx=\"690\" cy=\"24\" r=\"15\" style=\"fill:var(--accent)\"/><text class=\"nb\" x=\"690\" y=\"29\" text-anchor=\"middle\" style=\"font-size:14px\">3<\/text><g><rect class=\"bxa\" x=\"30\" y=\"154\" width=\"280\" height=\"92\" rx=\"10\"/><text class=\"t1\" x=\"170.0\" y=\"197\" text-anchor=\"middle\">What we do about it<\/text><text class=\"t2\" x=\"170.0\" y=\"214\" text-anchor=\"middle\">countermeasures<\/text><\/g><circle cx=\"30\" cy=\"154\" r=\"15\" style=\"fill:var(--accent)\"/><text class=\"nb\" x=\"30\" y=\"159\" text-anchor=\"middle\" style=\"font-size:14px\">4<\/text><line class=\"lna\" x1=\"314\" y1=\"200\" x2=\"356\" y2=\"200\" marker-end=\"url(#aa)\"/><g><rect class=\"bx\" x=\"360\" y=\"154\" width=\"280\" height=\"92\" rx=\"10\"/><text class=\"t1\" x=\"500.0\" y=\"197\" text-anchor=\"middle\">In the course<\/text><text class=\"t2\" x=\"500.0\" y=\"214\" text-anchor=\"middle\">where you use the words<\/text><\/g><circle cx=\"360\" cy=\"154\" r=\"15\" style=\"fill:var(--accent)\"/><text class=\"nb\" x=\"360\" y=\"159\" text-anchor=\"middle\" style=\"font-size:14px\">5<\/text><path class=\"lna\" d=\"M830,120 C830,140 170,128 170,150\" marker-end=\"url(#aa)\"/><text class=\"cap\" x=\"500\" y=\"272\" text-anchor=\"middle\">each question needs the answer to the one before<\/text><\/svg>", "script": "The module follows five questions, each one built on the answer to the one before. **First**: what do we protect? **Second**: what can go wrong, and why? **Third**: how bad is it? **Then**: what do we do about it? **And finally**: where will you use these words in the course? All examples come from HelpBot, the support assistant of a fictional web shop. At the top of each slide, the coloured label shows where you are on this route.", "id": 2, "cues": [5.19, 7.72, 10.9, 13.26, 15.71, 19.43, 24.26]}, {"type": "concepts", "cols": 3, "route": 0, "title": "Confidentiality, integrity, availability: the three things you protect", "svg": "<svg viewBox=\"0 0 1000 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Three scenes in an AI system: the model reveals its system prompt and order data, a document in the vector store is poisoned, and a flood of questions uses up the token budget\"><style>.fig rect.bx,rect.bx{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig rect.bxa,rect.bxa{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.fig rect.bxm,rect.bxm{fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}.fig rect.zn,rect.zn{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 6}.fig rect.zg,rect.zg{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 5}.fig rect.lane,rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}.fig text.t1,text.t1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.t2,text.t2{font-size:11.5px;fill:var(--muted)}.fig text.zl,text.zl{font-size:11px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.zgl,text.zgl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.fig text.al,text.al{font-size:11.5px;fill:var(--muted)}.fig text.ala,text.ala{font-size:11.5px;font-weight:700;fill:var(--accent)}.fig text.hd,text.hd{font-size:15px;font-weight:700;fill:var(--accent)}.fig text.nb,text.nb{font-size:12px;font-weight:700;fill:#fff}.fig text.cap,text.cap{font-size:12.5px;fill:var(--muted)}.ln{stroke:var(--muted);stroke-width:2;fill:none}.lna{stroke:var(--accent);stroke-width:2.6;fill:none}.lnb{stroke:var(--bad);stroke-width:2.4;fill:none;stroke-dasharray:6 5}.nbc{fill:var(--bad)}<\/style><defs><marker id=\"am\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><marker id=\"aa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"ab\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><style>.fig text.bad,text.bad{font-size:12px;font-weight:700;fill:var(--bad)}.fig rect.bxb,rect.bxb{fill:var(--bad-bg);stroke:var(--bad);stroke-width:2}<\/style><g data-step=\"2\" data-hl=\"2\"><rect class=\"lane\" x=\"10\" y=\"10\" width=\"314\" height=\"200\" rx=\"12\"/><g><rect class=\"bx\" x=\"26\" y=\"40\" width=\"130\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"91.0\" y=\"67\" text-anchor=\"middle\">System prompt<\/text><text class=\"t2\" x=\"91.0\" y=\"84\" text-anchor=\"middle\">and order data<\/text><\/g><line class=\"lnb\" x1=\"160\" y1=\"70\" x2=\"196\" y2=\"70\" marker-end=\"url(#ab)\"/><g><rect class=\"bxb\" x=\"200\" y=\"40\" width=\"108\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"254.0\" y=\"67\" text-anchor=\"middle\">The answer<\/text><text class=\"t2\" x=\"254.0\" y=\"84\" text-anchor=\"middle\">shows it<\/text><\/g><text class=\"bad\" x=\"167\" y=\"150\" text-anchor=\"middle\">the model reveals what it holds<\/text><text class=\"cap\" x=\"167\" y=\"180\" text-anchor=\"middle\">confidentiality is lost<\/text><\/g><g data-step=\"3\" data-hl=\"3\"><rect class=\"lane\" x=\"343\" y=\"10\" width=\"314\" height=\"200\" rx=\"12\"/><g><rect class=\"bx\" x=\"359\" y=\"40\" width=\"130\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"424.0\" y=\"67\" text-anchor=\"middle\">Vector store<\/text><text class=\"t2\" x=\"424.0\" y=\"84\" text-anchor=\"middle\">return policy: 30 days<\/text><\/g><line class=\"lnb\" x1=\"493\" y1=\"70\" x2=\"529\" y2=\"70\" marker-end=\"url(#ab)\"/><g><rect class=\"bxb\" x=\"533\" y=\"40\" width=\"108\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"587.0\" y=\"67\" text-anchor=\"middle\">Poisoned<\/text><text class=\"t2\" x=\"587.0\" y=\"84\" text-anchor=\"middle\">300 days<\/text><\/g><text class=\"bad\" x=\"500\" y=\"150\" text-anchor=\"middle\">data poisoning: wrong answers<\/text><text class=\"cap\" x=\"500\" y=\"180\" text-anchor=\"middle\">integrity is lost<\/text><\/g><g data-step=\"4\" data-hl=\"4\"><rect class=\"lane\" x=\"676\" y=\"10\" width=\"314\" height=\"200\" rx=\"12\"/><g><rect class=\"bx\" x=\"692\" y=\"40\" width=\"130\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"757.0\" y=\"67\" text-anchor=\"middle\">Flood of<\/text><text class=\"t2\" x=\"757.0\" y=\"84\" text-anchor=\"middle\">long questions<\/text><\/g><line class=\"lnb\" x1=\"826\" y1=\"70\" x2=\"862\" y2=\"70\" marker-end=\"url(#ab)\"/><g><rect class=\"bxb\" x=\"866\" y=\"40\" width=\"108\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"920.0\" y=\"67\" text-anchor=\"middle\">Token budget<\/text><text class=\"t2\" x=\"920.0\" y=\"84\" text-anchor=\"middle\">used up<\/text><\/g><text class=\"bad\" x=\"833\" y=\"150\" text-anchor=\"middle\">HelpBot stops answering<\/text><text class=\"cap\" x=\"833\" y=\"180\" text-anchor=\"middle\">availability is lost<\/text><\/g><\/svg>", "cards": [{"k": "Confidentiality", "t": "only those allowed can see it"}, {"k": "Integrity", "t": "correct, and not changed without permission"}, {"k": "Availability", "t": "there when you need it"}], "read": {"links": [{"url": "https://csrc.nist.gov/glossary/term/confidentiality", "label": "NIST · confidentiality", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition on the page."}, {"url": "https://csrc.nist.gov/glossary/term/integrity", "label": "NIST · integrity", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition on the page."}, {"url": "https://csrc.nist.gov/glossary/term/availability", "label": "NIST · availability", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition on the page."}]}, "steps": [{"script": "First question: what do we protect? Security people answer with three words, and you will often see them as three letters: C, I, A. Each one has a card. For each, you will see how it fails in an AI system like HelpBot.", "cues": [2.88, 10.32, 12.0]}, {"script": "**The first card** is confidentiality: only those who are allowed can see the information. Here is how it fails with AI. A visitor asks HelpBot a clever question, and HelpBot shows its own system prompt, or the order of another customer. Whatever a model has in front of it can end up in an answer.", "card": 0, "cues": [5.76, 8.16, 15.53]}, {"script": "**The second card** is integrity: information and systems are correct, and nobody changed them without permission. Here is how it fails with AI. Someone changes one document in the vector store, the place where HelpBot looks things up. From then on, HelpBot gives wrong answers with full confidence. The course calls this data poisoning.", "card": 1, "cues": [7.53, 9.9, 15.07, 19.26]}, {"script": "**The third card** is availability: information and systems are there when you need them. Here is how it fails with AI. Every question to a model costs tokens, and tokens cost money. A flood of long questions uses up the budget in one night, and HelpBot stops answering.", "card": 2, "cues": [5.78, 8.08, 12.76]}, {"script": "Every security problem you will meet in the course harms at least one of these three, and often more than one. So when someone describes an incident with an AI system, ask yourself first: what was lost here? The reference definitions come from NIST, the American standards institute. The links to all three are under this slide.", "cues": [6.39, 12.94, 17.38]}], "script": "First question: what do we protect? Security people answer with three words, and you will often see them as three letters: C, I, A. Each one has a card. For each, you will see how it fails in an AI system like HelpBot. **The first card** is confidentiality: only those who are allowed can see the information. Here is how it fails with AI. A visitor asks HelpBot a clever question, and HelpBot shows its own system prompt, or the order of another customer. Whatever a model has in front of it can end up in an answer. **The second card** is integrity: information and systems are correct, and nobody changed them without permission. Here is how it fails with AI. Someone changes one document in the vector store, the place where HelpBot looks things up. From then on, HelpBot gives wrong answers with full confidence. The course calls this data poisoning. **The third card** is availability: information and systems are there when you need them. Here is how it fails with AI. Every question to a model costs tokens, and tokens cost money. A flood of long questions uses up the budget in one night, and HelpBot stops answering. Every security problem you will meet in the course harms at least one of these three, and often more than one. So when someone describes an incident with an AI system, ask yourself first: what was lost here? The reference definitions come from NIST, the American standards institute. The links to all three are under this slide.", "id": 3}, {"type": "figure", "route": 1, "title": "Threat, vulnerability, impact: three things that have to meet", "svg": "<svg viewBox=\"0 0 1000 332\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A chain of three boxes: a threat uses a vulnerability and causes impact, each with an example on HelpBot and what changes with AI; below, a strip of HelpBot shows the product review, the model and the order database\"><style>.fig rect.bx,rect.bx{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig rect.bxa,rect.bxa{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.fig rect.bxm,rect.bxm{fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}.fig rect.zn,rect.zn{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 6}.fig rect.zg,rect.zg{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 5}.fig rect.lane,rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}.fig text.t1,text.t1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.t2,text.t2{font-size:11.5px;fill:var(--muted)}.fig text.zl,text.zl{font-size:11px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.zgl,text.zgl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.fig text.al,text.al{font-size:11.5px;fill:var(--muted)}.fig text.ala,text.ala{font-size:11.5px;font-weight:700;fill:var(--accent)}.fig text.hd,text.hd{font-size:15px;font-weight:700;fill:var(--accent)}.fig text.nb,text.nb{font-size:12px;font-weight:700;fill:#fff}.fig text.cap,text.cap{font-size:12.5px;fill:var(--muted)}.ln{stroke:var(--muted);stroke-width:2;fill:none}.lna{stroke:var(--accent);stroke-width:2.6;fill:none}.lnb{stroke:var(--bad);stroke-width:2.4;fill:none;stroke-dasharray:6 5}.nbc{fill:var(--bad)}<\/style><defs><marker id=\"am\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><marker id=\"aa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"ab\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><g data-step=\"2\" data-hl=\"2,5\"><g><rect class=\"bxa\" x=\"20\" y=\"20\" width=\"290\" height=\"76\" rx=\"10\"/><text class=\"t1\" x=\"165.0\" y=\"55\" text-anchor=\"middle\">Threat<\/text><text class=\"t2\" x=\"165.0\" y=\"72\" text-anchor=\"middle\">could cause harm<\/text><\/g><\/g><g data-step=\"2\"><text class=\"zgl\" x=\"165\" y=\"124\" text-anchor=\"middle\">For HelpBot:<\/text><text class=\"cap\" x=\"165\" y=\"144\" text-anchor=\"middle\">an attacker hides an instruction<\/text><text class=\"cap\" x=\"165\" y=\"161\" text-anchor=\"middle\">in a product review<\/text><text class=\"ala\" x=\"165\" y=\"184\" text-anchor=\"middle\">with AI: anyone who can write text the model reads<\/text><\/g><g data-step=\"3\" data-hl=\"3,5\"><g><rect class=\"bxa\" x=\"355\" y=\"20\" width=\"290\" height=\"76\" rx=\"10\"/><text class=\"t1\" x=\"500.0\" y=\"55\" text-anchor=\"middle\">Vulnerability<\/text><text class=\"t2\" x=\"500.0\" y=\"72\" text-anchor=\"middle\">a weakness a threat can use<\/text><\/g><\/g><g data-step=\"3\"><text class=\"zgl\" x=\"500\" y=\"124\" text-anchor=\"middle\">For HelpBot:<\/text><text class=\"cap\" x=\"500\" y=\"144\" text-anchor=\"middle\">HelpBot follows any text<\/text><text class=\"cap\" x=\"500\" y=\"161\" text-anchor=\"middle\">that it reads<\/text><text class=\"ala\" x=\"500\" y=\"184\" text-anchor=\"middle\">with AI: instructions and data look the same<\/text><\/g><g data-step=\"3\"><line class=\"lna\" x1=\"314\" y1=\"58\" x2=\"351\" y2=\"58\" marker-end=\"url(#aa)\"/><\/g><g data-step=\"4\" data-hl=\"4,5\"><g><rect class=\"bxa\" x=\"690\" y=\"20\" width=\"290\" height=\"76\" rx=\"10\"/><text class=\"t1\" x=\"835.0\" y=\"55\" text-anchor=\"middle\">Impact<\/text><text class=\"t2\" x=\"835.0\" y=\"72\" text-anchor=\"middle\">the harm when it happens<\/text><\/g><\/g><g data-step=\"4\"><text class=\"zgl\" x=\"835\" y=\"124\" text-anchor=\"middle\">For HelpBot:<\/text><text class=\"cap\" x=\"835\" y=\"144\" text-anchor=\"middle\">order data of customers<\/text><text class=\"cap\" x=\"835\" y=\"161\" text-anchor=\"middle\">reaches the attacker<\/text><text class=\"ala\" x=\"835\" y=\"184\" text-anchor=\"middle\">with AI: grows with what the system may do<\/text><\/g><g data-step=\"4\"><line class=\"lna\" x1=\"649\" y1=\"58\" x2=\"686\" y2=\"58\" marker-end=\"url(#aa)\"/><\/g><rect class=\"lane\" x=\"10\" y=\"204\" width=\"980\" height=\"92\" rx=\"12\"/><text class=\"zgl\" x=\"26\" y=\"224\" text-anchor=\"start\">WHERE IT SITS IN HELPBOT<\/text><g data-hl=\"2\"><g><rect class=\"bx\" x=\"60\" y=\"234\" width=\"190\" height=\"50\" rx=\"10\"/><text class=\"t1\" x=\"155.0\" y=\"256\" text-anchor=\"middle\">Product review<\/text><text class=\"t2\" x=\"155.0\" y=\"273\" text-anchor=\"middle\">written by anyone<\/text><\/g><\/g><line class=\"ln\" x1=\"254\" y1=\"259\" x2=\"296\" y2=\"259\" marker-end=\"url(#am)\"/><g><rect class=\"bx\" x=\"300\" y=\"234\" width=\"170\" height=\"50\" rx=\"10\"/><text class=\"t1\" x=\"385.0\" y=\"264\" text-anchor=\"middle\">Vector store<\/text><\/g><line class=\"ln\" x1=\"474\" y1=\"259\" x2=\"516\" y2=\"259\" marker-end=\"url(#am)\"/><g data-hl=\"3\"><g><rect class=\"bx\" x=\"520\" y=\"234\" width=\"200\" height=\"50\" rx=\"10\"/><text class=\"t1\" x=\"620.0\" y=\"256\" text-anchor=\"middle\">HelpBot and its model<\/text><text class=\"t2\" x=\"620.0\" y=\"273\" text-anchor=\"middle\">reads the review<\/text><\/g><\/g><line class=\"ln\" x1=\"724\" y1=\"259\" x2=\"766\" y2=\"259\" marker-end=\"url(#am)\" marker-start=\"url(#am)\"/><g data-hl=\"4\"><g><rect class=\"bx\" x=\"770\" y=\"234\" width=\"180\" height=\"50\" rx=\"10\"/><text class=\"t1\" x=\"860.0\" y=\"264\" text-anchor=\"middle\">Order database<\/text><\/g><\/g><g data-step=\"5\"><text class=\"hd\" x=\"500\" y=\"320\" text-anchor=\"middle\">a threat needs a vulnerability to cause impact: the three have to meet<\/text><\/g><\/svg>", "read": {"links": [{"url": "https://csrc.nist.gov/glossary/term/threat", "label": "NIST · threat", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition: it covers any circumstance or event that can cause harm, not only attackers."}, {"url": "https://csrc.nist.gov/glossary/term/vulnerability", "label": "NIST · vulnerability", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition on the page."}]}, "steps": [{"script": "Second question: what can go wrong, and why? Here you need to keep three words apart. Under the three boxes you see a strip of HelpBot. It shows where each word sits in the system.", "cues": [3.85, 6.56, 9.8]}, {"script": "**First**, the threat. A threat is anything that could cause harm. That can be an attacker, but also a mistake or a failure. A threat comes from outside your design: you do not decide whether criminals exist. For HelpBot: an attacker who hides an instruction in a product review. And that is what changes with AI. Anyone who can write text that the model will read is a possible attacker.", "cues": [1.91, 4.95, 8.95, 14.41, 18.97, 21.68]}, {"script": "**Second**, the vulnerability. That is a weakness that a threat can use. A vulnerability is yours: it sits in what you built or how you run it. For HelpBot: it treats every text it reads as something it may follow. This weakness is typical for AI. A language model cannot reliably tell instructions from data.", "cues": [2.46, 5.41, 10.26, 14.91, 17.49]}, {"script": "**Third**, the impact: the harm when it happens. Confidentiality, integrity or availability is lost, and the organisation pays for it. For HelpBot: order data of customers ends up with the attacker. With AI, the impact grows with what the system may do on its own: the more it can read, write or pay, the bigger the harm.", "cues": [3.79, 9.94, 14.44]}, {"script": "These three have to meet. A threat without a vulnerability bounces off. A vulnerability that no threat can reach is a problem waiting to happen. In the course you will meet the same chain in every incident. The HelpBot example has a name, by the way: prompt injection. Text written by an attacker makes the model follow the attacker's instructions. The links to the NIST definitions of threat and vulnerability are under this slide.", "cues": [2.02, 5.17, 9.91, 13.5, 17.55, 22.07]}], "script": "Second question: what can go wrong, and why? Here you need to keep three words apart. Under the three boxes you see a strip of HelpBot. It shows where each word sits in the system. **First**, the threat. A threat is anything that could cause harm. That can be an attacker, but also a mistake or a failure. A threat comes from outside your design: you do not decide whether criminals exist. For HelpBot: an attacker who hides an instruction in a product review. And that is what changes with AI. Anyone who can write text that the model will read is a possible attacker. **Second**, the vulnerability. That is a weakness that a threat can use. A vulnerability is yours: it sits in what you built or how you run it. For HelpBot: it treats every text it reads as something it may follow. This weakness is typical for AI. A language model cannot reliably tell instructions from data. **Third**, the impact: the harm when it happens. Confidentiality, integrity or availability is lost, and the organisation pays for it. For HelpBot: order data of customers ends up with the attacker. With AI, the impact grows with what the system may do on its own: the more it can read, write or pay, the bigger the harm. These three have to meet. A threat without a vulnerability bounces off. A vulnerability that no threat can reach is a problem waiting to happen. In the course you will meet the same chain in every incident. The HelpBot example has a name, by the way: prompt injection. Text written by an attacker makes the model follow the attacker's instructions. The links to the NIST definitions of threat and vulnerability are under this slide.", "id": 4}, {"type": "figure", "route": 2, "title": "Risk = likelihood × impact", "svg": "<svg viewBox=\"0 0 1000 282\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Risk equals likelihood times impact. Two real incidents: a dealer chatbot that could only talk has low impact and lands on medium in the OWASP matrix; a coding agent that could change live data has high impact and lands in the top row\"><style>.fig rect.bx,rect.bx{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig rect.bxa,rect.bxa{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.fig rect.bxm,rect.bxm{fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}.fig rect.zn,rect.zn{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 6}.fig rect.zg,rect.zg{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 5}.fig rect.lane,rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}.fig text.t1,text.t1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.t2,text.t2{font-size:11.5px;fill:var(--muted)}.fig text.zl,text.zl{font-size:11px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.zgl,text.zgl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.fig text.al,text.al{font-size:11.5px;fill:var(--muted)}.fig text.ala,text.ala{font-size:11.5px;font-weight:700;fill:var(--accent)}.fig text.hd,text.hd{font-size:15px;font-weight:700;fill:var(--accent)}.fig text.nb,text.nb{font-size:12px;font-weight:700;fill:#fff}.fig text.cap,text.cap{font-size:12.5px;fill:var(--muted)}.ln{stroke:var(--muted);stroke-width:2;fill:none}.lna{stroke:var(--accent);stroke-width:2.6;fill:none}.lnb{stroke:var(--bad);stroke-width:2.4;fill:none;stroke-dasharray:6 5}.nbc{fill:var(--bad)}<\/style><defs><marker id=\"am\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><marker id=\"aa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"ab\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><style>.fig text.op,text.op{font-size:26px;font-weight:700;fill:var(--muted)}<\/style><g><rect class=\"bxa\" x=\"20\" y=\"24\" width=\"110\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"75.0\" y=\"59\" text-anchor=\"middle\">Risk<\/text><\/g><text class=\"op\" x=\"150\" y=\"60\" text-anchor=\"middle\">=<\/text><g data-hl=\"2\"><g><rect class=\"bx\" x=\"170\" y=\"24\" width=\"140\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"240.0\" y=\"59\" text-anchor=\"middle\">Likelihood<\/text><\/g><\/g><text class=\"op\" x=\"330\" y=\"60\" text-anchor=\"middle\">×<\/text><g data-hl=\"3\"><g><rect class=\"bx\" x=\"350\" y=\"24\" width=\"120\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"410.0\" y=\"59\" text-anchor=\"middle\">Impact<\/text><\/g><\/g><g data-step=\"2\"><text class=\"ala\" x=\"240\" y=\"106\" text-anchor=\"middle\">anyone can type anything: high<\/text><\/g><g data-step=\"3\" data-hl=\"3\"><g><rect class=\"bx\" x=\"60\" y=\"124\" width=\"410\" height=\"54\" rx=\"10\"/><text class=\"t1\" x=\"265.0\" y=\"148\" text-anchor=\"middle\">A dealer chatbot agrees to sell a car for 1 dollar<\/text><text class=\"t2\" x=\"265.0\" y=\"165\" text-anchor=\"middle\">it can only talk: low impact<\/text><\/g><circle class=\"nbc\" cx=\"60\" cy=\"124\" r=\"11\"/><text class=\"nb\" x=\"60\" y=\"128\" text-anchor=\"middle\">A<\/text><\/g><g data-step=\"3\" data-hl=\"3\"><g><rect class=\"bx\" x=\"60\" y=\"190\" width=\"410\" height=\"54\" rx=\"10\"/><text class=\"t1\" x=\"265.0\" y=\"214\" text-anchor=\"middle\">A coding agent deletes a production database<\/text><text class=\"t2\" x=\"265.0\" y=\"231\" text-anchor=\"middle\">it can change live data: high impact<\/text><\/g><circle class=\"nbc\" cx=\"60\" cy=\"190\" r=\"11\"/><text class=\"nb\" x=\"60\" y=\"194\" text-anchor=\"middle\">B<\/text><\/g><g data-step=\"4\"><text class=\"zgl\" x=\"770\" y=\"24\" text-anchor=\"middle\">LIKELIHOOD<\/text><text class=\"t2\" x=\"650\" y=\"46\" text-anchor=\"middle\">low<\/text><text class=\"t2\" x=\"770\" y=\"46\" text-anchor=\"middle\">medium<\/text><text class=\"t2\" x=\"890\" y=\"46\" text-anchor=\"middle\">high<\/text><text class=\"t2\" x=\"572\" y=\"88\" text-anchor=\"end\">impact high<\/text><g data-hl=\"4,5\"><g><rect class=\"bx\" x=\"595\" y=\"58\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"650.0\" y=\"86\" text-anchor=\"middle\">Medium<\/text><\/g><\/g><g data-hl=\"4,5\"><g><rect class=\"bx\" x=\"715\" y=\"58\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"770.0\" y=\"86\" text-anchor=\"middle\">High<\/text><\/g><\/g><g data-hl=\"4,5\"><g><rect class=\"bx\" x=\"835\" y=\"58\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"890.0\" y=\"86\" text-anchor=\"middle\">Critical<\/text><\/g><\/g><text class=\"t2\" x=\"572\" y=\"144\" text-anchor=\"end\">impact medium<\/text><g><g><rect class=\"bx\" x=\"595\" y=\"114\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"650.0\" y=\"142\" text-anchor=\"middle\">Low<\/text><\/g><\/g><g><g><rect class=\"bx\" x=\"715\" y=\"114\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"770.0\" y=\"142\" text-anchor=\"middle\">Medium<\/text><\/g><\/g><g><g><rect class=\"bx\" x=\"835\" y=\"114\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"890.0\" y=\"142\" text-anchor=\"middle\">High<\/text><\/g><\/g><text class=\"t2\" x=\"572\" y=\"200\" text-anchor=\"end\">impact low<\/text><g><g><rect class=\"bx\" x=\"595\" y=\"170\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"650.0\" y=\"198\" text-anchor=\"middle\">Note<\/text><\/g><\/g><g><g><rect class=\"bx\" x=\"715\" y=\"170\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"770.0\" y=\"198\" text-anchor=\"middle\">Low<\/text><\/g><\/g><g data-hl=\"4,5\"><g><rect class=\"bx\" x=\"835\" y=\"170\" width=\"110\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"890.0\" y=\"198\" text-anchor=\"middle\">Medium<\/text><\/g><\/g><circle class=\"nbc\" cx=\"595\" cy=\"58\" r=\"11\"/><text class=\"nb\" x=\"595\" y=\"62\" text-anchor=\"middle\">B<\/text><circle class=\"nbc\" cx=\"945\" cy=\"170\" r=\"11\"/><text class=\"nb\" x=\"945\" y=\"174\" text-anchor=\"middle\">A<\/text><text class=\"cap\" x=\"770\" y=\"250\" text-anchor=\"middle\">OWASP Risk Rating Methodology<\/text><\/g><g data-step=\"5\"><text class=\"hd\" x=\"265\" y=\"268\" text-anchor=\"middle\">a system that talks and a system that acts are not the same risk<\/text><\/g><\/svg>", "read": {"links": [{"url": "https://community.owasp.org/OWASP_Risk_Rating_Methodology", "label": "OWASP · Risk Rating Methodology", "kind": "Method description", "info": "A step-by-step method to estimate a risk: first the factors that decide likelihood, then the factors that decide impact, then a matrix that combines them.", "where": "\"Step 2\" lists the likelihood factors, \"Step 3\" the impact factors. The matrix on this slide is in \"Step 4: Determining Severity of the Risk\"."}, {"url": "https://www.theautopian.com/chevy-dealers-ai-chatbot-allegedly-recommended-fords-gave-free-access-to-chatgpt/", "label": "The Autopian · the chatbot and the 1-dollar car", "kind": "News article, December 2023", "info": "Reports how visitors got the chatbot on the web site of a Chevrolet dealer in California to say things it should not, among them agreeing to sell a new car for one dollar. The chatbot came from an outside supplier and was taken offline afterwards.", "where": "The screenshots in the article show the conversations."}, {"url": "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident", "label": "The Register · the agent that deleted a database", "kind": "News article, July 2025", "info": "Reports how the AI coding agent of Replit deleted the production database of a user who had told it not to change anything, and then gave wrong information about what it had done.", "where": "Read how the user describes the freeze and what the agent answered afterwards."}]}, "steps": [{"script": "Where are we? You know what we protect: confidentiality, integrity and availability. And you know how it goes wrong: a threat meets a vulnerability and causes impact. Third question: how bad is it? That is what the word risk is for. A risk is an estimate: how much harm do you expect when one threat meets one vulnerability? The formula is short: risk is likelihood times impact.", "cues": [1.24, 6.56, 12.17, 14.83, 17.27, 23.63]}, {"script": "Likelihood asks: how probable is it that this goes wrong? Take an AI system that reads text from outside, such as a chatbot on a public web site. Anyone can type anything into it, as often as they like. It takes no special skill, only words. So the likelihood that someone talks it into something is high.", "cues": [4.28, 9.93, 13.47, 16.23]}, {"script": "Impact asks: how much harm follows? Here are two real incidents, and you will meet both in the course. In December 2023, a visitor talked the chatbot of a car dealer into agreeing to sell a new car for one dollar. Embarrassing, but that chatbot could only talk, and no car was sold. In July 2025, an AI coding agent deleted the production database of its user, during a freeze in which nothing was to be changed. That agent could act: it had access to live data.", "cues": [3.34, 7.54, 15.23, 20.31, 29.59]}, {"script": "Now put likelihood and impact together in a matrix. This one comes from the Risk Rating Methodology of OWASP, an open community that publishes security guidance. The word in each cell is the severity: the level of the risk. Place the two incidents. The chatbot, letter A: high likelihood, low impact. That gives medium. The agent, letter B: high impact. Whatever the likelihood, you are in the top row: medium, high or critical. The links to the method and to both incidents are under this slide.", "cues": [3.66, 10.78, 15.11, 16.94, 21.11, 22.7, 26.02, 31.01]}, {"script": "That is the lesson for AI systems. A system that talks and a system that acts are not the same risk. What the system is allowed to do decides how big the risk is. In the course you use this reasoning to put the OWASP risks in order for your own system.", "cues": [2.67, 7.42, 11.4]}], "script": "Where are we? You know what we protect: confidentiality, integrity and availability. And you know how it goes wrong: a threat meets a vulnerability and causes impact. Third question: how bad is it? That is what the word risk is for. A risk is an estimate: how much harm do you expect when one threat meets one vulnerability? The formula is short: risk is likelihood times impact. Likelihood asks: how probable is it that this goes wrong? Take an AI system that reads text from outside, such as a chatbot on a public web site. Anyone can type anything into it, as often as they like. It takes no special skill, only words. So the likelihood that someone talks it into something is high. Impact asks: how much harm follows? Here are two real incidents, and you will meet both in the course. In December 2023, a visitor talked the chatbot of a car dealer into agreeing to sell a new car for one dollar. Embarrassing, but that chatbot could only talk, and no car was sold. In July 2025, an AI coding agent deleted the production database of its user, during a freeze in which nothing was to be changed. That agent could act: it had access to live data. Now put likelihood and impact together in a matrix. This one comes from the Risk Rating Methodology of OWASP, an open community that publishes security guidance. The word in each cell is the severity: the level of the risk. Place the two incidents. The chatbot, letter A: high likelihood, low impact. That gives medium. The agent, letter B: high impact. Whatever the likelihood, you are in the top row: medium, high or critical. The links to the method and to both incidents are under this slide. That is the lesson for AI systems. A system that talks and a system that acts are not the same risk. What the system is allowed to do decides how big the risk is. In the course you use this reasoning to put the OWASP risks in order for your own system.", "id": 5}, {"type": "concepts", "cols": 4, "route": 3, "title": "Countermeasures: lower the likelihood, the impact, or both", "svg": "<svg viewBox=\"0 0 1000 276\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"HelpBot with its countermeasures in place: a guardrail between the customer and the model, least privilege on the connection to the order system, a staff member who approves every refund, logging around everything, and the residual risk that remains\"><style>.fig rect.bx,rect.bx{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig rect.bxa,rect.bxa{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.fig rect.bxm,rect.bxm{fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}.fig rect.zn,rect.zn{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 6}.fig rect.zg,rect.zg{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 5}.fig rect.lane,rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}.fig text.t1,text.t1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.t2,text.t2{font-size:11.5px;fill:var(--muted)}.fig text.zl,text.zl{font-size:11px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.zgl,text.zgl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.fig text.al,text.al{font-size:11.5px;fill:var(--muted)}.fig text.ala,text.ala{font-size:11.5px;font-weight:700;fill:var(--accent)}.fig text.hd,text.hd{font-size:15px;font-weight:700;fill:var(--accent)}.fig text.nb,text.nb{font-size:12px;font-weight:700;fill:#fff}.fig text.cap,text.cap{font-size:12.5px;fill:var(--muted)}.ln{stroke:var(--muted);stroke-width:2;fill:none}.lna{stroke:var(--accent);stroke-width:2.6;fill:none}.lnb{stroke:var(--bad);stroke-width:2.4;fill:none;stroke-dasharray:6 5}.nbc{fill:var(--bad)}<\/style><defs><marker id=\"am\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><marker id=\"aa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"ab\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><g data-step=\"4\" data-hl=\"4\"><rect class=\"zg\" x=\"180\" y=\"30\" width=\"720\" height=\"196\" rx=\"14\"/><text class=\"zgl\" x=\"192\" y=\"47\">LOGGING: EVERY PROMPT AND EVERY TOOL CALL<\/text><\/g><g><rect class=\"bx\" x=\"20\" y=\"96\" width=\"130\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"85.0\" y=\"123\" text-anchor=\"middle\">Customer<\/text><text class=\"t2\" x=\"85.0\" y=\"140\" text-anchor=\"middle\">chat window<\/text><\/g><line class=\"lna\" x1=\"153\" y1=\"126\" x2=\"356\" y2=\"126\" marker-end=\"url(#aa)\" marker-start=\"url(#aa)\"/><g><rect class=\"bxa\" x=\"360\" y=\"86\" width=\"210\" height=\"80\" rx=\"10\"/><text class=\"t1\" x=\"465.0\" y=\"123\" text-anchor=\"middle\">HelpBot and its model<\/text><text class=\"t2\" x=\"465.0\" y=\"140\" text-anchor=\"middle\">follows text: the weakness stays<\/text><\/g><line class=\"ln\" x1=\"574\" y1=\"126\" x2=\"716\" y2=\"126\" marker-end=\"url(#am)\" marker-start=\"url(#am)\"/><g><rect class=\"bx\" x=\"720\" y=\"96\" width=\"160\" height=\"60\" rx=\"10\"/><text class=\"t1\" x=\"800.0\" y=\"123\" text-anchor=\"middle\">Order system<\/text><text class=\"t2\" x=\"800.0\" y=\"140\" text-anchor=\"middle\">orders, refunds<\/text><\/g><g data-hl=\"3\"><g><rect class=\"bx\" x=\"720\" y=\"170\" width=\"160\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"800.0\" y=\"198\" text-anchor=\"middle\">Staff member<\/text><\/g><line class=\"ln\" x1=\"800\" y1=\"168\" x2=\"800\" y2=\"160\" marker-end=\"url(#am)\"/><\/g><g data-step=\"2\"><rect x=\"171.5\" y=\"101\" width=\"167\" height=\"18\" rx=\"9\" style=\"fill:var(--accent)\"/><text x=\"255\" y=\"114\" text-anchor=\"middle\" style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;fill:#fff\">GUARDRAIL: IN AND OUT<\/text><\/g><g data-step=\"3\"><rect x=\"583.0\" y=\"101\" width=\"124\" height=\"18\" rx=\"9\" style=\"fill:var(--accent)\"/><text x=\"645\" y=\"114\" text-anchor=\"middle\" style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;fill:#fff\">LEAST PRIVILEGE<\/text><rect x=\"716.5\" y=\"219\" width=\"167\" height=\"18\" rx=\"9\" style=\"fill:var(--accent)\"/><text x=\"800\" y=\"232\" text-anchor=\"middle\" style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;fill:#fff\">APPROVES EVERY REFUND<\/text><\/g><g data-step=\"5\" data-hl=\"5\"><g><rect class=\"bxm\" x=\"360\" y=\"186\" width=\"210\" height=\"46\" rx=\"10\"/><text class=\"t1\" x=\"465.0\" y=\"206\" text-anchor=\"middle\">Residual risk<\/text><text class=\"t2\" x=\"465.0\" y=\"223\" text-anchor=\"middle\">accepted knowingly<\/text><\/g><\/g><g data-step=\"6\"><text class=\"hd\" x=\"500\" y=\"262\" text-anchor=\"middle\">several layers: no single countermeasure stops everything<\/text><\/g><\/svg>", "cards": [{"k": "Lower the likelihood", "t": "close or shield the weakness"}, {"k": "Lower the impact", "t": "limit what can be lost"}, {"k": "Detect and respond", "t": "notice an attack, limit the harm"}, {"k": "Residual risk", "t": "what remains, accepted knowingly"}], "read": {"links": [{"url": "https://csrc.nist.gov/glossary/term/countermeasures", "label": "NIST · countermeasures", "kind": "Glossary entry", "info": "The reference definition of the term from NIST, the American standards institute, with the standards it comes from.", "where": "Read the first definition; safeguards and security controls are listed as related words."}]}, "steps": [{"script": "So far you can say what is protected, what can go wrong and how big the risk is. Fourth question: what do we do about it? The word is countermeasure: an action, a device, a procedure or a technique that makes a system less vulnerable. In the course you will mostly hear two other words for it: mitigation and control. They mean the same. Under the cards you see HelpBot again. Each countermeasure gets its place on it.", "cues": [5.97, 9.07, 16.96, 22.39, 23.75, 26.2]}, {"script": "**The first card**: lower the likelihood. In classic security you repair the weakness itself: you install the update, and the hole is closed. With AI that does not work. The weakness, a model that follows the text it reads, stays. What you can do is put a guardrail in front of the model and behind it: a filter that checks what goes in and what comes out. It stops a lot, but not everything.", "card": 0, "cues": [3.14, 9.77, 12.44, 16.97, 24.66]}, {"script": "**Next to it**: lower the impact. Because the weakness stays, this card does most of the work in an AI system. HelpBot may only read the orders of the customer in the chat: that is least privilege. And a staff member approves every refund. Then a successful attack reaches far less.", "card": 1, "cues": [2.69, 7.84, 13.15, 16.0]}, {"script": "**The third card**: detect and respond. Not every countermeasure prevents. Some notice an attack and limit the harm. Here: log every prompt and every tool call, and raise an alert when HelpBot suddenly asks for many orders.", "card": 2, "cues": [3.07, 5.47, 8.41]}, {"script": "**One card is left**: residual risk. That is what remains after the countermeasures. With a model that follows text, it is never zero. So someone has to accept it knowingly.", "card": 3, "cues": [3.2, 6.27, 9.67]}, {"script": "Good designs combine all of this, in several layers. Remember that for the course. For prompt injection you will hear that no single countermeasure stops it. So you will learn to stack several, and to limit what a successful attack can reach. The link to the NIST definition of a countermeasure is under this slide.", "cues": [3.68, 5.5, 9.75, 14.96]}], "script": "So far you can say what is protected, what can go wrong and how big the risk is. Fourth question: what do we do about it? The word is countermeasure: an action, a device, a procedure or a technique that makes a system less vulnerable. In the course you will mostly hear two other words for it: mitigation and control. They mean the same. Under the cards you see HelpBot again. Each countermeasure gets its place on it. **The first card**: lower the likelihood. In classic security you repair the weakness itself: you install the update, and the hole is closed. With AI that does not work. The weakness, a model that follows the text it reads, stays. What you can do is put a guardrail in front of the model and behind it: a filter that checks what goes in and what comes out. It stops a lot, but not everything. **Next to it**: lower the impact. Because the weakness stays, this card does most of the work in an AI system. HelpBot may only read the orders of the customer in the chat: that is least privilege. And a staff member approves every refund. Then a successful attack reaches far less. **The third card**: detect and respond. Not every countermeasure prevents. Some notice an attack and limit the harm. Here: log every prompt and every tool call, and raise an alert when HelpBot suddenly asks for many orders. **One card is left**: residual risk. That is what remains after the countermeasures. With a model that follows text, it is never zero. So someone has to accept it knowingly. Good designs combine all of this, in several layers. Remember that for the course. For prompt injection you will hear that no single countermeasure stops it. So you will learn to stack several, and to limit what a successful attack can reach. The link to the NIST definition of a countermeasure is under this slide.", "id": 6}, {"type": "reveal", "chip": "Think-along exercise", "title": "Four statements about HelpBot: which word fits?", "question": "A: a competitor wants to get hold of the customer list of the web shop. B: the key for the order system is written in HelpBot's system prompt. C: a staff member has to approve every refund above fifty euro. D: it is fairly easy to trick HelpBot into revealing its system prompt, and the key in it opens all order data. For each statement: is it a threat, a vulnerability, a risk or a countermeasure?", "verdict": "A is a threat, B is a vulnerability, C is a countermeasure, D describes a risk", "answer": [{"k": "A · threat", "t": "someone with a motive who could cause harm; it exists whatever you build."}, {"k": "B · vulnerability", "t": "a weakness in how the system is set up: a secret where the model, and so an attacker, can reach it."}, {"k": "C · countermeasure", "t": "it lowers the impact of a wrong or manipulated refund."}, {"k": "D · risk", "t": "likelihood, fairly easy, combined with impact, all order data: high."}], "script": "Try it on four statements about HelpBot. A: a competitor wants to get hold of the customer list of the web shop. B: the key for the order system is written in HelpBot's system prompt. C: a staff member has to approve every refund above fifty euro. D: it is fairly easy to trick HelpBot into revealing its system prompt, and the key in it opens all order data. For each statement: is it a threat, a vulnerability, a risk or a countermeasure? Pause the audio and decide. … A is a threat: someone with a motive who could cause harm. It exists whatever you build. B is a vulnerability: a weakness in how the system is set up. A secret sits where the model, and so an attacker, can reach it. C is a countermeasure: it lowers the impact of a wrong or manipulated refund. And D describes a risk. You hear both parts of the formula: the likelihood, fairly easy, combined with the impact, all order data. Together that is high. Notice that B and D are about the same key. The vulnerability is the fact. The risk is your judgement of how likely and how bad.", "id": 7, "cues": [2.8, 7.59, 12.64, 17.87, 25.93, 31.86, 34.75, 36.31, 39.14, 41.27, 46.0, 50.07, 55.55, 57.94, 65.37, 67.35, 70.76, 72.9]}, {"type": "figure", "route": 4, "title": "One real incident, in your five words", "svg": "<svg viewBox=\"0 0 1000 316\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A real incident from July 2025 taken apart in five words: threat, vulnerability, impact, risk and countermeasure\"><style>.fig rect.bx,rect.bx{fill:var(--card-bg);stroke:var(--text);stroke-width:2}.fig rect.bxa,rect.bxa{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}.fig rect.bxm,rect.bxm{fill:var(--card-bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}.fig rect.zn,rect.zn{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 6}.fig rect.zg,rect.zg{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 5}.fig rect.lane,rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}.fig text.t1,text.t1{font-size:14px;font-weight:700;fill:var(--text)}.fig text.t2,text.t2{font-size:11.5px;fill:var(--muted)}.fig text.zl,text.zl{font-size:11px;font-weight:700;fill:var(--accent);letter-spacing:.05em}.fig text.zgl,text.zgl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.05em}.fig text.al,text.al{font-size:11.5px;fill:var(--muted)}.fig text.ala,text.ala{font-size:11.5px;font-weight:700;fill:var(--accent)}.fig text.hd,text.hd{font-size:15px;font-weight:700;fill:var(--accent)}.fig text.nb,text.nb{font-size:12px;font-weight:700;fill:#fff}.fig text.cap,text.cap{font-size:12.5px;fill:var(--muted)}.ln{stroke:var(--muted);stroke-width:2;fill:none}.lna{stroke:var(--accent);stroke-width:2.6;fill:none}.lnb{stroke:var(--bad);stroke-width:2.4;fill:none;stroke-dasharray:6 5}.nbc{fill:var(--bad)}<\/style><defs><marker id=\"am\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/><\/marker><marker id=\"aa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--accent)\"/><\/marker><marker id=\"ab\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--bad)\"/><\/marker><\/defs><g><rect class=\"bxa\" x=\"20\" y=\"16\" width=\"960\" height=\"56\" rx=\"10\"/><text class=\"t1\" x=\"500.0\" y=\"41\" text-anchor=\"middle\">July 2025: during a freeze, an AI coding agent deletes the production database of its user<\/text><text class=\"t2\" x=\"500.0\" y=\"58\" text-anchor=\"middle\">the records of more than a thousand business contacts<\/text><\/g><g data-step=\"2\" data-hl=\"2\"><g><rect class=\"bx\" x=\"20\" y=\"88\" width=\"190\" height=\"36\" rx=\"10\"/><text class=\"t1\" x=\"115.0\" y=\"111\" text-anchor=\"middle\">Threat<\/text><\/g><text class=\"cap\" x=\"232\" y=\"111\" text-anchor=\"start\">no attacker: a mistake of the agent itself<\/text><\/g><g data-step=\"3\" data-hl=\"3\"><g><rect class=\"bx\" x=\"20\" y=\"132\" width=\"190\" height=\"36\" rx=\"10\"/><text class=\"t1\" x=\"115.0\" y=\"155\" text-anchor=\"middle\">Vulnerability<\/text><\/g><text class=\"cap\" x=\"232\" y=\"155\" text-anchor=\"start\">the agent could change live data, without separation or approval<\/text><\/g><g data-step=\"4\" data-hl=\"4\"><g><rect class=\"bx\" x=\"20\" y=\"176\" width=\"190\" height=\"36\" rx=\"10\"/><text class=\"t1\" x=\"115.0\" y=\"199\" text-anchor=\"middle\">Impact<\/text><\/g><text class=\"cap\" x=\"232\" y=\"199\" text-anchor=\"start\">integrity and availability: the live data was gone until it was restored<\/text><\/g><g data-step=\"5\" data-hl=\"5\"><g><rect class=\"bx\" x=\"20\" y=\"220\" width=\"190\" height=\"36\" rx=\"10\"/><text class=\"t1\" x=\"115.0\" y=\"243\" text-anchor=\"middle\">Risk<\/text><\/g><text class=\"cap\" x=\"232\" y=\"243\" text-anchor=\"start\">likelihood of a mistake × all live data = high<\/text><\/g><g data-step=\"6\" data-hl=\"6\"><g><rect class=\"bx\" x=\"20\" y=\"264\" width=\"190\" height=\"36\" rx=\"10\"/><text class=\"t1\" x=\"115.0\" y=\"287\" text-anchor=\"middle\">Countermeasure<\/text><\/g><text class=\"cap\" x=\"232\" y=\"287\" text-anchor=\"start\">separate development from production; a mode in which the agent only plans<\/text><\/g><\/svg>", "read": {"links": [{"url": "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident", "label": "The Register · the agent that deleted a database", "kind": "News article, July 2025", "info": "Reports how the AI coding agent of Replit deleted the production database of a user who had told it not to change anything, and then gave wrong information about what it had done.", "where": "Read how the user describes the freeze and what the agent answered afterwards."}]}, "steps": [{"script": "Last part: where will you use these words in the course? Let us try them on a real incident, one that you will study there. It is the coding agent from a moment ago. July 2025. The founder of a software community builds an application with an AI coding agent. He declares a freeze: nothing may be changed. The agent deletes the production database anyway, with the records of more than a thousand business contacts. Now use your five words.", "cues": [3.92, 7.81, 10.53, 12.78, 18.02, 21.71, 28.27]}, {"script": "**The threat.** There was no attacker. The agent made a mistake by itself. Remember: a threat is anything that could cause harm, and that includes an error.", "cues": [1.17, 2.79, 5.28]}, {"script": "**The vulnerability.** The agent could change live data directly. Nothing separated the test environment from production, and nothing asked for approval before a destructive action.", "cues": [1.51, 4.46]}, {"script": "**The impact.** Integrity and availability. The live data was gone, and the application could not do its work until the data was restored.", "cues": [1.25, 3.67]}, {"script": "**The risk.** Likelihood: an agent that works for days will make a mistake at some point. Impact: all live data. Together, that is a high risk.", "cues": [1.06, 6.32, 8.89]}, {"script": "**The countermeasures.** The supplier announced them afterwards: a separation between development and production, and a mode in which the agent only plans. Both lower the impact. In the course you will take incidents apart in exactly this way. You will meet the same words in the OWASP lists, where you rank risks, and in threat modeling, where you look for threats on a diagram. The link to a report on this incident is under this slide.", "cues": [1.49, 9.85, 11.69, 15.56, 22.8]}], "script": "Last part: where will you use these words in the course? Let us try them on a real incident, one that you will study there. It is the coding agent from a moment ago. July 2025. The founder of a software community builds an application with an AI coding agent. He declares a freeze: nothing may be changed. The agent deletes the production database anyway, with the records of more than a thousand business contacts. Now use your five words. **The threat.** There was no attacker. The agent made a mistake by itself. Remember: a threat is anything that could cause harm, and that includes an error. **The vulnerability.** The agent could change live data directly. Nothing separated the test environment from production, and nothing asked for approval before a destructive action. **The impact.** Integrity and availability. The live data was gone, and the application could not do its work until the data was restored. **The risk.** Likelihood: an agent that works for days will make a mistake at some point. Impact: all live data. Together, that is a high risk. **The countermeasures.** The supplier announced them afterwards: a separation between development and production, and a mode in which the agent only plans. Both lower the impact. In the course you will take incidents apart in exactly this way. You will meet the same words in the OWASP lists, where you rank risks, and in threat modeling, where you look for threats on a diagram. The link to a report on this incident is under this slide.", "id": 8}, {"type": "summary", "chip": "Summary", "title": "What you take to the course", "key": "A threat uses a vulnerability and causes impact on confidentiality, integrity or availability. Risk is your judgement of that: likelihood times impact. A countermeasure lowers one of the two, and what remains is residual risk.", "bullets": [{"k": "Three properties", "t": "confidentiality, integrity, availability: what was lost?"}, {"k": "Threat", "t": "what could cause harm; it comes from outside your design."}, {"k": "Vulnerability", "t": "the weakness that a threat can use; it sits in what you built."}, {"k": "Risk", "t": "likelihood times impact; easy to exploit is not yet a high risk."}, {"k": "Countermeasure", "t": "lowers the likelihood or the impact; also called control or mitigation."}], "script": "Back to the meeting about HelpBot. Who was right? All three, a little, and that was the problem. Prompt injection is a kind of attack: an attacker who tries it is the threat. That HelpBot follows instructions in the text it reads is the vulnerability. And the risk is the judgement nobody had made yet: how likely is it here, and what can be lost? Once you say it that way, the meeting can move on to countermeasures. So, in one sentence: a threat uses a vulnerability and causes impact on confidentiality, integrity or availability. Risk is your judgement of that: likelihood times impact. A countermeasure lowers one of the two, and what remains is residual risk. The five lines on this slide repeat the words. Read them at your own pace: I will not read them aloud. Before the course, take the ten questions. Then continue with the module on the attack surface.", "id": 9, "cues": [2.15, 3.4, 7.06, 12.33, 16.72, 23.15, 27.34, 35.27, 39.45, 44.38, 47.18, 50.44, 53.07]}], "quiz": [{"q": "Through an error in a support assistant, customers can read the order history of other customers. Which property is harmed first?", "options": ["Availability, because the order history is used too often.", "Integrity, because the order history is no longer correct.", "Confidentiality, because people see data they may not.", "None of the three, because no attacker was involved."], "answer": 2, "feedback": ["The data is still available; the problem is who can see it.", "Nothing was changed in the data; it was shown to the wrong people.", "Correct. Confidentiality means that only those who are allowed can see the information.", "The three properties can be harmed by a mistake as well as by an attacker."]}, {"q": "Someone quietly changes a document in the knowledge base, so that an assistant now gives customers a wrong refund amount. Which property is harmed?", "options": ["Integrity: information was changed without permission.", "Confidentiality: the refund amount has become public.", "Availability: the right document can no longer be found.", "Likelihood: the chance of a wrong answer has gone up."], "answer": 0, "feedback": ["Correct. Integrity means that information is correct and was not changed without permission.", "Nothing secret was revealed; something correct was made incorrect.", "The system still answers; it answers wrongly.", "Likelihood is a part of risk, not one of the three properties."]}, {"q": "An agent ends up in an endless loop of tool calls. The monthly budget for the model is used up in one night and the service stops. Which property is harmed?", "options": ["Confidentiality, because the tool calls expose data.", "Integrity, because the agent took wrong decisions.", "None, because cost is a matter for the finance team.", "Availability, because the service has stopped."], "answer": 3, "feedback": ["Nothing in the description says that data was exposed.", "The decisions may be poor, but the harm described is that the service stops.", "Running out of budget stops the service for its users, which makes it a security matter.", "Correct. Availability means the system is there when you need it."]}, {"q": "\"The password for the database is written in the system prompt of the assistant.\" What is this?", "options": ["A threat.", "A vulnerability.", "A countermeasure.", "An impact."], "answer": 1, "feedback": ["A threat is who or what could cause harm; this is a weakness in the setup.", "Correct. It is a weakness in how the system is set up, which a threat can use.", "A countermeasure reduces risk; this increases it.", "Impact is the harm after something happens; this describes the weakness before it."]}, {"q": "\"A criminal group sends emails with hidden instructions to companies that use an AI mail assistant.\" What is this?", "options": ["A vulnerability.", "A residual risk.", "A threat.", "A countermeasure."], "answer": 2, "feedback": ["A vulnerability is a weakness in your own system; this describes someone outside it.", "Residual risk is what remains after countermeasures.", "Correct. A threat is anything that could cause harm, here an attacker with a method.", "A countermeasure makes a system less vulnerable; this is the opposite side."]}, {"q": "How is risk expressed in the OWASP Risk Rating Methodology?", "options": ["Risk = likelihood × impact.", "Risk = threat + countermeasure.", "Risk = vulnerability − control.", "Risk = impact ÷ availability."], "answer": 0, "feedback": ["Correct. How probable is it, and how much harm follows?", "A countermeasure lowers risk; it is not added to it.", "This is not how the method expresses it; likelihood and impact are both needed.", "Availability is one of the three properties, not a part of the formula."]}, {"q": "A weakness is very easy to exploit, but the only thing an attacker can reach through it is the public text of the website. What can you say about the risk?", "options": ["It is critical, because easy exploitation always means critical risk.", "It is zero, because the public text of a website has no value.", "It cannot be judged until an attacker has really used the weakness.", "It is limited: the likelihood is high, but the impact is low."], "answer": 3, "feedback": ["Likelihood is only half of the formula; the impact here is low.", "Low impact is     const sp=c.querySelector('.sn-prev'), sn=c.querySelector('.sn-next'), sl=c.querySelector('.sn-lbl'); if(sp){ sp.disabled=st===0; sn.disabled=st===STEPS.length-1; sl.textContent=(U.step_of||'Step {n} of {total}').replace('{n}',st+1).replace('{total}',STEPS.length); } }

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }

      const sp=$('slidecard').querySelector('.sn-prev'), sn=$('slidecard').querySelector('.sn-next'); if(sp){ sp.addEventListener('click',()=>setStep(st-1,true)); sn.addEventListener('click',()=>setStep(st+1,true)); }

    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';

    $('btn-quiz-start').classList.add('hidden');
    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    if(q.context){ $('q-ctx').innerHTML = (U.q_ctx_label?'<span class="ctx-k">'+esc(U.q_ctx_label)+'</span>':'')+esc(q.context); $('q-ctx').classList.remove('hidden'); } else { $('q-ctx').classList.add('hidden'); $('q-ctx').innerHTML=''; }
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n])
      + (q.key?'<div class="fb-key"><b>'+esc(U.q_key_label||'À retenir')+' —</b>'+esc(q.key)+'</div>':'')
      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
<script>
/* layout-fix v1 js: tekst in tekeningen (svg) die uit zijn vak of uit de tekening valt, krimpt tot hij past (breed lettertype, andere taal) */
(function(){
  function boxOf(t,bb){var g=t.parentNode,best=null,tx=bb.x+bb.width/2,ty=bb.y+bb.height/2;
    [].forEach.call(g.children,function(rc){var n=rc.tagName.toLowerCase();if(n!=='rect')return;var x=+rc.getAttribute('x'),y=+rc.getAttribute('y'),w=+rc.getAttribute('width'),h=+rc.getAttribute('height');if(isNaN(x)||isNaN(w)||h>100||w>520)return;
      if(tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h&&(!best||w*h<best.w*best.h))best={x:x,y:y,w:w,h:h};});return best;}
  function fit(root){
    [].forEach.call(root.querySelectorAll('svg'),function(sv){var vb=sv.viewBox&&sv.viewBox.baseVal;
      [].forEach.call(sv.querySelectorAll('text'),function(t){if(/rotate/.test(t.getAttribute('transform')||''))return;var off=0,n=0,fs0=parseFloat(getComputedStyle(t).fontSize)||12,fs=fs0;
        function over(){try{var bb=t.getBBox();bb={x:bb.x+off,y:bb.y,width:bb.width,height:bb.height};if(vb&&vb.width&&(bb.x<vb.x-1||bb.x+bb.width>vb.x+vb.width+1))return true;var b=boxOf(t,bb);return !!b&&(bb.x<b.x-1||bb.x+bb.width>b.x+b.w+1);}catch(e){return false;}}
        try{var b0=t.getBBox();if(vb&&vb.width){var dx=0;if(b0.x<vb.x-1)dx=vb.x-b0.x+2;else if(b0.x+b0.width>vb.x+vb.width+1)dx=vb.x+vb.width-(b0.x+b0.width)-2;if(dx&&Math.abs(dx)<=40){t.setAttribute('transform',(t.getAttribute('transform')||'')+' translate('+dx+' 0)');off=dx;}}}catch(e){}
        while(over()&&n++<14&&fs>fs0*0.72){fs*=0.94;t.style.fontSize=fs+'px';}});});
  }
  function start(){var c=document.getElementById('slidecard');if(!c)return;fit(c);new MutationObserver(function(){fit(c);}).observe(c,{childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
