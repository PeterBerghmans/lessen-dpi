les exercices", "question_of": "Question {n} sur {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Question suivante", "show_result": "Voir votre résultat", "result_title": "Votre résultat", "result_text": "Vous avez répondu correctement à {score} questions sur {total}.", "result_good": "Très bien. Vous maîtrisez l'essentiel de ce module.", "result_mid": "Bonne progression. Relisez le retour des questions manquées et réessayez.", "result_low": "Revoyez la présentation, puis réessayez. Le retour sur chaque question vous aidera.", "retry": "Recommencer les exercices", "review": "Revoir la présentation", "your_answer": "Votre réponse", "open_link": "Ouvrir le lien dans un nouvel onglet", "practice_hint": "Exercice pratique : mettez en pause, suivez les étapes, puis cliquez sur Suivant.", "back_to_slides": "Retour aux diapositives", "resume_quiz": "Reprendre les exercices", "download_pdf": "Télécharger votre résultat en PDF", "pdf_title": "Résultat des exercices", "pdf_question": "Question", "pdf_your": "Votre réponse", "pdf_correct": "Réponse correcte", "pdf_feedback": "Retour", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "sans réponse", "transcript": "Texte parlé", "show_text": "Afficher le texte", "hide_text": "Masquer le texte", "ai_notice_title": "Transparence sur l'IA", "ai_notice": "La voix de ce module a été générée par IA à partir de la voix de Peter Berghmans, avec son consentement. Le texte et les diapositives ont été réalisés avec l'aide de l'IA et relus sur le fond par le formateur.", "ai_voice_label": "Voix IA", "ai_icon_alt": "Label officiel de l'UE : contenu généré par IA", "ai_footer": "Voix générée par IA (avec l'accord de l'orateur) ; texte et diapositives réalisés avec l'aide de l'IA et relus par l'enseignant.", "skip_to_quiz": "Aller directement aux exercices", "nav_home": "Accueil", "nav_slides": "Présentation", "nav_quiz": "Exercices", "speed": "Vitesse", "reveal_question": "Qu'en pensez-vous ?", "reveal_show": "Afficher la réponse", "optional_label": "Approfondissement (facultatif)", "optional_skip": "Passer l'approfondissement", "optional_intro": "Les diapositives suivantes sont un approfondissement facultatif. Vous pouvez les passer et aller directement aux exercices.", "autoplay_short": "Auto", "read_label": "Ouvrir le RGPD sur EUR-Lex", "deep_label": "Approfondissement", "deep_btn": "Ouvrir l'approfondissement"}, "slides": [{"id": 1, "type": "title", "title": "Les obligations du responsable du traitement et du sous-traitant : sécurité, conception et violations", "subtitle": "Chapitre IV du RGPD : comment les obligations sont réparties, à qui elles s'appliquent, et ce que les mesures techniques et organisationnelles recouvrent concrètement", "script": "Une ville fait construire par un fournisseur une plateforme où les parents inscrivent leur enfant dans une école. Un jour, il apparaît que les listes de noms et de numéros de registre national sont téléchargeables sans mot de passe. Qui aurait dû l'empêcher : la ville qui a commandé la plateforme, ou le fournisseur qui l'a construite ? Et qui doit maintenant, dans les 72 heures, avertir l'autorité de contrôle ? Le règlement répond aux deux questions, et la réponse diffère selon l'obligation. C'est le sujet de ce module : le chapitre sur les obligations du responsable du traitement et du sous-traitant. Nous commençons par les quatre groupes d'obligations et par la question à poser à chaque article : pour qui est-il écrit ? Ensuite, nous développons le premier groupe, les mesures techniques et organisationnelles : la politique, le registre, la protection des données dès la conception et par défaut, la sécurité, et la notification d'une violation. À la sécurité, deux brefs approfondissements sont accessibles d'un clic."}, {"id": 2, "type": "table", "chip": "La vue d'ensemble", "title": "Chapitre IV : quatre groupes d'obligations", "head": ["Groupe", "Sur quoi", "Articles"], "rows": [["1 · Mesures techniques et organisationnelles", "politique de protection des données, privacy by design et by default, registre des activités de traitement, sécurité technique et organisationnelle, notification des violations", "24, 25, 30, 32, 33, 34"], ["2 · Collaboration avec d'autres parties", "responsables conjoints du traitement, le sous-traitant et le contrat de sous-traitance, traitement sous l'autorité, coopération avec l'autorité de contrôle", "26, 28, 29, 31"], ["3 · Traitements à haut risque", "analyse d'impact relative à la protection des données et consultation préalable", "35, 36"], ["4 · Le délégué à la protection des données", "désignation, fonction et missions du DPO", "37, 38, 39"]], "hl": [0], "read": {"text": "Regardez la structure du chapitre IV dans le règlement : section 1 obligations générales, section 2 sécurité, section 3 analyse d'impact, section 4 délégué.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "D'abord la vue d'ensemble. Le chapitre sur les obligations est long, et c'est pourquoi nous le divisons en quatre groupes. Regardez le tableau. Le premier groupe contient les mesures techniques et organisationnelles garantissant la protection des données : la politique de protection des données, privacy by design et by default, le registre des activités de traitement, la sécurité technique et organisationnelle, et la notification d'une violation à l'autorité de contrôle et aux personnes concernées. Le deuxième groupe, traité dans un module suivant, concerne la collaboration avec d'autres parties : les responsables conjoints du traitement, le sous-traitant et le contrat de sous-traitance, le traitement sous l'autorité, et la coopération avec l'autorité de contrôle. Le troisième groupe ne s'applique qu'en cas de haut risque : l'analyse d'impact et la consultation préalable. Le quatrième concerne le délégué à la protection des données : désignation, fonction et missions. Ce module développe donc le premier groupe."}, {"id": 3, "type": "quote", "chip": "Le lien avec les principes", "title": "Chaque obligation de ce chapitre concrétise la responsabilité (accountability)", "source": "Article 5, paragraphe 2 du RGPD", "quote": "Le responsable du traitement est responsable du respect du paragraphe 1 et est en mesure de démontrer que celui-ci est respecté (responsabilité).", "bullets": [{"k": "Deux verbes", "t": "être responsable du respect et être en mesure de démontrer ce respect ; le chapitre IV dit comment vous le faites : avec des mesures, des documents, des procédures et un délégué."}, {"k": "Le schéma", "t": "presque chaque obligation a la même construction : prenez des mesures appropriées, compte tenu du risque, et soyez en mesure de démontrer que vous l'avez fait."}, {"k": "Pourquoi cela compte", "t": "en cas de plainte ou de violation, l'autorité de contrôle ne demande pas seulement ce qui s'est passé, mais ce que vous aviez organisé au préalable et si vous pouvez le prouver."}], "read": {"text": "Lisez l'article 5, paragraphe 2 et comparez la formulation avec la première phrase de l'article 24.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "Avant d'examiner les articles, faisons le lien avec ce que vous connaissez déjà. Vous vous souvenez de l'article sur les principes ? Il contient la responsabilité, l'accountability : le responsable du traitement est responsable du respect des principes et doit être en mesure de démontrer ce respect. Deux verbes donc : respecter et démontrer. Le chapitre sur les obligations est en fait le développement de cette phrase. Il dit comment démontrer que vous respectez les principes : avec des mesures, des documents, des procédures, la désignation d'un délégué. Vous verrez que presque chaque obligation a la même construction. Prenez des mesures appropriées, compte tenu de la nature, de la portée, du contexte et des finalités du traitement et du risque pour les personnes concernées, et veillez à pouvoir démontrer que vous l'avez fait. Pourquoi est-ce important ? Parce qu'en cas de plainte ou de violation, l'autorité de contrôle ne demande pas seulement ce qui s'est passé, mais surtout ce que vous aviez organisé avant, et si vous pouvez le prouver. Retenez donc : ce chapitre est la responsabilité en pratique, respecter et démontrer."}, {"id": 4, "type": "reveal", "chip": "Exercice · cherchez vous-même", "title": "Pour qui l'article est-il écrit ? Lisez la première phrase", "question": "Mettez l'audio en pause et ouvrez le règlement via le bouton en bas. Lisez, pour les articles 24, 25, 28, 30, 32, 33 et 37, chaque fois la première phrase ou le premier paragraphe, et notez à qui il s'adresse : le responsable du traitement, le sous-traitant, ou les deux.", "verdict": "Toutes les obligations ne s'appliquent pas à tout le monde : lisez qui est le sujet de la phrase", "answer": [{"k": "Seulement le responsable du traitement", "t": "la responsabilité générale et la politique, la protection des données dès la conception et par défaut, la notification à l'autorité de contrôle et aux personnes concernées, l'analyse d'impact et la consultation préalable."}, {"k": "Les deux", "t": "la sécurité du traitement, le registre (chacun son propre registre), la coopération avec l'autorité de contrôle, le contrat de sous-traitance (le responsable du traitement choisit, le sous-traitant s'engage), et le délégué à la protection des données."}, {"k": "Le sous-traitant à part", "t": "il ne traite que sur instruction, informe le responsable du traitement dans les meilleurs délais d'une violation, et ne peut pas recruter un autre sous-traitant sans autorisation."}, {"k": "La leçon", "t": "la protection des données dès la conception repose exclusivement sur le responsable du traitement, même si un sous-traitant construit le produit ; la sécurité repose sur les deux. Qui lit l'article sait qui devra rendre des comptes."}], "read": {"text": "Ouvrez le chapitre IV et lisez, article par article, à qui il s'adresse.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "Maintenant un exercice, car c'est la compétence autour de laquelle tourne ce module. Mettez l'audio en pause, ouvrez le règlement via le bouton sur la diapositive, et lisez, pour chaque article de la liste, la première phrase ou le premier paragraphe. Notez à qui il s'adresse : le responsable du traitement, le sous-traitant, ou les deux. Prenez le temps qu'il faut. … Qu'avez-vous trouvé ? La responsabilité, la politique, la conception et les paramètres par défaut, les notifications et l'analyse d'impact : ces phrases commencent toutes par le responsable du traitement. La sécurité commence autrement : là, le responsable du traitement et le sous-traitant sont ensemble le sujet. Le registre, la coopération avec l'autorité de contrôle et le délégué valent aussi pour les deux. Et le sous-traitant a ses propres obligations : traiter sur instruction seulement, notifier une violation dans les meilleurs délais au responsable du traitement, et pas de sous-traitant ultérieur sans autorisation. Regardez maintenant la différence qui surprend le plus en pratique. Les produits et services sont généralement développés par un sous-traitant, mais la protection des données dès la conception est exclusivement une obligation du responsable du traitement : il porte la responsabilité finale, même pour ce qu'il fait construire. La sécurité, qui s'y rattache étroitement, est écrite pour les deux. Retenez donc : qui lit l'article sait qui devra rendre des comptes."}, {"id": 5, "type": "table", "chip": "Le tableau récapitulatif", "title": "Quelle obligation s'applique à qui", "head": ["Obligation", "Responsable du traitement", "Sous-traitant"], "rows": [["24 · Responsabilité et politique de protection des données", "oui", "—"], ["25 · Protection des données dès la conception et par défaut", "oui", "—"], ["26 · Responsables conjoints du traitement", "oui (accord entre eux)", "—"], ["28 · Sous-traitant et contrat de sous-traitance", "oui (choisit et contrôle)", "oui (s'engage, instructions, sous-traitants ultérieurs)"], ["29 · Traitement sous l'autorité", "oui", "oui"], ["30 · Registre des activités de traitement", "oui (son propre registre)", "oui (son propre registre)"], ["31 · Coopération avec l'autorité de contrôle", "oui", "oui"], ["32 · Sécurité du traitement", "oui", "oui"], ["33 · Notification d'une violation à l'autorité de contrôle", "oui (dans les 72 heures)", "informe le responsable du traitement dans les meilleurs délais"], ["34 · Communication d'une violation à la personne concernée", "oui", "—"], ["35–36 · Analyse d'impact et consultation préalable", "oui", "— (apporte son aide)"], ["37–39 · Délégué à la protection des données", "oui", "oui"]], "hl": [1, 7], "read": {"text": "Vérifiez le tableau vous-même dans le chapitre IV ; en cas de doute, c'est le texte qui vaut, pas le tableau.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "Voici le résultat de l'exercice dans un seul tableau. Au responsable du traitement seul s'appliquent la responsabilité et la politique, la conception et les paramètres par défaut, l'accord entre responsables conjoints du traitement, la notification à l'autorité de contrôle, la communication à la personne concernée, et l'analyse d'impact avec la consultation préalable. Le sous-traitant n'y figure pas dans le texte, mais il y est associé : il informe le responsable du traitement dans les meilleurs délais d'une violation et aide à l'analyse d'impact si on le lui demande. Aux deux s'appliquent le contrat de sous-traitance, le traitement sous l'autorité, le registre, la coopération avec l'autorité de contrôle, la sécurité et le délégué. Les deux lignes surlignées sont le cœur de ce module : la conception, pour le responsable du traitement seul, et la sécurité, pour les deux. Un avertissement : un tel tableau est un aide-mémoire, pas une source. En cas de doute, ouvrez le texte et lisez la première phrase."}, {"id": 6, "type": "reveal", "chip": "Section 1 · responsabilité", "title": "Lisez l'article sur la responsabilité : une politique écrite est-elle nécessaire ?", "question": "Ouvrez le règlement et lisez l'article 24 sur la responsabilité du responsable du traitement, le premier article du chapitre IV. Deux questions : pour qui est-il écrit, et une organisation doit-elle, après avoir lu cet article, disposer d'une politique de protection des données rédigée sur papier ?", "verdict": "Pour le responsable du traitement ; et oui, rédiger une politique de protection des données est en pratique nécessaire lorsque cela est proportionné au traitement, ce qui est le cas pour la plupart des organisations", "answer": [{"k": "Paragraphe 1", "t": "le responsable du traitement met en œuvre des mesures techniques et organisationnelles appropriées pour s'assurer et être en mesure de démontrer que le traitement est effectué conformément au règlement, compte tenu du risque ; ces mesures sont réexaminées et actualisées."}, {"k": "Paragraphe 2", "t": "lorsque cela est proportionné au regard des activités de traitement, ces mesures comprennent la mise en œuvre de politiques appropriées en matière de protection des données par le responsable du traitement."}, {"k": "Ce que cela signifie", "t": "une politique que vous pouvez démontrer est une politique écrite ; et une politique mise en œuvre est une politique portée par l'organisation : approuvée par la direction, connue des collaborateurs, appliquée en pratique."}, {"k": "À ne pas confondre", "t": "ce n'est pas la déclaration de confidentialité sur le site web, mais les lignes de conduite internes : qui fait quoi, comment nous traitons les demandes, les incidents, les accès, les durées de conservation, les fournisseurs."}], "read": {"text": "Lisez l'article 24, paragraphes 1 et 2.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "Nous commençons le premier groupe par le premier article du chapitre, et nous faisons l'exercice ensemble. Ouvrez le règlement et lisez l'article sur la responsabilité du responsable du traitement. Deux questions : pour qui est-il écrit, et une organisation doit-elle, après l'avoir lu, avoir une politique de protection des données écrite ? Prenez le temps qu'il faut. … La première question est simple : le sujet de la phrase est le responsable du traitement, et lui seul. Pour la deuxième question, vous lisez jusqu'au deuxième paragraphe. Il dit que les mesures comprennent une politique appropriée de protection des données lorsque cela est proportionné aux activités de traitement. Une condition donc, pas une obligation absolue. Mais réfléchissez plus loin. Le premier paragraphe dit que vous devez pouvoir démontrer le respect, et une politique qui n'existe que dans la tête de quelqu'un ne se démontre pas. Et une politique mise en œuvre, comme dit le deuxième paragraphe, est une politique portée : approuvée par la direction, connue des collaborateurs, et appliquée. Pour presque toute organisation qui traite régulièrement des données à caractère personnel, cela signifie donc une politique écrite et portée. Encore une confusion à lever : cette politique n'est pas la déclaration de confidentialité sur votre site web. Celle-ci est tournée vers l'extérieur, vers les personnes concernées. La politique est tournée vers l'intérieur : qui fait quoi, comment traiter les demandes et les incidents, qui a accès, combien de temps conserver, comment choisir les fournisseurs. Retenez donc : démontrer demande du papier, mettre en œuvre demande une adhésion, et la politique est autre chose que la déclaration de confidentialité."}, {"id": 7, "type": "table", "chip": "Section 1 · le registre", "title": "Le registre des activités de traitement : le premier document avec lequel vous démontrez", "head": ["", "Responsable du traitement (paragraphe 1)", "Sous-traitant (paragraphe 2)"], "rows": [["Quoi", "un registre des activités de traitement effectuées sous sa responsabilité", "un registre de toutes les catégories d'activités de traitement effectuées pour le compte de chaque responsable du traitement"], ["Contenu", "nom et coordonnées (aussi du DPO) ; les finalités ; les catégories de personnes concernées et de données ; les catégories de destinataires ; les transferts hors de l'Union ; les délais de conservation envisagés ; une description générale des mesures de sécurité", "nom et coordonnées du sous-traitant, de chaque responsable du traitement et du DPO ; les catégories de traitements par responsable du traitement ; les transferts hors de l'Union ; une description générale des mesures de sécurité"], ["Pas", "les finalités et la base juridique : c'est le responsable du traitement qui les détermine", "—"], ["Forme et contrôle (paragraphes 3 et 4)", "par écrit, y compris sous forme électronique ; mis à la disposition de l'autorité de contrôle sur demande", "idem"], ["Exception (paragraphe 5)", "organisations comptant moins de 250 employés, sauf si le traitement comporte un risque, n'est pas occasionnel, ou porte sur des données particulières ou pénales : en pratique, l'exception ne s'applique presque jamais", "idem"]], "hl": [1], "read": {"text": "Lisez l'article 30 en entier ; la page de l'APD sur le registre ; les décisions 62/2022 (délais de conservation vagues) et 114/2024 (pas de registre, le traitement du personnel n'est pas occasionnel) de l'APD.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/register-van-verwerkingsactiviteiten", "label": "APD · le registre"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-62-2022.pdf", "label": "Décision APD 62/2022"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-114-2024.pdf", "label": "Décision APD 114/2024"}]}, "script": "Le premier document avec lequel vous démontrez le respect est le registre des activités de traitement, et le tableau met les deux registres côte à côte. Car il y en a deux. Le responsable du traitement tient un registre des traitements effectués sous sa responsabilité, et le sous-traitant son propre registre des catégories de traitements effectués pour chaque responsable du traitement. Que contient celui du responsable du traitement ? Le nom et les coordonnées, aussi celles du DPO ; les finalités ; les catégories de personnes concernées et de données ; les catégories de destinataires ; les transferts hors de l'Union ; les délais de conservation envisagés ; et une description générale des mesures de sécurité. Le registre du sous-traitant est plus court : ses coordonnées et celles de chaque responsable du traitement, les catégories de traitements par donneur d'ordre, les transferts et la sécurité. Pas les finalités ni la base juridique, car c'est le donneur d'ordre qui les détermine. Deux paragraphes fixent la forme : le registre est écrit, y compris électronique, et vous le mettez à la disposition de l'autorité de contrôle sur demande. C'est donc généralement la première chose que le Service d'inspection demande. Et puis l'exception pour les organisations de moins de deux cent cinquante employés. Lisez les conditions : sauf si le traitement comporte un risque, n'est pas occasionnel, ou porte sur des données particulières ou pénales. Toute organisation avec du personnel traite de manière non occasionnelle et souvent des données particulières ; l'autorité belge l'a dit expressément à un employeur sans registre. En pratique, l'exception ne s'applique donc presque jamais. Et un registre qui existe doit aussi être exact : une institution d'aide à la jeunesse a reçu une réprimande parce que son registre mentionnait des délais de conservation vagues, comme délai inconnu. Retenez donc : deux registres, chacun avec son propre contenu, toujours disponibles pour l'autorité de contrôle, et l'exception est en pratique lettre morte."}, {"id": 8, "type": "bullets", "chip": "Section 1 · mesures", "title": "Mesures techniques et organisationnelles : un cadre aide, comme ISO 27001", "bullets": [{"k": "Technique et organisationnel", "t": "technique : chiffrement, gestion des accès, sauvegardes, journalisation ; organisationnel : politique, procédures, rôles, formation, contrats ; le règlement demande toujours les deux."}, {"k": "Un cadre donne une structure", "t": "ISO 27001 est la norme internationale pour un système de management de la sécurité de l'information : inventorier les risques, choisir des mesures, les mettre en œuvre, les contrôler et les améliorer, dans un cycle."}, {"k": "Pourquoi cela compte aussi pour NIS2", "t": "la loi belge qui transpose la directive NIS2 permet aux organisations de démontrer leur cybersécurité via des cadres reconnus ; ISO 27001 et le cadre CyberFundamentals du Centre pour la Cybersécurité Belgique en sont la référence."}], "read": {"text": "Lisez l'article 24 et l'article 32 côte à côte : tous deux parlent de mesures techniques et organisationnelles.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "L'article parle de mesures techniques et organisationnelles, et ces mots reviennent sans cesse dans ce chapitre. Techniques : les mesures dans les systèmes, chiffrement, gestion des accès, sauvegardes, journalisation. Organisationnelles : les mesures autour des personnes, politique, procédures, rôles, formation, contrats. Le règlement demande toujours les deux, et ne dit jamais lesquelles. D'où l'utilité d'un cadre, et le plus connu est ISO 27001, la norme internationale pour la sécurité de l'information. Elle ne décrit pas une liste de techniques obligatoires, mais un système de management : inventorier les risques, choisir des mesures, les appliquer, les contrôler et les améliorer, dans un cycle continu. C'est exactement la logique de la responsabilité. Le même cadre apparaît dans la législation sur la cybersécurité : la loi belge transposant la directive NIS2 permet de démontrer sa cybersécurité via des cadres reconnus, et ISO 27001 et le cadre CyberFundamentals du Centre pour la Cybersécurité Belgique en sont la référence. Un DPO a donc intérêt à parler la même langue que le responsable de la sécurité. Retenez donc : technique et organisationnel, et un cadre donne une structure."}, {"id": 9, "type": "compare", "chip": "Section 1 · dès la conception et par défaut", "title": "La protection des données dès la conception est autre chose que la protection par défaut", "left": {"head": "Dès la conception (paragraphe 1)", "items": ["Quand : lors de la détermination des moyens du traitement et lors du traitement lui-même, donc dès la première conception d'un système ou d'un processus, et à chaque modification", "Quoi : des mesures qui mettent en œuvre les principes de façon effective et intègrent des garanties, comme la pseudonymisation et la minimisation des données", "Exemple : un nouveau système client qui ne contient que les champs dont vous avez besoin, prévoit un accès par rôle et efface automatiquement les données après le délai de conservation", "Contre-exemple (APD 186/2022) : un rappel de paiement de la FSMA à des centaines d'intermédiaires avec toutes les adresses visibles dans le champ CC : pas de principe des quatre yeux, pas de conception"]}, "right": {"head": "Par défaut (paragraphe 2)", "items": ["Quand : au moment où l'utilisateur utilise le système pour la première fois, sans qu'il doive rien changer", "Quoi : par défaut, seules les données nécessaires à la finalité spécifique : quantité, étendue du traitement, durée de conservation et accessibilité", "Exemple : un profil qui n'est pas visible par tous par défaut ; la localisation désactivée par défaut ; les documents téléversés privés par défaut", "Contre-exemple (AEPD PS-00027-2026) : la plateforme de sélection du radiodiffuseur public espagnol, sur laquelle les documents téléversés étaient classés publics par défaut : des centaines de CV téléchargeables"]}, "read": {"text": "Lisez l'article 25 en entier ; le paragraphe 1 porte sur la conception, le paragraphe 2 sur les paramètres par défaut. Les exemples : décision 186/2022 de l'APD (FSMA, champ CC) et décision PS-00027-2026 de l'AEPD (RTVE, plateforme de sélection).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-186-2022.pdf", "label": "Décision APD 186/2022"}, {"url": "https://www.aepd.es/documento/ps-00027-2026.pdf", "label": "Décision AEPD PS-00027-2026"}]}, "script": "L'article suivant contient deux obligations souvent confondues, et les deux colonnes les mettent côte à côte. À gauche : la protection des données dès la conception. Le moment est la conception : lors de la détermination des moyens, donc lorsque vous imaginez ou faites construire un système ou un processus, puis lors du traitement lui-même et à chaque modification. Vous intégrez les principes : minimisation des données, pseudonymisation, accès par rôle, effacement automatique après le délai de conservation. Un système client qui ne contient que les champs dont vous avez besoin est protégé dès la conception. Le contre-exemple vient de l'autorité belge de protection des données : la FSMA, l'autorité de contrôle financière, a envoyé un rappel de paiement à des centaines d'intermédiaires avec toutes les adresses visibles dans le champ CC. Pas de principe des quatre yeux, pas de conception, une réprimande. À droite : la protection des données par défaut. Le moment est la première utilisation : que se passe-t-il si l'utilisateur ne change rien ? La règle : par défaut, seules les données nécessaires à la finalité sont traitées, et cela porte sur la quantité, l'étendue du traitement, la durée de conservation et l'accessibilité. Un profil non visible par tous par défaut, la localisation désactivée, un document téléversé privé. Le contre-exemple vient d'Espagne, de l'autorité AEPD : sur la plateforme de sélection du radiodiffuseur public, les documents téléversés étaient publics par défaut, et des centaines de CV étaient téléchargeables. Retenez donc : dès la conception concerne la façon dont vous le construisez, par défaut ce qui se passe si personne ne change rien."}, {"id": 10, "type": "reveal", "chip": "Réflexion 1", "title": "L'opérateur télécom et les quatre options", "question": "Un opérateur télécom propose dans son application quatre réglages pour le suivi de la navigation du client. L'option 1 désactive tout suivi. L'option 2 autorise le suivi pour ses propres offres. L'option 3 aussi pour des partenaires. L'option 4 pour tout, y compris la vente à des tiers. L'opérateur marque l'option 2 comme réglage recommandé, en expliquant que la plupart des clients la choisissent. Est-ce en ordre ?", "verdict": "Non : le paramètre par défaut doit être le plus protecteur, l'option 1, et ce que choisissent la plupart des clients n'est pas un argument", "answer": [{"k": "Pourquoi pas", "t": "par défaut signifie que, sans intervention de l'utilisateur, seul le traitement nécessaire a lieu ; le suivi pour des offres n'est pas nécessaire au service, donc il est désactivé par défaut et le client choisit lui-même de l'activer."}, {"k": "L'argument de la majorité", "t": "ce que les autres choisissent ne dit rien sur ce qui est nécessaire ; un réglage recommandé qui ajoute un traitement est un défaut inversé."}, {"k": "La sanction", "t": "les violations des obligations du chapitre IV, dont la conception, les paramètres par défaut et la sécurité, relèvent de la première catégorie d'amendes : jusqu'à 10 millions d'euros ou 2 % du chiffre d'affaires annuel mondial ; les principes et les droits de la personne concernée relèvent de la seconde : jusqu'à 20 millions ou 4 %."}, {"k": "En pratique", "t": "l'autorité de contrôle irlandaise DPC a infligé en 2022 une amende de 265 millions d'euros à Meta parce que l'importation de contacts et la recherche par numéro de téléphone n'étaient pas protégées dès la conception et par défaut."}], "read": {"text": "Lisez l'article 25, paragraphe 2 (la dernière phrase) et les catégories d'amendes à l'article 83, paragraphes 4 et 5 ; la décision de la DPC concernant Meta (novembre 2022).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://www.dataprotection.ie/en/dpc-guidance/decisions/inquiry-concerning-meta-dataset-november-2022", "label": "Décision DPC Meta 2022"}]}, "script": "Première réflexion. Un opérateur télécom propose dans son application quatre réglages pour le suivi de la navigation du client. L'option un désactive tout suivi. L'option deux autorise le suivi pour ses propres offres. L'option trois aussi pour des partenaires. L'option quatre pour tout, y compris la vente à des tiers. L'opérateur marque l'option deux comme réglage recommandé, parce que la plupart des clients la choisissent. Est-ce en ordre ? Réfléchissez un instant. … Non. La règle sur les paramètres par défaut dit que, sans intervention de l'utilisateur, seul le traitement nécessaire à la finalité a lieu. Le suivi n'est pas nécessaire à un service télécom, donc il est désactivé par défaut, et c'est l'option un. Le client peut ensuite choisir davantage, mais le défaut est le plus protecteur. Ce que la plupart des clients choisissent ne dit rien sur ce qui est nécessaire ; un réglage recommandé qui ajoute un traitement est un défaut inversé. Maintenant, brièvement, les sanctions. Les obligations de ce chapitre relèvent de la première catégorie d'amendes : jusqu'à dix millions d'euros ou deux pour cent du chiffre d'affaires annuel mondial ; les principes, les bases juridiques et les droits de la personne concernée relèvent de la seconde : jusqu'à vingt millions ou quatre pour cent. Ce n'est pas de la théorie : l'autorité irlandaise, la DPC, a infligé en deux mille vingt-deux une amende de deux cent soixante-cinq millions d'euros à Meta, parce que l'importation de contacts et la recherche par numéro de téléphone n'étaient pas protégées dès la conception et par défaut. Retenez donc : le défaut est l'option la plus protectrice, et l'amende pour qui l'oublie est réelle."}, {"id": 11, "type": "quote", "chip": "Section 2 · sécurité", "title": "La sécurité du traitement s'applique au responsable du traitement et au sous-traitant", "source": "Article 32, paragraphe 1 du RGPD (phrase introductive)", "quote": "Compte tenu de l'état des connaissances, des coûts de mise en œuvre et de la nature, de la portée, du contexte et des finalités du traitement ainsi que des risques, dont le degré de probabilité et de gravité varie, pour les droits et libertés des personnes physiques, le responsable du traitement et le sous-traitant mettent en œuvre les mesures techniques et organisationnelles appropriées afin de garantir un niveau de sécurité adapté au risque, y compris entre autres, selon les besoins:", "bullets": [{"k": "Le glissement", "t": "pour la première fois, le législateur s'adresse directement au sous-traitant : il a sa propre obligation de sécurité, distincte de celle du responsable du traitement, et peut lui-même être sanctionné d'une amende."}, {"k": "En pratique", "t": "une entreprise d'énergie polonaise et son sous-traitant d'archivage ont chacun reçu une amende en 2023 (converties, plus de 1 million d'euros et environ 55.000 euros) après que le sous-traitant avait configuré un nouveau serveur avec de vraies données clients sans sécurité et que le responsable du traitement ne l'avait jamais contrôlé ; des autorités croate, hongroise et roumaine ont aussi sanctionné directement des sous-traitants informatiques."}, {"k": "Neutre sur le plan technologique, mais pas vide", "t": "le règlement ne prescrit aucune technique, mais nomme des propriétés : pseudonymisation et chiffrement, confidentialité, intégrité, disponibilité et résilience, rétablissement après un incident, et tests réguliers."}, {"k": "Adapté au risque", "t": "approprié signifie : proportionné à l'état des connaissances, aux coûts et au risque pour les personnes concernées ; un portail patients sans chiffrement a coûté 20.000 euros à un laboratoire belge."}], "deep": {"url": "verdieping/cryptografie/index.html", "text": "ce que sont exactement la pseudonymisation, le chiffrement et le hachage, avec des schémas, et où vous les utilisez."}, "read": {"text": "Lisez l'article 32 en entier ; les décisions : UODO (entreprise d'énergie et sous-traitant, 2023), APD 127/2022 (laboratoire).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://orzeczenia.uodo.gov.pl/document/urn:ndoc:gov:pl:uodo:2020:dkn_5130_2215/content", "label": "Décision UODO 2023"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-127-2022.pdf", "label": "Décision APD 127/2022"}]}, "script": "Puis la sécurité du traitement, et lisez bien la phrase introductive sur la diapositive. Le sujet de la phrase est : le responsable du traitement et le sous-traitant. C'est un glissement que le législateur n'avait jamais fait. Sous l'ancienne directive, le responsable du traitement imposait la sécurité par contrat à son fournisseur. Maintenant, le sous-traitant a sa propre obligation de sécurité, directe, inscrite dans la loi, et il peut lui-même être sanctionné. Les autorités de contrôle le font aussi. En Pologne, une entreprise d'énergie et son sous-traitant d'archivage ont chacun reçu une amende en deux mille vingt-trois, converties, plus d'un million d'euros et environ cinquante-cinq mille euros, après que le sous-traitant avait configuré un nouveau serveur avec de vraies données clients sans tester la sécurité, et que le responsable du traitement ne l'avait jamais contrôlé. L'autorité belge a aussi infligé vingt mille euros à un laboratoire parce que son portail patients fonctionnait sans chiffrement. Comment savoir ce qui est approprié ? Le règlement est technologiquement neutre : il ne prescrit aucune technique, car la technique vieillit. Mais il n'est pas vide. Il nomme des propriétés : pseudonymisation et chiffrement, confidentialité, intégrité, disponibilité et résilience, rétablissement après un incident, et tests réguliers. Et il dit de quoi tenir compte : l'état des connaissances, les coûts, et le risque pour les personnes concernées. Le premier approfondissement explique ce que sont exactement la pseudonymisation, le chiffrement et le hachage. Retenez donc : la sécurité est une obligation des deux, adaptée au risque, et le règlement nomme les propriétés, pas la technique."}, {"id": 12, "type": "cards", "chip": "Section 2 · sécurité", "title": "Ce que l'article nomme : quatre propriétés d'une sécurité appropriée", "cols": 4, "cards": [{"k": "a · Pseudonymisation et chiffrement", "t": "rendre les données illisibles ou non rattachables pour qui n'y a pas droit ; le chiffrement rend un fichier volé sans valeur et peut rendre superflue la communication aux personnes concernées.", "sub": "Approfondissement 1"}, {"k": "b · Confidentialité, intégrité, disponibilité, résilience", "t": "seules les personnes autorisées voient les données, les données sont exactes et inchangées, elles sont là quand vous en avez besoin, et le système surmonte un incident.", "sub": "Approfondissement 2"}, {"k": "c · Rétablissement après un incident", "t": "des sauvegardes qui fonctionnent, un délai de rétablissement que vous connaissez, et une procédure d'incident intégrée à la politique de protection des données.", "sub": "Approfondissement 2"}, {"k": "d · Tests et évaluations réguliers", "t": "audits, analyses de vulnérabilités et tests d'intrusion, aussi des procédures organisationnelles ; ce que vous ne testez pas, vous ne le savez pas.", "sub": "Approfondissement 2"}], "deep": {"url": "verdieping/organisatie/index.html", "text": "confidentialité, intégrité et disponibilité, gestion des incidents, évaluation périodique, et accès et journalisation."}, "read": {"text": "Lisez l'article 32, paragraphe 1, a) à d), et le paragraphe 2 sur les risques dont vous tenez compte.", "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, "script": "Les quatre propriétés de l'article figurent sur les cartes, et elles forment en même temps la table des matières des deux approfondissements. La première : pseudonymisation et chiffrement. Vous rendez les données non rattachables ou illisibles pour qui n'y a pas droit. Le chiffrement a une conséquence particulière : un fichier volé bien chiffré est sans valeur pour le voleur, et cela peut rendre superflue la communication aux personnes concernées. La deuxième : la capacité de garantir en permanence la confidentialité, l'intégrité, la disponibilité et la résilience. Seules les personnes autorisées voient les données, les données sont exactes et inchangées, elles sont là quand vous en avez besoin, et le système surmonte un incident. La troisième : le rétablissement après un incident physique ou technique. Des sauvegardes qui fonctionnent vraiment, un délai de rétablissement connu, et une procédure d'incident, intégrée à la politique de protection des données. La quatrième : une procédure pour tester, analyser et évaluer régulièrement les mesures. Audits, analyses de vulnérabilités, tests d'intrusion, et aussi les procédures organisationnelles, car ce que vous ne testez pas, vous ne le savez pas. Le deuxième approfondissement développe les trois dernières : confidentialité, intégrité et disponibilité, gestion des incidents, évaluation périodique, et accès et journalisation. Retenez donc : rendre illisible, garantir, rétablir et tester."}, {"id": 13, "type": "quote", "chip": "Section 2 · violations", "title": "Une violation de données à caractère personnel : la définition et les trois types", "source": "Article 4, point 12 du RGPD", "quote": "«violation de données à caractère personnel», une violation de la sécurité entraînant, de manière accidentelle ou illicite, la destruction, la perte, l'altération, la divulgation non autorisée de données à caractère personnel transmises, conservées ou traitées d'une autre manière, ou l'accès non autorisé à de telles données;", "bullets": [{"k": "Confidentialité", "t": "divulgation ou accès non autorisés : un courriel avec toutes les adresses en CC, un ordinateur portable sans chiffrement perdu, une liste téléchargeable sans mot de passe."}, {"k": "Intégrité", "t": "altération non autorisée ou accidentelle : un numéro de compte modifié dans un système de facturation, un dossier qui contient des données erronées à la suite d'une erreur."}, {"k": "Disponibilité", "t": "destruction ou perte : un rançongiciel qui chiffre les données, un serveur qui tombe en panne sans sauvegarde ; une perte temporaire compte aussi si les conséquences pour les personnes concernées sont réelles."}, {"k": "Attention au mot sécurité", "t": "une violation est toujours une violation de la sécurité ; un traitement sans base juridique est une autre violation du règlement, mais pas une violation de données à caractère personnel."}], "read": {"text": "Lisez la définition à l'article 4, point 12, et les lignes directrices de l'EDPB sur la notification des violations.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}, {"url": "https://edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-92022-personal-data-breach-notification-under_nl", "label": "Lignes directrices EDPB 9/2022"}]}, "script": "La dernière partie de ce module porte sur les violations, et nous commençons par la définition. Lisez-la sur la diapositive. Une violation de données à caractère personnel est une violation de la sécurité qui entraîne, de manière accidentelle ou illicite, la destruction, la perte, l'altération, la divulgation non autorisée de données ou l'accès non autorisé à celles-ci. Cela recouvre trois types. Le premier est la violation de la confidentialité : quelqu'un voit ou reçoit des données qu'il ne pouvait pas voir, comme le courriel avec toutes les adresses en CC, l'ordinateur portable perdu sans chiffrement, ou la liste téléchargeable sans mot de passe. Le deuxième est la violation de l'intégrité : des données sont modifiées sans autorisation, ou par accident, comme un numéro de compte modifié dans un système de facturation. Le troisième est la violation de la disponibilité : des données sont détruites ou perdues, comme avec un rançongiciel ou un serveur qui tombe en panne sans sauvegarde. Une perte temporaire compte aussi, comme un hôpital qui n'a plus accès aux dossiers patients pendant des jours. Attention enfin au mot sécurité. Un traitement sans base juridique est aussi une violation du règlement, mais pas une violation de la sécurité, et donc pas une violation en ce sens et pas de notification. Retenez donc : confidentialité, intégrité ou disponibilité, et toujours via la sécurité."}, {"id": 14, "type": "chain", "chip": "Section 2 · violations", "title": "Deux obligations, une seule procédure : notifier à l'autorité de contrôle, communiquer aux personnes concernées", "steps": [{"k": "1 · Détecter et consigner", "t": "qui remarque un incident le signale en interne ; le sous-traitant informe le responsable du traitement dans les meilleurs délais ; l'horloge démarre dès que le responsable du traitement en a connaissance."}, {"k": "2 · Limiter et peser", "t": "colmater la fuite ; puis estimer le risque pour les personnes concernées avec un mécanisme de pondération fixe : nature des données, nombre de personnes concernées, gravité et probabilité des conséquences."}, {"k": "3 · Notifier à l'APD", "t": "si un risque n'est pas improbable, dans les 72 heures via le portail que l'APD a développé à cet effet, par phases si tout n'est pas encore connu ; en retard demande une motivation."}, {"k": "4 · Communiquer aux personnes concernées", "t": "en cas de haut risque probable : dans les meilleurs délais, en termes clairs, avec ce qui s'est passé, les conséquences, ce que vous faites et ce qu'elles peuvent faire ; pas nécessaire si les données étaient chiffrées ou si le risque a été écarté."}, {"k": "5 · Documenter et apprendre", "t": "chaque violation dans le registre des violations, aussi celles non notifiées, avec la motivation ; ensuite ajuster les mesures."}], "read": {"text": "La page de l'APD pour notifier une violation (portail et étapes), le manuel accompagnant le formulaire de notification, et la méthode de l'ENISA pour peser la gravité.", "links": [{"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/acties/gegevensinbreuk", "label": "APD : notifier une violation de données"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/handleiding-gegevensinbreuk---deel-1.PDF", "label": "Manuel violation de données (APD)"}, {"url": "https://www.enisa.europa.eu/publications/dbn-severity", "label": "ENISA : peser la gravité d'une violation"}]}, "script": "Le règlement scinde les obligations en deux : la notification à l'autorité de contrôle et la communication aux personnes concernées. En pratique, elles forment une seule procédure en cinq étapes, qui a sa place dans votre politique de protection des données. Étape un : détecter et consigner. Qui remarque un incident le signale en interne, et le sous-traitant informe le responsable du traitement dans les meilleurs délais. L'horloge démarre dès que celui-ci en a connaissance. Étape deux : limiter et peser. Vous colmatez la fuite, puis vous pesez le risque pour les personnes concernées avec un mécanisme fixe, pas au jugé : la nature des données, le nombre de personnes concernées, la gravité et la probabilité des conséquences ; l'agence européenne ENISA a publié une méthode à cet effet. Étape trois : notifier à l'autorité de contrôle. Si un risque n'est pas improbable, vous notifiez dans les 72 heures. L'autorité de contrôle fédérale belge, l'APD, a développé un portail à cet effet. Les boutons sur la diapositive mènent à la page des étapes et au manuel du formulaire. Si vous ne savez pas encore tout, vous notifiez par phases ; en retard, vous motivez pourquoi. Étape quatre : communiquer aux personnes concernées. Seulement en cas de haut risque probable, et alors dans les meilleurs délais, en termes clairs : ce qui s'est passé, les conséquences, ce que vous faites et ce qu'elles peuvent faire ; inutile si les données étaient chiffrées ou si le risque a été écarté. Étape cinq : documenter et apprendre. Chaque violation entre dans le registre des violations, même non notifiée, avec la motivation. Retenez donc : le seuil pour l'autorité de contrôle est un risque, celui pour les personnes concernées un haut risque, et tout est documenté."}, {"id": 15, "type": "reveal", "chip": "Réflexion 2", "title": "La plateforme d'inscription : qu'est-ce qui a mal tourné dans la semaine après la fuite ?", "question": "Une plateforme d'inscription gantoise pour les écoles secondaires laisse fuiter en mai 2022 des listes téléchargeables avec des données de parents et d'enfants, dont des numéros de registre national, via des adresses sans authentification. Le mercredi 4 mai, la fuite est découverte, le jeudi 5 mai colmatée, le vendredi 6 mai notifiée à l'autorité de contrôle, et le lundi 9 mai les parents sont informés. Qu'est-ce qui a mal tourné ?", "verdict": "La communication aux parents n'a pas eu lieu dans les meilleurs délais, et au préalable les mesures de base manquaient", "answer": [{"k": "Pas dans les meilleurs délais", "t": "des numéros de registre national et des données d'enfants signifient un haut risque ; la Chambre contentieuse n'a trouvé aucune justification aux cinq jours entre la découverte et la communication aux parents."}, {"k": "Ce qui manquait au préalable", "t": "pas de journalisation, pas d'authentification à deux facteurs, pas d'analyse d'impact pour un ancien système utilisé pour un nouveau public ; ensuite sont venus des tests de sécurité, l'authentification à deux facteurs, la journalisation et une analyse d'impact."}, {"k": "La clé juridique", "t": "la Chambre contentieuse a finalement jugé que la plateforme de concertation n'était pas le responsable du traitement, mais les pouvoirs organisateurs ; sans répartition claire des rôles, personne ne sait qui doit notifier."}], "read": {"text": "Décision 171/2024 de la Chambre contentieuse de l'APD.", "links": [{"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-171-2024.pdf", "label": "Décision APD 171/2024"}]}, "script": "Deuxième réflexion, un vrai exemple belge de communication aux personnes concernées. Une plateforme d'inscription gantoise pour les écoles secondaires laisse fuiter en mai deux mille vingt-deux des listes de données de parents et d'enfants, numéros de registre national compris, via des adresses sans mot de passe. Le mercredi quatre mai, la fuite est découverte, le jeudi cinq mai colmatée, le vendredi six mai notifiée à l'autorité de contrôle, et le lundi neuf mai les parents sont informés. Qu'est-ce qui a mal tourné ? Réfléchissez un instant. … La communication aux parents n'a pas eu lieu dans les meilleurs délais. Numéros de registre national et données d'enfants signifient un haut risque, et la Chambre contentieuse n'a trouvé aucune justification aux cinq jours entre la découverte et la lettre, car la fuite était colmatée dès le deuxième jour. Regardez aussi ce qui manquait avant : pas de journalisation, pas d'authentification à deux facteurs, pas d'analyse d'impact pour un ancien système réutilisé pour un nouveau public. Et la clé juridique : la Chambre contentieuse a jugé que le responsable du traitement n'était pas la plateforme de concertation, mais les pouvoirs organisateurs. Sans répartition claire des rôles, personne ne sait qui doit notifier, précisément la question d'ouverture de ce module. Retenez donc : un haut risque demande une communication dans les meilleurs délais, et sachez à l'avance qui est le responsable du traitement."}, {"id": 16, "type": "bullets", "chip": "Section 2 · violations", "title": "La stratégie de communication, les procédures et le rôle du DPO", "bullets": [{"k": "Un seul récit, trois publics", "t": "l'autorité de contrôle, les personnes concernées et souvent la presse ; qui dispose à l'avance d'un plan de communication et de modèles gagne les heures qui comptent ; la communication aux personnes concernées n'est pas un texte juridique mais un langage clair avec des conseils concrets."}, {"k": "De bonnes procédures", "t": "un point de signalement interne, une équipe d'incident avec des rôles, un mécanisme de pondération, le formulaire de notification connu à l'avance, des accords avec les sous-traitants sur les délais, et un exercice par an."}, {"k": "Ce que coûte une notification manquée", "t": "un opérateur télécom belge qui n'a pas notifié ni documenté un numéro de téléphone attribué par erreur a reçu 20.000 euros d'amende, confirmée par la Cour des marchés."}, {"k": "Le DPO conseille, ne décide pas", "t": "le DPO rappelle au responsable du traitement l'obligation de notification, conseille sur le fait de notifier ou non, et apporte souvent en pratique un soutien administratif : le dossier, le formulaire, le registre ; la décision de notifier et la responsabilité restent chez le responsable du traitement."}], "read": {"text": "Décision 101/2022 de l'APD et l'arrêt de la Cour des marchés du 22 février 2023 ; les missions du DPO à l'article 39.", "links": [{"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-101-2022.pdf", "label": "Décision APD 101/2022"}, {"url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679", "label": "Ouvrir le RGPD sur EUR-Lex"}]}, "script": "Pour finir, trois points pratiques. D'abord la stratégie de communication. Lors d'une violation, vous racontez un seul récit à trois publics : l'autorité de contrôle, les personnes concernées, et souvent la presse. Qui a préparé un plan de communication et des modèles gagne les heures qui comptent. Et la communication aux personnes concernées n'est pas un texte juridique : un langage clair, ce qui s'est passé, et des conseils concrets, comme changer de mot de passe ou se méfier de faux appels. Ensuite les procédures : un point de signalement interne connu de tous, une équipe d'incident avec des rôles fixes, un mécanisme de pondération, le formulaire de notification connu à l'avance, des accords avec les sous-traitants sur le délai pour vous avertir, et un exercice par an. Tout cela a sa place dans la politique de protection des données. Ce que coûte leur absence, un opérateur télécom belge le montre : un numéro de téléphone a été attribué quatre jours à un tiers non autorisé après un contrôle d'identité défaillant, l'opérateur ne l'a ni notifié ni documenté, et a reçu vingt mille euros d'amende, confirmée par la Cour des marchés. Et puis le rôle du DPO. Le délégué rappelle au responsable du traitement l'obligation de notification et conseille sur l'opportunité de notifier. En pratique, ce conseil prend souvent un côté administratif : le DPO constitue le dossier, aide à remplir le formulaire et tient le registre. Mais ne confondez pas ce soutien avec un pouvoir de décision. La décision de notifier et la responsabilité appartiennent au responsable du traitement ; le DPO n'a pas ce pouvoir, et ne doit pas le vouloir, pour pouvoir continuer à conseiller en toute indépendance. Retenez donc : un langage clair, une procédure préparée, et un DPO qui conseille et soutient, mais ne décide pas."}, {"id": 17, "type": "summary", "chip": "Résumé", "title": "Ce que vous emportez", "key": "Le chapitre IV concrétise la responsabilité (accountability), en quatre groupes d'obligations ; qui lit l'article sait s'il s'applique au responsable du traitement, au sous-traitant ou aux deux : la protection des données dès la conception repose sur le responsable du traitement seul, la sécurité sur les deux ; une violation, vous la pesez, vous la notifiez dans les 72 heures en cas de risque et vous la communiquez dans les meilleurs délais en cas de haut risque, et le DPO conseille sans décider.", "bullets": [{"k": "Pour qui", "t": "lisez la première phrase de l'article ; le tableau est un aide-mémoire, le texte décide."}, {"k": "Politique, registre et conception", "t": "une politique de protection des données écrite et portée, pas une déclaration de confidentialité ; un registre par responsable du traitement et par sous-traitant ; dès la conception lors de la construction, par défaut lors de la première utilisation : le défaut est le plus protecteur."}, {"k": "Sécurité", "t": "une obligation des deux, adaptée au risque : rendre illisible, garantir, rétablir et tester, avec un cadre comme ISO 27001."}, {"k": "Violations", "t": "trois types, une seule procédure en cinq étapes : peser, 72 heures, dans les meilleurs délais en cas de haut risque, documenter."}], "script": "Qu'emportez-vous ? Une phrase clé : le chapitre sur les obligations concrétise la responsabilité, et qui lit l'article sait à qui il s'applique : la protection des données dès la conception repose sur le responsable du traitement seul, la sécurité sur les deux. Vous retenez en outre quatre choses. Pour qui : lisez la première phrase de l'article ; le tableau est un aide-mémoire, le texte décide. Politique, registre et conception : une politique écrite et portée, pas une déclaration de confidentialité ; un registre par responsable du traitement et par sous-traitant ; dès la conception lors de la construction, par défaut lors de la première utilisation, et le défaut est l'option la plus protectrice. Sécurité : une obligation des deux, adaptée au risque : rendre illisible, garantir, rétablir et tester, avec un cadre comme ISO 27001. Violations : trois types, une procédure en cinq étapes : peser, notifier dans les 72 heures, communiquer dans les meilleurs délais en cas de haut risque, documenter. Retour à la ville et à son fournisseur : la conception était l'obligation de la ville, même si le fournisseur a construit la plateforme ; la sécurité, l'obligation des deux ; et la notification dans les 72 heures, l'obligation de la ville, après que le fournisseur l'avait avertie dans les meilleurs délais. Avant les exercices, une tâche. Mettez l'audio en pause et cherchez si votre organisation a une politique de protection des données approuvée par la direction, quand le registre a été mis à jour pour la dernière fois, et s'il existe une procédure de violation avec un mécanisme de pondération. À la sécurité, deux boutons mènent aux approfondissements. Ensuite, il y a dix questions."}], "quiz": [{"q": "Pourquoi dit-on que le chapitre IV concrétise la responsabilité (accountability) ?", "options": ["Parce que le chapitre fixe les amendes avec lesquelles l'autorité de contrôle impose le respect des principes.", "Parce qu'il répète les principes du deuxième chapitre, mais du point de vue du sous-traitant.", "Parce qu'il dit comment garantir et démontrer le respect : mesures, documents, procédures, délégué.", "Parce qu'il donne à la personne concernée le droit de contrôler et d'imposer elle-même les mesures de l'organisation."], "answer": 2, "feedback": ["Les amendes figurent dans un autre chapitre ; le chapitre IV porte sur ce que l'organisation doit faire elle-même.", "Le chapitre ne répète pas les principes ; il développe comment vous les garantissez et les démontrez.", "Exact. La responsabilité demande de respecter et de démontrer ; le chapitre IV dit comment : mesures, politique, registre, procédures, délégué.", "Les droits de la personne concernée figurent au chapitre III ; le chapitre IV s'adresse à l'organisation."]}, {"q": "Un fournisseur de logiciels construit, à la demande d'un hôpital, un nouveau portail patients. Qui porte, selon le règlement, l'obligation de protection des données dès la conception ?", "options": ["L'hôpital, comme responsable du traitement, même si le fournisseur construit.", "Le fournisseur, parce qu'il conçoit le portail et fait tous les choix techniques.", "Les deux conjointement, comme c'est le cas pour la sécurité du traitement.", "Le délégué à la protection des données de l'hôpital, qui approuve la conception."], "answer": 0, "feedback": ["Exact. La protection des données dès la conception est exclusivement une obligation du responsable du traitement, même lorsqu'un sous-traitant développe le produit.", "Le fournisseur fait les choix, mais l'article s'adresse exclusivement au responsable du traitement ; c'est lui qui doit imposer les exigences et contrôler.", "La sécurité s'applique aux deux, mais l'article sur la conception ne s'adresse qu'au responsable du traitement.", "Le DPO conseille, mais ne porte pas l'obligation ; elle repose sur le responsable du traitement."]}, {"q": "Quelle obligation s'applique expressément au responsable du traitement et au sous-traitant ?", "options": ["La communication d'une violation aux personnes concernées lorsque le risque est élevé.", "L'établissement d'une politique de protection des données lorsque cela est proportionné.", "L'analyse d'impact relative à la protection des données pour les traitements à haut risque probable.", "La sécurité du traitement, adaptée au risque que présente le traitement."], "answer": 3, "feedback": ["La communication aux personnes concernées est une obligation du responsable du traitement.", "La politique de protection des données est une obligation du responsable du traitement.", "L'analyse d'impact repose sur le responsable du traitement ; le sous-traitant apporte son aide.", "Exact. L'article sur la sécurité nomme ensemble le responsable du traitement et le sous-traitant comme sujet ; le sous-traitant a sa propre obligation de sécurité."]}, {"q": "Quelle est la différence entre la politique de protection des données et la déclaration de confidentialité ?", "options": ["Il n'y a pas de différence : les deux documents décrivent aux personnes concernées quelles données l'organisation traite et pourquoi.", "La politique est interne et portée : qui fait quoi, procédures, accès ; la déclaration de confidentialité est externe.", "La déclaration de confidentialité est obligatoire pour chaque organisation, la politique seulement pour les autorités et les grandes entreprises.", "La politique est rédigée par l'autorité de contrôle ; la déclaration de confidentialité par l'organisation elle-même."], "answer": 1, "feedback": ["Ce sont deux documents différents avec un public différent.", "Exact. La politique de protection des données se compose de lignes de conduite internes ; la déclaration de confidentialité informe les personnes concernées vers l'extérieur.", "La politique est requise lorsqu'elle est proportionnée au traitement, ce qui vaut pour la plupart des organisations, pas seulement pour les autorités ou les grandes entreprises.", "Les deux documents sont rédigés par l'organisation elle-même."]}, {"q": "Une application pour un club de course à pied montre par défaut les nouveaux membres à tous les autres membres, avec leurs parcours. Quelle obligation est ici en jeu ?", "options": ["La sécurité du traitement, parce que les parcours ne sont pas stockés chiffrés sur le serveur.", "L'obligation de notification, parce que le partage des parcours est une violation de données à caractère personnel.", "La protection des données par défaut : pas plus largement accessible que nécessaire par défaut.", "Aucune, tant que le membre peut adapter lui-même le réglage par la suite dans son profil."], "answer": 2, "feedback": ["Le chiffrement n'est pas ici le problème ; le problème est ce qui se passe sans que l'utilisateur change quoi que ce soit.", "Un réglage conçu pour partager n'est pas une violation de la sécurité mais un problème de paramètres par défaut.", "Exact. La protection par défaut porte aussi sur l'accessibilité : par défaut, seulement ce qui est nécessaire, et l'utilisateur choisit lui-même de partager davantage.", "Que le membre puisse l'adapter par la suite ne suffit pas : le défaut lui-même doit être le plus protecteur."]}, {"q": "Dans quelle catégorie d'amendes relèvent les violations des obligations relatives à la conception, aux paramètres par défaut et à la sécurité ?", "options": ["Jusqu'à 10 millions d'euros ou 2 % du chiffre d'affaires annuel mondial, si ce montant est plus élevé.", "Jusqu'à 20 millions d'euros ou 4 % du chiffre d'affaires annuel mondial, comme les principes.", "Seulement une réprimande ou une injonction ; les amendes ne valent que pour les droits de la personne concernée.", "Jusqu'à 1 million d'euros, fixé dans la loi-cadre belge."], "answer": 0, "feedback": ["Exact. Les obligations du chapitre IV relèvent de la première catégorie : jusqu'à 10 millions d'euros ou 2 % du chiffre d'affaires annuel mondial.", "La catégorie de 20 millions ou 4 % vaut pour les principes, les bases juridiques, les droits de la personne concernée et les transferts.", "Ces obligations aussi peuvent être sanctionnées d'une amende.", "Les catégories figurent dans le règlement lui-même, pas dans une loi belge."]}, {"q": "Un bureau comptable tient l'administration des salaires pour cinquante clients. Que doit contenir son registre au sujet de ces traitements ?", "options": ["Rien : seuls les clients doivent, comme responsables du traitement, tenir un registre de leur administration des salaires.", "Le même registre que ses clients, avec les finalités et la base juridique de chaque traitement salarial.", "Rien, tant que le contrat de sous-traitance avec chaque client décrit suffisamment les traitements.", "Son propre registre de sous-traitant : par client, les catégories de traitements, les transferts et la sécurité."], "answer": 3, "feedback": ["Le sous-traitant aussi tient son propre registre ; l'obligation repose sur les deux.", "Le sous-traitant ne reprend pas les finalités ni la base juridique ; elles figurent dans le registre du responsable du traitement.", "Le contrat de sous-traitance ne remplace pas le registre ; ce sont deux obligations différentes.", "Exact. Le sous-traitant tient un registre des catégories de traitements par responsable du traitement, avec les transferts et les mesures de sécurité ; les finalités et la base juridique sont déterminées par le client."]}, {"q": "Quelle situation est une violation de données à caractère personnel ?", "options": ["Une organisation traite des données clients à des fins de marketing sans disposer d'une base juridique valable.", "Un rançongiciel chiffre les dossiers patients d'un hôpital sans sauvegarde utilisable.", "Une organisation ne répond à une demande d'accès qu'après six semaines.", "Une déclaration de confidentialité ne mentionne pas la durée de conservation des données."], "answer": 1, "feedback": ["C'est une violation du règlement, mais pas une violation de la sécurité ; ce n'est donc pas une violation de données à caractère personnel.", "Exact. La perte de disponibilité à la suite d'une violation de la sécurité est une violation de données à caractère personnel.", "Une réponse tardive est une violation des droits de la personne concernée, pas de la sécurité.", "Une déclaration de confidentialité incomplète est une violation de l'obligation d'information, pas de la sécurité."]}, {"q": "Un responsable du traitement découvre le lundi à 9 heures une violation présentant un risque probable. Que doit-il faire ?", "options": ["Notifier dans le mois à l'Autorité de protection des données, comme pour une demande d'une personne concernée.", "Informer d'abord les personnes concernées et ensuite, si elles introduisent une plainte, l'autorité de contrôle.", "Notifier au plus tard le jeudi à 9 heures via le portail de l'Autorité de protection des données.", "Documenter seulement en interne ; la notification à l'autorité de contrôle n'est obligatoire qu'en cas de haut risque."], "answer": 2, "feedback": ["Le délai est de 72 heures, pas d'un mois.", "La notification à l'autorité de contrôle ne dépend pas d'une plainte ; la communication aux personnes concernées est une obligation distincte en cas de haut risque.", "Exact. Dans les 72 heures après la prise de connaissance, via le portail, et par phases si toutes les informations ne sont pas encore disponibles.", "En cas de risque, la notification est obligatoire ; documenter seulement en interne suffit lorsqu'un risque est improbable."]}, {"q": "Quel est le rôle du DPO lors d'une violation de données à caractère personnel ?", "options": ["Il rappelle l'obligation de notification, conseille et apporte un soutien administratif, mais ne décide pas.", "Il décide si la violation est notifiée et signe la notification au nom de l'organisation auprès de l'autorité de contrôle.", "Il prend la direction de l'équipe d'incident et détermine les mesures techniques de rétablissement.", "Il notifie la violation directement aux personnes concernées sans intervention de la direction."], "answer": 0, "feedback": ["Exact. Le DPO conseille et soutient ; la décision et la responsabilité restent chez le responsable du traitement, de sorte que le DPO peut rester indépendant.", "La décision de notifier appartient au responsable du traitement, pas au DPO.", "Le traitement technique est une tâche de l'équipe d'incident ; le DPO conseille.", "La communication aux personnes concernées est une décision du responsable du traitement."]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const RS = C.recordings ? C.recordings : (C.recording ? [Object.assign({id:'main'}, C.recording)] : []);
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = C.module + ' · ' + C.title + ' · Data Protection Institute';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });

      case 'quote':
        body = '<div class="quote"><div class="src">'+esc(s.source)+'</div><div class="txt">'+esc(s.quote).replace(/\n/g,'<br>')+'</div></div>'+(s.bullets?bullets(s.bullets):''); break;
      case 'reveal':
        body = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; break;
      case 'summary':
        body = '<div class="keyline">'+esc(s.key)+'</div>'+bullets(s.bullets); break;
      case 'cards':
        /* s.cards: [{k, t, sub, hl}], s.cols (aantal kolommen), optioneel s.intro */
        body = (s.intro?'<p class="intro" style="font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.2vw,14px);color:var(--text)">'+esc(s.intro)+'</p>':'')+'<div class="cards'+(s.cards.length>6?' dense':'')+'" style="grid-template-columns:repeat('+(s.cols||Math.min(s.cards.length,4))+',minmax(0,1fr))">'+s.cards.map((c,n)=>'<div class="cd'+(c.hl?' hl':'')+'">'+(s.numbered===false?'':'<div class="n">'+(n+1)+'</div>')+'<b>'+esc(c.k)+'</b>'+(c.t?'<span>'+esc(c.t)+'</span>':'')+(c.sub?'<div class="sub">'+esc(c.sub)+'</div>':'')+'</div>').join('')+'</div>'; break;
      case 'table':
        /* s.head: [..], s.rows: [[..]], s.hl: [rij-indexen], s.dim: [rij-indexen] */
        body = (s.intro?'<p style="font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.2vw,14px)">'+esc(s.intro)+'</p>':'')+'<table class="tbl">'+(s.head?'<thead><tr>'+s.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+s.rows.map((r,n)=>'<tr class="'+((s.hl||[]).includes(n)?'hl':((s.dim||[]).includes(n)?'dim':''))+'">'+r.map((c,k)=>{ const rl=(k===0&&s.rowlinks)?s.rowlinks[n]:null; if(!rl) return '<td>'+esc(c)+'</td>';
          /* s.rowlinks[n]: {url, rec:{v,t}} -> eerste cel aanklikbaar + kleine sprongknop naar de opname */
          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':
        /* s.items: [{t, end, k, t2}] -> sprongknoppen naar de opname */
        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+((s.question||s.layout==='stack')?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
