name: fetch-media
# Haalt avatarvideo's (HeyGen) op volgens media/manifests/*.json, zet ze om naar 640x360 (H.264 + AAC)
# en bewaart ze in de map die het manifest opgeeft. Bestaande bestanden worden niet opnieuw opgehaald.
on:
  push:
    paths: ['media/manifests/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-media
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ophalen en omzetten
        run: python3 .github/fetch_media.py
      - name: Commit
        run: |
          git config user.name "fetch-media"; git config user.email "fetch-media@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then echo "Niets nieuw"; exit 0; fi
          git commit -m "Avatarvideo's opgehaald"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
