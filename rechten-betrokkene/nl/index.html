 deze module.", "result_mid": "Goed op weg. Bekijk de feedback bij de vragen die je fout had en probeer opnieuw.", "result_low": "Bekijk de presentatie nog eens en probeer daarna opnieuw. De feedback bij elke vraag helpt je op weg.", "retry": "Opnieuw oefenen", "review": "Presentatie herbekijken", "your_answer": "Jouw antwoord", "open_link": "Open de link in een nieuw tabblad", "practice_hint": "Praktijkopdracht: pauzeer, voer de stappen uit en klik daarna op Volgende.", "back_to_slides": "Terug naar de slides", "resume_quiz": "Verder met de oefeningen", "download_pdf": "Download je resultaat als PDF", "pdf_title": "Resultaat oefeningen", "pdf_question": "Vraag", "pdf_your": "Jouw antwoord", "pdf_correct": "Juiste antwoord", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Datum", "pdf_not_answered": "niet beantwoord", "transcript": "Gesproken tekst", "show_text": "Tekst tonen", "hide_text": "Tekst verbergen", "ai_notice_title": "Transparantie over AI", "ai_notice": "De stem in deze module is door AI gegenereerd op basis van de stem van Peter Berghmans, met zijn toestemming. Tekst en slides zijn met AI-ondersteuning gemaakt en door de docent inhoudelijk nagekeken.", "ai_voice_label": "AI-stem", "ai_icon_alt": "Officieel EU-label: AI-gegenereerde inhoud", "ai_footer": "Stem en avatar door AI gegenereerd (met toestemming van de spreker); tekst en slides met AI-ondersteuning gemaakt en door de docent nagekeken.", "skip_to_quiz": "Meteen naar de oefeningen", "nav_home": "Start", "nav_slides": "Presentatie", "nav_quiz": "Oefeningen", "speed": "Snelheid", "reveal_question": "Wat denk jij?", "reveal_show": "Toon het antwoord", "optional_label": "Verdieping (optioneel)", "optional_skip": "Verdieping overslaan", "optional_intro": "De volgende slides zijn een optionele verdieping. Je kunt ze overslaan en meteen naar de oefeningen gaan.", "autoplay_short": "Auto", "read_label": "Open de AVG op EUR-Lex", "deep_label": "Verdieping", "deep_btn": "Open de verdieping"}, "slides": [{"id": 1, "type": "title", "title": "De rechten van de betrokkene: van informatie tot beperking", "subtitle": "Hoofdstuk III van de AVG: hoe de rechten samenhangen, welke spelregels voor elk verzoek gelden, en wanneer een recht wél en niet van toepassing is", "script": "Een klant van een webshop stuurt een mail. Wat weten jullie allemaal over mij, en wissen jullie dat alstublieft. De klantendienst stuurt de mail door naar de IT-dienst, die naar de juridische dienst, en zes weken later ligt hij bij de functionaris voor gegevensbescherming. Ondertussen heeft de klant al een klacht ingediend bij de toezichthouder. Niet omdat de webshop iets fout deed met zijn gegevens, maar omdat niemand wist wat die twee zinnen juridisch betekenden, en wie er binnen welke termijn op moest antwoorden. In dit kwartier bekijken we het hoofdstuk van de AVG dat daarover gaat: de rechten van de betrokkene. Eerst de structuur en de samenhang, dan de spelregels die voor elk verzoek gelden, en daarna elk recht kort: wat het inhoudt, en wanneer het wél en niet van toepassing is. Bij elk recht kun je meteen doorklikken naar een korte verdieping. Na afloop herken je die twee zinnen als twee verzoeken, en weet je wat er binnen de maand moet gebeuren."}, {"id": 2, "type": "table", "chip": "Waar we zitten", "title": "Hoofdstuk III: de rechten van de betrokkene, tussen de beginselen en de verplichtingen", "head": ["Hoofdstuk", "Onderwerp"], "rows": [["I", "Algemene bepalingen: toepassingsgebied en definities"], ["II", "Beginselen: de basisprincipes, de rechtsgronden, de bijzondere categorieën"], ["III", "Rechten van de betrokkene (artikelen 12 tot en met 23)"], ["IV", "Verwerkingsverantwoordelijke en verwerker: register, beveiliging, datalekken, DPIA, functionaris"], ["V", "Doorgiften naar derde landen"], ["VI–VII", "Toezichthoudende autoriteiten en samenwerking"], ["VIII", "Beroep, aansprakelijkheid en sancties"], ["IX–XI", "Specifieke situaties, gedelegeerde handelingen, slotbepalingen"]], "hl": [2], "read": {"text": "Bekijk de inhoudsopgave van de AVG: hoofdstuk III volgt meteen op de beginselen.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Eerst de plaats in de verordening. Kijk naar de tabel. De AVG telt elf hoofdstukken. De eerste twee ken je al: het toepassingsgebied en de definities, en daarna de beginselen, met de basisprincipes, de rechtsgronden en de bijzondere categorieën. Dat gaat over wat een organisatie mag doen. Het derde hoofdstuk draait het perspectief om. Het bekijkt dezelfde verwerking door de ogen van de persoon over wie de gegevens gaan: wat mag die persoon vragen, en wat moet de organisatie dan doen? Dat is het hoofdstuk van deze module. Het staat niet toevallig op deze plaats. De beginselen eisen dat een verwerking rechtmatig, behoorlijk en transparant is. De rechten zijn de manier waarop de betrokkene dat zelf kan controleren en afdwingen. En het vierde hoofdstuk, over de verplichtingen van de verwerkingsverantwoordelijke, bouwt daarop verder: wie antwoordt, hoe je dat organiseert, hoe je dat aantoont. Onthoud dus: na de beginselen komen de rechten, en die rechten zijn het sluitstuk van de transparantie."}, {"id": 3, "type": "chain", "chip": "De opbouw", "title": "Vijf afdelingen: spelregels, informatie en inzage, rectificatie en wissing, bezwaar en geautomatiseerde besluiten, beperkingen", "steps": [{"k": "Afdeling 1", "t": "Transparantie en regelingen: de spelregels voor elk verzoek (artikel 12)."}, {"k": "Afdeling 2", "t": "Informatie en toegang: informatie bij rechtstreekse en onrechtstreekse verzameling, en het recht van inzage (artikelen 13 tot 15)."}, {"k": "Afdeling 3", "t": "Rectificatie en wissing: rectificatie, wissing, beperking, kennisgeving aan ontvangers en overdraagbaarheid (artikelen 16 tot 20)."}, {"k": "Afdeling 4", "t": "Bezwaar en geautomatiseerde individuele besluitvorming (artikelen 21 en 22)."}, {"k": "Afdeling 5", "t": "Beperkingen: wanneer een wet de rechten mag inperken (artikel 23)."}], "read": {"text": "Lees de titels van de vijf afdelingen in hoofdstuk III.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Het hoofdstuk bestaat uit vijf afdelingen, en de volgorde is logisch. De eerste afdeling bevat geen recht, maar de spelregels die voor alle rechten gelden: in welke vorm, binnen welke termijn, tegen welke prijs. De tweede afdeling gaat over weten: welke informatie je krijgt wanneer een organisatie je gegevens verzamelt, en het recht om inzage te vragen. De derde afdeling gaat over ingrijpen op de gegevens zelf: laten verbeteren, laten wissen, het gebruik laten beperken, en ze meenemen naar een andere aanbieder. De vierde afdeling gaat over ingrijpen op de verwerking: bezwaar maken, en niet onderworpen worden aan een besluit dat een machine alleen neemt. De vijfde afdeling is de uitzondering: de gevallen waarin een wet die rechten mag beperken. Onthoud dus: eerst de spelregels, dan weten, dan ingrijpen op de gegevens, dan op de verwerking, en tot slot de grenzen."}, {"id": 4, "type": "figure", "chip": "De samenhang", "title": "Informatie is het startpunt; de andere rechten grijpen in op de verwerking of op de gegevens", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 540\" role=\"img\" aria-label=\"Stroomschema: het recht op informatie als startpunt; rechten met impact op de verwerking (toestemming intrekken, bezwaar, geautomatiseerde besluiten) en rechten met impact op de gegevens (inzage, overdraagbaarheid), die kunnen leiden tot rectificatie, wissing en beperking.\"><defs><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"ar pd\"/><\/marker><\/defs><rect class=\"lane\" x=\"330\" y=\"20\" width=\"250\" height=\"250\" rx=\"14\"/><text class=\"lane\" x=\"455\" y=\"42\" text-anchor=\"middle\">Impact op de verwerking<\/text><rect class=\"lane\" x=\"330\" y=\"300\" width=\"250\" height=\"220\" rx=\"14\"/><text class=\"lane\" x=\"455\" y=\"322\" text-anchor=\"middle\">Impact op de gegevens<\/text><rect class=\"p\" x=\"20\" y=\"215\" width=\"190\" height=\"110\" rx=\"12\"/><text x=\"115.0\" y=\"253.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">Recht op<\/text><text x=\"115.0\" y=\"276.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">informatie<\/text><text x=\"115.0\" y=\"299.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">(12 + 13 + 14)<\/text><text class=\"lbl\" x=\"115\" y=\"345\" text-anchor=\"middle\">Startpunt<\/text><rect class=\"ee\" x=\"350\" y=\"55\" width=\"210\" height=\"60\" rx=\"12\"/><text x=\"455.0\" y=\"80.3\" text-anchor=\"middle\" style=\"font-size:18px\">Toestemming intrekken<\/text><text x=\"455.0\" y=\"102.3\" text-anchor=\"middle\" style=\"font-size:18px\">(7, lid 3)<\/text><rect class=\"ee\" x=\"350\" y=\"125\" width=\"210\" height=\"60\" rx=\"12\"/><text x=\"455.0\" y=\"161.3\" text-anchor=\"middle\" style=\"font-size:18px\">Recht van bezwaar (21)<\/text><rect class=\"ee\" x=\"350\" y=\"195\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"455.0\" y=\"213.1\" text-anchor=\"middle\" style=\"font-size:16px\">Niet onderworpen aan<\/text><text x=\"455.0\" y=\"233.1\" text-anchor=\"middle\" style=\"font-size:16px\">geautomatiseerde<\/text><text x=\"455.0\" y=\"253.1\" text-anchor=\"middle\" style=\"font-size:16px\">besluiten (22)<\/text><rect class=\"ee\" x=\"350\" y=\"340\" width=\"210\" height=\"70\" rx=\"12\"/><text x=\"455.0\" y=\"370.3\" text-anchor=\"middle\" style=\"font-size:18px\">Recht van inzage<\/text><text x=\"455.0\" y=\"392.3\" text-anchor=\"middle\" style=\"font-size:18px\">en kopie (15)<\/text><rect class=\"ee\" x=\"350\" y=\"430\" width=\"210\" height=\"70\" rx=\"12\"/><text x=\"455.0\" y=\"460.3\" text-anchor=\"middle\" style=\"font-size:18px\">Overdraagbaarheid<\/text><text x=\"455.0\" y=\"482.3\" text-anchor=\"middle\" style=\"font-size:18px\">(20)<\/text><rect class=\"p\" x=\"770\" y=\"60\" width=\"210\" height=\"80\" rx=\"12\"/><text x=\"875.0\" y=\"95.3\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700\">Beperking van de<\/text><text x=\"875.0\" y=\"117.3\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700\">verwerking (18)<\/text><rect class=\"ee\" x=\"770\" y=\"230\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"875.0\" y=\"268.8\" text-anchor=\"middle\" style=\"font-size:18px\">Rectificatie (16)<\/text><rect class=\"ee\" x=\"770\" y=\"320\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"875.0\" y=\"358.8\" text-anchor=\"middle\" style=\"font-size:18px\">Wissing (17)<\/text><rect class=\"ee\" x=\"770\" y=\"420\" width=\"210\" height=\"80\" rx=\"12\"/><text x=\"875.0\" y=\"455.45\" text-anchor=\"middle\" style=\"font-size:17px\">Vergetelheid<\/text><text x=\"875.0\" y=\"476.45\" text-anchor=\"middle\" style=\"font-size:17px\">(17, lid 2)<\/text><line class=\"fl pd\" x1=\"212\" y1=\"250\" x2=\"330\" y2=\"150\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"255\" y=\"180\" text-anchor=\"middle\">impact op de verwerking<\/text><line class=\"fl pd\" x1=\"212\" y1=\"290\" x2=\"330\" y2=\"400\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"255\" y=\"365\" text-anchor=\"middle\">impact op de gegevens<\/text><line class=\"fl pd\" x1=\"560\" y1=\"155\" x2=\"770\" y2=\"110\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"665\" y=\"115\" text-anchor=\"middle\">gevolg<\/text><line class=\"fl pd\" x1=\"560\" y1=\"360\" x2=\"770\" y2=\"130\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"690\" y=\"215\" text-anchor=\"middle\">kan leiden tot<\/text><line class=\"fl pd\" x1=\"560\" y1=\"465\" x2=\"770\" y2=\"460\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"665\" y=\"448\" text-anchor=\"middle\">kan leiden tot<\/text><line class=\"fl pd\" x1=\"875\" y1=\"230\" x2=\"875\" y2=\"142\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"930\" y=\"190\" text-anchor=\"middle\">kan leiden tot<\/text><\/svg>", "caption": "De rechten als geheel: het recht op informatie als startpunt, twee groepen rechten, en wat daaruit kan volgen.", "script": "Nu de samenhang, en dit is de figuur die je moet onthouden. Alles begint links, bij het recht op informatie: wie niet weet dat een organisatie zijn gegevens verwerkt, zal het moeilijk hebben om enig ander recht uit te oefenen. Van daaruit vertrekken twee pijlen. De bovenste gaat naar de rechten met impact op de verwerking. De betrokkene zegt: stop, of niet zo. Hij trekt zijn toestemming in, maakt bezwaar, of weigert onderworpen te worden aan een besluit dat een machine alleen neemt. De onderste pijl gaat naar de rechten met impact op de gegevens zelf. De betrokkene zegt: laat zien, of geef mee. Hij vraagt inzage en een kopie, of zijn gegevens in een bruikbaar formaat om ze mee te nemen. En dan de pijlen naar rechts. Wie inzage kreeg, ontdekt soms een fout en vraagt rectificatie, of vindt dat de gegevens weg mogen en vraagt wissing. Zolang dat onderzocht wordt, of een bezwaar wordt afgewogen, kan hij de beperking vragen: de gegevens blijven staan, maar worden niet gebruikt. Onthoud dus: informatie is het begin, en rectificatie, wissing en beperking zijn de gevolgen."}, {"id": 5, "type": "bullets", "chip": "Afdeling 1 · de spelregels", "title": "Eén regime voor elk verzoek: wie, vorm, kanaal, termijn, kosten, weigering en identiteit", "bullets": [{"k": "Wie", "t": "de verwerkingsverantwoordelijke voert de rechten van de betrokkene uit; de verwerker kan daarbij bijstand verlenen, maar draagt de eindverantwoordelijkheid niet."}, {"k": "Vorm", "t": "beknopt, transparant, begrijpelijk, gemakkelijk toegankelijk en in duidelijke en eenvoudige taal; schriftelijk of elektronisch, mondeling als de betrokkene dat vraagt; afgestemd op het doelpubliek, bijvoorbeeld op maat van kinderen als de verwerking op hen gericht is."}, {"k": "Kanaal", "t": "de verwerkingsverantwoordelijke kiest een duidelijk kanaal om de informatie over te brengen en de rechten te laten uitoefenen, zonder hindernissen."}, {"k": "Termijn", "t": "antwoord onverwijld en uiterlijk binnen een maand; bij complexe of talrijke verzoeken verlengbaar met twee maanden, mits de betrokkene daarvan binnen de eerste maand op de hoogte wordt gebracht."}, {"k": "Kosteloos", "t": "in principe gratis; alleen bij kennelijk ongegronde of buitensporige verzoeken mag een redelijke vergoeding worden gevraagd of geweigerd, en de organisatie moet dat aantonen."}, {"k": "Weigering", "t": "wie niet ingaat op een verzoek, zegt binnen de maand waarom, en wijst op de klacht bij de toezichthouder en het beroep bij de rechter."}, {"k": "Identiteit", "t": "bij redelijke twijfel mag de organisatie aanvullende informatie vragen om de identiteit te bevestigen."}], "read": {"text": "Lees de volledige spelregels in artikel 12, inclusief de termijnen en de regeling voor kennelijk ongegronde verzoeken.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Laat ons eerst de spelregels bespreken, want die gelden voor elk verzoek. Eerst en vooral: hoewel de verwerker bijstand kan verlenen door een verzoek te ondersteunen, is het de verwerkingsverantwoordelijke die de rechten van de betrokkene uitvoert. Dit is mogelijk het belangrijkste gevolg van een kwalificatie als verwerkingsverantwoordelijke, met name de eindverantwoordelijkheid over het uitvoeren van de rechten van een betrokkene. We lijsten de spelregels op in zes punten. Het eerste punt is de vorm: de verwerkingsverantwoordelijke communiceert informatie over de verwerking beknopt, begrijpelijk, in duidelijke en eenvoudige taal, en afgestemd op het doelpubliek. Indien de verwerking bijvoorbeeld op kinderen gericht is, dan moet de informatie op hun maat worden voorzien. Een tweede spelregel is het informatiekanaal: de verwerkingsverantwoordelijke kiest voor een duidelijk kanaal om de informatie over te brengen of de rechten te laten uitoefenen. De derde spelregel is de termijn waarbinnen de rechten moeten worden uitgeoefend. Voor een DPO is deze termijn een belangrijk element: de verwerkingsverantwoordelijke antwoordt onverwijld en uiterlijk binnen een maand. Alleen bij complexe of talrijke verzoeken mag die termijn met twee maanden worden verlengd, en dat laat je binnen die eerste maand weten. De webshop uit het begin was na zes weken doorsturen dus al te laat. De vierde spelregel is de kosteloosheid: alleen bij een kennelijk ongegrond of buitensporig verzoek, bijvoorbeeld elke week dezelfde vraag, mag je een vergoeding vragen of weigeren, en dat moet je aantonen. De vijfde spelregel is de weigering: wie een verzoek afwijst, zegt binnen de maand waarom, en wijst op de klacht bij de toezichthouder en het beroep bij de rechter. De zesde en laatste maatregel is de identiteit: bij redelijke twijfel mag je bijkomende informatie vragen, maar niet meer dan nodig. Onthoud dus: de verwerkingsverantwoordelijke voert uit, begrijpelijk, via een duidelijk kanaal, binnen de maand, gratis, en bij weigering met uitleg."}, {"id": 6, "type": "quote", "chip": "De uitzondering vóór het hoofdstuk", "title": "Wie de betrokkene niet kan identificeren, moet niet alle rechten toekennen", "source": "Artikel 11, lid 2 AVG", "quote": "Wanneer de verwerkingsverantwoordelijke in de in lid 1 van dit artikel bedoelde gevallen kan aantonen dat hij de betrokkene niet kan identificeren, stelt hij de betrokkene daarvan indien mogelijk in kennis. In dergelijke gevallen zijn de artikelen 15 tot en met 20 niet van toepassing, behalve wanneer de betrokkene, met het oog op de uitoefening van zijn rechten uit hoofde van die artikelen, aanvullende gegevens verstrekt die het mogelijk maken hem te identificeren.", "bullets": [{"k": "Waarom dit artikel in hoofdstuk II staat", "t": "het is geen recht van de betrokkene maar een gevolg van minimale gegevensverwerking: wie geen identificerende gegevens nodig heeft, moet er geen bijhouden, ook niet om aan de AVG te voldoen."}, {"k": "Het gevolg voor de rechten", "t": "kan de organisatie aantonen dat ze de betrokkene niet kan identificeren, dan gelden inzage, rectificatie, wissing, beperking, kennisgeving en overdraagbaarheid niet, tenzij de betrokkene zelf aanvullende gegevens aanreikt."}, {"k": "De link met de spelregels", "t": "de verwerkingsverantwoordelijke mag een verzoek niet zomaar weigeren met het argument dat hij de persoon niet kent; hij moet aantonen dat hij hem niet kan identificeren."}], "read": {"text": "Lees artikel 11 volledig, en artikel 12, lid 2, dat ernaar verwijst.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Nog één bepaling, en ze staat net vóór het hoofdstuk, aan het einde van de beginselen. Een voorbeeld. Een website telt bezoekers met gegevens die ze aan niemand kan koppelen. Iemand mailt: geef mij inzage in mijn gegevens. De organisatie kan hem niet terugvinden. De regel zegt dan twee dingen. Eén: wie voor zijn doel geen identificatie nodig heeft, moet geen extra identificerende gegevens bijhouden, alleen maar om aan de verordening te voldoen. Dat is een gevolg van minimale gegevensverwerking, en daarom staat deze bepaling bij de beginselen en niet bij de rechten. Twee: kan de organisatie aantonen dat ze de betrokkene niet kan identificeren, dan gelden de rechten die aan de gegevens zelf raken niet: inzage, rectificatie, wissing, beperking, kennisgeving en overdraagbaarheid. Tenzij de betrokkene zelf aanvullende gegevens geeft waarmee hij wél terug te vinden is. Let op het woord aantonen: een organisatie mag niet zomaar zeggen dat ze iemand niet kent. Onthoud dus: wie niemand kan identificeren, moet ook niemand inzage geven, maar moet dat wel aantonen."}, {"id": 7, "type": "compare", "chip": "Afdeling 2 · informatie", "title": "Het recht op informatie: rechtstreeks bij de betrokkene verzameld, of niet", "left": {"head": "Rechtstreeks bij de betrokkene (artikel 13)", "items": ["Moment: bij de verkrijging van de gegevens, dus op het formulier, in de app, aan de balie", "Inhoud: wie, waarvoor, op welke rechtsgrond, aan wie, hoelang, welke rechten, klacht bij de toezichthouder", "Plus: of de betrokkene verplicht is de gegevens te geven, en wat er gebeurt als hij dat niet doet", "Niet nodig: wanneer en voor zover de betrokkene de informatie al heeft"]}, "right": {"head": "Niet van de betrokkene verkregen (artikel 14)", "items": ["Moment: binnen een redelijke termijn en uiterlijk binnen een maand, bij het eerste contact, of bij de eerste doorgifte aan een ander", "Inhoud: dezelfde informatie, plus de categorieën van gegevens en de bron", "Uitzonderingen: de betrokkene heeft de informatie al, informeren is onmogelijk of onevenredig, de wet schrijft de verkrijging voor, of een beroepsgeheim geldt", "Typisch: adressenlijsten, gegevens van een partner of een ouder, gegevens van een andere organisatie"]}, "deep": {"url": "verdieping/informatie/index.html", "text": "de twee informatieplichten in detail, met beslissingen van de Gegevensbeschermingsautoriteit over te late, onvolledige of ontbrekende informatie."}, "read": {"text": "Lees de lijst van te verstrekken informatie in de artikelen 13 en 14.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Dan het startpunt: het recht op informatie. De verordening maakt een onderscheid naargelang waar de gegevens vandaan komen. Links: de gegevens worden rechtstreeks bij de betrokkene verzameld, op een formulier, in een app, aan de balie. Dan krijgt hij de informatie op dat moment: wie de organisatie is, waarvoor en op welke rechtsgrond ze de gegevens gebruikt, aan wie ze doorgegeven worden, hoelang ze bewaard blijven, welke rechten hij heeft, en dat hij klacht kan indienen. En iets dat vaak vergeten wordt: of hij verplicht is de gegevens te geven, en wat er gebeurt als hij dat niet doet. Rechts staat de tweede situatie: de gegevens komen niet van de betrokkene zelf. Denk aan een adressenlijst die je koopt, aan de partner die een werknemer opgeeft als contactpersoon, of aan gegevens die een andere organisatie je bezorgt. In die situatie heeft de betrokkene recht op dezelfde informatie als in de eerste situatie, met twee elementen extra: welke categorieën van gegevens je hebt, en waar ze vandaan komen. Wat wél verschilt, is het moment. Je kunt de informatie niet geven op het ogenblik van de verzameling, want de betrokkene is daar niet bij. Daarom geeft de verordening drie mogelijke momenten, en het vroegste geldt: binnen een redelijke termijn en uiterlijk een maand nadat je de gegevens kreeg; op het moment van het eerste contact, als je de gegevens gebruikt om met de persoon te communiceren; of op het moment van de eerste doorgifte, als je de gegevens aan iemand anders bezorgt. Voor deze tweede situatie bestaan er ook uitzonderingen op de informatieplicht, bijvoorbeeld wanneer de betrokkene de informatie al heeft, of wanneer informeren onmogelijk is of onevenredig veel inspanning zou vragen. De verdieping bekijkt beide situaties aan de hand van beslissingen van de Gegevensbeschermingsautoriteit. Onthoud dus: zijn de gegevens rechtstreeks bij de betrokkene verzameld, dan informeer je meteen; komen ze van elders, dan informeer je binnen de maand, en vroeger als je eerder contact opneemt of de gegevens doorgeeft."}, {"id": 8, "type": "reveal", "chip": "Denkoefening 1", "title": "De rekruteerder en de referentie", "question": "Een bedrijf ontvangt van een rekruteringskantoor het cv van een kandidate, met daarin de naam en het telefoonnummer van haar vorige leidinggevende als referentie. Het bedrijf belt die leidinggevende op en bewaart zijn antwoorden in het sollicitatiedossier. Moet het bedrijf de leidinggevende informeren, en zo ja, wanneer?", "verdict": "Ja: uiterlijk bij het eerste contact, dus bij het telefoontje zelf", "answer": [{"k": "Waarom", "t": "de gegevens van de leidinggevende (naam, functie, telefoonnummer, zijn uitspraken) komen niet van hemzelf maar van de kandidate; dan geldt de informatieplicht voor onrechtstreeks verkregen gegevens."}, {"k": "Wanneer", "t": "de gegevens worden gebruikt om met hem te communiceren, dus uiterlijk op het moment van het eerste contact: aan het begin van het gesprek zeg je wie je bent, waarvoor je belt en wat er met zijn antwoorden gebeurt."}, {"k": "Hoe", "t": "kort en mondeling bij het gesprek, met een verwijzing naar de privacyverklaring voor de volledige informatie; een aparte brief is niet nodig als de informatie zo gegeven wordt."}], "script": "Eerste denkoefening. Een bedrijf krijgt van een rekruteringskantoor het cv van een kandidate, met de naam en het telefoonnummer van haar vorige leidinggevende als referentie. Het bedrijf belt die man op en noteert zijn antwoorden in het sollicitatiedossier. Moet het bedrijf de leidinggevende informeren, en zo ja, wanneer? Denk even na. … Ja. Zijn naam, zijn telefoonnummer en straks ook zijn uitspraken zijn persoonsgegevens, en ze komen niet van hemzelf maar van de kandidate. Dus geldt de informatieplicht voor onrechtstreeks verkregen gegevens. Wanneer? De gegevens dienen om met hem te communiceren, en dan is het moment uiterlijk het eerste contact: het telefoontje zelf. Aan het begin van het gesprek zeg je wie je bent, waarvoor je belt en wat er met zijn antwoorden gebeurt, en je verwijst naar de privacyverklaring voor de rest. Onthoud dus: ook wie niet solliciteert maar in het dossier terechtkomt, heeft recht op informatie."}, {"id": 9, "type": "quote", "chip": "Afdeling 2 · inzage", "title": "Het recht van inzage bestaat uit twee delen: de inzage zelf en de kopie", "source": "Artikel 15, lid 1 AVG", "quote": "De betrokkene heeft het recht om van de verwerkingsverantwoordelijke uitsluitsel te verkrijgen over het al dan niet verwerken van hem betreffende persoonsgegevens en, wanneer dat het geval is, om inzage te verkrijgen van die persoonsgegevens en van de volgende informatie:", "bullets": [{"k": "Deel 1 · de inzage (lid 1)", "t": "eerst uitsluitsel: verwerkt u gegevens over mij, ja of nee; dan inzage in de gegevens zelf, en informatie over de verwerking: doeleinden, categorieën, ontvangers, bewaartermijn, bron, geautomatiseerde besluitvorming en de andere rechten."}, {"k": "Deel 2 · de kopie (lid 3)", "t": "de betrokkene krijgt een kopie van de gegevens, bij een elektronisch verzoek in een gangbare elektronische vorm; alleen bijkomende kopieën mogen iets kosten."}, {"k": "De grens", "t": "de kopie doet geen afbreuk aan de rechten en vrijheden van anderen: gegevens van derden of bedrijfsgeheimen mag je afschermen, maar dat is geen reden om alles te weigeren."}, {"k": "Wanneer niet", "t": "alleen wanneer de organisatie aantoont dat ze de betrokkene niet kan identificeren, of wanneer een wet het recht beperkt."}], "deep": {"url": "verdieping/inzage/index.html", "text": "hoe je een inzageverzoek afhandelt, wat er in de kopie moet, en wat er daarna kan volgen: rectificatie, wissing, beperking en kennisgeving."}, "read": {"text": "Lees de volledige lijst in artikel 15, lid 1, en de regeling van de kopie in lid 3 en 4.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Het tweede recht in deze afdeling is het recht van inzage, in de praktijk het meest gebruikte. Het is nuttig om dit artikel zelf open te leggen, want het bestaat uit twee duidelijk verschillende delen, en zo zoek je het ook het best op. Het eerste deel is het recht van inzage in strikte zin. Dat begint met uitsluitsel: de betrokkene mag weten of er gegevens over hem worden verwerkt, ja of nee. Is het antwoord ja, dan heeft hij recht op inzage in die gegevens zelf, en daarbovenop op informatie over de verwerking: waarvoor de gegevens dienen, aan wie ze zijn doorgegeven, hoelang ze bewaard blijven, waar ze vandaan komen, en of er geautomatiseerde besluitvorming is. Het tweede deel is het recht op een kopie, en dat staat verderop in het artikel, in een apart lid. De betrokkene krijgt een kopie van de gegevens, bij een elektronisch verzoek in een gangbare elektronische vorm, en die eerste kopie is gratis. Op dat tweede deel staat één grens: de kopie mag geen afbreuk doen aan de rechten van anderen. Gegevens van derden of bedrijfsgeheimen scherm je dus af, maar dat is nooit een reden om het hele verzoek te weigeren. Wanneer geldt het recht niet? Alleen in twee gevallen: wanneer de organisatie aantoont dat ze de persoon niet kan identificeren, en wanneer een wet het recht beperkt. Een inzageverzoek is vaak het begin van iets anders: wie zijn gegevens ziet, ontdekt een fout of vindt dat ze weg mogen. De verdieping toont hoe je zo'n verzoek afhandelt en wat erop volgt. Onthoud dus: het artikel heeft twee delen, eerst de inzage met uitsluitsel, de gegevens en de context, en daarnaast de kopie; lees het ook zo na."}, {"id": 10, "type": "cards", "chip": "Afdeling 3 · ingrijpen op de gegevens", "title": "Rectificatie, wissing, beperking en kennisgeving: de gevolgen van inzage", "cols": 4, "cards": [{"k": "Rectificatie (16)", "t": "onjuiste gegevens onverwijld laten verbeteren en onvolledige gegevens laten aanvullen, rekening houdend met het doel.", "sub": "Altijd van toepassing"}, {"k": "Wissing (17)", "t": "gegevens laten wissen als ze niet meer nodig zijn, bij intrekking van toestemming, na bezwaar, bij onrechtmatige verwerking, bij een wettelijke plicht, of bij onlinediensten aan kinderen.", "sub": "Niet bij: vrijheid van meningsuiting, wettelijke plicht, volksgezondheid, archivering, rechtsvordering"}, {"k": "Beperking (18)", "t": "de gegevens blijven bewaard maar worden niet gebruikt: tijdens de controle van de juistheid, bij bezwaar, of als de betrokkene ze nodig heeft voor een rechtsvordering.", "sub": "Een pauzeknop, geen wissing"}, {"k": "Kennisgeving (19)", "t": "elke rectificatie, wissing of beperking wordt gemeld aan iedere ontvanger aan wie de gegevens zijn verstrekt, tenzij dat onmogelijk is of onevenredig veel inspanning vraagt.", "sub": "De betrokkene mag vragen wie die ontvangers zijn"}], "deep": {"url": "verdieping/inzage/index.html", "text": "de vier gevolgen één voor één, met de historiek van het recht op vergetelheid en de uitzonderingen op de wissing."}, "read": {"text": "Lees de voorwaarden en uitzonderingen in de artikelen 16 tot en met 19.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "De derde afdeling: ingrijpen op de gegevens zelf. Vier rechten, en ze volgen vaak op een inzage. Het eerste recht is de rectificatie: onjuiste gegevens laat je onverwijld verbeteren, onvolledige laat je aanvullen. Dit recht geldt altijd. Het tweede recht is de wissing, ook het recht op vergetelheid genoemd, en dat recht is niet absoluut. Het geldt in een lijst van gevallen: de gegevens zijn niet meer nodig, de toestemming is ingetrokken, er is bezwaar gemaakt, de verwerking was onrechtmatig, een wet verplicht tot wissen, of het gaat om een onlinedienst aan een kind. En het geldt niet wanneer de verwerking nodig is voor de vrijheid van meningsuiting, een wettelijke verplichting, de volksgezondheid, archivering of onderzoek, of een rechtsvordering. Het derde recht is de beperking, de pauzeknop: de gegevens blijven bewaard maar worden niet gebruikt, bijvoorbeeld zolang de juistheid wordt gecontroleerd. Een vierde manier van ingrijpen is de kennisgeving na doorgifte. Heb je de gegevens aan anderen doorgegeven, dan meld je elke rectificatie, wissing of beperking ook aan die ontvangers, tenzij dat onmogelijk is of onevenredig veel inspanning vraagt. Onthoud dus: verbeteren altijd, wissen in bepaalde gevallen, beperken als pauze, en de ontvangers verwittigen."}, {"id": 11, "type": "quote", "chip": "Afdeling 3 · overdraagbaarheid", "title": "Het recht op overdraagbaarheid: je gegevens meenemen, in een bruikbaar formaat", "source": "Artikel 20, lid 1 AVG", "quote": "De betrokkene heeft het recht de hem betreffende persoonsgegevens, die hij aan een verwerkingsverantwoordelijke heeft verstrekt, in een gestructureerde, gangbare en machineleesbare vorm te verkrijgen, en hij heeft het recht die gegevens aan een andere verwerkingsverantwoordelijke over te dragen, zonder daarbij te worden gehinderd door de verwerkingsverantwoordelijke aan wie de persoonsgegevens waren verstrekt, indien:\na) de verwerking berust op toestemming uit hoofde van artikel 6, lid 1, punt a), of artikel 9, lid 2, punt a), of op een overeenkomst uit hoofde van artikel 6, lid 1, punt b); en\nb) de verwerking via geautomatiseerde procedés wordt verricht.", "bullets": [{"k": "Wat", "t": "de gegevens die de betrokkene zelf heeft verstrekt, in een gestructureerde, gangbare en machineleesbare vorm, en het recht om ze aan een andere organisatie over te dragen, als het technisch mogelijk is rechtstreeks."}, {"k": "Alleen eigen gegevens", "t": "het recht slaat op wat de betrokkene zelf heeft verstrekt, niet op wat de organisatie daaruit heeft afgeleid; de voorwaarden waaronder het geldt, zoek je op de volgende slide zelf op."}, {"k": "In de praktijk", "t": "grote platformen lossen dit op met een zelfbedieningsruimte: de gebruiker downloadt zijn gegevens zelf of stuurt ze rechtstreeks naar een andere dienst."}], "deep": {"url": "verdieping/overdraagbaarheid/index.html", "text": "hoe het recht in de praktijk werkt, met het voorbeeld van een groot platform, en waarom het zo vaak met inzage wordt verward."}, "read": {"text": "Lees artikel 20 volledig, inclusief de leden 3 en 4.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Het laatste recht in deze afdeling is de overdraagbaarheid. De betrokkene mag de gegevens die hij zelf aan een organisatie heeft gegeven, terugkrijgen in een gestructureerde, gangbare en machineleesbare vorm, en ze aan een andere organisatie overdragen, als het technisch kan zelfs rechtstreeks. Denk aan wie overstapt van muziekdienst, van bank of van sociaal netwerk, en zijn gegevens wil meenemen. Het recht geldt alleen voor wat de betrokkene zelf heeft verstrekt, niet voor wat de organisatie daaruit heeft afgeleid. Het is ook het eerste recht dat duidelijk niet altijd geldt. Onder welke voorwaarden het wél geldt, lees je op de volgende slide zelf na in de tekst van de verordening. De grote platformen hebben dit recht opgelost met een ruimte waar de gebruiker zijn gegevens zelf downloadt of naar een andere dienst stuurt; de verdieping toont hoe. Onthoud dus: meenemen wat je zelf gaf, in een bruikbaar formaat."}, {"id": 12, "type": "reveal", "chip": "Opdracht · zoek het zelf op", "title": "Wanneer geldt het recht op overdraagbaarheid? Lees het zelf na in de verordening", "question": "Zet de audio stil, open de verordening via de knop onderaan en zoek in de derde afdeling van hoofdstuk III het artikel over het recht op overdraagbaarheid. Lees het eerste lid. Bij welke rechtsgronden geldt dit recht, en aan welke tweede voorwaarde moet de verwerking voldoen?", "verdict": "Alleen bij toestemming of overeenkomst, en alleen bij een geautomatiseerde verwerking", "answer": [{"k": "De rechtsgronden", "t": "het artikel verwijst uitdrukkelijk naar twee rechtsgronden: de toestemming en de overeenkomst. Bij een wettelijke verplichting, een taak van algemeen belang of een gerechtvaardigd belang geldt het recht niet; het geldt dus bijvoorbeeld niet tegenover een gemeente."}, {"k": "De tweede voorwaarde", "t": "de verwerking moet via geautomatiseerde procedés gebeuren; papieren dossiers vallen erbuiten."}, {"k": "Het patroon", "t": "of een recht geldt, hangt soms af van de rechtsgrond, en dat staat altijd in het artikel zelf: lees de eerste zin of de opsomming van voorwaarden. Dit patroon komt meteen terug bij het recht van bezwaar."}], "read": {"text": "Open de verordening en zoek het artikel over het recht op overdraagbaarheid van gegevens in afdeling 3 van hoofdstuk III.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Nu een opdracht, om het zelf te ontdekken. Zet de audio stil, open de verordening via de knop op de slide, en zoek in de derde afdeling van het hoofdstuk het artikel over het recht op overdraagbaarheid. Lees het eerste lid en beantwoord twee vragen. Bij welke rechtsgronden geldt dit recht? En aan welke tweede voorwaarde moet de verwerking voldoen? Neem er even de tijd voor. … Het antwoord staat letterlijk in de tekst. Het recht geldt alleen wanneer de verwerking berust op toestemming of op een overeenkomst. Bij een wettelijke verplichting, een taak van algemeen belang of een gerechtvaardigd belang bestaat het dus niet, en daarom geldt het bijvoorbeeld niet tegenover een gemeente. De tweede voorwaarde is dat de verwerking via geautomatiseerde procedés gebeurt, dus niet voor papieren dossiers. Je ziet hier een patroon dat terugkomt: of een recht geldt, hangt soms af van de rechtsgrond, en dat lees je in het artikel zelf. Onthoud dus: twijfel je of een recht geldt, open dan de tekst en lees de voorwaarden; bij overdraagbaarheid zijn dat toestemming of contract, en een geautomatiseerde verwerking."}, {"id": 13, "type": "bullets", "chip": "Afdeling 4 · ingrijpen op de verwerking", "title": "Bezwaar en toestemming intrekken: rechten die aan een rechtsgrond vasthangen", "bullets": [{"k": "Bezwaar om redenen eigen aan je situatie", "t": "alleen tegen verwerkingen op grond van het algemeen belang of het gerechtvaardigd belang; de organisatie stopt, tenzij ze dwingende gerechtvaardigde gronden aantoont die zwaarder wegen, of de gegevens nodig heeft voor een rechtsvordering."}, {"k": "Bezwaar tegen direct marketing", "t": "altijd en zonder afweging: de verwerking voor marketing stopt; dit recht moet bij het eerste contact uitdrukkelijk en apart worden vermeld."}, {"k": "Toestemming intrekken", "t": "geen recht uit hoofdstuk III maar uit de voorwaarden voor toestemming: te allen tijde, even eenvoudig als het geven, zonder gevolgen voor wat ervóór gebeurde."}, {"k": "Waarom de koppeling aan de rechtsgrond", "t": "bij het gerechtvaardigd belang heeft de organisatie zelf een afweging gemaakt; het bezwaar laat de betrokkene die afweging voor zijn situatie betwisten. Bij een wettelijke verplichting of een contract is er niets af te wegen."}, {"k": "Hoe je dat terugvindt", "t": "lees de eerste zin van het artikel: daar staat op welke rechtsgronden het recht slaat. Twijfel je, dan zoek je het artikel op en lees je het zelf."}], "deep": {"url": "verdieping/bezwaar/index.html", "text": "het recht van bezwaar in detail: de twee varianten, de belangenafweging, en hoe je in de verordening zelf terugvindt bij welke rechtsgrond een recht hoort."}, "read": {"text": "Lees de eerste zin van artikel 21, lid 1: daar staan de rechtsgronden waarop het bezwaar slaat. Het intrekken van toestemming staat in artikel 7, lid 3.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "De vierde afdeling gaat over het ingrijpen op de verwerking. Het eerste recht is het recht van bezwaar, en hier wordt het patroon van daarnet de regel: dit recht hangt vast aan de rechtsgrond. Bezwaar om redenen eigen aan je situatie kan alleen tegen een verwerking op grond van het algemeen belang of het gerechtvaardigd belang. Waarom is dat zo? Omdat de organisatie bij die twee rechtsgronden zelf een afweging heeft gemaakt, voor iedereen samen. Het bezwaar laat één persoon die afweging voor zijn eigen situatie betwisten. De organisatie stopt, tenzij ze dwingende gronden aantoont die zwaarder wegen. Bij een wettelijke verplichting of een contract bestaat dat recht niet, want daar valt niets af te wegen. De tweede variant is het bezwaar tegen direct marketing, en daar is geen afweging nodig: de marketing stopt. Daarom staat onder elke reclamemail een uitschrijflink. Het intrekken van toestemming staat niet in dit hoofdstuk maar bij de voorwaarden voor toestemming: te allen tijde, even eenvoudig als het geven. Hoe vind je dat terug? Je leest de eerste zin van het artikel, want daar staat op welke rechtsgronden het recht slaat. Onthoud dus: bezwaar hoort bij algemeen belang en gerechtvaardigd belang, en de eerste zin van het artikel zegt het."}, {"id": 14, "type": "quote", "chip": "Afdeling 4 · geautomatiseerde besluiten", "title": "Niet onderworpen aan een besluit dat uitsluitend door een machine wordt genomen", "source": "Artikel 22, lid 1 AVG", "quote": "De betrokkene heeft het recht niet te worden onderworpen aan een uitsluitend op geautomatiseerde verwerking, waaronder profilering, gebaseerd besluit waaraan voor hem rechtsgevolgen zijn verbonden of dat hem anderszins in aanmerkelijke mate treft.", "bullets": [{"k": "Drie voorwaarden", "t": "een besluit; uitsluitend gebaseerd op geautomatiseerde verwerking, zonder betekenisvolle menselijke tussenkomst; met rechtsgevolgen of een aanmerkelijke impact, zoals een geweigerde lening, een afgewezen sollicitatie of een hogere premie."}, {"k": "Drie uitzonderingen", "t": "noodzakelijk voor een overeenkomst, toegestaan bij wet met passende waarborgen, of op basis van uitdrukkelijke toestemming."}, {"k": "De waarborgen", "t": "bij contract en toestemming ten minste: het recht op menselijke tussenkomst, het recht om je standpunt kenbaar te maken en het recht om het besluit aan te vechten."}, {"k": "Waarom dit nu telt", "t": "AI maakt besluiten zonder mens goedkoop en gewoon; het Hof van Justitie oordeelde in de zaak SCHUFA (C-634/21) dat ook een kredietscore die een bank doorslaggevend volgt, zo'n besluit is."}], "deep": {"url": "verdieping/besluiten/index.html", "text": "het artikel lid per lid, de rechtspraak over kredietscores, en wat het betekent voor organisaties die AI inzetten."}, "read": {"text": "Lees artikel 22 volledig: het verbod, de drie uitzonderingen, de waarborgen en de regel voor bijzondere categorieën. Arrest van het Hof van Justitie van 7 december 2023, SCHUFA Holding (C-634/21).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, {"url": "https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:62021CJ0634", "label": "Arrest SCHUFA (C-634/21)"}]}, "script": "Het tweede recht in deze afdeling leek lang een slapend artikel, tot kunstmatige intelligentie het in het midden van de aandacht zette. Lees de tekst op de slide. De betrokkene heeft het recht niet onderworpen te worden aan een besluit dat uitsluitend op geautomatiseerde verwerking is gebaseerd en hem aanmerkelijk treft. Daar zitten drie voorwaarden in. Er moet een besluit zijn. Een machine moet dat besluit alleen nemen, zonder dat een mens er betekenisvol naar kijkt. En het besluit moet de persoon echt raken, zoals een geweigerde lening of een automatisch afgewezen sollicitatie. Op het verbod bestaan drie uitzonderingen: het besluit is nodig voor een overeenkomst, een wet laat het toe en voorziet in waarborgen, of de betrokkene heeft uitdrukkelijk toegestemd. Bij de uitzonderingen voor contract en toestemming gelden bovendien waarborgen: de betrokkene heeft recht op menselijke tussenkomst, hij kan zijn standpunt geven, en hij kan het besluit aanvechten. Waarom telt dit artikel nu zo? Omdat kunstmatige intelligentie besluiten zonder mens goedkoop en gewoon maakt. En het Hof van Justitie oordeelde in de zaak SCHUFA dat ook een kredietscore die een bank doorslaggevend volgt, al zo'n besluit is, zodat ook het scoringsbureau eronder valt. Onthoud dus: een machine mag niet alleen beslissen over iets wat je echt raakt, tenzij wet, contract of uitdrukkelijke toestemming het toelaat, en dan met een mens die je kunt aanspreken."}, {"id": 15, "type": "reveal", "chip": "Denkoefening 2", "title": "Drie verzoeken, drie rechten?", "question": "Drie situaties. Eén: een patiënt vraagt het ziekenhuis om haar volledige dossier te wissen, omdat ze van ziekenhuis verandert. Twee: een klant van een energieleverancier maakt bezwaar tegen de maandelijkse facturatie van zijn verbruik. Drie: een inwoner vraagt de gemeente zijn gegevens in een machineleesbaar formaat, om ze naar een andere gemeente mee te nemen. Welk recht is telkens van toepassing, en is het verzoek gegrond?", "verdict": "Drie keer een bestaand recht, drie keer niet van toepassing in deze situatie", "answer": [{"k": "Het dossier wissen", "t": "het recht op wissing bestaat, maar de verwerking is nodig voor een wettelijke verplichting en voor de volksgezondheid: een patiëntendossier moet wettelijk bewaard blijven. Wel kan ze inzage en een kopie vragen om mee te nemen."}, {"k": "Bezwaar tegen de facturatie", "t": "bezwaar kan alleen tegen een verwerking op grond van algemeen belang of gerechtvaardigd belang; de facturatie steunt op het contract en op een wettelijke verplichting. Het bezwaar is dus niet van toepassing; een fout in de factuur is een rectificatie."}, {"k": "Gegevens meenemen van de gemeente", "t": "overdraagbaarheid geldt niet voor een verwerking in het kader van een taak van algemeen belang of openbaar gezag; de gemeente verwerkt op die grond. Hij kan wel inzage vragen, en de verhuizing zelf regelt de overdracht via het Rijksregister."}], "script": "Tweede denkoefening, over de vraag wanneer een recht niet van toepassing is. Drie situaties. Eén: een patiënt vraagt het ziekenhuis haar volledige dossier te wissen, omdat ze van ziekenhuis verandert. Twee: een klant van een energieleverancier maakt bezwaar tegen de maandelijkse facturatie van zijn verbruik. Drie: een inwoner vraagt de gemeente zijn gegevens in een machineleesbaar formaat, om ze mee te nemen naar een andere gemeente. Welk recht wordt ingeroepen, en is het verzoek gegrond? Denk even na. … Drie keer bestaat het recht, en drie keer geldt het hier niet. De patiënt vraagt wissing, maar een patiëntendossier moet wettelijk bewaard blijven: de uitzonderingen voor een wettelijke verplichting en de volksgezondheid gelden. Ze kan wel inzage en een kopie vragen en die meenemen. De energieklant maakt bezwaar, maar de facturatie steunt op het contract en op een wettelijke verplichting, niet op algemeen of gerechtvaardigd belang. Een fout in de factuur is een rectificatie. En de inwoner vraagt overdraagbaarheid, maar dat recht geldt niet voor een taak van algemeen belang of openbaar gezag, en dat is wat een gemeente doet. Onthoud dus: eerst welk recht, dan of het in deze situatie geldt, en dat lees je in het artikel zelf."}, {"id": 16, "type": "quote", "chip": "Afdeling 5 · beperkingen", "title": "Een wet mag de rechten beperken, maar alleen onder strikte voorwaarden", "source": "Artikel 23, lid 1 AVG (aanhef)", "quote": "De reikwijdte van de verplichtingen en rechten als bedoeld in de artikelen 12 tot en met 22 en artikel 34, alsmede in artikel 5 kan, voor zover de bepalingen van die artikelen overeenstemmen met de rechten en verplichtingen als bedoeld in de artikelen 12 tot en met 20, worden beperkt door middel van Unierechtelijke of lidstaatrechtelijke bepalingen die op de verwerkingsverantwoordelijke of de verwerker van toepassing zijn, op voorwaarde dat die beperking de wezenlijke inhoud van de grondrechten en fundamentele vrijheden onverlet laat en in een democratische samenleving een noodzakelijke en evenredige maatregel is ter waarborging van:", "bullets": [{"k": "De logica", "t": "sommige rechten botsen met andere belangen: wie een fiscaal onderzoek voert of een verdachte transactie meldt, kan de betrokkene niet tegelijk alles laten inzien. Dan mag de wetgever de rechten beperken."}, {"k": "De voorwaarden", "t": "alleen bij wet, met respect voor de kern van de grondrechten, noodzakelijk en evenredig, en voor een van de opgesomde doelen: veiligheid, strafvervolging, belangrijke economische of financiële belangen, toezicht, de bescherming van anderen."}, {"k": "Wat de wet moet bevatten", "t": "specifieke bepalingen over het doel, de categorieën van gegevens, de reikwijdte van de beperking, de waarborgen, de bewaartermijnen, de risico's en het recht om van de beperking op de hoogte te worden gesteld."}, {"k": "Belgische voorbeelden", "t": "de wet over de gegevensverwerking door de FOD Financiën beperkt het inzagerecht zolang iemand het voorwerp is van een controle of onderzoek; de antiwitwaswet verbiedt een bank te laten weten dat ze een verdachte transactie heeft gemeld."}], "deep": {"url": "verdieping/beperkingen/index.html", "text": "de rationale van de beperkingen aan de hand van concrete voorbeelden, en wat de wetgever in zo'n wet moet opnemen."}, "read": {"text": "Lees de lijst van doelen in artikel 23, lid 1, en de inhoudsvereisten voor de wet in lid 2.", "url": "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open de AVG op EUR-Lex"}, "script": "Tot slot de vijfde afdeling: de beperkingen. Dit artikel leggen we niet in detail uit, maar de logica moet je begrijpen. Sommige rechten botsen met andere belangen. De belastingadministratie onderzoekt een vermoeden van fraude: als de belastingplichtige op dat moment inzage krijgt in wat de administratie al weet, is het onderzoek waardeloos. Een bank meldt een verdachte transactie: als de klant via zijn inzagerecht verneemt dat hij gemeld is, verdwijnt het geld. Daarom mag de wetgever de rechten beperken. Maar de voorwaarden zijn strikt. De beperking kan alleen bij wet, ze moet de kern van de grondrechten respecteren, ze moet noodzakelijk en evenredig zijn, en ze mag alleen een van de opgesomde doelen dienen: nationale veiligheid, strafvervolging, belangrijke economische of financiële belangen zoals belastingen, toezicht, de bescherming van anderen. En die wet mag niet vaag zijn: ze zegt voor welk doel, welke gegevens, hoe ver de beperking reikt, welke waarborgen er zijn, en of de betrokkene ervan op de hoogte wordt gebracht. Een wetgever die een recht wil beperken, verwijst dus uitdrukkelijk naar deze bepaling en neemt die inhoud op. Twee Belgische voorbeelden staan op de slide; de verdieping bekijkt ze van dichterbij. Onthoud dus: beperken kan, maar alleen bij wet, voor een opgesomd doel, en met een wet die precies zegt wat ze doet."}, {"id": 17, "type": "summary", "chip": "Samenvatting", "title": "Wat je meeneemt", "key": "Hoofdstuk III laat de betrokkene zelf controleren en afdwingen wat de beginselen beloven: informatie is het startpunt, inzage en overdraagbaarheid geven de gegevens in handen, bezwaar en het verbod op louter geautomatiseerde besluiten grijpen in op de verwerking, en rectificatie, wissing en beperking zijn de gevolgen; elk verzoek volgt dezelfde spelregels, en alleen een wet kan die rechten beperken.", "bullets": [{"k": "De spelregels", "t": "begrijpelijk, gemakkelijk, binnen de maand, gratis, en bij weigering met uitleg en verwijzing naar de toezichthouder."}, {"k": "De samenhang", "t": "informatie als startpunt; twee groepen rechten; rectificatie, wissing en beperking als gevolgen; de ontvangers verwittigd."}, {"k": "Wanneer een recht niet geldt", "t": "lees de eerste zin van het artikel: bezwaar en overdraagbaarheid hangen aan de rechtsgrond, wissing kent uitzonderingen, en wie niemand kan identificeren, moet niet alles toekennen."}, {"k": "De grenzen", "t": "een wet mag rechten beperken, maar alleen voor opgesomde doelen en met een precieze inhoud; geautomatiseerde besluiten vragen een mens die je kunt aanspreken."}], "script": "Wat neem je mee? Eén kernzin: dit hoofdstuk laat de betrokkene zelf controleren en afdwingen wat de beginselen beloven. Informatie is het startpunt, inzage en overdraagbaarheid geven de gegevens in handen, bezwaar en het verbod op louter geautomatiseerde besluiten grijpen in op de verwerking, en rectificatie, wissing en beperking zijn de gevolgen. Daarnaast onthoud je vier dingen. De spelregels: begrijpelijk, gemakkelijk, binnen de maand, gratis, en bij weigering uitleg. De samenhang: het startpunt, de twee groepen en de gevolgen. Wanneer een recht niet geldt: lees de eerste zin van het artikel. En de grenzen: alleen een wet mag de rechten beperken, voor opgesomde doelen en met een precieze inhoud. Terug naar de webshop: die twee zinnen waren een inzageverzoek en een wissingsverzoek. Binnen de maand had de klant een kopie moeten krijgen, en een antwoord op de vraag of wissen kon, bijvoorbeeld niet voor de facturen die de wet verplicht te bewaren. Voor je naar de oefenvragen gaat, één opdracht. Zet de audio stil en zoek op hoe iemand in jouw organisatie een verzoek kan indienen, en wie het binnen de maand beantwoordt. Vind je dat niet in twee minuten, dan vindt de betrokkene het ook niet. Bij elk recht staat een knop naar een korte verdieping; kies wat voor jou telt. Daarna zijn er tien vragen."}], "quiz": [{"q": "Waarom begint de samenhang tussen de rechten van de betrokkene bij het recht op informatie?", "options": ["Omdat het recht op informatie het enige recht is dat voor alle rechtsgronden geldt, ook bij een overheid.", "Omdat de informatieplicht de enige verplichting is die de toezichthouder kan controleren.", "Omdat de betrokkene pas na de informatie toestemming kan geven voor de verwerking.", "Omdat wie niet weet dat er een verwerking is, geen ander recht kan uitoefenen."], "answer": 3, "feedback": ["Ook andere rechten, zoals inzage en rectificatie, gelden ongeacht de rechtsgrond; dat is niet de reden.", "De toezichthouder kan alle verplichtingen controleren; de volgorde heeft met de logica van de rechten te maken.", "Toestemming is maar één rechtsgrond; de informatieplicht geldt bij elke rechtsgrond.", "Juist. Informatie is het startpunt: zonder te weten dat er een verwerking is, kan niemand inzage vragen, bezwaar maken of wissing vragen."]}, {"q": "Een organisatie ontvangt een inzageverzoek op 3 maart. Het verzoek is omvangrijk. Wat mag ze doen?", "options": ["Uiterlijk op 3 april melden dat de termijn met twee maanden wordt verlengd, en waarom.", "Antwoorden zodra het intern mogelijk is, zolang dat binnen drie maanden na ontvangst gebeurt.", "Het verzoek weigeren omdat omvangrijke verzoeken als buitensporig gelden.", "Een vergoeding vragen voor de administratieve kosten vooraleer te antwoorden."], "answer": 0, "feedback": ["Juist. Bij complexe of talrijke verzoeken is een verlenging met twee maanden mogelijk, mits de betrokkene binnen de eerste maand wordt geïnformeerd.", "De basistermijn is één maand; drie maanden is alleen mogelijk na een gemotiveerde verlenging die binnen de eerste maand wordt meegedeeld.", "Omvang alleen maakt een verzoek niet kennelijk ongegrond of buitensporig; dat vereist bijvoorbeeld een repetitief karakter, en de organisatie moet het aantonen.", "Een eerste verzoek is kosteloos; alleen bij kennelijk ongegronde of buitensporige verzoeken of bijkomende kopieën mag iets worden aangerekend."]}, {"q": "Waarom staat de bepaling over verwerkingen waarvoor identificatie niet vereist is, vóór het hoofdstuk over de rechten van de betrokkene en niet erin?", "options": ["Omdat ze alleen geldt voor overheden, die niet onder het hoofdstuk over de rechten van de betrokkene vallen.", "Omdat ze de toestemming regelt, die bij de rechtsgronden thuishoort.", "Omdat ze een gevolg is van minimale gegevensverwerking en geen recht.", "Omdat ze alleen van toepassing is op gepseudonimiseerde gegevens voor onderzoek."], "answer": 2, "feedback": ["De bepaling geldt voor elke verwerkingsverantwoordelijke, niet alleen voor overheden.", "De bepaling gaat niet over toestemming maar over de identificatie van de betrokkene.", "Juist. Wie voor zijn doel geen identificatie nodig heeft, moet geen extra identificerende gegevens bijhouden; dat is een beginsel, met als gevolg dat bepaalde rechten niet gelden.", "Ze geldt voor elke verwerking waarbij de organisatie de betrokkene niet kan identificeren, niet alleen bij onderzoek."]}, {"q": "Een vereniging koopt een adressenlijst om een mailing te versturen. Wanneer moet ze de mensen op die lijst ten laatste informeren?", "options": ["Pas wanneer iemand van de lijst zelf om informatie vraagt.", "Uiterlijk op het moment van het eerste contact, dus bij de mailing zelf.", "Binnen drie maanden na de aankoop van de lijst, bij een volgende mailing.", "Niet, want de verkoper van de lijst heeft de mensen al geïnformeerd."], "answer": 1, "feedback": ["De informatieplicht is proactief; de organisatie wacht niet tot iemand vraagt.", "Juist. De gegevens komen niet van de betrokkene en worden gebruikt om te communiceren; dan is het moment uiterlijk het eerste contact.", "De uiterste termijn is één maand na verkrijging, en bij communicatie het eerste contact; drie maanden is te laat.", "De verkoper heeft hoogstens over zijn eigen verwerking geïnformeerd; de vereniging moet over haar eigen verwerking informeren, tenzij de betrokkene die informatie al heeft."]}, {"q": "Wat omvat het recht van inzage?", "options": ["Alleen een bevestiging dat de organisatie gegevens over de betrokkene verwerkt, zonder de gegevens zelf.", "De gegevens in een machineleesbaar formaat om ze naar een andere organisatie over te dragen.", "Een lijst van alle medewerkers die de gegevens ooit hebben geraadpleegd.", "Uitsluitsel, de gegevens zelf, de context van de verwerking en een kopie."], "answer": 3, "feedback": ["Uitsluitsel is maar de eerste laag; daarna volgen de gegevens zelf, de context en de kopie.", "Dat is het recht op overdraagbaarheid, een ander recht met eigen voorwaarden.", "De betrokkene heeft recht op de ontvangers of categorieën van ontvangers, niet op een logboek van alle interne raadplegingen.", "Juist. Drie lagen plus een kopie: ja of nee, de gegevens, de context (doeleinden, ontvangers, bewaartermijn, bron, geautomatiseerde besluitvorming) en een kopie."]}, {"q": "Wat is het verschil tussen wissing en beperking van de verwerking?", "options": ["Bij wissing verdwijnen de gegevens; bij beperking blijven ze staan maar worden ze niet gebruikt.", "Wissing geldt voor digitale gegevens, beperking voor papieren dossiers en archieven die niet digitaal zijn.", "Wissing kan alleen de betrokkene vragen, beperking kan alleen de toezichthouder opleggen na een klacht.", "Er is geen verschil: beperking is de term voor een gedeeltelijke wissing."], "answer": 0, "feedback": ["Juist. Beperking is de pauzeknop: de gegevens blijven staan, bijvoorbeeld tijdens de controle van de juistheid of tijdens een bezwaar, maar worden niet verder verwerkt.", "Beide rechten gelden voor elke drager.", "Beide rechten komen de betrokkene toe.", "Het zijn twee verschillende rechten met verschillende gevolgen."]}, {"q": "Een klant maakt bezwaar tegen het bijhouden van zijn gegevens door zijn bank voor de uitvoering van zijn rekeningcontract. Wat is de juiste reactie?", "options": ["Het bezwaar inwilligen en de verwerking stopzetten, want het recht van bezwaar geldt altijd en bij elke rechtsgrond.", "Het bezwaar inwilligen, maar alleen voor de gegevens die de klant zelf aan de bank heeft verstrekt bij het openen van de rekening.", "Uitleggen dat bezwaar niet geldt bij een verwerking op grond van een overeenkomst, en wijzen op de rechten die wel gelden.", "Het bezwaar doorsturen naar de toezichthouder, die binnen de maand beslist of het bezwaar gegrond is of niet."], "answer": 2, "feedback": ["Bezwaar om redenen eigen aan je situatie geldt alleen tegen verwerkingen op grond van algemeen belang of gerechtvaardigd belang.", "Die beperking hoort bij overdraagbaarheid, niet bij bezwaar.", "Juist. Het bezwaar is hier niet van toepassing; de bank legt dat binnen de maand uit en wijst op inzage, rectificatie en de klachtmogelijkheid.", "De organisatie beantwoordt het verzoek zelf; de betrokkene kan daarna klacht indienen als hij het niet eens is."]}, {"q": "Wanneer is het recht op overdraagbaarheid van toepassing?", "options": ["Bij elke verwerking van persoonsgegevens, ongeacht de rechtsgrond of de manier van verwerken.", "Alleen bij toestemming of overeenkomst, en als de verwerking geautomatiseerd is.", "Alleen bij verwerkingen door overheden in het kader van hun wettelijke taken van algemeen belang.", "Alleen wanneer de betrokkene eerst inzage heeft gevraagd en een kopie van zijn gegevens heeft gekregen."], "answer": 1, "feedback": ["Het recht is uitdrukkelijk beperkt tot twee rechtsgronden en tot geautomatiseerde verwerking.", "Juist. Toestemming of overeenkomst, geautomatiseerde verwerking, en alleen de gegevens die de betrokkene zelf heeft verstrekt.", "Integendeel: het recht geldt niet voor een taak van algemeen belang of openbaar gezag.", "Overdraagbaarheid is een zelfstandig recht; inzage is geen voorwaarde."]}, {"q": "Een webshop wijst een bestelling automatisch af op basis van een kredietscore van een extern bureau, zonder dat iemand ernaar kijkt. Wat zegt de AVG daarover?", "options": ["Dat mag altijd, zolang de webshop de klant achteraf informeert over het besluit en de kredietscore.", "Dat mag nooit, want geautomatiseerde besluiten zijn in de verordening volledig verboden.", "Dat is alleen een probleem voor het kredietbureau dat de score berekent, niet voor de webshop.", "Dat mag alleen bij een van de drie uitzonderingen, met waarborgen zoals menselijke tussenkomst."], "answer": 3, "feedback": ["Informeren achteraf volstaat niet; het recht om niet onderworpen te worden aan zo'n besluit vereist een uitzondering en waarborgen.", "Het is geen absoluut verbod: er zijn drie uitzonderingen.", "Volgens het Hof van Justitie valt ook het scoringsbureau eronder, maar de webshop die het besluit neemt zeker ook.", "Juist. Een besluit dat uitsluitend geautomatiseerd is en de persoon aanmerkelijk treft, is alleen toegelaten in de drie uitzonderingen, met ten minste menselijke tussenkomst, het recht om een standpunt te geven en het recht om het besluit aan te vechten."]}, {"q": "Onder welke voorwaarden mag een wet de rechten van de betrokkene beperken?", "options": ["Als de wet de kern van de grondrechten respecteert, noodzakelijk en evenredig is, en een opgesomd doel dient.", "Als de regering dat nodig vindt, bij koninklijk besluit en voor elk doel dat zij zelf bepaalt.", "Als de toezichthouder de beperking vooraf schriftelijk heeft goedgekeurd in een advies.", "Als de betrokkene met de beperking heeft ingestemd bij het sluiten van het contract of het aanmaken van een account."], "answer": 0, "feedback": ["Juist. Alleen bij wet, met respect voor de kern van de grondrechten, noodzakelijk en evenredig, voor een opgesomd doel, en met specifieke bepalingen over doel, gegevens, reikwijdte, waarborgen en bewaartermijnen.", "Een beperking vereist een wettelijke bepaling, voor een van de opgesomde doelen; een vrije keuze van de regering volstaat niet.", "De toezichthouder adviseert over zulke wetten, maar een goedkeuring is geen voorwaarde uit de verordening.", "Rechten van de betrokkene kunnen niet contractueel worden weggenomen; alleen een wet kan ze beperken."]}], "avatar": {"dir": "https://peterberghmans.github.io/lessen-dpi/media/les8-nl", "label": "AI-avatar", "only": [1, 3, 17]}}</script>

          return '<td>'+(rl.url?'<a class="tlink" target="_blank" rel="noopener" href="'+esc(rl.url)+'">'+esc(c)+' <span aria-hidden="true">↗</span></a>':esc(c))+(rl.rec&&RS.length?'<button class="recchip" data-rect="'+rl.rec.t+'" data-recv="'+esc(rl.rec.v||'')+'" title="'+esc(U.rec_btn_text||'')+'">▶ '+recShort(rl.rec.v)+hms(rl.rec.t)+'</button>':'')+'</td>'; }).join('')+'</tr>').join('')+'</tbody></table>'+(s.rowlinks?'<p class="tbl-hint">'+esc(U.tbl_hint||'')+'</p>':''); break;
      case 'pointers':
        /* s.items: [{t, end, k, t2}] -> sprongknoppen naar de opname */
        body = (s.intro?'<p class="lead">'+esc(s.intro)+'</p>':'')+'<div class="pointers">'+s.items.map(p=>'<div class="pt"><b>'+esc(p.k)+'</b><span>'+esc(p.d||'')+'</span><button class="btn" data-rect="'+p.t+'" data-recv="'+esc(p.v||'')+'">▶ '+esc(U.rec_jump||'Bekijk')+'<small>'+recShort(p.v)+hms(p.t)+(p.end?' · ± '+Math.max(1,Math.round((p.end-p.t)/60))+' min':'')+'</small></button></div>').join('')+'</div>'; break;
      case 'figure': {
        /* s.svg: inline svg (vertrouwde, zelf gegenereerde inhoud); s.caption; optioneel s.bullets of s.question/verdict/answer (denkoefening naast de figuur) */
        let side = '';
        if(s.question){ side = '<div class="reveal"><div class="q"><b>'+esc(U.reveal_question)+'</b>'+esc(s.question)+'</div><button class="btn" id="btn-reveal">'+esc(U.reveal_show)+'</button><div class="ans hidden" id="reveal-ans"><span class="verdict">'+esc(s.verdict)+'</span>'+bullets(s.answer)+'</div></div>'; }
        else if(s.bullets){ side = bullets(s.bullets); }
        body = '<div class="figure'+(s.question?' stack':(side?' with-side':''))+'"><div><div class="fig">'+s.svg+'</div>'+(s.caption?'<div class="caption">'+esc(s.caption)+'</div>':'')+'</div>'+(side?'<div class="side">'+side+'</div>':'')+'</div>';
        break; }
    }
    const pnav = s.nav ? '<div class="pnav">'+s.nav.items.map((t,n)=>'<span class="'+(n===s.nav.active?'on':(n<s.nav.active?'done':''))+'">'+esc(t)+'</span>').join('')+'</div>' : '';
    return '<div class="slide"><div class="decor"></div>'+chip+'<h2>'+esc(s.title)+'</h2>'+pnav+'<div class="body">'+body+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.read?'<div class="readmore"><span>'+esc(s.read.text)+'</span>'+(s.read.links||[{url:s.read.url,label:s.read.label}]).map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label||U.read_label||'EUR-Lex')+' ↗</a>').join('')+'</div>':'')+(s.rec&&RS.length?'<div class="readmore rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+s.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')+(s.deep?'<div class="readmore deep"><span><span class="lbl">'+esc(U.deep_label||'Verdieping')+'</span> · '+esc(s.deep.text||'')+'</span><a class="btn" href="'+esc(s.deep.url)+'?back='+(S.indexOf(s)+1)+'">'+esc(s.deep.label||U.deep_btn||'Open de verdieping')+' ›</a></div>':'')+'</div></div>';
  }
  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    if(C.profiles && !PROFILE){ show('intro'); return; }
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;

    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    if(q.context){ $('q-ctx').innerHTML = (U.q_ctx_label?'<span class="ctx-k">'+esc(U.q_ctx_label)+'</span>':'')+esc(q.context); $('q-ctx').classList.remove('hidden'); } else { $('q-ctx').classList.add('hidden'); $('q-ctx').innerHTML=''; }
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');

  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;

    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n])
      + (q.key?'<div class="fb-key"><b>'+esc(U.q_key_label||'À retenir')+' —</b>'+esc(q.key)+'</div>':'')
      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});

    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');

  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
